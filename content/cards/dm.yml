# Карточки раздела dm (дискретная математика и комбинаторика). Источник: docs/COURSE_MAP.md.
dm.count:
  t: 'Правила суммы и произведения'
  goal: 'Умею выбирать между правилом суммы («или») и правилом произведения («и затем»)'
  pre: [pre.sets]
  g: [sum-rule, product-rule]
  k: [num, mc, spot]
  e: [dm.count.add-for-mul, dm.count.mul-for-add]
  n: 6
  note: 'Только непересекающиеся множества. Формулу включений-исключений не вводить.'

dm.perm:
  t: 'Перестановки, размещения, сочетания'
  goal: 'Умею отличать размещения от сочетаний и считать перестановки с одинаковыми элементами'
  pre: [dm.count, pre.sets]
  g: [permutations, combinations]
  k: [num, mc, spot]
  e: [dm.perm.order, dm.perm.repeat]
  n: 6
  note: 'Повторения только в виде одинаковых элементов в перестановках. Сочетания с повторениями — в dm.stars.'

dm.binom:
  t: 'Бином Ньютона, треугольник Паскаля, тождества'
  goal: 'Умею находить коэффициент в разложении $(1+ax)^n$ и пользоваться тождеством Паскаля'
  pre: [dm.perm, dm.count, pre.sum, pre.func, pre.sets]
  g: [binomial-theorem]
  k: [num, mc, spot]
  e: [dm.binom.freshman, dm.binom.index]
  n: 6
  note: 'Только натуральные степени. Обобщённый бином и производящие функции не вводить.'

dm.stars:
  t: 'Сочетания с повторениями, «шары и перегородки»'
  goal: 'Умею считать выборки с повторениями без учёта порядка и отличаю их от размещений с повторениями'
  pre: [dm.perm, dm.count, pre.sets]
  g: [stars-bars]
  k: [num, mc, spot]
  e: [dm.stars.arr, dm.stars.formula]
  n: 6
  note: 'Только неотрицательные решения уравнения $x_1+\dots+x_n=k$. Ограничения на переменные не вводить.'

dm.incl:
  t: 'Формула включений–исключений'
  goal: 'Умею считать размер объединения двух и трёх множеств и число элементов вне всех множеств'
  pre: [dm.perm, dm.count, pre.sets]
  g: [inclusion-exclusion]
  k: [num, mc, spot]
  e: [dm.incl.double, dm.incl.triple]
  n: 6
  note: 'Не более трёх множеств. Задачи о беспорядках не вводить.'

dm.rec:
  t: 'Рекуррентные соотношения'
  goal: 'Умею вычислять члены последовательности по рекуррентной формуле и начальным значениям'
  pre: [lg.proof, lg.quant, lg.equiv, lg.impl, lg.prop, pre.sum, pre.func, pre.sets]
  g: [recurrence]
  k: [num, mc, spot]
  e: [dm.rec.init, dm.rec.index]
  n: 6
  note: 'Только вычисление членов и индексы. Характеристическое уравнение не вводить.'
