# Карточки раздела c1 (Анализ: одна переменная). Источник: docs/COURSE_MAP.md.
c1.lim:
  t: 'Предел функции, ε–δ, односторонние пределы'
  goal: 'Умею находить предел функции с устранимой неопределённостью и отличаю предел от значения в точке'
  pre: [c1.seq, lg.quant, pre.ineq, pre.graph, pre.func, pre.sets]
  g: [limit-of-function, one-sided-limit]
  w: [fplot]
  k: [num, mc, graph, spot]
  e: [c1.lim.value, c1.lim.onesided]
  n: 6
  note: 'Определение ε–δ дать готовым из глоссария; задач на доказательство нет. Бесконечные пределы не вводить.'

c1.cont:
  t: 'Непрерывность, разрывы, теорема о промежуточном значении'
  goal: 'Умею проверять непрерывность в точке и применять теорему о промежуточном значении к непрерывной функции'
  pre: [c1.lim, c1.seq, lg.quant, pre.ineq, pre.graph, pre.func, pre.sets]
  g: [continuity, discontinuity-types, intermediate-value]
  w: [fplot]
  k: [num, mc, graph, spot]
  e: [c1.cont.limit-only, c1.cont.ivt-nocont]
  n: 6
  note: 'Теорему об экстремуме упомянуть одной фразой, без задач. Равномерную непрерывность не вводить.'

c1.rules:
  t: 'Правила дифференцирования, таблица производных'
  goal: 'Умею дифференцировать суммы, произведения и частные элементарных функций'
  pre: [c1.der, c1.cont, c1.lim, c1.seq, lg.quant, pre.ineq, pre.graph, pre.func, pre.sets]
  g: [differentiation-rules, derivative-table]
  k: [num, mc, expr, spot]
  e: [c1.rules.product, c1.rules.quotient-order]
  n: 6
  note: 'Сложную функцию не вводить: это следующий урок. Таблицу дать готовой.'

c1.int:
  t: 'Первообразная, таблица интегралов'
  goal: 'Умею находить первообразную многочлена с начальным условием и не теряю константу'
  pre: [c1.rules, c1.der, c1.cont, c1.lim, c1.seq, lg.quant, pre.ineq, pre.graph, pre.func, pre.sets]
  g: [antiderivative, indefinite-integral]
  k: [num, mc, expr, spot]
  e: [c1.int.const, c1.int.product]
  n: 6
  note: 'Только степенные функции и многочлены. Замену переменной и интегрирование по частям не вводить.'

c1.chain:
  t: 'Производная сложной функции'
  goal: 'Умею дифференцировать сложную функцию и не забываю производную внутренней функции'
  pre: [c1.rules, c1.der, c1.cont, c1.lim, pre.func]
  g: [chain-rule]
  k: [num, mc, expr, spot]
  e: [c1.chain.inner]
  n: 6
  note: 'Только степенные, показательные и синус/косинус от линейной или квадратичной внутренней функции. Неявные функции не вводить.'

c1.sub:
  t: 'Замена переменной в неопределённом интеграле'
  goal: 'Умею применять замену $u=g(x)$ и пересчитывать $dx$'
  pre: [c1.chain, c1.int, c1.rules, pre.func]
  g: [substitution]
  k: [num, mc, expr, spot]
  e: [c1.sub.dx]
  n: 6
  note: 'Только неопределённые интегралы вида $\int f(ax+b)\,dx$ и $\int g(x)^n g''(x)\,dx$. Определённые интегралы не вводить.'

c1.parts:
  t: 'Интегрирование по частям'
  goal: 'Умею применять формулу интегрирования по частям и выбирать $u$ так, чтобы интеграл упростился'
  pre: [c1.int, c1.rules, c1.chain, pre.explog]
  g: [integration-by-parts]
  k: [num, mc, expr, spot]
  e: [c1.parts.choice]
  n: 6
  note: 'Только $\int x e^{ax}\,dx$, $\int x\sin ax\,dx$, $\int \ln x\,dx$. Повторное интегрирование по частям не вводить.'

c1.opt:
  t: 'Задачи на наибольшее и наименьшее значение'
  goal: 'Умею находить наибольшее значение многочлена на отрезке, сравнивая значения в критических точках и на концах'
  pre: [c1.rules, c1.der, c1.cont]
  g: [critical-point, extremum-on-interval]
  k: [num, mc, expr, spot]
  e: [c1.opt.endpoints]
  n: 6
  note: 'Только многочлены степени 2 и 3 на отрезке. Выпуклость и вторую производную не вводить.'

c1.limcalc:
  t: 'Техника пределов, замечательные пределы'
  goal: 'Умею раскрывать неопределённости вида $\frac00$ и $\frac{\infty}{\infty}$ в пределах рациональных функций'
  pre: [c1.lim, c1.seq, pre.trig, pre.explog, pre.func]
  g: [indeterminate-form, notable-limit]
  k: [num, mc, spot]
  e: [c1.limcalc.zero-zero, c1.limcalc.inf-ratio]
  n: 6
  note: 'Только рациональные функции и $\sin(kx)/x$. Правило Лопиталя и эквивалентности не вводить.'

c1.lhop:
  t: 'Правило Лопиталя'
  goal: 'Умею применять правило Лопиталя к неопределённости $\frac00$ и проверять, что неопределённость есть'
  pre: [c1.limcalc, c1.rules, c1.chain]
  g: [lhopital-rule]
  k: [num, mc, spot]
  e: [c1.lhop.not-indeterminate]
  n: 6
  note: 'Только $\frac00$, одно или два применения. $\frac{\infty}{\infty}$ упомянуть одной фразой.'

c1.mvt:
  t: 'Теоремы Ферма, Ролля, Лагранжа'
  goal: 'Умею находить точку $c$ из теоремы Лагранжа и проверять условия теоремы Ролля'
  pre: [c1.rules, c1.cont, c1.der]
  g: [fermat-theorem, rolle-theorem, lagrange-theorem]
  k: [num, mc, spot]
  e: [c1.mvt.cond, c1.mvt.midpoint]
  n: 6
  note: 'Без доказательств. Теорему Коши не вводить.'

c1.seq:
  t: 'Последовательности и их предел'
  goal: 'Умею находить предел последовательности и отличаю сходящуюся последовательность от просто ограниченной'
  pre: [lg.quant, pre.ineq, pre.func]
  g: [sequence-limit]
  k: [num, mc, spot]
  e: [c1.seq.never-reaches, c1.seq.bounded]
  n: 6
  note: 'Определение ε–N дать готовым из глоссария. Монотонные последовательности и число $e$ не вводить.'

c1.small:
  t: 'Бесконечно малые, o-малое, эквивалентности'
  goal: 'Умею заменять эквивалентные функции в произведениях и частных и не подставляю их в суммы'
  pre: [c1.limcalc, c1.lim, pre.explog, pre.trig]
  g: [little-o, equivalent-functions]
  k: [num, mc, spot]
  e: [c1.small.sum]
  n: 6
  note: 'Таблица: $\sin u$, $\tan u$, $\ln(1+u)$, $e^u-1\sim u$ и $1-\cos u\sim\frac{u^2}{2}$ при $u\to0$. Ряд Тейлора не вводить: разложение $e^x$ дать готовым.'

c1.impl:
  t: 'Производная обратной, неявной, параметрической функции'
  goal: 'Умею находить производную обратной функции, неявной функции и функции, заданной параметрически'
  pre: [c1.chain, c1.rules]
  g: [inverse-derivative, implicit-derivative, parametric-derivative]
  k: [num, mc, spot]
  e: [c1.impl.inverse-point, c1.impl.implicit-sign, c1.impl.param-inverted]
  n: 6
  note: 'Только первая производная. Вторую производную параметрической функции не вводить.'

c1.study:
  t: 'Монотонность, экстремумы, выпуклость'
  goal: 'Умею находить экстремумы и точки перегиба многочлена по знакам первой и второй производной'
  pre: [c1.opt, c1.chain, c1.mvt]
  g: [monotonicity-test, convexity-test]
  k: [num, mc, spot]
  e: [c1.study.f0-extremum, c1.study.concavity-sign]
  n: 6
  note: 'Только многочлены. Асимптоты не вводить.'

c1.ftc:
  t: 'Формула Ньютона–Лейбница'
  goal: 'Умею вычислять определённый интеграл по формуле Ньютона–Лейбница и отличаю его от площади'
  pre: [c1.int, c1.riem, c1.mvt]
  g: [newton-leibniz]
  k: [num, mc, spot]
  e: [c1.ftc.area-signed, c1.ftc.order]
  n: 6
  note: 'Только многочлены и $e^{ax}$. Производную интеграла с переменным верхним пределом дать одной задачей.'

c1.impr:
  t: 'Несобственные интегралы'
  goal: 'Умею вычислять несобственные интегралы степенных и показательных функций и не применяю формулу через разрыв'
  pre: [c1.ftc, c1.limcalc, c1.lim]
  g: [improper-integral]
  k: [num, mc, spot]
  e: [c1.impr.decay, c1.impr.discontinuity]
  n: 6
  note: 'Только $\int_1^\infty x^{-p}$, $\int_0^\infty e^{-ax}$ и $\int_0^1 x^{-p}$. Признаки сравнения не вводить.'
