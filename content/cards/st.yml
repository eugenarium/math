# Карточки раздела st (математическая статистика). Карточка st.ci лежит в samples.yml. Источник: docs/COURSE_MAP.md.
st.descr:
  t: 'Выборка, описательные статистики, графики'
  goal: 'Умею находить среднее и медиану выборки и знаю, как на них влияют выбросы'
  pre: [pr.var, pr.exp, pr.rv]
  g: [descriptive-statistics]
  w: [scatter]
  k: [num, mc, spot]
  e: [st.descr.outlier, st.descr.median-even]
  n: 6
  note: 'Только числовые выборки до десяти значений. Графики упомянуть без задач.'

st.samp:
  t: 'Выборочное распределение, стандартная ошибка'
  goal: 'Умею находить стандартную ошибку среднего и отличаю её от стандартного отклонения данных'
  pre: [st.descr, pr.clt, pr.lln, pr.norm, pr.var]
  g: [standard-error]
  w: [sample]
  k: [num, mc, spot]
  e: [st.samp.sd-se, st.ci.linear-n, st.samp.pop-size]
  n: 6
  note: 'Поправку на конечную совокупность не вводить.'

st.est:
  t: 'Точечные оценки: смещение, состоятельность, MSE'
  goal: 'Умею находить выборочную дисперсию с делением на $n-1$ и считать MSE оценки'
  pre: [st.samp, st.descr, pr.var, pr.exp]
  g: [point-estimate]
  w: [sample]
  k: [num, mc, spot]
  e: [st.est.n-div, st.est.unbiased-good]
  n: 6
  note: 'Только среднее и дисперсия. Доказательство несмещённости не вводить.'

st.mle:
  t: 'Метод максимального правдоподобия'
  goal: 'Умею находить оценку максимального правдоподобия для доли и для параметра показательного распределения'
  pre: [st.est, pr.cdistr, pr.discr, c1.opt]
  g: [likelihood]
  k: [num, mc, spot]
  e: [st.mle.prob-param, st.mle.mean-rate]
  n: 6
  note: 'Только схема Бернулли и показательное распределение. Информацию Фишера не вводить.'

st.t:
  t: 'Распределение Стьюдента, интервал для среднего'
  goal: 'Умею строить интервал для среднего с неизвестной $\sigma$ по распределению Стьюдента'
  pre: [st.ci, st.samp, pr.norm]
  g: [student-t]
  k: [num, mc, spot]
  e: [st.t.z-for-t, st.t.df]
  n: 6
  note: 'Значение $t^*$ давать в условии. Проверку нормальности не вводить.'

st.test:
  t: 'Проверка гипотез: логика, p-значение, ошибки I и II рода'
  goal: 'Умею вычислять статистику критерия и верно толковать $p$-значение и вывод «не отвергли $H_0$»'
  pre: [st.ci, st.samp, pr.norm]
  g: [hypothesis-test, p-value]
  w: [test]
  k: [num, mc, spot]
  e: [st.test.p-h0, st.test.accept, st.test.tails]
  n: 6
  note: 'Только z-критерий для среднего. Мощность в st.power.'

st.zt:
  t: 'Одновыборочные z- и t-критерии'
  goal: 'Умею вычислять $t$-статистику, проверять решение по критическому значению и учитывать направление альтернативы'
  pre: [st.t, st.test, st.samp, pr.norm]
  g: [one-sample-test]
  k: [num, mc, spot]
  e: [st.zt.sign, st.samp.sd-se]
  n: 6
  note: 'Критические значения давать в условии. Проверку нормальности не вводить.'

st.two:
  t: 'Двухвыборочные и парные критерии'
  goal: 'Умею находить стандартную ошибку разности средних и отличаю парные данные от независимых выборок'
  pre: [st.zt, st.t, st.test, st.samp]
  g: [two-sample-test]
  k: [num, mc, spot]
  e: [st.two.paired-indep, st.two.se-diff]
  n: 6
  note: 'Только расчёт стандартной ошибки и выбор критерия. Критерий Уэлча подробно не вводить.'

st.power:
  t: 'Мощность, размер эффекта, объём выборки'
  goal: 'Умею находить мощность как $1-\beta$, размер эффекта и объём выборки для заданной погрешности'
  pre: [st.zt, st.test, st.ci]
  g: [statistical-power]
  w: [test]
  k: [num, mc, spot]
  e: [st.power.alpha-beta, st.ci.linear-n, st.test.accept]
  n: 6
  note: 'Приближение $z\approx2$ для $95\,\%$. Кривые мощности не вводить.'

st.chi:
  t: 'Доли, критерии χ²'
  goal: 'Умею вычислять статистику $\chi^2$ по таблице частот и находить число степеней свободы'
  pre: [st.test, pr.discr, st.samp]
  g: [chi-square-test]
  k: [num, mc, spot]
  e: [st.chi.div-e, st.chi.df, st.chi.props]
  n: 6
  note: 'Только критерий согласия и $2\times2$. Поправку Йетса не вводить.'

st.reg:
  t: 'Простая линейная регрессия'
  goal: 'Умею находить наклон, свободный член и прогноз линейной регрессии и помню о причинности и экстраполяции'
  pre: [pr.cov, st.zt, st.descr, pr.var]
  g: [linear-regression]
  w: [scatter]
  k: [num, mc, spot]
  e: [st.reg.causation, st.reg.extrapolate]
  n: 6
  note: 'Только одна переменная. Проверку значимости наклона и диагностику не вводить.'

st.mom:
  t: 'Метод моментов'
  goal: 'Умею оценивать параметры, приравнивая теоретические моменты к выборочным'
  pre: [st.est, st.samp, st.descr, pr.cdistr, pr.cont, pr.var, pr.exp]
  g: [method-of-moments]
  k: [num, mc, spot]
  e: [st.mom.invert, st.mom.half, st.mom.raw]
  n: 6
  note: 'Один-два параметра. Сравнение с максимальным правдоподобием не вводить.'

st.mreg:
  t: 'Множественная регрессия в матричной форме'
  goal: 'Умею строить прогноз по модели с двумя предикторами и читать коэффициенты при неизменных остальных переменных'
  pre: [st.reg, st.zt, st.descr, pr.cov, pr.var, la.proj, la.orth, la.dot]
  g: [multiple-regression]
  k: [num, mc, spot]
  e: [st.mreg.ones, st.mreg.r2, st.mreg.ceteris]
  n: 6
  note: 'Не более двух предикторов. Обратную матрицу не вычислять, матрицы $X^TX$ диагональные.'

st.diag:
  t: 'Диагностика регрессии: остатки, выбросы, мультиколлинеарность'
  goal: 'Умею считать остатки, стандартизованный остаток и VIF и читать график остатков'
  pre: [st.mreg, st.reg, st.zt, pr.cov, pr.var]
  g: [regression-diagnostics]
  k: [num, mc, spot]
  e: [st.diag.sign, st.diag.vif, st.diag.outlier]
  n: 6
  note: 'Без графиков: только числа и описание графика остатков словами.'

st.anova:
  t: 'Дисперсионный анализ'
  goal: 'Умею находить степени свободы и $F$-статистику однофакторного ANOVA'
  pre: [st.two, st.zt, st.t, st.test, st.ci, pr.var]
  g: [anova]
  k: [num, mc, spot]
  e: [st.anova.df, st.anova.ss-ms, st.anova.which]
  n: 6
  note: 'Равные группы, $k\le5$. Критические значения $F$ не требовать.'

st.logit:
  t: 'Логистическая регрессия'
  goal: 'Умею переводить шансы и вероятность друг в друга и читать отношение шансов'
  pre: [st.mreg, st.mle, st.reg, st.zt, pr.bayes, pr.cond]
  g: [logistic-regression]
  k: [num, mc, spot]
  e: [st.logit.odds, st.logit.or, st.logit.linear]
  n: 6
  note: 'Без вычисления оценок коэффициентов. Только интерпретация.'

st.boot:
  t: 'Бутстреп и перестановочные критерии'
  goal: 'Умею считать число бутстреп-выборок и перестановок и описывать алгоритм бутстрепа'
  pre: [st.ci, st.test, st.samp, st.descr, dm.binom]
  g: [bootstrap]
  k: [num, mc, spot]
  e: [st.boot.without, st.boot.size, st.boot.perm]
  n: 6
  note: 'Малые выборки, подсчёт вручную. Программирование не нужно.'

st.nonpar:
  t: 'Ранговые критерии'
  goal: 'Умею расставлять ранги, включая совпадения, и находить статистику $U$'
  pre: [st.two, st.zt, st.t, st.test, st.ci]
  g: [rank-tests]
  k: [num, mc, spot]
  e: [st.nonpar.rank-sum, st.nonpar.ties, st.nonpar.mean]
  n: 6
  note: 'Критические таблицы не использовать. Только Манн–Уитни.'

st.mult:
  t: 'Множественные сравнения'
  goal: 'Умею считать вероятность ложной значимости при $m$ проверках и порог Бонферрони'
  pre: [st.test, st.ci, st.samp]
  g: [multiple-comparisons]
  k: [num, mc, spot]
  e: [st.mult.sum, st.mult.bonf, st.mult.found]
  n: 6
  note: 'Независимые проверки. Поправку Холма и FDR упомянуть одной фразой.'

st.ab:
  t: 'A/B-тесты на практике'
  goal: 'Умею оценивать объём выборки для A/B-теста и объяснять вред подглядывания'
  pre: [st.two, st.power, st.chi, st.zt, st.test, st.ci]
  g: [ab-test]
  k: [num, mc, spot]
  e: [st.ab.peek, st.ab.size, st.ab.practical]
  n: 6
  note: 'Формула $16\sigma^2/\delta^2$ на группу для $\alpha=0.05$ и мощности $80\%$.'

st.bayes:
  t: 'Байесовский вывод: априорное, апостериорное, сопряжённые пары'
  goal: 'Умею обновлять Beta-распределение данными и находить апостериорное среднее'
  pre: [pr.bayes, st.mle, pr.cond, pr.cdistr, pr.cont]
  g: [bayesian-inference]
  k: [num, mc, spot]
  e: [st.bayes.prior, st.bayes.mean, st.bayes.likelihood-prob]
  n: 6
  note: 'Только пара Beta–биномиальная модель. Интегралы не вычислять.'

st.theory:
  t: 'Достаточность, информация Фишера, неравенство Рао–Крамера'
  goal: 'Умею находить информацию Фишера для Бернулли и границу Рао–Крамера для $n$ наблюдений'
  pre: [st.mle, st.est, pr.discr, pr.var]
  g: [fisher-information]
  k: [num, mc, spot]
  e: [st.theory.inverse, st.theory.n, st.theory.biased]
  n: 6
  note: 'Обзор. Достаточность упомянуть одной фразой, без факторизационной теоремы.'
