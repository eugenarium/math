# Карточки раздела op (оптимизация). Источник: docs/COURSE_MAP.md.
op.conv:
  t: 'Выпуклые множества и функции'
  goal: 'Умею проверять выпуклость по второй производной и знаю, когда локальный минимум глобален'
  pre: [cm.hess, cm.grad, la.quad, c1.study]
  g: [convexity]
  w: [fplot]
  k: [num, mc, spot]
  e: [op.conv.local, op.conv.sum, op.conv.second]
  n: 6
  note: 'Одна переменная и квадратичные функции двух переменных.'

op.uncon:
  t: 'Условия оптимальности первого и второго порядка'
  goal: 'Умею находить минимум квадратичной функции и применять условия первого и второго порядка'
  pre: [op.conv, cm.extr, cm.hess, la.inv]
  g: [optimality-conditions]
  k: [num, mc, spot]
  e: [op.uncon.necessary, op.uncon.hess, op.uncon.quad]
  n: 6
  note: 'Диагональные квадратичные функции двух переменных.'

op.gd:
  t: 'Градиентный спуск, выбор шага'
  goal: 'Умею делать шаги градиентного спуска и находить допустимый шаг для квадратичной функции'
  pre: [op.uncon, op.conv, cm.grad]
  g: [gradient-descent]
  k: [num, mc, spot]
  e: [op.gd.step, op.gd.sign, op.gd.rate]
  n: 6
  note: 'Функции $\frac a2x^2$. Контурный виджет не нужен.'

op.lagr:
  t: 'Ограничения-равенства, смысл множителей Лагранжа'
  goal: 'Умею находить условный оптимум и объяснять множитель Лагранжа как цену ограничения'
  pre: [op.uncon, cm.lagr, cm.grad]
  g: [constrained-optimum]
  k: [num, mc, spot]
  e: [op.lagr.sens, op.lagr.grad, op.lagr.feasible]
  n: 6
  note: 'Линейное ограничение, две переменные.'

op.lp:
  t: 'Линейное программирование: геометрия'
  goal: 'Умею находить оптимум линейной цели в вершине допустимого многоугольника'
  pre: [la.sys, pre.ineq, op.conv]
  g: [linear-programming]
  w: [lp]
  k: [num, mc, spot]
  e: [op.lp.vertex, op.lp.constraint, op.lp.unbounded]
  n: 6
  note: 'Две переменные. Симплекс-метод — в расширении.'

op.ls:
  t: 'Наименьшие квадраты, ridge и lasso'
  goal: 'Умею считать МНК-наклон, ridge и lasso для одного признака'
  pre: [la.proj, op.gd, op.uncon]
  g: [least-squares-reg]
  k: [num, mc, spot]
  e: [op.ls.ridge, op.ls.lasso, op.ls.sumsq]
  n: 6
  note: 'Один признак без свободного члена. Контурный виджет не нужен.'

op.newton:
  t: 'Метод Ньютона и квазиньютоновские методы'
  goal: 'Умею делать шаги метода Ньютона для минимизации и знаю, что для квадратичной функции хватает одного шага'
  pre: [op.gd, op.uncon, la.inv]
  g: [newton-method-opt]
  k: [num, mc, spot]
  e: [op.newton.quad, op.newton.root, op.newton.hess]
  n: 6
  note: 'Одна переменная. Квазиньютоновские методы упомянуть одной фразой.'

op.kkt:
  t: 'Ограничения-неравенства, условия Каруша–Куна–Таккера'
  goal: 'Умею применять условия ККТ и дополняющую нежёсткость в задачах с одним ограничением'
  pre: [op.lagr, op.uncon]
  g: [kkt]
  k: [num, mc, spot]
  e: [op.kkt.active, op.kkt.compl, op.kkt.sign]
  n: 6
  note: 'Одно ограничение-неравенство, одна-две переменные.'

op.dual:
  t: 'Двойственность'
  goal: 'Умею строить двойственную задачу простой ЛП и применять слабую двойственность'
  pre: [op.lp, op.kkt, la.sys]
  g: [duality]
  k: [num, mc, spot]
  e: [op.dual.weak, op.dual.vars, op.dual.gap]
  n: 6
  note: 'Задачи с ограничениями вида $x_i\le b_i$.'

op.sgd:
  t: 'Стохастический спуск, momentum, Adam'
  goal: 'Умею оценивать шум мини-батча и считать шаги momentum'
  pre: [op.gd, pr.exp, pr.var]
  g: [sgd]
  k: [num, mc, spot]
  e: [op.sgd.var, op.sgd.mom, op.sgd.bias]
  n: 6
  note: 'Adam упомянуть без формул.'

op.simplex:
  t: 'Симплекс-метод'
  goal: 'Умею применять правило минимальных отношений и знаю число базисных переменных'
  pre: [op.lp, la.sys]
  g: [simplex]
  k: [num, mc, spot]
  e: [op.simplex.ratio, op.simplex.reduced, op.simplex.basis]
  n: 6
  note: 'Один шаг метода на малой задаче; симплекс-таблицы не строить целиком.'
