# Карточки раздела pr (теория вероятностей). Источник: docs/COURSE_MAP.md.
pr.space:
  t: 'Исходы, события, аксиомы вероятности'
  goal: 'Умею находить вероятность дополнения и объединения событий по аксиомам вероятности'
  pre: [pre.sets]
  g: [probability-axioms]
  k: [num, mc, spot]
  e: [pr.space.union-sum, pr.space.complement]
  n: 6
  note: 'Только конечные пространства исходов. Несчётные пространства и σ-алгебры не вводить.'

pr.classic:
  t: 'Классическая вероятность и комбинаторика'
  goal: 'Умею считать вероятность как долю благоприятных исходов и понимаю, что исходы не всегда равновероятны'
  pre: [pr.space, dm.perm, dm.count, pre.sets]
  g: [classical-probability]
  k: [num, mc, spot]
  e: [pr.classic.unequal, pr.classic.order]
  n: 6
  note: 'Числа благоприятных и всех исходов брать из dm.perm. Геометрическую вероятность не вводить.'

pr.cond:
  t: 'Условная вероятность'
  goal: 'Умею находить $P(A\mid B)$ и отличаю её от $P(B\mid A)$'
  pre: [pr.space, pre.sets]
  g: [conditional-probability]
  k: [num, mc, spot]
  e: [pr.cond.reverse, pr.cond.shrink]
  n: 6
  note: 'Только дискретные примеры. Формулу Байеса не вводить: это pr.bayes.'

pr.indep:
  t: 'Независимость событий'
  goal: 'Умею проверять независимость по $P(A\cap B)=P(A)P(B)$ и не путаю её с несовместностью'
  pre: [pr.cond, pr.space, pre.sets]
  g: [independence]
  k: [num, mc, spot]
  e: [pr.indep.incompat, pr.indep.add]
  n: 6
  note: 'Только пары событий и серии независимых испытаний. Независимость в совокупности не вводить.'

pr.bayes:
  t: 'Формулы полной вероятности и Байеса'
  goal: 'Умею применять формулу полной вероятности и формулу Байеса с учётом базовой частоты'
  pre: [pr.cond, pr.space, pre.sets]
  g: [total-probability, bayes-formula]
  k: [num, mc, spot]
  e: [pr.bayes.base, pr.bayes.total]
  n: 6
  note: 'Не более двух гипотез. Задачи с тремя и более гипотезами не вводить.'

pr.rv:
  t: 'Дискретные случайные величины'
  goal: 'Умею работать с таблицей распределения: находить недостающую вероятность и $P(X\le k)$'
  pre: [pr.indep, pr.cond, pr.space, pre.func, pre.sets]
  g: [discrete-random-variable]
  k: [num, mc, spot]
  e: [pr.rv.sum, pr.rv.cdf]
  n: 6
  note: 'Только конечные значения. Математическое ожидание и дисперсию не вводить.'

pr.exp:
  t: 'Математическое ожидание, линейность'
  goal: 'Умею находить $E[X]$ по таблице, использовать линейность и помню, что $E[X^2]\ne(E[X])^2$'
  pre: [pr.rv, pr.indep, pr.cond, pr.space, pre.sum, pre.func, pre.sets]
  g: [expectation]
  k: [num, mc, spot]
  e: [pr.exp.nonlin, pr.exp.avg]
  n: 6
  note: 'Только дискретные величины. Дисперсию не вводить.'

pr.var:
  t: 'Дисперсия и стандартное отклонение'
  goal: 'Умею находить дисперсию по таблице и применять $\operatorname{Var}(aX)=a^2\operatorname{Var}X$ и сложение дисперсий независимых величин'
  pre: [pr.exp, pr.rv, pr.indep, pr.space, pre.sum, pre.func, pre.sets]
  g: [variance]
  k: [num, mc, spot]
  e: [pr.var.scale, pr.var.diff]
  n: 6
  note: 'Сложение дисперсий только для независимых величин. Ковариацию не вводить.'

pr.discr:
  t: 'Биномиальное, геометрическое, пуассоновское распределения'
  goal: 'Умею применять формулы биномиального, геометрического и пуассоновского распределений'
  pre: [pr.var, pr.exp, pr.rv, dm.binom, dm.perm, dm.count, pre.sum, pre.sets]
  g: [binomial-distribution, geometric-distribution, poisson-distribution]
  k: [num, mc, spot]
  e: [pr.discr.coef, pr.discr.geom]
  n: 6
  note: 'Только вероятности отдельных значений и среднее. Приближение пуассоновским не вводить.'

pr.cont:
  t: 'Непрерывные величины: плотность и функция распределения'
  goal: 'Умею находить вероятность попадания в интервал по плотности и помню, что плотность — не вероятность'
  pre: [pr.var, pr.exp, pr.rv, c1.ftc, c1.int, pre.func, pre.sets]
  g: [probability-density]
  k: [num, mc, spot]
  e: [pr.cont.density-prob, pr.cont.point]
  n: 6
  note: 'Только полиномиальные плотности на отрезке. Названные распределения — в pr.cdistr.'

pr.cdistr:
  t: 'Равномерное, показательное, нормальное распределения'
  goal: 'Умею работать с равномерным и показательным распределениями и знаю свойство отсутствия памяти'
  pre: [pr.cont, pr.var, pr.exp, c1.impr, c1.ftc, pre.explog, pre.func]
  g: [uniform-distribution, exponential-distribution]
  k: [num, mc, spot]
  e: [pr.cdistr.rate, pr.cdistr.memory]
  n: 6
  note: 'Нормальное распределение — только упоминание, подробности в pr.norm.'

pr.norm:
  t: 'Нормальное распределение: стандартизация, квантили'
  goal: 'Умею стандартизировать значение нормальной величины и пользоваться правилом $68$–$95$–$99{,}7$'
  pre: [pr.cdistr, pr.cont, pr.var, pr.exp, pre.func]
  g: [standard-normal]
  k: [num, mc, spot]
  e: [pr.norm.var, pr.norm.tail]
  n: 6
  note: 'Таблицу значений $\Phi$ не вводить: использовать симметрию и правило трёх сигм.'

pr.joint:
  t: 'Совместные распределения (дискретный случай), маргинальные, условные'
  goal: 'Умею находить маргинальные и условные вероятности по таблице совместного распределения'
  pre: [pr.var, pr.rv, pr.cond, pr.indep, pr.space, pre.sets]
  g: [joint-distribution]
  k: [num, mc, spot]
  e: [pr.joint.marginal, pr.joint.cond]
  n: 6
  note: 'Только таблицы 2×2. Ковариацию не вводить.'

pr.cov:
  t: 'Ковариация и корреляция'
  goal: 'Умею находить ковариацию и корреляцию и знаю, что некоррелированность не означает независимость'
  pre: [pr.joint, pr.var, pr.exp, pr.rv, pr.indep]
  g: [covariance-correlation]
  k: [num, mc, spot]
  e: [pr.cov.uncorr, pr.cov.cov-scale, pr.cov.var-sum]
  n: 6
  note: 'Только дискретные примеры и формулы. Регрессию не вводить.'

pr.ineq:
  t: 'Неравенства Маркова и Чебышёва'
  goal: 'Умею применять неравенства Маркова и Чебышёва для оценки вероятностей'
  pre: [pr.var, pr.exp, pr.rv]
  g: [markov-chebyshev]
  k: [num, mc, spot]
  e: [pr.ineq.nonneg, pr.ineq.sigma]
  n: 6
  note: 'Только вычисление оценок. Доказательства не вводить.'

pr.lln:
  t: 'Закон больших чисел'
  goal: 'Умею применять закон больших чисел и отличаю его от «ошибки игрока»'
  pre: [pr.ineq, pr.cov, pr.var, pr.exp, pr.indep]
  g: [law-of-large-numbers]
  k: [num, mc, spot]
  e: [pr.lln.gambler, pr.lln.abs]
  n: 6
  note: 'Только слабый закон в форме со средним. Сходимость почти наверное не вводить.'

pr.clt:
  t: 'Центральная предельная теорема'
  goal: 'Умею находить стандартную ошибку среднего и понимаю, что нормальным становится распределение среднего, а не данных'
  pre: [pr.lln, pr.norm, pr.cdistr, pr.var, pr.exp]
  g: [central-limit-theorem]
  k: [num, mc, spot]
  e: [pr.clt.data, pr.clt.sd]
  n: 6
  note: 'Только среднее и сумма. Поправка на непрерывность и условия Линдеберга не вводить.'
