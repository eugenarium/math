# Карточки раздела pre (Подготовка). Источник: docs/COURSE_MAP.md.
pre.func:
  t: 'Функция: область определения, образ, композиция, обратная'
  goal: 'Умею вычислять композицию, находить область определения корня и обратную функцию для линейной'
  pre: [pre.sets]
  g: [function, domain, composition, inverse-function]
  k: [num, mc, expr, spot]
  e: [pre.func.inv-recip, pre.func.comp-order]
  n: 6
  note: 'Только числовые функции одной переменной. Инъективность упомянуть одной фразой, без доказательств.'

pre.graph:
  t: 'Элементарные функции и преобразования графиков'
  goal: 'Умею по формуле $y=f(x-a)+b$ определять сдвиг графика и подбирать параметры по картинке'
  pre: [pre.func, pre.sets]
  g: [graph-shift, graph-stretch]
  w: [fplot]
  k: [num, mc, graph, spot]
  e: [pre.graph.shift-sign, pre.graph.scale-axis]
  n: 6
  note: 'Основной образец — парабола. Отражения и модуль не вводить.'

pre.explog:
  t: 'Степени, показательная функция, логарифмы'
  goal: 'Умею применять свойства степеней и логарифмов и не раскладываю логарифм суммы'
  pre: [pre.graph, pre.func, pre.sets]
  g: [exponent-rules, logarithm]
  w: [fplot]
  k: [num, mc, expr, spot]
  e: [pre.explog.ln-sum, pre.explog.log-power, pre.explog.log-prod]
  n: 6
  note: 'Логарифм вводится как показатель степени. Замену основания не вводить.'

pre.sum:
  t: 'Обозначения Σ и Π, работа с индексами'
  goal: 'Умею считать число слагаемых и вычислять суммы вида $\sum(ai+b)$'
  pre: [pre.func, pre.sets]
  g: [sigma-notation, product-notation]
  k: [num, expr, spot]
  e: [pre.sum.count, pre.sum.const]
  n: 5
  note: 'Формулу суммы $1+\dots+n$ дать готовой, без вывода. Вложенные суммы не вводить.'

pre.sets:
  t: 'Множества, операции, диаграммы Венна'
  goal: 'Умею считать число элементов объединения и закрашивать области диаграммы Венна по выражению'
  pre: []
  g: [set, set-operations, inclusion-exclusion]
  w: [venn]
  k: [num, mc, graph, spot]
  e: [pre.sets.union-count, pre.sets.de-morgan]
  n: 6
  note: 'Только конечные множества. Декартово произведение и мощность бесконечных множеств не вводить.'

pre.ineq:
  t: 'Неравенства, модуль, окрестности'
  goal: 'Умею решать линейные неравенства и неравенства с модулем и записывать решение промежутком'
  pre: [pre.func, pre.sets]
  g: [inequality, absolute-value, neighborhood]
  w: [numline]
  k: [num, mc, graph, spot]
  e: [pre.ineq.neg-flip, pre.ineq.abs-split]
  n: 6
  note: 'Линейные неравенства и модуль вида $|x-a|<r$. Квадратные и дробные неравенства не вводить.'

pre.trig:
  t: 'Тригонометрия на единичной окружности'
  goal: 'Умею находить синус и косинус угла по единичной окружности и переводить градусы в радианы'
  pre: [pre.graph, pre.func, pre.sets]
  g: [unit-circle, radian]
  w: [fplot]
  k: [num, mc, graph, spot]
  e: [pre.trig.deg-rad, pre.trig.sin-cos-swap]
  n: 6
  note: 'Углы, кратные 30° и 45°. Формулы приведения и сложения не вводить.'

pre.cx:
  t: 'Комплексные числа: алгебра, плоскость, формула Эйлера'
  goal: 'Умею складывать и умножать комплексные числа, находить модуль и отмечать числа на плоскости'
  pre: [pre.trig, pre.explog, pre.graph, pre.func, pre.sets]
  g: [complex-number, modulus-argument, euler-formula]
  w: [complex]
  k: [num, graph, spot]
  e: [pre.cx.i-square, pre.cx.abs-sum]
  n: 6
  note: 'Алгебра и плоскость; формулу Эйлера дать готовой. Корни из комплексных чисел не вводить.'
