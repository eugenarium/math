# Карточки раздела la (линейная алгебра). Карточка la.eig лежит в samples.yml. Источник: docs/COURSE_MAP.md.
la.vec:
  t: 'Векторы в ℝⁿ, линейные комбинации'
  goal: 'Умею складывать векторы, умножать их на число и находить коэффициенты линейной комбинации'
  pre: [pre.func, pre.sum]
  g: [vector, linear-combination]
  k: [num, mc, spot]
  e: [la.vec.scalar-one, la.vec.span-all]
  n: 6
  note: 'Только векторы в ℝ² и ℝ³. Линейную независимость и базис не вводить: это la.basis.'

la.dot:
  t: 'Скалярное произведение, длина, угол, проекция'
  goal: 'Умею находить скалярное произведение, косинус угла и проекцию одного вектора на другой'
  pre: [la.vec, pre.trig, pre.func, pre.sum]
  g: [dot-product, vector-projection]
  k: [num, mc, spot]
  e: [la.dot.no-norm, la.dot.proj-dir]
  n: 6
  note: 'Только векторы в ℝ². Ортогональные базисы и Грама–Шмидта не вводить.'

la.sys:
  t: 'Системы линейных уравнений, метод Гаусса'
  goal: 'Умею решать системы 2×2 методом исключения и отличаю несовместную систему от неопределённой'
  pre: [la.vec, pre.func, pre.sum]
  g: [gauss-elimination, solution-set]
  k: [num, mc, spot]
  e: [la.sys.contradiction, la.sys.zero-row]
  n: 6
  note: 'Только системы 2×2 и одно параметрическое условие. Матричную запись и ранг не вводить.'

la.mat:
  t: 'Матрицы: операции, произведение как композиция'
  goal: 'Умею перемножать матрицы 2×2 и знаю, что произведение не коммутативно и может быть нулевым при ненулевых множителях'
  pre: [la.sys, la.vec, pre.func, pre.sum]
  g: [matrix-product]
  k: [num, mc, spot]
  e: [la.mat.commute, la.mat.zero-div]
  n: 6
  note: 'Только матрицы 2×2 и размеры в общем виде. Обратную матрицу и определитель не вводить.'

la.map:
  t: 'Линейные отображения и их матрицы'
  goal: 'Умею строить матрицу линейного отображения по образам базисных векторов и находить образ вектора'
  pre: [la.mat, la.sys, la.vec, pre.func, pre.sum]
  g: [linear-map]
  k: [num, mc, spot]
  e: [la.map.columns, la.map.shift]
  n: 6
  note: 'Только отображения плоскости. Ядро, образ и смену базиса не вводить.'

la.inv:
  t: 'Обратная матрица'
  goal: 'Умею находить обратную матрицу 2×2 и знаю, что $(AB)^{-1}=B^{-1}A^{-1}$'
  pre: [la.mat, la.sys, la.vec, pre.func, pre.sum]
  g: [inverse-matrix]
  k: [num, mc, spot]
  e: [la.inv.order, la.inv.formula]
  n: 6
  note: 'Только матрицы 2×2 с ненулевым определителем, формула через определитель дана готовой.'

la.det:
  t: 'Определитель: объём, свойства, вычисление'
  goal: 'Умею вычислять определитель 2×2, площадь параллелограмма и использовать $\det(kA)=k^n\det A$'
  pre: [la.inv, la.mat, la.sys, la.vec, pre.func, pre.sum]
  g: [determinant]
  k: [num, mc, spot]
  e: [la.det.sum, la.det.scalar]
  n: 6
  note: 'Только 2×2 и общие свойства для 3×3. Разложение по строке не вводить.'

la.space:
  t: 'Линейные пространства и подпространства'
  goal: 'Умею проверять, образует ли множество векторов подпространство'
  pre: [la.sys, la.vec, pre.func, pre.sum]
  g: [subspace]
  k: [num, mc, spot]
  e: [la.space.zero, la.space.union]
  n: 6
  note: 'Только подпространства в ℝⁿ. Абстрактные пространства упомянуть одной фразой.'

la.basis:
  t: 'Линейная независимость, базис, размерность'
  goal: 'Умею проверять линейную независимость векторов и находить координаты вектора в базисе'
  pre: [la.space, la.sys, la.vec, pre.func, pre.sum]
  g: [linear-independence, basis-dimension]
  k: [num, mc, spot]
  e: [la.basis.pairwise, la.basis.size]
  n: 6
  note: 'Только ℝ² и ℝ³. Смену базиса не вводить: это la.cob.'

la.rank:
  t: 'Ранг, ядро, образ, теорема о ранге'
  goal: 'Умею находить ранг матрицы и размерность ядра по теореме о ранге'
  pre: [la.basis, la.map, la.space, la.mat, la.sys, la.vec, pre.func, pre.sum]
  g: [matrix-rank, kernel-image]
  k: [num, mc, spot]
  e: [la.rank.rows, la.rank.nullity]
  n: 6
  note: 'Только небольшие матрицы. Ранг находить сравнением строк или методом Гаусса.'

la.cob:
  t: 'Координаты и смена базиса'
  goal: 'Умею переходить между координатами в стандартном и новом базисе в ℝ² с помощью матрицы перехода'
  pre: [la.basis, la.inv, la.space, la.mat, la.sys, la.vec, pre.func, pre.sum]
  g: [change-of-basis]
  k: [num, mc, spot]
  e: [la.cob.direction, la.cob.rows]
  n: 6
  note: 'Только ℝ² с целыми базисами. Матрицу линейного отображения в новом базисе не вводить.'

la.diag:
  t: 'Диагонализация, степени матриц'
  goal: 'Умею использовать собственные значения для степеней матрицы и знаю, что не всякая матрица диагонализуема'
  pre: [la.eig, la.cob, la.basis, la.inv, la.det, la.rank]
  g: [diagonalization]
  k: [num, mc, spot]
  e: [la.diag.pow, la.diag.defective]
  n: 6
  note: 'Только матрицы 2×2. Жорданову форму не вводить.'

la.orth:
  t: 'Ортогональность, Грам–Шмидт, QR'
  goal: 'Умею проверять ортогональность, нормировать вектор и делать один шаг процесса Грама–Шмидта'
  pre: [la.dot, la.basis, la.vec, pre.trig]
  g: [orthogonal-system, gram-schmidt]
  k: [num, mc, spot]
  e: [la.orth.unit, la.orth.gs-coef]
  n: 6
  note: 'Только ℝ². QR-разложение упомянуть одной фразой.'

la.proj:
  t: 'Проекция на подпространство, метод наименьших квадратов'
  goal: 'Умею находить проекцию вектора на прямую и наклон прямой через начало координат по методу наименьших квадратов'
  pre: [la.orth, la.inv, la.dot, la.basis]
  g: [least-squares]
  k: [num, mc, spot]
  e: [la.proj.res, la.proj.ls-mean]
  n: 6
  note: 'Только прямая через начало координат. Нормальные уравнения в общем виде не вводить.'

la.sym:
  t: 'Симметричные матрицы, спектральная теорема'
  goal: 'Умею находить собственные значения симметричной матрицы 2×2 и знаю, что её собственные векторы ортогональны'
  pre: [la.diag, la.orth, la.eig, la.cob]
  g: [spectral-theorem]
  k: [num, mc, spot]
  e: [la.sym.nonorth, la.sym.complex]
  n: 6
  note: 'Только матрицы 2×2. Квадратичные формы не вводить.'

la.quad:
  t: 'Квадратичные формы, знакоопределённость'
  goal: 'Умею записывать форму матрицей и определять её знакоопределённость по критерию Сильвестра'
  pre: [la.sym, la.diag, la.orth, la.eig, la.cob]
  g: [quadratic-form, definiteness]
  k: [num, mc, spot]
  e: [la.quad.offdiag, la.quad.det-only, la.quad.diag]
  n: 6
  note: 'Только две переменные. Поверхности и 3D не вводить: график на этом экране не нужен.'

la.svd:
  t: 'Сингулярное разложение'
  goal: 'Умею находить сингулярные числа и связывать их с рангом и нормами матрицы'
  pre: [la.quad, la.sym, la.diag, la.orth, la.rank, la.eig]
  g: [svd]
  k: [num, mc, spot]
  e: [la.svd.eig, la.svd.square, la.svd.rank]
  n: 6
  note: 'Матрицы 2×2 с красивыми числами. Построение $U$ и $V$ не требовать: только сингулярные числа и их смысл.'

la.norm:
  t: 'Нормы векторов и матриц, число обусловленности'
  goal: 'Умею считать нормы $1$, $2$, $\infty$ и число обусловленности диагональной матрицы'
  pre: [la.svd, la.sym, la.eig, la.dot]
  g: [vector-norm, condition-number]
  k: [num, mc, spot]
  e: [la.norm.l1, la.norm.inf, la.norm.cond-det]
  n: 6
  note: 'Обусловленность — через отношение сингулярных чисел. Нормы матриц, кроме спектральной, не вводить.'

la.cross:
  t: 'Векторное и смешанное произведение'
  goal: 'Умею вычислять компоненты векторного произведения, площадь и объём через определитель'
  pre: [la.det, la.dot, la.vec]
  g: [cross-product]
  k: [num, mc, spot]
  e: [la.cross.order, la.cross.scalar, la.cross.dot]
  n: 6
  note: 'Без 3D-виджета: только формулы. Ориентацию тройки упомянуть одной фразой.'

la.cplx:
  t: 'Комплексные собственные значения, повороты'
  goal: 'Умею находить комплексные собственные значения матрицы $2\times2$ и объяснять поворот с растяжением'
  pre: [la.eig, la.diag, la.cob]
  g: [complex-eigenvalues]
  k: [num, mc, spot]
  e: [la.cplx.real-part, la.cplx.disc, la.cplx.real-vec]
  n: 6
  note: 'Только матрицы $2\times2$. Комплексные векторы не вводить.'

la.jord:
  t: 'Жорданова форма (обзор)'
  goal: 'Умею определять число клеток Жордана и отличаю диагонализуемую матрицу от недиагонализуемой'
  pre: [la.eig, la.diag, la.rank]
  g: [jordan-form]
  k: [num, mc, spot]
  e: [la.jord.diag, la.jord.size, la.jord.rank]
  n: 6
  note: 'Обзор для матриц до $3\times3$ с одним собственным значением. Доказательств нет.'
