# Карточки раздела lg (математическая логика). Источник: docs/COURSE_MAP.md.
lg.prop:
  t: 'Высказывания, связки, таблицы истинности'
  goal: 'Умею вычислять значение составного высказывания и считать строки таблицы истинности'
  pre: [pre.sets]
  g: [proposition, connectives]
  w: [truth]
  k: [num, mc, spot]
  e: [lg.prop.or-exclusive, lg.prop.rows]
  n: 6
  note: 'Только $\neg$, $\wedge$, $\vee$. Импликацию не вводить: это следующий урок.'

lg.impl:
  t: 'Импликация: обратное, противоположное, контрапозиция'
  goal: 'Умею вычислять значение импликации и отличаю контрапозицию от обратного утверждения'
  pre: [lg.prop, pre.sets]
  g: [implication, contrapositive]
  k: [num, mc, spot]
  e: [lg.impl.converse, lg.impl.false-premise]
  n: 6
  note: 'Эквиваленцию $\leftrightarrow$ упомянуть одной фразой, без задач.'

lg.equiv:
  t: 'Равносильности, законы де Моргана'
  goal: 'Умею отрицать конъюнкцию, дизъюнкцию и импликацию по законам де Моргана'
  pre: [lg.impl, lg.prop, pre.sets]
  g: [equivalence, de-morgan]
  w: [truth]
  k: [num, mc, spot]
  e: [lg.equiv.demorgan-keep, lg.equiv.neg-impl]
  n: 6
  note: 'Только три переменные в задачах на подсчёт. Булевы функции и нормальные формы не вводить.'

lg.quant:
  t: 'Кванторы и отрицание кванторных высказываний'
  goal: 'Умею отрицать высказывания с кванторами и различаю порядок $\forall\exists$ и $\exists\forall$'
  pre: [lg.equiv, lg.impl, lg.prop, pre.sets]
  g: [quantifiers, quantifier-negation]
  k: [num, mc, spot]
  e: [lg.quant.order, lg.quant.neg]
  n: 6
  note: 'Только один-два квантора и простые предикаты на числах. Логику предикатов не вводить.'

lg.proof:
  t: 'Методы доказательства: прямое, от противного, индукция'
  goal: 'Умею провести доказательство по индукции и объяснить, зачем нужна база'
  pre: [lg.quant, lg.equiv, lg.impl, lg.prop, pre.sum, pre.func, pre.sets]
  g: [induction, proof-by-contradiction]
  k: [num, mc, spot, proof]
  e: [lg.proof.base, lg.proof.example]
  n: 6
  note: 'Метод от противного дать в интуиции, без задач. Сильную индукцию не вводить.'

lg.nf:
  t: 'ДНФ, КНФ, булевы функции, полнота систем'
  goal: 'Умею считать булевы функции и слагаемые СДНФ по таблице истинности и проверять полноту системы связок'
  pre: [lg.equiv, lg.impl, lg.prop, pre.sets]
  g: [boolean-function, dnf, cnf, complete-system]
  k: [num, mc, spot]
  e: [lg.nf.count, lg.nf.zeros, lg.nf.complete]
  n: 6
  note: 'Не более трёх переменных. Штрих Шеффера упомянуть одной фразой. Минимизацию не вводить.'

lg.deduct:
  t: 'Естественный вывод в логике высказываний'
  goal: 'Умею применять правило отделения и теорему о дедукции и замечаю неверные шаги в выводе'
  pre: [lg.equiv, lg.impl, lg.prop, pre.sets]
  g: [modus-ponens, modus-tollens, deduction-theorem]
  k: [mc, num, spot, proof]
  e: [lg.deduct.affirm, lg.deduct.deny, lg.deduct.assumption]
  n: 7
  note: 'Только правила modus ponens, modus tollens, сопряжение и теорема о дедукции. Формальных исчислений с аксиомами не вводить.'

lg.fol:
  t: 'Логика предикатов: язык, интерпретации, модели'
  goal: 'Умею проверять формулу с кванторами на конечной области и отличаю высказывание от предиката'
  pre: [lg.quant, lg.equiv, lg.impl, lg.prop, pre.sets]
  g: [predicate, interpretation, free-variable]
  k: [num, mc, spot]
  e: [lg.fol.domain, lg.fol.free, lg.fol.one]
  n: 6
  note: 'Предикаты на числах. Сигнатуры и функциональные символы не вводить. Общезначимость показать одним примером контрпримера.'

lg.meta:
  t: 'Корректность, полнота, теоремы Гёделя (обзор)'
  goal: 'Умею различать корректность и полноту и верно пересказывать смысл теорем Гёделя о неполноте'
  pre: [lg.deduct, lg.fol, lg.equiv, lg.quant, lg.impl, lg.prop, pre.sets]
  g: [soundness-completeness, incompleteness]
  k: [mc, spot]
  e: [lg.meta.swap, lg.meta.godel]
  n: 5
  note: 'Обзор без доказательств. Не использовать слова «диагональная лемма» и «ω-непротиворечивость».'
