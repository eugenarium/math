id: st.boot
int:
  - 'Есть выборка из $5$ чисел. Хочется узнать, насколько среднее может колебаться, но выборка одна. Бутстреп многократно «пересобирает» выборку из её же значений.'
  - {ask: 'Из выборки $\{3,5,8\}$ делают бутстреп-выборку размера $3$ с возвращением. Может ли получиться $\{5,5,8\}$?', ans: 'Да: после выбора $5$ оно возвращается, и его можно вытянуть снова. Без возвращения такого не бывает.'}
  - 'Перестановочный критерий делает похожее для двух групп: перемешивает метки групп и смотрит, как часто разность не меньше наблюдённой.'
def:
  - {g: bootstrap}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 3..5}
    q: 'Сколько существует упорядоченных бутстреп-выборок размера $@n$ из $@n$ различных значений?'
    a: n^n
    e: {st.boot.without: factorial(n)}
    h: ['На каждое из $@n$ мест можно поставить любое из $@n$ значений.']
  p2:
    k: num
    fast: 1
    v: {a: [3, 4], b: [3, 4, 5]}
    q: 'Две группы размеров $@a$ и $@b$. Сколько различных разбиений $@{a+b}$ значений на такие группы есть?'
    a: C(a+b,a)
    e: {st.boot.perm: factorial(a+b)}
    h: ['Порядок внутри групп не важен.']
    sol:
      - 'Выбираем, какие $@a$ из $@{a+b}$ значений попадут в первую группу.'
      - 'Порядок внутри группы не важен: сочетания $\binom{@{a+b}}{@a}$.'
      - 'Итог: $@{C(a+b,a)}$ разбиений.'
  p3:
    k: num
    lv: 2
    v: {r: 1..4}
    tol: 0.002
    q: 'Из $20$ равновероятных разбиений в $@r$ из них разность средних не меньше наблюдённой. Найди односторонний $p$.'
    a: r/20
    sol:
      - '$p$ — доля разбиений со статистикой не меньше наблюдённой.'
      - 'Всего $20$, подходящих $@r$.'
      - 'Итог: $p=\frac{@r}{20}=@{r/20:f2}$.'
  p4:
    k: mc
    q: 'Бутстреп-выборка получается'
    a: 'выбором $n$ значений из исходной выборки с возвращением'
    e: {st.boot.without: 'выбором $n$ значений без возвращения'}
    x: ['выбором половины значений с возвращением']
  p5:
    k: mc
    lv: 2
    q: 'Какого размера обычно берут бутстреп-выборки?'
    a: 'Такого же, как исходная выборка, то есть $n$'
    e: {st.boot.size: 'Намного меньше $n$, чтобы считать быстрее'}
    x: ['Намного больше $n$, чтобы точность была выше']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при построении $95\%$-ного бутстреп-интервала по перцентилям.'
    steps:
      - 'Генерируем $1000$ бутстреп-выборок размера $n$ с возвращением'
      - 'Для каждой считаем среднее'
      - 'Сортируем $1000$ средних'
      - 'Берём $25$-е и $975$-е значения как границы интервала'
    bad:
      - {i: 1, t: 'Генерируем $1000$ выборок размера $n$ без возвращения', e: st.boot.without}
      - {i: 4, t: 'Берём $5$-е и $995$-е значения как границы интервала'}
err: [st.boot.without, st.boot.size, st.boot.perm]
sum:
  - 'Умею считать число упорядоченных бутстреп-выборок и число разбиений для перестановочного критерия.'
  - 'Умею находить $p$ как долю перестановок.'
  - 'Умею описывать алгоритм бутстрепа и перцентильного интервала.'
