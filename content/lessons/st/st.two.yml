id: st.two
int:
  - 'Сравниваем средний балл двух классов: $20$ учеников в каждом, независимые группы. А сравниваем ли «до и после курса» у тех же $20$ учеников? Это другой план: измерения одного человека связаны.'
  - {ask: 'Сравнить рост мальчиков и девочек в классе: независимые или парные данные? А давление у одних людей до и после лекарства?', ans: 'Рост: независимые выборки. Давление: парные данные, так как каждый человек измерен дважды.'}
  - 'Независимые выборки: ошибка разности $\sqrt{\mathrm{SE}_1^2+\mathrm{SE}_2^2}$. Парные: берём разность внутри пары и работаем как с одной выборкой.'
  - {ask: 'Какие данные парные: рост мальчиков и девочек или вес до и после диеты?', ans: 'Вес до и после диеты: измерения относятся к одним и тем же людям.'}
def:
  - {g: two-sample-test}
  - 'Как решать. Для независимых выборок $SE=\sqrt{\frac{s_1^2}{n_1}+\frac{s_2^2}{n_2}}$. Для парных данных вычисли разности по парам и работай как с одной выборкой. Выбери схему до анализа.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [12, 15, 20], b: [8, 10, 14]}
    q: 'Среднее первой группы $@a$, второй $@b$. Найди разность средних.'
    a: a-b
    tol: 0
    h: ['Вычти из первого второе.']
  p2:
    k: num
    lv: 2
    v: {s1: [3, 4], s2: [3, 4], n1: [9, 16], n2: [9, 16]}
    q: 'Независимые выборки: $s_1=@s1$, $n_1=@n1$ и $s_2=@s2$, $n_2=@n2$. Найди стандартную ошибку разности средних.'
    a: sqrt(s1^2/n1+s2^2/n2)
    tol: 0.002
    e: {st.two.se-diff: s1/sqrt(n1)+s2/sqrt(n2)}
    h: ['Дисперсии средних складываются.']
    sol:
      - 'Ошибки: $\mathrm{SE}_1=\frac{@s1}{\sqrt{@n1}}=@{s1/sqrt(n1):f3}$, $\mathrm{SE}_2=\frac{@s2}{\sqrt{@n2}}=@{s2/sqrt(n2):f3}$.'
      - 'Складываем квадраты ошибок.'
      - 'Квадраты: $@{(s1/sqrt(n1))^2:f3}$ и $@{(s2/sqrt(n2))^2:f3}$. Корень из суммы: $@{sqrt(s1^2/n1+s2^2/n2):f3}$.'
  p3:
    k: num
    lv: 2
    v: {sd: [2, 4, 6], s: [8, 10], n: [16, 25]}
    q: 'Измерения парные. Стандартное отклонение разностей внутри пар равно $@sd$, $n=@n$ пар (разброс отдельных измерений около $@s$). Найди стандартную ошибку средней разности.'
    a: sd/sqrt(n)
    tol: 0.002
    e: {st.two.paired-indep: sqrt(2*s^2/n)}
    h: ['Работай с разностями как с одной выборкой.']
    sol:
      - 'Парные данные: берём разности внутри пар.'
      - 'Стандартная ошибка средней разности $\frac{s_d}{\sqrt n}$.'
      - '$\frac{@sd}{\sqrt{@n}}=@{sd/sqrt(n):f3}$.'
  p4:
    k: mc
    q: 'Давление измерили у тех же $20$ человек до и после лекарства. Какой критерий нужен?'
    a: 'Парный: анализ разностей внутри пар'
    e: {st.two.paired-indep: 'Двухвыборочный для независимых выборок'}
    x: ['Критерий $\chi^2$']
    h: ['Один человек измерен дважды.']
  p5:
    k: mc
    lv: 2
    q: 'Почему стандартная ошибка разности средних равна $\sqrt{\mathrm{SE}_1^2+\mathrm{SE}_2^2}$?'
    a: 'Дисперсии независимых средних складываются, в том числе при вычитании'
    e: {st.two.se-diff: 'Стандартные ошибки складываются или вычитаются без квадратов'}
    x: ['Берут большую из двух ошибок']
    h: ['Вспомни $\operatorname{Var}(X-Y)$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $s_1=3$, $n_1=9$ и $s_2=4$, $n_2=16$. Найди стандартную ошибку разности средних.'
    steps:
      - '$\mathrm{SE}_1=\frac{3}{\sqrt9}=1$'
      - '$\mathrm{SE}_2=\frac{4}{\sqrt{16}}=1$'
      - 'Складываем квадраты ошибок: $\sqrt{1^2+1^2}$'
      - 'Ответ: $\sqrt2\approx1.41$'
    bad:
      - {i: 3, t: 'Складываем ошибки: $1+1=2$', e: st.two.se-diff}
      - {i: 2, t: '$\mathrm{SE}_2=\frac{4}{16}=0.25$'}
err: [st.two.paired-indep, st.two.se-diff]
sum:
  - 'Умею находить стандартную ошибку разности независимых средних.'
  - 'Отличаю парные данные от независимых выборок.'
  - 'Умею складывать дисперсии, а не стандартные отклонения.'
