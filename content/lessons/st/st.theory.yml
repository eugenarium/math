id: st.theory
int:
  - 'Можно ли оценить параметр сколь угодно точно? Нет: у каждой задачи есть предел точности. Его задаёт информация Фишера: чем она больше, тем меньше может быть дисперсия оценки.'
  - {ask: 'Информация одного наблюдения равна $I$. Чему равна информация $n$ независимых наблюдений?', ans: '$nI$: информация независимых наблюдений складывается.'}
  - 'Неравенство Рао–Крамера: дисперсия несмещённой оценки не меньше $\frac1{nI(\theta)}$. Оценка, достигающая границы, называется эффективной.'
def:
  - {g: fisher-information}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {p: [0.2, 0.25, 0.4, 0.5]}
    tol: 0.002
    q: 'Для $\mathrm{Bernoulli}(p)$ при $p=@{p:f2}$ найди информацию Фишера одного наблюдения $I(p)=\frac1{p(1-p)}$.'
    a: 1/(p*(1-p))
    e: {st.theory.inverse: p*(1-p)}
    h: ['Подставь $p$ в формулу.']
  p2:
    k: num
    fast: 1
    v: {p: [0.2, 0.5], n: [20, 50, 100]}
    tol: 0.0001
    q: 'Для $\mathrm{Bernoulli}(p)$ при $p=@{p:f1}$ и $n=@n$ найди границу Рао–Крамера для несмещённой оценки $p$.'
    a: p*(1-p)/n
    e: {st.theory.n: p*(1-p)}
    h: ['Граница равна $\frac1{nI(p)}$.']
    sol:
      - '$I(p)=\frac1{p(1-p)}$, для $n$ наблюдений граница $\frac1{nI(p)}=\frac{p(1-p)}{n}$.'
      - 'Подставим: $\frac{@{p:f1}\cdot@{1-p:f1}}{@n}$.'
      - 'Итог: $@{p*(1-p)/n:f4}$.'
  p3:
    k: num
    lv: 2
    v: {b: [0.04, 0.05, 0.1], f: [1.25, 2, 4]}
    tol: 0.002
    q: 'Несмещённая оценка имеет дисперсию $@{b*f:f3}$, граница Рао–Крамера равна $@{b:f3}$. Найди эффективность: границу, делённую на дисперсию.'
    a: 1/f
    e: {st.theory.inverse: f}
    sol:
      - 'Эффективность — отношение границы к дисперсии оценки.'
      - 'Подставим: $\frac{@{b:f3}}{@{b*f:f3}}$.'
      - 'Итог: $@{1/f:f3}$ (единица означает эффективную оценку).'
  p4:
    k: mc
    q: 'Неравенство Рао–Крамера оценивает'
    a: 'снизу дисперсию любой несмещённой оценки'
    e: {st.theory.biased: 'снизу дисперсию любой оценки, в том числе смещённой'}
    x: ['сверху ошибку оценки']
  p5:
    k: mc
    lv: 2
    q: 'Информация Фишера выборки из $n$ независимых наблюдений равна'
    a: '$nI(\theta)$'
    e: {st.theory.n: '$I(\theta)$, как у одного наблюдения'}
    x: ['$I(\theta)/n$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при выводе границы Рао–Крамера для $\mathrm{Bernoulli}(p)$.'
    steps:
      - 'Информация одного наблюдения $I(p)=\frac1{p(1-p)}$'
      - 'Для $n$ наблюдений $I_n=\frac{n}{p(1-p)}$'
      - 'Граница $\mathrm{Var}\hat p\ge\frac{p(1-p)}n$'
      - 'Выборочная доля имеет дисперсию $\frac{p(1-p)}n$, то есть достигает границы'
    bad:
      - {i: 2, t: 'Для $n$ наблюдений $I_n=\frac1{p(1-p)}$', e: st.theory.n}
      - {i: 3, t: 'Граница $\mathrm{Var}\hat p\ge\frac1{p(1-p)}$', e: st.theory.inverse}
err: [st.theory.inverse, st.theory.n, st.theory.biased]
sum:
  - 'Умею находить информацию Фишера для распределения Бернулли.'
  - 'Умею находить границу Рао–Крамера для $n$ наблюдений и эффективность оценки.'
  - 'Умею объяснять, что граница относится к несмещённым оценкам.'
