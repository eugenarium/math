id: st.bayes
int:
  - 'Монетка может быть нечестной. Прежде чем бросать, мы считаем, что вероятность орла вокруг $\frac12$. После данных мнение меняется. Байесовский вывод превращает прежнее мнение и данные в новое.'
  - {ask: 'Априорное $\mathrm{Beta}(2,2)$, в $10$ бросках $7$ орлов. Каковы параметры апостериорного распределения?', ans: '$\mathrm{Beta}(2+7,\ 2+3)=\mathrm{Beta}(9,5)$: к первому параметру прибавляем успехи, ко второму — неудачи.'}
  - 'Апостериорное пропорционально произведению правдоподобия и априорного. Для Beta и биномиальных данных получается снова Beta.'
  - {ask: 'Что даст апостериорное $\mathrm{Beta}(1,1)$ при $k=0$, $n=0$?', ans: 'Равномерное распределение: данных нет, остаётся априорное.'}
def:
  - {g: bayesian-inference}
  - 'Как решать. Запиши априорное $\mathrm{Beta}(\alpha,\beta)$. Прибавь успехи к $\alpha$ и неудачи к $\beta$. Апостериорное среднее $\frac{\alpha+k}{\alpha+\beta+n}$ — между априорным средним и $\frac kn$.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: 1..3, k: [2, 3, 4, 6, 7, 8]}
    c: ['abs((a+k)/(a+b+10)-k/10) > 0.02']
    tol: 0.002
    q: 'Априорное $\mathrm{Beta}(@a,@b)$, в $10$ испытаниях $@k$ успехов. Найди апостериорное среднее.'
    a: (a+k)/(a+b+10)
    e: {st.bayes.mean: k/10}
    h: ['Апостериорное — $\mathrm{Beta}(@{a}+@k,\ @{b}+@{10-k})$.']
  p2:
    k: num
    fast: 1
    v: {a: 1..3, b: 1..4, k: [2, 3, 4, 6, 7, 8]}
    q: 'Априорное $\mathrm{Beta}(@a,@b)$, в $10$ испытаниях $@k$ успехов. Найди второй параметр апостериорного распределения.'
    a: b+10-k
    e: {st.bayes.prior: b+k}
    h: ['Ко второму параметру прибавляют число неудач.']
    sol:
      - 'Апостериорное для $\mathrm{Beta}(@a,@b)$ — $\mathrm{Beta}(@a+k,\ @b+n-k)$.'
      - 'Неудач $10-@k=@{10-k}$.'
      - 'Итог: второй параметр $@b+@{10-k}=@{b+10-k}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..3, b: 1..3, n: [10, 20, 30]}
    tol: 0.002
    q: 'Апостериорное среднее — взвешенное среднее априорного и $k/n$. Найди вес априорного среднего при априорном $\mathrm{Beta}(@a,@b)$ и $n=@n$.'
    a: (a+b)/(a+b+n)
    e: {st.bayes.mean: n/(a+b+n)}
    sol:
      - 'Апостериорное среднее $\frac{a+k}{a+b+n}$ раскладывается на вклад априорного и данных.'
      - 'Вес априорного среднего $\frac{a+b}{a+b+n}=\frac{@{a+b}}{@{a+b+n}}$.'
      - 'Итог: $@{(a+b)/(a+b+n):f3}$.'
  p4:
    k: mc
    q: 'Апостериорное распределение пропорционально'
    a: 'произведению априорного и правдоподобия'
    e: {st.bayes.likelihood-prob: 'правдоподобию без учёта априорного'}
    x: ['сумме априорного и правдоподобия']
  p5:
    k: mc
    lv: 2
    q: 'Как меняется апостериорное среднее при росте $n$ и фиксированном $\mathrm{Beta}(2,2)$?'
    a: 'Приближается к $k/n$: вклад априорного убывает'
    e: {st.bayes.mean: 'Всегда равно среднему априорного'}
    x: ['Приближается к $\frac12$ независимо от данных']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: априорное $\mathrm{Beta}(2,2)$, данные $7$ успехов из $10$.'
    steps:
      - 'Априорное $\mathrm{Beta}(2,2)$, $k=7$, $n=10$'
      - 'Апостериорное $\mathrm{Beta}(2+7,\ 2+3)=\mathrm{Beta}(9,5)$'
      - 'Среднее $\frac9{14}\approx0.64$'
      - 'Оценка $\frac7{10}=0.7$ больше: априорное тянет оценку к $0.5$'
    bad:
      - {i: 2, t: 'Апостериорное $\mathrm{Beta}(2+7,\ 2+7)=\mathrm{Beta}(9,9)$', e: st.bayes.prior}
      - {i: 3, t: 'Среднее $\frac7{10}=0.7$: априорное не влияет', e: st.bayes.mean}
err: [st.bayes.prior, st.bayes.mean, st.bayes.likelihood-prob]
sum:
  - 'Умею находить параметры апостериорного Beta по данным.'
  - 'Умею находить апостериорное среднее и вес априорного.'
  - 'Умею объяснять, что апостериорное учитывает и данные, и априорное.'
