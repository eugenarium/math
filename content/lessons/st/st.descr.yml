id: st.descr
int:
  - 'Пять зарплат в отделе: $40, 42, 43, 45, 50$ тысяч. Среднее $44$, медиана $43$. Теперь начальник добавил в список свою зарплату в $500$ тысяч. Что случится с этими двумя числами?'
  - {ask: 'Как изменятся среднее и медиана, если к пяти значениям добавить $500$?', ans: 'Среднее подскочит с $44$ до $120$, а медиана вырастет лишь до $44$. Среднее чувствительно к выбросам, медиана — нет.'}
  - 'Описывая выборку, смотрят на центр (среднее, медиана) и разброс (дисперсия). При выбросах медиана надёжнее.'
def:
  - {g: descriptive-statistics}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..9, b: 1..9, c: 1..9}
    c: ['(a+b+c) % 3 == 0']
    q: 'Найди среднее значений $@a$, $@b$, $@c$.'
    a: (a+b+c)/3
    tol: 0
    h: ['Сумма делится на $3$.']
  p2:
    k: num
    lv: 2
    v: {a: 1..3, g1: 1..3, g2: 1..3, g3: 1..3}
    q: 'Найди медиану значений $@a$, $@{a+g1}$, $@{a+g1+g2}$, $@{a+g1+g2+g3}$.'
    a: (2*a+2*g1+g2)/2
    tol: 0
    e: {st.descr.median-even: a+g1+g2}
    h: ['Значений четыре: медиана — среднее двух средних.']
    sol:
      - 'Значения уже упорядочены. Средние два: $@{a+g1}$ и $@{a+g1+g2}$.'
      - 'Медиана — их среднее.'
      - '$\frac{@{a+g1}+@{a+g1+g2}}{2}=@{(2*a+2*g1+g2)/2}$.'
  p3:
    k: num
    lv: 2
    v: {m: 3..8, D: [10, 15, 20, 25, 30]}
    q: 'Выборка $@{m-2}, @{m-1}, @m, @{m+1}, @{m+2}$. Последнее значение заменили на $@{m+2+D}$. Найди новое среднее.'
    a: m+D/5
    tol: 0.002
    e: {st.descr.outlier: m}
    h: ['Сумма выросла на $@D$.']
    sol:
      - 'Старое среднее равно $@m$, сумма $@{5*m}$.'
      - 'Последнее значение выросло на $@D$, сумма выросла на $@D$.'
      - 'Новое среднее $\frac{@{5*m+D}}{5}=@{m+D/5}$.'
  p4:
    k: mc
    q: 'Какая характеристика устойчива к выбросам?'
    a: 'Медиана'
    e: {st.descr.outlier: 'Среднее'}
    x: ['Размах']
    h: ['Сравни, как изменятся они при замене максимума на огромное число.']
  p5:
    k: num
    lv: 2
    v: {m: 3..8, d: 1..4}
    q: 'Выборка $@{m-d}$, $@m$, $@{m+d}$. Найди выборочную дисперсию (деление на $n-1$).'
    a: d^2
    tol: 0
    h: ['Среднее равно $@m$.']
    sol:
      - 'Среднее $@m$. Отклонения: $-@d$, $0$, $@d$.'
      - 'Сумма квадратов: $@{d^2}+0+@{d^2}=@{2*d^2}$.'
      - 'Делим на $n-1=2$: $@{d^2}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: найди медиану значений $1, 3, 5, 7$.'
    steps:
      - 'Значения уже упорядочены: $1, 3, 5, 7$'
      - 'Значений чётное число: четыре'
      - 'Медиана — среднее двух средних: $\frac{3+5}{2}$'
      - 'Ответ: $4$'
    bad:
      - {i: 3, t: 'Медиана — второе по порядку значение: $3$', e: st.descr.median-even}
      - {i: 1, t: 'Значения упорядочены по убыванию: $7, 5, 3, 1$'}
err: [st.descr.outlier, st.descr.median-even]
sum:
  - 'Умею находить среднее, медиану и выборочную дисперсию.'
  - 'Знаю, что среднее чувствительно к выбросам, а медиана устойчива.'
  - 'Помню: при чётном числе значений медиана — среднее двух средних.'
