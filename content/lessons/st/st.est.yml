id: st.est
int:
  - 'Мишень: стрелок попадает кучно, но всё время левее центра. Другой стрелок разбросан вокруг центра. Кто лучше? Оценка параметра может быть сдвинутой (смещённой) и разбросанной одновременно.'
  - {ask: 'Оценка $\hat\theta$ в среднем равна $\theta+2$, а её разброс очень мал. Что хуже: сдвиг или разброс?', ans: 'Зависит от величины. Общая ошибка измеряется $\mathrm{MSE}=\mathrm{bias}^2+\mathrm{Var}$: здесь $4+\text{малое}$.'}
  - 'Выборочная дисперсия делится на $n-1$, потому что отклонения от $\bar x$ в среднем меньше, чем от настоящего $\mu$, и деление на $n$ занижало бы результат.'
def:
  - {g: point-estimate}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {Q: [12, 20, 30], n: [4, 5, 7]}
    q: 'Сумма квадратов отклонений от среднего равна $@Q$, объём выборки $@n$. Найди несмещённую выборочную дисперсию.'
    a: Q/(n-1)
    tol: 0.002
    e: {st.est.n-div: Q/n}
    h: ['Раздели на $n-1$.']
  p2:
    k: num
    lv: 2
    v: {b: [1, 2, 3], vr: [2, 3, 5]}
    q: 'Смещение оценки равно $@b$, дисперсия оценки $@vr$. Найди MSE.'
    a: b^2+vr
    tol: 0
    e: {st.est.unbiased-good: vr}
    h: ['$\mathrm{MSE}=\mathrm{bias}^2+\mathrm{Var}$.']
    sol:
      - 'Квадрат смещения: $@b^2=@{b^2}$.'
      - 'Дисперсия: $@vr$.'
      - 'Сумма $@{b^2+vr}$.'
  p3:
    k: num
    lv: 2
    v: {c: [0.8, 0.9], t: [10, 20]}
    q: 'Оценка $\hat\theta$ такова, что $E[\hat\theta]=@{c:f1}\theta$. Найди смещение при $\theta=@t$.'
    a: (c-1)*t
    tol: 0.002
    h: ['$\mathrm{bias}=E[\hat\theta]-\theta$.']
    sol:
      - 'Математическое ожидание оценки: $@{c:f1}\cdot@t=@{c*t:f1}$.'
      - 'Смещение — разность с настоящим значением $@t$.'
      - 'Получим $@{c*t:f1}-@t=@{(c-1)*t:f1}$.'
  p4:
    k: mc
    q: 'Почему выборочную дисперсию делят на $n-1$?'
    a: 'Отклонения от $\bar x$ в среднем меньше, чем от $\mu$: деление на $n-1$ это компенсирует'
    e: {st.est.n-div: 'Деление на $n$ тоже даёт несмещённую оценку'}
    x: ['Чтобы не делить на нуль при $n=1$']
    h: ['Сумма отклонений от $\bar x$ минимальна.']
  p5:
    k: mc
    lv: 2
    q: 'Несмещённая оценка всегда лучше смещённой?'
    a: 'Нет: смещённая с малой дисперсией может иметь меньшую MSE'
    e: {st.est.unbiased-good: 'Да: у несмещённой нет ошибки'}
    x: ['Да, только при больших $n$']
    h: ['Вспомни $\mathrm{MSE}=\mathrm{bias}^2+\mathrm{Var}$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: найди несмещённую выборочную дисперсию значений $2, 4, 6$.'
    steps:
      - 'Среднее $\bar x=4$'
      - 'Сумма квадратов отклонений: $4+0+4=8$'
      - 'Делим на $n-1=2$: $s^2=4$'
      - 'Ответ: $4$'
    bad:
      - {i: 3, t: 'Делим на $n=3$: $s^2\approx2.67$', e: st.est.n-div}
      - {i: 2, t: 'Сумма квадратов отклонений: $2+0+2=4$'}
err: [st.est.n-div, st.est.unbiased-good]
sum:
  - 'Умею находить несмещённую выборочную дисперсию: деление на $n-1$.'
  - 'Умею считать $\mathrm{MSE}=\mathrm{bias}^2+\mathrm{Var}$.'
  - 'Отличаю несмещённость от точности.'
