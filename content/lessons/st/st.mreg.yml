id: st.mreg
int:
  - 'Цена квартиры зависит от площади и от этажа. Две переменные удобнее записать плоскостью $\hat y=b_0+b_1x_1+b_2x_2$. Коэффициент при площади показывает вклад площади при неизменном этаже.'
  - {ask: 'В модели $\hat y=10+2x_1-3x_2$ величина $x_1$ выросла на $1$, а $x_2$ не изменилась. Как изменился прогноз?', ans: 'На $+2$. Коэффициент показывает изменение при неизменных остальных переменных.'}
  - 'В матричной записи $\hat\beta=(X^TX)^{-1}X^Ty$, и первый столбец $X$ — единицы: он отвечает за свободный член.'
def:
  - {g: multiple-regression}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {b0: 1..5, b1: 2..4, b2: [-3, -2, -1, 1, 2], x1: 1..4, x2: 1..4}
    q: 'Модель $\hat y=@b0+@{b1}x_1@{b2:sc}x_2$. Найди прогноз при $x_1=@x1$, $x_2=@x2$.'
    a: b0+b1*x1+b2*x2
    h: ['Подставь оба значения в уравнение.']
  p2:
    k: num
    v: {b1: 2..4, b2: [-3, -2, -1, 1, 2], d1: 1..3, d2: 1..3}
    q: 'Модель $\hat y=5+@{b1}x_1@{b2:sc}x_2$. На сколько изменится прогноз, если $x_1$ вырастет на $@d1$, а $x_2$ — на $@d2$?'
    a: b1*d1+b2*d2
    e: {st.mreg.ceteris: b1*d1}
    sol:
      - 'Вклад $x_1$: $@b1\cdot@d1=@{b1*d1}$.'
      - 'Вклад $x_2$: $@b2\cdot@d2=@{b2*d2}$.'
      - 'Итог: $@{b1*d1}@{b2*d2:s}=@{b1*d1+b2*d2}$.'
  p3:
    k: num
    lv: 2
    v: {y1: 1..4, k: 1..3, y2: 2..9}
    q: 'Точки $x=-1,0,1$ имеют значения $y=(@y1,@y2,@{y1+2*k})$. Для матрицы $X$ со столбцами $(1,1,1)$ и $(-1,0,1)$ найди второй элемент $\hat\beta$ — наклон.'
    a: k
    sol:
      - '$X^TX=\begin{pmatrix}3&0\\0&2\end{pmatrix}$ — диагональная матрица.'
      - '$X^Ty$: вторая компонента $-@y1+@{y1+2*k}=@{2*k}$.'
      - 'Наклон $\hat\beta_1=\frac{@{2*k}}{2}=@k$.'
  p4:
    k: mc
    q: 'Что произойдёт, если в матрице $X$ не будет столбца единиц?'
    a: 'Модель не будет иметь свободного члена: прямая пройдёт через начало координат'
    e: {st.mreg.ones: 'Ничего: оценки коэффициентов не изменятся'}
    x: ['Модель станет точнее']
  p5:
    k: mc
    lv: 2
    q: 'Что происходит с $R^2$ при добавлении в модель новой переменной?'
    a: 'Не уменьшается, даже если переменная бесполезна'
    e: {st.mreg.r2: 'Растёт только если переменная полезна'}
    x: ['Всегда уменьшается']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\hat y=10+2x_1-3x_2$, оба предиктора выросли на $1$.'
    steps:
      - 'Модель: $\hat y=10+2x_1-3x_2$'
      - 'Рост $x_1$ на $1$ при неизменном $x_2$ даёт $+2$'
      - 'Рост $x_2$ на $1$ при неизменном $x_1$ даёт $-3$'
      - 'Одновременный рост обоих даёт $2-3=-1$'
    bad:
      - {i: 4, t: 'Одновременный рост обоих даёт $+2$', e: st.mreg.ceteris}
      - {i: 3, t: 'Рост $x_2$ на $1$ при неизменном $x_1$ даёт $+3$'}
err: [st.mreg.ones, st.mreg.r2, st.mreg.ceteris]
sum:
  - 'Умею строить прогноз по модели с двумя предикторами.'
  - 'Умею находить изменение прогноза, складывая вклады всех переменных.'
  - 'Умею находить МНК-оценки при диагональной матрице $X^TX$.'
  - 'Отличаю рост $R^2$ от улучшения модели.'
