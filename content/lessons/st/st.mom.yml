id: st.mom
int:
  - 'Время ожидания автобуса в среднем равно $4$ минуты по выборке. Для показательного закона среднее равно $\frac1\lambda$. Какое $\lambda$ подходит?'
  - {ask: 'Среднее по выборке равно $4$, а для $\mathrm{Exp}(\lambda)$ среднее равно $1/\lambda$. Чему равно $\hat\lambda$?', ans: '$\hat\lambda=\frac14=0.25$: приравняли $\frac1\lambda=4$ и решили уравнение.'}
  - 'Метод моментов — запиши среднее через параметр, приравняй к выборочному и реши. Это самый простой способ получить оценку.'
def:
  - {g: method-of-moments}
ex:
  - {x: p4, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {xb: [0.25, 0.5, 2, 4, 5]}
    tol: 0.002
    q: 'Выборка из $\mathrm{Exp}(\lambda)$, среднее $\bar x=@xb$. Найди оценку $\hat\lambda$ методом моментов.'
    a: 1/xb
    e: {st.mom.invert: xb}
    h: ['$E X=\frac1\lambda$.']
  p2:
    k: num
    fast: 1
    v: {xb: 2..9}
    q: 'Выборка из равномерного распределения на $[0,\theta]$, среднее $\bar x=@xb$. Найди оценку $\hat\theta$ методом моментов.'
    a: 2*xb
    e: {st.mom.half: xb}
    h: ['$E X=\frac\theta2$.']
  p3:
    k: num
    lv: 2
    v: {n: [10, 20, 50], xb: 4..9}
    tol: 0.002
    q: 'В $@n$ испытаниях Бернулли с вероятностью успеха $p$ среднее число успехов на серию равно $\bar x=@xb$, серия — $@n$ испытаний. Найди $\hat p$.'
    a: xb/n
    sol:
      - 'Для биномиальной величины $E X=np$.'
      - 'Приравняем: $@n\cdot p=@xb$.'
      - 'Решим: $\hat p=\frac{@xb}{@n}=@{xb/n:f3}$.'
  p4:
    k: num
    lv: 2
    v: {xb: 2..6, d: 1..9}
    q: 'У выборки среднее $\bar x=@xb$ и средний квадрат $m_2=@{xb^2+d}$. Найди оценку дисперсии методом моментов.'
    a: d
    e: {st.mom.raw: xb^2+d}
    sol:
      - 'Дисперсия равна $E X^2-(E X)^2$.'
      - 'Подставим выборочные моменты: $@{xb^2+d}-@{xb}^2$.'
      - 'Итог: $\hat\sigma^2=@{xb^2+d}-@{xb^2}=@d$.'
  p5:
    k: mc
    q: 'Метод моментов состоит в том, чтобы'
    a: 'приравнять выборочные моменты к теоретическим и решить уравнения'
    x: ['максимизировать вероятность выборки', 'минимизировать сумму квадратов остатков']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: выборка из равномерного на $[0,\theta]$, $\bar x=6$.'
    steps:
      - 'Для равномерного на $[0,\theta]$ среднее $E X=\theta/2$'
      - 'Приравниваем: $\theta/2=\bar x=6$'
      - 'Решаем уравнение: $\hat\theta=12$'
      - 'Максимум выборки не превышает $\theta$, поэтому $\hat\theta\ge x_{\max}$ — полезная проверка'
    bad:
      - {i: 3, t: 'Решаем уравнение: $\hat\theta=3$', e: st.mom.half}
      - {i: 2, t: 'Приравниваем: $\theta=\bar x=6$'}
err: [st.mom.invert, st.mom.half, st.mom.raw]
sum:
  - 'Умею находить оценку параметра показательного и равномерного распределений методом моментов.'
  - 'Умею оценивать дисперсию как $m_2-\bar x^2$.'
  - 'Умею проверять оценку на согласованность с данными.'
