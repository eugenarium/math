id: st.diag
int:
  - 'Регрессию строят по формуле, и она даёт прямую даже для явно изогнутых данных. Остатки показывают, где модель ошибается: если на их графике видна кривая, прямая не подходит.'
  - {ask: 'Наблюдение $y=12$, прогноз модели $\hat y=9$. Чему равен остаток?', ans: '$e=y-\hat y=12-9=3$: положительный остаток значит, что точка выше прямой.'}
  - 'Остатки, рычаг точек и связь предикторов — три проверки модели. Без них число $R^2$ ничего не гарантирует.'
  - {ask: 'Что говорит $\mathrm{VIF}=10$?', ans: 'Предиктор почти полностью объясняется остальными: оценка его коэффициента неустойчива.'}
def:
  - {g: regression-diagnostics}
  - 'Как решать. Остаток $e=y-\hat y$. Стандартизуй: $z=\frac es$; значения $|z|>2$ подозрительны. Для предикторов вычисли $\mathrm{VIF}=\frac1{1-R_j^2}$. Смотри на график остатков: кривая или воронка — повод пересмотреть модель.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..4, b: 2..3, x0: 2..5, y0: 4..30}
    c: ['y0 != a+b*x0']
    q: 'Модель $\hat y=@a+@{b}x$. Наблюдение $x=@x0$, $y=@y0$. Найди остаток $e=y-\hat y$.'
    a: y0-(a+b*x0)
    e: {st.diag.sign: (a+b*x0)-y0}
    h: ['Остаток — наблюдённое минус прогноз.']
  p2:
    k: num
    fast: 1
    v: {r2: [0.5, 0.75, 0.8, 0.9]}
    tol: 0.002
    q: 'Предиктор объясняется остальными с $R_j^2=@{r2:f2}$. Найди $\mathrm{VIF}=\frac1{1-R_j^2}$.'
    a: 1/(1-r2)
    e: {st.diag.vif: 1-r2}
    h: ['Вычти $R_j^2$ из единицы и раздели единицу на результат.']
    sol:
      - '$R_j^2=@{r2:f2}$, значит $1-R_j^2=@{1-r2:f2}$.'
      - '$\mathrm{VIF}=\frac1{@{1-r2:f2}}$.'
      - 'Итог: $@{1/(1-r2):f2}$.'
  p3:
    k: num
    lv: 2
    v: {e: [4, 6, 8, 10, 12, 20], s: [2, 4, 5]}
    tol: 0.002
    q: 'Остаток $e=@e$, оценка стандартного отклонения остатков $s=@s$. Найди стандартизованный остаток $z=e/s$.'
    a: e/s
    sol:
      - 'Стандартизованный остаток — число стандартных отклонений.'
      - 'Подставим: $z=\frac{@e}{@s}$.'
      - 'Итог: $z=@{e/s:f2}$; значения $|z|>2$ подозрительны.'
  p4:
    k: mc
    q: 'Точка лежит далеко от прямой по $y$, но у среднего значения $x$. Сильно ли она изменит наклон?'
    a: 'Нет: у неё малый рычаг, она сдвинет прямую, но почти не повернёт'
    e: {st.diag.outlier: 'Да: любой выброс сильно меняет наклон'}
    x: ['Да: она повернёт прямую сильнее остальных']
  p5:
    k: mc
    lv: 2
    q: 'Два предиктора почти полностью коррелируют. Что происходит с моделью?'
    a: 'Оценки коэффициентов неустойчивы, хотя прогноз внутри данных может быть хорошим'
    e: {st.diag.vif: 'Модель становится точнее: информации в предикторах больше'}
    x: ['Модель нельзя оценить ни при каких данных']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при разборе графика остатков, образующих $U$-образную кривую.'
    steps:
      - 'Остатки на графике идут $U$-образной кривой'
      - 'Это нарушает предположение о линейной связи'
      - 'Можно добавить слагаемое $x^2$ или преобразовать данные'
      - 'После этого остатки должны выглядеть случайным облаком вокруг нуля'
    bad:
      - {i: 3, t: 'Нужно удалить все точки с большими остатками', e: st.diag.outlier}
      - {i: 2, t: 'Это нормально: у хорошей модели остатки образуют кривую'}
err: [st.diag.sign, st.diag.vif, st.diag.outlier]
sum:
  - 'Умею находить остаток и стандартизованный остаток.'
  - 'Умею считать VIF по $R_j^2$.'
  - 'Умею объяснять, как выброс и рычаг влияют на прямую.'
