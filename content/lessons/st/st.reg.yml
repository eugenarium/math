id: st.reg
int:
  - 'Облако точек «рост — вес» вытянуто вдоль наклонной линии. Проведём прямую так, чтобы сумма квадратов отклонений была минимальной. По ней можно предсказывать вес по росту.'
  - {ask: 'Корреляция роста и веса $0.8$, разброс роста $10$ см, веса $12$ кг. Насколько в среднем вес растёт на $1$ см роста?', ans: 'Наклон $b=r\frac{s_y}{s_x}=0.8\cdot\frac{12}{10}=0.96$ кг на сантиметр.'}
  - 'Две оговорки: связь не доказывает причину, а прогноз надёжен только внутри диапазона данных.'
def:
  - {g: linear-regression}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {r: [0.5, 0.6, 0.8], sx: [2, 5], sy: [10, 20]}
    q: 'Корреляция $r=@{r:f1}$, $s_x=@sx$, $s_y=@sy$. Найди наклон $b=r\frac{s_y}{s_x}$ регрессии $y$ на $x$.'
    a: r*sy/sx
    tol: 0.002
    h: ['Подставь в формулу.']
  p2:
    k: num
    lv: 2
    v: {ym: [20, 30], b: [2, 3], xm: [3, 5]}
    q: 'Средние $\bar x=@xm$, $\bar y=@ym$, наклон $b=@b$. Найди свободный член $a=\bar y-b\bar x$.'
    a: ym-b*xm
    tol: 0
    h: ['Прямая проходит через точку $(\bar x, \bar y)$.']
    sol:
      - 'Подставим средние в уравнение $\bar y=a+b\bar x$.'
      - '$a=@ym-@b\cdot@xm$.'
      - 'Получим $a=@{ym-b*xm}$.'
  p3:
    k: num
    lv: 2
    v: {a: [1, 2], b: [2, 3], xv: [2, 4, 6]}
    q: 'Регрессия $\hat y=@a+@{b}x$, данные лежат в диапазоне $x$ от $1$ до $8$. Найди прогноз при $x=@xv$.'
    a: a+b*xv
    tol: 0
    h: ['Подставь $x$ в уравнение.']
    sol:
      - 'Подставим $x=@xv$: $@a+@b\cdot@xv$.'
      - 'Значение $x$ лежит внутри диапазона данных.'
      - 'Прогноз $@{a+b*xv}$.'
  p4:
    k: mc
    q: 'Корреляция между продажами мороженого и числом утоплений равна $0.9$. Какой вывод верен?'
    a: 'Связь есть, но причинность не доказана: возможна общая причина (жара)'
    e: {st.reg.causation: 'Мороженое вызывает утопления'}
    x: ['Связи нет']
    h: ['Что растёт летом одновременно?']
  p5:
    k: mc
    lv: 2
    q: 'Модель построена по $x$ от $20$ до $40$. Насколько надёжен прогноз при $x=100$?'
    a: 'Ненадёжен: вне диапазона данных линейность не проверена'
    e: {st.reg.extrapolate: 'Так же надёжен, как и внутри диапазона'}
    x: ['Прогноз невозможно вычислить']
    h: ['Формула считается всегда, вопрос в надёжности.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\hat y=2+3x$, данные лежат в диапазоне $x$ от $1$ до $8$. Найди прогноз при $x=4$.'
    steps:
      - 'Модель описывает связь, а не причину изменений'
      - 'Подставим $x=4$: $\hat y=2+3\cdot4$'
      - '$\hat y=14$'
      - 'Значение $x=4$ внутри диапазона данных, прогноз допустим'
    bad:
      - {i: 1, t: 'Модель показывает, что $x$ вызывает изменение $y$', e: st.reg.causation}
      - {i: 4, t: 'Так же надёжно прогнозировать и для $x=100$, вне диапазона данных', e: st.reg.extrapolate}
err: [st.reg.causation, st.reg.extrapolate]
sum:
  - 'Умею находить наклон $b=r\frac{s_y}{s_x}$ и свободный член $a=\bar y-b\bar x$.'
  - 'Умею строить прогноз внутри диапазона данных.'
  - 'Отличаю связь от причины и умею избегать экстраполяции.'
