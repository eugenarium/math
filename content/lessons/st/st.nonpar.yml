id: st.nonpar
int:
  - 'Времена прохождения теста у двух групп: у одной есть один сильный выброс. Среднее и $t$-критерий поймут его неверно. Если заменить значения их местами по порядку (рангами), выброс перестаёт мешать.'
  - {ask: 'У пяти значений рангов $1,2,3,4,5$. Чему равна их сумма?', ans: '$15=\frac{5\cdot6}{2}$. Для $N$ значений сумма рангов равна $\frac{N(N+1)}2$.'}
  - 'Ранговые критерии сравнивают порядок значений: у кого наблюдения «выше». Одинаковым значениям дают средний ранг.'
def:
  - {g: rank-tests}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {N: 6..12}
    q: 'Найди сумму рангов для $@N$ наблюдений без совпадений.'
    a: N*(N+1)/2
    e: {st.nonpar.rank-sum: N*(N-1)/2}
    h: ['Ранги — числа $1,2,\dots,@N$.']
  p2:
    k: num
    fast: 1
    v: {t: 1..4}
    tol: 0.002
    q: 'Среди $6$ значений два одинаковых занимают в упорядоченном ряду места $@t$ и $@{t+1}$. Какой ранг получает каждое?'
    a: t+0.5
    e: {st.nonpar.ties: t}
    h: ['Возьми среднее двух мест.']
    sol:
      - 'Одинаковые значения делят места $@t$ и $@{t+1}$.'
      - 'Ранг — среднее этих мест: $\frac{@t+@{t+1}}2$.'
      - 'Итог: $@{t+0.5:f1}$.'
  p3:
    k: num
    lv: 2
    v: {n1: [4, 5, 6], ex: 3..9}
    q: 'В критерии Манна–Уитни первая группа ($n_1=@n1$) имеет сумму рангов $R_1=@{n1*(n1+1)/2+ex}$. Найди $U_1=R_1-\frac{n_1(n_1+1)}2$.'
    a: ex
    e: {st.nonpar.rank-sum: n1*(n1+1)/2+ex}
    sol:
      - 'Минимальная сумма рангов группы из $@n1$ равна $\frac{@n1\cdot@{n1+1}}2=@{n1*(n1+1)/2}$.'
      - 'Вычтем её из $R_1$: $@{n1*(n1+1)/2+ex}-@{n1*(n1+1)/2}$.'
      - 'Итог: $U_1=@ex$.'
  p4:
    k: mc
    q: 'Критерий Манна–Уитни проверяет'
    a: 'склонность одной группы давать значения выше другой (сдвиг распределений)'
    e: {st.nonpar.mean: 'равенство средних значений напрямую'}
    x: ['равенство дисперсий']
  p5:
    k: mc
    lv: 2
    q: 'Когда ранговый критерий предпочтительнее $t$-критерия?'
    a: 'Выборка мала, есть выбросы или сильная асимметрия'
    x: ['Выборка большая и данные нормальные', 'Всегда: он мощнее']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: ранги значений $5,3,8,3,9$.'
    steps:
      - 'Упорядочим: $3,3,5,8,9$'
      - 'Две тройки занимают места $1$ и $2$: каждая получает ранг $1.5$'
      - 'Остальные ранги: $5\to3$, $8\to4$, $9\to5$'
      - 'Сумма рангов $1.5+1.5+3+4+5=15$, как и $\frac{5\cdot6}2$'
    bad:
      - {i: 2, t: 'Две тройки получают ранги $1$ и $2$ по порядку появления', e: st.nonpar.ties}
      - {i: 4, t: 'Сумма рангов $1.5+1.5+3+4+5=14.5$'}
err: [st.nonpar.rank-sum, st.nonpar.ties, st.nonpar.mean]
sum:
  - 'Умею находить сумму рангов и ранг при совпадениях.'
  - 'Умею находить статистику $U$ по сумме рангов.'
  - 'Умею объяснять, когда ранговый критерий лучше $t$-критерия.'
