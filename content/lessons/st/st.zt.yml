id: st.zt
int:
  - 'Производитель утверждает, что батарейка живёт в среднем $100$ часов. Проверили $25$ штук: среднее $96$. Много ли это отличается от $100$, учитывая разброс? Ответ даёт $t$-статистика: отклонение, измеренное в стандартных ошибках.'
  - {ask: 'Если стандартная ошибка среднего равна $2$ часа, на сколько ошибок среднее $96$ ниже заявленного $100$?', ans: 'На $\frac{96-100}{2}=-2$ ошибки. Если критическое значение $1{,}96$, то при двустороннем критерии $H_0$ отвергается.'}
  - 'Для одностороннего критерия важен знак: если альтернатива «батарейки живут дольше», то отрицательное $t$ не свидетельствует в её пользу.'
def:
  - {g: one-sample-test}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {d: [2, 4, 6, -2], se: [1, 2, 4]}
    q: 'Выборочное среднее отличается от $\mu_0$ на $@d$, стандартная ошибка равна $@se$. Найди статистику $t$.'
    a: d/se
    tol: 0.002
    h: ['$t=\frac{\bar x-\mu_0}{\mathrm{SE}}$.']
  p2:
    k: num
    lv: 2
    v: {d: [2, 4, 6], s: [5, 10], n: [25, 100]}
    q: 'Среднее выше $\mu_0$ на $@d$, выборочное $s=@s$, $n=@n$. Найди $t=\frac{\bar x-\mu_0}{s/\sqrt n}$.'
    a: d*sqrt(n)/s
    tol: 0.002
    e: {st.samp.sd-se: d/s}
    h: ['В знаменателе стандартная ошибка, а не $s$.']
    sol:
      - 'Стандартная ошибка $\frac{@s}{\sqrt{@n}}=@{s/sqrt(n)}$.'
      - 'Отклонение среднего: $@d$.'
      - '$t=\frac{@d}{@{s/sqrt(n)}}=@{d*sqrt(n)/s:f2}$.'
  p3:
    k: mc
    lv: 2
    q: 'Двусторонний критерий, $\alpha=0{,}05$, критическое значение $1{,}96$, получено $z=-2{,}3$. Какое решение?'
    a: 'Отвергаем $H_0$: $|z|=2{,}3>1{,}96$'
    e: {st.zt.sign: 'Не отвергаем: $z$ отрицательно'}
    x: ['Не отвергаем $H_0$ и считаем её доказанной']
    h: ['В двустороннем критерии сравнивают модуль $z$ с критическим значением.']
  p4:
    k: mc
    q: 'Односторонний критерий $H_1:\mu>\mu_0$, получено $z=-2{,}5$. Какой вывод?'
    a: 'Не отвергаем $H_0$: отклонение в сторону, противоположную $H_1$'
    e: {st.zt.sign: 'Отвергаем $H_0$, так как $|z|>1{,}645$'}
    x: ['Отвергаем $H_0$ только при $\alpha=0{,}01$']
    h: ['Альтернатива утверждает рост.']
  p5:
    k: num
    lv: 2
    v: {mu0: [50, 100], s: [10, 20], n: [25, 100]}
    q: 'Проверяют $H_0:\mu=@mu0$ при $\sigma=@s$, $n=@n$. Найди значение $\bar x$, выше которого односторонний критерий уровня $0{,}025$ (критическое $z=1{,}96$) отвергает $H_0$.'
    a: mu0+1.96*s/sqrt(n)
    tol: 0.02
    e: {st.samp.sd-se: 'mu0+1.96*s'}
    h: ['Граница: $\mu_0+1{,}96\cdot\frac{\sigma}{\sqrt n}$.']
    sol:
      - 'Стандартная ошибка $\frac{@s}{\sqrt{@n}}=@{s/sqrt(n)}$.'
      - 'Добавка: $1{,}96\cdot@{s/sqrt(n)}=@{1.96*s/sqrt(n):f2}$.'
      - 'Граница $@mu0+@{1.96*s/sqrt(n):f2}=@{mu0+1.96*s/sqrt(n):f2}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: односторонний критерий $H_1:\mu>\mu_0$, $z=-2{,}3$, критическое значение $1{,}645$.'
    steps:
      - 'Альтернатива утверждает, что среднее больше $\mu_0$'
      - 'Статистика $z=-2{,}3$ отрицательна: среднее ниже $\mu_0$'
      - 'Отклонение идёт против $H_1$, и $z<1{,}645$'
      - 'Не отвергаем $H_0$'
    bad:
      - {i: 4, t: 'Отвергаем $H_0$, так как $|z|=2{,}3>1{,}645$', e: st.zt.sign}
      - {i: 2, t: 'Статистика $z=-2{,}3$ положительна: среднее выше $\mu_0$'}
err: [st.zt.sign, st.samp.sd-se]
sum:
  - 'Умею вычислять $t=\frac{\bar x-\mu_0}{s/\sqrt n}$ и находить границу критической области.'
  - 'Учитываю знак статистики в одностороннем критерии.'
  - 'Не путаю $s$ и стандартную ошибку $\frac{s}{\sqrt n}$.'
