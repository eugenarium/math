id: st.mult
int:
  - 'Проверили $20$ ни на что не влияющих показателей на уровне $0.05$. Один из них оказался «значимым». Это не открытие, а ожидаемая случайность.'
  - {ask: 'Сколько ложных значимостей в среднем среди $20$ верных нулевых гипотез при $\alpha=0.05$?', ans: 'Одна: $20\cdot0.05=1$. А вероятность хотя бы одной около $0.64$.'}
  - 'Чем больше проверок, тем выше вероятность случайной значимости. Поправка Бонферрони снижает порог до $\alpha/m$.'
  - {ask: 'Сколько ложных значимостей в среднем среди $40$ верных гипотез при $\alpha=0.05$?', ans: 'Две: $40\cdot0.05=2$.'}
def:
  - {g: multiple-comparisons}
  - 'Как решать. Подсчитай число проверок $m$. Вероятность хотя бы одной ложной значимости $1-(1-\alpha)^m$. Для поправки Бонферрони дели уровень на $m$. Среди многих проверок значимая одиночка не доказывает эффект.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {m: [5, 10, 20]}
    tol: 0.002
    q: 'Проводят $@m$ независимых проверок верных нулевых гипотез на уровне $0.05$. Найди вероятность хотя бы одной ложной значимости.'
    a: 1-0.95^m
    e: {st.mult.sum: m*0.05}
    h: ['$1-(1-\alpha)^m$.']
  p2:
    k: num
    fast: 1
    v: {m: [4, 5, 10, 20]}
    tol: 0.0001
    q: 'Какой порог $p$ нужно взять для каждой из $@m$ проверок по поправке Бонферрони при общем уровне $0.05$?'
    a: 0.05/m
    e: {st.mult.bonf: 0.05*m}
    h: ['Раздели общий уровень на число проверок.']
    sol:
      - 'Бонферрони делит общий уровень на число проверок.'
      - '$\frac{0.05}{@m}$.'
      - 'Итог: $@{0.05/m:f4}$.'
  p3:
    k: num
    lv: 2
    v: {al: [0.01, 0.05, 0.1]}
    q: 'При каком наименьшем числе независимых проверок на уровне $@{al:f2}$ вероятность хотя бы одной ложной значимости превысит $0.5$?'
    a: ceil(ln(0.5)/ln(1-al))
    e: {st.mult.sum: ceil(0.5/al)}
    sol:
      - 'Нужно $1-(1-@{al:f2})^m>0.5$, то есть $(1-@{al:f2})^m<0.5$.'
      - 'Логарифмы: $m>\frac{\ln0.5}{\ln(1-@{al:f2})}=@{ln(0.5)/ln(1-al):f2}$.'
      - 'Наименьшее целое $m=@{ceil(ln(0.5)/ln(1-al))}$.'
  p4:
    k: mc
    q: 'Как поправка Бонферрони меняет порог значимости для каждой из $m$ проверок?'
    a: 'Делит уровень $\alpha$ на $m$'
    e: {st.mult.bonf: 'Умножает уровень $\alpha$ на $m$'}
    x: ['Оставляет прежним, но требует $m$ повторов']
  p5:
    k: mc
    lv: 2
    q: 'Из $20$ независимых проверок при $\alpha=0.05$ одна оказалась значимой. Что можно заключить?'
    a: 'Это ожидаемо и без реального эффекта: нужна поправка или проверка на новых данных'
    e: {st.mult.found: 'Эффект точно есть, раз результат значим'}
    x: ['Нужно провести ещё одну такую же проверку и взять лучший результат']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: проверили $20$ гипотез на уровне $0.05$, все нулевые верны.'
    steps:
      - 'Ожидаемое число ложных значимостей $20\cdot0.05=1$'
      - 'Вероятность хотя бы одной ложной значимости $1-0.95^{20}\approx0.64$'
      - 'Поэтому для каждой проверки берут порог по Бонферрони $\frac{0.05}{20}=0.0025$'
      - 'При таком пороге вероятность хотя бы одной ложной значимости не больше $0.05$'
    bad:
      - {i: 2, t: 'Вероятность хотя бы одной ложной значимости $20\cdot0.05=1$', e: st.mult.sum}
      - {i: 3, t: 'Поэтому для каждой проверки берут порог $0.05\cdot20=1$', e: st.mult.bonf}
err: [st.mult.sum, st.mult.bonf, st.mult.found]
sum:
  - 'Умею находить вероятность хотя бы одной ложной значимости при $m$ проверках.'
  - 'Умею находить порог Бонферрони $\alpha/m$.'
  - 'Умею объяснять, почему одна значимая проверка из многих не доказывает эффект.'
