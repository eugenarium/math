id: st.power
int:
  - 'Лекарство действительно работает, но на $10$ пациентах эффект не заметили. Значит ли это, что лекарство бесполезно? Не обязательно: выборка могла быть слишком маленькой, чтобы заметить настоящий эффект.'
  - {ask: 'Пусть эффект настоящий. Что повысит вероятность его заметить: больше пациентов или меньше?', ans: 'Больше. Вероятность заметить настоящий эффект называют мощностью. Она растёт с объёмом выборки и размером эффекта.'}
  - 'Мощность — это $1-\beta$, где $\beta$ — вероятность ошибки II рода. Не путай с $1-\alpha$.'
def:
  - {g: statistical-power}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {b: [0.1, 0.2, 0.3]}
    q: 'Вероятность ошибки II рода равна $@{b:f1}$. Найди мощность критерия ($\alpha=0{,}05$).'
    a: 1-b
    tol: 0.002
    e: {st.power.alpha-beta: 0.95}
    h: ['Мощность $=1-\beta$.']
  p2:
    k: num
    lv: 2
    v: {s: [5, 10], E: [1, 2, 5]}
    q: 'Каким должен быть объём выборки, чтобы погрешность $95\,\%$-го интервала (при $z\approx2$) не превышала $@E$ при $\sigma=@s$?'
    a: (2*s/E)^2
    tol: 0
    e: {st.ci.linear-n: 2*s/E}
    h: ['$n=\left(\frac{2\sigma}{E}\right)^2$.']
    sol:
      - 'Погрешность $2\cdot\frac{\sigma}{\sqrt n}\le E$.'
      - 'Отсюда $\sqrt n\ge\frac{2\cdot@s}{@E}=@{2*s/E}$.'
      - 'Значит, $n=@{(2*s/E)^2}$.'
  p3:
    k: num
    lv: 2
    v: {d: [2, 4, 5], s: [10, 20]}
    q: 'Истинное среднее выше $\mu_0$ на $@d$, стандартное отклонение $@s$. Найди размер эффекта $\frac{\mu-\mu_0}{\sigma}$.'
    a: d/s
    tol: 0.002
    h: ['Раздели разность на $\sigma$.']
    sol:
      - 'Разность средних: $@d$.'
      - 'Стандартное отклонение: $@s$.'
      - 'Размер эффекта $\frac{@d}{@s}=@{d/s:f2}$.'
  p4:
    k: mc
    q: 'Что повышает мощность критерия?'
    a: 'Увеличение объёма выборки'
    x: ['Уменьшение $\alpha$ до $0{,}001$', 'Уменьшение объёма выборки']
    h: ['Больше данных — легче заметить эффект.']
  p5:
    k: mc
    lv: 2
    q: 'При малой выборке $H_0$ не отвергнута. Какой вывод верен?'
    a: 'Мощность мала: настоящий эффект мог остаться незамеченным'
    e: {st.test.accept: 'Гипотеза $H_0$ доказана'}
    x: ['Гипотеза $H_0$ ложна']
    h: ['Отсутствие доказательств — не доказательство отсутствия.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\sigma=10$, нужна погрешность $E=2$ (при $z\approx2$). Найди объём выборки.'
    steps:
      - 'Формула: $n=\left(\frac{2\sigma}{E}\right)^2$'
      - '$\frac{2\cdot10}{2}=10$'
      - '$n=10^2=100$'
      - 'Ответ: $100$'
    bad:
      - {i: 3, t: '$n=10$', e: st.ci.linear-n}
      - {i: 2, t: '$\frac{2\cdot10}{2}=20$'}
err: [st.power.alpha-beta, st.ci.linear-n, st.test.accept]
sum:
  - 'Умею находить мощность $1-\beta$ и размер эффекта.'
  - 'Умею находить объём выборки для заданной погрешности: $n=\left(\frac{2\sigma}{E}\right)^2$.'
  - 'Знаю, что «не отвергли» при малой мощности ничего не доказывает.'
