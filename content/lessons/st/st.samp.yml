id: st.samp
int:
  - 'Измеряем рост $25$ случайных людей и считаем среднее. Повторяем с другими $25$: получаем другое среднее. Так какое число описывает, насколько среднее «скачет» от выборки к выборке?'
  - {ask: 'Рост отдельных людей разбросан со стандартным отклонением $10$ см. Что разбросано сильнее: рост человека или среднее по $25$ людям?', ans: 'Рост человека. Среднее по $25$ людям колеблется слабее: $\frac{10}{\sqrt{25}}=2$ см. Это стандартная ошибка.'}
  - 'Не путай: стандартное отклонение $\sigma$ описывает данные, стандартная ошибка $\frac{\sigma}{\sqrt n}$ — выборочное среднее.'
def:
  - {g: standard-error}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {s: [6, 12], n: [4, 9, 36]}
    q: 'Стандартное отклонение наблюдений $@s$, объём выборки $@n$. Найди стандартную ошибку среднего.'
    a: s/sqrt(n)
    tol: 0.002
    e: {st.samp.sd-se: s}
    h: ['$\mathrm{SE}=\frac{\sigma}{\sqrt n}$.']
  p2:
    k: num
    lv: 2
    v: {s: [5, 8, 10], n: [16, 25, 100]}
    q: 'По выборке из $@n$ значений найдено $s=@s$. Найди стандартную ошибку среднего.'
    a: s/sqrt(n)
    tol: 0.002
    e: {st.samp.sd-se: s}
    h: ['Раздели $s$ на $\sqrt n$.']
    sol:
      - 'Разброс данных: $s=@s$.'
      - 'Корень из объёма: $\sqrt{@n}=@{sqrt(n)}$.'
      - '$\mathrm{SE}=\frac{@s}{@{sqrt(n)}}=@{s/sqrt(n)}$.'
  p3:
    k: num
    lv: 2
    v: {k: [2, 3, 4], n: [10, 25]}
    q: 'Выборка из $@n$ значений. Во сколько раз нужно увеличить объём, чтобы стандартная ошибка уменьшилась в $@k$ раз?'
    a: k^2
    tol: 0
    e: {st.ci.linear-n: k}
    h: ['Ошибка убывает как $\frac{1}{\sqrt n}$.']
    sol:
      - 'Ошибка пропорциональна $\frac{1}{\sqrt n}$.'
      - 'Чтобы уменьшить её в $@k$ раз, $\sqrt n$ должен вырасти в $@k$ раз.'
      - 'Значит, $n$ растёт в $@k^2=@{k^2}$ раз.'
  p4:
    k: mc
    q: 'Что описывает стандартная ошибка среднего?'
    a: 'Разброс выборочных средних от выборки к выборке'
    e: {st.samp.sd-se: 'Разброс отдельных наблюдений'}
    x: ['Погрешность одного измерения']
    h: ['Это стандартное отклонение самого среднего.']
  p5:
    k: mc
    lv: 2
    q: 'Опрос $1000$ человек проводят в городе на $100$ тысяч жителей и в стране на $100$ миллионов. Что верно о точности?'
    a: 'Точность почти одинакова: важен объём выборки'
    e: {st.samp.pop-size: 'В стране точность хуже: совокупность больше'}
    x: ['В стране точность лучше']
    h: ['В формуле $\frac{\sigma}{\sqrt n}$ нет размера совокупности.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\sigma=10$, $n=25$. Найди стандартную ошибку среднего.'
    steps:
      - 'Стандартная ошибка равна $\frac{\sigma}{\sqrt n}$'
      - 'Корень из объёма: $\sqrt{25}=5$'
      - '$\frac{10}{5}=2$'
      - 'Ответ: $2$'
    bad:
      - {i: 3, t: '$\frac{10}{25}=0{,}4$', e: st.ci.linear-n}
      - {i: 4, t: 'Ответ: $10$', e: st.samp.sd-se}
err: [st.samp.sd-se, st.ci.linear-n, st.samp.pop-size]
sum:
  - 'Умею находить стандартную ошибку среднего: $\frac{\sigma}{\sqrt n}$.'
  - 'Отличаю стандартную ошибку от стандартного отклонения данных.'
  - 'Знаю, что для вдвое меньшей ошибки нужна вчетверо большая выборка.'
