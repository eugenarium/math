id: st.mle
int:
  - 'Монету бросили $10$ раз, выпало $7$ орлов. Какую вероятность орла считать наиболее правдоподобной? Попробуем $p=0{,}5$ и $p=0{,}7$ и сравним, насколько «ожидаемы» такие данные.'
  - {ask: 'При каком $p$ вероятность $7$ орлов из $10$ больше: при $0{,}5$ или при $0{,}7$?', ans: 'При $0{,}7$: $C_{10}^7\cdot0{,}7^7\cdot0{,}3^3\approx0{,}267$ против $C_{10}^7\cdot0{,}5^{10}\approx0{,}117$. Оценка максимального правдоподобия $\hat p=\frac{7}{10}$.'}
  - 'Правдоподобие $L(p)$ — вероятность данных как функция параметра. Это не вероятность параметра.'
def:
  - {g: likelihood}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [10, 20, 50], k: [3, 4, 7]}
    q: 'Среди $@n$ испытаний было $@k$ успехов. Найди оценку максимального правдоподобия вероятности успеха.'
    a: k/n
    tol: 0.002
    h: ['$\hat p=\frac kn$.']
  p2:
    k: num
    lv: 2
    v: {m: [2, 4, 5]}
    q: 'Времена ожидания показательные, их среднее равно $@m$. Найди оценку максимального правдоподобия интенсивности $\lambda$.'
    a: 1/m
    tol: 0.002
    e: {st.mle.mean-rate: m}
    h: ['Среднее показательного равно $\frac{1}{\lambda}$.']
    sol:
      - 'Для показательного распределения $\hat\lambda=\frac{n}{\sum x_i}$.'
      - 'Это $\frac{1}{\bar x}$.'
      - 'Получим $\frac{1}{@m}=@{1/m:f3}$.'
  p3:
    k: num
    lv: 2
    v: {n: [4, 5], k: [2, 3], p: [0.4, 0.5, 0.6]}
    q: 'Получено $@k$ успехов в $@n$ испытаниях. Найди значение $L(p)=p^@k(1-p)^@{n-k}$ при $p=@{p:f1}$ (без биномиального коэффициента).'
    a: p^k*(1-p)^(n-k)
    tol: 0.0005
    h: ['Подставь $p$ и $1-p$ в степени.']
    sol:
      - 'Первый множитель: $@{p:f1}^@k=@{p^k:f4}$.'
      - 'Второй множитель: $@{1-p:f1}^@{n-k}=@{(1-p)^(n-k):f4}$.'
      - 'Произведение $@{p^k*(1-p)^(n-k):f4}$.'
  p4:
    k: mc
    q: 'Что такое правдоподобие $L(\theta)$?'
    a: 'Вероятность наблюдённых данных как функция параметра'
    e: {st.mle.prob-param: 'Вероятность того, что параметр равен $\theta$'}
    x: ['Вероятность гипотезы']
    h: ['Данные фиксированы, параметр меняется.']
  p5:
    k: mc
    lv: 2
    q: 'Какое $p$ максимизирует $L(p)=p^3(1-p)^2$?'
    a: '$\frac35$'
    x: ['$\frac25$', '$\frac12$']
    h: ['Это $\frac kn$ для $3$ успехов в $5$ испытаниях.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: среднее время ожидания $4$. Найди оценку максимального правдоподобия $\lambda$ для показательного закона.'
    steps:
      - 'Для показательного закона $\hat\lambda=\frac{n}{\sum x_i}=\frac{1}{\bar x}$'
      - 'Среднее $\bar x=4$'
      - '$\hat\lambda=\frac14$'
      - 'Ответ: $0{,}25$'
    bad:
      - {i: 3, t: '$\hat\lambda=\bar x=4$', e: st.mle.mean-rate}
      - {i: 1, t: 'Правдоподобие $L(\lambda)$ — вероятность того, что $\lambda=0{,}25$', e: st.mle.prob-param}
err: [st.mle.prob-param, st.mle.mean-rate]
sum:
  - 'Умею находить оценку максимального правдоподобия: $\hat p=\frac kn$ и $\hat\lambda=\frac{1}{\bar x}$.'
  - 'Знаю, что правдоподобие — вероятность данных, а не параметра.'
