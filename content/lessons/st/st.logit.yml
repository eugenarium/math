id: st.logit
int:
  - 'Придёт ли клиент на встречу — исход «да/нет». Линейная модель для вероятности может дать $1.3$ или $-0.2$. Поэтому моделируют не вероятность, а логарифм шансов.'
  - {ask: 'Вероятность успеха $0.75$. Чему равны шансы?', ans: '$\frac{0.75}{0.25}=3$: три к одному. Шансы — не вероятность и могут превышать $1$.'}
  - 'Рост $x$ на единицу прибавляет $\beta_1$ к логарифму шансов, то есть умножает шансы на $e^{\beta_1}$.'
def:
  - {g: logistic-regression}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {p: [0.2, 0.25, 0.4, 0.6, 0.75, 0.8]}
    tol: 0.002
    q: 'Вероятность события $p=@{p:f2}$. Найди шансы $\frac{p}{1-p}$.'
    a: p/(1-p)
    e: {st.logit.odds: p}
    h: ['Раздели вероятность на вероятность противоположного события.']
  p2:
    k: num
    fast: 1
    v: {o: [1, 2, 3, 4, 9]}
    tol: 0.002
    q: 'Шансы события равны $@o:1$. Найди вероятность события.'
    a: o/(1+o)
    e: {st.logit.odds: o}
    h: ['$p=\frac{\text{шансы}}{1+\text{шансы}}$.']
    sol:
      - 'Шансы $@o:1$ означают $\frac{p}{1-p}=@o$.'
      - 'Решим: $p=\frac{@o}{1+@o}$.'
      - 'Итог: $p=@{o/(1+o):f3}$.'
  p3:
    k: num
    lv: 2
    v: {r: [2, 3], dx: 2..4}
    c: ['r*dx != r^dx']
    q: 'Рост $x$ на $1$ умножает шансы в $@r$ раза. Во сколько раз изменятся шансы при росте $x$ на $@dx$?'
    a: r^dx
    e: {st.logit.or: r*dx}
    sol:
      - 'Каждая единица $x$ умножает шансы на $@r$.'
      - 'На $@dx$ единиц приходится $@dx$ умножений: $@r^{@dx}$.'
      - 'Итог: шансы вырастут в $@{r^dx}$ раз.'
  p4:
    k: mc
    q: 'Почему для вероятности используют логит-модель, а не прямую?'
    a: 'Прямая выходит за пределы $[0,1]$'
    e: {st.logit.linear: 'Прямая не позволяет учитывать несколько переменных'}
    x: ['Логит быстрее считается']
  p5:
    k: mc
    lv: 2
    q: 'Коэффициент $\beta_1=0.7$ в логистической регрессии означает:'
    a: 'рост $x$ на $1$ прибавляет $0.7$ к логарифму шансов (шансы растут примерно вдвое)'
    e: {st.logit.or: 'рост $x$ на $1$ прибавляет $0.7$ к вероятности'}
    x: ['рост $x$ на $1$ прибавляет $0.7$ к шансам']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при интерпретации: $p=0.8$, коэффициент $\beta_1=0.7$.'
    steps:
      - 'Шансы равны $\frac{0.8}{0.2}=4$'
      - 'Логарифм шансов $\ln4\approx1.39$'
      - 'Рост $x$ на $1$ умножает шансы на $e^{0.7}\approx2$'
      - 'Шансы становятся около $8$, вероятность около $\frac89\approx0.89$'
    bad:
      - {i: 1, t: 'Шансы равны вероятности $0.8$', e: st.logit.odds}
      - {i: 3, t: 'Рост $x$ на $1$ добавляет $0.7$ к шансам', e: st.logit.or}
err: [st.logit.odds, st.logit.or, st.logit.linear]
sum:
  - 'Умею переводить вероятность в шансы и шансы в вероятность.'
  - 'Умею применять отношение шансов к росту $x$ на несколько единиц.'
  - 'Умею объяснять, зачем для вероятности используют логит.'
