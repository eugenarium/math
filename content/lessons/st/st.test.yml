id: st.test
int:
  - 'Подозрение: монета нечестная. Бросили $100$ раз, выпало $60$ орлов. Если монета честная, насколько удивительно такое число орлов? Проверка гипотезы отвечает именно на этот вопрос.'
  - {ask: 'Если бы монета была честной, получить $60$ или больше орлов из $100$ — редкость или нет?', ans: 'Это случается примерно в $3$ % серий. Это p-значение: насколько необычны данные при верной $H_0$.'}
  - 'Логика: принимаем $H_0$ за исходную, считаем $p$-значение и отвергаем $H_0$, если $p<\alpha$. Если $p$ велико, мы лишь не нашли доказательств против $H_0$.'
def:
  - {g: hypothesis-test}
  - {g: p-value}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {al: [0.01, 0.05, 0.1]}
    q: 'Проверяют $100$ верных нулевых гипотез на уровне $\alpha=@{al:f2}$. Сколько из них в среднем будет отвергнуто?'
    a: 100*al
    tol: 0.002
    h: ['Ошибка I рода случается с вероятностью $\alpha$.']
  p2:
    k: num
    lv: 2
    v: {s: [10, 20], n: [25, 100], d: [2, 4, 5]}
    q: 'Проверяют $H_0:\mu=\mu_0$ при $\sigma=@s$ и $n=@n$. Выборочное среднее выше $\mu_0$ на $@d$. Найди $z=\frac{\bar x-\mu_0}{\sigma/\sqrt n}$.'
    a: d*sqrt(n)/s
    tol: 0.002
    h: ['Раздели отклонение на стандартную ошибку.']
    sol:
      - 'Стандартная ошибка $\frac{@s}{\sqrt{@n}}=@{s/sqrt(n)}$.'
      - 'Отклонение среднего: $@d$.'
      - '$z=\frac{@d}{@{s/sqrt(n)}}=@{d*sqrt(n)/s:f2}$.'
  p3:
    k: num
    lv: 2
    v: {q: [0.01, 0.025, 0.05]}
    q: 'Для статистики $z$ вероятность $P(Z>|z|)=@{q:f3}$. Найди $p$-значение двустороннего критерия.'
    a: 2*q
    tol: 0.0005
    e: {st.test.tails: q}
    h: ['Учти оба хвоста.']
    sol:
      - 'Хвост справа: $@{q:f3}$.'
      - 'Хвост слева такой же.'
      - '$p=2\cdot@{q:f3}=@{2*q:f3}$.'
  p4:
    k: mc
    q: 'Получили $p=0{,}03$. Что это означает?'
    a: 'Если $H_0$ верна, такие или более крайние данные случаются в $3\,\%$ случаев'
    e: {st.test.p-h0: 'Вероятность того, что $H_0$ верна, равна $0{,}03$'}
    x: ['Вероятность ошибки II рода равна $0{,}03$']
    h: ['Вероятность считается при предположении $H_0$.']
  p5:
    k: mc
    lv: 2
    q: 'Получили $p=0{,}2$ при $\alpha=0{,}05$. Какой вывод верен?'
    a: 'Данных недостаточно, чтобы отвергнуть $H_0$; это не доказательство $H_0$'
    e: {st.test.accept: 'Гипотеза $H_0$ доказана'}
    x: ['Гипотеза $H_0$ ложна']
    h: ['Отсутствие доказательств против — не доказательство за.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $p=0{,}04$, $\alpha=0{,}05$. Какой вывод?'
    steps:
      - 'Сравним $p=0{,}04$ с $\alpha=0{,}05$'
      - 'Получаем $p<\alpha$'
      - 'Отвергаем $H_0$'
      - 'Это значит: данные необычны, если $H_0$ верна'
    bad:
      - {i: 4, t: 'Это значит: вероятность того, что $H_0$ верна, равна $0{,}04$', e: st.test.p-h0}
      - {i: 2, t: 'Получаем $p>\alpha$'}
err: [st.test.p-h0, st.test.accept, st.test.tails]
sum:
  - 'Умею вычислять статистику $z=\frac{\bar x-\mu_0}{\sigma/\sqrt n}$ и двустороннее $p$-значение.'
  - 'Знаю, что $p$ — не вероятность $H_0$.'
  - 'Знаю, что «не отвергли» не значит «доказали $H_0$».'
