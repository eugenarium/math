id: st.chi
int:
  - 'Игральную кость бросили $60$ раз. Честная кость даёт каждую грань примерно $10$ раз. Выпало по-разному: $6, 12, 9, 15, 8, 10$. Насколько это подозрительно? Нужна мера общего отклонения от ожидаемых частот.'
  - {ask: 'Для грани с ожидаемой частотой $10$ наблюдалось $15$. Это существенно? А если ожидалось $100$ и наблюдалось $105$?', ans: 'В первом случае отклонение $5$ при ожидании $10$ — большое, во втором $5$ при $100$ — малое. Поэтому квадрат отклонения делят на ожидаемую частоту.'}
  - 'Статистика $\chi^2=\sum\frac{(O-E)^2}{E}$ складывает такие вклады по всем категориям. Число степеней свободы $k-1$.'
def:
  - {g: chi-square-test}
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [60, 100], p: [0.25, 0.5]}
    q: 'Проверяют гипотезу: вероятность категории равна $@{p:f2}$, всего $@n$ наблюдений. Найди ожидаемую частоту категории.'
    a: n*p
    tol: 0.002
    h: ['$E=np$.']
  p2:
    k: num
    lv: 2
    v: {n: [50, 100], d: [2, 4, 6, 10]}
    q: 'Две категории равновероятны, наблюдений $@n$. Наблюдаемые частоты: $@{n/2+d}$ и $@{n/2-d}$. Найди $\chi^2$.'
    a: 4*d^2/n
    tol: 0.002
    e: {st.chi.div-e: 2*d^2}
    h: ['Ожидаемые частоты по $@{n/2}$.']
    sol:
      - 'Ожидаемые частоты $E=@{n/2}$, отклонения $\pm@d$.'
      - 'Вклад каждой категории $\frac{@{d^2}}{@{n/2}}=@{2*d^2/n:f3}$.'
      - '$\chi^2=@{4*d^2/n:f3}$.'
  p3:
    k: num
    lv: 2
    v: {k: [3, 4, 6]}
    q: 'Критерий согласия проверяет $@k$ @{k:w=категорию,категории,категорий}. Найди число степеней свободы.'
    a: k-1
    tol: 0
    e: {st.chi.df: k}
    h: ['Сумма частот фиксирована.']
    sol:
      - 'Сумма частот известна и равна объёму выборки.'
      - 'Свободно выбираются частоты лишь $@{k-1}$ категорий, последняя определяется.'
      - 'Число степеней свободы $@k-1=@{k-1}$.'
  p4:
    k: mc
    q: 'Что сравнивает статистика $\chi^2$?'
    a: 'Наблюдённые частоты с ожидаемыми при $H_0$'
    x: ['Средние двух групп', 'Дисперсии двух выборок']
    h: ['В формуле $O$ и $E$.']
  p5:
    k: mc
    lv: 2
    q: 'Можно ли подставить в формулу $\chi^2$ доли вместо частот?'
    a: 'Нет: статистика зависит от объёма выборки, нужны частоты'
    e: {st.chi.props: 'Да: доли и частоты дают одно и то же значение'}
    x: ['Да, но только при $n>100$']
    h: ['Умножь все частоты на $2$: что станет с $\chi^2$?']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: наблюдалось $30$ и $20$, ожидалось по $25$. Найди $\chi^2$ и сделай вывод ($\chi^2_{0.05}=3.84$ при $\mathrm{df}=1$).'
    steps:
      - 'Разности: $30-25=5$ и $20-25=-5$'
      - 'Квадраты, делённые на ожидаемую: $\frac{25}{25}+\frac{25}{25}$'
      - '$\chi^2=1+1=2$'
      - 'При $\mathrm{df}=1$ значение $2<3.84$: $H_0$ не отвергаем'
    bad:
      - {i: 2, t: 'Складываем квадраты разностей: $25+25=50$', e: st.chi.div-e}
      - {i: 4, t: 'При $\mathrm{df}=2$ значение $2<5.99$: $H_0$ не отвергаем', e: st.chi.df}
err: [st.chi.div-e, st.chi.df, st.chi.props]
sum:
  - 'Умею находить ожидаемые частоты и статистику $\chi^2=\sum\frac{(O-E)^2}{E}$.'
  - 'Умею находить число степеней свободы $k-1$ для критерия согласия.'
  - 'Умею подставлять в формулу частоты, а не доли.'
