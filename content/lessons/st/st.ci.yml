id: st.ci
int:
  - 'Средний рост в выборке из 25 человек — 172 см. Истинное среднее вряд ли равно ровно 172. Насколько далеко оно может быть? Вместо одной точки дадим интервал.'
  - w: ci
    d: norm
    p: {mu: 170, sigma: 10}
    n: [5, 100, 25]
    level: [0.8, 0.99, 0.95]
    kind: z
    cap: 'Каждая полоска — интервал по новой выборке. Запусти 100 выборок и сосчитай промахи'
    ask: 'Сколько интервалов из 100 не накроют истинное среднее при уровне 95 %?'
    ans: 'Около 5. Уровень доверия — доля интервалов, накрывающих параметр при многократном повторении выборки.'
  - w: ci
    d: norm
    p: {mu: 170, sigma: 10}
    n: [5, 100, 25]
    level: [0.8, 0.99, 0.95]
    kind: z
    cap: 'Подними уровень до 99 %, затем увеличь $n$. Следи за шириной интервалов'
    ask: 'Что делает интервалы шире, а что — уже?'
    ans: 'Выше уровень — интервалы шире: чтобы промахиваться реже, нужно захватывать больше. Больше $n$ — интервалы уже.'
def:
  - {g: conf-interval}
  - {g: conf-level}
  - {g: margin-error}
  - 'Случаен интервал, а не параметр: $\mu$ — фиксированное число, а границы меняются от выборки к выборке.'
ex:
  - {x: p2, seed: 5}
pr:
  p1:
    k: num
    fast: 1
    v: {s: [5, 10, 15, 20], n: [4, 16, 25, 100]}
    q: 'Известно $\sigma=@s$, объём выборки $n=@n$. Найди предельную ошибку 95 %-го интервала для среднего. Возьми $z_{0.975}=1.96$.'
    a: 1.96*s/sqrt(n)
    e:
      st.samp.sd-se: 1.96*s
      st.ci.linear-n: 1.96*s/n
    h: ['Предельная ошибка — квантиль, умноженный на стандартную ошибку $\sigma/\sqrt{n}$.']
  p2:
    k: num
    lv: 2
    v:
      xb: 40..60
      s: [4, 6, 8, 10]
      n: [16, 25, 36, 64, 100]
      L: [0.9, 0.95, 0.99]
      z: =round(norminv((1+L)/2, 0, 1), 2)
    q: 'В выборке объёма @n среднее $\bar{x}=@xb$, известно $\sigma=@s$. Найди нижнюю границу интервала уровня @{L:pc} для $\mu$. Квантиль: $z=@z$. Округли до сотых.'
    a: xb-z*s/sqrt(n)
    e: {st.samp.sd-se: xb-z*s}
    h: ['Сначала найди стандартную ошибку $\sigma/\sqrt{n}$, затем предельную ошибку.']
    sol:
      - 'Стандартная ошибка: $\mathrm{SE}=\frac{@s}{\sqrt{@n}}=@{s/sqrt(n)}$.'
      - 'Предельная ошибка: $E=@z\cdot@{s/sqrt(n)}=@{z*s/sqrt(n):f2}$.'
      - 'Интервал: $@xb\pm@{z*s/sqrt(n):f2}$, то есть от $@{xb-z*s/sqrt(n):f2}$ до $@{xb+z*s/sqrt(n):f2}$.'
      - 'Нижняя граница: $@{xb-z*s/sqrt(n):f2}$.'
  p3:
    k: num
    fast: 1
    v: {k: [2, 3, 4]}
    q: 'Во сколько раз нужно увеличить объём выборки, чтобы доверительный интервал стал в @k раза уже?'
    a: k^2
    tol: 0
    e: {st.ci.linear-n: k}
    h: ['Ширина пропорциональна $1/\sqrt{n}$.']
  p4:
    k: mc
    v: {lo: 10..40, d: 2..8, hi: =lo+d}
    q: 'По выборке построен 95 %-й доверительный интервал $(@lo, @hi)$ для среднего $\mu$. Какое утверждение верно?'
    a: 'При многократном повторении выборки около 95 % таких интервалов накроют $\mu$'
    e: {st.ci.prob-theta: '$\mu$ лежит в $(@lo, @hi)$ с вероятностью 0.95'}
    x:
      - '95 % наблюдений выборки лежат в $(@lo, @hi)$'
      - 'Среднее следующей выборки попадёт в $(@lo, @hi)$ с вероятностью 0.95'
  p5:
    k: graph
    lv: 2
    v:
      L: [0.8, 0.9, 0.95, 0.99]
      zq: =norminv((1+L)/2, 0, 1)
    q: 'Поставь границы симметрично относительно нуля так, чтобы между ними оказалась вероятность @{L:pc}.'
    w: {w: dist, d: norm, p: {mu: 0, sigma: 1}, area: [-1, 1]}
    goal: {a: [-zq, 0.08], b: [zq, 0.08]}
    h: ['Следи за значением $P$ над графиком: раздвигай границы на одинаковое расстояние.']
  p6:
    k: sim
    lv: 2
    est: 1
    v: {L: [0.8, 0.9, 0.95], n: [5, 20, 50]}
    q: 'Построй не меньше 1000 интервалов уровня @{L:pc} при $n=@n$. Какая доля интервалов накрыла истинное среднее? Ответ дай десятичной дробью.'
    w: {w: ci, d: norm, p: {mu: 50, sigma: 8}, n: n, level: L, kind: z}
    a: L
    tol: 0.05
    min: 1000
  p7:
    k: spot
    lv: 2
    q: 'Найди ошибку в построении 95 %-го интервала: $\bar{x}=50$, $\sigma=12$, $n=36$.'
    steps:
      - '$\mathrm{SE}=\frac{12}{\sqrt{36}}=2$'
      - '$E=1.96\cdot2=3.92$'
      - 'Интервал: $50\pm3.92$, то есть $(46.08,\ 53.92)$'
      - 'Вывод: метод, которым построен интервал, накрывает $\mu$ в 95 % случаев'
    bad:
      - {i: 1, t: '$\mathrm{SE}=\frac{12}{36}\approx0.33$', e: st.ci.linear-n}
      - {i: 2, t: '$E=1.96\cdot12=23.52$', e: st.samp.sd-se}
      - {i: 4, t: 'Вывод: $\mu$ лежит в $(46.08,\ 53.92)$ с вероятностью 0.95', e: st.ci.prob-theta}
err: [st.ci.prob-theta, st.ci.linear-n, st.samp.sd-se]
sum:
  - 'Умею строить z-интервал для среднего: $\bar{x}\pm z\cdot\sigma/\sqrt{n}$.'
  - 'Умею объяснять уровень доверия как долю накрывающих интервалов при повторении выборок.'
  - 'Отличаю стандартное отклонение $\sigma$ от стандартной ошибки $\sigma/\sqrt{n}$.'
  - 'Умею оценивать, как уровень доверия и объём выборки влияют на ширину интервала.'
