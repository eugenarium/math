id: st.t
int:
  - 'Интервал для среднего с множителем $1{,}96$ предполагает, что $\sigma$ известна точно. На практике её оценивают по выборке, и при малых $n$ это добавляет неопределённость. Нужен более широкий множитель.'
  - {ask: 'Выборка из $4$ значений: интервал с множителем $1{,}96$ или с большим? Почему?', ans: 'С большим. Мы оценили $\sigma$ всего по четырём значениям, оценка шумная. Множитель $t^*=3{,}18$ учитывает это.'}
  - 'Распределение Стьюдента с $n-1$ степенями свободы имеет тяжёлые хвосты. При больших $n$ множитель $t^*$ приближается к $1{,}96$.'
def:
  - {g: student-t}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [8, 10, 15]}
    q: 'Выборка из $@n$ значений. Найди число степеней свободы для интервала Стьюдента.'
    a: n-1
    tol: 0
    e: {st.t.df: n}
    h: ['Одна степень свободы тратится на оценку среднего.']
  p2:
    k: num
    lv: 2
    v: {n: [10, 16, 25], s: [4, 5, 6], t: '=tinv(0.975, n-1)'}
    q: 'Объём выборки $@n$, $s=@s$, множитель Стьюдента $t^*=@{t:f3}$. Найди погрешность $t^*\frac{s}{\sqrt n}$.'
    a: t*s/sqrt(n)
    tol: 0.01
    e: {st.t.z-for-t: 1.96*s/sqrt(n)}
    h: ['Раздели $s$ на $\sqrt n$ и умножь на $t^*$.']
    sol:
      - 'Стандартная ошибка: $\frac{@s}{\sqrt{@n}}=@{s/sqrt(n):f3}$.'
      - 'Умножим на $t^*=@{t:f3}$.'
      - 'Погрешность $@{t*s/sqrt(n):f3}$.'
  p3:
    k: num
    lv: 2
    v: {n: [10, 16, 25], s: [4, 5], t: '=tinv(0.975, n-1)'}
    q: 'Выборка из $@n$ значений, $s=@s$, $t^*=@{t:f3}$. Найди ширину $95\,\%$-го интервала для среднего.'
    a: 2*t*s/sqrt(n)
    tol: 0.01
    e: {st.t.z-for-t: '2*1.96*s/sqrt(n)'}
    h: ['Ширина равна удвоенной погрешности.']
    sol:
      - 'Погрешность: $@{t:f3}\cdot\frac{@s}{\sqrt{@n}}=@{t*s/sqrt(n):f3}$.'
      - 'Интервал идёт от $\bar x-$ погрешность до $\bar x+$ погрешность.'
      - 'Ширина $2\cdot@{t*s/sqrt(n):f3}=@{2*t*s/sqrt(n):f2}$.'
  p4:
    k: mc
    q: 'Когда нужен интервал Стьюдента, а не $z$-интервал?'
    a: 'Когда $\sigma$ неизвестна и оценивается по выборке'
    e: {st.t.z-for-t: 'Никогда: множителя $1{,}96$ хватает всегда'}
    x: ['Когда $\sigma$ известна точно']
    h: ['Оценка $s$ добавляет неопределённость.']
  p5:
    k: mc
    lv: 2
    q: 'Как меняется множитель $t^*$ с ростом числа степеней свободы?'
    a: 'Уменьшается и приближается к $1{,}96$'
    e: {st.t.z-for-t: 'Равен $1{,}96$ при любом $n$'}
    x: ['Растёт']
    h: ['При больших $n$ оценка $s$ почти точна.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\bar x=20$, $s=4$, $n=16$, $t^*=2{,}131$. Построй интервал.'
    steps:
      - 'Стандартная ошибка: $\frac{4}{\sqrt{16}}=1$'
      - 'Погрешность: $2{,}131\cdot1=2{,}131$'
      - 'Интервал: $20\pm2{,}131$'
      - 'То есть от $17{,}87$ до $22{,}13$'
    bad:
      - {i: 2, t: 'Погрешность: $1{,}96\cdot1=1{,}96$', e: st.t.z-for-t}
      - {i: 1, t: 'Стандартная ошибка: $\frac{4}{16}=0{,}25$'}
err: [st.t.z-for-t, st.t.df]
sum:
  - 'Умею находить степени свободы $n-1$ и погрешность $t^*\frac{s}{\sqrt n}$.'
  - 'Знаю, что при неизвестной $\sigma$ множитель $t^*$ больше $1{,}96$.'
