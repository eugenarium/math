id: st.anova
int:
  - 'Три группы учеников решали задачи тремя методами. Сравнивать группы попарно $t$-критерием можно, но проверок станет много. Дисперсионный анализ отвечает одним вопросом: одинаковы ли три средних?'
  - {ask: 'У трёх групп по $6$ человек. Сколько степеней свободы у разброса внутри групп?', ans: '$18-3=15$: всего $N=18$ наблюдений и $k=3$ группы.'}
  - 'Сравнивают разброс средних между группами с разбросом внутри групп. Их отношение $F$ велико, если группы заметно разнятся.'
def:
  - {g: anova}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {k: 3..5, n: 4..8}
    q: 'В ANOVA $@k$ группы по $@n$ наблюдений. Найди степени свободы внутри групп $N-k$.'
    a: k*(n-1)
    e: {st.anova.df: k*n-1}
    h: ['Всего $N=@{k*n}$ наблюдений.']
  p2:
    k: num
    v: {gm: 10..20, d: 1..3, n: 4..8}
    q: 'Три группы по $@n$ наблюдений имеют средние $@{gm-d}$, $@gm$, $@{gm+d}$. Найди $SSB=n\sum(\bar x_i-\bar x)^2$.'
    a: 2*n*d^2
    sol:
      - 'Общее среднее равно $@gm$.'
      - 'Отклонения средних от него: $-@d$, $0$, $@d$.'
      - 'Итог: $SSB=@n\cdot(@{d^2}+0+@{d^2})=@{2*n*d^2}$.'
  p3:
    k: num
    lv: 2
    v: {ssb: [20, 40, 60], ssw: [30, 45, 60, 75, 90]}
    tol: 0.002
    q: 'Три группы по $6$ человек: $SSB=@ssb$, $SSW=@ssw$. Найди $F$.'
    a: (ssb/2)/(ssw/15)
    e: {st.anova.ss-ms: ssb/ssw}
    sol:
      - 'Степени свободы: $k-1=2$ и $N-k=15$.'
      - 'Средние квадраты: $MSB=\frac{@ssb}2=@{ssb/2}$, $MSW=\frac{@ssw}{15}=@{ssw/15}$.'
      - 'Итог: $F=\frac{@{ssb/2}}{@{ssw/15}}=@{(ssb/2)/(ssw/15):f2}$.'
  p4:
    k: mc
    q: 'ANOVA показал значимое $F$. Что это означает?'
    a: 'Хотя бы одна пара средних различается'
    e: {st.anova.which: 'Все группы различаются между собой'}
    x: ['Различается конкретная пара групп']
  p5:
    k: mc
    lv: 2
    q: 'Почему три группы не сравнивают тремя $t$-критериями вместо ANOVA?'
    a: 'Растёт вероятность хотя бы одной ложной значимости'
    x: ['$t$-критерий не работает для трёх групп', 'ANOVA всегда мощнее при любых данных']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $k=3$, $n=6$, $SSB=40$, $SSW=60$.'
    steps:
      - 'Степени свободы: $k-1=2$ и $N-k=15$'
      - 'Средний квадрат между группами $MSB=\frac{40}{2}=20$'
      - 'Средний квадрат внутри групп $MSW=\frac{60}{15}=4$'
      - 'Отношение $F=\frac{20}{4}=5$'
    bad:
      - {i: 1, t: 'Степени свободы: $N-1=17$ и $N-1=17$', e: st.anova.df}
      - {i: 4, t: 'Отношение $F=\frac{SSB}{SSW}=\frac{40}{60}\approx0.67$', e: st.anova.ss-ms}
err: [st.anova.df, st.anova.ss-ms, st.anova.which]
sum:
  - 'Умею находить степени свободы ANOVA.'
  - 'Умею вычислять $SSB$ и $F=MSB/MSW$.'
  - 'Умею объяснять, что значимое $F$ не указывает, какие группы различаются.'
