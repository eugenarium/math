id: st.ab
int:
  - 'Сайт тестирует две версии кнопки. Каждый день аналитик смотрит на результаты и останавливает тест, как только видит $p<0.05$. Кажется разумным, но так «значимость» находится даже тогда, когда версии одинаковы.'
  - {ask: 'Сколько пользователей на группу нужно, чтобы заметить сдвиг $\delta=1$ при $\sigma=2$ с мощностью $80\%$ ($n=16\sigma^2/\delta^2$)?', ans: '$n=\frac{16\cdot4}{1}=64$ на группу, то есть $128$ всего.'}
  - 'План A/B-теста фиксируют до начала: метрика, уровень, объём выборки. Один просмотр в конце, и решение учитывает размер эффекта, а не только $p$.'
def:
  - {g: ab-test}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a0: [4, 5, 8, 10], d: [1, 2]}
    tol: 0.002
    q: 'Конверсия выросла с $@a0\%$ до $@{a0+d}\%$. На сколько процентов она выросла относительно исходной?'
    a: 100*d/a0
    h: ['Раздели прирост на исходное значение.']
  p2:
    k: num
    v: {s: [2, 3, 4, 5], d: [1, 2]}
    q: 'Метрика имеет $\sigma=@s$, нужно заметить сдвиг $\delta=@d$ ($\alpha=0.05$, мощность $80\%$). Сколько наблюдений нужно на каждую группу по формуле $n=\frac{16\sigma^2}{\delta^2}$?'
    a: 16*s^2/d^2
    e: {st.ab.size: 2*16*s^2/d^2}
    sol:
      - 'Подставим в формулу: $n=\frac{16\cdot@s^2}{@d^2}$.'
      - 'Числитель $16\cdot@{s^2}=@{16*s^2}$, знаменатель $@{d^2}$.'
      - 'Итог: $n=@{16*s^2/d^2}$ на группу.'
  p3:
    k: num
    lv: 2
    v: {k: [3, 5, 10]}
    tol: 0.002
    q: 'Тест просматривают $@k$ раз (независимо), каждый раз на уровне $0.05$, и останавливают при первом $p<0.05$. Найди вероятность ложного результата, если версии одинаковы.'
    a: 1-0.95^k
    e: {st.ab.peek: 0.05}
    sol:
      - 'Ложного результата нет только если все $@k$ просмотров незначимы.'
      - 'Вероятность этого $0.95^{@k}=@{0.95^k:f3}$.'
      - 'Итог: $1-@{0.95^k:f3}=@{1-0.95^k:f3}$.'
  p4:
    k: mc
    q: 'Тест остановили, как только $p$ впервые стало меньше $0.05$. Что произошло с долей ложных результатов?'
    a: 'Она стала выше $5\%$'
    e: {st.ab.peek: 'Осталась $5\%$: $p<0.05$ это гарантирует'}
    x: ['Стала ниже $5\%$']
  p5:
    k: mc
    lv: 2
    q: 'Прирост статистически значим ($p=0.001$), но составляет $0.01$ процентного пункта. Что делать?'
    a: 'Оценить практическую важность: эффект может не окупить внедрение'
    e: {st.ab.practical: 'Внедрять: малое $p$ доказывает важность'}
    x: ['Отбросить результат: $p$ слишком мало']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в плане A/B-теста.'
    steps:
      - 'Заранее фиксируем метрику, уровень $\alpha=0.05$ и размер выборки'
      - 'Набираем фиксированное число пользователей в каждую группу'
      - 'Один раз сравниваем группы в конце'
      - 'Решение принимаем по $p$ и по размеру эффекта'
    bad:
      - {i: 3, t: 'Смотрим на $p$ каждый день и останавливаемся, когда оно меньше $0.05$', e: st.ab.peek}
      - {i: 4, t: 'Решение принимаем по одному $p$, размер эффекта не нужен', e: st.ab.practical}
err: [st.ab.peek, st.ab.size, st.ab.practical]
sum:
  - 'Умею оценивать объём выборки на группу для A/B-теста.'
  - 'Умею находить вероятность ложного результата при подглядывании.'
  - 'Отличаю статистическую значимость от практической важности.'
