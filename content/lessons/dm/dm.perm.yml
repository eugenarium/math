id: dm.perm
int:
  - 'Из $10$ человек нужно выбрать капитана и его заместителя. А ещё нужно выбрать пару дежурных. Ответы разные, хотя выбираем двоих. В чём разница?'
  - {ask: 'Сколько способов выбрать капитана и заместителя из $10$? Сколько способов выбрать двух дежурных?', ans: 'Капитан и заместитель: $10\cdot9=90$ (порядок важен). Дежурные: $\frac{10\cdot9}{2}=45$ (порядок не важен).'}
  - 'Размещения учитывают порядок, сочетания нет. Из размещений получаются сочетания делением на число перестановок выбранных: $k!$.'
def:
  - {g: permutations}
  - {g: combinations}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 3..6}
    q: 'Сколькими способами можно выстроить в очередь $@n$ разных людей?'
    a: factorial(n)
    tol: 0
    h: ['Перестановок $n$ элементов $n!$.']
  p2:
    k: num
    lv: 2
    v: {n: 5..9, k: 2..3}
    q: 'Сколькими способами выбрать $@k$ человек из $@n$ (порядок не важен)?'
    a: C(n,k)
    tol: 0
    e: {dm.perm.order: 'A(n,k)'}
    h: ['$C_n^k=\frac{n!}{k!\,(n-k)!}$.']
    sol:
      - 'Размещений из $@n$ по $@k$: $A=@{A(n,k)}$.'
      - 'Порядок не важен: делим на $@k!=@{factorial(k)}$.'
      - 'Сочетаний $@{C(n,k)}$.'
  p3:
    k: num
    lv: 2
    v: {n: 5..7, k: 2..3}
    q: 'Сколько различных расстановок $@n$ шаров в ряд, если $@k$ из них одинаковые красные, а остальные все разные?'
    a: factorial(n)/factorial(k)
    tol: 0
    e: {dm.perm.repeat: 'factorial(n)'}
    h: ['Обмен одинаковых шаров не меняет расстановку.']
    sol:
      - 'Если все шары считать разными, получится $@n!=@{factorial(n)}$ расстановок.'
      - 'Каждая расстановка посчитана $@k!=@{factorial(k)}$ раз: перестановки одинаковых.'
      - 'Различных расстановок $\frac{@{factorial(n)}}{@{factorial(k)}}=@{factorial(n)/factorial(k)}$.'
  p4:
    k: mc
    q: 'Из $10$ человек выбирают капитана и заместителя. Что это?'
    a: 'Размещения: порядок важен'
    e: {dm.perm.order: 'Сочетания: порядок не важен'}
    x: ['Перестановки всех $10$ человек']
    h: ['Капитан и заместитель — разные роли.']
  p5:
    k: num
    lv: 2
    v: {n: 5..9}
    q: 'Каждый из $@n$ человек пожал руку каждому другому по одному разу. Сколько было рукопожатий?'
    a: C(n,2)
    tol: 0
    e: {dm.perm.order: 'n*(n-1)'}
    h: ['Рукопожатие $A$–$B$ то же, что $B$–$A$.']
    sol:
      - 'Упорядоченных пар: $@n\cdot@{n-1}=@{n*(n-1)}$.'
      - 'Каждая пара посчитана дважды, делим на $2$.'
      - 'Рукопожатий $@{C(n,2)}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: сколькими способами выбрать $2$ человека из $6$?'
    steps:
      - 'Порядок не важен: это сочетания'
      - '$C_6^2=\frac{6!}{2!\,4!}$'
      - '$C_6^2=\frac{6\cdot5}{2}=15$'
      - 'Ответ: $15$'
    bad:
      - {i: 3, t: '$C_6^2=6\cdot5=30$', e: dm.perm.order}
      - {i: 1, t: 'Порядок важен: это размещения', e: dm.perm.order}
err: [dm.perm.order, dm.perm.repeat]
sum:
  - 'Умею отличать размещения (порядок важен) от сочетаний.'
  - 'Умею делить на $k!$ при одинаковых элементах.'
