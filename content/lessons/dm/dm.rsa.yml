id: dm.rsa
int:
  - 'Перемножить два больших простых числа легко. Разложить произведение обратно очень трудно. На этой разнице держится шифр RSA.'
  - {ask: 'Сколько чисел от $1$ до $14$ взаимно просты с $15=3\cdot5$?', ans: 'Восемь: это $(3-1)(5-1)=8$. Исключаются кратные $3$ и кратные $5$.'}
  - 'Теорема Эйлера: $a^{\varphi(n)}\equiv1\pmod n$. Из неё следует, что степени $e$ и $d$ с $ed\equiv1\pmod{\varphi(n)}$ обращают друг друга.'
def:
  - {g: fermat-euler}
  - {g: rsa}
ex:
  - {x: p3, seed: 1}
pr:
  p1:
    k: num
    fast: 1
    v: {p: [5, 7, 11, 13]}
    q: 'Найди $\varphi(@p)$ для простого $@p$.'
    a: p-1
    e: {dm.rsa.phi: p}
    h: ['У числа $@p$ нет общих делителей с числами $1,\dots,@{p-1}$.']
  p2:
    k: num
    fast: 1
    v: {p: [3, 5, 7], q: [11, 13]}
    q: 'Найди $\varphi(n)$ для $n=@p\cdot@q$.'
    a: (p-1)*(q-1)
    e: {dm.rsa.phi: p*q-1}
    h: ['$\varphi(pq)=(p-1)(q-1)$.']
  p3:
    k: num
    lv: 2
    v: {m: [2, 4, 7, 8]}
    q: 'В игрушечном RSA $n=15$, $e=3$. Зашифруй сообщение $m=@m$: найди $c=m^e\bmod n$.'
    a: mod(m^3,15)
    e: {dm.rsa.mul: 'mod(m*3, 15)'}
    sol:
      - 'Возводим в степень $e=3$: $@m^3=@{m^3}$.'
      - 'Делим на $n=15$: $@{m^3}=@{floor(m^3/15)}\cdot15+@{mod(m^3,15)}$.'
      - 'Итог: $c=@{mod(m^3,15)}$.'
  p4:
    k: mc
    q: 'Чтобы расшифровать сообщение в RSA, нужно возвести шифр в степень'
    a: 'секретного показателя $d$'
    e: {dm.rsa.private: 'открытого показателя $e$'}
    x: ['числа $\varphi(n)$']
  p5:
    k: mc
    lv: 2
    q: 'Почему RSA с $n=15$ нельзя использовать на практике?'
    a: 'Число $15$ мгновенно раскладывается на простые множители'
    x: ['Нельзя возводить в степень по модулю', 'Показатель $e$ слишком большой']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при выборе секретного показателя для $n=15$, $e=3$.'
    steps:
      - '$n=3\cdot5=15$'
      - '$\varphi(n)=(3-1)(5-1)=8$'
      - 'Секретный $d$: $3d\equiv1\pmod8$, подходит $d=3$'
      - 'Проверка: $3\cdot3=9\equiv1\pmod8$'
    bad:
      - {i: 2, t: '$\varphi(n)=15-1=14$', e: dm.rsa.phi}
      - {i: 4, t: 'Проверка: $3\cdot3=9\equiv1\pmod{15}$'}
err: [dm.rsa.phi, dm.rsa.private, dm.rsa.mul]
sum:
  - 'Умею считать $\varphi(p)$ и $\varphi(pq)$.'
  - 'Умею шифровать в игрушечном RSA возведением в степень по модулю.'
  - 'Отличаю открытый показатель $e$ от секретного $d$.'
