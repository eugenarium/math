id: dm.incl
int:
  - 'В классе $20$ человек. $12$ любят шахматы, $9$ — шашки, а $5$ — оба. Сколько любят хотя бы одну игру? Сложение $12+9$ даст $21$, а учеников всего $20$.'
  - {ask: 'Почему $12+9$ — слишком много, и как это исправить?', ans: 'Пятеро, любящие обе игры, сосчитаны дважды. Вычтем их один раз: $12+9-5=16$.'}
  - 'Формула включений–исключений: складываем размеры множеств, вычитаем пересечения, для трёх множеств возвращаем тройное пересечение.'
  - {ask: 'Сколько человек в классе, если $10$ учат английский, $8$ немецкий, $3$ оба и все учат хотя бы один?', ans: '$15$: $10+8-3=15$.'}
def:
  - {g: inclusion-exclusion}
  - 'Как решать. Для двух множеств $|A\cup B|=|A|+|B|-|A\cap B|$. Для трёх — добавь поправки: вычти попарные пересечения, прибавь тройное. «Ни в одном» — вычитай объединение из общего числа.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 8..15, b: 6..12, c: 2..5}
    q: 'В множестве $A$ $@a$ элементов, в $B$ — $@b$, а в пересечении $A\cap B$ — $@c$. Сколько элементов в $A\cup B$?'
    a: a+b-c
    tol: 0
    e: {dm.incl.double: a+b}
    h: ['$|A\cup B|=|A|+|B|-|A\cap B|$.']
  p2:
    k: num
    lv: 2
    v: {N: 30..40, a: 12..18, b: 10..15, c: 3..6}
    q: 'В классе $@N$ @{N:w=человек,человека,человек}. Английский учат $@a$, немецкий — $@b$, оба — $@c$. Сколько человек не учат ни одного из языков?'
    a: N-(a+b-c)
    tol: 0
    e: {dm.incl.double: 'N-(a+b)'}
    h: ['Сначала найди число изучающих хотя бы один язык.']
    sol:
      - 'Хотя бы один язык: $@a+@b-@c=@{a+b-c}$.'
      - 'Ни одного: $@N-@{a+b-c}$.'
      - 'Ответ: $@{N-(a+b-c)}$.'
  p3:
    k: num
    lv: 2
    v: {a: 8..12, b: 8..12, c: 8..12, u: 3..5, w: 3..5, z: 3..5, t: 1..2}
    q: 'В $A$ $@a$ элементов, в $B$ — $@b$, в $C$ — $@c$. В $A\cap B$ — $@u$, в $A\cap C$ — $@w$, в $B\cap C$ — $@z$, в $A\cap B\cap C$ — $@t$. Сколько элементов в $A\cup B\cup C$?'
    a: a+b+c-u-w-z+t
    tol: 0
    e: {dm.incl.triple: a+b+c-u-w-z}
    h: ['Последнее слагаемое — тройное пересечение со знаком плюс.']
    sol:
      - 'Сумма размеров: $@a+@b+@c=@{a+b+c}$.'
      - 'Вычтем попарные пересечения: $@{a+b+c}-@u-@w-@z=@{a+b+c-u-w-z}$.'
      - 'Вернём тройное: $+@t$. Итог $@{a+b+c-u-w-z+t}$.'
  p4:
    k: mc
    q: 'Сколько чисел от $1$ до $30$ делятся на $2$ или на $3$?'
    a: '$20$'
    e: {dm.incl.double: '$25$'}
    x: ['$5$']
    h: ['Кратных $2$ — $15$, кратных $3$ — $10$, кратных $6$ — $5$.']
  p5:
    k: num
    lv: 2
    v: {k: 3..8}
    q: 'Сколько чисел от $1$ до $@{6*k}$ делятся на $2$ или на $3$?'
    a: 4*k
    tol: 0
    e: {dm.incl.double: 5*k}
    h: ['Кратные $6$ посчитаны и среди кратных $2$, и среди кратных $3$.']
    sol:
      - 'Кратных $2$: $@{3*k}$, кратных $3$: $@{2*k}$.'
      - 'Кратных $6$ (в обоих): $@k$.'
      - 'По формуле: $@{3*k}+@{2*k}-@k=@{4*k}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $|A|=10$, $|B|=7$, $|A\cap B|=3$. Сколько элементов в $A\cup B$?'
    steps:
      - '$|A\cup B|=|A|+|B|-|A\cap B|$'
      - 'Подставим: $10+7-3$'
      - 'Получим $14$'
      - 'В объединении $14$ элементов'
    bad:
      - {i: 2, t: 'Подставим: $10+7$', e: dm.incl.double}
      - {i: 3, t: 'Получим $12$'}
err: [dm.incl.double, dm.incl.triple]
sum:
  - 'Умею считать $|A\cup B|=|A|+|B|-|A\cap B|$.'
  - 'Умею считать объединение трёх множеств, включая тройное пересечение.'
