id: dm.mod
int:
  - 'Часы показывают 9, прошло 5 часов — стрелка на 2. Мы считали «по модулю 12»: числа, различающиеся на кратное 12, считаются одним и тем же.'
  - {ask: 'Какой остаток даёт $-3$ при делении на $7$ (остаток от $0$ до $6$)?', ans: '$4$: $-3+7=4$, числа $-3$ и $4$ отличаются на $7$.'}
  - 'В арифметике остатков можно складывать и умножать. Делить можно только на число, взаимно простое с модулем: оно имеет обратное.'
def:
  - {g: congruence}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {m: 5..9, a: 1..4}
    q: 'Найди остаток от деления $@{-a}$ на $@m$ (число от $0$ до $@{m-1}$).'
    a: m-a
    e: {dm.mod.negative: -a}
    h: ['Прибавь $@m$ к $@{-a}$.']
  p2:
    k: num
    fast: 1
    v: {p: [7, 11, 13], a: 2..4}
    q: 'Найди число $b$ от $1$ до $@{p-1}$, для которого $@a\cdot b\equiv1\pmod{@p}$.'
    a: mod(a^(p-2),p)
    e: {dm.mod.inverse-neg: p-a}
    h: ['Перебери $b$: произведение $@a b$ должно давать остаток $1$.']
    sol:
      - 'Нужно $@a\cdot b\equiv1\pmod{@p}$: перебираем $b=1,2,\dots$'
      - 'Подходит $b=@{mod(a^(p-2),p)}$: $@a\cdot@{mod(a^(p-2),p)}=@{a*mod(a^(p-2),p)}$.'
      - 'Остаток от деления $@{a*mod(a^(p-2),p)}$ на $@p$ равен $1$, итог $b=@{mod(a^(p-2),p)}$.'
  p3:
    k: num
    lv: 2
    v: {m: [7, 11], a: 2..4, x0: 2..6, b: '=mod(a*x0, m)'}
    c: ['a*x0 > m']
    q: 'Реши $@a x\equiv@b\pmod{@m}$. Найди $x$ от $0$ до $@{m-1}$.'
    a: x0
    sol:
      - 'Найдём $a^{-1}$: число $u$ с $@a u\equiv1\pmod{@m}$, оно равно $@{mod(a^(m-2),m)}$.'
      - 'Умножим обе части на него: $x\equiv@b\cdot@{mod(a^(m-2),m)}=@{b*mod(a^(m-2),m)}$.'
      - 'Остаток по модулю $@m$: $x\equiv@x0$.'
  p4:
    k: mc
    q: 'Существует ли число $b$ с $6b\equiv1\pmod9$?'
    a: 'Нет: $\gcd(6,9)=3\ne1$'
    e: {dm.mod.noncoprime: 'Да: обратное всегда существует'}
    x: ['Да: $b=5$']
    h: ['Левая часть $6b$ всегда кратна $3$.']
  p5:
    k: mc
    lv: 2
    q: 'Решим $6x\equiv6\pmod9$. Можно ли сократить на $6$ и получить $x\equiv1\pmod9$?'
    a: 'Нет: решения $x\equiv1\pmod3$, то есть $1,4,7$ по модулю $9$'
    e: {dm.mod.noncoprime: 'Да: $x\equiv1\pmod9$'}
    x: ['Нет: решений нет']
    h: ['Проверь $x=4$: $6\cdot4=24=2\cdot9+6$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при решении $3x\equiv4\pmod7$.'
    steps:
      - 'Обратный к $3$ по модулю $7$: $3\cdot5=15\equiv1$'
      - 'Умножаем обе части на $5$: $x\equiv20$'
      - 'Приводим по модулю: $20=2\cdot7+6$, значит $x\equiv6$'
      - 'Проверка: $3\cdot6=18=2\cdot7+4\equiv4$'
    bad:
      - {i: 1, t: 'Обратный к $3$ по модулю $7$ равен $-3\equiv4$', e: dm.mod.inverse-neg}
      - {i: 3, t: 'Приводим по модулю: $20=2\cdot7+4$, значит $x\equiv4$'}
err: [dm.mod.negative, dm.mod.inverse-neg, dm.mod.noncoprime]
sum:
  - 'Умею находить остаток от деления отрицательного числа.'
  - 'Умею находить обратный по модулю и решать линейное сравнение.'
  - 'Отличаю обратный по умножению от противоположного и знаю, когда обратного нет.'
