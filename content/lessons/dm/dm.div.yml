id: dm.div
int:
  - 'Нужно разрезать прямоугольник $84\times36$ на одинаковые квадраты без остатка. Какова наибольшая сторона квадрата?'
  - {ask: 'Чему равен остаток от деления $84$ на $36$, и как он связан с общими делителями $84$ и $36$?', ans: '$84=2\cdot36+12$, остаток $12$. Всё, что делит $84$ и $36$, делит и $12$, поэтому общие делители пары $(84,36)$ те же, что у пары $(36,12)$.'}
  - 'Это алгоритм Евклида: пару $(a,b)$ заменяют парой $(b,\ a\bmod b)$, пока остаток не станет нулём. Последний ненулевой остаток — НОД.'
def:
  - {g: gcd-euclid}
ex:
  - {x: p3, seed: 2}
  - {x: p4, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {t: 2..9, m: [2, 3, 4, 5, 7], n: [3, 5, 8, 9]}
    c: ['gcd(m,n) == 1']
    q: 'Найди НОД чисел $@{t*m}$ и $@{t*n}$.'
    a: t
    h: ['Числа $@m$ и $@n$ не имеют общих делителей.']
  p2:
    k: num
    fast: 1
    v: {t: 2..9, m: [2, 3, 4, 5, 7], n: [3, 5, 8, 9]}
    c: ['gcd(m,n) == 1']
    q: 'Найди НОК чисел $@{t*m}$ и $@{t*n}$.'
    a: t*m*n
    e: {dm.div.lcm-prod: t*m*t*n}
    h: ['$\mathrm{lcm}=\dfrac{ab}{\gcd(a,b)}$.']
  p3:
    k: num
    lv: 2
    v: {t: 2..9}
    q: 'Найди НОД чисел $@{34*t}$ и $@{21*t}$ по алгоритму Евклида.'
    a: t
    sol:
      - '$@{34*t}=1\cdot@{21*t}+@{13*t}$, затем $@{21*t}=1\cdot@{13*t}+@{8*t}$.'
      - 'Остатки продолжают убывать: $@{13*t},\ @{8*t},\ @{5*t},\ @{3*t},\ @{2*t},\ @t,\ 0$.'
      - 'Последний ненулевой остаток $@t$ — это НОД.'
  p4:
    k: num
    v: {b: 5..12, q: 2..5, r: 1..4}
    c: ['q != r']
    q: 'Сделай один шаг алгоритма Евклида для пары $(@{q*b+r},@b)$. Какой остаток получился?'
    a: r
    e: {dm.div.euclid-step: q}
    sol:
      - 'Разделим с остатком: $@{q*b+r}=@q\cdot@b+@r$.'
      - 'Остаток равен $@r$: новая пара $(@b,@r)$.'
      - 'Частное $@q$ в новую пару не входит.'
  p5:
    k: mc
    q: 'Числа $8$ и $15$ взаимно просты. Значит ли это, что оба простые?'
    a: 'Нет: $8$ и $15$ составные, взаимная простота — свойство пары'
    e: {dm.div.coprime: 'Да: у них нет общих делителей'}
    x: ['Да: достаточно, чтобы одно из них было простым']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\gcd(84,36)$.'
    steps:
      - '$84=2\cdot36+12$: переходим к паре $(36,12)$'
      - '$36=3\cdot12+0$'
      - 'Последний ненулевой остаток равен $12$'
      - 'Значит, $\gcd(84,36)=12$'
    bad:
      - {i: 1, t: '$84=2\cdot36+12$: переходим к паре $(36,2)$', e: dm.div.euclid-step}
      - {i: 4, t: 'Значит, $\gcd(84,36)=36$'}
err: [dm.div.euclid-step, dm.div.lcm-prod, dm.div.coprime]
sum:
  - 'Умею находить НОД алгоритмом Евклида.'
  - 'Умею находить НОК через формулу $\gcd\cdot\mathrm{lcm}=ab$.'
  - 'Отличаю взаимно простые числа от простых.'
