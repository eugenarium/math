id: dm.bigo
int:
  - 'Алгоритм А делает $n^2$ шагов, алгоритм Б — $10n$. Для маленьких $n$ А быстрее, но при больших $n$ побеждает Б. Мелкие слагаемые и константы забываются, остаётся порядок роста.'
  - {w: fplot, f: [x^2, 10*x, 2^x], x: [0, 12], y: [0, 150], cap: 'Сравни три кривые: квадрат, линейная $10x$ и показательная $2^x$. Кто выигрывает при больших $x$?'}
  - {ask: 'Какая из функций $x^2$, $10x$, $2^x$ растёт быстрее всех при больших $x$?', ans: 'Показательная $2^x$. Квадрат обгоняет $10x$ после $x=10$, а $2^x$ обгоняет обе.'}
def:
  - {g: big-o}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..5, b: 1..9}
    q: 'Для $f(n)=@{a}n^2+@{b}n$ найди $\lim\limits_{n\to\infty}\dfrac{f(n)}{n^2}$.'
    a: a
    e: {dm.bigo.dom: a+b}
    h: ['Слагаемое $@{b}n$ при делении на $n^2$ стремится к нулю.']
  p2:
    k: num
    fast: 1
    v: {n: 4..12}
    q: 'Двойной цикл: внешний $i=1,\dots,@n$, внутренний $j=1,\dots,i$. Сколько всего итераций?'
    a: n*(n+1)/2
    h: ['Сложи $1+2+\dots+@n$.']
  p3:
    k: num
    lv: 2
    v: {b: 1..4, c: 1..4}
    q: 'Для $f(n)=3n^2+@{b}n+@c$ найди наименьшую целую $C$, при которой $f(n)\le Cn^2$ для всех $n\ge1$.'
    a: 3+b+c
    e: {dm.bigo.dom: 3}
    sol:
      - 'При $n\ge1$ выполнено $n\le n^2$ и $1\le n^2$.'
      - 'Значит, $f(n)\le3n^2+@{b}n^2+@{c}n^2=@{3+b+c}n^2$.'
      - 'Меньше нельзя: при $n=1$ получаем $f(1)=@{3+b+c}$.'
  p4:
    k: mc
    q: 'Верно ли, что $n^2=O(n^3)$?'
    a: 'Да: $O$ — верхняя оценка, а не равенство'
    e: {dm.bigo.equal: 'Нет: функции $n^2$ и $n^3$ не равны'}
    x: ['Нет: $n^2$ растёт быстрее $n^3$']
  p5:
    k: mc
    lv: 2
    q: 'Какой порядок у суммы $1+2+\dots+n$?'
    a: '$\Theta(n^2)$'
    e: {dm.bigo.dom: '$\Theta(n)$'}
    x: ['$\Theta(\log n)$']
    h: ['Сумма равна $\frac{n(n+1)}{2}$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при доказательстве $3n^2+5n=\Theta(n^2)$.'
    steps:
      - 'При $n\ge1$ выполнено $5n\le5n^2$'
      - 'Значит, $3n^2+5n\le8n^2$, то есть $3n^2+5n=O(n^2)$'
      - 'Кроме того, $3n^2+5n\ge3n^2$, то есть $\Omega(n^2)$'
      - 'Обе оценки дают $3n^2+5n=\Theta(n^2)$'
    bad:
      - {i: 2, t: 'Значит, $3n^2+5n=O(n)$, потому что $5n$ — последнее слагаемое', e: dm.bigo.dom}
      - {i: 3, t: 'Кроме того, $3n^2+5n\le3n^2$, то есть $\Omega(n^2)$', e: dm.bigo.lower}
err: [dm.bigo.equal, dm.bigo.dom, dm.bigo.lower]
sum:
  - 'Умею находить порядок роста суммы по главному члену и константу в оценке $O$.'
  - 'Умею считать итерации вложенных циклов суммой $1+2+\dots+n$.'
  - 'Отличаю верхнюю оценку $O$ от нижней $\Omega$ и не читаю $O$ как равенство.'
