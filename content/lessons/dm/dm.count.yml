id: dm.count
int:
  - 'В столовой $3$ супа и $4$ вторых блюда. Сколько разных обедов из супа и второго можно собрать? А сколькими способами выбрать одно блюдо — суп или второе?'
  - {ask: 'Сколько обедов из «суп и второе»? А сколько способов выбрать «один суп или одно второе»?', ans: 'Обедов $3\cdot4=12$: к каждому супу любое второе. Одно блюдо — $3+4=7$ вариантов.'}
  - 'Союз «и затем» превращает варианты в произведение, союз «или» — в сумму. Главное — увидеть, какой из двух случаев в задаче.'
def:
  - {g: sum-rule}
  - {g: product-rule}
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..6, b: 2..6}
    c: ['a*b != a+b']
    q: 'Есть $@a$ @{a:w=суп,супа,супов} и $@b$ @{b:w=второе блюдо,вторых блюда,вторых блюд}. Сколько различных обедов из супа и второго?'
    a: a*b
    tol: 0
    e: {dm.count.add-for-mul: a+b}
    h: ['К каждому супу можно взять любое второе.']
  p2:
    k: num
    lv: 2
    v: {a: 2..5, b: 2..5, c: 2..5}
    c: ['a*b != a+b']
    q: 'Дорог из A в B: $@a$, из B в C: $@b$, а из A в C напрямую: $@c$. Сколькими способами добраться из A в C?'
    a: a*b+c
    tol: 0
    e: {dm.count.add-for-mul: a+b+c}
    h: ['Через B: шаги последовательные. Напрямую: отдельный вариант.']
    sol:
      - 'Через B два последовательных выбора: $@a\cdot@b=@{a*b}$ @{a*b:w=способ,способа,способов}.'
      - 'Напрямую: $@c$ @{c:w=способ,способа,способов}; это отдельный вариант.'
      - 'Всего $@{a*b}+@c=@{a*b+c}$.'
  p3:
    k: num
    lv: 2
    v: {a: 2..5, b: 2..5, c: 2..5}
    q: 'На полке $@a$ @{a:w=книга,книги,книг} по математике, $@b$ по физике и $@c$ по химии. Сколькими способами выбрать одну книгу?'
    a: a+b+c
    tol: 0
    e: {dm.count.mul-for-add: a*b*c}
    h: ['Выбирают одну книгу, из какой-то одной группы.']
    sol:
      - 'Книга выбирается одна, из математики, или физики, или химии.'
      - 'Группы не пересекаются: способы складываются.'
      - 'Всего $@a+@b+@c=@{a+b+c}$.'
  p4:
    k: mc
    q: 'Когда применяется правило произведения?'
    a: 'Когда выбор делается в несколько шагов подряд'
    e: {dm.count.mul-for-add: 'Когда выбирают один из двух непересекающихся вариантов'}
    x: ['Когда множества пересекаются']
    h: ['Вспомни союз «и затем».']
  p5:
    k: num
    lv: 2
    v: {k: 2..4}
    q: 'Код состоит из $@k$ @{k:w=цифры,цифр,цифр}, каждая от $0$ до $9$. Сколько всего кодов?'
    a: 10^k
    tol: 0
    e: {dm.count.add-for-mul: 10*k}
    h: ['Каждая цифра выбирается независимо: $10$ способов на каждом шаге.']
    sol:
      - 'Каждая из $@k$ позиций заполняется $10$ способами.'
      - 'Выборы последовательные: правило произведения.'
      - '$10^@k=@{10^k}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: из A в B ведут $3$ дороги, из B в C — $4$. Сколько маршрутов из A в C?'
    steps:
      - 'Маршрут состоит из двух последовательных выборов'
      - 'Первый выбор: $3$ способа'
      - 'Второй выбор: $4$ способа'
      - 'По правилу произведения: $3\cdot4=12$ маршрутов'
    bad:
      - {i: 4, t: 'По правилу суммы: $3+4=7$ маршрутов', e: dm.count.add-for-mul}
      - {i: 2, t: 'Первый выбор: $4$ способа'}
err: [dm.count.add-for-mul, dm.count.mul-for-add]
sum:
  - 'Умею применять правило произведения к последовательным выборам.'
  - 'Умею применять правило суммы к выбору «или» из непересекающихся групп.'
