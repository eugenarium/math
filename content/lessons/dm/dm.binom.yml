id: dm.binom
int:
  - 'Раскроем $(1+x)^3$: получится $1+3x+3x^2+x^3$. Откуда берутся коэффициенты $1, 3, 3, 1$? Они же — числа в треугольнике Паскаля.'
  - {ask: 'Сколько способов получить $x^2$ при раскрытии $(1+x)(1+x)(1+x)$?', ans: 'Из трёх скобок нужно выбрать две, из которых берётся $x$: $C_3^2=3$. Поэтому коэффициент равен $3$.'}
  - 'Коэффициент при $x^k$ в $(1+x)^n$ — это $C_n^k$. А подстановка $x=1$ даёт сумму всех коэффициентов: $2^n$.'
  - {ask: 'Чему равна сумма $C_5^0+C_5^1+\dots+C_5^5$?', ans: '$32=2^5$: подставь $x=1$ в $(1+x)^5$.'}
  - {w: pascal, n: 8, show: [mod2], cap: 'Касайся чисел: каждое равно сумме двух верхних', ask: 'Чему равна сумма чисел в строке с номером $n$?', ans: '$2^n$: это значение $(1+1)^n$ из бинома Ньютона.'}
def:
  - {g: binomial-theorem}
  - 'Как решать. Коэффициент при $x^k$ в $(1+ax)^n$ равен $C_n^ka^k$. Сумма коэффициентов получается при $x=1$. Тождество Паскаля: $C_n^k=C_{n-1}^{k-1}+C_{n-1}^k$. Проверяй на малом $n$.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 3..8}
    q: 'Найди сумму всех коэффициентов в разложении $(1+x)^@n$.'
    a: 2^n
    tol: 0
    e: {dm.binom.freshman: 2}
    h: ['Подставь $x=1$.']
  p2:
    k: num
    lv: 2
    v: {n: 5..9, k: 2..3}
    c: ['n != 2*k+1']
    q: 'Найди коэффициент при $x^@k$ в разложении $(1+x)^@n$.'
    a: C(n,k)
    tol: 0
    e: {dm.binom.index: 'C(n,k+1)'}
    h: ['Коэффициент при $x^k$ равен $C_n^k$.']
    sol:
      - 'Член с $x^@k$ получается выбором $@k$ @{k:w=скобка,скобки,скобок} из $@n$.'
      - 'Способов $C_@n^@k=\frac{@n!}{@k!\,@{n-k}!}$.'
      - 'Коэффициент равен $@{C(n,k)}$.'
  p3:
    k: num
    lv: 2
    v: {a: 2..3, n: 4..6, k: 2..3}
    q: 'Найди коэффициент при $x^@k$ в разложении $(1+@{a}x)^@n$.'
    a: C(n,k)*a^k
    tol: 0
    e: {dm.binom.freshman: 'a^k'}
    h: ['Умножь $C_n^k$ на $a^k$.']
    sol:
      - 'В разложении $(1+y)^@n$ при $y^@k$ стоит $C_@n^@k=@{C(n,k)}$.'
      - 'Здесь $y=@{a}x$, поэтому $y^@k=@{a^k}x^@k$.'
      - 'Коэффициент $@{C(n,k)}\cdot@{a^k}=@{C(n,k)*a^k}$.'
  p4:
    k: mc
    q: 'Чему равно $(x+y)^2$?'
    a: '$x^2+2xy+y^2$'
    e: {dm.binom.freshman: '$x^2+y^2$'}
    x: ['$x^2+xy+y^2$']
    h: ['При $x=y=1$ левая часть равна $4$.']
  p5:
    k: num
    lv: 2
    v: {n: 5..9, k: 1..3, p: '=C(n,k)', q: '=C(n,k+1)'}
    q: 'Для некоторых $n$ и $k$ известно: $C_n^k=@p$ и $C_n^{k+1}=@q$. Найди $C_{n+1}^{k+1}$.'
    a: p+q
    tol: 0
    h: ['Тождество Паскаля: $C_n^k+C_n^{k+1}=C_{n+1}^{k+1}$.']
    sol:
      - 'Тождество Паскаля: каждая клетка треугольника — сумма двух над ней.'
      - '$C_{n+1}^{k+1}=C_n^k+C_n^{k+1}$.'
      - 'Получаем $@p+@q=@{p+q}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: коэффициент при $x^2$ в разложении $(1+x)^4$.'
    steps:
      - 'Коэффициент при $x^2$ равен $C_4^2$'
      - '$C_4^2=\frac{4!}{2!\,2!}$'
      - '$C_4^2=\frac{24}{4}=6$'
      - 'Ответ: $6$'
    bad:
      - {i: 1, t: 'Коэффициент при $x^2$ равен $C_4^3$', e: dm.binom.index}
      - {i: 4, t: 'Ответ: $0$, так как $(1+x)^4=1+x^4$', e: dm.binom.freshman}
err: [dm.binom.freshman, dm.binom.index]
sum:
  - 'Умею находить коэффициент при $x^k$ в $(1+ax)^n$.'
  - 'Умею применять тождество Паскаля и сумму коэффициентов $(1+x)^n$, равную $2^n$.'
  - 'Отличаю $(x+y)^n$ от $x^n+y^n$.'
