id: dm.pigeon
int:
  - 'В школе 400 учеников. Обязательно ли найдутся двое с одним днём рождения? Дней в году не больше 366, а учеников больше.'
  - {ask: 'В комнате 13 человек. Обязательно ли двое родились в один месяц?', ans: 'Да: месяцев 12, людей 13. Даже если первые 12 родились в разные месяцы, тринадцатый совпадёт с кем-то.'}
  - 'Если предметов больше, чем ящиков, то в каком-то ящике окажется хотя бы два. Принцип не говорит, в каком именно, но гарантирует, что такой есть.'
def:
  - {g: pigeonhole}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {k: [5, 7, 10, 12]}
    q: 'Предметы раскладывают по $@k$ ящикам. Какое наименьшее число предметов гарантирует, что в каком-то ящике окажется не менее двух?'
    a: k+1
    e: {dm.pigeon.k: k}
    h: ['При $@k$ предметах можно положить по одному в каждый ящик.']
  p2:
    k: num
    fast: 1
    v: {N: 10..30, k: [3, 4, 5, 6]}
    c: ['mod(N,k) != 0']
    q: '@N предметов разложили по $@k$ ящикам. Сколько предметов гарантированно окажется в каком-то одном ящике, как минимум?'
    a: ceil(N/k)
    e: {dm.pigeon.floor: floor(N/k)}
    h: ['Раздели $@N$ на $@k$ и округли вверх.']
  p3:
    k: num
    lv: 2
    v: {k: 3..6, r: 3..5}
    q: 'Сколько предметов нужно, чтобы наверняка в каком-то из $@k$ ящиков оказалось не менее $@r$?'
    a: k*(r-1)+1
    e: {dm.pigeon.kr: k*r}
    sol:
      - 'В худшем случае в каждом ящике по $@{r-1}$: всего $@k\cdot@{r-1}=@{k*(r-1)}$ предметов.'
      - 'Один лишний предмет сделает в каком-то ящике $@r$.'
      - 'Итог: $@{k*(r-1)}+1=@{k*(r-1)+1}$.'
  p4:
    k: mc
    q: 'Среди 13 человек обязательно найдутся двое, которые родились'
    a: 'в одном месяце'
    x: ['в один день года', 'в одну и ту же неделю года']
    h: ['Месяцев всего 12.']
  p5:
    k: mc
    lv: 2
    q: 'Верно ли, что среди любых 5 целых чисел найдутся два, разность которых делится на 4?'
    a: 'Верно: остатков при делении на 4 всего четыре'
    e: {dm.pigeon.k: 'Неверно: нужно 4 числа'}
    x: ['Неверно: нужно 8 чисел']
    h: ['У чисел с одним остатком разность кратна 4.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в доказательстве: среди 7 целых чисел есть два с разностью, кратной 6.'
    steps:
      - 'Остатки при делении на 6 — числа $0,1,2,3,4,5$: ящиков шесть'
      - 'Чисел семь, то есть больше, чем ящиков'
      - 'По принципу Дирихле в каком-то ящике хотя бы два числа'
      - 'У этих двух чисел остаток один, значит, их разность делится на 6'
    bad:
      - {i: 2, t: 'Чисел шесть, то есть столько же, сколько ящиков', e: dm.pigeon.k}
      - {i: 3, t: 'По принципу Дирихле в каждом ящике ровно одно число'}
err: [dm.pigeon.k, dm.pigeon.floor, dm.pigeon.kr]
sum:
  - 'Умею находить, сколько предметов гарантируют двоих в одном ящике.'
  - 'Умею считать гарантированное число в ящике как округление вверх.'
  - 'Умею применять принцип Дирихле к остаткам.'
