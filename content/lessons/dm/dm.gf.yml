id: dm.gf
int:
  - 'Последовательность $1,1,1,1,\dots$ можно записать одним выражением $1+x+x^2+x^3+\dots$. Коэффициент при $x^n$ хранит $n$-й член, а действия над рядами — действия над последовательностями.'
  - {ask: 'Чему равен коэффициент при $x^2$ в $(1+x)^4$?', ans: '$\binom42=6$: способов выбрать два множителя из четырёх, у которых берётся $x$.'}
  - 'Умножение рядов считает независимые выборы: коэффициент при $x^k$ — число способов получить в сумме $k$.'
  - {ask: 'Чему равен коэффициент при $x^3$ в $(1+x+x^2)^2$?', ans: '$2$: пары $(1,2)$ и $(2,1)$ дают степень $3$.'}
def:
  - {g: generating-function}
  - 'Как решать. Запиши производящую функцию из базовых рядов. Для независимых выборов перемножай ряды. Коэффициент при $x^k$ — число способов. Не забудь верхние границы: ряд $1+x+\dots+x^m$ обрывается.'
ex:
  - {x: p4, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 4..8, k: 2..3}
    q: 'Найди коэффициент при $x^@k$ в разложении $(1+x)^@n$.'
    a: C(n,k)
    h: ['Это число сочетаний $\binom{@n}{@k}$.']
  p2:
    k: num
    fast: 1
    v: {k: 3..9}
    q: 'Найди коэффициент при $x^@k$ в разложении $\frac1{(1-x)^2}$.'
    a: k+1
    e: {dm.gf.shift: k}
    h: ['Ряд $\frac1{(1-x)^2}=1+2x+3x^2+\dots$.']
    sol:
      - 'Ряд $\frac1{1-x}=1+x+x^2+\dots$, а $\frac1{(1-x)^2}$ — его квадрат.'
      - 'Коэффициент при $x^{@k}$ в квадрате — число пар $(a,b)$ с $a+b=@k$, то есть $@k+1$.'
      - 'Итог: $@{k+1}$.'
  p3:
    k: num
    fast: 1
    v: {k: 3..8}
    q: 'Найди коэффициент при $x^@k$ в разложении $\frac1{1-2x}$.'
    a: 2^k
    h: ['Геометрическая прогрессия: $\sum(2x)^n$.']
  p4:
    k: num
    lv: 2
    v: {m: [3, 4, 5], j: [1, 2, 3]}
    q: 'Сколько решений у $a+b=@{m+j}$ при целых $0\le a\le@m$, $0\le b\le@m$?'
    a: 2*m-(m+j)+1
    e: {dm.gf.bound: m+j+1}
    sol:
      - 'Нужен коэффициент при $x^{@{m+j}}$ в $(1+x+\dots+x^{@m})^2$.'
      - 'Без ограничений решений $@{m+j}+1=@{m+j+1}$, но $a$ и $b$ не больше $@m$.'
      - 'Подходят $a$ от $@j$ до $@m$: $@{2*m-(m+j)+1}$ решений.'
  p5:
    k: mc
    q: 'Какому ряду соответствует последовательность $1,1,1,1,\dots$?'
    a: '$\dfrac{1}{1-x}$'
    x: ['$\dfrac{1}{(1-x)^2}$', '$1+x$']
    h: ['Это сумма геометрической прогрессии.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении коэффициента при $x^3$ в $(1+x)^2(1+x)^3$.'
    steps:
      - 'Произведение рядов: $(1+x)^2(1+x)^3=(1+x)^5$'
      - 'Коэффициент при $x^3$ в $(1+x)^5$ равен $\binom53$'
      - '$\binom53=10$'
      - 'Проверка свёрткой: $\binom20\binom33+\binom21\binom32+\binom22\binom31=1+6+3=10$'
    bad:
      - {i: 1, t: 'Сумма рядов: $(1+x)^2+(1+x)^3=(1+x)^5$', e: dm.gf.sum}
      - {i: 3, t: '$\binom53=20$'}
err: [dm.gf.shift, dm.gf.bound, dm.gf.sum]
sum:
  - 'Умею находить коэффициенты рядов $(1+x)^n$, $\frac1{1-x}$, $\frac1{(1-x)^2}$.'
  - 'Умею считать число решений с ограничениями как коэффициент произведения.'
  - 'Отличаю сумму рядов от произведения.'
