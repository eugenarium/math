id: dm.card
int:
  - 'Натуральных чисел бесконечно много, чётных тоже. Чётные — лишь часть натуральных. Значит ли это, что их меньше?'
  - {ask: 'Можно ли каждому натуральному числу $n$ поставить в пару ровно одно чётное так, чтобы все чётные были использованы?', ans: 'Да: $n\mapsto2n$. Пары $1\leftrightarrow2$, $2\leftrightarrow4$, $3\leftrightarrow6$ покрывают все чётные числа, поэтому их «столько же».'}
  - 'Размер бесконечных множеств сравнивают по биекции. Но не все бесконечные множества равномощны: Кантор показал, что отрезок $[0,1]$ не выстраивается в список.'
def:
  - {g: cardinality}
ex:
  - {x: p4, seed: 2}
pr:
  p1:
    k: mc
    fast: 1
    q: 'Сколько точек на интервале $(0,1)$ по сравнению со всей числовой прямой?'
    a: 'Столько же: биекция $x\mapsto\tan(\pi(x-\tfrac12))$'
    e: {dm.card.interval: 'Меньше: интервал короче прямой'}
    x: ['Больше: интервал плотнее']
  p2:
    k: num
    fast: 1
    v: {n: 3..6}
    q: 'Сколько подмножеств (включая пустое и всё множество) у множества из $@n$ элементов?'
    a: 2^n
    h: ['Каждый элемент входит или нет.']
  p3:
    k: num
    fast: 1
    v: {n: 3..5}
    q: 'Сколько существует биекций между двумя $@n$-элементными множествами?'
    a: n!
    h: ['Первому элементу — $@n$ вариантов образа, второму — на один меньше, и так далее.']
  p4:
    k: num
    lv: 2
    v: {m: 5..30}
    q: 'Биекция $f(n)=2n$ связывает $\mathbb N$ и чётные числа. Какое натуральное число соответствует чётному $@{2*m}$?'
    a: m
    sol:
      - 'Нужно решить $2n=@{2*m}$.'
      - 'Разделим на $2$: $n=@m$.'
      - 'Итог: чётному $@{2*m}$ соответствует $n=@m$.'
  p5:
    k: mc
    q: 'Чётных натуральных чисел меньше, чем натуральных?'
    a: 'Столько же: $n\mapsto2n$ — биекция'
    e: {dm.card.more: 'Меньше: чётные — только часть натуральных'}
    x: ['Больше: чётные «плотнее»']
  p6:
    k: mc
    lv: 2
    q: 'Что показывает диагональный аргумент Кантора?'
    a: 'Точек отрезка $[0,1]$ больше, чем натуральных чисел: их нельзя выписать списком'
    e: {dm.card.all-equal: 'Любое бесконечное множество счётно'}
    x: ['Натуральных чисел больше, чем точек отрезка']
  p7:
    k: spot
    lv: 2
    q: 'Найди ошибку в диагональном аргументе.'
    steps:
      - 'Допустим, все числа из $(0,1)$ выписаны в список $x_1,x_2,\dots$ десятичными дробями'
      - 'Построим число $y$: его $n$-я цифра отличается от $n$-й цифры числа $x_n$'
      - 'Тогда $y$ отличается от каждого $x_n$ хотя бы в $n$-й цифре'
      - 'Значит, $y\in(0,1)$ не попало в список — противоречие'
    bad:
      - {i: 4, t: 'Значит, список всё же полный: все бесконечности одинаковы', e: dm.card.all-equal}
      - {i: 2, t: 'Построим число $y$: его $n$-я цифра равна $n$-й цифре числа $x_n$'}
err: [dm.card.all-equal, dm.card.more, dm.card.interval]
sum:
  - 'Умею сравнивать мощности бесконечных множеств по биекции.'
  - 'Отличаю часть от целого: у чётных чисел столько же элементов, сколько у натуральных.'
  - 'Умею пересказать диагональный аргумент Кантора.'
