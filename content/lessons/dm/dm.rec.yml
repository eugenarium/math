id: dm.rec
int:
  - 'Число пар кроликов: каждый месяц пара рождает новую пару, но только после месяца взросления. Получается последовательность $1, 1, 2, 3, 5, 8, \dots$, где каждый член — сумма двух предыдущих.'
  - {ask: 'Чему равен следующий член после $5, 8$? А можно ли получить последовательность, зная только правило «сумма двух предыдущих»?', ans: 'Следующий — $13$. Одного правила мало: нужны первые два члена, иначе подойдёт любая пара стартовых чисел.'}
  - 'Рекуррентная формула выражает член через предыдущие. Чтобы получить последовательность, нужны начальные значения.'
def:
  - {g: recurrence}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3}
    q: 'Пусть $a_1=@a$ и $a_n=2a_{n-1}$. Найди $a_4$.'
    a: 8*a
    tol: 0
    h: ['Удваивай три раза: $a_2$, $a_3$, $a_4$.']
  p2:
    k: num
    lv: 2
    v: {p: 1..4, q: 1..4}
    q: 'Пусть $a_1=@p$, $a_2=@q$ и $a_n=a_{n-1}+a_{n-2}$. Найди $a_5$.'
    a: 2*p+3*q
    tol: 0
    e: {dm.rec.index: p+2*q}
    h: ['Выпиши члены по порядку: $a_3$, $a_4$, $a_5$.']
    sol:
      - '$a_3=a_2+a_1=@{p+q}$.'
      - '$a_4=a_3+a_2=@{p+2*q}$.'
      - '$a_5=a_4+a_3=@{2*p+3*q}$.'
  p3:
    k: num
    lv: 2
    v: {c: 1..4}
    q: 'Пусть $a_0=@c$ и $a_n=2a_{n-1}+1$. Найди $a_3$.'
    a: 8*c+7
    tol: 0
    e: {dm.rec.index: 4*c+3}
    h: ['Шагов три: $a_1$, $a_2$, $a_3$.']
    sol:
      - '$a_1=2\cdot@c+1=@{2*c+1}$.'
      - '$a_2=2\cdot@{2*c+1}+1=@{4*c+3}$.'
      - '$a_3=2\cdot@{4*c+3}+1=@{8*c+7}$.'
  p4:
    k: mc
    q: 'Достаточно ли формулы $a_n=2a_{n-1}$, чтобы найти $a_5$?'
    a: 'Нет: нужно ещё начальное значение'
    e: {dm.rec.init: 'Да: формула определяет последовательность целиком'}
    x: ['Нужны два начальных значения']
    h: ['Подходят $a_n=2^n$ и $a_n=3\cdot2^n$.']
  p5:
    k: num
    lv: 2
    v: {a: 1..3, r: 2..3}
    q: 'Пусть $a_1=@a$ и $a_n=@{r}a_{n-1}$. Найди $a_6$.'
    a: a*r^5
    tol: 0
    e: {dm.rec.index: a*r^6}
    h: ['От $a_1$ до $a_6$ пять шагов.']
    sol:
      - 'Каждый шаг умножает на $@r$.'
      - 'От $a_1$ до $a_6$ нужно $5$ шагов.'
      - '$a_6=@a\cdot@r^5=@{a*r^5}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $a_1=a_2=1$, $a_n=a_{n-1}+a_{n-2}$. Найди $a_6$.'
    steps:
      - '$a_3=a_2+a_1=2$'
      - '$a_4=a_3+a_2=3$'
      - '$a_5=a_4+a_3=5$'
      - '$a_6=a_5+a_4=8$'
    bad:
      - {i: 4, t: '$a_6=a_5=5$', e: dm.rec.index}
      - {i: 2, t: '$a_4=a_3+a_1=3$'}
err: [dm.rec.init, dm.rec.index]
sum:
  - 'Умею вычислять члены последовательности по рекуррентной формуле.'
  - 'Умею объяснять, зачем нужны начальные значения.'
  - 'Умею следить за индексами: от $a_1$ до $a_n$ ровно $n-1$ шагов.'
