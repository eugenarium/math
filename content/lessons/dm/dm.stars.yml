id: dm.stars
int:
  - 'В кондитерской $3$ сорта пончиков, нужна коробка из $2$ штук. Можно взять два одинаковых, можно разные. Сколько разных коробок?'
  - {ask: 'Выпиши все коробки из $2$ пончиков трёх сортов $A$, $B$, $C$. Сколько их?', ans: '$AA$, $BB$, $CC$, $AB$, $AC$, $BC$: шесть. Не девять: $AB$ и $BA$ — одна коробка.'}
  - 'Это сочетания с повторениями. Образ «шары и перегородки»: $2$ шара и $2$ перегородки между сортами, выбираем места для шаров.'
def:
  - {g: stars-bars}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 2..5, k: 2..3}
    q: 'Код из $@k$ @{k:w=символа,символов,символов}, каждый символ — одна из $@n$ букв. Сколько кодов (порядок важен)?'
    a: n^k
    tol: 0
    h: ['На каждой позиции $n$ вариантов.']
  p2:
    k: num
    lv: 2
    v: {n: 3..5, k: 2..4}
    c: ['n^k != C(n+k-1,k)']
    q: 'Сколько различных коробок можно собрать из $@k$ пончиков при $@n$ сортах, если порядок не важен, а сорта могут повторяться?'
    a: C(n+k-1,k)
    tol: 0
    e: {dm.stars.arr: 'n^k'}
    h: ['Число сочетаний с повторениями $C_{n+k-1}^{k}$.']
    sol:
      - 'Выбор без порядка: шаров $@k$, перегородок $@{n-1}$.'
      - 'Всего позиций $@k+@{n-1}=@{n+k-1}$.'
      - 'Выбираем места шаров: $C_@{n+k-1}^@k=@{C(n+k-1,k)}$.'
  p3:
    k: num
    lv: 2
    v: {n: 3..4, k: 3..6}
    q: 'Сколько решений в неотрицательных целых у уравнения $x_1+\dots+x_@n=@k$?'
    a: C(n+k-1,n-1)
    tol: 0
    e: {dm.stars.formula: 'C(n+k,n-1)'}
    h: ['Перегородок на одну меньше, чем переменных.']
    sol:
      - 'Распределяем $@k$ @{k:w=единицу,единицы,единиц} по $@n$ переменным: шаров $@k$, перегородок $@{n-1}$.'
      - 'Позиций $@k+@{n-1}=@{n+k-1}$.'
      - 'Число способов $C_@{n+k-1}^@{n-1}=@{C(n+k-1,n-1)}$.'
  p4:
    k: mc
    q: 'Что считает величина $C_{n+k-1}^{k}$?'
    a: 'Выборки $k$ предметов из $n$ видов с повторениями без учёта порядка'
    e: {dm.stars.arr: 'Строки длины $k$ из $n$ символов'}
    x: ['Выборки $k$ разных предметов из $n$']
    h: ['Вспомни коробку пончиков.']
  p5:
    k: mc
    lv: 2
    q: 'Сколько коробок из $2$ пончиков можно составить из $3$ сортов?'
    a: '$6$'
    e: {dm.stars.arr: '$9$'}
    x: ['$3$']
    h: ['Порядок внутри коробки не важен.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: сколько решений у $x_1+x_2+x_3=4$ в неотрицательных целых?'
    steps:
      - 'Это сочетания с повторениями: $4$ шара и $2$ перегородки'
      - 'Всего позиций: $4+2=6$'
      - 'Выбираем места перегородок: $C_6^2=15$'
      - 'Ответ: $15$'
    bad:
      - {i: 2, t: 'Всего позиций: $4+3=7$', e: dm.stars.formula}
      - {i: 3, t: 'Число способов: $3^4=81$', e: dm.stars.arr}
err: [dm.stars.arr, dm.stars.formula]
sum:
  - 'Умею считать сочетания с повторениями: $C_{n+k-1}^{k}$.'
  - 'Отличаю выборку без порядка от кода, где порядок важен: $n^k$.'
