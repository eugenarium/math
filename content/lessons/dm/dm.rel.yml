id: dm.rel
int:
  - 'Слова «быть ровесником», «учиться в одной группе», «быть делителем» — отношения между объектами. Одни разбивают людей на группы, другие задают порядок.'
  - {ask: 'Отношение «числа дают один остаток при делении на 3» на множестве $\{1,\dots,9\}$. Сколько получится групп?', ans: 'Три: остатки $0$, $1$, $2$. В каждой группе по три числа: $\{3,6,9\}$, $\{1,4,7\}$, $\{2,5,8\}$.'}
  - 'Отношение, которое рефлексивно, симметрично и транзитивно, разбивает множество на классы. Если вместо симметрии — антисимметрия, получается порядок.'
def:
  - {g: equivalence-relation}
  - {g: partial-order}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [2, 3]}
    q: 'Сколько различных отношений можно задать на множестве из $@n$ элементов?'
    a: 2^(n^2)
    e: {dm.rel.count: n^2}
    h: ['Каждая из $@{n^2}$ пар либо входит в отношение, либо нет.']
  p2:
    k: num
    fast: 1
    v: {k: [3, 4, 5, 6], N: [12, 15, 20, 30]}
    q: 'На множестве $\{1,\dots,@N\}$ числа связаны, если дают один остаток при делении на $@k$. Сколько классов эквивалентности?'
    a: k
    h: ['Каждому остатку соответствует один класс.']
  p3:
    k: num
    lv: 2
    v: {k: 3..6, N: [12, 15, 20, 30]}
    c: ['floor(N/k) != k']
    q: 'На множестве $\{1,\dots,@N\}$ числа связаны, если дают один остаток при делении на $@k$. Сколько чисел в классе числа $@k$?'
    a: floor(N/k)
    sol:
      - 'Класс числа $@k$ — все числа, кратные $@k$ (остаток $0$).'
      - 'Это $@k,\ @{2*k},\ @{3*k},\ \dots$ до $@N$.'
      - 'Итог: $\lfloor@N/@k\rfloor=@{floor(N/k)}$ чисел.'
  p4:
    k: mc
    q: 'Какое из свойств НЕ выполняется для отношения «$a$ делит $b$» на натуральных числах?'
    a: 'Симметричность'
    x: ['Рефлексивность', 'Транзитивность']
    h: ['Проверь $2\mid4$, а $4\mid2$?']
  p5:
    k: mc
    lv: 2
    q: 'Отношение $\{(1,1),(1,2),(2,1),(2,2)\}$ на множестве $\{1,2,3\}$ симметрично и транзитивно. Следует ли отсюда рефлексивность?'
    a: 'Нет: у элемента $3$ нет пары $(3,3)$, он ни с чем не связан'
    e: {dm.rel.sym-trans: 'Да: из $aRb$ и $bRa$ следует $aRa$'}
    x: ['Да: транзитивность даёт рефлексивность']
    h: ['Для элемента $3$ нет ни одной пары.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании отношения «$a$ делит $b$» на натуральных числах.'
    steps:
      - 'Рефлексивность: $a\mid a$ при любом $a$'
      - 'Антисимметричность: из $a\mid b$ и $b\mid a$ следует $a=b$'
      - 'Транзитивность: из $a\mid b$ и $b\mid c$ следует $a\mid c$'
      - 'Значит, делимость — частичный порядок, а не линейный: $2$ и $3$ несравнимы'
    bad:
      - {i: 4, t: 'Значит, делимость — линейный порядок: любые два числа сравнимы', e: dm.rel.partial}
      - {i: 2, t: 'Симметричность: из $a\mid b$ следует $b\mid a$'}
err: [dm.rel.count, dm.rel.sym-trans, dm.rel.partial]
sum:
  - 'Умею считать классы эквивалентности и их размеры.'
  - 'Отличаю симметричность и транзитивность от рефлексивности.'
  - 'Отличаю частичный порядок от линейного.'
