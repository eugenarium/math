id: cm.tint
int:
  - 'Объём тела складывается из объёмов мелких кирпичиков. Для цилиндра и шара удобны свои координаты, в которых кирпичик имеет простую форму.'
  - {ask: 'Чему равен объём цилиндра радиуса $2$ и высоты $3$?', ans: '$\pi\cdot2^2\cdot3=12\pi$: площадь основания на высоту.'}
  - {ask: 'Почему в сферических координатах появляется множитель $\rho^2\sin\theta$?', ans: 'Размеры кирпичика: $d\rho$, $\rho\,d\theta$, $\rho\sin\theta\,d\varphi$. Их произведение содержит $\rho^2\sin\theta$.'}
def:
  - {g: triple-integral}
  - 'Как решать. Выбери координаты по форме тела: ось симметрии — цилиндрические, центр — сферические. Запиши пределы и якобиан: $r$ или $\rho^2\sin\theta$. Проинтегрируй последовательно.'
ex:
  - {x: p3, seed: 2}
  - {x: p1, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: 1..3, c: 1..3}
    q: 'Вычисли $\iiint x\,dV$ по параллелепипеду $[0,@a]\times[0,@b]\times[0,@c]$.'
    a: a^2*b*c/2
    e: {cm.tint.iter: a^2*b*c}
    h: ['$\int_0^ax\,dx=\frac{a^2}{2}$, остальные интегралы дают $bc$.']
    sol:
      - 'Интеграл разделяется: $\int_0^{@a}x\,dx\cdot@b\cdot@c$.'
      - '$\int_0^{@a}x\,dx=\frac{@{a^2}}{2}$.'
      - 'Итог: $\frac{@{a^2}}{2}\cdot@{b*c}=@{a^2*b*c/2:f1}$.'
  p2:
    k: num
    v: {R: [1, 3, 4], H: 1..3}
    tol: 0.002
    q: 'Найди объём цилиндра $x^2+y^2\le@{R^2}$, $0\le z\le@H$ тройным интегралом в цилиндрических координатах.'
    a: pi*R^2*H
    e: {cm.tint.jac: 2*pi*R*H}
    sol:
      - '$\int_0^{2\pi}d\varphi\int_0^{@R}r\,dr\int_0^{@H}dz$.'
      - 'Множители: $2\pi\cdot\frac{@{R^2}}{2}\cdot@H$.'
      - 'Итог: $@{pi*R^2*H:f3}$.'
  p3:
    k: num
    lv: 2
    v: {R: [1, 2, 3]}
    tol: 0.002
    q: 'Найди объём шара радиуса $@R$ в сферических координатах.'
    a: 4*pi*R^3/3
    e: {cm.tint.sph: 2*pi*R^2}
    sol:
      - 'Три интеграла: $2\pi$ по $\varphi$, $\int_0^\pi\sin\theta\,d\theta=2$ и $\int_0^{@R}\rho^2d\rho$.'
      - 'Множители: $2\pi\cdot2\cdot\frac{@{R^3}}{3}$.'
      - 'Итог: $@{4*pi*R^3/3:f3}$.'
  p4:
    k: mc
    q: 'Чему равен $dV$ в сферических координатах?'
    a: '$\rho^2\sin\theta\,d\rho\,d\theta\,d\varphi$'
    e: {cm.tint.sph: '$\rho\sin\theta\,d\rho\,d\theta\,d\varphi$'}
    x: ['$d\rho\,d\theta\,d\varphi$']
  p5:
    k: mc
    lv: 2
    q: 'Чему равен $dV$ в цилиндрических координатах?'
    a: '$r\,dr\,d\varphi\,dz$'
    e: {cm.tint.jac: '$dr\,d\varphi\,dz$'}
    x: ['$r^2\,dr\,d\varphi\,dz$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении объёма цилиндра $x^2+y^2\le1$, $0\le z\le2$.'
    steps:
      - 'Цилиндрические координаты: $0\le r\le1$, $0\le\varphi\le2\pi$, $0\le z\le2$'
      - '$dV=r\,dr\,d\varphi\,dz$'
      - '$V=\int_0^{2\pi}d\varphi\int_0^1r\,dr\int_0^2dz=2\pi\cdot\frac12\cdot2$'
      - 'Итог: $V=2\pi$'
    bad:
      - {i: 2, t: '$dV=dr\,d\varphi\,dz$', e: cm.tint.jac}
      - {i: 3, t: '$V=2\pi\cdot1\cdot2=4\pi$', e: cm.tint.iter}
err: [cm.tint.jac, cm.tint.sph, cm.tint.iter]
sum:
  - 'Умею считать объёмы тел в цилиндрических и сферических координатах.'
  - 'Умею использовать якобианы $r$ и $\rho^2\sin\theta$.'
  - 'Умею не терять деление при интегрировании степеней.'
