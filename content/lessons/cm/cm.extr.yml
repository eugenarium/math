id: cm.extr
int:
  - 'На вершине холма, дне ямы и седловине перевала земля горизонтальна: градиент равен нулю. Но это три разных места: на перевале в одну сторону идут вверх, в другую вниз.'
  - {ask: 'У $f=x^2-y^2$ градиент в нуле равен нулю. Это максимум, минимум или седло?', ans: 'Седло: вдоль оси $x$ значения растут, вдоль оси $y$ убывают.'}
  - {ask: 'Что можно сказать о точке, если $D=0$?', ans: 'Тест гессиана ничего не говорит: нужны другие рассуждения.'}
def:
  - {g: extremum-test}
  - 'Как решать. Реши $f_x=0$, $f_y=0$. В каждой критической точке вычисли $D=f_{xx}f_{yy}-f_{xy}^2$: $D>0$ и $f_{xx}>0$ — минимум, $D>0$ и $f_{xx}<0$ — максимум, $D<0$ — седло.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: 1..3}
    q: 'Найди значение $f=x^2+y^2-@{2*a}x-@{2*b}y$ в единственной критической точке.'
    a: -(a^2+b^2)
    h: ['Критическая точка $(@a,@b)$.']
  p2:
    k: num
    v: {k: [1, 3, 4]}
    q: 'Найди $D=f_{xx}f_{yy}-f_{xy}^2$ для $f=x^2+@{k}xy+y^2$.'
    a: 4-k^2
    e: {cm.extr.det: k^2-4}
    sol:
      - '$f_{xx}=2$, $f_{yy}=2$, $f_{xy}=@k$.'
      - '$D=2\cdot2-@{k}^2$.'
      - 'Итог: $D=@{4-k^2}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..3}
    q: 'Найди абсциссу седловой точки функции $f=x^3-@{3*a^2}x+y^2$.'
    a: -a
    e: {cm.extr.det: a}
    sol:
      - '$f_x=3x^2-@{3*a^2}=0$ даёт $x=\pm@a$, $f_y=2y=0$.'
      - '$D=f_{xx}f_{yy}=6x\cdot2=12x$.'
      - 'При $x=-@a$ получаем $D<0$: седло. Ответ $-@a$.'
  p4:
    k: mc
    q: 'Что означает $\nabla f=0$ в точке?'
    a: 'Критическая точка: может быть минимумом, максимумом или седлом'
    e: {cm.extr.grad: 'В ней обязательно экстремум'}
    x: ['В ней функция равна нулю']
  p5:
    k: mc
    lv: 2
    q: 'Что можно сказать о критической точке при $D=0$?'
    a: 'Тест не даёт ответа'
    e: {cm.extr.zero: 'Это седло'}
    x: ['Это минимум']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании $f=x^2-y^2$.'
    steps:
      - '$\nabla f=(2x,-2y)=0$ в точке $(0,0)$'
      - '$f_{xx}=2$, $f_{yy}=-2$, $f_{xy}=0$'
      - '$D=2\cdot(-2)-0=-4<0$'
      - 'Значит, в точке $(0,0)$ седло'
    bad:
      - {i: 4, t: 'Значит, $D<0$ — минимум', e: cm.extr.det}
      - {i: 1, t: 'Так как $\nabla f=0$, в точке $(0,0)$ экстремум', e: cm.extr.grad}
err: [cm.extr.grad, cm.extr.det, cm.extr.zero]
sum:
  - 'Умею находить критические точки и вычислять $D$.'
  - 'Умею классифицировать точку по знакам $D$ и $f_{xx}$.'
  - 'Отличаю нулевой градиент от экстремума.'
