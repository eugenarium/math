id: cm.chain
int:
  - 'Температура $z(x,y)$ зависит от положения, а положение $(x(t),y(t))$ — от времени. Изменение температуры по времени складывается из изменений по обеим координатам.'
  - {ask: 'Если $z_x=3$, $z_y=2$, а $x'' =1$, $y''=5$, чему равно $z''$?', ans: '$3\cdot1+2\cdot5=13$: складываются вклады обоих путей.'}
  - {ask: 'Что показывает матрица Якоби отображения $F$?', ans: 'Как $F$ линейно растягивает и поворачивает малые окрестности: строки — частные производные компонент.'}
def:
  - {g: multivariable-chain-rule}
  - 'Как решать. Выпиши $z_x$, $z_y$, $x''(t)$, $y''(t)$. Составь $\frac{dz}{dt}=z_xx''+z_yy''$ и подставь значения в точке. Для композиции перемножай матрицы Якоби: внешнее отображение слева.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {t0: 1..3}
    q: 'Пусть $z=x^2y$, $x=t$, $y=t^2$. Найди $\frac{dz}{dt}$ при $t=@t0$.'
    a: 4*t0^3
    e: {cm.chain.miss: 2*t0^3}
    h: ['$z=t^4$ после подстановки.']
  p2:
    k: num
    v: {a: 2..4, t0: 1..3}
    q: 'Пусть $z=xy$, $x=@{a}t$, $y=t^2$. Найди $\frac{dz}{dt}$ при $t=@t0$.'
    a: 3*a*t0^2
    e: {cm.chain.miss: a*t0^2}
    sol:
      - '$z_x=y=t^2$, $z_y=x=@{a}t$; $x''=@a$, $y''=2t$.'
      - '$\frac{dz}{dt}=t^2\cdot@a+@{a}t\cdot2t=@{3*a}t^2$.'
      - 'Итог при $t=@t0$: $@{3*a*t0^2}$.'
  p3:
    k: num
    lv: 2
    v: {u: 3..6, w: 1..2}
    q: 'Пусть $F(u,w)=(uw,\ u+w)$ и $G(x,y)=(x+y,\ x-y)$. Найди определитель якобиана композиции $G\circ F$ в точке $(@u,@w)$.'
    a: 2*(u-w)
    e: {cm.chain.miss: u-w}
    sol:
      - '$\det J_F=\begin{vmatrix}w&u\\1&1\end{vmatrix}=w-u$.'
      - '$\det J_G=\begin{vmatrix}1&1\\1&-1\end{vmatrix}=-2$.'
      - 'Определители перемножаются: $(-2)(@w-@u)=@{2*(u-w)}$.'
  p4:
    k: mc
    q: 'Чему равна производная $\frac{dz}{dt}$ для $z=f(x(t),y(t))$?'
    a: '$f_x\,x''+f_y\,y''$'
    e: {cm.chain.miss: '$f_x\,x''$'}
    x: ['$f_x\,f_y\,x''\,y''$']
  p5:
    k: mc
    lv: 2
    q: 'Как записывается якобиан композиции $G\circ F$?'
    a: '$J_G\cdot J_F$'
    e: {cm.chain.order: '$J_F\cdot J_G$'}
    x: ['$J_G+J_F$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\frac{dz}{dt}$ для $z=x^2+y^2$, $x=\cos t$, $y=\sin t$.'
    steps:
      - '$z_x=2x$, $z_y=2y$; $x''=-\sin t$, $y''=\cos t$'
      - '$\frac{dz}{dt}=2\cos t\cdot(-\sin t)+2\sin t\cdot\cos t$'
      - 'Слагаемые сокращаются: $\frac{dz}{dt}=0$'
      - 'Проверка: $z=\cos^2t+\sin^2t=1$ — постоянная'
    bad:
      - {i: 2, t: '$\frac{dz}{dt}=2\cos t\cdot(-\sin t)$', e: cm.chain.miss}
      - {i: 3, t: 'Слагаемые складываются: $\frac{dz}{dt}=-4\sin t\cos t$'}
err: [cm.chain.miss, cm.chain.order]
sum:
  - 'Умею применять цепное правило с учётом всех путей изменения.'
  - 'Умею находить определитель якобиана композиции.'
  - 'Отличаю порядок матриц $J_G J_F$ от $J_F J_G$.'
