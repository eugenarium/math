id: cm.grad
int:
  - 'Стоя на склоне, можно идти вдоль горизонтали (высота не меняется) или прямо вверх по склону. Градиент указывает направление самого крутого подъёма.'
  - {ask: 'Для $f=x^2+y^2$ чему равен градиент в точке $(3,4)$?', ans: '$(2x,2y)=(6,8)$: он направлен от начала координат, наружу от окружности уровня.'}
  - {ask: 'Что можно сказать о производной по направлению, перпендикулярному градиенту?', ans: 'Она равна нулю: это направление вдоль линии уровня.'}
def:
  - {g: gradient}
  - 'Как решать. Найди $\nabla f=(f_x,f_y)$ в точке. Для производной по направлению раздели вектор направления на его длину и возьми скалярное произведение с градиентом. Наибольшая скорость роста равна $|\nabla f|$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {t: 1..3}
    q: 'Найди длину градиента $f=x^2+y^2$ в точке $(@{3*t},@{4*t})$.'
    a: 10*t
    e: {cm.grad.max: 6*t}
    h: ['$\nabla f=(2x,2y)$, длина — корень из суммы квадратов.']
  p2:
    k: num
    v: {x0: [5, 10], y0: 1..3}
    tol: 0.002
    q: 'Найди производную $f=x^2y$ в точке $(@x0,@y0)$ по направлению вектора $(3,4)$.'
    a: (6*x0*y0+4*x0^2)/5
    e: {cm.grad.unit: 6*x0*y0+4*x0^2}
    sol:
      - '$\nabla f=(2xy,\ x^2)=(@{2*x0*y0},\ @{x0^2})$.'
      - 'Единичный вектор $\mathbf u=\frac{(3,4)}{5}=(0.6,\ 0.8)$.'
      - 'Итог: $@{2*x0*y0}\cdot0.6+@{x0^2}\cdot0.8=@{(6*x0*y0+4*x0^2)/5:f2}$.'
  p3:
    k: num
    lv: 2
    v: {k: [1, 2, 3]}
    tol: 0.002
    q: 'Найди наибольшую скорость роста $f=x^2+@{k}y^2$ в точке $(1,1)$.'
    a: sqrt(4+4*k^2)
    e: {cm.grad.max: 2+2*k}
    sol:
      - '$\nabla f=(2x,\ @{2*k}y)=(2,\ @{2*k})$ в точке $(1,1)$.'
      - 'Наибольшая скорость — длина градиента.'
      - 'Итог: $\sqrt{4+@{4*k^2}}=@{sqrt(4+4*k^2):f3}$.'
  p4:
    k: mc
    q: 'К чему перпендикулярен градиент в точке?'
    a: 'К линии уровня, проходящей через точку'
    e: {cm.grad.perp: 'Он касателен к линии уровня'}
    x: ['К оси $x$']
  p5:
    k: mc
    lv: 2
    q: 'Чему равна производная по направлению, перпендикулярному градиенту?'
    a: 'Нулю'
    x: ['Длине градиента', 'Наименьшему значению, отрицательному']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении производной $f=x^2+y^2$ в точке $(1,2)$ по направлению $(1,1)$.'
    steps:
      - '$\nabla f=(2x,2y)=(2,4)$'
      - 'Единичный вектор $\mathbf u=\frac{(1,1)}{\sqrt2}$'
      - '$D_{\mathbf u}f=\frac{2+4}{\sqrt2}$'
      - 'Итог: $3\sqrt2\approx4.24$'
    bad:
      - {i: 2, t: 'Берём вектор $\mathbf u=(1,1)$ без нормировки', e: cm.grad.unit}
      - {i: 3, t: '$D_{\mathbf u}f=2+4=6$', e: cm.grad.unit}
err: [cm.grad.unit, cm.grad.perp, cm.grad.max]
sum:
  - 'Умею находить градиент и его длину.'
  - 'Умею вычислять производную по направлению с нормировкой вектора.'
  - 'Отличаю направление линии уровня от направления градиента.'
