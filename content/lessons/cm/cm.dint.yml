id: cm.dint
int:
  - 'Объём под поверхностью $z=f(x,y)$ над областью $D$ можно нарезать на тонкие плитки: сначала сложить плитки одного ряда, затем сложить ряды.'
  - {ask: 'Чему равен $\iint_D1\,dA$ для квадрата $[0,3]\times[0,3]$?', ans: 'Площади квадрата $9$: интеграл единицы равен площади области.'}
  - {ask: 'Область $0\le y\le x\le1$ (треугольник). Как записать её, интегрируя сначала по $x$?', ans: '$0\le y\le1$, $y\le x\le1$: внутренние пределы по $x$ зависят от $y$.'}
def:
  - {g: double-integral}
  - 'Как решать. Нарисуй область и запиши пределы: внешний — числа, внутренний — функции внешней переменной. Проинтегрируй сначала внутренний интеграл, считая внешнюю переменную константой, затем внешний.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: 1..3}
    q: 'Вычисли $\iint xy\,dA$ по прямоугольнику $[0,@a]\times[0,@b]$.'
    a: a^2*b^2/4
    e: {cm.dint.iter: a^2*b^2/2}
    h: ['Интеграл разделяется: $\int_0^ax\,dx\cdot\int_0^by\,dy$.']
  p2:
    k: num
    v: {a: [2, 3, 5, 6]}
    q: 'Найди площадь треугольника $0\le y\le x\le@a$ двойным интегралом $\iint1\,dA$.'
    a: a^2/2
    e: {cm.dint.area: 2*a}
    sol:
      - '$\int_0^{@a}\!\int_0^x dy\,dx=\int_0^{@a}x\,dx$.'
      - 'Вычисляем: $\frac{x^2}{2}\Big|_0^{@a}$.'
      - 'Итог: $\frac{@{a^2}}{2}=@{a^2/2}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..4}
    tol: 0.002
    q: 'Вычисли $\iint x\,dA$ по треугольнику $0\le y\le x\le@a$.'
    a: a^3/3
    e: {cm.dint.limits: a^3/2}
    sol:
      - 'Внутренний интеграл: $\int_0^x x\,dy=x^2$.'
      - 'Внешний: $\int_0^{@a}x^2\,dx=\frac{@{a}^3}{3}$.'
      - 'Итог: $@{a^3/3:f3}$.'
  p4:
    k: mc
    q: 'Как записать область $0\le y\le x\le1$ при интегрировании сначала по $x$?'
    a: '$0\le y\le1,\ y\le x\le1$'
    e: {cm.dint.limits: '$0\le y\le1,\ 0\le x\le y$'}
    x: ['$0\le y\le1,\ 0\le x\le1$']
  p5:
    k: mc
    lv: 2
    q: 'Чему равен $\iint_D1\,dA$?'
    a: 'Площади области $D$'
    e: {cm.dint.area: 'Периметру области $D$'}
    x: ['Объёму области $D$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении площади треугольника $0\le y\le x\le2$.'
    steps:
      - 'Запишем $\iint1\,dA=\int_0^2\!\int_0^x dy\,dx$'
      - 'Внутренний интеграл равен $x$'
      - 'Внешний: $\int_0^2x\,dx=\frac{x^2}{2}\Big|_0^2$'
      - 'Итог: площадь равна $2$'
    bad:
      - {i: 1, t: 'Запишем $\iint1\,dA=\int_0^2\!\int_0^2 dy\,dx=4$', e: cm.dint.limits}
      - {i: 4, t: 'Итог: площадь равна $4$', e: cm.dint.iter}
err: [cm.dint.iter, cm.dint.limits, cm.dint.area]
sum:
  - 'Умею вычислять двойной интеграл по прямоугольнику и треугольнику повторным интегрированием.'
  - 'Умею записывать пределы области и менять порядок.'
  - 'Отличаю интеграл единицы (площадь) от других интегралов.'
