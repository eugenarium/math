id: cm.lagr
int:
  - 'Нужно оградить участок наибольшей площади периметром $40$ м. Свобода выбора ограничена: точки должны лежать на кривой $g=0$. Двигаясь по кривой, ищем, где $f$ перестаёт расти.'
  - {ask: 'В точке условного максимума линия уровня $f$ касается кривой $g=0$. Как связаны градиенты $\nabla f$ и $\nabla g$?', ans: 'Параллельны: $\nabla f=\lambda\nabla g$. Оба перпендикулярны общей касательной.'}
  - {ask: 'Найдя точки из системы Лагранжа, достаточно ли выбрать любую?', ans: 'Нет: нужно вычислить $f$ во всех и сравнить, какая даёт максимум, а какая минимум.'}
def:
  - {g: lagrange-multipliers}
  - 'Как решать. Составь систему $f_x=\lambda g_x$, $f_y=\lambda g_y$, $g=0$. Найди все точки. Вычисли $f$ в каждой и выбери наибольшее или наименьшее значение. Множитель $\lambda$ — вспомогательная величина.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {s: [4, 6, 8, 10]}
    q: 'Найди наибольшее значение $xy$ при условии $x+y=@s$.'
    a: s^2/4
    e: {cm.lagr.lambda: s/2}
    h: ['Из $\nabla f=\lambda\nabla g$ следует $x=y$.']
  p2:
    k: num
    v: {s: [2, 4, 6]}
    q: 'Найди наименьшее значение $x^2+y^2$ при условии $x+y=@s$.'
    a: s^2/2
    e: {cm.lagr.constraint: s^2}
    sol:
      - '$2x=\lambda$, $2y=\lambda$, значит $x=y$.'
      - 'Из $x+y=@s$ получаем $x=y=@{s/2}$.'
      - 'Итог: $f=2\cdot@{s/2}^2=@{s^2/2}$.'
  p3:
    k: num
    lv: 2
    v: {r: [1, 2, 3]}
    tol: 0.002
    q: 'Найди наибольшее значение $x+y$ на окружности $x^2+y^2=@{r^2}$.'
    a: sqrt(2)*r
    e: {cm.lagr.compare: -sqrt(2)*r}
    sol:
      - '$1=2\lambda x$, $1=2\lambda y$, значит $x=y$.'
      - 'Тогда $2x^2=@{r^2}$, $x=\pm\frac{@r}{\sqrt2}$.'
      - 'Сравним: при $x=y>0$ значение $@{sqrt(2)*r:f3}$ наибольшее.'
  p4:
    k: mc
    q: 'Что выражает условие $\nabla f=\lambda\nabla g$?'
    a: 'Градиенты параллельны: линия уровня $f$ касается кривой $g=0$'
    x: ['Градиенты перпендикулярны', 'Градиенты равны']
  p5:
    k: mc
    lv: 2
    q: 'Что такое множитель Лагранжа $\lambda$?'
    a: 'Коэффициент пропорциональности градиентов'
    e: {cm.lagr.lambda: 'Значение функции $f$ в точке'}
    x: ['Значение функции $g$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при поиске наибольшего значения $xy$ при $x+y=4$.'
    steps:
      - '$\nabla f=(y,x)$, $\nabla g=(1,1)$; $y=\lambda$, $x=\lambda$'
      - 'Значит, $x=y$'
      - 'Из $x+y=4$ получаем $x=y=2$'
      - 'Значение $f=xy=4$'
    bad:
      - {i: 4, t: 'Ответ $\lambda=2$', e: cm.lagr.lambda}
      - {i: 3, t: 'Точка $(4,0)$ даёт $f=0$, значит максимум $0$', e: cm.lagr.compare}
err: [cm.lagr.constraint, cm.lagr.lambda, cm.lagr.compare]
sum:
  - 'Умею составлять и решать систему Лагранжа.'
  - 'Умею сравнивать значения в найденных точках.'
  - 'Отличаю множитель $\lambda$ от значения функции.'
