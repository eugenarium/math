id: cm.hess
int:
  - 'Касательная плоскость не видит изгиба поверхности. Чтобы приблизить функцию точнее, добавляют квадратичные члены: вторые производные описывают, куда и как сильно поверхность загибается.'
  - {ask: 'Для $f=x^2y^2$ чему равно $f_{xx}$?', ans: '$2y^2$: дважды по $x$, множитель $y^2$ константа.'}
  - {ask: 'Почему в формуле Тейлора второго порядка стоит множитель $\frac12$?', ans: 'Так же, как в одномерном случае: $\frac{f''(a)}{2}\Delta^2$. Он возникает при двукратном интегрировании.'}
def:
  - {g: hessian}
  - 'Как решать. Найди $f_x$, $f_y$, затем $f_{xx}$, $f_{xy}$, $f_{yy}$ и подставь точку. Приближение второго порядка добавляет к $f+f_x\Delta x+f_y\Delta y$ член $\frac12(f_{xx}\Delta x^2+\dots)$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {x0: 1..3, y0: 1..3}
    q: 'Найди $f_{xx}(@x0,@y0)$ для $f(x,y)=x^3y^2$.'
    a: 6*x0*y0^2
    h: ['$f_x=3x^2y^2$, затем дифференцируй по $x$ ещё раз.']
  p2:
    k: num
    v: {a: 2..3, b: 1..2}
    q: 'Найди $f_{xy}(@a,@b)$ для $f(x,y)=x^2y^2$.'
    a: 4*a*b
    e: {cm.hess.xy: 4*a^2*b^2}
    sol:
      - '$f_x=2xy^2$.'
      - 'Дифференцируем по $y$: $f_{xy}=4xy$.'
      - 'Итог: $4\cdot@a\cdot@b=@{4*a*b}$.'
  p3:
    k: num
    lv: 2
    v: {dx: [0.1, 0.2], dy: [0.1, 0.2]}
    tol: 0.0005
    q: 'Для $f=e^{x+y}$ в точке $(0,0)$ найди значение многочлена Тейлора второго порядка при $\Delta x=@{dx:f1}$, $\Delta y=@{dy:f1}$.'
    a: 1+(dx+dy)+(dx+dy)^2/2
    e: {cm.hess.half: 1+(dx+dy)+(dx+dy)^2}
    sol:
      - 'В нуле $f=f_x=f_y=f_{xx}=f_{xy}=f_{yy}=1$.'
      - 'Квадратичный член $\frac12(\Delta x+\Delta y)^2=@{(dx+dy)^2/2:f3}$.'
      - 'Итог: $1+@{dx+dy:f2}+@{(dx+dy)^2/2:f3}=@{1+(dx+dy)+(dx+dy)^2/2:f3}$.'
  p4:
    k: mc
    q: 'Каков гессиан функции $f=x^2+y^2$?'
    a: '$\begin{pmatrix}2&0\\0&2\end{pmatrix}$'
    x: ['$\begin{pmatrix}2&2\\2&2\end{pmatrix}$', '$\begin{pmatrix}2x&0\\0&2y\end{pmatrix}$']
  p5:
    k: mc
    lv: 2
    q: 'Что верно для гессиана функции с непрерывными вторыми производными?'
    a: 'Он симметричен: $f_{xy}=f_{yx}$'
    e: {cm.hess.xy: 'Он диагонален: $f_{xy}=f_{xx}f_{yy}$'}
    x: ['Он антисимметричен']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при разложении $\ln(1+x+y)$ до второго порядка в нуле.'
    steps:
      - '$f(0,0)=0$'
      - '$f_x=f_y=\frac1{1+x+y}=1$ в нуле'
      - '$f_{xx}=f_{xy}=f_{yy}=-1$ в нуле'
      - '$T_2=(x+y)-\frac12(x+y)^2$'
    bad:
      - {i: 4, t: '$T_2=(x+y)-(x+y)^2$', e: cm.hess.half}
      - {i: 3, t: '$f_{xy}=f_{xx}f_{yy}=1$', e: cm.hess.xy}
err: [cm.hess.xy, cm.hess.half]
sum:
  - 'Умею находить вторые и смешанные производные.'
  - 'Умею строить приближение второго порядка с множителем $\frac12$.'
  - 'Отличаю смешанную производную от произведения вторых.'
