id: cm.diff
int:
  - 'Малый участок поверхности почти плоский. Заменим его касательной плоскостью: она хорошо приближает функцию рядом с точкой.'
  - {ask: 'Если $f(1,2)=5$, $f_x=2$, $f_y=3$, каково приближённое значение $f(1.1,2)$?', ans: '$5+2\cdot0.1=5.2$: изменили только $x$ на $0.1$.'}
  - {ask: 'Достаточно ли существования $f_x$ и $f_y$ для касательной плоскости?', ans: 'Нет. Нужна дифференцируемость; её гарантирует непрерывность частных производных вблизи точки.'}
def:
  - {g: tangent-plane}
  - 'Как решать. Найди $f(a,b)$, $f_x(a,b)$, $f_y(a,b)$. Плоскость $z=f(a,b)+f_x(x-a)+f_y(y-b)$. Для приближения подставь приращения: $\Delta f\approx f_x\Delta x+f_y\Delta y$.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 4}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: 1..3, h: [0.1, 0.2], k: [0.1, 0.2]}
    tol: 0.002
    q: 'Касательная плоскость к $z=x^2y$ в точке $(@a,@b)$. Найди её высоту в точке $(@{a+h:f1},@{b+k:f1})$.'
    a: a^2*b+2*a*b*h+a^2*k
    e: {cm.diff.plane: 2*a*b*h+a^2*k}
    h: ['$z=a^2b+2ab\,h+a^2k$.']
  p2:
    k: num
    v: {a: 1..4, b: 1..4, h: [0.1, 0.2], k: [0.1, 0.2]}
    tol: 0.002
    q: 'Для $f(x,y)=xy$ в точке $(@a,@b)$ найди дифференциал при $dx=@{h:f1}$, $dy=@{k:f1}$.'
    a: b*h+a*k
    e: {cm.diff.dx: a+b}
    sol:
      - '$f_x=y=@b$, $f_y=x=@a$.'
      - '$df=f_x\,dx+f_y\,dy=@b\cdot@{h:f1}+@a\cdot@{k:f1}$.'
      - 'Итог: $df=@{b*h+a*k:f2}$.'
  p3:
    k: num
    lv: 2
    v: {dx: [0.01, 0.02, 0.03], dy: [-0.01, -0.02, -0.03]}
    tol: 0.0005
    q: 'Для $f(x,y)=x^2y$ найди приближённо $f(1+@{dx:f2},\ 1+@{dy:f2})$ дифференциалом.'
    a: 1+2*dx+dy
    e: {cm.diff.plane: 2*dx+dy}
    sol:
      - '$f(1,1)=1$, $f_x=2xy=2$, $f_y=x^2=1$.'
      - '$df=2\cdot@{dx:f2}+1\cdot(@{dy:f2})=@{2*dx+dy:f3}$.'
      - 'Итог: $1+@{2*dx+dy:f3}=@{1+2*dx+dy:f3}$.'
  p4:
    k: mc
    q: 'Существуют $f_x$ и $f_y$ в точке. Следует ли, что функция дифференцируема?'
    a: 'Не обязательно'
    e: {cm.diff.partial-only: 'Да, всегда'}
    x: ['Нет, никогда']
  p5:
    k: mc
    lv: 2
    q: 'Что гарантирует дифференцируемость в точке?'
    a: 'Непрерывность частных производных вблизи точки'
    x: ['Непрерывность только самой функции', 'Существование только $f_x$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при записи касательной плоскости к $z=xy$ в точке $(2,1)$.'
    steps:
      - '$f(2,1)=2$, $f_x=y=1$, $f_y=x=2$'
      - 'Плоскость $z=f(2,1)+f_x(x-2)+f_y(y-1)$'
      - 'Подставим: $z=2+(x-2)+2(y-1)$'
      - 'Раскроем: $z=x+2y-2$'
    bad:
      - {i: 3, t: 'Подставим: $z=(x-2)+2(y-1)$', e: cm.diff.plane}
      - {i: 1, t: '$f(2,1)=2$, $f_x=x=2$, $f_y=y=1$'}
err: [cm.diff.plane, cm.diff.partial-only, cm.diff.dx]
sum:
  - 'Умею записывать касательную плоскость с учётом значения функции.'
  - 'Умею считать дифференциал и приближённое значение.'
  - 'Отличаю существование частных производных от дифференцируемости.'
