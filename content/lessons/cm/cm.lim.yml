id: cm.lim
int:
  - 'На прямой к точке можно подойти двумя способами: слева и справа. На плоскости способов бесконечно много: по любой прямой, параболе, спирали. Предел существует, лишь если все они дают одно число.'
  - {ask: 'У $\frac{xy}{x^2+y^2}$ вдоль оси $x$ (где $y=0$) значение равно $0$, а вдоль $y=x$ равно $\frac12$. Есть ли предел в нуле?', ans: 'Нет: по разным путям получились разные числа.'}
  - {ask: 'У функции предел по всем прямым равен $0$. Значит ли это, что предел существует?', ans: 'Нет: нужны и кривые. У $\frac{x^2y}{x^4+y^2}$ вдоль параболы $y=x^2$ получается $\frac12$.'}
def:
  - {g: multivariable-limit}
  - 'Как решать. Подставь $y=mx$: если результат зависит от $m$, предела нет. Если не зависит, проверь параболу $y=x^2$ или перейди к полярным координатам: предел существует, если результат при $r\to0$ не зависит от $\varphi$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: 1..3}
    q: 'Найди $\lim\limits_{(x,y)\to(@a,@b)}(x^2+y)$.'
    a: a^2+b
    h: ['Функция непрерывна, подставь точку.']
  p2:
    k: num
    v: {m: [2, 3, 4]}
    tol: 0.002
    q: 'Найди предел $\frac{xy}{x^2+y^2}$ при $(x,y)\to(0,0)$ вдоль прямой $y=@{m}x$.'
    a: m/(1+m^2)
    e: {cm.lim.polar: 1/2}
    sol:
      - 'Подставим $y=@{m}x$: $\frac{@{m}x^2}{x^2+@{m^2}x^2}$.'
      - 'Сократим на $x^2$: $\frac{@m}{1+@{m^2}}$.'
      - 'Итог: $@{m/(1+m^2):f3}$ — зависит от наклона.'
  p3:
    k: num
    lv: 2
    v: {a: 2..4}
    q: 'Найди $\lim\limits_{(x,y)\to(0,0)}\frac{@{a}x^2y}{x^2+y^2}$.'
    a: 0
    e: {cm.lim.value: a}
    sol:
      - 'Полярные координаты: $x=r\cos\varphi$, $y=r\sin\varphi$.'
      - 'Выражение равно $@{a}r\cos^2\varphi\sin\varphi$.'
      - 'При $r\to0$ оно стремится к $0$ при любом $\varphi$: предел $0$.'
  p4:
    k: mc
    q: 'Пределы по всем прямым $y=mx$ равны. Следует ли, что предел существует?'
    a: 'Не обязательно: нужно проверить и кривые'
    e: {cm.lim.lines: 'Да, всегда'}
    x: ['Нет, никогда']
  p5:
    k: mc
    lv: 2
    q: 'Что можно сказать о пределе $\frac{xy}{x^2+y^2}$ в нуле?'
    a: 'Предела нет: по $y=mx$ получается $\frac{m}{1+m^2}$'
    e: {cm.lim.lines: 'Предел равен $0$'}
    x: ['Предел равен $\frac12$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании $\frac{x^2y}{x^4+y^2}$ в нуле.'
    steps:
      - 'Вдоль $y=mx$: $\frac{mx^3}{x^4+m^2x^2}=\frac{mx}{x^2+m^2}\to0$'
      - 'Вдоль параболы $y=x^2$: $\frac{x^4}{2x^4}=\frac12$'
      - 'Значения различны'
      - 'Значит, предела нет'
    bad:
      - {i: 4, t: 'Пределы по всем прямым равны $0$, значит предел равен $0$', e: cm.lim.lines}
      - {i: 2, t: 'Вдоль параболы $y=x^2$: значение равно $0$', e: cm.lim.value}
err: [cm.lim.lines, cm.lim.polar, cm.lim.value]
sum:
  - 'Умею находить предел вдоль прямой и показывать зависимость от наклона.'
  - 'Умею находить предел в полярных координатах.'
  - 'Отличаю совпадение пределов по прямым от существования предела.'
