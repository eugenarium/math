id: cm.chg
int:
  - 'Круг неудобно описывать декартовыми координатами, а в полярных он простой: $0\le r\le R$. Но при замене координат площадь клеток меняется, и это надо учесть.'
  - {ask: 'У маленького сектора шириной $dr$ и углом $d\varphi$ на расстоянии $r$ какая площадь?', ans: 'Примерно $r\,dr\,d\varphi$: дуга $r\,d\varphi$ умножается на ширину $dr$.'}
  - {ask: 'Чему равно $x^2+y^2$ в полярных координатах?', ans: '$r^2$, а не $r$: $r^2\cos^2\varphi+r^2\sin^2\varphi=r^2$.'}
def:
  - {g: change-of-variables}
  - 'Как решать. Перейди к новым переменным и запиши пределы. Умножь подынтегральную функцию на модуль якобиана: для полярных координат $r$. Замени $x^2+y^2$ на $r^2$. Вычисли повторный интеграл.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {R: [1, 3, 4, 5]}
    tol: 0.002
    q: 'Найди площадь круга радиуса $@R$ полярным интегралом $\iint1\,dA$.'
    a: pi*R^2
    e: {cm.chg.jac: 2*pi*R}
    h: ['$\int_0^{2\pi}\!\int_0^R r\,dr\,d\varphi$.']
  p2:
    k: num
    v: {R: 1..3}
    tol: 0.002
    q: 'Вычисли $\iint(x^2+y^2)\,dA$ по кругу $x^2+y^2\le@{R^2}$.'
    a: pi*R^4/2
    e: {cm.chg.jac: 2*pi*R^3/3}
    sol:
      - 'В полярных координатах $x^2+y^2=r^2$, $dA=r\,dr\,d\varphi$.'
      - '$\int_0^{2\pi}d\varphi\int_0^{@R}r^3\,dr=2\pi\cdot\frac{@{R}^4}{4}$.'
      - 'Итог: $\frac{\pi\cdot@{R^4}}{2}=@{pi*R^4/2:f3}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..3, b: 1..3}
    q: 'Для замены $x=@{a}u+v$, $y=u-@{b}v$ найди модуль якобиана $\left|\frac{\partial(x,y)}{\partial(u,v)}\right|$.'
    a: a*b+1
    e: {cm.chg.jac: 1}
    sol:
      - '$J=\begin{vmatrix}@a&1\\1&-@b\end{vmatrix}$.'
      - '$J=-@{a}\cdot@b-1=-@{a*b+1}$.'
      - 'Итог: $|J|=@{a*b+1}$.'
  p4:
    k: mc
    q: 'Чему равен элемент площади $dA$ в полярных координатах?'
    a: '$r\,dr\,d\varphi$'
    e: {cm.chg.jac: '$dr\,d\varphi$'}
    x: ['$r^2\,dr\,d\varphi$']
  p5:
    k: mc
    lv: 2
    q: 'В каких пределах меняется $\varphi$ для полукруга $y\ge0$?'
    a: '$0\le\varphi\le\pi$'
    e: {cm.chg.range: '$0\le\varphi\le2\pi$'}
    x: ['$-\pi\le\varphi\le\pi$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\iint_{x^2+y^2\le1}e^{-(x^2+y^2)}\,dA$.'
    steps:
      - 'Замена: $x^2+y^2=r^2$'
      - 'Элемент площади $dA=r\,dr\,d\varphi$'
      - 'Интеграл $\int_0^{2\pi}d\varphi\int_0^1re^{-r^2}dr$'
      - 'Итог: $\pi(1-e^{-1})$'
    bad:
      - {i: 1, t: 'Замена: $x^2+y^2=r$', e: cm.chg.sq}
      - {i: 2, t: 'Элемент площади $dA=dr\,d\varphi$', e: cm.chg.jac}
err: [cm.chg.jac, cm.chg.range, cm.chg.sq]
sum:
  - 'Умею вычислять интеграл по кругу в полярных координатах с множителем $r$.'
  - 'Умею находить якобиан линейной замены.'
  - 'Отличаю $x^2+y^2=r^2$ от $r$ и диапазон $\varphi$ для круга и полукруга.'
