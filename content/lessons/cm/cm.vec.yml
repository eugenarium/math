id: cm.vec
int:
  - 'Формулы Грина, Стокса и Гаусса–Остроградского говорят одно: то, что происходит внутри области, можно узнать по границе. Поток через замкнутую поверхность равен сумме «источников» внутри.'
  - {ask: 'Чему равна дивергенция поля $\mathbf F=(x,y,z)$?', ans: '$1+1+1=3$: в каждой точке поле расходится с одинаковой интенсивностью.'}
  - {ask: 'Что вычисляет $\iint(Q_x-P_y)\,dA$ по области $D$?', ans: 'Циркуляцию поля $(P,Q)$ по границе области при положительном обходе (формула Грина).'}
def:
  - {g: integral-theorems}
  - 'Как решать. Определи, что дано: контур (Грин), замкнутая поверхность (Гаусс–Остроградский). Найди нужную производную поля: $Q_x-P_y$ или $\operatorname{div}\mathbf F$. Проинтегрируй по внутренности области.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {R: 1..3}
    tol: 0.002
    q: 'Найди $\oint(-y\,dx+x\,dy)$ по окружности радиуса $@R$ (против часовой стрелки).'
    a: 2*pi*R^2
    e: {cm.vec.green-sign: -2*pi*R^2}
    h: ['$Q_x-P_y=1-(-1)=2$.']
  p2:
    k: num
    v: {a: 1..3, b: 1..3, c: 1..3}
    q: 'Найди $\operatorname{div}\mathbf F$ для $\mathbf F=(x^2,y^2,z^2)$ в точке $(@a,@b,@c)$.'
    a: 2*(a+b+c)
    e: {cm.vec.div: 0}
    sol:
      - '$\operatorname{div}\mathbf F=P_x+Q_y+R_z=2x+2y+2z$.'
      - 'Подставим $(@a,@b,@c)$: $2\cdot(@a+@b+@c)$.'
      - 'Итог: $@{2*(a+b+c)}$.'
  p3:
    k: num
    lv: 2
    v: {R: [2, 3, 4]}
    tol: 0.002
    q: 'Найди поток поля $\mathbf F=(x,y,z)$ через сферу радиуса $@R$ наружу.'
    a: 4*pi*R^3
    e: {cm.vec.flux: 4*pi*R^2}
    sol:
      - '$\operatorname{div}\mathbf F=3$.'
      - 'Объём шара $\frac43\pi@{R^3}$.'
      - 'Итог: $3\cdot\frac43\pi@{R^3}=@{4*pi*R^3:f3}$.'
  p4:
    k: mc
    q: 'Чему равна формула Грина для $\oint P\,dx+Q\,dy$?'
    a: '$\iint(Q_x-P_y)\,dA$'
    e: {cm.vec.green-sign: '$\iint(P_y-Q_x)\,dA$'}
    x: ['$\iint(P_x+Q_y)\,dA$']
  p5:
    k: mc
    lv: 2
    q: 'Что измеряет дивергенция поля?'
    a: 'Расхождение поля (источники), число в каждой точке'
    e: {cm.vec.div: 'Вихревость поля, вектор в каждой точке'}
    x: ['Длину поля']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\oint x\,dy-y\,dx$ по границе квадрата $[0,1]^2$.'
    steps:
      - '$P=-y$, $Q=x$'
      - '$Q_x-P_y=1-(-1)=2$'
      - 'По формуле Грина интеграл равен $\iint2\,dA$'
      - 'Площадь квадрата $1$, итог: $2$'
    bad:
      - {i: 3, t: 'Интеграл равен $\iint(P_y-Q_x)\,dA=-2$', e: cm.vec.green-sign}
      - {i: 4, t: 'Итог: поток равен площади поверхности $=4$', e: cm.vec.flux}
err: [cm.vec.green-sign, cm.vec.div, cm.vec.flux]
sum:
  - 'Умею применять формулу Грина к круговому контуру.'
  - 'Умею вычислять дивергенцию и поток через сферу.'
  - 'Отличаю дивергенцию от ротора и знак в формуле Грина.'
