id: cm.fn
int:
  - 'Температура в комнате зависит от двух координат: $T(x,y)$. Точки с одинаковой температурой образуют изотермы — линии уровня. Так же читают карту высот.'
  - {ask: 'Для $f(x,y)=x^2+y^2$ какие точки имеют значение $4$?', ans: 'Окружность радиуса $2$ с центром в начале координат: $x^2+y^2=4=2^2$.'}
  - {ask: 'Определена ли функция $\sqrt{1-x^2-y^2}$ в точке $(1,1)$?', ans: 'Нет: под корнем $1-1-1=-1<0$. Область определения — единичный круг.'}
def:
  - {g: multivariable-function}
  - 'Как решать. Для области определения выпиши условия на формулу и найди множество точек. Для линии уровня приравняй $f$ к константе и приведи уравнение к известной кривой: окружность, эллипс, прямая, парабола.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..4, b: 1..3, x0: 1..3, y0: 1..3}
    q: 'Найди значение $f(x,y)=@{a}x^2+@{b}y$ в точке $(@x0,@y0)$.'
    a: a*x0^2+b*y0
    h: ['Подставь $x=@x0$, $y=@y0$.']
  p2:
    k: num
    v: {c: [4, 9, 16, 25]}
    q: 'Линия уровня $x^2+y^2=@c$ — окружность. Найди её радиус.'
    a: sqrt(c)
    e: {cm.fn.level: c}
    sol:
      - 'Уравнение окружности $x^2+y^2=r^2$.'
      - 'Сравним: $r^2=@c$.'
      - 'Итог: $r=\sqrt{@c}=@{sqrt(c)}$.'
  p3:
    k: num
    lv: 2
    v: {R: [1, 2, 3]}
    q: 'Функция $\sqrt{@{R^2}-x^2-y^2}$. Сколько точек с целыми координатами лежит в её области определения?'
    a: (R==1)*5+(R==2)*13+(R==3)*29
    e: {cm.fn.domain: (2*R+1)^2}
    sol:
      - 'Условие $x^2+y^2\le@{R^2}$: целые точки круга радиуса $@R$.'
      - 'Перебираем $x$ от $-@R$ до $@R$ и считаем подходящие $y$.'
      - 'Итог: @{(R==1)*5+(R==2)*13+(R==3)*29} точек.'
  p4:
    k: mc
    q: 'Какие линии уровня у функции $f(x,y)=x+y$?'
    a: 'Параллельные прямые $x+y=c$'
    x: ['Окружности', 'Параболы']
  p5:
    k: mc
    lv: 2
    q: 'Какова область определения функции $\ln(x-y)$?'
    a: 'Полуплоскость $x>y$'
    e: {cm.fn.domain: 'Вся плоскость'}
    x: ['Прямая $x=y$']
    h: ['Под логарифмом должно быть положительное число.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании линии уровня $x^2+4y^2=4$.'
    steps:
      - 'Приравниваем функцию к уровню: $x^2+4y^2=4$'
      - 'Делим на $4$: $\frac{x^2}{4}+y^2=1$'
      - 'Это эллипс с полуосями $2$ и $1$'
      - 'При уровне $0$ линия вырождается в точку $(0,0)$'
    bad:
      - {i: 3, t: 'Это окружность радиуса $2$', e: cm.fn.shape}
      - {i: 2, t: 'Делим на $4$: $x^2+y^2=1$', e: cm.fn.level}
err: [cm.fn.domain, cm.fn.level, cm.fn.shape]
sum:
  - 'Умею находить значение функции двух переменных и область определения.'
  - 'Умею находить линии уровня и их размеры.'
  - 'Отличаю окружность от эллипса по коэффициентам.'
