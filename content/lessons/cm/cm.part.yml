id: cm.part
int:
  - 'Рельеф местности: идя на восток, высота растёт одним образом, идя на север — другим. Частная производная измеряет подъём вдоль одной оси при неподвижной второй.'
  - {ask: 'Чему равна производная $x^2y$ по $x$, если $y$ — константа?', ans: '$2xy$: множитель $y$ остаётся как константа.'}
  - {ask: 'А по $y$ при зафиксированном $x$?', ans: '$x^2$: константа $x^2$ остаётся множителем при $y$.'}
def:
  - {g: partial-derivative}
  - 'Как решать. Выбери переменную дифференцирования и объяви остальные константами. Продифференцируй как функцию одной переменной. Для смешанной производной дифференцируй последовательно: сначала по одной переменной, потом по другой.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..4, x0: 1..3, y0: 1..3}
    c: ['x0 != 2*y0']
    q: 'Найди $f_x(@x0,@y0)$ для $f(x,y)=@{a}x^2y$.'
    a: 2*a*x0*y0
    e: {cm.part.mix: a*x0^2}
    h: ['При дифференцировании по $x$ величина $y$ константа.']
  p2:
    k: num
    v: {b: 2..4, x0: 1..3, y0: 1..3}
    q: 'Найди $f_y(@x0,@y0)$ для $f(x,y)=x^3+@{b}xy^2$.'
    a: 2*b*x0*y0
    e: {cm.part.const: 3*x0^2+2*b*x0*y0}
    sol:
      - 'Слагаемое $x^3$ не зависит от $y$: его производная по $y$ равна $0$.'
      - 'Для $@{b}xy^2$: $@b x\cdot2y=@{2*b}xy$.'
      - 'Подставим: $@{2*b}\cdot@x0\cdot@y0=@{2*b*x0*y0}$.'
  p3:
    k: num
    lv: 2
    v: {x0: 2..3, y0: 1..3}
    q: 'Найди смешанную производную $f_{xy}(@x0,@y0)$ для $f(x,y)=x^2y^3$.'
    a: 6*x0*y0^2
    e: {cm.part.mixed: 6*x0^3*y0^4}
    sol:
      - '$f_x=2xy^3$.'
      - 'Продифференцируем по $y$: $f_{xy}=6xy^2$.'
      - 'Итог: $6\cdot@x0\cdot@{y0}^2=@{6*x0*y0^2}$.'
  p4:
    k: mc
    q: 'Чему равна $f_x$ для $f(x,y)=x^2+y^2$?'
    a: '$2x$'
    e: {cm.part.mix: '$2y$'}
    x: ['$2x+2y$']
  p5:
    k: mc
    lv: 2
    q: 'Что можно сказать о $f_{xy}$ и $f_{yx}$ для гладкой функции?'
    a: 'Они равны'
    e: {cm.part.mixed: 'Они вообще говоря различны'}
    x: ['Они противоположны по знаку']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении производных $f=x^2y+y^3$ в точке $(1,2)$.'
    steps:
      - '$f_x=2xy$, так как $y^3$ от $x$ не зависит'
      - '$f_y=x^2+3y^2$'
      - 'В точке $(1,2)$: $f_x=4$'
      - 'В точке $(1,2)$: $f_y=1+12=13$'
    bad:
      - {i: 1, t: '$f_x=2xy+3y^2$', e: cm.part.const}
      - {i: 3, t: 'В точке $(1,2)$: $f_x=2$', e: cm.part.mix}
err: [cm.part.mix, cm.part.const, cm.part.mixed]
sum:
  - 'Умею вычислять частные производные многочленов, считая остальные переменные константами.'
  - 'Умею находить смешанные производные последовательным дифференцированием.'
  - 'Отличаю производную по $x$ от производной по $y$.'
