id: cm.implf
int:
  - 'Окружность $x^2+y^2=25$ не является графиком функции $y(x)$, но вблизи точки $(3,4)$ ею можно считать. Теорема о неявной функции говорит, когда так можно и чему равна производная.'
  - {ask: 'Для $x^2+y^2=25$ чему равна $y''$ в точке $(3,4)$?', ans: '$-\frac{x}{y}=-\frac34$: из $2x+2yy''=0$.'}
  - {ask: 'Почему в точке $(5,0)$ нельзя найти $y''$ по формуле?', ans: 'Там $F_y=2y=0$: касательная вертикальна, и $y$ не функция от $x$ вблизи этой точки.'}
def:
  - {g: implicit-function}
  - 'Как решать. Проверь $F_y\ne0$ в точке. Найди $F_x$, $F_y$ и вычисли $y''=-\frac{F_x}{F_y}$. Для обратного отображения определитель якобиана обратного равен $\frac1{J}$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [1, 2, 3], x0: 2..4, y0: 1..3}
    tol: 0.002
    q: 'Кривая $x^2+@{a}y^2=c$ проходит через точку $(@x0,@y0)$. Найди $y''$ в этой точке.'
    a: -x0/(a*y0)
    e: {cm.implf.sign: x0/(a*y0)}
    h: ['$F_x=2x$, $F_y=@{2*a}y$.']
    sol:
      - '$F=x^2+@{a}y^2$: $F_x=2x=@{2*x0}$, $F_y=@{2*a}y=@{2*a*y0}$.'
      - '$y''=-\frac{F_x}{F_y}=-\frac{@{2*x0}}{@{2*a*y0}}$.'
      - 'Итог: $@{-x0/(a*y0):f3}$.'
  p2:
    k: num
    v: {x0: 1..3, y0: 1..3}
    tol: 0.002
    q: 'Кривая $x^2y+y^3=c$ проходит через $(@x0,@y0)$. Найди $y''$ в этой точке.'
    a: -2*x0*y0/(x0^2+3*y0^2)
    e: {cm.implf.sign: 2*x0*y0/(x0^2+3*y0^2)}
    sol:
      - '$F_x=2xy=@{2*x0*y0}$, $F_y=x^2+3y^2=@{x0^2+3*y0^2}$.'
      - '$y''=-\frac{F_x}{F_y}$.'
      - 'Итог: $@{-2*x0*y0/(x0^2+3*y0^2):f3}$.'
  p3:
    k: num
    lv: 2
    v: {a: 2..4, b: 2..4}
    tol: 0.002
    q: 'Отображение $F(u,v)=(@{a}u,\ @{b}v)$. Найди определитель якобиана обратного отображения.'
    a: 1/(a*b)
    e: {cm.implf.inv: a*b}
    sol:
      - '$\det J_F=@a\cdot@b=@{a*b}$.'
      - 'Для обратного отображения определитель обратный.'
      - 'Итог: $\frac1{@{a*b}}=@{1/(a*b):f3}$.'
  p4:
    k: mc
    q: 'Какое условие позволяет локально выразить $y$ через $x$ из $F(x,y)=0$?'
    a: '$F_y\ne0$ в точке'
    e: {cm.implf.zero: '$F_y=0$ в точке'}
    x: ['$F_x\ne0$ в точке']
  p5:
    k: mc
    lv: 2
    q: 'Чему равна производная неявной функции $y(x)$?'
    a: '$-\dfrac{F_x}{F_y}$'
    e: {cm.implf.sign: '$\dfrac{F_x}{F_y}$'}
    x: ['$-\dfrac{F_y}{F_x}$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $y''$ для $x^2+y^2=25$ в точке $(3,4)$.'
    steps:
      - '$F_x=2x=6$, $F_y=2y=8$'
      - 'Условие $F_y\ne0$ выполнено'
      - '$y''=-\frac{F_x}{F_y}=-\frac68$'
      - 'Итог: $y''=-\frac34$'
    bad:
      - {i: 3, t: '$y''=\frac{F_x}{F_y}=\frac68$', e: cm.implf.sign}
      - {i: 2, t: 'Условие $F_y\ne0$ проверять не нужно', e: cm.implf.zero}
err: [cm.implf.sign, cm.implf.zero, cm.implf.inv]
sum:
  - 'Умею находить производную неявной функции с проверкой $F_y\ne0$.'
  - 'Умею находить определитель якобиана обратного отображения.'
  - 'Умею не терять знак минус в формуле $-\frac{F_x}{F_y}$.'
