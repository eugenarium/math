id: cm.line
int:
  - 'Работа силы вдоль пути — это сумма малых вкладов $\mathbf F\cdot d\mathbf r$. Подъём в гору против силы тяжести требует работы, и она зависит лишь от разности высот, а не от пути: поле потенциально.'
  - {ask: 'Чему равна работа силы тяжести при подъёме на гору высотой $h$ и возвращении в ту же точку?', ans: 'Нулю: подъём и спуск дают работы противоположного знака.'}
  - {ask: 'Что меняется в интеграле $\int_C\mathbf F\cdot d\mathbf r$ при обходе той же кривой в обратном направлении?', ans: 'Знак: $d\mathbf r$ меняет направление, и интеграл становится противоположным.'}
def:
  - {g: line-integral}
  - 'Как решать. Параметризуй кривую $\mathbf r(t)$. Для $\int f\,ds$ умножь на $|\mathbf r''(t)|$; для работы вычисли $\mathbf F\cdot\mathbf r''$. Для потенциального поля найди $\varphi$ и вычти значения на концах.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {k: 1..4}
    q: 'Найди длину кривой $\mathbf r(t)=(3t,\ 4t)$, $0\le t\le@k$, как $\int ds$.'
    a: 5*k
    e: {cm.line.speed: k}
    h: ['$|\mathbf r''|=\sqrt{9+16}=5$.']
  p2:
    k: num
    v: {a: 1..3, b: 1..3}
    q: 'Найди работу поля $\mathbf F=(y,\ x)$ вдоль отрезка из $(0,0)$ в $(@a,@b)$.'
    a: a*b
    e: {cm.line.dir: -a*b}
    sol:
      - 'Параметризация $\mathbf r=(@{a}t,\ @{b}t)$, $\mathbf r''=(@a,@b)$.'
      - '$\mathbf F\cdot\mathbf r''=@{b}t\cdot@a+@{a}t\cdot@b=@{2*a*b}t$.'
      - 'Итог: $\int_0^1@{2*a*b}t\,dt=@{a*b}$.'
  p3:
    k: num
    lv: 2
    v: {R: [2, 3, 4]}
    tol: 0.002
    q: 'Найди $\int_C(x^2+y^2)\,ds$ по окружности радиуса $@R$.'
    a: 2*pi*R^3
    e: {cm.line.speed: 2*pi*R^2}
    sol:
      - '$\mathbf r=(@R\cos t,\ @R\sin t)$, $|\mathbf r''|=@R$, $x^2+y^2=@{R^2}$.'
      - '$\int_0^{2\pi}@{R^2}\cdot@R\,dt$.'
      - 'Итог: $2\pi\cdot@{R^3}=@{2*pi*R^3:f3}$.'
  p4:
    k: mc
    q: 'Чему равна работа потенциального поля по замкнутому контуру?'
    a: 'Нулю'
    e: {cm.line.potential: 'Площади контура'}
    x: ['Длине контура']
  p5:
    k: mc
    lv: 2
    q: 'Что происходит с $\int_C\mathbf F\cdot d\mathbf r$ при смене направления обхода?'
    a: 'Знак меняется'
    e: {cm.line.dir: 'Ничего не меняется'}
    x: ['Интеграл обращается в нуль']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении работы $\mathbf F=(2x,2y)$ из $(0,0)$ в $(1,1)$.'
    steps:
      - 'Поле потенциально: $\varphi=x^2+y^2$'
      - 'Работа равна $\varphi(1,1)-\varphi(0,0)$'
      - 'Итог: $2-0=2$'
      - 'Результат не зависит от пути'
    bad:
      - {i: 3, t: 'Контур замкнут, поэтому работа равна $0$', e: cm.line.potential}
      - {i: 2, t: 'Работа равна $\varphi(0,0)-\varphi(1,1)$', e: cm.line.dir}
err: [cm.line.speed, cm.line.potential, cm.line.dir]
sum:
  - 'Умею считать интеграл по длине со скоростью $|\mathbf r''|$ и работу поля.'
  - 'Умею применять потенциал и знаю, что по замкнутому контуру работа нулевая.'
  - 'Умею учитывать направление обхода.'
