id: op.kkt
int:
  - 'Нужно минимизировать затраты при условии «не меньше $a$». Если безусловный минимум и так удовлетворяет условию, ограничение не мешает и его цена равна нулю. Если не удовлетворяет — ограничение давит, и платить за него приходится.'
  - {ask: 'Минимизируем $x^2$ при $x\ge-2$. Активно ли ограничение в оптимуме?', ans: 'Нет: оптимум $x=0$ допустим, ограничение не активно и $\lambda=0$.'}
  - {ask: 'А при $x\ge1$?', ans: 'Да: безусловный минимум $0$ недопустим, оптимум $x=1$ лежит на границе, $\lambda=2$.'}
def:
  - {g: kkt}
  - 'Как решать. Найди безусловный минимум. Если он допустим, ограничение не активно и $\lambda=0$. Иначе ограничение активно: $g=0$ и $\lambda\ge0$ из $\nabla f+\lambda\nabla g=0$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [-3, -2, -1, -4, -5, -6]}
    q: 'Найди точку минимума $x^2$ при условии $x\ge@a$.'
    a: max(a,0)
    e: {op.kkt.active: a}
    h: ['Безусловный минимум $x=0$; допустим ли он?']
  p2:
    k: num
    v: {b: 1..3, c: 5..8}
    q: 'Минимизируют $(x-@c)^2$ при $x\le@b$. Ограничение активно. Найди множитель $\lambda$ ($\nabla f+\lambda\nabla g=0$, $g=x-@b$).'
    a: 2*(c-b)
    e: {op.kkt.compl: 0}
    sol:
      - 'Безусловный минимум $x=@c>@b$ недопустим, значит $x^*=@b$.'
      - '$f''=2(x-@c)=@{2*(b-c)}$ в точке, $g''=1$.'
      - '$\lambda=-f''=@{2*(c-b)}\ge0$.'
  p3:
    k: num
    lv: 2
    v: {k: [2, 4, 6]}
    q: 'Минимизируют $x^2+y^2$ при $x+y\ge@k$. Найди множитель $\lambda\ge0$ в условии $\nabla f=\lambda\nabla(x+y)$.'
    a: k
    e: {op.kkt.sign: -k}
    sol:
      - '$2x=\lambda$, $2y=\lambda$, значит $x=y$.'
      - 'Ограничение активно: $x=y=\frac{@k}{2}$.'
      - 'Итог: $\lambda=2x=@k$.'
  p4:
    k: mc
    q: 'Что требует дополняющая нежёсткость?'
    a: '$\lambda g=0$: либо ограничение активно, либо $\lambda=0$'
    e: {op.kkt.compl: '$\lambda>0$ для каждого ограничения'}
    x: ['$g>0$ в оптимуме']
  p5:
    k: mc
    lv: 2
    q: 'Какой знак у множителя для $\min f$ при $g\le0$?'
    a: '$\lambda\ge0$'
    e: {op.kkt.sign: '$\lambda$ любого знака'}
    x: ['$\lambda\le0$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при минимизации $x^2$ при $x\ge1$.'
    steps:
      - 'Безусловный минимум $x=0$ нарушает $x\ge1$'
      - 'Значит, ограничение активно: $x^*=1$'
      - '$\nabla f=2x=2$ и $\nabla g=-1$ для $g=1-x\le0$'
      - '$\lambda=2\ge0$'
    bad:
      - {i: 2, t: 'Значит, оптимум $x^*=0$, ограничение не активно', e: op.kkt.active}
      - {i: 4, t: '$\lambda=-2$ — допустимый знак', e: op.kkt.sign}
err: [op.kkt.active, op.kkt.compl, op.kkt.sign]
sum:
  - 'Умею отличать активное ограничение от неактивного.'
  - 'Умею находить множитель в условиях ККТ.'
  - 'Умею применять дополняющую нежёсткость и знак $\lambda\ge0$.'
