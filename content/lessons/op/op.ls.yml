id: op.ls
int:
  - 'Через облако точек проводят прямую так, чтобы сумма квадратов отклонений была наименьшей. Если признаков много, коэффициенты можно «сжимать» штрафом: ridge уменьшает все, lasso некоторые обнуляет.'
  - {ask: 'Почему минимизируют сумму квадратов отклонений, а не сумму самих отклонений?', ans: 'Отклонения разных знаков сокращались бы: плохая прямая могла бы дать нулевую сумму.'}
  - {ask: 'Что делает штраф $\lambda b^2$ с коэффициентом $b$?', ans: 'Сжимает его к нулю, но не обнуляет: $b=\frac{S_{xy}}{S_{xx}+\lambda}$.'}
def:
  - {g: least-squares-reg}
  - 'Как решать. МНК для одного признака: $b=\frac{S_{xy}}{S_{xx}}$. Ridge: $b=\frac{S_{xy}}{S_{xx}+\lambda}$. Lasso: $b=\max(z-\lambda,0)$ для $z>0$, где $z$ — МНК-коэффициент.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {y1: 1..4, y2: 1..4, y3: 1..4}
    tol: 0.002
    q: 'Точки $(1,@y1)$, $(2,@y2)$, $(3,@y3)$. Найди МНК-наклон $b$ для прямой $y=bx$.'
    a: (y1+2*y2+3*y3)/14
    h: ['$b=\frac{\sum x_iy_i}{\sum x_i^2}$, $\sum x_i^2=14$.']
  p2:
    k: num
    v: {sxy: [12, 24, 36], lam: [1, 2, 4]}
    tol: 0.002
    q: 'Известно $S_{xy}=@sxy$, $S_{xx}=14$. Найди коэффициент ridge при $\lambda=@lam$.'
    a: sxy/(14+lam)
    e: {op.ls.ridge: sxy/14}
    sol:
      - 'Формула ridge: $b=\frac{S_{xy}}{S_{xx}+\lambda}$.'
      - 'Знаменатель $14+@lam=@{14+lam}$.'
      - 'Итог: $b=\frac{@sxy}{@{14+lam}}=@{sxy/(14+lam):f3}$.'
  p3:
    k: num
    lv: 2
    v: {z: [4, 5, 6], lam: [1, 2, 3]}
    c: ['z-lam != z/(1+lam)']
    tol: 0.002
    q: 'МНК-коэффициент $z=@z$. Найди коэффициент lasso при $\lambda=@lam$ (мягкий порог).'
    a: z-lam
    e: {op.ls.lasso: z/(1+lam)}
    sol:
      - 'Мягкий порог: $b=\max(z-\lambda,0)$ при $z>0$.'
      - 'Подставим: $@z-@lam=@{z-lam}$.'
      - 'Итог: $b=@{z-lam}$.'
  p4:
    k: mc
    q: 'Что делает ridge-штраф с коэффициентами?'
    a: 'Уменьшает их, но не обнуляет'
    e: {op.ls.ridge: 'Обнуляет часть коэффициентов'}
    x: ['Не изменяет их']
  p5:
    k: mc
    lv: 2
    q: 'Что делает lasso-штраф?'
    a: 'Может обнулять коэффициенты'
    e: {op.ls.lasso: 'Никогда не обнуляет, как ridge'}
    x: ['Увеличивает коэффициенты']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в выводе МНК для точек $(1,2)$, $(2,3)$, $(3,5)$ и $y=bx$.'
    steps:
      - '$\sum x_iy_i=2+6+15=23$'
      - '$\sum x_i^2=1+4+9=14$'
      - 'Метод минимизирует сумму квадратов остатков'
      - 'Итог: $b=\frac{23}{14}\approx1.64$'
    bad:
      - {i: 3, t: 'Метод минимизирует сумму остатков', e: op.ls.sumsq}
      - {i: 1, t: '$\sum x_iy_i=2+3+5=10$'}
err: [op.ls.ridge, op.ls.lasso, op.ls.sumsq]
sum:
  - 'Умею считать МНК-наклон для одного признака.'
  - 'Умею считать коэффициенты ridge и lasso.'
  - 'Отличаю сжатие ridge от обнуления lasso.'
