id: op.simplex
int:
  - 'Симплекс-метод идёт по рёбрам многоугольника от вершины к вершине, пока цель растёт. Остаётся ответить: какую вершину выбрать следующей и где остановиться, чтобы не выйти из области.'
  - {ask: 'Переменная растёт, пока не нарушит какое-то ограничение. Какое ограничение остановит её первым?', ans: 'То, у которого отношение $\frac{b_i}{a_{ij}}$ наименьшее: оно «кончается» раньше остальных.'}
  - {ask: 'Сколько базисных переменных у задачи с $3$ ограничениями?', ans: 'Три: по числу ограничений; остальные переменные равны нулю.'}
def:
  - {g: simplex}
  - 'Как решать. Выбери входящую переменную: её увеличение улучшает цель. Найди выходящую строку по $\min\frac{b_i}{a_{ij}}$ при $a_{ij}>0$. Новое значение переменной равно этому минимуму.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {m: 2..4}
    q: 'В задаче $@m$ ограничений. Сколько базисных переменных в базисном решении?'
    a: m
    e: {op.simplex.basis: m+2}
  p2:
    k: num
    v: {b1: [8, 12], b2: [6, 9], a1: [2, 4], a2: [3, 1]}
    c: ['b1/a1 != b2/a2']
    q: 'Переменная входит в базис; в строках $\frac{b_i}{a_i}$: $b=(@b1,@b2)$, $a=(@a1,@a2)$. Найди значение, до которого она вырастет (минимум отношений).'
    a: 'min(b1/a1,b2/a2)'
    e: {op.simplex.ratio: 'max(b1/a1,b2/a2)'}
    sol:
      - 'Отношения: $\frac{@b1}{@a1}=@{b1/a1:f2}$ и $\frac{@b2}{@a2}=@{b2/a2:f2}$.'
      - 'Берём меньшее, чтобы не нарушить другое ограничение.'
      - 'Итог: $@{min(b1/a1,b2/a2):f2}$.'
  p3:
    k: num
    lv: 2
    v: {c: 2..4, a: 1..3, b: [6, 12]}
    tol: 0.002
    q: 'Максимизируют $@{c}x$ при $@{a}x\le@b$, $x\ge0$. После шага симплекса $x$ принимает значение $\frac{b}{a}$. Найди значение цели.'
    a: c*b/a
    e: {op.simplex.reduced: 0}
    sol:
      - 'Оценка $c>0$: увеличение $x$ улучшает цель.'
      - 'Минимальное отношение $\frac{@b}{@a}=@{b/a:f2}$.'
      - 'Цель: $@c\cdot@{b/a:f2}=@{c*b/a:f2}$.'
  p4:
    k: mc
    q: 'Какую переменную вводят в базис при максимизации?'
    a: 'Ту, увеличение которой улучшает цель'
    e: {op.simplex.reduced: 'Ту, у которой цель убывает'}
    x: ['Любую']
  p5:
    k: mc
    lv: 2
    q: 'Как выбирают выходящую строку?'
    a: 'По наименьшему отношению $\frac{b_i}{a_{ij}}$ при $a_{ij}>0$'
    e: {op.simplex.ratio: 'По наибольшему отношению'}
    x: ['По наименьшему $b_i$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в шаге симплекса для $\max(x+y)$, $x+2y\le4$, $3x+y\le6$.'
    steps:
      - 'Ограничений два, значит в базисе две переменные'
      - 'Входит $x$; отношения $\frac41=4$ и $\frac63=2$'
      - 'Берём минимум: $x=2$'
      - 'Строка второго ограничения выходит из базиса'
    bad:
      - {i: 1, t: 'Ограничений два, значит в базисе четыре переменные', e: op.simplex.basis}
      - {i: 3, t: 'Берём максимум: $x=4$', e: op.simplex.ratio}
err: [op.simplex.ratio, op.simplex.reduced, op.simplex.basis]
sum:
  - 'Умею применять правило минимальных отношений.'
  - 'Умею определять входящую переменную по улучшению цели.'
  - 'Умею указывать число базисных переменных.'
