id: op.uncon
int:
  - 'Чтобы найти дно долины, достаточно найти место, где склон равен нулю. Но склон равен нулю и на вершине, и на седловине. Тогда помогает кривизна.'
  - {ask: 'У $f=\frac12ax^2-bx$ при $a>0$ где производная равна нулю?', ans: 'В $x=\frac{b}{a}$: из $ax-b=0$. Так как $f''''=a>0$, это минимум.'}
  - {ask: 'У $f=x^4$ вторая производная в нуле равна нулю. Минимум ли это?', ans: 'Да, но это не следует из второго порядка: надо смотреть на знак $f''$ по обе стороны.'}
def:
  - {g: optimality-conditions}
  - 'Как решать. Реши $\nabla f=0$. Проверь гессиан: положительно определён — минимум, отрицательно — максимум, смешанные знаки — седло. Для квадратичной $\frac12x^TAx-b^Tx$ минимум $x^*=A^{-1}b$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..4, b: [2, 4, 6, 8]}
    tol: 0.002
    q: 'Найди точку минимума $f(x)=\frac12\cdot@{a}x^2-@{b}x$.'
    a: b/a
    e: {op.uncon.quad: b}
    h: ['$f''=@{a}x-@b$.']
    sol:
      - '$f''(x)=@{a}x-@b=0$.'
      - 'Отсюда $x=\frac{@b}{@a}$.'
      - 'Так как $f''''=@a>0$, это минимум: $@{b/a:f3}$.'
  p2:
    k: num
    v: {p: 1..3, q: 1..3}
    q: 'Найди наименьшее значение $f=x^2+y^2-@{2*p}x-@{2*q}y$.'
    a: -(p^2+q^2)
    sol:
      - '$f_x=2x-@{2*p}=0$, $f_y=2y-@{2*q}=0$ даёт $(@p,@q)$.'
      - 'Гессиан $2I$ положительно определён: минимум.'
      - 'Итог: $f(@p,@q)=@{-(p^2+q^2)}$.'
  p3:
    k: num
    lv: 2
    v: {a: [2, 4], b: [2, 5]}
    tol: 0.002
    q: 'Минимизируют $\frac12(@{a}x^2+@{b}y^2)-x-y$. Найди сумму координат точки минимума $x^*+y^*$.'
    a: 1/a+1/b
    e: {op.uncon.quad: 2}
    sol:
      - '$@{a}x-1=0$, $@{b}y-1=0$.'
      - '$x^*=\frac1{@a}$, $y^*=\frac1{@b}$.'
      - 'Итог: $@{1/a+1/b:f3}$.'
  p4:
    k: mc
    q: 'Что означает $\nabla f(x^*)=0$?'
    a: 'Критическая точка: может быть минимумом, максимумом или седлом'
    e: {op.uncon.necessary: 'В точке обязательно минимум'}
    x: ['В точке функция равна нулю']
  p5:
    k: mc
    lv: 2
    q: 'Что можно сказать о критической точке с $f''''(x^*)=0$?'
    a: 'Второй порядок ничего не говорит'
    e: {op.uncon.hess: 'Это обязательно седло'}
    x: ['Это обязательно минимум']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при поиске минимума $f(x)=x^2-4x+7$.'
    steps:
      - '$f''(x)=2x-4=0$, отсюда $x=2$'
      - '$f''''(x)=2>0$: это минимум'
      - '$f(2)=4-8+7=3$'
      - 'Итог: наименьшее значение $3$'
    bad:
      - {i: 2, t: '$f''''(2)=0$, значит минимум', e: op.uncon.hess}
      - {i: 1, t: '$f''(x)=0$ — значит минимум, проверка не нужна', e: op.uncon.necessary}
err: [op.uncon.necessary, op.uncon.hess, op.uncon.quad]
sum:
  - 'Умею находить минимум квадратичной функции из $\nabla f=0$.'
  - 'Умею проверять гессиан в критической точке.'
  - 'Отличаю необходимое условие $\nabla f=0$ от достаточного.'
