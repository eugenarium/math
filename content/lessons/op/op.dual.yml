id: op.dual
int:
  - 'Фабрика максимизирует доход при ограничениях на ресурсы. Двойственная задача спрашивает иначе: сколько стоит каждый ресурс, чтобы их суммарная цена была наименьшей, но покрывала доход?'
  - {ask: 'У задачи с $2$ ограничениями и $3$ переменными сколько переменных у двойственной?', ans: 'Две: по одной на каждое ограничение прямой задачи.'}
  - {ask: 'Допустимый план прямой задачи (max) даёт $8$, допустимая точка двойственной (min) даёт $12$. Какое утверждение верно?', ans: 'Оптимум лежит между $8$ и $12$: двойственная даёт верхнюю границу, прямая — нижнюю.'}
def:
  - {g: duality}
  - 'Как решать. Построй двойственную: переменные по числу ограничений, цель $\min b^Ty$, ограничения $A^Ty\ge c$. Помни: допустимое значение прямой (max) не больше допустимого значения двойственной (min); оптимумы равны.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {c1: 2..4, c2: 1..3, b1: 2..4, b2: 2..4}
    q: 'Найди оптимум $\max(@{c1}x_1+@{c2}x_2)$ при $x_1\le@b1$, $x_2\le@b2$, $x_i\ge0$.'
    a: c1*b1+c2*b2
    h: ['Каждая переменная принимает наибольшее допустимое значение.']
  p2:
    k: num
    v: {n: [2, 3, 4], m: [5, 6]}
    q: 'Прямая задача: $@n$ переменных и $@m$ ограничений. Сколько переменных в двойственной?'
    a: m
    e: {op.dual.vars: n}
    sol:
      - 'Каждому ограничению прямой соответствует переменная двойственной.'
      - 'Ограничений $@m$.'
      - 'Итог: $@m$ переменных.'
  p3:
    k: num
    lv: 2
    v: {pv: [6, 8], dv: [10, 12]}
    q: 'Допустимое значение прямой (max) равно $@pv$, допустимое значение двойственной (min) равно $@dv$. Найди верхнюю границу зазора $\text{двойств.}-\text{прямая}$.'
    a: dv-pv
    e: {op.dual.weak: pv-dv}
    sol:
      - 'По слабой двойственности $c^Tx\le b^Ty$.'
      - 'Зазор между значениями $@dv-@pv$.'
      - 'Итог: $@{dv-pv}\ge0$; оптимум лежит внутри.'
  p4:
    k: mc
    q: 'Прямая задача (max) имеет конечный оптимум. Что с двойственной (min)?'
    a: 'Она имеет тот же оптимум'
    e: {op.dual.gap: 'Её оптимум всегда больше'}
    x: ['У неё нет допустимых точек']
  p5:
    k: mc
    lv: 2
    q: 'Как соотносятся допустимое значение прямой (max) и допустимое значение двойственной (min)?'
    a: 'Значение прямой не превосходит значения двойственной'
    e: {op.dual.weak: 'Значение прямой не меньше значения двойственной'}
    x: ['Они всегда равны']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при построении двойственной к $\max(3x_1+2x_2)$ при $x_1\le4$, $x_2\le5$.'
    steps:
      - 'Ограничений два, значит переменных двойственной две: $y_1,y_2$'
      - 'Цель двойственной: $\min(4y_1+5y_2)$'
      - 'Ограничения: $y_1\ge3$, $y_2\ge2$'
      - 'Оптимум $4\cdot3+5\cdot2=22$ — совпадает с прямой'
    bad:
      - {i: 1, t: 'Переменных двойственной столько же, сколько переменных прямой', e: op.dual.vars}
      - {i: 4, t: 'Оптимум двойственной $22$, а прямой $20$', e: op.dual.gap}
err: [op.dual.weak, op.dual.vars, op.dual.gap]
sum:
  - 'Умею определять число переменных двойственной задачи.'
  - 'Умею применять слабую двойственность как границу оптимума.'
  - 'Умею объяснять, что оптимумы прямой и двойственной равны.'
