id: op.lp
int:
  - 'Фабрика выпускает два товара. Ресурсов ограниченное число, доход — линейная функция. Допустимые планы образуют многоугольник, а лучший план всегда в одной из его вершин.'
  - {w: lp, cons: ['x+2*y<=8', '3*x+y<=9', 'x>=0', 'y>=0'], obj: 'max 3*x+2*y', cap: 'Коснись вершин многоугольника и сравни значения цели $3x+2y$', ask: 'В какой вершине цель наибольшая и чему равна?', ans: 'В вершине $(2,3)$: значение $12$. Проверь остальные: $(0,0)\to0$, $(3,0)\to9$, $(0,4)\to8$.'}
  - {ask: 'Может ли максимум линейной функции на многоугольнике быть строго внутри него?', ans: 'Нет: внутри всегда есть направление, в котором цель растёт.'}
def:
  - {g: linear-programming}
  - 'Как решать. Нарисуй область, найди вершины как пересечения границ. Вычисли цель в каждой вершине и выбери наибольшее (наименьшее). Проверь, что вершина допустима по всем ограничениям.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {k: [4, 6, 8]}
    q: 'Найди максимум $2x+3y$ при $x+y\le@k$, $x\ge0$, $y\ge0$.'
    a: 3*k
    e: {op.lp.vertex: 2.5*k}
    h: ['Вершины: $(0,0)$, $(@k,0)$, $(0,@k)$.']
  p2:
    k: num
    v: {a: [6, 8, 10], b: [2, 4]}
    tol: 0.002
    q: 'Найди значение цели $x+2y$ в вершине пересечения $x+y=@a$ и $x-y=@b$.'
    a: (3*a-b)/2
    e: {op.lp.constraint: (a+b)/2}
    sol:
      - 'Сложим уравнения: $2x=@{a+b}$, $x=@{(a+b)/2}$.'
      - 'Вычтем: $2y=@{a-b}$, $y=@{(a-b)/2}$.'
      - 'Цель: $@{(a+b)/2}+2\cdot@{(a-b)/2}=@{(3*a-b)/2}$.'
  p3:
    k: num
    lv: 2
    v: {k: [3, 6, 9]}
    tol: 0.002
    q: 'Найди минимум $x+y$ при $x+2y\ge@k$, $2x+y\ge@k$, $x\ge0$, $y\ge0$.'
    a: 2*k/3
    e: {op.lp.constraint: k/2}
    sol:
      - 'Вершины: $(0,@k)$, $(@k,0)$ и пересечение $x+2y=@k$, $2x+y=@k$.'
      - 'Пересечение: $x=y=\frac{@k}{3}=@{k/3}$.'
      - 'Значения цели: $@k$, $@k$ и $@{2*k/3}$. Наименьшее — $@{2*k/3}$.'
  p4:
    k: mc
    q: 'Где достигается максимум линейной функции на допустимом многоугольнике?'
    a: 'В вершине (или на целой грани)'
    e: {op.lp.vertex: 'В точке внутри области'}
    x: ['В середине стороны, всегда']
  p5:
    k: mc
    lv: 2
    q: 'Область неограничена в направлении роста цели. Что с максимумом?'
    a: 'Максимума нет: цель растёт без предела'
    e: {op.lp.unbounded: 'Максимум всё равно существует'}
    x: ['Максимум в начале координат']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: максимум $x+y$ при $x\le2$, $y\le3$, $x,y\ge0$.'
    steps:
      - 'Область — прямоугольник с вершинами $(0,0)$, $(2,0)$, $(0,3)$, $(2,3)$'
      - 'Цель в вершинах: $0$, $2$, $3$, $5$'
      - 'Наибольшее значение $5$ в вершине $(2,3)$'
      - 'Точка $(2,3)$ удовлетворяет всем ограничениям'
    bad:
      - {i: 3, t: 'Максимум достигается внутри области, например в $(1,1)$', e: op.lp.vertex}
      - {i: 4, t: 'Проверять ограничение $y\le3$ в вершине не нужно', e: op.lp.constraint}
err: [op.lp.vertex, op.lp.constraint, op.lp.unbounded]
sum:
  - 'Умею находить вершины допустимого многоугольника и значения цели в них.'
  - 'Умею искать оптимум линейной функции только среди вершин.'
  - 'Отличаю ограниченную область от неограниченной.'
