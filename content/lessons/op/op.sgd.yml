id: op.sgd
int:
  - 'Полный градиент требует просмотра всех данных. Стохастический спуск берёт небольшой случайный пакет и считает градиент по нему: шаг дешёвый, но шумный.'
  - {ask: 'Если стандартное отклонение градиента по одному примеру равно $4$, чему оно равно у среднего по $16$ примерам?', ans: '$\frac{4}{\sqrt{16}}=1$: шум убывает как $\frac1{\sqrt b}$.'}
  - {ask: 'Как momentum помогает при постоянном градиенте $g$?', ans: 'Скорость накапливается и стремится к $\frac{g}{1-\beta}$: шаг становится больше, спуск быстрее.'}
def:
  - {g: sgd}
  - 'Как решать. Для шума батча используй $\frac{\sigma}{\sqrt b}$. Для momentum считай $v_{new}=\beta v+g$ и шаг $x-\alpha v_{new}$. Установившаяся скорость при постоянном $g$ равна $\frac{g}{1-\beta}$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {sg: [2, 4, 6], b: [4, 9, 16]}
    tol: 0.002
    q: 'Стандартное отклонение градиента по одному примеру $\sigma=@sg$. Найди стандартное отклонение среднего по батчу из $@b$ примеров.'
    a: sg/sqrt(b)
    e: {op.sgd.var: sg/b}
    h: ['Дисперсия среднего делится на $b$.']
  p2:
    k: num
    v: {be: [0.5, 0.8, 0.9], gm: 2..5}
    tol: 0.002
    q: 'Постоянный градиент $g=@gm$ и коэффициент momentum $\beta=@{be:f1}$. Найди установившуюся скорость $v$.'
    a: gm/(1-be)
    e: {op.sgd.mom: gm*(1+be)}
    sol:
      - 'Установившаяся скорость удовлетворяет $v=\beta v+g$.'
      - 'Отсюда $v(1-\beta)=g$.'
      - 'Итог: $v=\frac{@gm}{@{1-be:f1}}=@{gm/(1-be):f2}$.'
  p3:
    k: num
    lv: 2
    v: {v0: 2..4, gm: 1..3}
    tol: 0.002
    q: 'Momentum: $x_0=10$, $\alpha=0.1$, $\beta=0.9$, $v_0=@v0$, градиент $g=@gm$. Найди $x_1=x_0-\alpha(\beta v_0+g)$.'
    a: 10-0.1*(0.9*v0+gm)
    e: {op.sgd.mom: 10-0.1*gm}
    sol:
      - '$v_1=0.9\cdot@v0+@gm=@{0.9*v0+gm:f2}$.'
      - 'Шаг: $\alpha v_1=0.1\cdot@{0.9*v0+gm:f2}=@{0.1*(0.9*v0+gm):f3}$.'
      - 'Итог: $x_1=10-@{0.1*(0.9*v0+gm):f3}=@{10-0.1*(0.9*v0+gm):f3}$.'
  p4:
    k: mc
    q: 'Что можно сказать о градиенте по случайному мини-батчу?'
    a: 'Это несмещённая, но шумная оценка полного градиента'
    e: {op.sgd.bias: 'Он систематически отличается от полного'}
    x: ['Он точно равен полному градиенту']
  p5:
    k: mc
    lv: 2
    q: 'Как размер батча влияет на шум градиента?'
    a: 'Чем больше батч, тем меньше шум'
    e: {op.sgd.var: 'Шум от размера батча не зависит'}
    x: ['Чем больше батч, тем больше шум']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в шаге momentum: $x=5$, $\alpha=0.1$, $\beta=0.9$, $v=1$, $g=2$.'
    steps:
      - 'Новая скорость $v_{new}=0.9\cdot1+2=2.9$'
      - 'Шаг $\alpha v_{new}=0.29$'
      - 'Новая точка $x=5-0.29$'
      - 'Итог: $x=4.71$'
    bad:
      - {i: 1, t: 'Новая скорость $v_{new}=2$', e: op.sgd.mom}
      - {i: 4, t: 'Итог: $x=5.29$', e: op.sgd.bias}
err: [op.sgd.var, op.sgd.mom, op.sgd.bias]
sum:
  - 'Умею оценивать шум градиента по батчу как $\frac{\sigma}{\sqrt b}$.'
  - 'Умею считать шаг momentum и установившуюся скорость.'
  - 'Умею объяснять, что градиент батча несмещён.'
