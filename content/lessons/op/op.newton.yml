id: op.newton
int:
  - 'Градиентный спуск идёт вслепую по склону. Метод Ньютона смотрит ещё и на кривизну: заменяет функцию параболой и прыгает прямо в её вершину.'
  - {ask: 'Для $f=x^2-4x$ из любой точки сколько шагов нужно методу Ньютона?', ans: 'Один: $f$ — парабола, и вершина параболы совпадает с минимумом, $x^*=2$.'}
  - {ask: 'Чем шаг $x-\frac{f''}{f''''}$ отличается от $x-f''$?', ans: 'Деление на кривизну $f''''$ подбирает длину шага: на крутой кривой шаг короче, на пологой длиннее.'}
def:
  - {g: newton-method-opt}
  - 'Как решать. Вычисли $f''(x_k)$ и $f''''(x_k)$. Шаг $x_{k+1}=x_k-\frac{f''(x_k)}{f''''(x_k)}$. Для квадратичной функции результат — точный минимум. Следи, чтобы $f''''>0$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..4, b: [2, 4, 6, 8], x0: [0, 5, 10]}
    tol: 0.002
    q: 'Шаг метода Ньютона для $f=\frac{@a}{2}x^2-@{b}x$ из $x_0=@x0$. Найди $x_1$.'
    a: b/a
    e: {op.newton.quad: x0-(a*x0-b)}
    h: ['$f''=@{a}x-@b$, $f''''=@a$.']
  p2:
    k: num
    v: {x0: [3, 6, 9]}
    tol: 0.002
    q: 'Шаг метода Ньютона для $f=x^4$ из $x_0=@x0$. Найди $x_1$.'
    a: 2*x0/3
    e: {op.newton.root: 3*x0/4}
    sol:
      - '$f''=4x^3$, $f''''=12x^2$.'
      - '$x_1=x_0-\frac{4x_0^3}{12x_0^2}=x_0-\frac{x_0}{3}$.'
      - 'Итог: $x_1=@{2*x0/3}$.'
  p3:
    k: num
    lv: 2
    v: {x0: [1, 2]}
    tol: 0.002
    q: 'Шаг метода Ньютона для $f=e^x-2x$ из $x_0=@x0$. Найди $x_1$.'
    a: x0-1+2*exp(-x0)
    e: {op.newton.hess: x0-(exp(x0)-2)}
    sol:
      - '$f''=e^x-2$, $f''''=e^x$.'
      - '$x_1=x_0-\frac{e^{x_0}-2}{e^{x_0}}=x_0-1+2e^{-x_0}$.'
      - 'Итог: $x_1=@{x0-1+2*exp(-x0):f3}$.'
  p4:
    k: mc
    q: 'Сколько шагов нужно методу Ньютона для квадратичной функции?'
    a: 'Один шаг'
    e: {op.newton.quad: 'Много шагов, как у спуска'}
    x: ['Бесконечно много']
  p5:
    k: mc
    lv: 2
    q: 'Как выглядит шаг метода Ньютона для минимизации $f$?'
    a: '$x-\dfrac{f''}{f''''}$'
    e: {op.newton.root: '$x-\dfrac{f}{f''''}$'}
    x: ['$x-f''$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в шаге Ньютона для $f=x^4$ из $x_0=3$.'
    steps:
      - '$f''=4x^3=108$'
      - '$f''''=12x^2=108$'
      - '$x_1=3-\frac{108}{108}$'
      - 'Итог: $x_1=2$'
    bad:
      - {i: 3, t: '$x_1=3-108=-105$', e: op.newton.hess}
      - {i: 3, t: '$x_1=3-\frac{81}{108}$, где $81=f(3)$', e: op.newton.root}
err: [op.newton.quad, op.newton.root, op.newton.hess]
sum:
  - 'Умею делать шаг метода Ньютона для минимизации.'
  - 'Умею применять метод к квадратичной функции и знаю, что хватает одного шага.'
  - 'Отличаю метод для $f''=0$ от метода для $f=0$.'
