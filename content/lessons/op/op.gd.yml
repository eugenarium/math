id: op.gd
int:
  - 'Шарик скатывается по склону: каждый шаг вниз пропорционален крутизне. Это градиентный спуск. Но если шаг слишком велик, шарик перепрыгнет долину и окажется выше.'
  - {ask: 'Для $f=x^2$ из точки $x=4$ шаг $\alpha=0.25$: чему равен $x_1$?', ans: '$x_1=4-0.25\cdot8=2$: градиент $2x=8$, шаг против градиента.'}
  - {ask: 'А если $\alpha=1.5$ и $x=4$?', ans: '$x_1=4-1.5\cdot8=-8$: шаг слишком велик, метод перепрыгнул минимум и удалился от него.'}
def:
  - {g: gradient-descent}
  - 'Как решать. Вычисли $\nabla f$ в текущей точке и сделай шаг $x-\alpha\nabla f$. Для $f=\frac a2x^2$ множитель за шаг $1-\alpha a$: метод сходится, если $|1-\alpha a|<1$, то есть $\alpha<\frac2a$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {x0: [4, 6, 8], al: [0.1, 0.2, 0.25, 0.4]}
    tol: 0.002
    q: 'Спуск для $f=x^2$ из $x_0=@x0$ с шагом $\alpha=@{al:f2}$. Найди $x_1$.'
    a: x0*(1-2*al)
    e: {op.gd.sign: x0*(1+2*al)}
    h: ['$f''(x)=2x$.']
  p2:
    k: num
    v: {a: 2..4, al: [0.1, 0.2, 0.25]}
    c: ['al*a != 0.5']
    tol: 0.002
    q: 'Для $f=\frac{@a}{2}x^2$ найди множитель сжатия $x_{k+1}/x_k$ при шаге $\alpha=@{al:f2}$.'
    a: 1-al*a
    e: {op.gd.rate: al*a}
    sol:
      - '$f''(x)=@{a}x$, шаг: $x_{k+1}=x_k-@{al:f2}\cdot@{a}x_k$.'
      - 'Выносим $x_k$: множитель $1-@{al*a:f2}$.'
      - 'Итог: $@{1-al*a:f2}$.'
  p3:
    k: num
    lv: 2
    v: {a: [2, 4, 5, 8]}
    tol: 0.002
    q: 'Для $f=\frac{@a}{2}x^2$ найди верхнюю границу шага $\alpha$, при которой спуск ещё сходится (строго меньше неё).'
    a: 2/a
    e: {op.gd.step: 4/a}
    sol:
      - 'Множитель за шаг $1-@{a}\alpha$.'
      - 'Сходимость: $|1-@{a}\alpha|<1$, откуда $0<\alpha<\frac2{@a}$.'
      - 'Итог: граница $@{2/a:f3}$.'
  p4:
    k: mc
    q: 'Что происходит при слишком большом шаге градиентного спуска?'
    a: 'Метод расходится'
    e: {op.gd.step: 'Метод всё равно сходится, но медленнее'}
    x: ['Метод сходится за один шаг']
  p5:
    k: mc
    lv: 2
    q: 'В каком направлении идёт градиентный спуск?'
    a: 'Против градиента'
    e: {op.gd.sign: 'Вдоль градиента'}
    x: ['Перпендикулярно градиенту']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в двух шагах спуска для $f=x^2$ из $x_0=5$ при $\alpha=0.1$.'
    steps:
      - '$f''(x)=2x$, $x_1=5-0.1\cdot10=4$'
      - 'Множитель за шаг $1-2\cdot0.1=0.8$'
      - '$x_2=0.8\cdot4=3.2$'
      - 'Последовательность убывает к нулю — минимуму'
    bad:
      - {i: 1, t: '$x_1=5+0.1\cdot10=6$', e: op.gd.sign}
      - {i: 2, t: 'Множитель за шаг $2\cdot0.1=0.2$', e: op.gd.rate}
err: [op.gd.step, op.gd.sign, op.gd.rate]
sum:
  - 'Умею делать шаги градиентного спуска против градиента.'
  - 'Умею находить множитель сжатия и границу шага.'
  - 'Отличаю сходящийся шаг от расходящегося.'
