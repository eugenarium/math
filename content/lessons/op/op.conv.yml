id: op.conv
int:
  - 'Чаша имеет одно дно: скатившийся шарик всегда окажется в нём. Горный хребет с двумя ямами — нет: можно застрять в яме, которая не самая глубокая.'
  - {w: fplot, f: ['x^4-2*x^2'], x: [-2, 2], y: [-2, 3], cap: 'График $x^4-2x^2$ имеет две ямы. Сравни их глубины', ask: 'Какая яма глубже?', ans: 'Они одинаковы: минимум $-1$ в точках $\pm1$. Но этот пример нельзя назвать выпуклым: локальных минимума два.'}
  - {ask: 'Если график функции лежит выше отрезка между любыми двумя его точками, что это за функция?', ans: 'Вогнутая (выпуклая вверх). Выпуклая функция — наоборот: график лежит ниже отрезка.'}
def:
  - {g: convexity}
  - 'Как решать. Для выпуклости проверь $f''\ge0$ на всей области. У выпуклой функции найди единственную критическую точку: она глобальный минимум. У невыпуклой сравни значения всех локальных минимумов.'
ex:
  - {x: p1, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: [2, 4, 6]}
    tol: 0.002
    q: 'Найди наименьшее значение выпуклой функции $f(x)=@{a}x^2+@{b}x$.'
    a: -b^2/(4*a)
    h: ['Минимум при $x=-\frac{b}{2a}$.']
    sol:
      - '$f''(x)=@{2*a}x+@b=0$ даёт $x=-\frac{@b}{@{2*a}}$.'
      - 'Функция выпукла ($f''''=@{2*a}>0$), значит это глобальный минимум.'
      - 'Итог: $f=-\frac{@{b^2}}{@{4*a}}=@{-b^2/(4*a):f3}$.'
  p2:
    k: num
    v: {x1: 0..3, x2: 5..8}
    q: 'Для $f=x^2$ найди разность $\frac{f(x_1)+f(x_2)}{2}-f\left(\frac{x_1+x_2}{2}\right)$ при $x_1=@x1$, $x_2=@x2$.'
    a: ((x2-x1)/2)^2
    e: {op.conv.second: (x2-x1)^2}
    sol:
      - '$\frac{x_1^2+x_2^2}{2}=\frac{@{x1^2}+@{x2^2}}{2}$.'
      - '$f\left(\frac{x_1+x_2}{2}\right)=\left(@{(x1+x2)/2}\right)^2$.'
      - 'Итог: $@{((x2-x1)/2)^2:f2}\ge0$, как и требует выпуклость.'
  p3:
    k: num
    lv: 2
    v: {a: 1..3}
    q: 'Найди наименьшее значение $f(x)=x^4-@{2*a^2}x^2$ на всей прямой.'
    a: -a^4
    sol:
      - '$f''=4x^3-@{4*a^2}x=0$ даёт $x=0$, $x=\pm@a$.'
      - 'В $x=0$ локальный максимум, в $x=\pm@a$ — минимумы.'
      - 'Значение в минимумах: $@{a^4}-@{2*a^4}=@{-a^4}$.'
  p4:
    k: mc
    q: 'Что можно сказать о локальном минимуме выпуклой функции?'
    a: 'Он является глобальным'
    e: {op.conv.local: 'Он может быть не наименьшим значением'}
    x: ['Он не существует']
  p5:
    k: mc
    lv: 2
    q: 'Что верно про сумму двух выпуклых функций?'
    a: 'Она выпукла'
    e: {op.conv.sum: 'Она может быть невыпуклой'}
    x: ['Она вогнута']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при проверке выпуклости $f(x)=x^4$.'
    steps:
      - '$f''(x)=4x^3$, $f''''(x)=12x^2$'
      - '$12x^2\ge0$ при всех $x$'
      - 'Значит, $f$ выпукла на всей прямой'
      - 'Единственная критическая точка $x=0$ — глобальный минимум'
    bad:
      - {i: 3, t: 'Так как $f''''(0)=0$, функция не выпукла', e: op.conv.second}
      - {i: 2, t: '$12x^2\le0$, значит $f$ выпукла', e: op.conv.second}
err: [op.conv.local, op.conv.sum, op.conv.second]
sum:
  - 'Умею находить минимум выпуклой квадратичной функции.'
  - 'Умею проверять выпуклость по знаку второй производной.'
  - 'Отличаю выпуклую функцию, где локальный минимум глобален, от невыпуклой.'
