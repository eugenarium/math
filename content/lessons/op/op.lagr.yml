id: op.lagr
int:
  - 'Найти наименьшие затраты при условии, что нужно произвести ровно $c$ единиц. Ограничение — как плата за вход: чем выше $c$, тем больше затраты. Множитель Лагранжа показывает, сколько стоит одна лишняя единица.'
  - {ask: 'Для $\min(x^2+y^2)$ при $x+y=2$ чему равны оптимум и $\lambda$?', ans: '$x=y=1$, $f^*=2$, $\lambda=2$: из $2x=\lambda$.'}
  - {ask: 'Если ограничение сдвинуть на $x+y=2.1$, как изменится оптимум примерно?', ans: 'На $\lambda\cdot0.1=0.2$: $f^*=\frac{2.1^2}{2}=2.205$, разница $0.205$.'}
def:
  - {g: constrained-optimum}
  - 'Как решать. Запиши $\nabla f=\lambda\nabla g$ и $g=c$. Найди точку и значение $f^*$. Множитель $\lambda$ показывает $\frac{df^*}{dc}$: чувствительность оптимума к смещению ограничения.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {c: [2, 4, 6]}
    q: 'Найди наименьшее значение $x^2+y^2$ при условии $x+y=@c$.'
    a: c^2/2
    e: {op.lagr.feasible: c^2}
    h: ['По симметрии $x=y=\frac{@c}2$.']
  p2:
    k: num
    v: {c0: [4, 6]}
    tol: 0.002
    q: 'Оптимум $f^*(c)=\frac{c^2}{2}$ для $\min(x^2+y^2)$ при $x+y=c$. Найди $\lambda=\frac{df^*}{dc}$ при $c=@c0$.'
    a: c0
    e: {op.lagr.sens: c0^2/2}
    sol:
      - 'Производная $f^*{}''(c)=c$.'
      - 'При $c=@c0$ получаем $\lambda=@c0$.'
      - 'Проверка: из $2x=\lambda$ и $x=\frac{@c0}{2}$ получаем $\lambda=@c0$.'
  p3:
    k: num
    lv: 2
    v: {c: [4, 8, 12]}
    q: 'Максимизируют $xy$ при $x+2y=@c$. Найди множитель $\lambda$ из $\nabla f=\lambda\nabla g$.'
    a: c/4
    e: {op.lagr.grad: c/2}
    sol:
      - '$\nabla f=(y,x)=\lambda(1,2)$, значит $y=\lambda$, $x=2\lambda$.'
      - 'Из $x+2y=@c$: $4\lambda=@c$.'
      - 'Итог: $\lambda=@{c/4}$.'
  p4:
    k: mc
    q: 'Что показывает множитель Лагранжа $\lambda$?'
    a: 'Скорость изменения оптимального значения при смещении ограничения'
    e: {op.lagr.sens: 'Значение функции в оптимуме'}
    x: ['Расстояние до оптимума']
  p5:
    k: mc
    lv: 2
    q: 'Как связаны $\nabla f$ и $\nabla g$ в точке условного оптимума?'
    a: 'Параллельны'
    e: {op.lagr.grad: 'Перпендикулярны'}
    x: ['Равны']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при минимизации $x^2+y^2$ при $x+y=2$.'
    steps:
      - '$2x=\lambda$, $2y=\lambda$, значит $x=y$'
      - 'Из $x+y=2$: $x=y=1$'
      - '$f^*=1+1=2$, $\lambda=2x=2$'
      - 'Сдвиг ограничения на $0.1$ меняет оптимум примерно на $0.2$'
    bad:
      - {i: 2, t: 'Берём $x=2$, $y=0$: условие выполнено', e: op.lagr.feasible}
      - {i: 3, t: '$f^*=\lambda=2$ — это одно и то же', e: op.lagr.sens}
err: [op.lagr.sens, op.lagr.grad, op.lagr.feasible]
sum:
  - 'Умею находить условный оптимум и множитель Лагранжа.'
  - 'Умею объяснять $\lambda$ как цену ограничения.'
  - 'Отличаю множитель от значения оптимума.'
