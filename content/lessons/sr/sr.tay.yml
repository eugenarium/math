id: sr.tay
int:
  - 'Многочлен Тейлора — приближение функции. Если взять все члены, получится ряд: бесконечный многочлен, который может совпасть с функцией.'
  - {w: taylor, f: 'sin(x)', x: [-6, 6], n: [1, 11, 1], cap: 'Увеличивай степень $n$: многочлен для $\sin x$ охватывает всё больше периодов', ask: 'Где многочлен приближает синус лучше всего?', ans: 'Около нуля; чтобы приблизить дальше, нужна большая степень.'}
  - {ask: 'Ряд для $\ln(1+x)$ при $x=3$ даёт $3-\frac92+9-\dots$. Равен ли он $\ln4$?', ans: 'Нет: радиус сходимости ряда равен $1$, при $x=3$ он расходится.'}
def:
  - {g: taylor-series}
  - 'Как решать. Возьми готовое разложение и подставь выражение вместо $x$: коэффициент при $x^n$ умножается на $k^n$ при замене $x\to kx$. Приближай конечной суммой первых членов и сравнивай $x$ с радиусом сходимости.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {k: 2..4}
    tol: 0.002
    q: 'Найди коэффициент при $x^3$ в разложении $\sin(@{k}x)$.'
    a: -k^3/6
    e: {sr.tay.subst: -1/6}
    h: ['$\sin u=u-\frac{u^3}{6}+\dots$ при $u=@{k}x$.']
    sol:
      - '$\sin u=u-\frac{u^3}{6}+\dots$, подставим $u=@{k}x$.'
      - 'Слагаемое $-\frac{(@{k}x)^3}{6}=-\frac{@{k^3}}{6}x^3$.'
      - 'Итог: коэффициент $-\frac{@{k^3}}{6}=@{-k^3/6:f3}$.'
  p2:
    k: num
    v: {k: 2..4}
    tol: 0.002
    q: 'Найди коэффициент при $x^4$ в разложении $e^{@{k}x}$.'
    a: k^4/24
    e: {sr.tay.subst: 1/24}
    sol:
      - '$e^u=1+u+\frac{u^2}{2}+\dots+\frac{u^4}{24}+\dots$, $u=@{k}x$.'
      - 'Слагаемое $\frac{(@{k}x)^4}{24}=\frac{@{k^4}}{24}x^4$.'
      - 'Итог: коэффициент $@{k^4/24:f3}$.'
  p3:
    k: num
    lv: 2
    v: {t: [0.1, 0.2, 0.3]}
    tol: 0.0005
    q: 'Вычисли приближённо $\ln(1+@{t:f1})$ по первым трём членам ряда $\ln(1+x)=x-\frac{x^2}{2}+\frac{x^3}{3}-\dots$.'
    a: t-t^2/2+t^3/3
    e: {sr.tay.coef: t-t^2+t^3}
    sol:
      - 'Подставим $x=@{t:f1}$: $x=@{t:f1}$, $\frac{x^2}{2}=@{t^2/2:f4}$.'
      - 'Третий член $\frac{x^3}{3}=@{t^3/3:f4}$.'
      - 'Итог: $@{t:f1}-@{t^2/2:f4}+@{t^3/3:f4}=@{t-t^2/2+t^3/3:f4}$.'
  p4:
    k: mc
    q: 'Какое разложение у $\cos x$ в нуле?'
    a: '$1-\frac{x^2}{2}+\frac{x^4}{24}-\dots$'
    e: {sr.tay.coef: '$1+\frac{x^2}{2}+\frac{x^4}{24}+\dots$'}
    x: ['$x-\frac{x^3}{6}+\dots$']
  p5:
    k: mc
    lv: 2
    q: 'Равен ли ряд для $\ln(1+x)$ числу $\ln4$ при $x=3$?'
    a: 'Нет: вне радиуса сходимости $R=1$ ряд расходится'
    e: {sr.tay.radius: 'Да: ряд сходится к $\ln4$'}
    x: ['Да, но сходится очень медленно']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при разложении $e^{-x^2}$.'
    steps:
      - 'Известно $e^u=1+u+\frac{u^2}{2}+\dots$'
      - 'Подставим $u=-x^2$: $1-x^2+\frac{x^4}{2}-\dots$'
      - 'Коэффициент при $x^4$ равен $\frac12$'
      - 'Почленно интегрируя: $\int e^{-x^2}dx=x-\frac{x^3}{3}+\frac{x^5}{10}-\dots$'
    bad:
      - {i: 3, t: 'Коэффициент при $x^4$ равен $\frac1{24}$', e: sr.tay.coef}
      - {i: 4, t: 'Почленно интегрируя: $\int e^{-x^2}dx=x-x^3+x^5-\dots$'}
err: [sr.tay.coef, sr.tay.radius, sr.tay.subst]
sum:
  - 'Умею раскладывать функции подстановкой в стандартные ряды.'
  - 'Умею приближать значения функции первыми членами ряда.'
  - 'Отличаю применимость ряда внутри радиуса сходимости от вне него.'
