id: sr.num
int:
  - 'Прибавляем $\frac12+\frac14+\frac18+\dots$ без конца. Каждое слагаемое вдвое меньше предыдущего. Получится ли конечное число, или сумма растёт без предела?'
  - {w: series, an: '1/2^n', N: [1, 30, 3], mode: sums, y: [0, 1.2], cap: 'Увеличивай число членов $N$ и следи за частичными суммами $S_N$', ask: 'К какому числу приближаются частичные суммы?', ans: 'К $1$: каждый шаг сокращает остаток вдвое.'}
  - {ask: 'Члены ряда $1+\frac12+\frac13+\dots$ стремятся к нулю. Значит ли это, что сумма конечна?', ans: 'Нет. Это гармонический ряд: частичные суммы растут без предела, хотя члены убывают к нулю.'}
def:
  - {g: numerical-series}
  - 'Как решать. Для геометрического ряда найди первый член $a$ и знаменатель $q$: сумма $\frac{a}{1-q}$ при $|q|<1$. Для телескопической суммы разложи член на разность дробей: слагаемые сократятся. Проверь $a_n\to0$.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 5}
pr:
  p1:
    k: num
    fast: 1
    v: {k: [2, 3, 4, 5]}
    tol: 0.002
    q: 'Найди сумму ряда $\sum_{n=0}^{\infty}\left(\frac1{@k}\right)^n$.'
    a: k/(k-1)
    e: {sr.num.start: 1/(k-1)}
    h: ['Первый член равен $1$, знаменатель $\frac1{@k}$.']
  p2:
    k: num
    fast: 1
    v: {N: 4..9}
    tol: 0.002
    q: 'Найди частичную сумму $S_{@N}$ ряда $\sum_{n=1}^{\infty}\frac1{n(n+1)}$.'
    a: N/(N+1)
    e: {sr.num.partial: 1/(N*(N+1))}
    h: ['Разложи $\frac1{n(n+1)}=\frac1n-\frac1{n+1}$.']
    sol:
      - 'Разложим член: $\frac1{n(n+1)}=\frac1n-\frac1{n+1}$.'
      - 'Слагаемые сокращаются, остаются первое и последнее: $S_{@N}=1-\frac1{@{N+1}}$.'
      - 'Итог: $S_{@N}=@{N/(N+1):f3}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..6, k: [2, 3, 4, 5]}
    tol: 0.002
    q: 'Найди сумму ряда $\sum_{n=1}^{\infty}@a\left(\frac1{@k}\right)^{n-1}$.'
    a: a*k/(k-1)
    e: {sr.num.start: a/(k-1)}
    sol:
      - 'Первый член $@a$, знаменатель $q=\frac1{@k}$, $|q|<1$.'
      - 'Сумма $\frac{a}{1-q}=\frac{@a}{1-\frac1{@k}}$.'
      - 'Итог: $@{a*k/(k-1):f3}$.'
  p4:
    k: mc
    q: 'Если $a_n\to0$, то ряд $\sum a_n$'
    a: 'может как сходиться, так и расходиться'
    e: {sr.num.necessary: 'обязательно сходится'}
    x: ['обязательно расходится']
    h: ['Вспомни гармонический ряд.']
  p5:
    k: mc
    lv: 2
    q: 'Что верно про гармонический ряд $\sum\frac1n$?'
    a: 'Он расходится, хотя члены стремятся к нулю'
    e: {sr.num.necessary: 'Он сходится, потому что $\frac1n\to0$'}
    x: ['Он расходится, потому что члены не стремятся к нулю']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении суммы ряда $\sum_{n=1}^{\infty}\left(\frac12\right)^n$.'
    steps:
      - 'Ряд геометрический со знаменателем $q=\frac12$'
      - 'Первый член равен $a_1=\frac12$'
      - 'Сумма $\frac{a_1}{1-q}=\frac{1/2}{1/2}=1$'
      - 'Проверка: $S_N=1-\left(\frac12\right)^N\to1$'
    bad:
      - {i: 3, t: 'Сумма $\frac1{1-q}=2$', e: sr.num.start}
      - {i: 2, t: 'Первый член равен $a_1=1$'}
err: [sr.num.necessary, sr.num.start, sr.num.partial]
sum:
  - 'Умею находить сумму геометрического ряда с учётом первого члена.'
  - 'Умею считать частичные суммы телескопического ряда.'
  - 'Отличаю необходимое условие $a_n\to0$ от сходимости ряда.'
