id: sr.tests
int:
  - 'Не всякий ряд удаётся просуммировать, но часто достаточно узнать, сходится ли он. Для этого сравнивают его с известным рядом или смотрят, как быстро убывают члены.'
  - {ask: 'Члены ряда убывают, как $\frac1{2^n}$ или как $\frac1n$. Какой из рядов сходится?', ans: 'Первый: геометрический ряд со знаменателем $\frac12$. Ряд $\sum\frac1n$ расходится.'}
  - {ask: 'Если отношение соседних членов равно $\frac{n+1}{n}$, стремящееся к $1$, что можно сказать о сходимости?', ans: 'Ничего: при пределе $1$ признак Даламбера не работает. Нужен другой признак.'}
def:
  - {g: convergence-tests}
  - 'Как решать. Для факториалов и степеней найди $L=\lim\frac{a_{n+1}}{a_n}$: при $L<1$ ряд сходится, при $L>1$ расходится. При $L=1$ сравнивай с $p$-рядом или применяй интегральный признак.'
ex:
  - {x: p3, seed: 2}
  - {x: p1, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {p: [1, 2, 3], q: [4, 5]}
    tol: 0.002
    q: 'Для ряда $\sum n\left(\frac{@p}{@q}\right)^n$ найди $L=\lim\limits_{n\to\infty}\frac{a_{n+1}}{a_n}$.'
    a: p/q
    e: {sr.tests.ratio-one: 1}
    h: ['Отношение $\frac{n+1}{n}\to1$, остаётся $\frac{@p}{@q}$.']
    sol:
      - 'Отношение соседних членов равно $\frac{n+1}{n}\cdot\frac{@p}{@q}$.'
      - 'При $n\to\infty$ множитель $\frac{n+1}{n}\to1$.'
      - 'Итог: $L=\frac{@p}{@q}=@{p/q:f2}<1$, ряд сходится.'
  p2:
    k: num
    fast: 1
    q: 'Найди наименьшее целое $p$, при котором ряд $\sum\frac1{n^p}$ сходится.'
    a: 2
    e: {sr.tests.p: 1}
    h: ['$p$-ряд сходится при $p>1$.']
  p3:
    k: num
    lv: 2
    v: {k: 2..5}
    q: 'Для $a_n=\frac{@{k}^n}{n!}$ найди $L=\lim\limits_{n\to\infty}\frac{a_{n+1}}{a_n}$.'
    a: 0
    e: {sr.tests.ratio-one: 1}
    sol:
      - 'Сокращаем: $\frac{a_{n+1}}{a_n}=\frac{@k}{n+1}$, так как $(n+1)!=(n+1)\,n!$.'
      - 'При $n\to\infty$ дробь $\frac{@k}{n+1}\to0$.'
      - 'Итог: $L=0<1$, ряд сходится.'
  p4:
    k: mc
    q: 'Что можно сказать о ряде, если по признаку Даламбера $L=1$?'
    a: 'Признак ничего не решает: нужен другой'
    e: {sr.tests.ratio-one: 'Ряд сходится'}
    x: ['Ряд расходится']
    h: ['У $\sum\frac1n$ и $\sum\frac1{n^2}$ предел отношения равен $1$.']
  p5:
    k: mc
    lv: 2
    q: 'Известно, что $0\le a_n\le\frac1n$. Что следует о ряде $\sum a_n$?'
    a: 'Ничего определённого: ряд $\sum\frac1n$ расходится'
    e: {sr.tests.compare: 'Ряд сходится'}
    x: ['Ряд расходится']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании ряда $\sum\frac1{n^{3/2}}$.'
    steps:
      - 'Ряд $\sum\frac1{n^{3/2}}$ — это $p$-ряд'
      - 'Показатель $p=\frac32$'
      - 'Так как $p>1$, ряд сходится'
      - 'Итог: $\sum\frac1{n^{3/2}}$ сходится'
    bad:
      - {i: 3, t: 'Так как $p\ge1$, ряд сходится', e: sr.tests.p}
      - {i: 2, t: 'Показатель $p=\frac23$'}
err: [sr.tests.ratio-one, sr.tests.p, sr.tests.compare]
sum:
  - 'Умею применять признак Даламбера к рядам со степенями и факториалами.'
  - 'Умею применять сравнение и знаю границу сходимости $p$-ряда.'
  - 'Отличаю случай $L=1$, где признак не работает.'
