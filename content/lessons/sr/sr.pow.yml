id: sr.pow
int:
  - 'Ряд $1+x+x^2+x^3+\dots$ при $x=\frac12$ даёт $2$, а при $x=2$ расходится. От значения $x$ зависит, сходится ли ряд. Множество «хороших» $x$ — это интервал.'
  - {ask: 'Для какого $x$ ряд $\sum x^n$ сходится: при $x=0.9$, $x=-0.9$ или $x=1.1$?', ans: 'При $x=0.9$ и $x=-0.9$: $|x|<1$. При $x=1.1$ расходится.'}
  - {ask: 'Что происходит с рядом $\sum x^n$ в точках $x=1$ и $x=-1$?', ans: 'Расходится в обеих: члены не стремятся к нулю. Концы интервала проверяют отдельно.'}
def:
  - {g: power-series}
  - 'Как решать. Найди радиус $R=\lim\left|\frac{a_n}{a_{n+1}}\right|$. Интервал сходимости $(c-R,\ c+R)$, где $c$ — центр. Затем подставь каждый конец и исследуй получившийся числовой ряд.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 4}
pr:
  p1:
    k: num
    fast: 1
    v: {k: 2..6}
    q: 'Найди радиус сходимости ряда $\sum\frac{x^n}{@{k}^n}$.'
    a: k
    e: {sr.pow.radius: 1/k}
    h: ['Ряд геометрический со знаменателем $\frac{x}{@k}$.']
    sol:
      - 'Коэффициент $a_n=\frac1{@{k}^n}$.'
      - 'Отношение $\left|\frac{a_n}{a_{n+1}}\right|=@k$.'
      - 'Итог: $R=@k$.'
  p2:
    k: num
    v: {c: 1..4, k: 2..5}
    q: 'Найди правый конец интервала сходимости ряда $\sum\frac{(x-@c)^n}{@{k}^n}$.'
    a: c+k
    e: {sr.pow.center: k}
    sol:
      - 'Радиус $R=@k$, центр $x=@c$.'
      - 'Интервал $(@c-@k,\ @c+@k)=(@{c-k},\ @{c+k})$.'
      - 'Правый конец: $@{c+k}$.'
  p3:
    k: num
    lv: 2
    v: {k: [4, 9, 16, 25]}
    tol: 0.002
    q: 'Найди радиус сходимости ряда $\sum @{k}^n x^{2n}$.'
    a: 1/sqrt(k)
    e: {sr.pow.radius: 1/k}
    sol:
      - 'Ряд геометрический по $t=x^2$: сходится при $@k\,x^2<1$.'
      - 'Отсюда $x^2<\frac1{@k}$.'
      - 'Итог: $|x|<\frac1{\sqrt{@k}}$, $R=@{1/sqrt(k):f3}$.'
  p4:
    k: mc
    q: 'Какой радиус сходимости у ряда $\sum\frac{x^n}{n!}$?'
    a: 'Бесконечный: ряд сходится при любом $x$'
    x: ['$R=1$', '$R=0$']
  p5:
    k: mc
    lv: 2
    q: 'У ряда $\sum\frac{x^n}{n}$ радиус $R=1$. Что в точках $x=1$ и $x=-1$?'
    a: 'В $x=-1$ сходится, в $x=1$ расходится'
    e: {sr.pow.ends: 'Сходится в обеих точках'}
    x: ['Расходится в обеих точках']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании ряда $\sum\frac{(x-2)^n}{3^n}$.'
    steps:
      - 'Отношение коэффициентов равно $3$, значит $R=3$'
      - 'Центр $x=2$, интервал $(-1,\ 5)$'
      - 'В $x=5$ получаем $\sum1$ — расходится'
      - 'В $x=-1$ получаем $\sum(-1)^n$ — расходится, итог: интервал $(-1,\ 5)$'
    bad:
      - {i: 2, t: 'Интервал $(-3,\ 3)$', e: sr.pow.center}
      - {i: 3, t: 'Концы входят: ответ $[-1,\ 5]$', e: sr.pow.ends}
err: [sr.pow.radius, sr.pow.ends, sr.pow.center]
sum:
  - 'Умею находить радиус и интервал сходимости степенного ряда.'
  - 'Умею учитывать центр ряда и проверять концы интервала.'
  - 'Отличаю радиус сходимости от обратной величины отношения коэффициентов.'
