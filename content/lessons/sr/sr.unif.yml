id: sr.unif
int:
  - 'Функции $f_n(x)=x^n$ на $[0,1]$: при каждом $x<1$ значения стремятся к нулю, а при $x=1$ равны $1$. Предел разрывен, хотя каждая $x^n$ непрерывна.'
  - {ask: 'Чему равна $\sup x^n$ на $[0,1)$ при любом $n$?', ans: 'Единице: подбирая $x$ ближе к $1$, можно сделать $x^n$ сколь угодно близким к $1$. Поэтому сходимость не равномерна.'}
  - {ask: 'На отрезке $[0,\frac12]$ чему равна $\sup x^n$?', ans: '$\left(\frac12\right)^n\to0$: на этом отрезке сходимость равномерна.'}
def:
  - {g: uniform-convergence}
  - 'Как решать. Вычисли $\sup|f_n-f|$ по множеству и проверь, стремится ли он к нулю. Для ряда оцени члены: $|f_n(x)|\le M_n$ при сходящемся $\sum M_n$ даёт равномерную сходимость. Равномерный предел непрерывных функций непрерывен.'
ex:
  - {x: p1, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [0.5, 0.8, 0.9], n: 2..4}
    tol: 0.002
    q: 'Найди наибольшее значение $x^{@n}$ на отрезке $[0, @{a:f1}]$.'
    a: a^n
    e: {sr.unif.point: 0}
    h: ['Функция $x^{@n}$ возрастает.']
    sol:
      - 'Функция $x^{@n}$ возрастает на $[0,\ @{a:f1}]$.'
      - 'Наибольшее значение — на правом конце.'
      - 'Итог: $@{a:f1}^{@n}=@{a^n:f4}$.'
  p2:
    k: num
    fast: 1
    v: {k: 2..6}
    tol: 0.002
    q: 'Для ряда $\sum\frac{\sin nx}{n^2}$ найди мажоранту $M_n$ при $n=@k$: $\left|\frac{\sin nx}{n^2}\right|\le M_n$.'
    a: 1/k^2
    e: {sr.unif.mtest: 1/k}
    h: ['$|\sin nx|\le1$.']
  p3:
    k: num
    lv: 2
    v: {L: [2, 3, 4], eps: [0.5, 0.25, 0.1]}
    tol: 0.01
    q: 'Для $f_n(x)=\frac{x}{n}$ на $[0,@L]$ найди $N=\frac{L}{\varepsilon}$ при $\varepsilon=@{eps:f2}$: после него $\sup|f_n|<\varepsilon$.'
    a: L/eps
    sol:
      - '$\sup_{[0,@L]}\frac{x}{n}=\frac{@L}{n}$.'
      - 'Нужно $\frac{@L}{n}<@{eps:f2}$, то есть $n>\frac{@L}{@{eps:f2}}$.'
      - 'Итог: $N=@{L/eps}$.'
  p4:
    k: mc
    q: 'К чему сходится $x^n$ на $[0,1]$ и как?'
    a: 'К $0$ при $x<1$ и к $1$ при $x=1$; сходимость не равномерна'
    e: {sr.unif.point: 'Равномерно к нулю'}
    x: ['Равномерно к $1$']
  p5:
    k: mc
    lv: 2
    q: 'Непрерывны ли пределы последовательностей непрерывных функций?'
    a: 'Равномерные пределы непрерывны; поточечные могут быть разрывными'
    e: {sr.unif.continuity: 'Всегда непрерывны'}
    x: ['Всегда разрывны']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании ряда $\sum\frac{\cos nx}{n^2}$.'
    steps:
      - 'Оценим члены: $\left|\frac{\cos nx}{n^2}\right|\le\frac1{n^2}$ при любом $x$'
      - 'Ряд $\sum\frac1{n^2}$ сходится'
      - 'По признаку Вейерштрасса ряд сходится равномерно на $\mathbb R$'
      - 'Значит, сумма ряда непрерывна'
    bad:
      - {i: 2, t: 'Ряд $\sum\frac1{n}$ сходится', e: sr.unif.mtest}
      - {i: 4, t: 'Сумма ряда может быть разрывной', e: sr.unif.continuity}
err: [sr.unif.point, sr.unif.mtest, sr.unif.continuity]
sum:
  - 'Умею находить $\sup|f_n-f|$ на отрезке и проверять равномерность.'
  - 'Умею применять признак Вейерштрасса с мажорантой из сходящегося ряда.'
  - 'Отличаю поточечную сходимость от равномерной и помню о непрерывности предела.'
