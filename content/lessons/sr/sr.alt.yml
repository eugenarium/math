id: sr.alt
int:
  - 'Сумма $1-\frac12+\frac13-\frac14+\dots$ колеблется вокруг предела: то плюс, то минус. Члены убывают, и колебания затухают.'
  - {w: series, an: '(-1)^(n+1)/n', N: [1, 30, 5], mode: sums, y: [0, 1.2], cap: 'Увеличивай $N$ и следи, как частичные суммы колеблются вокруг предела', ask: 'Лежит ли предел между соседними частичными суммами?', ans: 'Да: суммы колеблются вокруг предела, и ошибка не больше первого отброшенного члена.'}
  - {ask: 'Ряд $\sum\frac{(-1)^n}{n}$ сходится. Сходится ли ряд из модулей $\sum\frac1n$?', ans: 'Нет: это гармонический ряд. Значит, исходный ряд сходится условно.'}
def:
  - {g: alternating-series}
  - 'Как решать. Для знакочередующегося ряда проверь два условия Лейбница: $a_n$ убывает и $a_n\to0$. Ошибка не превышает первого отброшенного члена. Чтобы отличить абсолютную сходимость от условной, исследуй ряд из модулей.'
ex:
  - {x: p2, seed: 2}
  - {x: p1, seed: 4}
pr:
  p1:
    k: num
    fast: 1
    v: {N: 4..9}
    tol: 0.002
    q: 'Для ряда $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n}$ найди оценку ошибки после $@N$ членов (первый отброшенный член).'
    a: 1/(N+1)
    h: ['Ошибка не больше модуля $a_{@{N+1}}$.']
    sol:
      - 'По признаку Лейбница ошибка не превышает первого отброшенного члена.'
      - 'Первый отброшенный член $a_{@{N+1}}=\frac1{@{N+1}}$.'
      - 'Итог: ошибка не больше $@{1/(N+1):f3}$.'
  p2:
    k: num
    v: {eps: [0.1, 0.05, 0.02, 0.01]}
    tol: 0.01
    q: 'Сколько первых членов ряда $\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n}$ достаточно взять, чтобы ошибка была меньше $@eps$?'
    a: 1/eps
    sol:
      - 'Ошибка после $N$ членов не больше $\frac1{N+1}$.'
      - 'Нужно $\frac1{N+1}<@eps$, то есть $N+1>@{1/eps}$.'
      - 'Наименьшее такое $N$ равно $@{1/eps}$.'
  p3:
    k: num
    lv: 2
    v: {k: [2, 3, 4]}
    tol: 0.002
    q: 'Найди сумму ряда из модулей $\sum_{n=0}^{\infty}\left|\left(-\frac1{@k}\right)^n\right|$.'
    a: k/(k-1)
    e: {sr.alt.abs: k/(k+1)}
    sol:
      - 'Модуль каждого члена $\left(\frac1{@k}\right)^n$: геометрический ряд.'
      - 'Знаменатель $q=\frac1{@k}$, первый член $1$.'
      - 'Сумма $\frac1{1-q}=@{k/(k-1):f3}$.'
  p4:
    k: mc
    q: 'Условно сходящийся ряд — это ряд, который'
    a: 'сходится, а ряд из его модулей расходится'
    e: {sr.alt.abs: 'сходится вместе с рядом из модулей'}
    x: ['расходится, а ряд из модулей сходится']
  p5:
    k: mc
    lv: 2
    q: 'Можно ли переставлять члены условно сходящегося ряда?'
    a: 'Нельзя: от перестановки может измениться сумма'
    e: {sr.alt.perm: 'Можно: сумма не зависит от порядка'}
    x: ['Можно, но только соседние члены']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании ряда $\sum\frac{(-1)^n}{\sqrt n}$.'
    steps:
      - 'Члены $a_n=\frac1{\sqrt n}$ положительны'
      - 'Последовательность $a_n$ убывает'
      - 'И $a_n\to0$'
      - 'По признаку Лейбница ряд сходится'
    bad:
      - {i: 2, t: 'Убывание проверять не нужно: достаточно $a_n\to0$', e: sr.alt.leibniz}
      - {i: 1, t: 'Члены $a_n=\frac1{\sqrt n}$ отрицательны'}
err: [sr.alt.leibniz, sr.alt.abs, sr.alt.perm]
sum:
  - 'Умею применять признак Лейбница и оценивать ошибку по первому отброшенному члену.'
  - 'Умею находить число членов для заданной точности.'
  - 'Отличаю абсолютную сходимость от условной.'
