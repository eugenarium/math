id: sr.four
int:
  - 'Звук ноты — сумма синусоид кратных частот. Ряд Фурье раскладывает любое периодическое колебание по таким гармоникам.'
  - {ask: 'Функция $f(x)=x$ на $(-\pi,\pi)$ нечётна. Какие коэффициенты Фурье обращаются в нуль?', ans: 'Все $a_n$, включая $a_0$: произведение нечётной функции на чётный косинус нечётно, и интеграл по симметричному отрезку равен нулю.'}
  - {ask: 'Прямоугольная волна скачет с $-1$ на $1$. Чему равна сумма ряда в точке скачка?', ans: 'Нулю: среднему арифметическому значений слева и справа.'}
def:
  - {g: fourier-series}
  - 'Как решать. Определи чётность: чётная функция даёт только косинусы, нечётная — только синусы. Вычисли нужные коэффициенты интегрированием по частям. Свободный член ряда — $\frac{a_0}{2}$. В точке разрыва сумма равна среднему односторонних пределов.'
ex:
  - {x: p1, seed: 2}
  - {x: p3, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [1, 2, 3, 4, 5]}
    tol: 0.002
    q: 'Для $f(x)=x$ на $(-\pi,\pi)$ найди коэффициент $b_{@n}=\frac{2(-1)^{n+1}}{n}$.'
    a: 2*(-1)^(n+1)/n
    h: ['Подставь $n=@n$ в формулу.']
    sol:
      - 'Знак $(-1)^{@n+1}=@{(-1)^(n+1)}$.'
      - 'Числитель $2\cdot@{(-1)^(n+1)}=@{2*(-1)^(n+1)}$.'
      - 'Итог: $b_{@n}=@{2*(-1)^(n+1)/n:f3}$.'
  p2:
    k: num
    fast: 1
    v: {c: 2..6}
    q: 'Для постоянной функции $f(x)=@c$ на $(-\pi,\pi)$ найди коэффициент $a_0=\frac1\pi\int_{-\pi}^{\pi}f\,dx$.'
    a: 2*c
    e: {sr.four.a0: c}
    h: ['Интеграл по отрезку длины $2\pi$ равен $2\pi c$.']
  p3:
    k: num
    lv: 2
    v: {n: [1, 3, 5]}
    tol: 0.002
    q: 'Для прямоугольной волны ($f=1$ на $(0,\pi)$, $f=-1$ на $(-\pi,0)$) найди $b_{@n}=\frac{4}{\pi n}$.'
    a: 4/(pi*n)
    e: {sr.four.parity: 0}
    sol:
      - 'Волна нечётна, поэтому $a_n=0$ и остаются синусы.'
      - 'Для нечётных $n$ коэффициент $b_n=\frac{4}{\pi n}$.'
      - 'Итог: $b_{@n}=\frac4{\pi\cdot@n}=@{4/(pi*n):f3}$.'
  p4:
    k: mc
    q: 'Нечётная функция на $(-\pi,\pi)$ раскладывается'
    a: 'только по синусам'
    e: {sr.four.parity: 'только по косинусам'}
    x: ['по синусам и косинусам с равными весами']
  p5:
    k: mc
    lv: 2
    q: 'Чему равна сумма ряда Фурье в точке разрыва $x_0$?'
    a: 'Среднему арифметическому односторонних пределов'
    e: {sr.four.jump: 'Значению функции слева'}
    x: ['Нулю']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при разложении $f(x)=x^2$ на $(-\pi,\pi)$.'
    steps:
      - 'Функция $x^2$ чётна, поэтому $b_n=0$'
      - '$a_0=\frac1\pi\int_{-\pi}^{\pi}x^2dx=\frac{2\pi^2}{3}$'
      - 'Свободный член ряда $\frac{a_0}{2}=\frac{\pi^2}{3}$'
      - 'Значение ряда в $x=\pi$ равно $\pi^2$: функция непрерывна'
    bad:
      - {i: 1, t: 'Функция $x^2$ нечётна, поэтому $a_n=0$', e: sr.four.parity}
      - {i: 3, t: 'Свободный член ряда равен $a_0=\frac{2\pi^2}{3}$', e: sr.four.a0}
err: [sr.four.parity, sr.four.jump, sr.four.a0]
sum:
  - 'Умею находить коэффициенты Фурье нечётных и чётных функций.'
  - 'Умею использовать свободный член $\frac{a_0}{2}$ и значение суммы в точке разрыва.'
  - 'Отличаю коэффициенты, которые исчезают у чётной и нечётной функции.'
