id: c1.lhop
int:
  - 'Предел $\lim_{x\to0}\frac{e^{x}-1}{x}$ даёт $\frac00$. Разложить на множители нечего. Но рядом с нулём $e^x-1$ ведёт себя как прямая с наклоном $(e^x)''=1$, а $x$ — как прямая с наклоном $1$.'
  - {ask: 'Чему равно отношение наклонов этих двух «прямых»?', ans: 'Единице. Так и получается правило Лопиталя: предел отношения функций равен пределу отношения их производных.'}
  - 'Важно: числитель и знаменатель дифференцируют по отдельности, а не как частное. И только если подстановка дала $\frac00$.'
def:
  - {g: lhopital-rule}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..5}
    q: 'Найди $\lim_{x\to0}\frac{e^{@{a}x}-1}{x}$.'
    a: a
    h: ['Производная числителя $@{a}e^{@{a}x}$ при $x=0$ равна $@a$, знаменателя — $1$.']
  p2:
    k: num
    lv: 2
    v: {a: [2, 3, 4, 5], b: [1, 6, 7]}
    q: 'Найди $\lim_{x\to0}\frac{x+@a}{x+@b}$.'
    a: a/b
    tol: 0.002
    e: {c1.lhop.not-indeterminate: 1}
    h: ['Сначала подставь $x=0$.']
    sol:
      - 'Подстановка $x=0$ даёт $\frac{@a}{@b}$: это число, неопределённости нет.'
      - 'Правило Лопиталя здесь неприменимо. Ответ — значение дроби.'
      - 'Предел равен $\frac{@a}{@b}=@{a/b:f3}$.'
  p3:
    k: num
    lv: 2
    v: {a: 2..5}
    q: 'Найди $\lim_{x\to0}\frac{1-\cos @{a}x}{x^2}$.'
    a: a^2/2
    h: ['После первого применения снова получится $\frac00$.']
    sol:
      - 'Подстановка даёт $\frac00$. Дифференцируем: $\frac{@{a}\sin @{a}x}{2x}$.'
      - 'Снова $\frac00$. Дифференцируем ещё раз: $\frac{@{a^2}\cos @{a}x}{2}$.'
      - 'При $x\to0$ получаем $\frac{@{a^2}}{2}=@{a^2/2:f1}$.'
  p4:
    k: mc
    q: 'В каком пределе правило Лопиталя применимо сразу?'
    a: '$\lim_{x\to0}\frac{\sin x}{x}$'
    e: {c1.lhop.not-indeterminate: '$\lim_{x\to0}\frac{x+2}{x+1}$'}
    x: ['$\lim_{x\to1}\frac{x+1}{x-1}$', '$\lim_{x\to0}\frac{\cos x}{x+1}$']
    h: ['Нужна форма $\frac00$.']
  p5:
    k: num
    lv: 2
    v: {a: 2..4}
    q: 'Найди $\lim_{x\to0}\frac{e^{@{a}x}-1-@{a}x}{x^2}$.'
    a: a^2/2
    h: ['Применяй правило дважды.']
    sol:
      - 'Подстановка даёт $\frac00$. Дифференцируем: $\frac{@{a}e^{@{a}x}-@a}{2x}$.'
      - 'Снова $\frac00$. Дифференцируем ещё раз: $\frac{@{a^2}e^{@{a}x}}{2}$.'
      - 'При $x\to0$ получаем $\frac{@{a^2}}{2}=@{a^2/2:f1}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\lim_{x\to0}\frac{x+2}{x+1}$.'
    steps:
      - 'Подстановка $x=0$ даёт $\frac21$: неопределённости нет'
      - 'Правило Лопиталя не нужно: предел равен значению дроби'
      - 'Итог: $\lim=2$'
    bad:
      - {i: 2, t: 'Применим правило Лопиталя: $\lim=\frac11=1$', e: c1.lhop.not-indeterminate}
      - {i: 3, t: 'Итог: $\lim=\frac12$'}
err: [c1.lhop.not-indeterminate]
sum:
  - 'Умею применять правило Лопиталя к $\frac00$, в том числе дважды.'
  - 'Проверяю подстановкой, что неопределённость действительно есть.'
