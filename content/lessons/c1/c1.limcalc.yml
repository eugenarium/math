id: c1.limcalc
int:
  - 'Подставим $x=2$ в дробь $\frac{x^2-4}{x-2}$. Получится $\frac00$. Чему равен предел при $x\to2$?'
  - {ask: 'Числитель $x^2-4$ можно разложить на множители. Что получится после сокращения?', ans: '$\frac{(x-2)(x+2)}{x-2}=x+2$ при $x\ne2$. Предел равен $4$. Форма $\frac00$ была лишь сигналом: дробь нужно преобразовать.'}
  - 'Для $x\to\infty$ приём другой: числитель и знаменатель делят на старшую степень $x$.'
def:
  - {g: indeterminate-form}
  - {g: notable-limit}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..5}
    q: 'Найди $\lim_{x\to@a}\frac{x^2-@{a^2}}{x-@a}$.'
    a: 2*a
    e: {c1.limcalc.zero-zero: 0}
    h: ['Разложи числитель: $x^2-@{a^2}=(x-@a)(x+@a)$.']
  p2:
    k: num
    lv: 2
    v: {a: 2..4, b: 5..7}
    q: 'Найди $\lim_{x\to@a}\frac{x^2-@{a+b}x+@{a*b}}{x-@a}$.'
    a: a-b
    e: {c1.limcalc.zero-zero: 0}
    h: ['Числитель раскладывается как $(x-@a)(x-@b)$.']
    sol:
      - 'Подстановка $x=@a$ даёт $\frac00$: нужно преобразовать дробь.'
      - 'Числитель: $x^2-@{a+b}x+@{a*b}=(x-@a)(x-@b)$. Сократим на $x-@a$.'
      - 'Остаётся $x-@b$; при $x\to@a$ получаем $@a-@b=@{a-b}$.'
  p3:
    k: num
    lv: 2
    v: {p: [2, 4, 6], q: [1, 3, 5], b: 1..5, d: 1..5}
    q: 'Найди $\lim_{x\to\infty}\frac{@{p}x^2+@{b}x}{@{q}x^2+@d}$.'
    a: p/q
    tol: 0.002
    e: {c1.limcalc.inf-ratio: 1}
    h: ['Раздели числитель и знаменатель на $x^2$.']
    sol:
      - 'Это $\frac{\infty}{\infty}$. Делим числитель и знаменатель на $x^2$.'
      - 'Получаем $\frac{@p+@b/x}{@q+@d/x^2}$. Дроби с $x$ в знаменателе стремятся к нулю.'
      - 'Предел равен $\frac{@p}{@q}=@{p/q:f3}$.'
  p4:
    k: mc
    q: 'Чему равен $\lim_{x\to0}\frac{\sin 3x}{x}$?'
    a: '$3$'
    e: {c1.limcalc.zero-zero: '$0$'}
    x: ['$1$', '$\frac13$']
    h: ['Запиши $\frac{\sin 3x}{x}=3\cdot\frac{\sin 3x}{3x}$.']
  p5:
    k: num
    lv: 2
    v: {k: 2..6, m: 2..4}
    q: 'Найди $\lim_{x\to0}\frac{\sin @{k}x}{@{m}x}$.'
    a: k/m
    tol: 0.002
    e: {c1.limcalc.zero-zero: 0}
    h: ['Домножь и раздели на $@k$, чтобы получить $\frac{\sin u}{u}$.']
    sol:
      - 'Подстановка даёт $\frac00$.'
      - 'Перепишем: $\frac{\sin @{k}x}{@{m}x}=\frac{@k}{@m}\cdot\frac{\sin @{k}x}{@{k}x}$.'
      - 'Второй множитель стремится к $1$. Предел равен $\frac{@k}{@m}=@{k/m:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\lim_{x\to2}\frac{x^2-4}{x-2}$.'
    steps:
      - 'Подстановка $x=2$ даёт $\frac00$: неопределённость, ответ не получен'
      - '$\frac{x^2-4}{x-2}=\frac{(x-2)(x+2)}{x-2}=x+2$ при $x\ne2$'
      - 'Итог: $\lim=4$'
    bad:
      - {i: 1, t: 'Подстановка $x=2$ даёт $\frac00=0$, значит предел равен $0$', e: c1.limcalc.zero-zero}
      - {i: 3, t: 'Итог: $\lim=2$'}
err: [c1.limcalc.zero-zero, c1.limcalc.inf-ratio]
sum:
  - 'Умею раскрывать $\frac00$ разложением на множители и сокращением.'
  - 'Умею раскрывать $\frac{\infty}{\infty}$ делением на старшую степень.'
  - 'Отличаю неопределённость от числа: $\frac00$ — не $0$, а $\frac{\infty}{\infty}$ — не $1$.'
