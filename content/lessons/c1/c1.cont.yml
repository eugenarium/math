id: c1.cont
int:
  - 'Функция, график которой можно провести, не отрывая карандаша, называется непрерывной. Но «на глаз» не годится для математики: нужно точное условие. Найдём его на примере.'
  - w: fplot
    f: 'x != 1 ? x + 1 : c'
    x: [-2, 4.1]
    y: [-1, 6]
    sl: {c: [0, 5, 0.5, 0.5]}
    pts: [['1', 'c']]
    lab: 1
    cap: 'Функция равна $x+1$ везде, кроме точки $x=1$. Двигай значение $c=f(1)$'
    ask: 'При каком $c$ график не рвётся в точке $x=1$?'
    ans: 'При $c=2$: значение в точке равно пределу $\lim_{x\to1}(x+1)=2$. Это и есть непрерывность.'
def:
  - {g: continuity}
  - {g: discontinuity-types}
  - {g: intermediate-value}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..4, b: 1..4}
    q: 'Функция равна $x+@b$ при $x\ne@a$ и $c$ при $x=@a$. При каком $c$ она непрерывна в точке $@a$?'
    a: a+b
    h: ['Значение в точке должно совпасть с пределом, а предел $x+@b$ при $x\to@a$ найди подстановкой.']
  p2:
    k: mc
    q: 'Функция $f$ имеет предел при $x\to a$, но в точке $a$ не определена. Непрерывна ли она в точке $a$?'
    a: 'Нет: в точке $a$ она вообще не определена'
    e: {c1.cont.limit-only: 'Да: предел существует, этого достаточно'}
    x: ['Да, если предел положителен', 'Зависит от того, чему равен предел']
    h: ['Для непрерывности нужно, чтобы $f(a)$ существовало.']
  p3:
    k: num
    lv: 2
    v: {a: -3..2, b: 4..9}
    q: 'Непрерывная на $[0, 1]$ функция имеет $f(0)=@a$ и $f(1)=@b$. Сколько целых значений она обязательно принимает на этом отрезке?'
    a: b-a+1
    h: ['По теореме о промежуточном значении принимаются все значения между $f(0)$ и $f(1)$.']
    sol:
      - 'Функция непрерывна, значит, принимает все значения между $@a$ и $@b$ включительно.'
      - 'Нужны целые числа от $@a$ до $@b$, концы тоже считаются.'
      - 'Их количество равно верхней границе минус нижняя плюс один: $@{b-a+1}$.'
  p4:
    k: mc
    lv: 2
    q: 'Функция $f$ на $[0, 2]$ имеет $f(0)=-1$ и $f(2)=3$. Можно ли утверждать, что уравнение $f(x)=0$ имеет решение на $[0, 2]$?'
    a: 'Нет: про непрерывность ничего не известно, а без неё теорема не работает'
    e: {c1.cont.ivt-nocont: 'Да: значения на концах разных знаков, значит, ноль есть'}
    x: ['Да, потому что $f(0)<f(2)$', 'Нет: нулей на этом отрезке быть не может']
    h: ['Подумай о функции, которая «перепрыгивает» через ноль скачком.']
  p5:
    k: graph
    v: {a: [1, 2, 3]}
    q: 'Подбери $c=f(@a)$ так, чтобы функция стала непрерывной в точке $x=@a$.'
    w: {w: fplot, f: 'x != a ? x + 1 : c', x: [-2, 6.1], y: [-1, 7], sl: {c: [0, 7, 0.5, 0.5]}, pts: [['a', 'c']]}
    goal: {c: ['a+1', 0.25]}
    h: ['Предел $x+1$ при $x\to@a$ равен $@{a+1}$: значение в точке должно стать таким же.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в доказательстве того, что $x^3+x-1=0$ имеет корень на $[0, 1]$.'
    steps:
      - 'Рассмотрим $f(x)=x^3+x-1$ на отрезке $[0, 1]$'
      - '$f$ непрерывна как многочлен'
      - '$f(0)=-1<0$ и $f(1)=1>0$'
      - 'По теореме о промежуточном значении на $(0, 1)$ есть корень'
    bad:
      - {i: 2, t: 'Непрерывность проверять не нужно: достаточно разных знаков на концах', e: c1.cont.ivt-nocont}
      - {i: 3, t: '$f(0)=-1<0$ и $f(1)=0>0$'}
err: [c1.cont.limit-only, c1.cont.ivt-nocont]
sum:
  - 'Умею проверять непрерывность в точке: значение определено, предел существует и они равны.'
  - 'Умею подбирать значение в точке, устраняющее разрыв.'
  - 'Умею применять теорему о промежуточном значении, проверив непрерывность.'
