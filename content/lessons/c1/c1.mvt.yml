id: c1.mvt
int:
  - 'Машина проехала $120$ км за $2$ часа: средняя скорость $60$ км/ч. Мог ли спидометр ни разу не показать $60$?'
  - {ask: 'Если гладкая функция достигает наибольшего значения во внутренней точке, чему равна там производная?', ans: 'Нулю: график у вершины горизонтален. Это теорема Ферма.'}
  - 'Из неё следуют Ролль (равные значения на концах дают точку с $f''=0$) и Лагранж: где-то мгновенная скорость равна средней.'
def:
  - {g: fermat-theorem}
  - {g: rolle-theorem}
  - {g: lagrange-theorem}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..4, b: 5..8}
    q: 'Найди среднюю скорость изменения $f(x)=x^2$ на отрезке $[@a, @b]$.'
    a: a+b
    h: ['Вычисли $\frac{f(b)-f(a)}{b-a}$, то есть $\frac{@{b^2}-@{a^2}}{@{b-a}}$.']
  p2:
    k: num
    lv: 2
    v: {b: 3..6}
    q: 'Найди точку $c\in(0, @b)$ из теоремы Лагранжа для $f(x)=x^3$ на $[0, @b]$.'
    a: b/sqrt(3)
    tol: 0.002
    e: {c1.mvt.midpoint: b/2}
    h: ['Реши $3c^2=\frac{f(@b)-f(0)}{@b}$.']
    sol:
      - 'Средняя скорость: $\frac{@{b^3}-0}{@b}=@{b^2}$.'
      - 'Уравнение $f''(c)=3c^2=@{b^2}$, значит $c^2=@{b^2/3:f3}$.'
      - 'Берём корень внутри $(0, @b)$: $c=@{b/sqrt(3):f3}$.'
  p3:
    k: num
    lv: 2
    v: {p: [2, 4, 6, 8]}
    q: 'Функция $f(x)=x(x-@p)$ принимает на $[0, @p]$ равные значения на концах. Найди $c$ из теоремы Ролля.'
    a: p/2
    h: ['Реши $f''(c)=0$.']
    sol:
      - '$f(x)=x^2-@{p}x$, значит $f(0)=f(@p)=0$.'
      - 'Производная $f''(x)=2x-@p$.'
      - '$f''(c)=0$ при $c=@{p/2}$.'
  p4:
    k: mc
    q: 'Для $f(x)=|x|$ на $[-1, 1]$ верно $f(-1)=f(1)$. Почему теорема Ролля не даёт точку с $f''=0$?'
    a: 'В точке $0$ функция не дифференцируема'
    e: {c1.mvt.cond: 'Такая точка есть, это $c=0$'}
    x: ['Функция разрывна', 'Значения на концах различны']
    h: ['Проверь условия теоремы.']
  p5:
    k: num
    lv: 2
    v: {a: 1..3, b: 4..6}
    q: 'Найди $c$ из теоремы Лагранжа для $f(x)=\sqrt{x}$ на $[@{a^2}, @{b^2}]$.'
    a: ((a+b)/2)^2
    tol: 0.002
    e: {c1.mvt.midpoint: (a^2+b^2)/2}
    h: ['Средняя скорость равна $\frac{@b-@a}{@{b^2}-@{a^2}}=\frac{1}{@{a+b}}$.']
    sol:
      - 'Средняя скорость: $\frac{@b-@a}{@{b^2}-@{a^2}}=\frac{1}{@{a+b}}$.'
      - 'Уравнение $\frac{1}{2\sqrt c}=\frac{1}{@{a+b}}$, значит $\sqrt c=\frac{@{a+b}}{2}$.'
      - 'Тогда $c=@{((a+b)/2)^2:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при поиске $c$ для $f(x)=x^3$ на $[0, 2]$.'
    steps:
      - 'Средняя скорость: $\frac{f(2)-f(0)}{2-0}=4$'
      - 'Решаем $f''(c)=3c^2=4$'
      - 'Получаем $c=\frac{2}{\sqrt3}\approx1.15$ — точка внутри $(0, 2)$'
    bad:
      - {i: 2, t: 'Берём середину отрезка: $c=1$', e: c1.mvt.midpoint}
      - {i: 3, t: 'Получаем $c=\frac43\approx1.33$ — точка внутри $(0, 2)$'}
err: [c1.mvt.cond, c1.mvt.midpoint]
sum:
  - 'Умею находить точку $c$ из теоремы Лагранжа, решая $f''(c)=\frac{f(b)-f(a)}{b-a}$.'
  - 'Проверяю три условия теоремы Ролля, включая дифференцируемость.'
  - 'Отличаю точку $c$ от середины отрезка.'
