id: c1.app
int:
  - 'Площадь, объём, среднее значение: всё это интегралы. Как отличить, что именно вычислять? Главное — чему равен маленький кусочек.'
  - {ask: 'Полоска шириной $dx$ между кривыми $y=f$ и $y=g$ имеет высоту $f-g$. Чему равна площадь всей фигуры?', ans: '$\int_a^b(f-g)\,dx$: складываем площади полосок. Верхнюю функцию берём первой, чтобы не получить отрицательное число.'}
  - 'Для тела вращения кусочек — тонкий диск радиуса $f(x)$ с площадью $\pi f(x)^2$. Среднее значение — площадь, поделённая на длину отрезка.'
  - {ask: 'Что поменяется в формуле объёма, если вращать вокруг оси $Ox$ не $y=f$, а $y=2f$?', ans: 'Объём вырастет в $4$ раза: радиус круга удвоился, а площадь круга пропорциональна квадрату радиуса.'}
def:
  - {g: area-between}
  - {g: volume-revolution}
  - {g: mean-value-integral}
  - 'Как решать. Площадь: найди точки пересечения, определи верхнюю кривую и вычисли $\int(f-g)\,dx$. Объём вращения: $V=\pi\int f^2\,dx$. Среднее значение: $\frac1{b-a}\int_a^b f\,dx$. Начни с рисунка.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {k: [2, 4], b: 2..6}
    q: 'Найди площадь под $y=@{k}x$ на отрезке $[0, @b]$.'
    a: k*b^2/2
    h: ['Интеграл $\int_0^{@b}@{k}x\,dx$.']
  p2:
    k: num
    lv: 2
    v: {a: 2..6}
    q: 'Найди площадь между $y=@{a}x$ и $y=x^2$ на $[0, @a]$.'
    a: a^3/6
    tol: 0.002
    e: {c1.app.sign: -a^3/6}
    h: ['На $(0, @a)$ график $y=@{a}x$ выше параболы.']
    sol:
      - 'Верхняя кривая $y=@{a}x$, нижняя $y=x^2$.'
      - '$S=\int_0^{@a}(@{a}x-x^2)\,dx$. Первообразная $\frac{@a}{2}x^2-\frac{x^3}{3}$.'
      - 'Получаем $\frac{@{a^3}}{2}-\frac{@{a^3}}{3}=@{a^3/6:f3}$.'
  p3:
    k: num
    lv: 2
    v: {b: 2..5}
    q: 'Найди объём тела, полученного вращением $y=x$, $0\le x\le @b$, вокруг оси $Ox$.'
    a: pi*b^3/3
    tol: 0.002
    e: {c1.app.pi: b^3/3}
    h: ['$V=\pi\int_0^{@b}x^2\,dx$.']
    sol:
      - 'Сечение — круг радиуса $x$ с площадью $\pi x^2$.'
      - '$V=\pi\int_0^{@b}x^2\,dx=\pi\cdot\frac{@{b^3}}{3}$.'
      - 'Численно $V=@{pi*b^3/3:f3}$.'
  p4:
    k: mc
    q: 'Чему равен объём тела вращения $y=f(x)$, $a\le x\le b$, вокруг оси $Ox$?'
    a: '$\pi\int_a^b f(x)^2\,dx$'
    e: {c1.app.pi: '$\int_a^b f(x)^2\,dx$'}
    x: ['$\pi\int_a^b f(x)\,dx$']
    h: ['Сечение — круг радиуса $f(x)$.']
  p5:
    k: num
    lv: 2
    v: {b: 3..9}
    q: 'Найди среднее значение $f(x)=x^2$ на отрезке $[0, @b]$.'
    a: b^2/3
    tol: 0.002
    e: {c1.app.mean: b^3/3}
    h: ['Раздели $\int_0^{@b}x^2\,dx$ на длину отрезка.']
    sol:
      - '$\int_0^{@b}x^2\,dx=\frac{@{b^3}}{3}$.'
      - 'Длина отрезка равна $@b$.'
      - 'Среднее значение $\frac{1}{@b}\cdot\frac{@{b^3}}{3}=@{b^2/3:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении площади между $y=4$ и $y=x^2$.'
    steps:
      - 'Пределы: $x^2=4$ при $x=\pm2$'
      - 'Верхняя кривая $y=4$, нижняя $y=x^2$'
      - '$S=\int_{-2}^{2}(4-x^2)\,dx$'
      - '$S=\left(4x-\frac{x^3}{3}\right)$ от $-2$ до $2$, то есть $\frac{32}{3}$'
    bad:
      - {i: 3, t: '$S=\int_{-2}^{2}(x^2-4)\,dx$', e: c1.app.sign}
      - {i: 4, t: '$S=\left(4x-\frac{x^3}{3}\right)$ от $-2$ до $2$, то есть $\frac{16}{3}$'}
err: [c1.app.sign, c1.app.pi, c1.app.mean]
sum:
  - 'Умею находить площадь между кривыми: верхняя минус нижняя.'
  - 'Умею находить объём тела вращения по формуле $\pi\int f^2\,dx$.'
  - 'Отличаю среднее значение от интеграла: делю на длину отрезка.'
