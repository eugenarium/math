id: c1.impl
int:
  - 'Функцию $y=x^3+x$ можно «развернуть»: по значению $y$ находить $x$. Наклон развёрнутого графика связан с наклоном исходного, ведь график отражается относительно прямой $y=x$.'
  - {ask: 'Если касательная к $f$ в точке имеет наклон $4$, какой наклон у касательной к обратной функции в соответствующей точке?', ans: '$\frac14$. Отражение меняет местами $x$ и $y$, поэтому наклон заменяется на обратную величину.'}
  - 'Похожая идея работает для кривых, заданных уравнением и параметрически: производная находится без явной формулы $y(x)$.'
def:
  - {g: inverse-derivative}
  - {g: implicit-derivative}
  - {g: parametric-derivative}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..5, b: 1..6}
    q: 'Найди $(f^{-1})''$ для $f(x)=@{a}x+@b$.'
    a: 1/a
    tol: 0.002
    h: ['Наклон прямой равен $@a$, у обратной функции — обратная величина.']
  p2:
    k: num
    lv: 2
    v: {x0: 1..3}
    q: 'Для $f(x)=x^3+x$ найди $(f^{-1})''(y_0)$, где $y_0=f(@x0)$.'
    a: 1/(3*x0^2+1)
    tol: 0.002
    e: {c1.impl.inverse-point: 1/(3*(x0^3+x0)^2+1)}
    h: ['Производную $f''$ нужно брать в точке $x=@x0$, а не в $y_0$.']
    sol:
      - 'Здесь $x_0=@x0$ и $y_0=@{x0^3+x0}$. Производная $f''(x)=3x^2+1$.'
      - '$f''(@x0)=@{3*x0^2+1}$.'
      - '$(f^{-1})''(y_0)=\frac{1}{@{3*x0^2+1}}=@{1/(3*x0^2+1):f4}$.'
  p3:
    k: num
    lv: 2
    v: {x0: 1..3, y0: 1..3}
    q: 'Кривая $x^2+y^3=@{x0^2+y0^3}$ проходит через точку $(@x0, @y0)$. Найди $y''$ в этой точке.'
    a: -2*x0/(3*y0^2)
    tol: 0.002
    e: {c1.impl.implicit-sign: 2*x0/(3*y0^2)}
    h: ['Продифференцируй обе части по $x$: $(y^3)''=3y^2y''$.']
    sol:
      - 'Дифференцируем: $2x+3y^2y''=0$.'
      - 'Выражаем: $y''=-\frac{2x}{3y^2}$.'
      - 'При $(@x0, @y0)$: $y''=-\frac{@{2*x0}}{@{3*y0^2}}=@{-2*x0/(3*y0^2):f3}$.'
  p4:
    k: mc
    q: 'Если $x=x(t)$ и $y=y(t)$, чему равна производная $\frac{dy}{dx}$?'
    a: '$\frac{y''(t)}{x''(t)}$'
    e: {c1.impl.param-inverted: '$\frac{x''(t)}{y''(t)}$'}
    x: ['$y''(t)\cdot x''(t)$']
    h: ['В числителе величина, наклон которой ищут.']
  p5:
    k: num
    lv: 2
    v: {a: [1, 2, 4, 5], t0: 1..3}
    q: 'Кривая задана параметрически: $x=@{a}t^2$, $y=t^3$. Найди $\frac{dy}{dx}$ при $t=@t0$.'
    a: 3*t0/(2*a)
    tol: 0.002
    e: {c1.impl.param-inverted: 2*a/(3*t0)}
    h: ['Найди $y''(t)$ и $x''(t)$ и раздели.']
    sol:
      - '$x''(t)=@{2*a}t$ и $y''(t)=3t^2$.'
      - '$\frac{dy}{dx}=\frac{3t^2}{@{2*a}t}=\frac{3t}{@{2*a}}$.'
      - 'При $t=@t0$: $\frac{@{3*t0}}{@{2*a}}=@{3*t0/(2*a):f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $(f^{-1})''(2)$ для $f(x)=x^3+x$.'
    steps:
      - 'Из $f(1)=2$ получаем $x_0=1$'
      - 'Производная $f''(x)=3x^2+1$ и $f''(1)=4$'
      - '$(f^{-1})''(2)=\frac{1}{f''(1)}=\frac14$'
    bad:
      - {i: 3, t: '$(f^{-1})''(2)=\frac{1}{f''(2)}=\frac{1}{13}$', e: c1.impl.inverse-point}
      - {i: 2, t: 'Производная $f''(x)=3x^2+1$ и $f''(1)=3$'}
err: [c1.impl.inverse-point, c1.impl.implicit-sign, c1.impl.param-inverted]
sum:
  - 'Умею находить производную обратной функции в точке: сначала $x_0$, потом $\frac{1}{f''(x_0)}$.'
  - 'Умею дифференцировать неявное уравнение, помня про $y''$ от $y^n$.'
  - 'Умею находить $\frac{dy}{dx}=\frac{y''(t)}{x''(t)}$ для параметрической кривой.'
