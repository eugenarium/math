id: c1.int
int:
  - 'Скорость точки $v(t)=2t$. Какой путь $s(t)$ она прошла? Нужна функция, производная которой равна $2t$. Это действие, обратное дифференцированию.'
  - {ask: 'Какая функция имеет производную $2t$? Она единственная?', ans: 'Подходит $t^2$, но и $t^2+5$, и $t^2-1$: константа при дифференцировании исчезает. Поэтому первообразных бесконечно много.'}
def:
  - {g: antiderivative}
  - {g: indefinite-integral}
  - 'Проверка ответа всегда одна: продифференцируй результат и сравни с подынтегральной функцией.'
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [2, 4, 6], x0: 1..4}
    q: 'Найди $F(@x0)$, где $F$ — первообразная функции $f(x)=@{a}x$ с условием $F(0)=0$.'
    a: a*x0^2/2
    h: ['Первообразная $x$ — это $\frac{x^2}{2}$; константа здесь равна нулю.']
  p2:
    k: num
    lv: 2
    v: {a: [3, 6, 9], x0: 1..3, c: 1..5}
    q: 'Найди $F(@x0)$, где $F$ — первообразная функции $f(x)=@{a}x^2$ с условием $F(0)=@c$.'
    a: a*x0^3/3+c
    e: {c1.int.const: a*x0^3/3}
    h: ['Не забудь константу: найди её из условия $F(0)=@c$.']
    sol:
      - 'Первообразная: $F(x)=\frac{@a}{3}x^3+C=@{a/3}x^3+C$.'
      - 'Из условия $F(0)=@c$ находим $C=@c$.'
      - 'Тогда $F(@x0)=@{a/3}\cdot@{x0^3}+@c=@{a*x0^3/3+c}$.'
  p3:
    k: expr
    lv: 2
    v: {a: [3, 6, 9], b: 1..5}
    q: 'Найди первообразную $F$ функции $f(x)=@{a}x^2+@b$ с условием $F(0)=0$. Ответ запиши выражением от $x$.'
    a: a*x^3/3+b*x
    h: ['Интегрируй каждое слагаемое по таблице отдельно.']
    sol:
      - 'Слагаемое $@{a}x^2$ даёт $\frac{@a}{3}x^3=@{a/3}x^3$.'
      - 'Слагаемое $@b$ даёт $@{b}x$.'
      - 'Условие $F(0)=0$ обнуляет константу: $F(x)=@{a/3}x^3+@{b}x$.'
  p4:
    k: mc
    q: 'Какая запись верна для неопределённого интеграла $\int 3x^2\,dx$?'
    a: '$x^3+C$'
    e: {c1.int.const: '$x^3$'}
    x: ['$6x+C$', '$\frac{x^3}{3}+C$']
    h: ['Продифференцируй каждый вариант и сравни с $3x^2$.']
  p5:
    k: expr
    lv: 2
    q: 'Найди $\int x\cdot x\,dx$ при условии, что первообразная в нуле равна нулю. Ответ запиши выражением от $x$.'
    a: x^3/3
    e: {c1.int.product: x^4/4}
    h: ['Сначала упрости подынтегральную функцию: $x\cdot x=x^2$.']
    sol:
      - 'Упростим: $x\cdot x=x^2$.'
      - 'Первообразная $x^2$ по таблице — $\frac{x^3}{3}$.'
      - 'Условие в нуле обнуляет константу, остаётся $\frac{x^3}{3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\int x(x+1)\,dx$.'
    steps:
      - '$\int x(x+1)\,dx=\int(x^2+x)\,dx$'
      - '$\int(x^2+x)\,dx=\frac{x^3}{3}+\frac{x^2}{2}+C$'
      - 'Проверка: производная результата равна $x^2+x$'
    bad:
      - {i: 1, t: '$\int x(x+1)\,dx=\int x\,dx\cdot\int(x+1)\,dx$', e: c1.int.product}
      - {i: 2, t: '$\int(x^2+x)\,dx=\frac{x^3}{3}+\frac{x^2}{2}$', e: c1.int.const}
err: [c1.int.const, c1.int.product]
sum:
  - 'Умею находить первообразную многочлена и определять константу по начальному условию.'
  - 'Не теряю $+C$ в неопределённом интеграле.'
  - 'Отличаю интеграл произведения от произведения интегралов: сначала упрощаю подынтегральную функцию.'
