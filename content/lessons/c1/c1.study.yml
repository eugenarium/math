id: c1.study
int:
  - 'Подъём на гору: пока идёшь вверх, производная высоты положительна, на вершине равна нулю, на спуске отрицательна. А как найти место, где тропа меняет кривизну?'
  - {ask: 'Если $f''(x_0)=0$, обязательно ли в $x_0$ вершина или впадина?', ans: 'Нет. У $x^3$ в нуле $f''=0$, но функция возрастает по обе стороны. Нужна смена знака производной.'}
  - 'Вторая производная — это скорость изменения наклона. Если она положительна, наклон растёт и график загибается вверх.'
def:
  - {g: monotonicity-test}
  - {g: convexity-test}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..6, b: 1..9}
    q: 'Найди точку минимума $f(x)=x^2-@{2*a}x+@b$.'
    a: a
    h: ['Производная $2x-@{2*a}$ обращается в нуль в точке минимума.']
  p2:
    k: num
    lv: 2
    v: {k: 1..4}
    q: 'Найди значение в точке локального минимума $f(x)=x^3-@{3*k^2}x$.'
    a: -2*k^3
    h: ['Минимум там, где $f''$ меняет знак с минуса на плюс.']
    sol:
      - '$f''(x)=3x^2-@{3*k^2}=0$ при $x=\pm@k$.'
      - '$f''<0$ при $-@k<x<@k$ и $f''>0$ при $x>@k$: минимум в $x=@k$.'
      - '$f(@k)=@{k^3}-@{3*k^3}=@{-2*k^3}$.'
  p3:
    k: num
    lv: 2
    v: {a: [3, 6, 9], b: 1..5}
    q: 'Найди абсциссу точки перегиба $f(x)=x^3-@{a}x^2+@{b}x$.'
    a: a/3
    h: ['Реши $f''''(x)=0$.']
    sol:
      - '$f''(x)=3x^2-@{2*a}x+@b$.'
      - '$f''''(x)=6x-@{2*a}$.'
      - '$f''''=0$ при $x=@{a/3}$, знак $f''''$ меняется: это точка перегиба.'
  p4:
    k: mc
    q: 'Для $f(x)=x^3$ верно $f''(0)=0$. Есть ли в нуле экстремум?'
    a: 'Нет: производная не меняет знак'
    e: {c1.study.f0-extremum: 'Да: в точке $f''=0$ всегда экстремум'}
    x: ['Нет: производная в нуле не существует']
    h: ['Проверь знак $f''(x)=3x^2$ слева и справа.']
  p5:
    k: mc
    lv: 2
    q: 'Что означает $f''''(x)<0$ на промежутке?'
    a: 'Наклон касательной убывает, график лежит под касательными'
    e: {c1.study.concavity-sign: 'Наклон касательной растёт, график лежит над касательными'}
    x: ['Функция убывает']
    h: ['Вторая производная — скорость изменения наклона.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании $f(x)=x^3$ в точке $0$.'
    steps:
      - '$f''(x)=3x^2$ и $f''(0)=0$'
      - 'При $x<0$ и при $x>0$ производная положительна'
      - 'Знак не меняется, поэтому экстремума в нуле нет'
    bad:
      - {i: 3, t: 'Так как $f''(0)=0$, в нуле экстремум', e: c1.study.f0-extremum}
      - {i: 2, t: 'При $x<0$ производная отрицательна, при $x>0$ положительна'}
err: [c1.study.f0-extremum, c1.study.concavity-sign]
sum:
  - 'Умею находить экстремумы по смене знака $f''$.'
  - 'Умею находить точки перегиба по смене знака $f''''$.'
  - 'Отличаю критическую точку от экстремума.'
