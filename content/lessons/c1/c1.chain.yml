id: c1.chain
int:
  - 'Как продифференцировать $(3x+1)^4$? Раскрывать скобки долго. Функция устроена как матрёшка: снаружи степень, внутри $3x+1$.'
  - {ask: 'Чему равна производная $\sin(2x)$, если колебание в два раза быстрее, чем у $\sin x$?', ans: 'Она равна $2\cos 2x$: скорость изменения тоже вдвое больше. Множитель $2$ — производная внутренней функции $2x$.'}
  - 'Правило: производная внешней функции, взятая в точке-«начинке», умножается на производную «начинки». Не забывай второй множитель.'
def:
  - {g: chain-rule}
ex:
  - {x: p2, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..4, n: 2..4, x0: 0..2}
    q: 'Найди $f''(@x0)$ для $f(x)=(@{a}x+1)^@n$.'
    a: n*a*(a*x0+1)^(n-1)
    e: {c1.chain.inner: n*(a*x0+1)^(n-1)}
    h: ['Внешняя функция — степень, внутренняя — $@{a}x+1$ с производной $@a$.']
  p2:
    k: num
    lv: 2
    v: {a: 1..3, b: 1..4, x0: 1..2}
    q: 'Найди $f''(@x0)$ для $f(x)=(@{a}x^2+@b)^3$.'
    a: 3*(a*x0^2+b)^2*2*a*x0
    e: {c1.chain.inner: 3*(a*x0^2+b)^2}
    h: ['Умножь $3u^2$ на производную внутренней функции $u=@{a}x^2+@b$.']
    sol:
      - 'Внешняя функция $u^3$, внутренняя $u=@{a}x^2+@b$. Тогда $u''=@{2*a}x$.'
      - 'Правило: $f''=3u^2\cdot u''$.'
      - 'При $x=@x0$: $u=@{a*x0^2+b}$, $f''=3\cdot@{(a*x0^2+b)^2}\cdot@{2*a*x0}=@{3*(a*x0^2+b)^2*2*a*x0}$.'
  p3:
    k: expr
    lv: 2
    v: {a: 1..3, b: 1..4, n: 3..5}
    q: 'Найди производную $f(x)=(@{a}x^2+@b)^@n$. Ответ запиши выражением от $x$.'
    a: n*(a*x^2+b)^(n-1)*2*a*x
    e: {c1.chain.inner: 'n*(a*x^2+b)^(n-1)'}
    h: ['Степень опускается вниз, в скобке она уменьшается на единицу, затем множитель $(@{a}x^2+@b)''$.']
    sol:
      - 'Внешняя функция $u^@n$, внутренняя $u=@{a}x^2+@b$.'
      - 'Производная внутренней: $u''=@{2*a}x$.'
      - 'Ответ: $@n(@{a}x^2+@b)^@{n-1}\cdot@{2*a}x$.'
  p4:
    k: mc
    q: 'Чему равна производная $\cos(3x)$?'
    a: '$-3\sin 3x$'
    e: {c1.chain.inner: '$-\sin 3x$'}
    x: ['$3\sin 3x$', '$-3\cos 3x$']
    h: ['Производная косинуса — минус синус, а затем умножь на производную $3x$.']
  p5:
    k: num
    lv: 2
    v: {a: 2..4, b: 1..3, x0: 1..3}
    q: 'Найди $f''(@x0)$ для $f(x)=\ln(@{a}x+@b)$.'
    a: a/(a*x0+b)
    tol: 0.002
    e: {c1.chain.inner: 1/(a*x0+b)}
    h: ['Производная $\ln u$ равна $\frac{1}{u}$; умножь её на $u''$.']
    sol:
      - 'Внешняя функция $\ln u$, внутренняя $u=@{a}x+@b$ с производной $@a$.'
      - 'Правило: $f''=\frac{1}{u}\cdot u''=\frac{@a}{@{a}x+@b}$.'
      - 'При $x=@x0$: $\frac{@a}{@{a*x0+b}}=@{a/(a*x0+b):f4}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении производной $(x^2+1)^3$.'
    steps:
      - '$((x^2+1)^3)''=3(x^2+1)^2\cdot(x^2+1)''$'
      - '$(x^2+1)''=2x$'
      - 'Итог: $((x^2+1)^3)''=6x(x^2+1)^2$'
    bad:
      - {i: 1, t: '$((x^2+1)^3)''=3(x^2+1)^2$', e: c1.chain.inner}
      - {i: 3, t: 'Итог: $((x^2+1)^3)''=6x(x^2+1)^3$'}
err: [c1.chain.inner]
sum:
  - 'Умею дифференцировать сложную функцию: внешняя производная на производную внутренней.'
  - 'Отличаю производную $\sin 2x$ от производной $\sin x$ множителем $2$.'
