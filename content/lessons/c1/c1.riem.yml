id: c1.riem
int:
  - 'Скорость машины растёт: $v(t)=t^2$ м/с. Путь за 2 с — площадь под графиком скорости. Готовой формулы площади для такой фигуры нет. Как её оценить?'
  - w: riemann
    f: x^2
    a: 0
    b: 2
    n: [1, 100, 4]
    rule: [l, r]
    cap: 'Увеличивай $n$ и переключай левые и правые суммы. Следи за ошибкой'
    ask: 'Левая сумма здесь всегда меньше площади, правая — больше. Почему?'
    ans: 'Функция возрастает: левый конец каждого отрезка даёт самый низкий столбик, правый — самый высокий.'
  - w: riemann
    f: 4/(1+x^2)
    a: 0
    b: 1
    n: [1, 50, 2]
    rule: [l, m, t]
    cap: 'Эта площадь равна $\pi$. Сравни три правила: какое подходит к $\pi$ быстрее?'
    ask: 'Сколько отрезков нужно средним точкам, чтобы получить 3.14?'
    ans: 'Хватает 5. Левым суммам нужно около 200: выбор точки внутри отрезка сильно влияет на скорость сходимости.'
def:
  - {g: partition}
  - {g: riemann-sum}
  - {g: definite-integral}
  - 'Сумма — приближение. Интеграл — число, к которому суммы стремятся при измельчении разбиения. Для непрерывной функции этот предел не зависит от выбора точек.'
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: -2..2, m: 1..4, n: [2, 4, 5, 10], b: =a+m}
    q: 'Отрезок $[@a, @b]$ разбит на @n равных частей. Найди длину одной части $\Delta x$.'
    a: m/n
    tol: 0.001
    e: {c1.riem.fencepost: m/(n+1)}
    h: ['Раздели длину отрезка на число частей.']
  p2:
    k: num
    v: {b: [4, 6], c: 1..5}
    q: 'Вычисли левую сумму Римана для $f(x)=x^2+@c$ на $[0, @b]$ при $n=2$.'
    a: (b/2)*(2*c+b^2/4)
    tol: 0
    e:
      c1.riem.no-dx: 2*c+b^2/4
      c1.riem.fencepost: (b/2)*(3*c+b^2/4+b^2)
    h: ['Отрезков два, значит, и слагаемых два: высоты берутся в точках $0$ и $@{b/2}$.']
    sol:
      - '$\Delta x=@b/2=@{b/2}$. Левые концы отрезков: $0$ и $@{b/2}$.'
      - 'Высоты: $f(0)=@c$, $f(@{b/2})=@{b^2/4+c}$.'
      - 'Сумма: $@{b/2}\cdot(@c+@{b^2/4+c})=@{(b/2)*(2*c+b^2/4)}$.'
  p3:
    k: num
    lv: 2
    v: {n: [3, 4, 5], d: [2, 3], k: 1..3, b: =n*d}
    q: 'Вычисли правую сумму Римана для $f(x)=@{k:c}x$ на $[0, @b]$ при $n=@n$.'
    a: k*d^2*n*(n+1)/2
    tol: 0
    e: {c1.riem.no-dx: k*d*n*(n+1)/2}
    h: ['Правые концы: $x_i=i\,\Delta x$ для $i=1,\dots,@n$.']
    sol:
      - '$\Delta x=@b/@n=@d$. Правые концы: $x_i=@{d}i$, где $i=1,\dots,@n$.'
      - 'Высоты: $f(x_i)=@{k*d}i$. Их сумма: $@{k*d}\cdot(1+\dots+@n)=@{k*d*n*(n+1)/2}$.'
      - 'Умножаем на $\Delta x$: $S=@{k*d*n*(n+1)/2}\cdot@d=@{k*d^2*n*(n+1)/2}$.'
      - 'Точная площадь треугольника — $@{k*b^2/2}$. Правая сумма больше: функция возрастает.'
  p4:
    k: mc
    q: 'Функция $f$ непрерывна и строго убывает на $[a, b]$. Что верно при любом $n$?'
    a: 'Левая сумма больше интеграла, правая — меньше'
    e: {c1.riem.left-under: 'Левая сумма меньше интеграла, правая — больше'}
    x: ['Обе суммы больше интеграла', 'Обе суммы равны интегралу']
    h: ['Нарисуй убывающую функцию и один столбик левой суммы: он выше или ниже графика?']
  p5:
    k: graph
    lv: 2
    v: {b: [1, 2]}
    q: 'Добейся ошибки меньше 0.002 для $\int_0^{@b} x^2\,dx$, используя не больше 30 отрезков. Правило выбери сам.'
    w: {w: riemann, f: x^2, a: 0, b: b, n: [1, 60, 4], rule: [l, r, m]}
    goal: {err: [0, 0.002], n: [15.5, 14.5]}
    h: ['Сравни, как быстро убывает ошибка у левых сумм и у средних точек.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в вычислении правой суммы для $f(x)=x^2$ на $[0, 2]$ при $n=4$.'
    steps:
      - '$\Delta x=\frac{2-0}{4}=0.5$'
      - 'Правые концы: $0.5,\ 1,\ 1.5,\ 2$'
      - 'Высоты: $0.25,\ 1,\ 2.25,\ 4$; их сумма равна $7.5$'
      - '$S=7.5\cdot0.5=3.75$'
    bad:
      - {i: 1, t: '$\Delta x=\frac{2-0}{4+1}=0.4$', e: c1.riem.fencepost}
      - {i: 4, t: '$S=7.5$', e: c1.riem.no-dx}
err: [c1.riem.no-dx, c1.riem.fencepost, c1.riem.left-under]
sum:
  - 'Умею разбивать отрезок и вычислять левую, правую сумму и сумму средних точек.'
  - 'Умею объяснять определённый интеграл как предел интегральных сумм.'
  - 'Отличаю сумму высот от интегральной суммы: каждое слагаемое умножается на $\Delta x$.'
  - 'Умею по монотонности функции сказать, какая сумма завышает интеграл.'
