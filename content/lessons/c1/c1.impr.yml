id: c1.impr
int:
  - 'Площадь под $y=\frac{1}{x^2}$ справа от $x=1$ тянется до бесконечности. Может ли она быть конечной?'
  - {ask: 'Чему равен $\int_1^b\frac{dx}{x^2}$? Что происходит при $b\to\infty$?', ans: 'Интеграл равен $1-\frac1b$, при $b\to\infty$ он стремится к $1$. Бесконечная область может иметь конечную площадь.'}
  - 'Так вводят несобственный интеграл: как предел. Для $\frac1x$ такой предел бесконечен, хотя $\frac1x\to0$.'
def:
  - {g: improper-integral}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [2, 3, 5]}
    q: 'Вычисли $\int_1^\infty x^{-@a}\,dx$.'
    a: 1/(a-1)
    tol: 0.002
    h: ['Первообразная $x^{-@a}$ равна $-\frac{x^{@{1-a}}}{@{a-1}}$.']
  p2:
    k: num
    lv: 2
    v: {a: 2..5}
    q: 'Вычисли $\int_0^\infty e^{-@{a}x}\,dx$.'
    a: 1/a
    tol: 0.002
    h: ['Первообразная равна $-\frac{1}{@a}e^{-@{a}x}$.']
    sol:
      - '$\int_0^b e^{-@{a}x}\,dx=\frac{1}{@a}\left(1-e^{-@{a}b}\right)$.'
      - 'При $b\to\infty$ значение $e^{-@{a}b}\to0$.'
      - 'Интеграл равен $\frac{1}{@a}=@{1/a:f3}$.'
  p3:
    k: num
    lv: 2
    v: {p: [0.5, 0.25, 0.2]}
    q: 'Вычисли $\int_0^1 x^{-@p}\,dx$.'
    a: 1/(1-p)
    tol: 0.002
    h: ['Первообразная $x^{-@p}$ равна $\frac{x^{@{1-p}}}{@{1-p}}$; подставь в точке $0$ через предел.']
    sol:
      - '$\int_\varepsilon^1 x^{-@p}\,dx=\frac{1-\varepsilon^{@{1-p}}}{@{1-p}}$.'
      - 'При $\varepsilon\to0$ степень $\varepsilon^{@{1-p}}\to0$.'
      - 'Интеграл равен $\frac{1}{@{1-p}}=@{1/(1-p):f3}$.'
  p4:
    k: mc
    q: 'Сходится ли $\int_1^\infty\frac{dx}{x}$?'
    a: 'Расходится'
    e: {c1.impr.decay: 'Сходится, ведь $\frac1x\to0$'}
    x: ['Сходится к $1$']
    h: ['Вычисли $\int_1^b\frac{dx}{x}=\ln b$.']
  p5:
    k: mc
    lv: 2
    q: 'Формула Ньютона–Лейбница для $\int_{-1}^{1}\frac{dx}{x^2}$ даёт $-2$. Что верно?'
    a: 'Интеграл расходится: в нуле разрыв'
    e: {c1.impr.discontinuity: 'Интеграл равен $-2$'}
    x: ['Интеграл равен $2$']
    h: ['Подынтегральная функция положительна.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\int_1^\infty\frac{dx}{x^2}$.'
    steps:
      - 'По определению $\int_1^\infty\frac{dx}{x^2}=\lim_{b\to\infty}\int_1^b\frac{dx}{x^2}$'
      - '$\int_1^b\frac{dx}{x^2}=1-\frac1b$'
      - 'Предел равен $1$: интеграл сходится'
    bad:
      - {i: 2, t: '$\int_1^b\frac{dx}{x^2}=\frac1b-1$'}
      - {i: 3, t: 'Предел равен $0$: интеграл сходится к нулю'}
err: [c1.impr.decay, c1.impr.discontinuity]
sum:
  - 'Умею считать несобственные интегралы как пределы.'
  - 'Знаю, что $\int_1^\infty x^{-p}$ сходится при $p>1$.'
  - 'Не применяю формулу Ньютона–Лейбница через разрыв.'
