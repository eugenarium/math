id: c1.parts
int:
  - 'Правило производной произведения $(uv)''=u''v+uv''$ можно прочитать в обратную сторону. Тогда оно превращается в способ брать интегралы от произведений, например $\int x e^x\,dx$.'
  - {ask: 'Если $(uv)''=u''v+uv''$, то чему равен $\int uv''\,dx$?', ans: 'Проинтегрируем обе части: $uv=\int u''v\,dx+\int uv''\,dx$. Значит $\int uv''\,dx=uv-\int u''v\,dx$.'}
  - 'Это и есть интегрирование по частям. Идея: один интеграл заменяется другим, который проще.'
def:
  - {g: integration-by-parts}
  - 'Удобный порядок выбора $u$: логарифм, затем многочлен, затем $e^x$ и тригонометрические функции.'
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [2, 4, 5]}
    q: 'Для $\int x e^{@{a}x}\,dx$ взяли $u=x$, $dv=e^{@{a}x}\,dx$. Найди $v(0)$ при $C=0$ в $v=\int e^{@{a}x}\,dx$.'
    a: 1/a
    h: ['Первообразная $e^{@{a}x}$ равна $\frac{e^{@{a}x}}{@a}$.']
  p2:
    k: num
    lv: 2
    v: {x0: 1..3}
    q: 'Найди $F(@x0)$, где $F$ — первообразная $f(x)=x e^{x}$ с условием $F(0)=0$.'
    a: (x0-1)*exp(x0)+1
    tol: 0.002
    h: ['Возьми $u=x$, $dv=e^x\,dx$. Тогда $du=dx$, $v=e^x$.']
    sol:
      - 'Положим $u=x$ и $dv=e^x\,dx$. Тогда $du=dx$ и $v=e^x$.'
      - '$\int xe^x\,dx=xe^x-\int e^x\,dx=xe^x-e^x+C$.'
      - 'Из $F(0)=0$: $C=1$. Тогда $F(@x0)=@{x0-1}\cdot e^@x0+1=@{(x0-1)*exp(x0)+1:f3}$.'
  p3:
    k: expr
    lv: 2
    v: {a: [2, 3]}
    q: 'Найди первообразную $f(x)=x e^{@{a}x}$ с условием $F(0)=0$. Ответ запиши выражением от $x$.'
    a: (a*x-1)*exp(a*x)/a^2+1/a^2
    h: ['Возьми $u=x$, $dv=e^{@{a}x}\,dx$, тогда $v=\frac{e^{@{a}x}}{@a}$.']
    sol:
      - 'Положим $u=x$ и $dv=e^{@{a}x}\,dx$. Тогда $du=dx$ и $v=\frac{e^{@{a}x}}{@a}$.'
      - '$\int xe^{@{a}x}\,dx=\frac{xe^{@{a}x}}{@a}-\frac{e^{@{a}x}}{@{a^2}}+C$.'
      - 'Из $F(0)=0$ получаем $C=\frac{1}{@{a^2}}$.'
  p4:
    k: mc
    q: 'Как удобнее взять части в $\int x e^x\,dx$?'
    a: '$u=x$, $dv=e^x\,dx$'
    e: {c1.parts.choice: '$u=e^x$, $dv=x\,dx$'}
    x: ['$u=xe^x$, $dv=dx$']
    h: ['Хорошо, когда $du$ проще $u$.']
  p5:
    k: num
    lv: 2
    v: {x0: [2, 3, 4, 5]}
    q: 'Найди $F(@x0)$, где $F$ — первообразная $\ln x$ с условием $F(1)=0$.'
    a: x0*log(x0)-x0+1
    tol: 0.002
    h: ['Запиши $\ln x=\ln x\cdot1$ и возьми $u=\ln x$, $dv=dx$.']
    sol:
      - 'Положим $u=\ln x$ и $dv=dx$. Тогда $du=\frac{dx}{x}$ и $v=x$.'
      - '$\int\ln x\,dx=x\ln x-\int dx=x\ln x-x+C$.'
      - 'Из $F(1)=0$: $C=1$. Тогда $F(@x0)=@{x0*log(x0)-x0+1:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\int xe^x\,dx$.'
    steps:
      - 'Берём $u=x$ и $dv=e^x\,dx$; тогда $du=dx$ и $v=e^x$'
      - '$\int xe^x\,dx=xe^x-\int e^x\,dx$'
      - 'Итог: $xe^x-e^x+C$'
    bad:
      - {i: 1, t: 'Берём $u=e^x$ и $dv=x\,dx$; тогда $du=e^x\,dx$ и $v=\frac{x^2}{2}$', e: c1.parts.choice}
      - {i: 3, t: 'Итог: $xe^x+e^x+C$'}
err: [c1.parts.choice]
sum:
  - 'Умею применять формулу $\int u\,dv=uv-\int v\,du$.'
  - 'Умею выбирать $u$ так, чтобы $du$ был проще $u$.'
