id: c1.small
int:
  - 'Рядом с нулём $\sin x$ почти не отличается от $x$. Тогда $\lim_{x\to0}\frac{\sin 5x}{3x}$ можно сосчитать одним взглядом: $\frac{5x}{3x}$. Но это правило работает не везде.'
  - {ask: 'Заменим $e^x-1$ на $x$ в пределе $\frac{e^x-1-x}{x^2}$. Что получим в числителе? Верно ли, что предел равен $0$?', ans: 'Числитель станет $x-x=0$, но предел на самом деле равен $\frac12$. В разностях главные части сокращаются, и важен остаток.'}
  - 'Правило: эквивалентные можно подставлять в произведения и частные. В суммах и разностях пользуются разложением с $o(\cdot)$.'
def:
  - {g: equivalent-functions}
  - {g: little-o}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..9}
    q: 'Найди $\lim_{x\to0}\frac{\ln(1+@{a}x)}{x}$.'
    a: a
    h: ['При $u\to0$ верно $\ln(1+u)\sim u$.']
  p2:
    k: num
    lv: 2
    v: {a: 2..4, b: 2..4}
    q: 'Найди $\lim_{x\to0}\frac{(e^{@{a}x}-1)\sin @{b}x}{x^2}$.'
    a: a*b
    h: ['Заменяй множители: $e^u-1\sim u$ и $\sin u\sim u$.']
    sol:
      - 'Это произведение, замены допустимы: $e^{@{a}x}-1\sim @{a}x$.'
      - 'Также $\sin @{b}x\sim @{b}x$.'
      - 'Получаем $\frac{@{a}x\cdot@{b}x}{x^2}=@{a*b}$.'
  p3:
    k: num
    lv: 2
    v: {a: 2..4, b: 1..3}
    q: 'Найди $\lim_{x\to0}\frac{1-\cos @{a}x}{@{b}x^2}$.'
    a: a^2/(2*b)
    tol: 0.002
    h: ['При $u\to0$ верно $1-\cos u\sim\frac{u^2}{2}$.']
    sol:
      - 'Это частное, замена допустима: $1-\cos @{a}x\sim\frac{(@{a}x)^2}{2}=@{a^2/2}x^2$.'
      - 'Получаем $\frac{@{a^2/2}x^2}{@{b}x^2}=\frac{@{a^2/2}}{@b}$.'
      - 'Предел равен $@{a^2/(2*b):f3}$.'
  p4:
    k: num
    lv: 2
    v: {a: 2..4}
    q: 'Найди $\lim_{x\to0}\frac{e^{@{a}x}-1-@{a}x}{x^2}$. Используй $e^u=1+u+\frac{u^2}{2}+o(u^2)$.'
    a: a^2/2
    e: {c1.small.sum: 0}
    h: ['Здесь разность: заменять $e^{@{a}x}-1$ на $@{a}x$ нельзя.']
    sol:
      - 'Подставим разложение: $e^{@{a}x}=1+@{a}x+\frac{@{a^2}x^2}{2}+o(x^2)$.'
      - 'Числитель: $\frac{@{a^2}x^2}{2}+o(x^2)$.'
      - 'Делим на $x^2$: предел равен $\frac{@{a^2}}{2}=@{a^2/2:f1}$.'
  p5:
    k: mc
    q: 'Какая замена допустима при $x\to0$?'
    a: 'В произведении $x\sin x$ заменить $\sin x$ на $x$'
    e: {c1.small.sum: 'В разности $\sin x-x$ заменить $\sin x$ на $x$'}
    x: ['В разности $e^x-\cos x$ заменить обе функции на $1$']
    h: ['Заменять можно множители, а не слагаемые.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\lim_{x\to0}\frac{e^x-1-x}{x^2}$.'
    steps:
      - 'Разложим: $e^x=1+x+\frac{x^2}{2}+o(x^2)$'
      - '$\frac{e^x-1-x}{x^2}=\frac{\frac{x^2}{2}+o(x^2)}{x^2}$'
      - 'Итог: $\lim=\frac12$'
    bad:
      - {i: 1, t: 'Заменим $e^x\sim1+x$: числитель $1+x-1-x=0$', e: c1.small.sum}
      - {i: 3, t: 'Итог: $\lim=\frac14$'}
err: [c1.small.sum]
sum:
  - 'Умею заменять эквивалентные функции в произведениях и частных.'
  - 'Умею применять разложение с $o(\cdot)$ в суммах и разностях.'
  - 'Отличаю множители, которые можно заменять, от слагаемых, которые нельзя.'
