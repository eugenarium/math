id: c1.taylor
int:
  - 'Калькулятор считает $e^{0.1}$ не по определению, а подставляя число в многочлен. Какой многочлен лучше всего повторяет $e^x$ рядом с нулём?'
  - {ask: 'Найди многочлен $1+bx+cx^2$ с теми же значением, первой и второй производной в нуле, что у $e^x$. Чему равны $b$ и $c$?', ans: '$b=1$ и $c=\frac12$: у $e^x$ все производные в нуле равны $1$, а у $cx^2$ вторая производная равна $2c$.'}
  - 'Так возникает коэффициент $\frac{f^{(k)}(0)}{k!}$. Факториал нужен, чтобы $k$-я производная $x^k$, равная $k!$, не искажала результат.'
def:
  - {g: taylor-polynomial}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..5}
    q: 'Найди коэффициент при $x^2$ в разложении $e^{@{a}x}$ в нуле.'
    a: a^2/2
    e: {c1.taylor.factorial: a^2}
    h: ['Вторая производная $e^{@{a}x}$ в нуле равна $@{a^2}$; раздели на $2!$.']
  p2:
    k: num
    lv: 2
    v: {a: 2..4}
    q: 'Найди коэффициент при $x^3$ в разложении $\sin @{a}x$ в нуле.'
    a: -a^3/6
    tol: 0.002
    e: {c1.taylor.factorial: -a^3}
    h: ['Третья производная $\sin @{a}x$ в нуле равна $-@{a^3}$; раздели на $3!$.']
    sol:
      - '$f(x)=\sin @{a}x$, $f''''''(x)=-@{a^3}\cos @{a}x$.'
      - '$f''''''(0)=-@{a^3}$.'
      - 'Коэффициент $\frac{-@{a^3}}{3!}=@{-a^3/6:f3}$.'
  p3:
    k: num
    lv: 2
    v: {x0: [0.1, 0.2, 0.5]}
    q: 'Найди значение многочлена Тейлора степени $2$ функции $e^x$ в нуле при $x=@x0$.'
    a: 1+x0+x0^2/2
    tol: 0.0005
    h: ['Многочлен: $1+x+\frac{x^2}{2}$.']
    sol:
      - 'Коэффициенты: $1$, $1$ и $\frac{1}{2!}=\frac12$.'
      - 'Многочлен $1+x+\frac{x^2}{2}$.'
      - 'При $x=@x0$: $1+@x0+@{x0^2/2:f3}=@{1+x0+x0^2/2:f4}$.'
  p4:
    k: mc
    q: 'Какой многочлен степени $2$ — разложение $\cos x$ в нуле?'
    a: '$1-\frac{x^2}{2}$'
    e: {c1.taylor.factorial: '$1-x^2$'}
    x: ['$1+\frac{x^2}{2}$']
    h: ['Вторая производная $\cos x$ в нуле равна $-1$.']
  p5:
    k: mc
    lv: 2
    q: 'Многочлен $1+x+\frac{x^2}{2}+\frac{x^3}{6}$ используют вместо $e^x$ при $x=10$. Что верно?'
    a: 'Погрешность велика: многочлен точен лишь рядом с нулём'
    e: {c1.taylor.local: 'Погрешность мала: многочлен совпадает с $e^x$ везде'}
    x: ['Погрешность равна нулю']
    h: ['Сравни $e^{10}\approx22026$ с суммой при $x=10$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при разложении $e^{2x}$ до $x^2$ в нуле.'
    steps:
      - '$f(x)=e^{2x}$: $f(0)=1$, $f''(0)=2$, $f''''(0)=4$'
      - 'Коэффициент при $x^2$ равен $\frac{f''''(0)}{2!}=\frac42=2$'
      - 'Многочлен: $1+2x+2x^2$'
    bad:
      - {i: 2, t: 'Коэффициент при $x^2$ равен $f''''(0)=4$', e: c1.taylor.factorial}
      - {i: 3, t: 'Многочлен: $1+x+2x^2$'}
err: [c1.taylor.factorial, c1.taylor.local]
sum:
  - 'Умею находить коэффициенты Тейлора в нуле: $\frac{f^{(k)}(0)}{k!}$.'
  - 'Знаю стандартные разложения $e^x$, $\sin x$, $\cos x$.'
  - 'Помню, что многочлен Тейлора хорош только рядом с точкой разложения.'
