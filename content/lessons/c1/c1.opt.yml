id: c1.opt
int:
  - 'Из проволоки длиной $20$ м нужно огородить прямоугольник наибольшей площади. Сторона $x$ может быть любой от $0$ до $10$. Как найти лучший вариант без перебора?'
  - {ask: 'Если функция всё время возрастает на отрезке, где она принимает наибольшее значение?', ans: 'На правом конце. Производная положительна, нулей нет, но наибольшее значение у функции всё равно есть. Поэтому концы отрезка проверяют всегда.'}
  - 'План: найди точки, где $f''=0$, оставь те, что внутри отрезка, и сравни значения в них со значениями на концах.'
def:
  - {g: critical-point}
  - {g: extremum-on-interval}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..3, b: 2..9}
    q: 'Найди наибольшее значение $f(x)=@b-(x-@a)^2$ на отрезке $[0, 4]$.'
    a: b
    h: ['Вершина параболы в точке $x=@a$ лежит внутри отрезка.']
  p2:
    k: num
    lv: 2
    v: {a: 1..2, L: 5..7}
    q: 'Найди наибольшее значение $f(x)=x^2-@{2*a}x$ на отрезке $[0, @L]$.'
    a: L^2-2*a*L
    e: {c1.opt.endpoints: -a^2}
    h: ['Кроме точки $f''=0$, проверь значения на концах отрезка.']
    sol:
      - '$f''(x)=2x-@{2*a}=0$ при $x=@a$, это внутри отрезка.'
      - 'Значения: $f(0)=0$, $f(@a)=@{-a^2}$, $f(@L)=@{L^2-2*a*L}$.'
      - 'Наибольшее из них равно $@{L^2-2*a*L}$.'
  p3:
    k: expr
    lv: 2
    v: {P: [20, 30, 40]}
    q: 'Прямоугольник имеет периметр $@P$, одна его сторона равна $x$. Запиши площадь $S$ как выражение от $x$.'
    a: x*(P/2-x)
    h: ['Вторая сторона равна $\frac{@P}{2}-x$.']
    sol:
      - 'Сумма двух смежных сторон равна половине периметра: $@{P/2}$.'
      - 'Значит, вторая сторона равна $@{P/2}-x$.'
      - 'Площадь: $S=x(@{P/2}-x)$.'
  p4:
    k: mc
    q: 'Непрерывная функция имеет $f''(x)>0$ на всём отрезке $[a, b]$. Где достигается наибольшее значение?'
    a: 'В правом конце отрезка'
    e: {c1.opt.endpoints: 'Нигде: критических точек нет'}
    x: ['В левом конце отрезка', 'В середине отрезка']
    h: ['Функция возрастает.']
  p5:
    k: num
    lv: 2
    v: {k: 1..2, L: 5..6}
    q: 'Найди наибольшее значение $f(x)=x^3-@{3*k^2}x$ на отрезке $[0, @L]$.'
    a: L^3-3*k^2*L
    e: {c1.opt.endpoints: -2*k^3}
    h: ['Критическая точка не всегда даёт наибольшее значение.']
    sol:
      - '$f''(x)=3x^2-@{3*k^2}=0$ при $x=@k$ (корень $-@k$ вне отрезка).'
      - 'Значения: $f(0)=0$, $f(@k)=@{-2*k^3}$, $f(@L)=@{L^3-3*k^2*L}$.'
      - 'Наибольшее из них равно $@{L^3-3*k^2*L}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при поиске наибольшего значения $f(x)=x^2-4x$ на $[0, 5]$.'
    steps:
      - '$f''(x)=2x-4$ и $f''(x)=0$ при $x=2$'
      - 'Сравним значения: $f(0)=0$, $f(2)=-4$, $f(5)=5$'
      - 'Наибольшее значение на $[0, 5]$ равно $5$'
    bad:
      - {i: 2, t: 'Считаем только $f(2)=-4$', e: c1.opt.endpoints}
      - {i: 3, t: 'Наибольшее значение на $[0, 5]$ равно $0$'}
err: [c1.opt.endpoints]
sum:
  - 'Умею находить критические точки многочлена и проверять, что они лежат внутри отрезка.'
  - 'Отличаю наибольшее значение на отрезке от значения в критической точке: концы нужно проверять всегда.'
