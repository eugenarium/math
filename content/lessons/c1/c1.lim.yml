id: c1.lim
int:
  - 'Функция $f(x)=\frac{x^2-1}{x-1}$ не определена при $x=1$. А что происходит со значениями, если подставлять числа всё ближе к 1? Подвигай точку и посмотри.'
  - w: fplot
    f: '(x^2-1)/(x-1)'
    x: [-2, 4.1]
    y: [-1, 6]
    sl: {h: [0.02, 1.5, 1, 0.02]}
    pts: [['1+h', '2+h']]
    lab: 1
    cap: 'Приближай $x=1+h$ к единице и следи за значением $f(x)$'
    ask: 'К какому числу стремится $f(x)$ при $x\to1$?'
    ans: 'К 2, хотя в самой точке $x=1$ функция не определена. Предел описывает поведение рядом с точкой, а не в ней.'
  - w: fplot
    f: 'abs(x-1)/(x-1)'
    x: [-2, 4.1]
    y: [-2, 2]
    sl: {h: [0.02, 1.5, 1, 0.02]}
    pts: [['1-h', '-1'], ['1+h', '1']]
    cap: 'Подходи к 1 слева и справа: сравни значения в двух отмеченных точках'
    ask: 'Есть ли предел у $f(x)=\frac{|x-1|}{x-1}$ при $x\to1$?'
    ans: 'Нет: слева значения равны $-1$, справа $1$. Предел существует, только если односторонние пределы совпадают.'
def:
  - {g: limit-of-function}
  - {g: one-sided-limit}
  - 'Предел не зависит от значения функции в самой точке: там она может быть не определена или иметь другое значение.'
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: -3..3, k: 2..5, b: -4..4 !0}
    q: 'Найди $\lim_{x\to@a}(@{k}x@{b:s})$.'
    a: k*a+b
    h: ['Линейная функция не имеет разрывов: подставь $x=@a$.']
  p2:
    k: num
    v: {a: 1..5}
    q: 'Найди $\lim_{x\to@a}\frac{x^2-@{a^2}}{x-@a}$.'
    a: 2*a
    e: {c1.lim.value: 0}
    h: ['Подстановка даёт $\frac{0}{0}$. Разложи числитель на множители.']
    sol:
      - 'Подстановка $x=@a$ даёт $\frac{0}{0}$: сразу ответ не найти.'
      - 'Разложим числитель: $x^2-@{a^2}=(x-@a)(x+@a)$ и сократим на $x-@a$.'
      - 'Остаётся $x+@a$. При $x\to@a$ это $@{2*a}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..4, b: 1..4}
    q: 'Найди $\lim_{x\to@a}\frac{x^2+@{b}x-@{a^2+a*b}}{x-@a}$.'
    a: 2*a+b
    e: {c1.lim.value: 0}
    h: ['Числитель обращается в нуль при $x=@a$, значит, делится на $x-@a$.']
    sol:
      - 'Числитель равен нулю при $x=@a$, поэтому делится на $x-@a$.'
      - 'Раскладываем: $x^2+@{b}x-@{a^2+a*b}=(x-@a)(x+@{a+b})$.'
      - 'После сокращения остаётся $x+@{a+b}$. При $x\to@a$ получаем $@{2*a+b}$.'
  p4:
    k: mc
    q: 'Известно, что $f(2)=5$, а $\lim_{x\to2}f(x)=3$. Что из этого верно?'
    a: 'Значение в точке и предел — разные числа, они не обязаны совпадать'
    e: {c1.lim.value: 'Предел равен 5: он совпадает со значением в точке'}
    x: ['Такой функции не существует', 'Функция не определена в точке $2$']
    h: ['Предел определяется значениями рядом с точкой, но не в ней.']
  p5:
    k: graph
    lv: 2
    v: {a: [1, 2, 3]}
    q: 'Подвинь точку $x=@a+h$ так, чтобы значение $f(x)$ отличалось от предела не больше чем на $0.1$.'
    w: {w: fplot, f: '(x^2-a^2)/(x-a)', x: [-2, 6.1], y: [-1, 10], sl: {h: [0.01, 2, 1, 0.01]}, pts: [['a+h', '2*a+h']]}
    goal: {h: [0.055, 0.045]}
    h: ['Предел равен $@{2*a}$, а значение в точке $@a+h$ равно $@{2*a}+h$: ошибка равна $h$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\lim_{x\to0}\frac{|x|}{x}$.'
    steps:
      - 'При $x\to0^+$ имеем $|x|=x$, значит, дробь равна $1$'
      - 'При $x\to0^-$ имеем $|x|=-x$, значит, дробь равна $-1$'
      - 'Односторонние пределы $1$ и $-1$ различны'
      - 'Следовательно, предел при $x\to0$ не существует'
    bad:
      - {i: 4, t: 'Следовательно, предел существует и равен $0$ (среднему $1$ и $-1$)', e: c1.lim.onesided}
      - {i: 2, t: 'При $x\to0^-$ имеем $|x|=x$, значит, дробь равна $1$'}
err: [c1.lim.value, c1.lim.onesided]
sum:
  - 'Умею находить предел отношения с неопределённостью $\frac{0}{0}$, раскладывая числитель на множители.'
  - 'Отличаю предел от значения функции в точке.'
  - 'Умею проверять существование предела по односторонним пределам.'
