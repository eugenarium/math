id: c1.ftc
int:
  - 'Скорость $v(t)=2t$, путь за время от $0$ до $5$ равен площади под графиком: треугольник даёт $25$. Первообразная $s(t)=t^2$ и $s(5)-s(0)=25$. Совпало!'
  - {ask: 'Почему разность значений первообразной даёт площадь?', ans: 'Первообразная $F$ — накопленная площадь: её производная равна высоте графика. Значит, приращение $F$ на отрезке — это площадь под графиком.'}
  - 'Так определённый интеграл вычисляют без сумм Римана. Но интеграл считает площадь со знаком: под осью — со знаком минус.'
def:
  - {g: newton-leibniz}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..9}
    q: 'Вычисли $\int_0^{@a}2x\,dx$.'
    a: a^2
    e: {c1.ftc.order: -a^2}
    h: ['Первообразная $2x$ равна $x^2$.']
  p2:
    k: num
    lv: 2
    v: {k: [3, 6], a: 1..2, b: 3..4}
    q: 'Вычисли $\int_{@a}^{@b}@{k}x^2\,dx$.'
    a: k*(b^3-a^3)/3
    e: {c1.ftc.order: -k*(b^3-a^3)/3}
    h: ['Подставь верхний предел, затем вычти значение при нижнем.']
    sol:
      - 'Первообразная: $F(x)=\frac{@k}{3}x^3=@{k/3}x^3$.'
      - '$F(@b)=@{k/3*b^3}$ и $F(@a)=@{k/3*a^3}$.'
      - 'Интеграл равен $F(@b)-F(@a)=@{k*(b^3-a^3)/3}$.'
  p3:
    k: num
    lv: 2
    v: {a: 2..6}
    q: 'Вычисли $\int_0^{@{2*a}}(x-@a)\,dx$.'
    a: 0
    tol: 0
    e: {c1.ftc.area-signed: a^2}
    h: ['Подынтегральная функция отрицательна на $[0, @a]$ и положительна на $[@a, @{2*a}]$.']
    sol:
      - 'Первообразная: $F(x)=\frac{x^2}{2}-@{a}x$.'
      - '$F(@{2*a})=@{2*a^2}-@{2*a^2}=0$ и $F(0)=0$.'
      - 'Интеграл равен $0$: площади над и под осью по $@{a^2/2}$ взаимно уничтожаются.'
  p4:
    k: mc
    q: 'Функция $f<0$ на $[a, b]$. Что верно для $\int_a^b f\,dx$?'
    a: 'Он отрицателен, а площадь равна его модулю'
    e: {c1.ftc.area-signed: 'Он равен площади фигуры'}
    x: ['Он равен нулю']
    h: ['Интеграл — площадь со знаком.']
  p5:
    k: num
    lv: 2
    v: {a: 1..5, x0: 1..4}
    q: 'Пусть $F(x)=\int_0^x(t^2+@a)\,dt$. Найди $F''(@x0)$.'
    a: x0^2+a
    h: ['Производная интеграла по верхнему пределу равна подынтегральной функции.']
    sol:
      - 'Производная интеграла по верхнему пределу: $F''(x)=x^2+@a$.'
      - 'При $x=@x0$: $@{x0^2}+@a$.'
      - 'Ответ: $@{x0^2+a}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\int_1^3x^2\,dx$.'
    steps:
      - 'Первообразная $F(x)=\frac{x^3}{3}$'
      - '$\int_1^3x^2\,dx=F(3)-F(1)$'
      - '$F(3)-F(1)=9-\frac13=\frac{26}{3}$'
    bad:
      - {i: 2, t: '$\int_1^3x^2\,dx=F(1)-F(3)$', e: c1.ftc.order}
      - {i: 3, t: '$F(3)-F(1)=9+\frac13=\frac{28}{3}$'}
err: [c1.ftc.area-signed, c1.ftc.order]
sum:
  - 'Умею вычислять определённый интеграл как $F(b)-F(a)$.'
  - 'Отличаю интеграл от площади: под осью он отрицателен.'
  - 'Знаю, что производная интеграла по верхнему пределу равна подынтегральной функции.'
