id: c1.sub
int:
  - 'Как найти $\int\cos(3x)\,dx$? Табличный интеграл — $\int\cos u\,du=\sin u+C$, но здесь внутри не $x$, а $3x$.'
  - {ask: 'Чему равна производная $\sin(3x)$? Можно ли ответить $\sin(3x)$ на вопрос об интеграле от $\cos(3x)$?', ans: 'Производная $\sin 3x$ равна $3\cos 3x$, лишний множитель $3$. Поэтому первообразная $\cos 3x$ — это $\frac13\sin 3x$.'}
  - 'Замена $u=3x$ делает это автоматически: $du=3\,dx$, значит $dx=\frac{du}{3}$.'
def:
  - {g: substitution}
  - 'Результат всегда проверяй дифференцированием: получится исходная подынтегральная функция.'
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [2, 4], n: [1, 3]}
    q: 'Первообразная $(@{a}x+1)^@n$ имеет вид $k\,(@{a}x+1)^@{n+1}+C$. Найди $k$.'
    a: 1/(a*(n+1))
    e: {c1.sub.dx: 1/(n+1)}
    h: ['Замена $u=@{a}x+1$: $dx=\frac{du}{@a}$, затем $\int u^@n\,du=\frac{u^@{n+1}}{@{n+1}}$.']
  p2:
    k: num
    lv: 2
    v: {n: [1, 3], b: 1..3, x0: 1..2}
    q: 'Найди $F(@x0)$, где $F$ — первообразная $f(x)=x\,(x^2+@b)^@n$ с условием $F(0)=0$.'
    a: ((x0^2+b)^(n+1)-b^(n+1))/(2*(n+1))
    e: {c1.sub.dx: ((x0^2+b)^(n+1)-b^(n+1))/(n+1)}
    h: ['Замена $u=x^2+@b$: тогда $du=2x\,dx$, то есть $x\,dx=\frac{du}{2}$.']
    sol:
      - 'Пусть $u=x^2+@b$. Тогда $du=2x\,dx$ и $x\,dx=\frac{du}{2}$.'
      - '$\int u^@n\frac{du}{2}=\frac{u^@{n+1}}{@{2*(n+1)}}+C$, то есть $F(x)=\frac{(x^2+@b)^@{n+1}}{@{2*(n+1)}}+C$.'
      - 'Из $F(0)=0$: $C=-\frac{@{b^(n+1)}}{@{2*(n+1)}}$. Тогда $F(@x0)=@{((x0^2+b)^(n+1)-b^(n+1))/(2*(n+1))}$.'
  p3:
    k: expr
    lv: 2
    v: {a: [3, 6], b: 1..3}
    q: 'Найди первообразную $f(x)=@{a}x\,(x^2+@b)^2$ с условием $F(0)=0$. Ответ запиши выражением от $x$.'
    a: a/6*((x^2+b)^3-b^3)
    e: {c1.sub.dx: 'a/3*((x^2+b)^3-b^3)'}
    h: ['Замена $u=x^2+@b$, $du=2x\,dx$. Множитель $2$ нужно учесть.']
    sol:
      - 'Пусть $u=x^2+@b$, тогда $x\,dx=\frac{du}{2}$.'
      - '$\int @{a}u^2\frac{du}{2}=@{a/6}u^3+C$.'
      - 'Из $F(0)=0$ находим $C=-@{a*b^3/6}$. Ответ: $@{a/6}\left((x^2+@b)^3-@{b^3}\right)$.'
  p4:
    k: mc
    q: 'После замены $u=5x$ интеграл $\int e^{5x}\,dx$ принимает вид:'
    a: '$\frac15\int e^{u}\,du$'
    e: {c1.sub.dx: '$\int e^{u}\,du$'}
    x: ['$5\int e^{u}\,du$', '$\frac15\int e^{5u}\,du$']
    h: ['Из $du=5\,dx$ выразись $dx$.']
  p5:
    k: num
    lv: 2
    v: {a: 2..4, x0: 1..2}
    q: 'Найди $F(@x0)$, где $F$ — первообразная $f(x)=e^{@{a}x}$ с условием $F(0)=0$.'
    a: (exp(a*x0)-1)/a
    tol: 0.002
    e: {c1.sub.dx: exp(a*x0)-1}
    h: ['Первообразная $e^{@{a}x}$ равна $\frac{1}{@a}e^{@{a}x}+C$.']
    sol:
      - 'Замена $u=@{a}x$: $dx=\frac{du}{@a}$, значит $F(x)=\frac{1}{@a}e^{@{a}x}+C$.'
      - 'Из $F(0)=0$: $C=-\frac{1}{@a}$.'
      - 'Тогда $F(@x0)=\frac{e^{@{a*x0}}-1}{@a}=@{(exp(a*x0)-1)/a:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\int\cos(3x)\,dx$.'
    steps:
      - 'Положим $u=3x$; тогда $du=3\,dx$ и $dx=\frac{du}{3}$'
      - '$\int\cos(3x)\,dx=\frac13\int\cos u\,du=\frac13\sin u+C$'
      - 'Вернёмся к $x$: $\frac13\sin 3x+C$'
    bad:
      - {i: 2, t: '$\int\cos(3x)\,dx=\int\cos u\,du=\sin u+C$', e: c1.sub.dx}
      - {i: 3, t: 'Вернёмся к $x$: $\frac13\sin x+C$'}
err: [c1.sub.dx]
sum:
  - 'Умею делать замену $u=g(x)$ и выражать $dx$ через $du$.'
  - 'Отличаю $\int\cos 3x\,dx$ от $\int\cos x\,dx$ множителем $\frac13$.'
  - 'Проверяю первообразную дифференцированием.'
