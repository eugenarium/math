id: c1.seq
int:
  - 'Числа $1, \frac12, \frac13, \frac14, \dots$ с ростом номера всё ближе к нулю. А что значит «близко» точно? Нужен критерий, который не зависит от картинки.'
  - {ask: 'Начиная с какого номера члены $\frac1n$ меньше $0{,}01$?', ans: 'При $n>100$. Для любого другого малого числа $\varepsilon$ такой номер тоже найдётся: это и есть предел, равный $0$.'}
  - 'Постоянная последовательность $3, 3, 3, \dots$ тоже сходится к $3$: разность равна нулю, а это меньше любого $\varepsilon$.'
def:
  - {g: sequence-limit}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..9, b: 1..9}
    q: 'Найди $\lim_{n\to\infty}\left(\frac{@a}{n}+@b\right)$.'
    a: b
    h: ['Дробь $\frac{@a}{n}$ стремится к нулю.']
  p2:
    k: num
    lv: 2
    v: {k: 2..6, m: [5, 10, 20]}
    q: 'Для $a_n=\frac{@k}{n}$ с пределом $0$ и $\varepsilon=\frac{1}{@m}$ найди наименьшее $N$, при котором $|a_n|<\varepsilon$ для всех $n>N$.'
    a: k*m
    h: ['Реши неравенство $\frac{@k}{n}<\frac{1}{@m}$ относительно $n$.']
    sol:
      - 'Условие: $\frac{@k}{n}<\frac{1}{@m}$.'
      - 'Так как $n>0$, получаем $n>@k\cdot@m=@{k*m}$.'
      - 'Значит, $N=@{k*m}$: при $n=@{k*m}$ неравенство ещё не выполнено.'
  p3:
    k: num
    lv: 2
    v: {a: [2, 4, 6, 8]}
    q: 'Найди $\lim_{n\to\infty}\left(\sqrt{n^2+@{a}n}-n\right)$.'
    a: a/2
    h: ['Домножь и раздели на сопряжённое выражение $\sqrt{n^2+@{a}n}+n$.']
    sol:
      - 'Домножим на сопряжённое: числитель равен $@{a}n$, знаменатель $\sqrt{n^2+@{a}n}+n$.'
      - 'Разделим числитель и знаменатель на $n$: $\frac{@a}{\sqrt{1+@a/n}+1}$.'
      - 'При $n\to\infty$ корень стремится к $1$. Предел равен $\frac{@a}{2}=@{a/2}$.'
  p4:
    k: mc
    q: 'Имеет ли предел последовательность $a_n=3$ для всех $n$?'
    a: 'Да, предел равен $3$'
    e: {c1.seq.never-reaches: 'Нет: члены не приближаются, а равны $3$'}
    x: ['Да, предел равен $0$']
    h: ['Проверь определение: $|a_n-3|=0<\varepsilon$.']
  p5:
    k: mc
    lv: 2
    q: 'Последовательность $a_n=(-1)^n$ ограничена. Сходится ли она?'
    a: 'Нет: значения чередуются между $-1$ и $1$'
    e: {c1.seq.bounded: 'Да: ограниченная последовательность сходится'}
    x: ['Да, предел равен $0$']
    h: ['Все члены должны приближаться к одному числу.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\lim_{n\to\infty}\frac{2n+1}{n+3}$.'
    steps:
      - 'Разделим числитель и знаменатель на $n$: $\frac{2+1/n}{1+3/n}$'
      - 'Дроби $\frac1n$ и $\frac3n$ стремятся к нулю'
      - 'Итог: предел равен $2$'
    bad:
      - {i: 2, t: 'Дроби $\frac1n$ и $\frac3n$ стремятся к единице'}
      - {i: 3, t: 'Итог: предел равен $\frac13$'}
err: [c1.seq.never-reaches, c1.seq.bounded]
sum:
  - 'Умею находить пределы последовательностей и искать $N$ для заданного $\varepsilon$.'
  - 'Отличаю сходящуюся последовательность от ограниченной.'
  - 'Знаю, что члены могут совпадать с пределом.'
