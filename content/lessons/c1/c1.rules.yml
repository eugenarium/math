id: c1.rules
int:
  - 'Считать производную по определению каждый раз долго. Есть правила, которые сводят сложную функцию к простым. Но сначала проверь одну соблазнительную догадку.'
  - {ask: 'Верно ли, что $(x\cdot x)''=1\cdot1=1$?', ans: 'Нет: $x\cdot x=x^2$ и $(x^2)''=2x$. Производная произведения — не произведение производных.'}
  - 'Правильное правило: $(uv)''=u''v+uv''$. Проверка на $x\cdot x$: $1\cdot x+x\cdot1=2x$. Совпало с $(x^2)''$.'
def:
  - {g: differentiation-rules}
  - {g: derivative-table}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..5, n: 2..4, x0: 1..3}
    q: 'Найди $f''(@x0)$ для $f(x)=@{a}x^@{n}$.'
    a: a*n*x0^(n-1)
    h: ['Используй $(x^n)''=nx^{n-1}$ и вынеси константу.']
  p2:
    k: num
    lv: 2
    v: {a: 2..4, b: 1..5, x0: 1..3}
    q: 'Найди $f''(@x0)$ для $f(x)=x^2\cdot(@{a}x+@b)$.'
    a: 2*x0*(a*x0+b)+x0^2*a
    e: {c1.rules.product: 2*x0*a}
    h: ['Это произведение двух функций: применяй правило $(uv)''=u''v+uv''$.']
    sol:
      - 'Пусть $u=x^2$ и $v=@{a}x+@b$. Тогда $u''=2x$ и $v''=@a$.'
      - 'Правило произведения: $(uv)''=u''v+uv''$.'
      - 'При $x=@x0$: $@{2*x0}\cdot@{a*x0+b}+@{x0^2}\cdot@a=@{2*x0*(a*x0+b)+x0^2*a}$.'
  p3:
    k: expr
    lv: 2
    v: {a: 2..4, b: 1..4, c: 1..4}
    q: 'Найди производную $f(x)=(@{a}x+@b)(x^2-@c)$. Ответ запиши выражением от $x$.'
    a: a*(x^2-c)+(a*x+b)*2*x
    e: {c1.rules.product: 'a*2*x'}
    h: ['Правило произведения: производная первого на второе плюс первое на производную второго.']
    sol:
      - 'Первый множитель $@{a}x+@b$ имеет производную $@a$, второй $x^2-@c$ — производную $2x$.'
      - 'По правилу произведения: $@a\,(x^2-@c)+(@{a}x+@b)\cdot2x$.'
      - 'Это и есть ответ; скобки можно раскрыть, значение от этого не изменится.'
  p4:
    k: mc
    q: 'Чему равна производная частного $\left(\frac{u}{v}\right)''$?'
    a: '$\frac{u''v-uv''}{v^2}$'
    e: {c1.rules.quotient-order: '$\frac{uv''-u''v}{v^2}$'}
    x: ['$\frac{u''}{v''}$', '$\frac{u''v+uv''}{v^2}$']
    h: ['В числителе сначала идёт производная числителя дроби.']
  p5:
    k: num
    lv: 2
    v: {a: 2..4, b: 1..5, x0: 1..3}
    q: 'Найди $f''(@x0)$ для $f(x)=\frac{x}{@{a}x+@b}$.'
    a: b/(a*x0+b)^2
    tol: 0.002
    e: {c1.rules.quotient-order: -b/(a*x0+b)^2}
    h: ['Правило частного: $\frac{u''v-uv''}{v^2}$, здесь $u=x$.']
    sol:
      - 'Пусть $u=x$ и $v=@{a}x+@b$. Тогда $u''=1$ и $v''=@a$.'
      - 'Числитель: $u''v-uv''=(@{a}x+@b)-@{a}x=@b$.'
      - 'Итог: $f''(x)=\frac{@b}{(@{a}x+@b)^2}$, при $x=@x0$ это $@{b/(a*x0+b)^2:f4}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении производной $x^2\sin x$.'
    steps:
      - '$(x^2\sin x)''=(x^2)''\sin x+x^2(\sin x)''$'
      - '$(x^2)''=2x$ и $(\sin x)''=\cos x$'
      - 'Подставим: $(x^2\sin x)''=2x\sin x+x^2\cos x$'
    bad:
      - {i: 1, t: '$(x^2\sin x)''=(x^2)''\cdot(\sin x)''$', e: c1.rules.product}
      - {i: 3, t: 'Подставим: $(x^2\sin x)''=2x\sin x-x^2\cos x$'}
err: [c1.rules.product, c1.rules.quotient-order]
sum:
  - 'Умею дифференцировать степенные функции и произведения по правилу $(uv)''=u''v+uv''$.'
  - 'Умею дифференцировать частное, не путая порядок в числителе.'
  - 'Отличаю производную произведения от произведения производных.'
