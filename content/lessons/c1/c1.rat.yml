id: c1.rat
int:
  - 'Как найти $\int\frac{dx}{(x-1)(x-3)}$? Подынтегральное выражение — произведение скобок в знаменателе. Хочется разбить его на дроби с одной скобкой.'
  - {ask: 'Проверь: чему равна сумма $\frac{-1/2}{x-1}+\frac{1/2}{x-3}$?', ans: 'Общий знаменатель даёт $\frac{-\frac12(x-3)+\frac12(x-1)}{(x-1)(x-3)}=\frac{1}{(x-1)(x-3)}$. Разложение верно, и каждая дробь интегрируется логарифмом.'}
  - 'Коэффициенты находят, подставляя корни знаменателя в равенство без дробей.'
def:
  - {g: partial-fractions}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..4, b: 5..8}
    q: 'Найди $A$ в разложении $\frac{1}{(x-@a)(x-@b)}=\frac{A}{x-@a}+\frac{B}{x-@b}$.'
    a: 1/(a-b)
    tol: 0.002
    e: {c1.rat.coef: 1/(b-a)}
    h: ['Подставь $x=@a$ в $1=A(x-@b)+B(x-@a)$.']
  p2:
    k: num
    lv: 2
    v: {a: 1..3, d: 2..4}
    q: 'Вычисли $\int_{@{a+d+1}}^{@{a+d+2}}\frac{dx}{(x-@a)(x-@{a+d})}$.'
    a: log(2*(d+1)/(d+2))/d
    tol: 0.002
    e: {c1.rat.coef: log(2*(d+1)/(d+2))}
    h: ['Разложи на простейшие: $A=-\frac{1}{@d}$, $B=\frac{1}{@d}$.']
    sol:
      - 'Разложение: $A=-\frac{1}{@d}$ при $\frac{1}{x-@a}$ и $B=\frac{1}{@d}$ при $\frac{1}{x-@{a+d}}$.'
      - 'Первообразная: $\frac{1}{@d}\ln\frac{x-@{a+d}}{x-@a}$ при $x>@{a+d}$.'
      - 'Подстановка пределов даёт $\frac{1}{@d}\ln\frac{@{2*(d+1)}}{@{d+2}}=@{log(2*(d+1)/(d+2))/d:f4}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..3, b: 4..6, c: 1..4}
    q: 'Найди $B$ в разложении $\frac{x+@c}{(x-@a)(x-@b)}=\frac{A}{x-@a}+\frac{B}{x-@b}$.'
    a: (b+c)/(b-a)
    tol: 0.002
    e: {c1.rat.coef: (a+c)/(a-b)}
    h: ['Подставь $x=@b$ в $x+@c=A(x-@b)+B(x-@a)$.']
    sol:
      - 'Умножим на знаменатель: $x+@c=A(x-@b)+B(x-@a)$.'
      - 'При $x=@b$: $@{b+c}=B(@b-@a)=@{b-a}B$.'
      - 'Значит, $B=\frac{@{b+c}}{@{b-a}}=@{(b+c)/(b-a):f3}$.'
  p4:
    k: mc
    q: 'Чему равен $\int\frac{dx}{x-3}$?'
    a: '$\ln|x-3|+C$'
    e: {c1.rat.lin: '$-\frac{1}{(x-3)^2}+C$'}
    x: ['$\ln|x|+C$']
    h: ['Найди функцию с производной $\frac{1}{x-3}$.']
  p5:
    k: num
    lv: 2
    v: {a: 1..4}
    q: 'Вычисли $\int_{@{a+1}}^{@{a+2}}\frac{dx}{x^2-@{a^2}}$.'
    a: log((2*a+1)/(a+1))/(2*a)
    tol: 0.002
    e: {c1.rat.coef: log((2*a+1)/(a+1))}
    h: ['Разложи $x^2-@{a^2}=(x-@a)(x+@a)$.']
    sol:
      - 'Разложение: $A=\frac{1}{@{2*a}}$ при $\frac{1}{x-@a}$ и $B=-\frac{1}{@{2*a}}$ при $\frac{1}{x+@a}$.'
      - 'Первообразная: $\frac{1}{@{2*a}}\ln\frac{x-@a}{x+@a}$.'
      - 'Подстановка пределов: $\frac{1}{@{2*a}}\ln\frac{@{2*a+1}}{@{a+1}}$. Это $@{log((2*a+1)/(a+1))/(2*a):f4}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\int\frac{dx}{(x-1)(x-3)}$.'
    steps:
      - 'Запишем $\frac{1}{(x-1)(x-3)}=\frac{A}{x-1}+\frac{B}{x-3}$, тогда $1=A(x-3)+B(x-1)$'
      - 'При $x=1$: $1=-2A$ и $A=-\frac12$'
      - 'При $x=3$: $1=2B$ и $B=\frac12$'
      - 'Итог: $-\frac12\ln|x-1|+\frac12\ln|x-3|+C$'
    bad:
      - {i: 2, t: 'При $x=1$: $1=2A$ и $A=\frac12$', e: c1.rat.coef}
      - {i: 4, t: 'Итог: $-\frac12\ln|x-1|+\frac12\cdot\frac{1}{x-3}+C$', e: c1.rat.lin}
err: [c1.rat.coef, c1.rat.lin]
sum:
  - 'Умею разлагать $\frac{1}{(x-a)(x-b)}$ на простейшие дроби.'
  - 'Умею интегрировать $\frac{1}{x-a}$ как $\ln|x-a|$.'
