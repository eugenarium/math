id: pre.func
int:
  - 'Автомат берёт число, умножает на 2 и прибавляет 3. На выходе получилось 11. Какое число подали? Чтобы ответить, ты прошёл автомат в обратную сторону.'
  - {ask: 'Что делает автомат «в обратную сторону»?', ans: 'Вычитает 3, потом делит на 2. Порядок действий меняется на обратный, а каждое действие — на противоположное.'}
  - 'Теперь поставим два автомата подряд: «прибавь 3», затем «умножь на 2». Если поменять их местами, ответ станет другим: проверь на числе 5.'
def:
  - {g: function}
  - {g: domain}
  - {g: composition}
  - {g: inverse-function}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 2..9, b: -9..9 !0, x0: -4..4}
    q: 'Для $f(x)=@{a}x@{b:s}$ найди $f(@x0)$.'
    a: a*x0+b
    h: ['Подставь число вместо $x$ и выполни действия по порядку.']
  p2:
    k: num
    lv: 2
    v: {a: 2..5, b: 1..6, x0: 1..4}
    c: ['(a*x0+b)^2 != a*x0^2+b']
    q: 'Для $f(x)=@{a}x+@b$ и $g(x)=x^2$ найди $(f\circ g)(@x0)$.'
    a: a*x0^2+b
    e: {pre.func.comp-order: (a*x0+b)^2}
    h: ['В $(f\circ g)(x)$ сначала действует $g$, потом $f$.']
    sol:
      - 'Сначала $g$: $g(@x0)=@{x0}^2=@{x0^2}$.'
      - 'Теперь $f$ от результата: $f(@{x0^2})=@a\cdot@{x0^2}+@b$.'
      - 'Итог: $(f\circ g)(@x0)=@{a*x0^2+b}$.'
  p3:
    k: expr
    lv: 2
    v: {a: [2, 3, 4, 5], b: 1..7}
    q: 'Найди функцию, обратную к $f(x)=@{a}x+@b$. Ответ запиши выражением от $x$.'
    a: (x-b)/a
    e: {pre.func.inv-recip: 1/(a*x+b)}
    h: ['Запиши $y=f(x)$, поменяй $x$ и $y$ местами и вырази $y$.']
    sol:
      - '$y=@{a}x+@b$. Меняем роли: $x=@{a}y+@b$.'
      - 'Выражаем $y$: $@{a}y=x-@b$.'
      - 'Делим на $@a$: $f^{-1}(x)=\frac{x-@b}{@a}$.'
  p4:
    k: mc
    v: {p: 2..6, q: 7..12}
    q: 'Функция $f$ обратима и $f(@p)=@q$. Чему равно $f^{-1}(@q)$?'
    a: '@p'
    e: {pre.func.inv-recip: '$\frac{1}{@q}$'}
    x: ['@q', '$\frac{1}{@p}$']
    h: ['Обратная функция возвращает то число, из которого получили $@q$.']
  p5:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $(f\circ g)(3)$ для $f(x)=2x+1$ и $g(x)=x^2$.'
    steps:
      - '$(f\circ g)(3)=f(g(3))$'
      - '$g(3)=3^2=9$'
      - '$f(9)=2\cdot9+1=19$'
      - '$(f\circ g)(3)=19$'
    bad:
      - {i: 2, t: '$f(3)=2\cdot3+1=7$', e: pre.func.comp-order}
      - {i: 3, t: '$f(9)=2\cdot9+1=18$'}
  p6:
    k: num
    lv: 2
    v: {a: 1..4, b: 6..9}
    q: 'Сколько целых $x$ из отрезка $[0, @b]$ входят в область определения $f(x)=\sqrt{x-@a}$?'
    a: b-a+1
    sol:
      - 'Корень существует при $x-@a\ge0$, то есть $x\ge@a$.'
      - 'Подходят целые от $@a$ до $@b$ включительно.'
      - 'Их количество: $@b-@a+1=@{b-a+1}$.'
err: [pre.func.inv-recip, pre.func.comp-order]
sum:
  - 'Умею вычислять значение функции и композиции, применяя сначала внутреннюю функцию.'
  - 'Умею находить обратную линейную функцию и отличаю $f^{-1}$ от $\frac{1}{f}$.'
  - 'Умею находить область определения функции с корнем.'
