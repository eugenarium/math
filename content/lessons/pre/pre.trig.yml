id: pre.trig
int:
  - 'Кабина колеса обозрения движется по окружности радиуса 1. Когда колесо поворачивается на угол $\theta$, меняются и высота кабины, и её смещение вбок. Как именно?'
  - w: fplot
    xy: ['cos(t)', 'sin(t)']
    t: [0, 6.2832]
    x: [-1.5, 1.5]
    y: [-1.5, 1.5]
    eq: 1
    sl: {th: [0, 6.2832, 1, 0.01]}
    pts: [['cos(th)', 'sin(th)']]
    lab: 1
    cap: 'Двигай угол $\theta$ в радианах и следи за координатами точки'
    ask: 'Какая координата похожа на косинус, а какая — на синус?'
    ans: 'Абсцисса — косинус, ордината — синус. Точка угла $\theta$ имеет координаты $(\cos\theta,\ \sin\theta)$.'
def:
  - {g: unit-circle}
  - {g: radian}
  - 'Удобные углы: $30^\circ=\frac{\pi}{6}$, $45^\circ=\frac{\pi}{4}$, $60^\circ=\frac{\pi}{3}$, $90^\circ=\frac{\pi}{2}$.'
ex:
  - {x: p5, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {d: [30, 45, 60, 90, 120, 180]}
    q: 'Переведи $@{d}^\circ$ в радианы. Ответ дай числом, считая $\pi\approx3.1416$.'
    a: d*pi/180
    tol: 0.01
    e: {pre.trig.deg-rad: d*180/pi}
    h: ['Радианов должно получиться мало: полный оборот — около $6.28$.']
  p2:
    k: mc
    q: 'Точка единичной окружности отвечает углу $\theta$. Какое число — её абсцисса?'
    a: '$\cos\theta$'
    e: {pre.trig.sin-cos-swap: '$\sin\theta$'}
    x: ['$\operatorname{tg}\theta$', '$\theta$']
    h: ['При $\theta=0$ точка стоит в $(1, 0)$.']
  p3:
    k: num
    lv: 2
    v: {k: 1..7}
    q: 'Найди $\sin\left(@{k}\cdot\frac{\pi}{2}\right)$.'
    a: round(sin(k*pi/2), 0)
    e: {pre.trig.sin-cos-swap: 'round(cos(k*pi/2), 0)'}
    h: ['Найди точку этого угла на окружности и возьми ординату.']
    sol:
      - 'Угол $@{k}\cdot\frac{\pi}{2}$ — это $@{k*90}^\circ$.'
      - 'Синус — ордината точки этого угла на единичной окружности.'
      - 'Значит, $\sin\left(@{k}\cdot\frac{\pi}{2}\right)=@{round(sin(k*pi/2), 0)}$.'
  p4:
    k: graph
    v: {d: [30, 60, 90, 120, 150, 210, 240, 300]}
    q: 'Поставь угол $\theta=@{d}^\circ$. Подсказка: перевод в радианы — умножить на $\frac{\pi}{180}$.'
    w: {w: fplot, xy: ['cos(t)', 'sin(t)'], t: [0, 6.2832], x: [-1.5, 1.5], y: [-1.5, 1.5], eq: 1, sl: {th: [0, 6.2832, 0, 0.01]}, pts: [['cos(th)', 'sin(th)']], lab: 1}
    goal: {th: [d*pi/180, 0.05]}
    h: ['Умножь число градусов на $\frac{\pi}{180}\approx0.01745$.']
  p5:
    k: num
    lv: 2
    v: {d: [30, 60, 120, 150, 210, 240]}
    q: 'Найди абсциссу точки единичной окружности, отвечающей углу $@{d}^\circ$. Ответ округли до сотых.'
    a: cos(d*pi/180)
    tol: 0.01
    e: {pre.trig.sin-cos-swap: sin(d*pi/180)}
    h: ['Абсцисса точки угла — это косинус.']
    sol:
      - 'Перевод в радианы: $@{d}\cdot\frac{\pi}{180}\approx@{d*pi/180:f3}$.'
      - 'Абсцисса точки этого угла — косинус.'
      - 'Получаем $\cos@{d}^\circ\approx@{cos(d*pi/180):f2}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\cos150^\circ$.'
    steps:
      - 'Найдём точку угла $150^\circ$ на единичной окружности'
      - '$150^\circ=180^\circ-30^\circ$: точка лежит во второй четверти'
      - 'Для $30^\circ$ абсцисса равна $\frac{\sqrt3}{2}$'
      - 'Во второй четверти абсцисса отрицательна, значит $\cos150^\circ=-\frac{\sqrt3}{2}$'
    bad:
      - {i: 3, t: 'Для $30^\circ$ абсцисса равна $\frac12$', e: pre.trig.sin-cos-swap}
      - {i: 4, t: 'Во второй четверти абсцисса положительна, значит $\cos150^\circ=\frac{\sqrt3}{2}$'}
err: [pre.trig.deg-rad, pre.trig.sin-cos-swap]
sum:
  - 'Умею переводить градусы в радианы умножением на $\frac{\pi}{180}$.'
  - 'Умею находить косинус и синус угла как координаты точки единичной окружности.'
  - 'Отличаю косинус (абсцисса) от синуса (ордината) и учитываю четверть.'
