id: pre.ineq
int:
  - 'Неравенство $3x<12$ решается делением: $x<4$. А как решить $-3x<12$? Предскажи ответ, а потом проверь его на числовой прямой.'
  - w: numline
    ineq: '-3*x < 12'
    win: [-8, 8]
    cap: 'Закрашено множество решений неравенства $-3x<12$'
    ask: 'Почему решения лежат справа от $-4$, а не слева?'
    ans: 'При делении на $-3$ знак меняется: $x>-4$. Проверка: $x=0$ даёт $0<12$, верно.'
  - w: numline
    eps: [2, 1.5]
    win: [-2, 6]
    cap: 'Окрестность точки $2$ радиуса $1.5$: все $x$ на расстоянии меньше $1.5$ от $2$'
    ask: 'Какой промежуток она задаёт?'
    ans: 'Интервал $(0.5, 3.5)$: расстояние от $x$ до $2$ меньше $1.5$ в обе стороны.'
def:
  - {g: inequality}
  - {g: absolute-value}
  - {g: neighborhood}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: -6..-1, b: 1..6}
    q: 'Найди расстояние между точками $@a$ и $@b$ на числовой прямой.'
    a: b-a
    h: ['Расстояние — это модуль разности: из большего вычти меньшее.']
  p2:
    k: mc
    v: {a: 2..6, b: 1..8}
    q: 'Реши неравенство $-@{a}x<@{a*b}$. Какое множество решений?'
    a: '$x>@{-b}$'
    e: {pre.ineq.neg-flip: '$x<@{-b}$'}
    x: ['$x>@b$', '$x<@b$']
    h: ['Делишь на отрицательное число: знак неравенства меняется.']
  p3:
    k: num
    lv: 2
    v: {a: 2..4, k: -3..4, b: 1..9, c: =b-a*k}
    q: 'Найди наименьшее целое $x$, при котором $-@{a}x@{b:s}<@c$.'
    a: k+1
    e: {pre.ineq.neg-flip: k-1}
    h: ['Перенеси число вправо, потом раздели на отрицательное и разверни знак.']
    sol:
      - 'Перенесём число: $-@{a}x<@{c-b}$.'
      - 'Делим на $-@a$ и разворачиваем знак: $x>@k$.'
      - 'Наименьшее целое, большее $@k$, — это $@{k+1}$.'
  p4:
    k: graph
    lv: 2
    v: {c: -2..2 !0, r: 1..3}
    q: 'Отметь на прямой решение неравенства $|x@{-c:s}|<@r$: перетащи концы и коснись конца, чтобы сделать его открытым.'
    w: {w: numline, drag: 1, iv: ['[0, 1]'], win: [-8, 8]}
    goal: {a: [c-r, 0.25], b: [c+r, 0.25], ca: [0, 0.5], cb: [0, 0.5]}
    h: ['Неравенство $|x-c|<r$ означает $c-r<x<c+r$, концы не входят.']
  p5:
    k: mc
    lv: 2
    v: {a: 1..4, r: 1..3}
    q: 'Окрестность точки $@a$ радиуса $@r$ — это какое множество?'
    a: '$(@{a-r},\ @{a+r})$'
    e: {pre.ineq.abs-split: '$x<@{a+r}$'}
    x: ['$(@a,\ @{a+r})$', '$(@{-a-r},\ @{-a+r})$']
    h: ['Это все $x$, удалённые от $@a$ меньше чем на $@r$ в обе стороны.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при решении неравенства $|x-3|\le2$.'
    steps:
      - 'Решим $|x-3|\le2$'
      - 'Модуль не больше 2: $-2\le x-3\le2$'
      - 'Прибавим 3 ко всем частям: $1\le x\le5$'
      - 'Ответ: промежуток $[1, 5]$'
    bad:
      - {i: 2, t: 'Раскрываем модуль: $x-3\le2$', e: pre.ineq.abs-split}
      - {i: 3, t: 'Прибавим 3 ко всем частям: $-1\le x\le5$'}
err: [pre.ineq.neg-flip, pre.ineq.abs-split]
sum:
  - 'Умею решать линейные неравенства и разворачивать знак при делении на отрицательное.'
  - 'Умею записывать $|x-a|<r$ двойным неравенством и промежутком $(a-r, a+r)$.'
  - 'Умею отмечать решение на числовой прямой: открытые и закрытые концы.'
