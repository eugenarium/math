id: pre.explog
int:
  - 'Бактерий каждый час становится вдвое больше. Через сколько часов их станет в 1000 раз больше? Ответ — логарифм: показатель, в который нужно возвести 2.'
  - w: fplot
    f: ['exp(x)', 'ln(x)', 'x']
    x: [-3, 5]
    y: [-3, 5]
    cap: 'Графики $e^x$ и $\ln x$ — отражения друг друга относительно прямой $y=x$'
    ask: 'Что значит это отражение для самих функций?'
    ans: 'Они обратны друг другу: $\ln(e^x)=x$ и $e^{\ln x}=x$.'
def:
  - {g: exponent-rules}
  - {g: logarithm}
  - 'Логарифм отвечает на вопрос «в какую степень возвести основание». $\log_2 8=3$, потому что $2^3=8$.'
ex:
  - {x: p6, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [2, 3, 5], n: 2..4}
    q: 'Вычисли $\log_{@a} @{a^n}$.'
    a: n
    h: ['В какую степень нужно возвести $@a$, чтобы получить $@{a^n}$?']
  p2:
    k: num
    v: {b: [2, 3], m: 2..4, n: 2..3}
    q: 'Найди значение $@{b}^{@m}\cdot @{b}^{@n}$.'
    a: b^(m+n)
    h: ['При умножении степеней с одним основанием показатели складываются.']
    sol:
      - 'Основание одно, поэтому показатели складываем: $@m+@n=@{m+n}$.'
      - 'Получаем $@{b}^{@{m+n}}=@{b^(m+n)}$.'
  p3:
    k: expr
    lv: 2
    v: {k: 2..5}
    q: 'Запиши $\ln\left(x^{@k}\right)$ через $\ln x$ при $x>0$.'
    a: k*ln(x)
    dom: [0.5, 4]
    e: {pre.explog.log-power: (ln(x))^k}
    h: ['Показатель степени под логарифмом выносится множителем.']
    sol:
      - 'Показатель $@k$ у числа под знаком логарифма.'
      - 'Он выходит вперёд множителем: $\ln\left(x^{@k}\right)=@k\ln x$.'
  p4:
    k: mc
    lv: 2
    v: {a: 2..5, b: 2..5}
    c: ['a != b']
    q: 'Чему равно $\ln(@a+@b)$?'
    a: '$\ln @{a+b}$'
    e: {pre.explog.ln-sum: '$\ln @a+\ln @b$'}
    x: ['$\ln @{a*b}$', '$@{a+b}\ln e$']
    h: ['Сначала выполни сложение под знаком логарифма.']
  p5:
    k: spot
    lv: 2
    q: 'Найди ошибку в преобразовании $\log_2 40$.'
    steps:
      - '$\log_2 40=\log_2(8\cdot5)$'
      - '$\log_2(8\cdot5)=\log_2 8+\log_2 5$'
      - '$\log_2 8=3$, потому что $2^3=8$'
      - '$\log_2 40=3+\log_2 5$'
    bad:
      - {i: 2, t: '$\log_2(8\cdot5)=\log_2 8\cdot\log_2 5$', e: pre.explog.log-prod}
      - {i: 3, t: '$\log_2 8=4$, потому что $2^4=8$'}
  p6:
    k: num
    lv: 2
    v: {n: 3..6}
    q: 'Бактерий вдвое больше каждый час. За сколько часов их число вырастет с 1 до $@{2^n}$?'
    a: n
    h: ['Нужен показатель $x$, при котором $2^x=@{2^n}$.']
    sol:
      - 'Рост за $x$ часов: $2^x$. Решаем $2^x=@{2^n}$.'
      - 'Число $@{2^n}$ — это $2^{@n}$, значит $x=\log_2 @{2^n}=@n$.'
err: [pre.explog.ln-sum, pre.explog.log-power, pre.explog.log-prod]
sum:
  - 'Умею находить логарифм по определению: в какую степень возвести основание.'
  - 'Умею применять $\ln(xy)=\ln x+\ln y$ и $\ln x^k=k\ln x$.'
  - 'Отличаю логарифм произведения от логарифма суммы: для суммы формулы нет.'
