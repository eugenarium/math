id: pre.sum
int:
  - 'Сумма $1+2+3+\dots+100$ длинная. Знак $\sum$ записывает её коротко: $\sum_{i=1}^{100} i$. Под знаком — с чего стартует индекс, над ним — на чём он заканчивается.'
  - {ask: 'Сколько слагаемых в сумме $\sum_{i=3}^{7} i$?', ans: 'Пять: $i=3,4,5,6,7$. Число слагаемых равно верхней границе минус нижняя плюс один.'}
def:
  - {g: sigma-notation}
  - {g: product-notation}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {k: 1..4, m: 5..9}
    q: 'Сколько слагаемых в сумме $\sum_{i=@k}^{@m} i^2$?'
    a: m-k+1
    e: {pre.sum.count: m-k}
    h: ['Выпиши значения индекса от нижней границы до верхней и сосчитай их.']
  p2:
    k: num
    fast: 1
    v: {n: 3..8, c: 2..6}
    q: 'Вычисли $\sum_{i=1}^{@n} @c$.'
    a: n*c
    e: {pre.sum.const: c}
    h: ['Слагаемое $@c$ не зависит от $i$ и повторяется $@n$ раз.']
  p3:
    k: num
    lv: 2
    v: {n: 3..6, a: 2..4, b: -3..3 !0}
    q: 'Вычисли $\sum_{i=1}^{@n} (@{a}i@{b:s})$.'
    a: a*n*(n+1)/2+b*n
    e: {pre.sum.const: a*n*(n+1)/2+b}
    h: ['Раздели сумму на две: часть с $i$ и константа.']
    sol:
      - 'Разделим: $@{a}\sum_{i=1}^{@n} i+\sum_{i=1}^{@n}(@b)$.'
      - 'Первая часть: $1+\dots+@n=@{n*(n+1)/2}$, значит $@a\cdot@{n*(n+1)/2}=@{a*n*(n+1)/2}$.'
      - 'Вторая часть: $@n$ слагаемых по $@b$ дают $@{n*b}$. Итог: $@{a*n*(n+1)/2+n*b}$.'
  p4:
    k: expr
    lv: 2
    q: 'Найди $\sum_{i=1}^{n} (2i-1)$ как выражение от $n$.'
    a: n^2
    vars: [n]
    dom: [1, 6]
    e: {pre.sum.const: n*(n+1)-1}
    h: ['Раздели сумму на $2\sum i$ и $\sum 1$.']
    sol:
      - 'Разделим: $2\sum_{i=1}^{n} i-\sum_{i=1}^{n} 1$.'
      - 'Первая часть: $2\cdot\frac{n(n+1)}{2}=n(n+1)$. Вторая: $n$ единиц дают $n$.'
      - 'Итог: $n(n+1)-n=n^2$.'
  p5:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\sum_{i=2}^{5} i$.'
    steps:
      - '$\sum_{i=2}^{5} i=2+3+4+5$'
      - 'Число слагаемых: $5-2+1=4$'
      - 'Среднее крайних слагаемых: $\frac{2+5}{2}=3.5$'
      - 'Сумма: $4\cdot3.5=14$'
    bad:
      - {i: 2, t: 'Число слагаемых: $5-2=3$', e: pre.sum.count}
      - {i: 4, t: 'Сумма: $4\cdot3.5=12$'}
err: [pre.sum.count, pre.sum.const]
sum:
  - 'Умею считать число слагаемых в сумме: верхняя граница минус нижняя плюс один.'
  - 'Умею вычислять суммы вида $\sum(ai+b)$, не забывая умножить константу на число слагаемых.'
  - 'Отличаю сумму константы $\sum c=nc$ от суммы, зависящей от индекса.'
