id: pre.cx
int:
  - 'Уравнение $x^2=-1$ не имеет решений среди вещественных чисел. Введём число $i$ с условием $i^2=-1$. Тогда число $a+bi$ можно нарисовать как точку плоскости с координатами $(a, b)$.'
  - w: complex
    z: {z: [1, 2]}
    show: [polar]
    cap: 'Двигай точку $z$: у неё есть расстояние до нуля $|z|$ и угол $\arg z$'
    ask: 'Чему равен $|z|$ для $z=3+4i$?'
    ans: 'Пяти: по теореме Пифагора $\sqrt{3^2+4^2}=5$.'
  - w: complex
    z: {z: [2, 1], w: [1, 2]}
    show: [sum]
    cap: 'Сумма $z+w$ — диагональ параллелограмма на векторах $z$ и $w$'
    ask: 'Равна ли длина $z+w$ сумме длин $z$ и $w$?'
    ans: 'Нет, только если векторы сонаправлены. В общем случае $|z+w|\le|z|+|w|$.'
def:
  - {g: complex-number}
  - {g: modulus-argument}
  - {g: euler-formula}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {t: [[3, 4], [5, 12], [8, 15], [6, 8]]}
    q: 'Найди $|z|$ для $z=@{t[1]}+@{t[2]}i$.'
    a: sqrt(t[1]^2+t[2]^2)
    e: {pre.cx.abs-sum: 't[1]+t[2]'}
    h: ['Модуль — расстояние от нуля до точки $(a, b)$.']
  p2:
    k: num
    v: {a: 1..4, b: 1..4}
    q: 'Вычисли $(@a+@{b}i)(@a-@{b}i)$.'
    a: a^2+b^2
    e: {pre.cx.i-square: a^2-b^2}
    h: ['Раскрой скобки и замени $i^2$ на $-1$.']
    sol:
      - 'Раскроем скобки: $@{a}^2-@{b}^2i^2$.'
      - 'Так как $i^2=-1$, получаем $@{a^2}+@{b^2}=@{a^2+b^2}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..4, b: 1..4, c: 1..4, d: 1..4}
    q: 'Найди вещественную часть произведения $(@a+@{b}i)(@c+@{d}i)$.'
    a: a*c-b*d
    e: {pre.cx.i-square: a*c+b*d}
    h: ['Раскрой скобки, слагаемое с $i^2$ даст вклад в вещественную часть.']
    sol:
      - 'Раскроем скобки: $@a\cdot@c+@a\cdot@{d}i+@{b}i\cdot@c+@{b}i\cdot@{d}i$.'
      - 'Последнее слагаемое содержит $i^2=-1$ и равно $-@{b*d}$.'
      - 'Вещественная часть: $@{a*c}-@{b*d}=@{a*c-b*d}$.'
  p4:
    k: graph
    v: {a: -3..3 !0, b: -3..3 !0}
    q: 'Поставь точку $z$ в положение $@a@{b:s}i$.'
    w: {w: complex, z: {z: [0, 0]}, show: [polar], win: [-4, 4]}
    goal: {'z.re': [a, 0.25], 'z.im': [b, 0.25]}
    h: ['Первое число — вещественная часть, по горизонтали; второе — мнимая, по вертикали.']
  p5:
    k: graph
    lv: 2
    v: {a: 1..3, b: 1..3, c: 0..3, d: 0..3}
    c: ['a != c or b != d']
    q: 'Точка $z=@a+@{b}i$ закреплена. Поставь $w$ так, чтобы сумма $z+w$ равнялась $@c+@{d}i$.'
    w: {w: complex, z: {z: [a, b], w: [0, 0]}, lock: [z], show: [sum], win: [-4, 4]}
    goal: {'w.re': [c-a, 0.25], 'w.im': [d-b, 0.25]}
    h: ['Из $z+w=s$ следует $w=s-z$: вычти вещественные и мнимые части отдельно.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $\frac{1}{1+i}$.'
    steps:
      - 'Домножим числитель и знаменатель на сопряжённое: $\frac{1}{1+i}\cdot\frac{1-i}{1-i}$'
      - 'Знаменатель: $(1+i)(1-i)=1-i^2=1+1=2$'
      - 'Числитель: $1\cdot(1-i)=1-i$'
      - 'Ответ: $\frac{1-i}{2}$'
    bad:
      - {i: 2, t: 'Знаменатель: $(1+i)(1-i)=1-i^2=1-1=0$', e: pre.cx.i-square}
      - {i: 4, t: 'Ответ: $\frac{1+i}{2}$'}
err: [pre.cx.i-square, pre.cx.abs-sum]
sum:
  - 'Умею находить модуль комплексного числа и отмечать число на плоскости.'
  - 'Умею перемножать комплексные числа, заменяя $i^2$ на $-1$.'
  - 'Отличаю модуль суммы от суммы модулей: $|z+w|\le|z|+|w|$.'
