id: pre.graph
int:
  - 'График $y=x^2$ — парабола с вершиной в начале координат. Предскажи, что станет с ней, если заменить $x$ на $x-2$, а потом проверь предсказание на картинке.'
  - w: fplot
    f: ['x^2', '(x-a)^2']
    x: [-6, 6]
    y: [-2, 12]
    sl: {a: [-3, 3, 0, 0.5]}
    cap: 'Двигай $a$ и сравни параболы $y=x^2$ и $y=(x-a)^2$'
    ask: 'В какую сторону сдвигается график при $a>0$?'
    ans: 'Вправо. Скобка $x-a$ обнуляется при $x=a$, туда и переезжает вершина.'
  - w: fplot
    f: ['x^2', 'x^2+b']
    x: [-6, 6]
    y: [-6, 12]
    sl: {b: [-4, 4, 0, 0.5]}
    cap: 'Теперь двигай $b$: сравни $y=x^2$ и $y=x^2+b$'
    ask: 'Чем сдвиг по вертикали отличается от сдвига по горизонтали?'
    ans: 'Добавка снаружи сдвигает так, как написано: плюс — вверх. Замена внутри скобки действует наоборот.'
def:
  - {g: graph-shift}
  - {g: graph-stretch}
  - 'Запомни проверку: ищи, где обнуляется скобка. Для $(x+3)^2$ это $x=-3$, значит вершина слева.'
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: -4..4 !0, b: -5..5 !0}
    q: 'Найди абсциссу вершины параболы $y=(x@{-a:s})^2@{b:s}$.'
    a: a
    e: {pre.graph.shift-sign: -a}
    h: ['Вершина там, где обнуляется скобка.']
  p2:
    k: mc
    v: {s: 2..6}
    q: 'Как получить график $y=f(x@{-s:s})$ из графика $y=f(x)$?'
    a: 'Сдвинуть вправо на @s'
    e: {pre.graph.shift-sign: 'Сдвинуть влево на @s'}
    x: ['Сдвинуть вверх на @s', 'Растянуть вдоль оси $x$ с коэффициентом @s']
    h: ['Найди, при каком $x$ обнуляется выражение в скобке.']
  p3:
    k: num
    lv: 2
    v: {a: -4..4 !0, b: -5..5 !0}
    q: 'Парабола $y=(x@{-a:s})^2@{b:s}$ пересекает ось $y$. Найди ординату точки пересечения.'
    a: a^2+b
    h: ['На оси $y$ абсцисса равна нулю.']
    sol:
      - 'На оси $y$ абсцисса $x=0$, подставим её.'
      - 'Получаем $y=(0@{-a:s})^2@{b:s}=(@{-a})^2@{b:s}$.'
      - 'Считаем: $y=@{a^2}@{b:s}=@{a^2+b}$.'
  p4:
    k: mc
    lv: 2
    v: {k: [2, 3, 4]}
    q: 'График $y=f(x)$ заменили графиком $y=f(@{k}x)$. Что произошло с графиком?'
    a: 'Сжался к оси $y$ с коэффициентом $\frac{1}{@k}$'
    e: {pre.graph.scale-axis: 'Растянулся вдоль оси $y$ с коэффициентом $@k$'}
    x: ['Сдвинулся влево на @k', 'Сжался к оси $x$ с коэффициентом $\frac{1}{@k}$']
    h: ['Множитель внутри скобки меняет аргумент: действует вдоль оси $x$.']
  p5:
    k: graph
    v: {ta: -3..3 !0, tb: -3..3 !0}
    q: 'Подбери $a$ и $b$ так, чтобы вершина параболы $y=(x-a)^2+b$ попала в отмеченную точку.'
    w: {w: fplot, f: '(x-a)^2+b', x: [-6, 6], y: [-6, 8], sl: {a: [-4, 4, 0, 0.5], b: [-4, 4, 0, 0.5]}, pts: [[ta, tb]]}
    goal: {a: [ta, 0.25], b: [tb, 0.25]}
    h: ['Абсцисса вершины — это $a$, ордината — это $b$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в описании преобразований графика $g(x)=\sqrt{x+3}-1$ из $f(x)=\sqrt{x}$.'
    steps:
      - '$g(x)=\sqrt{x+3}-1$ получена из $f(x)=\sqrt{x}$ сдвигами'
      - 'Выражение $x+3$ обнуляется при $x=-3$: начало графика переехало в $x=-3$'
      - 'Значит, график сдвинут на 3 влево'
      - 'Вычитание 1 после корня опускает график на 1'
    bad:
      - {i: 3, t: 'Значит, график сдвинут на 3 вправо', e: pre.graph.shift-sign}
      - {i: 4, t: 'Вычитание 1 после корня поднимает график на 1'}
err: [pre.graph.shift-sign, pre.graph.scale-axis]
sum:
  - 'Умею определять сдвиг графика по формуле $y=f(x-a)+b$: скобку проверяю на нуль.'
  - 'Отличаю множитель снаружи (по оси $y$) от множителя внутри (по оси $x$).'
  - 'Умею находить вершину параболы $y=(x-a)^2+b$.'
