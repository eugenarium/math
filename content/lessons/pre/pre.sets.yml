id: pre.sets
int:
  - 'В классе 20 человек. 12 любят кофе, 15 любят чай, и каждый любит хотя бы один напиток. Сколько человек любят оба? Попробуй ответить, прежде чем смотреть на диаграмму.'
  - w: venn
    n: 2
    expr: 'A & B'
    cap: 'Закрашена общая часть кругов: пересечение $A\cap B$'
    ask: 'Сколько человек в общей части?'
    ans: 'Семь: $12+15-20=7$. Общая часть вошла в оба числа, поэтому из суммы её вычитают один раз.'
def:
  - {g: set}
  - {g: set-operations}
  - {g: inclusion-exclusion}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 6..15, b: 6..15, c: 1..5}
    q: 'В множестве $A$ — @a элементов, в $B$ — @b, а общих — @c. Сколько элементов в $A\cup B$?'
    a: a+b-c
    e: {pre.sets.union-count: a+b}
    h: ['Общие элементы уже учтены в $A$ и в $B$, значит, посчитаны дважды.']
  p2:
    k: num
    lv: 2
    v: {n: [30, 35, 40], a: 10..16, b: 8..14, c: 3..6}
    q: 'В группе @n студентов: @a изучают английский, @b — немецкий, @c — оба языка. Сколько студентов не изучают ни одного?'
    a: n-(a+b-c)
    e: {pre.sets.union-count: n-(a+b)}
    h: ['Сначала найди, сколько студентов изучают хотя бы один язык.']
    sol:
      - 'Хотя бы один язык: $@a+@b-@c=@{a+b-c}$, общих вычитаем один раз.'
      - 'Не изучают ни одного: $@n-@{a+b-c}=@{n-(a+b-c)}$.'
  p3:
    k: mc
    q: 'Чему равно дополнение объединения $\overline{A\cup B}$?'
    a: '$\overline{A}\cap\overline{B}$'
    e: {pre.sets.de-morgan: '$\overline{A}\cup\overline{B}$'}
    x: ['$A\cap B$', '$\overline{A\cap B}$']
    h: ['Элемент вне объединения не лежит ни в $A$, ни в $B$.']
  p4:
    k: graph
    q: 'Закрась на диаграмме область $A\setminus B$: элементы $A$, которых нет в $B$. Касайся нужных областей.'
    w: {w: venn, n: 2, tap: 1}
    goal: {sel: ['vmask("A & !B", 2)', 0.5]}
    h: ['Нужна часть круга $A$, не входящая в круг $B$.']
  p5:
    k: graph
    lv: 2
    q: 'Закрась область, где элементы лежат в $A$ и в $B$, но не лежат в $C$.'
    w: {w: venn, n: 3, tap: 1}
    goal: {sel: ['vmask("A & B & !C", 3)', 0.5]}
    h: ['Это часть общей области кругов $A$ и $B$, не попавшая в круг $C$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при подсчёте $|A\cup B|$.'
    steps:
      - '$|A|=12$, $|B|=9$, $|A\cap B|=4$'
      - '$|A\cup B|=|A|+|B|-|A\cap B|$'
      - '$|A\cup B|=12+9-4$'
      - '$|A\cup B|=17$'
    bad:
      - {i: 2, t: '$|A\cup B|=|A|+|B|$', e: pre.sets.union-count}
      - {i: 3, t: '$|A\cup B|=12+9+4$'}
err: [pre.sets.union-count, pre.sets.de-morgan]
sum:
  - 'Умею считать число элементов объединения: общую часть вычитаю один раз.'
  - 'Умею закрашивать область диаграммы Венна по выражению с $\cup$, $\cap$, $\setminus$.'
  - 'Отличаю дополнение объединения от объединения дополнений: «или» превращается в «и».'
