id: pr.indep
int:
  - 'Два броска монеты: результат второго не зависит от первого. Это независимые события. А «выпал орёл» и «выпала решка» при одном броске независимы ли?'
  - {ask: 'Если при одном броске выпал орёл, чему равна вероятность решки? Что это говорит о независимости?', ans: 'Нулю. Знание одного события полностью меняет вероятность другого, поэтому они зависимы, хотя и несовместны.'}
  - 'Независимость проверяют равенством $P(A\cap B)=P(A)P(B)$. Несовместные события ненулевой вероятности всегда зависимы.'
def:
  - {g: independence}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [0.2, 0.4, 0.5], b: [0.3, 0.5, 0.6]}
    q: 'События $A$ и $B$ независимы, $P(A)=@{a:f1}$, $P(B)=@{b:f1}$. Найди $P(A\cap B)$.'
    a: a*b
    tol: 0.002
    e: {pr.indep.add: a+b}
    h: ['Для независимых событий вероятности «и» перемножаются.']
  p2:
    k: num
    lv: 2
    v: {a: [0.2, 0.4, 0.5], b: [0.3, 0.5, 0.6]}
    q: 'События $A$ и $B$ независимы, $P(A)=@{a:f1}$, $P(B)=@{b:f1}$. Найди $P(A\cup B)$.'
    a: a+b-a*b
    tol: 0.002
    e: {pr.indep.add: a+b}
    h: ['$P(A\cup B)=P(A)+P(B)-P(A\cap B)$.']
    sol:
      - 'Пересечение независимых: $P(A\cap B)=@{a:f1}\cdot@{b:f1}=@{a*b:f2}$.'
      - 'Формула объединения: $P(A)+P(B)-P(A\cap B)$.'
      - 'Получим $@{a:f1}+@{b:f1}-@{a*b:f2}=@{a+b-a*b:f2}$.'
  p3:
    k: num
    lv: 2
    v: {n: 2..5}
    q: 'Честную монету бросают $@n$ раз. Найди вероятность хотя бы одного орла.'
    a: 1-(1/2)^n
    tol: 0.002
    e: {pr.indep.add: n/2}
    h: ['Проще найти вероятность того, что орла не было ни разу.']
    sol:
      - 'Все $@n$ раз выпала решка: $\left(\frac12\right)^@n=@{(1/2)^n:f4}$.'
      - 'Хотя бы один орёл — дополнение этого события.'
      - 'Вероятность $1-@{(1/2)^n:f4}=@{1-(1/2)^n:f4}$.'
  p4:
    k: mc
    q: 'Несовместные события $A$ и $B$ имеют ненулевые вероятности. Независимы ли они?'
    a: 'Нет: $P(A\cap B)=0$, а $P(A)P(B)>0$'
    e: {pr.indep.incompat: 'Да: если одно произошло, другое не влияет'}
    x: ['Да, если их вероятности равны']
    h: ['Проверь равенство $P(A\cap B)=P(A)P(B)$.']
  p5:
    k: num
    lv: 2
    v: {a: [0.4, 0.5], c: [0.1, 0.2]}
    q: 'События $A$ и $B$ независимы, $P(A)=@{a:f1}$, $P(A\cap B)=@{c:f1}$. Найди $P(B)$.'
    a: c/a
    tol: 0.002
    h: ['Подставь в $P(A\cap B)=P(A)P(B)$.']
    sol:
      - 'Независимость: $P(A\cap B)=P(A)P(B)$.'
      - 'Значит, $P(B)=\frac{P(A\cap B)}{P(A)}$.'
      - 'Получим $\frac{@{c:f1}}{@{a:f1}}=@{c/a:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при проверке независимости: $P(A)=0.5$, $P(B)=0.4$, $P(A\cap B)=0.2$.'
    steps:
      - 'Независимость означает $P(A\cap B)=P(A)P(B)$'
      - '$P(A)P(B)=0.5\cdot0.4=0.2$'
      - 'Это равно $P(A\cap B)=0.2$'
      - 'События независимы'
    bad:
      - {i: 2, t: '$P(A)P(B)=0.5+0.4=0.9$', e: pr.indep.add}
      - {i: 4, t: 'События несовместны, а значит независимы', e: pr.indep.incompat}
err: [pr.indep.incompat, pr.indep.add]
sum:
  - 'Умею проверять независимость: $P(A\cap B)=P(A)P(B)$.'
  - 'Знаю, что несовместные события ненулевой вероятности зависимы.'
  - 'Умею считать «хотя бы один» через дополнение.'
