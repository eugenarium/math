id: pr.condexp
int:
  - 'Школьники делятся на две группы: $30\%$ ходят на кружок и в среднем решают $10$ задач, остальные $70\%$ решают в среднем $20$. Какое среднее по всем?'
  - {ask: 'Чему равно среднее число решённых задач по всем школьникам?', ans: '$0.3\cdot10+0.7\cdot20=17$. Простое среднее $\frac{10+20}{2}=15$ было бы неверным: группы разного размера.'}
  - 'Среднее по группе — условное ожидание. Общее среднее получается усреднением групповых средних с весами долей групп. Для дисперсии добавляется ещё различие между группами.'
  - {ask: 'Группы $50\%$ со средним $4$ и $50\%$ со средним $8$. Чему равно общее среднее?', ans: '$6$: $0.5\cdot4+0.5\cdot8$.'}
def:
  - {g: conditional-expectation}
  - 'Как решать. Найди доли групп и групповые средние. Общее среднее — сумма $E[X\mid Y=y]P(Y=y)$. Для условного среднего по таблице дели на $P(Y=y)$. Полная дисперсия — внутри групп плюс между группами.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {p: [0.2, 0.25, 0.4, 0.8], m1: 2..8, m2: 2..8}
    c: ['m1 != m2']
    tol: 0.002
    q: 'Доля группы А равна $@{p:f2}$, среднее в ней $@m1$; в группе Б среднее $@m2$. Найди общее среднее.'
    a: p*m1+(1-p)*m2
    e: {pr.condexp.avg: (m1+m2)/2}
    h: ['Групповые средние берут с весами долей групп.']
  p2:
    k: num
    v: {a: [0.1, 0.2], b: [0.2, 0.3]}
    tol: 0.002
    q: 'В таблице $P(X=1,Y=1)=@{a:f1}$ и $P(X=2,Y=1)=@{b:f1}$. Найди $E[X\mid Y=1]$.'
    a: (a+2*b)/(a+b)
    e: {pr.condexp.norm: a+2*b}
    sol:
      - 'Вероятность условия: $P(Y=1)=@{a:f1}+@{b:f1}=@{a+b:f1}$.'
      - 'Условные вероятности $X=1$ и $X=2$: $\frac{@{a:f1}}{@{a+b:f1}}$ и $\frac{@{b:f1}}{@{a+b:f1}}$.'
      - 'Среднее $\frac{@{a:f1}+2\cdot@{b:f1}}{@{a+b:f1}}=@{(a+2*b)/(a+b):f3}$.'
  p3:
    k: num
    lv: 2
    v: {v1: 1..4, v2: 1..4, m1: 0..6, m2: 0..6}
    c: ['m1 != m2']
    tol: 0.002
    q: 'Две группы равной доли: в первой среднее $@m1$ и дисперсия $@v1$, во второй среднее $@m2$ и дисперсия $@v2$. Найди общую дисперсию.'
    a: (v1+v2)/2+((m1-m2)/2)^2
    e: {pr.condexp.var: (v1+v2)/2}
    sol:
      - 'Средняя внутригрупповая дисперсия: $\frac{@v1+@v2}2=@{(v1+v2)/2:f2}$.'
      - 'Групповые средние $@m1$ и $@m2$ отличаются от общего на $\pm@{abs(m1-m2)/2:f1}$, дисперсия средних $@{((m1-m2)/2)^2:f2}$.'
      - 'Итог: $@{(v1+v2)/2:f2}+@{((m1-m2)/2)^2:f2}=@{(v1+v2)/2+((m1-m2)/2)^2:f2}$.'
  p4:
    k: mc
    q: 'Что такое $E[X\mid Y]$?'
    a: 'Случайная величина, зависящая от $Y$'
    x: ['Число, равное $E[X]$', 'Вероятность события $X$ при $Y$']
  p5:
    k: mc
    lv: 2
    q: 'Что утверждает закон полного ожидания?'
    a: '$E\bigl[E[X\mid Y]\bigr]=E[X]$'
    x: ['$E[X\mid Y]=E[X]$ всегда', '$E[X\mid Y]=E[Y\mid X]$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: группа А — $30\%$ со средним $10$, группа Б — $70\%$ со средним $20$.'
    steps:
      - '$P(A)=0.3$, $P(B)=0.7$'
      - '$E[X\mid A]=10$, $E[X\mid B]=20$'
      - 'По закону полного ожидания $E[X]=0.3\cdot10+0.7\cdot20$'
      - 'Получаем $3+14=17$'
    bad:
      - {i: 3, t: 'Берём простое среднее: $E[X]=\frac{10+20}{2}$', e: pr.condexp.avg}
      - {i: 4, t: 'Получаем $3+14=18$'}
err: [pr.condexp.norm, pr.condexp.avg, pr.condexp.var]
sum:
  - 'Умею находить общее среднее по групповым средним с весами.'
  - 'Умею находить условное среднее по таблице, нормируя на вероятность условия.'
  - 'Умею применять закон полной дисперсии.'
