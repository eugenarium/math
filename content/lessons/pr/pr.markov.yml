id: pr.markov
int:
  - 'Погода: после ясного дня завтра ясно с вероятностью $0.9$, после дождливого — дождь с вероятностью $0.7$. Прогноз зависит только от сегодняшнего дня, а не от всей истории.'
  - {ask: 'Сегодня ясно: завтра ясно с вероятностью $0.9$, а после дождя — $0.3$. Какова вероятность ясной погоды послезавтра?', ans: 'Два пути: ясно—ясно—ясно ($0.9\cdot0.9=0.81$) и ясно—дождь—ясно ($0.1\cdot0.3=0.03$). Итого $0.84$.'}
  - 'Такая цепь задаётся матрицей переходов, сумма каждой строки равна $1$. За два шага вероятности перемножаются как матрицы, а в пределе устанавливается стационарное распределение.'
def:
  - {g: markov-chain}
ex:
  - {x: p3, seed: 3}
  - {x: p2, seed: 7}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [0.1, 0.2, 0.3], b: [0.2, 0.4]}
    tol: 0.002
    q: 'Цепь с двумя состояниями: из $1$ в $2$ с вероятностью $@{a:f1}$, из $2$ в $1$ с вероятностью $@{b:f1}$. Начало в состоянии $1$. Найди вероятность быть в состоянии $1$ через два шага.'
    a: (1-a)^2+a*b
    e: {pr.markov.mult: (1-a)^2}
    h: ['Два пути: $1\to1\to1$ и $1\to2\to1$.']
  p2:
    k: num
    v: {a: [0.1, 0.2, 0.3], b: [0.2, 0.4, 0.6]}
    c: ['a != b']
    tol: 0.002
    q: 'Из состояния $1$ в $2$ уходят с вероятностью $@{a:f1}$, из $2$ в $1$ — с вероятностью $@{b:f1}$. Найди стационарную вероятность состояния $1$.'
    a: b/(a+b)
    e: {pr.markov.stationary: 0.5}
    sol:
      - 'Условие стационарности для состояния $1$: $\pi_1\cdot@{a:f1}=\pi_2\cdot@{b:f1}$.'
      - 'С учётом $\pi_1+\pi_2=1$: $\pi_1=\frac{@{b:f1}}{@{a:f1}+@{b:f1}}$.'
      - 'Итог: $\pi_1=@{b/(a+b):f3}$.'
  p3:
    k: num
    lv: 2
    v: {a: [0.1, 0.2, 0.25, 0.5]}
    tol: 0.002
    q: 'Из состояния $1$ цепь уходит на каждом шаге с вероятностью $@{a:f2}$. Сколько шагов в среднем она в нём проводит до ухода?'
    a: 1/a
    e: {pr.markov.time: a}
    sol:
      - 'Число шагов до первого ухода — геометрическое с вероятностью успеха $@{a:f2}$.'
      - 'Среднее геометрического равно $\frac1p$.'
      - 'Итог: $\frac1{@{a:f2}}=@{1/a:f2}$.'
  p4:
    k: mc
    q: 'Какое условие верно для матрицы переходов $P$?'
    a: 'Сумма элементов каждой строки равна $1$'
    x: ['Сумма элементов каждого столбца равна $1$', 'Все элементы равны']
  p5:
    k: mc
    lv: 2
    q: 'Матрица переходов $P=\begin{pmatrix}0.9&0.1\\0.3&0.7\end{pmatrix}$. Каково стационарное распределение?'
    a: '$(0.75,\,0.25)$'
    e: {pr.markov.stationary: '$(0.5,\,0.5)$'}
    x: ['$(0.9,\,0.1)$']
    h: ['Проверь равенство $\pi P=\pi$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: цепь стартует в состоянии $1$, $P=\begin{pmatrix}0.9&0.1\\0.3&0.7\end{pmatrix}$. Найди $P(X_2=1)$.'
    steps:
      - 'С вероятностью $0.9$ цепь остаётся в $1$, с $0.1$ уходит в $2$'
      - 'В состояние $1$ на втором шаге ведут два пути: $1\to1\to1$ и $1\to2\to1$'
      - 'Вероятности путей: $0.9\cdot0.9=0.81$ и $0.1\cdot0.3=0.03$'
      - 'Складываем: $P(X_2=1)=0.81+0.03=0.84$'
    bad:
      - {i: 3, t: 'Вероятности путей: $0.9^2=0.81$ и $0.3^2=0.09$', e: pr.markov.mult}
      - {i: 4, t: 'Перемножаем: $0.81\cdot0.03\approx0.024$'}
err: [pr.markov.mult, pr.markov.stationary, pr.markov.time]
sum:
  - 'Умею находить вероятности перехода за два шага перемножением по путям.'
  - 'Умею находить стационарное распределение цепи с двумя состояниями.'
  - 'Умею находить среднее время пребывания в состоянии как $1/a$.'
