id: pr.lln
int:
  - 'Монета выпала орлом пять раз подряд. Многим кажется, что теперь решка «должна» выпасть чаще. Но монета не помнит. Что же тогда гарантирует закон больших чисел?'
  - {ask: 'После $1000$ бросков орлов $520$. После $100\,000$ бросков — $50\,200$. Доля стала ближе к $0.5$, а разность орлов и решек?', ans: 'Доля сходится: $0.52\to0.502$. Но разность выросла с $40$ до $400$. Закон больших чисел — про долю, а не про разность.'}
  - 'Среднее $\bar X_n$ имеет дисперсию $\frac{\sigma^2}{n}$, и по неравенству Чебышёва оно сжимается к $\mu$ при росте $n$.'
def:
  - {g: law-of-large-numbers}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {m: [2, 5, 10]}
    q: 'Независимые наблюдения имеют среднее $@m$. Найди математическое ожидание их выборочного среднего.'
    a: m
    tol: 0
    h: ['Ожидание среднего равно $\mu$ при любом $n$.']
  p2:
    k: num
    lv: 2
    v: {s2: [4, 9, 16], n: [4, 9, 16, 25]}
    q: 'Наблюдения независимы, дисперсия каждого $@s2$. Найди дисперсию среднего по $@n$ наблюдениям.'
    a: s2/n
    tol: 0.002
    h: ['$\operatorname{Var}(\bar X_n)=\frac{\sigma^2}{n}$.']
    sol:
      - 'Дисперсия суммы независимых равна $n\sigma^2=@{n*s2}$.'
      - 'Среднее — сумма, поделённая на $n$: дисперсия делится на $n^2$.'
      - 'Получим $\frac{@{n*s2}}{@{n^2}}=@{s2/n:f3}$.'
  p3:
    k: num
    lv: 2
    v: {s2: [4, 9], n: [100, 400], e: [0.5, 1]}
    q: 'Дисперсия наблюдения $@s2$, наблюдений $@n$. По неравенству Чебышёва оцени сверху $P(|\bar X_n-\mu|\ge@{e:f1})$.'
    a: s2/(n*e^2)
    tol: 0.002
    h: ['Подставь дисперсию среднего $\frac{\sigma^2}{n}$ в неравенство Чебышёва.']
    sol:
      - 'Дисперсия среднего: $\frac{@s2}{@n}=@{s2/n:f3}$.'
      - 'Чебышёв: $\frac{\operatorname{Var}}{\varepsilon^2}=\frac{@{s2/n:f3}}{@{e^2:f2}}$.'
      - 'Получим $@{s2/(n*e^2):f3}$.'
  p4:
    k: mc
    q: 'Орёл выпал $5$ раз подряд. Какова вероятность орла в следующем броске честной монеты?'
    a: '$0.5$'
    e: {pr.lln.gambler: 'Меньше $0.5$: «пора» выпасть решке'}
    x: ['Больше $0.5$: серия продолжится']
    h: ['Броски независимы.']
  p5:
    k: mc
    lv: 2
    q: 'Доля орлов приближается к $0.5$. Что можно сказать о разности числа орлов и числа решек?'
    a: 'Она может расти по модулю, хотя доля сходится к $0.5$'
    e: {pr.lln.abs: 'Она стремится к нулю по закону больших чисел'}
    x: ['Она всегда равна нулю']
    h: ['Сравни $40$ из $1000$ и $400$ из $100\,000$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: в $100$ бросках монеты выпало $60$ орлов. Что говорит закон больших чисел?'
    steps:
      - 'Доля орлов $\frac{60}{100}=0.6$'
      - 'При росте числа бросков доля стремится к $0.5$'
      - 'Это происходит за счёт роста $n$, а не «исправления» прошлого'
      - 'Вероятность орла в следующем броске по-прежнему $0.5$'
    bad:
      - {i: 3, t: 'Это происходит потому, что в следующих бросках решек выпадет больше', e: pr.lln.gambler}
      - {i: 4, t: 'Вероятность орла в следующем броске меньше $0.5$', e: pr.lln.gambler}
err: [pr.lln.gambler, pr.lln.abs]
sum:
  - 'Умею применять $E[\bar X_n]=\mu$ и $\operatorname{Var}(\bar X_n)=\frac{\sigma^2}{n}$.'
  - 'Умею применять неравенство Чебышёва к среднему.'
  - 'Отличаю закон больших чисел от «ошибки игрока».'
