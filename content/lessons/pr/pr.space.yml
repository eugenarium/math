id: pr.space
int:
  - 'Бросаем кубик. Исходов шесть: $1,\dots,6$. Событие — набор исходов, например «чётное» $=\{2, 4, 6\}$. Вероятность события описывает, насколько оно ожидаемо.'
  - {ask: 'Пусть $P(A)=0.7$. Чему равна вероятность того, что $A$ не произойдёт?', ans: '$0.3$: событие и его дополнение вместе дают достоверное событие с вероятностью $1$.'}
  - 'Для объединения событий нужна осторожность: если события пересекаются, общие исходы нельзя считать дважды.'
  - {ask: 'Чему равна $P(A\cup B)$ для несовместных событий $A$, $B$?', ans: '$P(A)+P(B)$: пересечение пусто, вычитать нечего.'}
  - {w: chance, exp: coin, cfg: {n: 3}, ev: 'heads >= 1', cap: 'Бросай монету три раза подряд и следи за частотой события «хотя бы один орёл»', ask: 'К какому числу приближается частота?', ans: 'К $\frac78=0.875$: дополнение — «три решки» с вероятностью $\frac18$.'}
def:
  - {g: probability-axioms}
  - 'Как решать. Выпиши исход и событие множеством. Используй $P(\bar A)=1-P(A)$ и $P(A\cup B)=P(A)+P(B)-P(A\cap B)$. Вероятность всегда от $0$ до $1$; для несовместных событий пересечение пусто.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {p: [0.2, 0.3, 0.6, 0.7]}
    q: 'Известно, что $P(A)=@{p:f1}$. Найди вероятность того, что $A$ не произойдёт.'
    a: 1-p
    tol: 0.002
    e: {pr.space.complement: 1/p}
    h: ['$P(\bar A)=1-P(A)$.']
  p2:
    k: num
    lv: 2
    v: {a: [0.4, 0.5, 0.6], b: [0.3, 0.4, 0.5], c: [0.1, 0.2]}
    q: 'Известно, что $P(A)=@{a:f1}$, $P(B)=@{b:f1}$ и $P(A\cap B)=@{c:f1}$. Найди $P(A\cup B)$.'
    a: a+b-c
    tol: 0.002
    e: {pr.space.union-sum: a+b}
    h: ['Общие исходы входят и в $P(A)$, и в $P(B)$.']
    sol:
      - 'Формула: $P(A\cup B)=P(A)+P(B)-P(A\cap B)$.'
      - 'Подставим: $@{a:f1}+@{b:f1}-@{c:f1}$.'
      - 'Получим $@{a+b-c:f1}$.'
  p3:
    k: num
    lv: 2
    v: {a: [0.4, 0.5, 0.6], b: [0.3, 0.4, 0.5], c: [0.1, 0.2]}
    q: 'Известно, что $P(A)=@{a:f1}$, $P(B)=@{b:f1}$ и $P(A\cap B)=@{c:f1}$. Найди вероятность того, что не произойдёт ни $A$, ни $B$.'
    a: 1-(a+b-c)
    tol: 0.002
    e: {pr.space.union-sum: 1-(a+b)}
    h: ['«Ни $A$, ни $B$» — дополнение к объединению.']
    sol:
      - 'Объединение: $P(A\cup B)=@{a:f1}+@{b:f1}-@{c:f1}=@{a+b-c:f1}$.'
      - 'Событие «ни $A$, ни $B$» — его дополнение.'
      - 'Вероятность $1-@{a+b-c:f1}=@{1-(a+b-c):f1}$.'
  p4:
    k: mc
    q: 'Бросают кубик. $A$ — «выпало чётное» $=\{2, 4, 6\}$, $B$ — «больше $4$» $=\{5, 6\}$. Чему равна $P(A\cup B)$?'
    a: '$\frac23$'
    e: {pr.space.union-sum: '$\frac56$'}
    x: ['$\frac12$']
    h: ['Выпиши исходы объединения: $\{2, 4, 5, 6\}$.']
  p5:
    k: mc
    lv: 2
    q: 'Какое из чисел не может быть вероятностью события?'
    a: '$1.2$'
    x: ['$0$', '$0.5$', '$1$']
    h: ['Вероятность лежит между $0$ и $1$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $P(A)=0.5$, $P(B)=0.4$, $P(A\cap B)=0.2$. Найди $P(A\cup B)$.'
    steps:
      - '$P(A\cup B)=P(A)+P(B)-P(A\cap B)$'
      - 'Подставим: $0.5+0.4-0.2$'
      - 'Получим $0.7$'
      - 'Вероятность объединения равна $0.7$'
    bad:
      - {i: 2, t: 'Подставим: $0.5+0.4$', e: pr.space.union-sum}
      - {i: 3, t: 'Получим $0.6$'}
  p7:
    k: sim
    lv: 2
    est: 1
    v: {n: [2, 3]}
    q: 'Подбрось монету @n @{n:w=раз,раза,раз} подряд не менее 300 раз по серии. Какая доля серий содержит хотя бы один орёл? Ответ дай десятичной дробью.'
    w: {w: chance, exp: coin, cfg: {n: n}, ev: 'heads >= 1'}
    a: 1-0.5^n
    tol: 0.06
    min: 300
err: [pr.space.union-sum, pr.space.complement]
sum:
  - 'Умею находить вероятность дополнения: $1-P(A)$.'
  - 'Умею находить вероятность объединения: вычитаю пересечение.'
  - 'Умею проверять, что вероятность лежит между $0$ и $1$.'
