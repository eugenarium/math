id: pr.joint
int:
  - 'Опрос: «Вы курите?» и «Вам больше $40$ лет?». Таблица показывает долю людей в каждой из четырёх комбинаций. Из неё можно узнать, сколько всего курящих (сумма строки) и какова доля курящих среди старших (условная).'
  - {ask: 'Доли: старше и курят $0.1$, старше и не курят $0.3$. Какова доля старших? Какова доля курящих среди старших?', ans: 'Старших $0.1+0.3=0.4$. Курящих среди них $\frac{0.1}{0.4}=0.25$.'}
  - 'Маргинальные вероятности — суммы строк и столбцов. Условные получаются делением ячейки на сумму её строки или столбца.'
  - {ask: 'Как получить $P(Y=1)$ из таблицы совместного распределения?', ans: 'Сложить все ячейки столбца $Y=1$ по значениям $X$.'}
def:
  - {g: joint-distribution}
  - 'Как решать. Построй таблицу. Маргинальная вероятность — сумма строки или столбца. Условная — ячейка, делённая на сумму её строки или столбца. Событие $X=x$ включает все значения $Y$.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [0.1, 0.2], b: [0.2, 0.3]}
    q: 'В таблице $P(X=1, Y=1)=@{a:f1}$ и $P(X=1, Y=2)=@{b:f1}$. Найди $P(X=1)$.'
    a: a+b
    tol: 0.002
    e: {pr.joint.marginal: a}
    h: ['Сложи ячейки строки $X=1$.']
  p2:
    k: num
    lv: 2
    v: {a: [0.1, 0.2], c: [0.1, 0.3]}
    q: 'В таблице $P(X=1, Y=1)=@{a:f1}$ и $P(X=2, Y=1)=@{c:f1}$. Найди $P(Y=1)$.'
    a: a+c
    tol: 0.002
    e: {pr.joint.marginal: a}
    h: ['Сложи ячейки столбца $Y=1$.']
    sol:
      - 'Событие $Y=1$ включает все значения $X$.'
      - 'Складываем ячейки столбца: $@{a:f1}+@{c:f1}$.'
      - 'Получим $@{a+c:f1}$.'
  p3:
    k: num
    lv: 2
    v: {a: [0.1, 0.2], b: [0.2, 0.3]}
    q: 'В таблице $P(X=1, Y=1)=@{a:f1}$ и $P(X=1, Y=2)=@{b:f1}$. Найди $P(Y=1\mid X=1)$.'
    a: a/(a+b)
    tol: 0.002
    e: {pr.joint.cond: a}
    h: ['Раздели ячейку на сумму строки.']
    sol:
      - 'Маргинальная вероятность: $P(X=1)=@{a:f1}+@{b:f1}=@{a+b:f1}$.'
      - 'Совместная: $P(X=1, Y=1)=@{a:f1}$.'
      - 'Условная $\frac{@{a:f1}}{@{a+b:f1}}=@{a/(a+b):f3}$.'
  p4:
    k: mc
    q: 'Как получить маргинальное распределение $X$ из таблицы совместного?'
    a: 'Просуммировать таблицу по значениям $Y$'
    e: {pr.joint.marginal: 'Взять одну ячейку строки'}
    x: ['Перемножить ячейки строки']
    h: ['Событие $X=x$ включает любые значения $Y$.']
  p5:
    k: num
    lv: 2
    v: {a: [0.1, 0.2], b: [0.2, 0.3], c: [0.1, 0.2]}
    q: 'В таблице $P(X=1, Y=1)=@{a:f1}$, $P(X=1, Y=2)=@{b:f1}$, $P(X=2, Y=1)=@{c:f1}$. Найди $P(X=1, Y=1)-P(X=1)P(Y=1)$.'
    a: a-(a+b)*(a+c)
    tol: 0.002
    h: ['Маргинальные вероятности — суммы строки и столбца.']
    sol:
      - '$P(X=1)=@{a:f1}+@{b:f1}=@{a+b:f1}$, $P(Y=1)=@{a:f1}+@{c:f1}=@{a+c:f1}$.'
      - 'Произведение: $@{a+b:f1}\cdot@{a+c:f1}=@{(a+b)*(a+c):f3}$.'
      - 'Разность $@{a:f1}-@{(a+b)*(a+c):f3}=@{a-(a+b)*(a+c):f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $P(X=1, Y=1)=0.1$, $P(X=1, Y=2)=0.3$. Найди $P(Y=1\mid X=1)$.'
    steps:
      - '$P(X=1)=0.1+0.3=0.4$'
      - 'Совместная: $P(X=1, Y=1)=0.1$'
      - '$P(Y=1\mid X=1)=\frac{0.1}{0.4}$'
      - 'Ответ: $0.25$'
    bad:
      - {i: 3, t: '$P(Y=1\mid X=1)=\frac{0.1}{1}$', e: pr.joint.cond}
      - {i: 1, t: '$P(X=1)=0.1$', e: pr.joint.marginal}
err: [pr.joint.marginal, pr.joint.cond]
sum:
  - 'Умею находить маргинальные вероятности: сумма строки или столбца.'
  - 'Умею находить условные вероятности: ячейка делится на маргинальную.'
