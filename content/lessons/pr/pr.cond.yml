id: pr.cond
int:
  - 'В классе $20$ человек, $8$ играют в шахматы. Среди $12$ девочек шахматисток $3$. Какова вероятность, что случайно выбранная девочка играет в шахматы? Условие «это девочка» сузило выбор.'
  - {ask: 'Какова вероятность выбрать шахматиста среди всех? Среди девочек? Почему числа разные?', ans: 'Среди всех $\frac{8}{20}=0{,}4$, среди девочек $\frac{3}{12}=0{,}25$. Условие сужает пространство исходов до девочек.'}
  - 'Условная вероятность — это вероятность внутри нового пространства. Знаменатель равен вероятности условия.'
def:
  - {g: conditional-probability}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {c: [0.1, 0.2, 0.3], b: [0.5, 0.6]}
    q: 'Известно, что $P(A\cap B)=@{c:f1}$ и $P(B)=@{b:f1}$. Найди $P(A\mid B)$.'
    a: c/b
    tol: 0.002
    h: ['$P(A\mid B)=\frac{P(A\cap B)}{P(B)}$.']
  p2:
    k: num
    lv: 2
    v: {a: [0.4, 0.5, 0.6], b: [0.3, 0.5], c: [0.1, 0.2]}
    c: ['a != b']
    q: 'Известно, что $P(A)=@{a:f1}$, $P(B)=@{b:f1}$ и $P(A\cap B)=@{c:f1}$. Найди $P(A\mid B)$.'
    a: c/b
    tol: 0.002
    e: {pr.cond.reverse: c/a}
    h: ['В знаменателе вероятность условия.']
    sol:
      - 'Условие — событие $B$, его вероятность $@{b:f1}$.'
      - 'Формула: $P(A\mid B)=\frac{P(A\cap B)}{P(B)}$.'
      - 'Получим $\frac{@{c:f1}}{@{b:f1}}=@{c/b:f3}$.'
  p3:
    k: num
    lv: 2
    v: {r: 3..6, w: 3..6}
    q: 'В урне $@r$ красных и $@w$ белых шаров. Вытащили красный и не вернули. Найди вероятность того, что второй шар тоже красный.'
    a: (r-1)/(r+w-1)
    tol: 0.002
    e: {pr.cond.shrink: r/(r+w)}
    h: ['После первого шара состав урны изменился.']
    sol:
      - 'После изъятия красного осталось красных: $@{r-1}$.'
      - 'Всего шаров осталось: $@{r+w-1}$.'
      - 'Вероятность $\frac{@{r-1}}{@{r+w-1}}=@{(r-1)/(r+w-1):f3}$.'
  p4:
    k: mc
    q: 'Верно ли, что $P(A\mid B)=P(B\mid A)$?'
    a: 'Нет: в общем случае они различаются'
    e: {pr.cond.reverse: 'Да: условие и событие можно поменять местами'}
    x: ['Верно только для несовместных событий']
    h: ['Сравни знаменатели: $P(B)$ и $P(A)$.']
  p5:
    k: num
    lv: 2
    v: {b: [0.4, 0.5, 0.6], q: [0.2, 0.5]}
    q: 'Известно, что $P(B)=@{b:f1}$ и $P(A\mid B)=@{q:f1}$. Найди $P(A\cap B)$.'
    a: b*q
    tol: 0.002
    h: ['$P(A\cap B)=P(B)\,P(A\mid B)$.']
    sol:
      - 'Из определения: $P(A\cap B)=P(B)P(A\mid B)$.'
      - 'Подставим: $@{b:f1}\cdot@{q:f1}$.'
      - 'Получим $@{b*q:f2}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $P(A\cap B)=0{,}2$ и $P(B)=0{,}5$. Найди $P(A\mid B)$.'
    steps:
      - '$P(A\mid B)=\frac{P(A\cap B)}{P(B)}$'
      - 'Подставим: $\frac{0{,}2}{0{,}5}$'
      - 'Получим $0{,}4$'
      - 'Вероятность $A$ при условии $B$ равна $0{,}4$'
    bad:
      - {i: 1, t: '$P(A\mid B)=\frac{P(A\cap B)}{P(A)}$', e: pr.cond.reverse}
      - {i: 3, t: 'Получим $0{,}1$'}
err: [pr.cond.reverse, pr.cond.shrink]
sum:
  - 'Умею находить $P(A\mid B)=\frac{P(A\cap B)}{P(B)}$.'
  - 'Знаю, что в общем случае $P(A\mid B)\ne P(B\mid A)$.'
  - 'Пересчитываю состав урны при выборе без возвращения.'
