id: pr.cont
int:
  - 'Стрелка крутится и останавливается на случайном угле от $0$ до $1$ оборота. Вероятность остановиться ровно на $0.5$ равна нулю: точка не имеет длины. А вероятность попасть в интервал — уже положительная.'
  - {ask: 'Чему равна вероятность попасть в отрезок длины $0.2$, если все точки равновозможны на отрезке $[0, 1]$?', ans: '$0.2$: площадь прямоугольника высотой $1$ и шириной $0.2$. Высота — это плотность.'}
  - 'Плотность $f(x)$ — не вероятность, а вероятность на единицу длины. Вероятность — интеграл плотности по интервалу.'
def:
  - {g: probability-density}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {L: [2, 4, 5, 10]}
    q: 'Плотность постоянна и равна $c$ на отрезке $[0, @L]$ и нулю вне него. Найди $c$.'
    a: 1/L
    tol: 0.002
    e: {pr.cont.density-prob: 1}
    h: ['Площадь под плотностью равна $1$.']
  p2:
    k: num
    lv: 2
    v: {a: [0, 0.2, 0.4], b: [0.6, 0.8, 1]}
    q: 'Плотность $f(x)=2x$ на $[0, 1]$. Найди $P(@{a:f1}<X<@{b:f1})$.'
    a: b^2-a^2
    tol: 0.002
    e: {pr.cont.density-prob: 2*b}
    h: ['Вероятность — интеграл $\int_a^b2x\,dx$.']
    sol:
      - 'Первообразная $2x$ равна $x^2$.'
      - '$P=@{b:f1}^2-@{a:f1}^2$.'
      - 'Получим $@{b^2-a^2:f2}$.'
  p3:
    k: num
    lv: 2
    v: {k: 2..4, a: [0.2, 0.4], b: [0.6, 0.8]}
    q: 'Функция распределения $F(x)=x^@k$ на $[0, 1]$. Найди $P(@{a:f1}<X<@{b:f1})$.'
    a: b^k-a^k
    tol: 0.002
    h: ['$P(a<X<b)=F(b)-F(a)$.']
    sol:
      - 'Вероятность интервала — разность значений $F$ на концах.'
      - '$F(@{b:f1})=@{b^k:f3}$ и $F(@{a:f1})=@{a^k:f3}$.'
      - 'Разность $@{b^k-a^k:f3}$.'
  p4:
    k: mc
    q: 'Чему равна $P(X=0.5)$ для непрерывной случайной величины?'
    a: '$0$'
    e: {pr.cont.point: 'Положительному числу $f(0.5)$'}
    x: ['$1$']
    h: ['Площадь над одной точкой равна нулю.']
  p5:
    k: mc
    lv: 2
    q: 'Может ли плотность вероятности принимать значения больше $1$?'
    a: 'Да: например, $f(x)=2$ на $[0, 0.5]$'
    e: {pr.cont.density-prob: 'Нет: плотность — это вероятность'}
    x: ['Только на отрезках длины больше $1$']
    h: ['Посчитай площадь для $f=2$ на отрезке длины $0.5$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: плотность $f(x)=2x$ на $[0, 1]$. Найди $P(X<0.5)$.'
    steps:
      - 'Вероятность — интеграл плотности: $P(X<0.5)=\int_0^{0.5}2x\,dx$'
      - 'Первообразная $2x$ равна $x^2$'
      - '$P=0.5^2-0=0.25$'
      - 'Ответ: $0.25$'
    bad:
      - {i: 1, t: 'Вероятность — значение плотности: $P(X<0.5)=f(0.5)=1$', e: pr.cont.density-prob}
      - {i: 3, t: '$P=2\cdot0.5=1$', e: pr.cont.density-prob}
err: [pr.cont.density-prob, pr.cont.point]
sum:
  - 'Умею находить вероятность интервала как интеграл плотности.'
  - 'Отличаю плотность от вероятности: плотность может быть больше $1$.'
  - 'Умею объяснять, почему вероятность отдельной точки равна нулю.'
