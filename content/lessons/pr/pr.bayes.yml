id: pr.bayes
int:
  - 'Тест на редкую болезнь выявляет $90\%$ больных, но даёт $10\%$ ложных тревог. Анализ положительный. Какова вероятность, что вы больны? Часто отвечают «$90\%$», и ошибаются.'
  - {ask: 'Болеет $1$ из $100$. Из $1000$ человек сколько больных дадут положительный тест, а сколько здоровых?', ans: 'Больных $10$, положительных среди них $9$. Здоровых $990$, ложных тревог $99$. Значит, среди положительных больны только $\frac{9}{108}\approx8\%$.'}
  - 'Формула Байеса пересчитывает вероятность гипотезы с учётом базовой частоты. Знаменатель находят по формуле полной вероятности.'
def:
  - {g: total-probability}
  - {g: bayes-formula}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {q1: [0.2, 0.4, 0.6], q2: [0.1, 0.3, 0.5]}
    q: 'Две урны выбирают с равными шансами. Красный шар в первой выпадает с вероятностью $@{q1:f1}$, во второй — $@{q2:f1}$. Найди вероятность красного шара.'
    a: (q1+q2)/2
    tol: 0.002
    h: ['$P(B)=\frac12 q_1+\frac12 q_2$.']
  p2:
    k: num
    lv: 2
    v: {p1: [0.2, 0.3, 0.7], q1: [0.2, 0.4, 0.6], q2: [0.1, 0.3, 0.5]}
    c: ['abs(p1*q1+(1-p1)*q2-(q1+q2)/2) > 0.02']
    q: 'Первую урну выбирают с вероятностью $@{p1:f1}$, вторую — с $@{1-p1:f1}$. Красный шар в первой выпадает с вероятностью $@{q1:f1}$, во второй — $@{q2:f1}$. Найди вероятность красного шара.'
    a: p1*q1+(1-p1)*q2
    tol: 0.002
    e: {pr.bayes.total: (q1+q2)/2}
    h: ['Умножь каждую условную вероятность на вероятность своей урны.']
    sol:
      - 'Первая урна: $@{p1:f1}\cdot@{q1:f1}=@{p1*q1:f2}$.'
      - 'Вторая урна: $@{1-p1:f1}\cdot@{q2:f1}=@{(1-p1)*q2:f2}$.'
      - 'Сумма: $@{p1*q1+(1-p1)*q2:f2}$.'
  p3:
    k: num
    lv: 2
    v: {pv: [0.01, 0.02, 0.05], s: [0.9, 0.95], f: [0.05, 0.1]}
    q: 'Болезнь встречается у $@{pv:pc}$ людей. Тест положителен у $@{s:pc}$ больных и у $@{f:pc}$ здоровых. Результат положительный. Найди вероятность болезни.'
    a: pv*s/(pv*s+(1-pv)*f)
    tol: 0.002
    e: {pr.bayes.base: s}
    h: ['Найди долю больных среди всех положительных результатов.']
    sol:
      - 'Положительный и больной: $@{pv:f2}\cdot@{s:f2}=@{pv*s:f4}$.'
      - 'Положительный и здоровый: $@{1-pv:f2}\cdot@{f:f2}=@{(1-pv)*f:f4}$.'
      - 'Вероятность болезни $\frac{@{pv*s:f4}}{@{pv*s+(1-pv)*f:f4}}=@{pv*s/(pv*s+(1-pv)*f):f3}$.'
  p4:
    k: mc
    q: 'Тест на редкую болезнь точен на $95\%$, результат положительный. Почему вероятность болезни может быть мала?'
    a: 'Болеют немногие, и ложные тревоги здоровых перевешивают истинные'
    e: {pr.bayes.base: 'Вероятность болезни равна $95\%$, как точность теста'}
    x: ['Тест на самом деле не работает']
    h: ['Сравни число больных и число здоровых с ложным результатом.']
  p5:
    k: num
    lv: 2
    v: {p1: [0.3, 0.4, 0.6], q1: [0.2, 0.5, 0.6], q2: [0.1, 0.3]}
    q: 'Первую урну выбирают с вероятностью $@{p1:f1}$, вторую — с $@{1-p1:f1}$. Красный шар выпадает с вероятностями $@{q1:f1}$ и $@{q2:f1}$. Вытащили красный. Найди вероятность, что выбрана первая урна.'
    a: p1*q1/(p1*q1+(1-p1)*q2)
    tol: 0.002
    e: {pr.bayes.base: q1}
    h: ['Формула Байеса: вклад первой урны делим на полную вероятность красного.']
    sol:
      - 'Красный из первой: $@{p1:f1}\cdot@{q1:f1}=@{p1*q1:f2}$.'
      - 'Красный из второй: $@{1-p1:f1}\cdot@{q2:f1}=@{(1-p1)*q2:f2}$.'
      - 'Всего красных: $@{p1*q1+(1-p1)*q2:f2}$. Доля первой урны: $@{p1*q1/(p1*q1+(1-p1)*q2):f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: болеет $1\%$, тест положителен у $90\%$ больных и у $10\%$ здоровых. Какова вероятность болезни при положительном тесте?'
    steps:
      - 'Из $1000$ человек больных $10$, здоровых $990$'
      - 'Положительных среди больных: $0{,}9\cdot10=9$'
      - 'Положительных среди здоровых: $0{,}1\cdot990=99$'
      - 'Доля больных среди положительных: $\frac{9}{9+99}\approx0{,}083$'
    bad:
      - {i: 4, t: 'Доля больных среди положительных равна $0{,}9$', e: pr.bayes.base}
      - {i: 3, t: 'Положительных среди здоровых: $0{,}1\cdot990=9$'}
err: [pr.bayes.base, pr.bayes.total]
sum:
  - 'Умею применять формулу полной вероятности с весами гипотез.'
  - 'Умею применять формулу Байеса с учётом базовой частоты.'
  - 'Помню, что вероятность болезни при положительном тесте не равна чувствительности теста.'
