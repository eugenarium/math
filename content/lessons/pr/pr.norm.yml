id: pr.norm
int:
  - 'Рост взрослых людей примерно нормален: большинство около среднего, крайние значения редки. Сравнить рост $190$ см у мужчин и $180$ см у женщин можно, если измерить, на сколько «типичных отклонений» каждый выше среднего.'
  - {ask: 'Средний рост $170$ см, стандартное отклонение $10$ см. На сколько стандартных отклонений выше среднего человек ростом $190$ см?', ans: 'На $2$: $\frac{190-170}{10}=2$. Это и есть $z$-оценка.'}
  - 'Стандартизация $z=\frac{x-\mu}{\sigma}$ превращает любое нормальное распределение в стандартное. Правило $68$–$95$–$99.7$ даёт вероятности без таблиц.'
def:
  - {g: standard-normal}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {mu: [50, 100], s: [5, 10], k: [-2, -1, 1, 2], xv: '=mu+k*s'}
    q: 'Величина нормальна со средним $@mu$ и стандартным отклонением $@s$. Найди $z$-оценку значения $@xv$.'
    a: k
    tol: 0
    e: {pr.norm.var: k/s}
    h: ['$z=\frac{x-\mu}{\sigma}$.']
  p2:
    k: num
    lv: 2
    v: {mu: [50, 100], d: [4, 9, 16, 25], k: [-2, -1, 1, 2], xv: '=mu+k*sqrt(d)'}
    q: 'Величина $X\sim N(@mu,\ @d)$, где второе число — дисперсия. Найди $z$-оценку значения $@xv$.'
    a: k
    tol: 0
    e: {pr.norm.var: k/sqrt(d)}
    h: ['Стандартное отклонение равно корню из дисперсии.']
    sol:
      - 'Стандартное отклонение $\sigma=\sqrt{@d}=@{sqrt(d)}$.'
      - 'Отклонение от среднего: $@xv-@mu=@{xv-mu}$.'
      - '$z=\frac{@{xv-mu}}{@{sqrt(d)}}=@k$.'
  p3:
    k: num
    lv: 2
    v: {p: [0.84, 0.9, 0.95, 0.98]}
    q: 'Для стандартной нормальной $Z$ и некоторого $z$ известно $P(Z<z)=@{p:f2}$. Найди $P(Z>z)$.'
    a: 1-p
    tol: 0.002
    h: ['События $Z<z$ и $Z>z$ дополняют друг друга.']
    sol:
      - 'Событие $Z>z$ — дополнение к $Z<z$.'
      - 'Вероятности в сумме дают $1$.'
      - 'Получим $1-@{p:f2}=@{1-p:f2}$.'
  p4:
    k: mc
    q: 'Какая доля нормальных значений лежит в пределах $2\sigma$ от среднего?'
    a: 'Около $95\%$'
    x: ['Около $68\%$', 'Около $99.7\%$']
    h: ['Вспомни правило $68$–$95$–$99.7$.']
  p5:
    k: num
    lv: 2
    v: {k: [1, 2, 3], c: '=k==1 ? 0.68 : (k==2 ? 0.95 : 0.997)'}
    q: 'В пределах $@{k}\sigma$ от среднего лежит доля $@{c:f3}$ нормальных значений. Найди долю значений, превышающих $\mu+@{k}\sigma$.'
    a: (1-c)/2
    tol: 0.0005
    e: {pr.norm.tail: 1-c}
    h: ['Вне границ два симметричных хвоста.']
    sol:
      - 'Вне границ лежит доля $1-@{c:f3}=@{1-c:f3}$.'
      - 'Она делится между двумя симметричными хвостами.'
      - 'Правый хвост $@{(1-c)/2:f4}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $X\sim N(100, 25)$, где $25$ — дисперсия. Найди $z$-оценку значения $110$.'
    steps:
      - 'Стандартное отклонение $\sigma=\sqrt{25}=5$'
      - '$z=\frac{x-\mu}{\sigma}=\frac{110-100}{5}$'
      - '$z=2$'
      - 'Значение $110$ на $2$ стандартных отклонения выше среднего'
    bad:
      - {i: 2, t: '$z=\frac{x-\mu}{\sigma}=\frac{110-100}{25}$', e: pr.norm.var}
      - {i: 3, t: '$z=0.4$'}
err: [pr.norm.var, pr.norm.tail]
sum:
  - 'Умею стандартизировать значение: $z=\frac{x-\mu}{\sigma}$, где $\sigma$ — корень из дисперсии.'
  - 'Знаю правило $68$–$95$–$99.7$ и учитываю два хвоста.'
  - 'Умею находить $P(Z>z)$ через дополнение.'
