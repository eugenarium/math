id: pr.mvn
int:
  - 'Рост и вес людей образуют облако в форме наклонённого эллипса: чем выше, тем тяжелее. Такое облако описывает двумерное нормальное распределение: средние, разброс по каждой оси и наклон.'
  - {ask: 'У двух величин дисперсии $4$ и $9$, ковариация $3$. Чему равна корреляция?', ans: '$\rho=\frac{3}{2\cdot3}=0.5$: ковариацию делят на произведение стандартных отклонений $2$ и $3$.'}
  - 'Сумма совместно нормальных величин нормальна, а дисперсия учитывает ковариацию. Для совместно нормальных величин нулевая ковариация означает независимость.'
def:
  - {g: multivariate-normal}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {c: [-4, -2, 2, 4]}
    tol: 0.002
    q: 'У $X$ и $Y$ матрица ковариаций $\begin{pmatrix}4&@c\\@c&16\end{pmatrix}$. Найди корреляцию $\rho$.'
    a: c/8
    e: {pr.mvn.rho: c}
    h: ['Стандартные отклонения $\sigma_X=2$ и $\sigma_Y=4$.']
  p2:
    k: num
    fast: 1
    v: {sx2: [4, 9], sy2: [4, 9, 16], c: [-2, 1, 2, 3]}
    q: 'Дисперсии $X$ и $Y$ равны $@sx2$ и $@sy2$, ковариация $@c$. Найди $\mathrm{Var}(X+Y)$.'
    a: sx2+sy2+2*c
    e: {pr.mvn.cov-var: sx2+sy2}
    h: ['Добавь удвоенную ковариацию.']
  p3:
    k: num
    lv: 2
    v: {k: 2..3, sx2: [4, 9], sy2: [4, 9, 16], c: [-2, 1, 2, 3]}
    q: 'Дисперсии $X$ и $Y$ равны $@sx2$ и $@sy2$, ковариация $@c$. Найди $\mathrm{Var}(@{k}X-Y)$.'
    a: k^2*sx2+sy2-2*k*c
    e: {pr.mvn.cov-var: k^2*sx2+sy2}
    sol:
      - 'Квадраты коэффициентов: $@{k^2}\cdot@sx2+1\cdot@sy2=@{k^2*sx2+sy2}$.'
      - 'Ковариационное слагаемое: $2\cdot@k\cdot(-1)\cdot@c=@{-2*k*c}$.'
      - 'Итог: $@{k^2*sx2+sy2}@{-2*k*c:s}=@{k^2*sx2+sy2-2*k*c}$.'
  p4:
    k: mc
    q: 'Пара $(X,Y)$ совместно нормальна и $\mathrm{Cov}(X,Y)=0$. Что верно?'
    a: '$X$ и $Y$ независимы'
    e: {pr.mvn.uncorr: 'Независимость не следует: некоррелированность её не гарантирует'}
    x: ['$X$ и $Y$ равны']
  p5:
    k: mc
    lv: 2
    q: 'Каждая из величин $X$ и $Y$ нормальна. Следует ли, что пара $(X,Y)$ совместно нормальна?'
    a: 'Нет: совместное распределение может быть ненормальным'
    x: ['Да: нормальности маргинальных достаточно', 'Да, если $X$ и $Y$ коррелируют']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\mathrm{Var}X=4$, $\mathrm{Var}Y=9$, $\mathrm{Cov}(X,Y)=2$. Что известно про $X+Y$?'
    steps:
      - '$\mathrm{Var}X=4$, $\mathrm{Var}Y=9$, $\mathrm{Cov}(X,Y)=2$'
      - '$\mathrm{Var}(X+Y)=4+9+2\cdot2=17$'
      - 'Сумма совместно нормальных величин нормальна: $\mathrm{Var}(X+Y)=17$'
      - 'Стандартное отклонение суммы $\sqrt{17}\approx4.12$'
    bad:
      - {i: 2, t: '$\mathrm{Var}(X+Y)=4+9=13$', e: pr.mvn.cov-var}
      - {i: 4, t: 'Стандартное отклонение суммы равно $17$'}
err: [pr.mvn.uncorr, pr.mvn.cov-var, pr.mvn.rho]
sum:
  - 'Умею находить корреляцию по матрице ковариаций.'
  - 'Умею находить дисперсию линейной комбинации с учётом ковариации.'
  - 'Умею применять равенство «некоррелированы — независимы» для совместно нормальных величин.'
