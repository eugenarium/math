id: pr.classic
int:
  - 'Монету бросают дважды. Исходы: ОО, ОР, РО, РР. Если монета честная, каждый исход имеет вероятность $\frac14$, а вероятность «ровно один орёл» равна $\frac24$.'
  - {ask: 'Бросили два кубика. Сумма $7$ или сумма $12$ — что вероятнее?', ans: 'Сумма $7$: она получается шестью парами из $36$, а сумма $12$ — только парой $(6, 6)$.'}
  - 'Формула «доля благоприятных» работает только для равновероятных исходов. Сначала нужно выбрать такое пространство, где они равновероятны.'
  - {ask: 'Какова вероятность выпадения суммы $7$ на двух кубиках?', ans: '$\frac6{36}=\frac16$: шесть пар из $36$.'}
  - {w: chance, exp: dice, cfg: {n: 2}, ev: 'sum == 7', cap: 'Бросай два кубика и следи за частотой суммы $7$', ask: 'К какому числу приближается частота?', ans: 'К $\frac16\approx0.167$: шесть пар из $36$.'}
def:
  - {g: classical-probability}
  - 'Как решать. Опиши исходы и убедись, что они равновероятны. Посчитай благоприятные и все исходы: $P=\frac mn$. Для двух кубиков всего $36$ исходов. Если исходы неравновероятны, формула не работает.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {m: 1..9}
    q: 'В коробке $10$ карточек, красных среди них $@m$. Найди вероятность вытащить красную.'
    a: m/10
    tol: 0.002
    h: ['Благоприятных $@m$ из $10$.']
  p2:
    k: num
    lv: 2
    v: {s: 3..7}
    q: 'Бросают два честных кубика. Найди вероятность того, что сумма очков равна $@s$.'
    a: (s-1)/36
    tol: 0.002
    e: {pr.classic.unequal: 1/11}
    h: ['Равновероятны пары (первый кубик, второй кубик), всего $36$.']
    sol:
      - 'Всего пар $36$, все равновероятны.'
      - 'Сумма $@s$: пары $(1, @{s-1}), \dots, (@{s-1}, 1)$, их $@{s-1}$.'
      - 'Вероятность $\frac{@{s-1}}{36}=@{(s-1)/36:f3}$.'
  p3:
    k: num
    lv: 2
    v: {n: 6..10, k: 3..4}
    q: 'В урне $@n$ шаров, из них $@k$ красных. Вытаскивают два шара сразу. Найди вероятность того, что оба красные.'
    a: C(k,2)/C(n,2)
    tol: 0.002
    e: {pr.classic.order: 'A(k,2)/C(n,2)'}
    h: ['Выбери один способ счёта: пары без порядка.']
    sol:
      - 'Всех пар шаров: $C_@n^2=@{C(n,2)}$.'
      - 'Благоприятных пар красных: $C_@k^2=@{C(k,2)}$.'
      - 'Вероятность $\frac{@{C(k,2)}}{@{C(n,2)}}=@{C(k,2)/C(n,2):f3}$.'
  p4:
    k: mc
    q: 'Сумма на двух кубиках: события «сумма $7$» и «сумма $12$» равновероятны?'
    a: 'Нет: $7$ получается шестью способами, $12$ — одним'
    e: {pr.classic.unequal: 'Да: каждая сумма от $2$ до $12$ равновероятна'}
    x: ['Нет: сумма $12$ вероятнее']
    h: ['Выпиши пары для каждой суммы.']
  p5:
    k: num
    lv: 2
    v: {m: 3..5, n: 3..5}
    q: 'В группе $@m$ @{m:w=девочка,девочки,девочек} и $@n$ @{n:w=мальчик,мальчика,мальчиков}. Выбирают двух человек наугад. Найди вероятность того, что это девочка и мальчик.'
    a: m*n/C(m+n,2)
    tol: 0.002
    e: {pr.classic.order: '2*m*n/C(m+n,2)'}
    h: ['Пары без порядка: девочка и мальчик $@m\cdot@n$ способами.']
    sol:
      - 'Всех пар: $C_@{m+n}^2=@{C(m+n,2)}$.'
      - 'Пар «девочка и мальчик»: $@m\cdot@n=@{m*n}$.'
      - 'Вероятность $\frac{@{m*n}}{@{C(m+n,2)}}=@{m*n/C(m+n,2):f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: найди вероятность двух орлов при двух бросках честной монеты.'
    steps:
      - 'Равновероятные исходы: ОО, ОР, РО, РР'
      - 'Благоприятный исход один: ОО'
      - 'Вероятность $\frac14$'
    bad:
      - {i: 3, t: 'Исходов три (ноль, один или два орла), вероятность $\frac13$', e: pr.classic.unequal}
      - {i: 2, t: 'Благоприятных исходов два: ОО и ОР'}
  p7:
    k: sim
    lv: 2
    est: 1
    q: 'Брось два кубика не менее 500 раз. Какая доля опытов даёт сумму $7$? Ответ дай десятичной дробью.'
    w: {w: chance, exp: dice, cfg: {n: 2}, ev: 'sum == 7'}
    a: 1/6
    tol: 0.05
    min: 500
err: [pr.classic.unequal, pr.classic.order]
sum:
  - 'Умею считать вероятность как долю благоприятных исходов среди равновероятных.'
  - 'Умею выбирать равновероятные исходы: пары на кубиках, а не суммы.'
  - 'Умею считать числитель и знаменатель одним способом: с порядком или без.'
