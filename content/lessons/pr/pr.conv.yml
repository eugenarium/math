id: pr.conv
int:
  - 'Закон больших чисел и центральная предельная теорема — оба о «приближении», но приближаются разные вещи. В ЗБЧ среднее приближается к числу, в ЦПТ распределение — к колоколу.'
  - {ask: 'Что приближается к $\mu$ при росте $n$: выборочное среднее $\bar X_n$ или его распределение?', ans: 'Выборочное среднее: по вероятности. А распределение стандартизованной суммы приближается к нормальному — по распределению.'}
  - {ask: 'Какая сходимость сильнее: по вероятности или по распределению?', ans: 'По вероятности: из неё следует сходимость по распределению.'}
def:
  - {g: convergence-types}
  - 'Как решать. Спроси, что именно сходится: значения (по вероятности) или функции распределения (по распределению). Из первого следует второе, обратное неверно. ЗБЧ — по вероятности, ЦПТ — по распределению.'
ex:
  - {x: p3, seed: 1}
  - {x: p1, seed: 5}
pr:
  p1:
    k: mc
    fast: 1
    q: 'Закон больших чисел говорит, что выборочное среднее $\bar X_n$ сходится к $\mu$'
    a: 'по вероятности'
    e: {pr.conv.exact: 'в том смысле, что $\bar X_n$ становится равным $\mu$'}
    x: ['по распределению к нормальному закону']
    sol:
      - 'ЗБЧ: $P(|\bar X_n-\mu|>\varepsilon)\to0$ при любом $\varepsilon$.'
      - 'Это определение сходимости по вероятности.'
      - 'Итог: по вероятности.'
  p2:
    k: mc
    q: 'Какое утверждение о видах сходимости верно?'
    a: 'Из сходимости по вероятности следует сходимость по распределению'
    e: {pr.conv.dist-prob: 'Из сходимости по распределению следует сходимость по вероятности'}
    x: ['Эти виды сходимости равносильны']
  p3:
    k: mc
    lv: 2
    q: '$Y\sim N(0,1)$, $X_n=-Y$ при всех $n$. Как $X_n$ сходится к $Y$?'
    a: 'По распределению, но не по вероятности'
    e: {pr.conv.dist-prob: 'И по распределению, и по вероятности'}
    x: ['Ни по распределению, ни по вероятности']
    h: ['У $-Y$ то же распределение, что у $Y$. Чему равно $|X_n-Y|$?']
    sol:
      - 'У $X_n=-Y$ то же распределение $N(0,1)$, что у $Y$, поэтому сходимость по распределению есть.'
      - 'Но $|X_n-Y|=2|Y|$ не зависит от $n$ и не стремится к нулю.'
      - 'Итог: по распределению да, по вероятности нет.'
  p4:
    k: mc
    lv: 2
    q: 'Какую сходимость описывает центральная предельная теорема?'
    a: 'Сходимость по распределению стандартизованной суммы к $N(0,1)$'
    e: {pr.conv.clt: 'Сходимость по вероятности суммы к нормальной величине'}
    x: ['Сходимость выборочного среднего к $\mu$']
  p5:
    k: spot
    lv: 2
    q: 'Найди ошибку в выводе закона больших чисел из неравенства Чебышёва.'
    steps:
      - 'Пусть $\mathrm{Var}X_i=\sigma^2$, тогда $\mathrm{Var}\,\bar X_n=\frac{\sigma^2}{n}$'
      - 'Неравенство Чебышёва: $P(|\bar X_n-\mu|\ge\varepsilon)\le\frac{\sigma^2}{n\varepsilon^2}$'
      - 'При $n\to\infty$ правая часть стремится к нулю'
      - 'Значит, $\bar X_n\to\mu$ по вероятности'
    bad:
      - {i: 4, t: 'Значит, $\bar X_n=\mu$ при всех больших $n$', e: pr.conv.exact}
      - {i: 1, t: 'Пусть $\mathrm{Var}X_i=\sigma^2$, тогда $\mathrm{Var}\,\bar X_n=\sigma^2n$'}
err: [pr.conv.dist-prob, pr.conv.clt, pr.conv.exact]
sum:
  - 'Отличаю сходимость по вероятности от сходимости по распределению.'
  - 'Умею приводить пример, где сходимость по распределению есть, а по вероятности нет.'
  - 'Умею объяснять, какую сходимость описывают ЗБЧ и ЦПТ.'
