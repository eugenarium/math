id: pr.rv
int:
  - 'Бросаем кубик и смотрим на число очков. Значение зависит от случая, а у каждого значения есть вероятность. Такая величина — случайная; её задают таблицей.'
  - {ask: 'У величины значения $1, 2, 3$ с вероятностями $0.2$, $0.5$ и неизвестной $p$. Чему равна $p$?', ans: '$0.3$: вероятности всех значений дают в сумме $1$.'}
  - 'Часто нужна не вероятность одного значения, а вероятность «не больше $k$»: это сумма вероятностей всех подходящих значений.'
def:
  - {g: discrete-random-variable}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [0.2, 0.3], b: [0.3, 0.4]}
    q: 'Величина принимает значения $1, 2, 3$ с вероятностями $@{a:f1}$, $@{b:f1}$ и $p$. Найди $p$.'
    a: 1-a-b
    tol: 0.002
    h: ['Сумма вероятностей равна $1$.']
  p2:
    k: num
    lv: 2
    v: {a: [0.2, 0.3], b: [0.3, 0.4]}
    q: 'Величина $X$ принимает значения $1, 2, 3$ с вероятностями $@{a:f1}$, $@{b:f1}$ и $@{1-a-b:f1}$. Найди $P(X\le2)$.'
    a: a+b
    tol: 0.002
    e: {pr.rv.cdf: b}
    h: ['Значения не больше $2$: это $1$ и $2$.']
    sol:
      - 'Значения $X\le2$: это $1$ и $2$.'
      - 'Сложим их вероятности: $@{a:f1}+@{b:f1}$.'
      - 'Получим $@{a+b:f1}$.'
  p3:
    k: num
    lv: 2
    v: {a: [0.2, 0.3], b: [0.3, 0.4]}
    q: 'Величина $X$ принимает значения $1, 2, 3$ с вероятностями $@{a:f1}$, $@{b:f1}$ и $@{1-a-b:f1}$. Найди $P(X>1)$.'
    a: 1-a
    tol: 0.002
    h: ['Значения больше $1$: это $2$ и $3$. Или $1-P(X=1)$.']
    sol:
      - 'Событие $X>1$ — дополнение к $X=1$.'
      - '$P(X=1)=@{a:f1}$.'
      - 'Получим $1-@{a:f1}=@{1-a:f1}$.'
  p4:
    k: mc
    q: 'Какая таблица может быть распределением случайной величины?'
    a: '$0.2;\ 0.5;\ 0.3$'
    e: {pr.rv.sum: '$0.2;\ 0.5;\ 0.5$'}
    x: ['$0.6;\ -0.1;\ 0.5$']
    h: ['Вероятности неотрицательны и дают в сумме $1$.']
  p5:
    k: mc
    lv: 2
    q: 'Что означает запись $P(X\le2)$ для величины со значениями $1, 2, 3$?'
    a: 'Вероятность того, что $X$ равна $1$ или $2$'
    e: {pr.rv.cdf: 'Вероятность того, что $X$ равна $2$'}
    x: ['Вероятность того, что $X$ больше $2$']
    h: ['Неравенство включает все значения не больше $2$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $X$ принимает значения $1, 2, 3$ с вероятностями $0.2$; $0.5$; $0.3$. Найди $P(X\ge2)$.'
    steps:
      - 'Условию $X\ge2$ удовлетворяют значения $2$ и $3$'
      - 'Складываем вероятности: $P(X=2)+P(X=3)$'
      - '$0.5+0.3=0.8$'
      - 'Ответ: $0.8$'
    bad:
      - {i: 2, t: 'Берём только $P(X=2)=0.5$', e: pr.rv.cdf}
      - {i: 3, t: '$0.5\cdot0.3=0.15$'}
err: [pr.rv.sum, pr.rv.cdf]
sum:
  - 'Умею находить недостающую вероятность в таблице: сумма равна $1$.'
  - 'Умею находить $P(X\le k)$ суммированием.'
