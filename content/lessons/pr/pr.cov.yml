id: pr.cov
int:
  - 'Рост и вес человека обычно растут вместе. Как измерить такую связь? Если одна величина выше среднего, то другая чаще тоже выше. Это и измеряет ковариация.'
  - {ask: 'Пусть $X$ равна $-1, 0, 1$ с вероятностью $\frac13$ каждое, а $Y=X^2$. Чему равна $\operatorname{Cov}(X,Y)$? Независимы ли $X$ и $Y$?', ans: '$E[XY]=E[X^3]=0$, $E[X]=0$, значит $\operatorname{Cov}=0$. Но $Y$ полностью определяется $X$: величины зависимы.'}
  - 'Корреляция — это ковариация, поделённая на $\sigma_X\sigma_Y$. Она лежит между $-1$ и $1$ и измеряет только линейную связь.'
  - {ask: 'Может ли $\mathrm{Cov}(X,X)$ быть отрицательной?', ans: 'Нет: $\mathrm{Cov}(X,X)=\mathrm{Var}X\ge0$.'}
def:
  - {g: covariance-correlation}
  - 'Как решать. Вычисли $\mathrm{Cov}=E[XY]-E[X]E[Y]$ и $\rho=\frac{\mathrm{Cov}}{\sigma_X\sigma_Y}$. Нулевая корреляция не означает независимость. Для суммы: $\mathrm{Var}(X+Y)=\mathrm{Var}X+\mathrm{Var}Y+2\mathrm{Cov}$.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {e: [5, 6, 7], m1: 2..3, m2: 2..3}
    q: 'Известно, что $E[XY]=@e$, $E[X]=@m1$, $E[Y]=@m2$. Найди $\operatorname{Cov}(X,Y)$.'
    a: e-m1*m2
    tol: 0
    h: ['$\operatorname{Cov}=E[XY]-E[X]E[Y]$.']
  p2:
    k: num
    lv: 2
    v: {sx: [1, 2], sy: [1, 3], r: [0.5, 0.6, 0.8, -0.5], cv: '=r*sx*sy'}
    c: ['abs(cv-r) > 0.05']
    q: 'Известно, что $\operatorname{Cov}(X,Y)=@{cv:f2}$, $\sigma_X=@sx$, $\sigma_Y=@sy$. Найди корреляцию.'
    a: r
    tol: 0.002
    e: {pr.cov.cov-scale: cv}
    h: ['$\rho=\frac{\operatorname{Cov}}{\sigma_X\sigma_Y}$.']
    sol:
      - 'Произведение отклонений: $\sigma_X\sigma_Y=@{sx*sy}$.'
      - 'Корреляция $\rho=\frac{@{cv:f2}}{@{sx*sy}}$.'
      - 'Получим $@{r:f2}$.'
  p3:
    k: num
    lv: 2
    v: {v1: 2..5, v2: 1..4, cv: 1..2}
    q: 'Известно, что $\operatorname{Var}X=@v1$, $\operatorname{Var}Y=@v2$ и $\operatorname{Cov}(X,Y)=@cv$. Найди $\operatorname{Var}(X+Y)$.'
    a: v1+v2+2*cv
    tol: 0
    e: {pr.cov.var-sum: v1+v2}
    h: ['К сумме дисперсий добавь удвоенную ковариацию.']
    sol:
      - 'Формула для суммы: добавляется удвоенная ковариация.'
      - '$@v1+@v2+2\cdot@cv$.'
      - 'Получим $@{v1+v2+2*cv}$.'
  p4:
    k: mc
    q: 'Верно ли, что некоррелированные величины всегда независимы?'
    a: 'Нет: при симметричной $X$ и $Y=X^2$ ковариация нулевая, а величины зависимы'
    e: {pr.cov.uncorr: 'Да: нулевая корреляция означает отсутствие связи'}
    x: ['Да, но только при $E[X]=0$']
    h: ['Вспомни пример с $Y=X^2$.']
  p5:
    k: mc
    lv: 2
    q: 'Какое из чисел не может быть коэффициентом корреляции?'
    a: '$1.3$'
    x: ['$-1$', '$0$', '$0.7$']
    h: ['Корреляция лежит в $[-1, 1]$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\operatorname{Var}X=4$, $\operatorname{Var}Y=1$, $\operatorname{Cov}(X,Y)=1$. Найди $\operatorname{Var}(X+Y)$.'
    steps:
      - 'К сумме дисперсий прибавляется удвоенная ковариация'
      - 'Подставим: $4+1+2\cdot1$'
      - 'Итог: $7$'
    bad:
      - {i: 2, t: 'Подставим: $4+1$', e: pr.cov.var-sum}
      - {i: 3, t: 'Итог: $6$'}
err: [pr.cov.uncorr, pr.cov.cov-scale, pr.cov.var-sum]
sum:
  - 'Умею находить $\operatorname{Cov}=E[XY]-E[X]E[Y]$ и корреляцию.'
  - 'Умею находить $\operatorname{Var}(X+Y)$ с учётом ковариации.'
  - 'Отличаю некоррелированность от независимости.'
