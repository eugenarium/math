id: pr.trans
int:
  - 'Если $X$ — бросок кубика, то $Y=X^2$ принимает значения $1,4,9,\dots$. А если $X$ принимает и $1$, и $-1$, то у $Y=X^2$ два разных $x$ дают одно значение.'
  - {ask: '$P(X=1)=P(X=-1)=0.2$. Чему равна $P(X^2=1)$?', ans: '$0.4$: событие $X^2=1$ наступает при $X=1$ и при $X=-1$, вероятности складываются.'}
  - 'Преобразование меняет распределение. Для дискретных величин вероятности одного значения складывают; для $aX+b$ плотность растягивается и делится на $|a|$.'
  - {ask: 'Чему равна плотность $Y=3X$, если $X$ равномерна на $[0,1]$?', ans: '$\frac13$ на $[0,3]$: площадь $\frac13\cdot3=1$.'}
def:
  - {g: rv-transform}
  - 'Как решать. Для дискретной $Y=g(X)$ собери значения $x$ с одним $g(x)$ и сложи вероятности. Для $aX+b$ плотность $\frac1{|a|}f_X\left(\frac{y-b}a\right)$. Дисперсии независимых величин складываются.'
ex:
  - {x: p3, seed: 2}
  - {x: p4, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {k: 2..4}
    tol: 0.002
    q: '$X$ равновероятно принимает целые значения от $-@k$ до $@k$. Найди $P(X^2=1)$.'
    a: 2/(2*k+1)
    e: {pr.trans.merge: 1/(2*k+1)}
    h: ['Значений всего $@{2*k+1}$; $X^2=1$ при $X=\pm1$.']
  p2:
    k: num
    fast: 1
    v: {s: 3..11}
    tol: 0.002
    q: 'Бросают два честных кубика. Найди вероятность того, что сумма равна $@s$.'
    a: (6-abs(s-7))/36
    h: ['Посчитай пары $(a,b)$ с $a+b=@s$ и раздели на $36$.']
  p3:
    k: num
    lv: 2
    v: {a: 2..4, c: 2..5, b: -3..3 !0}
    tol: 0.002
    q: '$X$ равномерна на $[0,@c]$, $Y=@{a}X@{b:s}$. Найди плотность $Y$ на её носителе.'
    a: 1/(a*c)
    e: {pr.trans.jac: 1/c}
    sol:
      - 'Плотность $X$ равна $\frac1{@c}$ на $[0,@c]$.'
      - '$Y$ принимает значения на отрезке длины $@a\cdot@c=@{a*c}$.'
      - 'Плотность $Y$ постоянна и равна $\frac1{@{a*c}}$ (площадь $1$).'
  p4:
    k: num
    lv: 2
    v: {t: 1..3}
    q: '$X\sim N(0,@{(3*t)^2})$ и $Y\sim N(0,@{(4*t)^2})$ независимы. Найди стандартное отклонение $X+Y$.'
    a: 5*t
    e: {pr.trans.sd-add: 7*t}
    sol:
      - 'Дисперсии складываются: $@{(3*t)^2}+@{(4*t)^2}=@{25*t^2}$.'
      - 'Сумма нормальных независимых величин нормальна.'
      - 'Стандартное отклонение $\sqrt{@{25*t^2}}=@{5*t}$.'
  p5:
    k: mc
    q: '$P(X=1)=P(X=-1)=0.2$. Чему равна $P(X^2=1)$?'
    a: '$0.4$'
    e: {pr.trans.merge: '$0.2$'}
    x: ['$0.04$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $X$ равномерна на $[0,1]$, найди плотность $Y=2X$.'
    steps:
      - '$f_X=1$ на $[0,1]$'
      - '$Y=2X$ принимает значения от $0$ до $2$'
      - 'Плотность $Y$ равна $f_X(y/2)\cdot\frac12=\frac12$ на $[0,2]$'
      - 'Проверка: площадь под плотностью $\frac12\cdot2=1$'
    bad:
      - {i: 3, t: 'Плотность $Y$ равна $f_X(y/2)=1$ на $[0,2]$', e: pr.trans.jac}
      - {i: 4, t: 'Проверка: площадь под плотностью $1\cdot2=2$'}
err: [pr.trans.merge, pr.trans.jac, pr.trans.sd-add]
sum:
  - 'Умею находить распределение $g(X)$, складывая вероятности совпадающих значений.'
  - 'Умею находить плотность $aX+b$ и сумму двух кубиков.'
  - 'Отличаю сложение дисперсий от сложения стандартных отклонений.'
