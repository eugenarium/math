id: pr.ineq
int:
  - 'Средний доход города — $50$ тысяч. Какая доля жителей может зарабатывать больше $500$ тысяч? Точное распределение неизвестно, но оценить сверху можно: если бы таких было $10\%$ и больше, их вклад в среднее уже превысил бы $50$.'
  - {ask: 'Сколько процентов жителей, самое большее, может зарабатывать не менее $500$ при среднем $50$?', ans: 'Не больше $10\%$: $\frac{50}{500}=0{,}1$. Это неравенство Маркова.'}
  - 'Неравенство Чебышёва использует и дисперсию: вероятность отклониться от среднего на $t$ не больше $\frac{\sigma^2}{t^2}$.'
def:
  - {g: markov-chebyshev}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {m: [2, 3], a: [6, 10]}
    q: 'Неотрицательная величина имеет среднее $@m$. Оцени сверху $P(X\ge@a)$.'
    a: m/a
    tol: 0.002
    h: ['Неравенство Маркова: $P(X\ge a)\le\frac{E[X]}{a}$.']
  p2:
    k: num
    lv: 2
    v: {s2: [4, 9], t: [4, 6]}
    q: 'У величины дисперсия $@s2$. Оцени сверху $P(|X-\mu|\ge@t)$ по неравенству Чебышёва.'
    a: s2/t^2
    tol: 0.002
    e: {pr.ineq.sigma: sqrt(s2)/t}
    h: ['$P(|X-\mu|\ge t)\le\frac{\sigma^2}{t^2}$.']
    sol:
      - 'Дисперсия $\sigma^2=@s2$, порог $t=@t$.'
      - 'Оценка $\frac{\sigma^2}{t^2}=\frac{@s2}{@{t^2}}$.'
      - 'Получим $@{s2/t^2:f3}$.'
  p3:
    k: num
    lv: 2
    v: {k: [2, 3, 4]}
    q: 'По неравенству Чебышёва оцени снизу вероятность того, что величина отклонится от среднего меньше чем на $@k\sigma$.'
    a: 1-1/k^2
    tol: 0.002
    e: {pr.ineq.sigma: 1-1/k}
    h: ['$P(|X-\mu|<k\sigma)\ge1-\frac{1}{k^2}$.']
    sol:
      - 'Вероятность отклонения не меньше $k\sigma$ не больше $\frac{1}{k^2}=@{1/k^2:f3}$.'
      - 'Дополнение даёт оценку снизу.'
      - 'Получим $1-@{1/k^2:f3}=@{1-1/k^2:f3}$.'
  p4:
    k: mc
    q: 'Можно ли применять неравенство Маркова к величине с отрицательными значениями?'
    a: 'Нет: оно требует $X\ge0$'
    e: {pr.ineq.nonneg: 'Да, для любой величины с ожиданием'}
    x: ['Только для дискретных величин']
    h: ['Проверь на $X=\pm10$ с вероятностью $0{,}5$.']
  p5:
    k: num
    lv: 2
    v: {k: [4, 5, 10]}
    q: 'Время загрузки неотрицательно, среднее $2$ с. Оцени сверху вероятность загрузки дольше $@{2*k}$ с.'
    a: 1/k
    tol: 0.002
    h: ['Порог в $@k$ раз больше среднего.']
    sol:
      - 'Неравенство Маркова: $P(X\ge a)\le\frac{E[X]}{a}$.'
      - 'Здесь $\frac{2}{@{2*k}}$.'
      - 'Получим $@{1/k:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\sigma^2=4$. Оцени сверху $P(|X-\mu|\ge4)$.'
    steps:
      - '$P(|X-\mu|\ge t)\le\frac{\sigma^2}{t^2}$'
      - 'Здесь $\sigma^2=4$ и $t=4$'
      - '$\frac{4}{16}=0{,}25$'
      - 'Ответ: не больше $0{,}25$'
    bad:
      - {i: 3, t: '$\frac{2}{4}=0{,}5$', e: pr.ineq.sigma}
      - {i: 4, t: 'Ответ: ровно $0{,}25$'}
err: [pr.ineq.nonneg, pr.ineq.sigma]
sum:
  - 'Умею применять неравенство Маркова для неотрицательных величин.'
  - 'Умею применять неравенство Чебышёва: $\frac{\sigma^2}{t^2}$.'
  - 'Помню, что это оценки сверху, а не точные вероятности.'
