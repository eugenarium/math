id: pr.exp
int:
  - 'Игра: бросаешь кубик, получаешь столько рублей, сколько очков. Какой выигрыш можно ожидать в среднем за много игр? Среднее нужно считать с учётом того, как часто выпадает каждое значение.'
  - {ask: 'Монета: орёл даёт $10$ рублей, решка $0$. Сколько в среднем за игру?', ans: '$5$ рублей: $0{,}5\cdot10+0{,}5\cdot0$. Каждое значение входит со своей вероятностью.'}
  - 'Математическое ожидание — сумма $x_ip_i$. Линейность: $E[aX+b]=aE[X]+b$. А вот $E[X^2]$ нельзя получить возведением $E[X]$ в квадрат.'
def:
  - {g: expectation}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {p1: [0.2, 0.3], p3: [0.3, 0.4]}
    c: ['abs(p1-p3) > 0.05']
    q: 'Величина принимает значения $1, 2, 3$ с вероятностями $@{p1:f1}$, $@{1-p1-p3:f1}$ и $@{p3:f1}$. Найди $E[X]$.'
    a: p1+2*(1-p1-p3)+3*p3
    tol: 0.002
    e: {pr.exp.avg: 2}
    h: ['$E[X]=1\cdot p_1+2\cdot p_2+3\cdot p_3$.']
  p2:
    k: num
    lv: 2
    v: {m: 2..6, a: 2..4, b: 1..5}
    q: 'Известно, что $E[X]=@m$. Найди $E[@{a}X+@b]$.'
    a: a*m+b
    tol: 0
    h: ['$E[aX+b]=aE[X]+b$.']
    sol:
      - 'Линейность: $E[aX+b]=aE[X]+b$.'
      - 'Подставим: $@a\cdot@m+@b$.'
      - 'Получим $@{a*m+b}$.'
  p3:
    k: num
    lv: 2
    v: {p1: [0.2, 0.3], p3: [0.2, 0.3, 0.4]}
    q: 'Величина принимает значения $1, 2, 3$ с вероятностями $@{p1:f1}$, $@{1-p1-p3:f1}$ и $@{p3:f1}$. Найди $E[X^2]$.'
    a: p1+4*(1-p1-p3)+9*p3
    tol: 0.002
    e: {pr.exp.nonlin: '(p1+2*(1-p1-p3)+3*p3)^2'}
    h: ['$E[X^2]=\sum x_i^2p_i$.']
    sol:
      - 'Квадраты значений: $1, 4, 9$.'
      - '$E[X^2]=1\cdot@{p1:f1}+4\cdot@{1-p1-p3:f1}+9\cdot@{p3:f1}$.'
      - 'Получим $@{p1+4*(1-p1-p3)+9*p3:f2}$.'
  p4:
    k: mc
    q: 'Как связаны $E[X^2]$ и $(E[X])^2$?'
    a: 'Обычно $E[X^2]>(E[X])^2$, равенство только при постоянной $X$'
    e: {pr.exp.nonlin: 'Они всегда равны'}
    x: ['$E[X^2]<(E[X])^2$']
    h: ['Проверь на $X=0$ или $2$ с вероятностями $0{,}5$.']
  p5:
    k: num
    lv: 2
    v: {n: 2..6}
    q: 'Бросают $@n$ честных кубиков. Найди математическое ожидание суммы очков.'
    a: 3.5*n
    tol: 0
    h: ['Ожидание суммы равно сумме ожиданий.']
    sol:
      - 'Ожидание одного кубика $\frac{1+2+\dots+6}{6}=3{,}5$.'
      - 'Линейность: ожидание суммы — сумма ожиданий.'
      - 'Итог $@n\cdot3{,}5=@{3.5*n}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $X$ принимает значения $0, 1, 2$ с вероятностями $0{,}5$; $0{,}3$; $0{,}2$. Найди $E[X]$.'
    steps:
      - '$E[X]=\sum x_ip_i$'
      - '$E[X]=0\cdot0{,}5+1\cdot0{,}3+2\cdot0{,}2$'
      - '$E[X]=0+0{,}3+0{,}4$'
      - 'Ответ: $0{,}7$'
    bad:
      - {i: 2, t: '$E[X]=\frac{0+1+2}{3}$', e: pr.exp.avg}
      - {i: 3, t: '$E[X]=0+0{,}3+0{,}2$'}
err: [pr.exp.nonlin, pr.exp.avg]
sum:
  - 'Умею находить $E[X]=\sum x_ip_i$ и $E[aX+b]=aE[X]+b$.'
  - 'Помню, что $E[X^2]\ne(E[X])^2$.'
  - 'Не путаю ожидание с простым средним значений.'
