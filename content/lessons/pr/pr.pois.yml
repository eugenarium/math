id: pr.pois
int:
  - 'На колл-центр звонят в среднем $3$ раза в минуту, звонки независимы. Сколько звонков ждать за $2$ минуты и сколько в среднем длится пауза между звонками?'
  - {ask: 'За $2$ минуты в среднем $6$ звонков. А сколько в среднем длится пауза между соседними звонками?', ans: 'Одну треть минуты, то есть $20$ секунд: $\frac1\lambda=\frac13$.'}
  - 'Это пуассоновский поток: число событий за время $t$ — пуассоновское со средним $\lambda t$, а паузы между событиями независимы и показательны со средним $1/\lambda$.'
  - {ask: 'Сколько событий в среднем за $5$ минут при $\lambda=2$?', ans: '$10$: $\lambda t=2\cdot5$.'}
def:
  - {g: poisson-process}
  - 'Как решать. Среднее число событий за время $t$ — $\lambda t$. Вероятность отсутствия — $e^{-\lambda t}$. Паузы между событиями показательны со средним $\frac1\lambda$. Прошлое ожидание ничего не меняет.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {lam: [2, 3, 4, 5], t: [0.5, 2, 3]}
    q: 'Интенсивность потока $\lambda=@lam$ событий в минуту. Сколько событий в среднем за $@t$ мин?'
    a: lam*t
    e: {pr.pois.rate: lam}
    h: ['Среднее число событий равно $\lambda t$.']
  p2:
    k: num
    fast: 1
    v: {lam: [2, 4, 5, 10]}
    tol: 0.002
    q: 'Интенсивность потока $\lambda=@lam$ событий в минуту. Сколько минут в среднем проходит между соседними событиями?'
    a: 1/lam
    e: {pr.pois.mean: lam}
    h: ['Паузы показательны со средним $\frac1\lambda$.']
    sol:
      - 'Паузы между событиями показательны с параметром $\lambda=@lam$.'
      - 'Среднее показательного равно $\frac1\lambda$.'
      - 'Итог: $\frac1{@lam}=@{1/lam:f3}$ мин.'
  p3:
    k: num
    lv: 2
    v: {lam: [1, 2, 3], t: [0.5, 2]}
    tol: 0.002
    q: 'Интенсивность $\lambda=@lam$ в минуту. Найди вероятность того, что за $@t$ мин не произойдёт ни одного события. Ответ округли до тысячных.'
    a: exp(-lam*t)
    e: {pr.pois.rate: exp(-lam)}
    sol:
      - 'Число событий за $@t$ мин $\sim\mathrm{Pois}(@{lam*t:f1})$.'
      - 'Вероятность нуля $P(N=0)=e^{-@{lam*t:f1}}$.'
      - 'Итог: $@{exp(-lam*t):f3}$.'
  p4:
    k: mc
    q: 'В потоке Пуассона событий не было целый час. Как изменилась вероятность события в следующую минуту?'
    a: 'Осталась прежней: у процесса нет памяти'
    e: {pr.pois.memory: 'Выросла: событие уже «назрело»'}
    x: ['Уменьшилась: событий давно не было']
  p5:
    k: mc
    lv: 2
    q: 'Как распределено время между соседними событиями потока Пуассона интенсивности $\lambda$?'
    a: 'Показательно с параметром $\lambda$'
    x: ['Нормально со средним $\lambda$', 'Равномерно на $[0,\lambda]$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: поток Пуассона с $\lambda=3$ в минуту. Найди вероятность ровно одного события за $2$ мин.'
    steps:
      - 'Окно $t=2$, интенсивность $\lambda=3$: параметр $\lambda t=6$'
      - 'Число событий $N\sim\mathrm{Pois}(6)$'
      - '$P(N=1)=6e^{-6}$'
      - 'Численно $6e^{-6}\approx0.0149$'
    bad:
      - {i: 1, t: 'Параметр равен интенсивности: $\lambda=3$', e: pr.pois.rate}
      - {i: 4, t: 'Численно $6e^{-6}\approx0.149$'}
err: [pr.pois.rate, pr.pois.mean, pr.pois.memory]
sum:
  - 'Умею находить среднее число событий $\lambda t$ и вероятность отсутствия событий.'
  - 'Умею находить среднюю паузу между событиями $1/\lambda$.'
  - 'Отличаю отсутствие памяти от «назревания» события.'
