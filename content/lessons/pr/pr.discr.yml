id: pr.discr
int:
  - 'Бросаем монету $3$ раза. Сколько орлов? А когда впервые выпадет орёл? А сколько звонков придёт в колл-центр за час? Эти три вопроса описывают три разных распределения.'
  - {ask: 'Как получить ровно два орла при трёх бросках? Сколько способов?', ans: 'Три: ООР, ОРО, РОО. Поэтому в формуле биномиального распределения есть множитель $C_3^2$.'}
  - 'Биномиальное — число успехов, геометрическое — номер первого успеха, пуассоновское — число редких событий за интервал.'
def:
  - {g: binomial-distribution}
  - {g: geometric-distribution}
  - {g: poisson-distribution}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [10, 20, 50], p: [0.1, 0.2, 0.5]}
    q: 'Число успехов в $@n$ независимых испытаниях с вероятностью успеха $@{p:f1}$. Найди среднее число успехов.'
    a: n*p
    tol: 0.002
    h: ['Для бинома среднее равно $np$.']
  p2:
    k: num
    lv: 2
    v: {n: 4..6, k: 2..3, p: [0.3, 0.5]}
    q: 'Найди вероятность ровно $@k$ успехов в $@n$ независимых испытаниях с вероятностью успеха $@{p:f1}$.'
    a: C(n,k)*p^k*(1-p)^(n-k)
    tol: 0.002
    e: {pr.discr.coef: 'p^k*(1-p)^(n-k)'}
    h: ['$P(X=k)=C_n^kp^k(1-p)^{n-k}$.']
    sol:
      - 'Способов выбрать места успехов: $C_@n^@k=@{C(n,k)}$.'
      - 'Вероятность одной расстановки: $@{p:f1}^@k\cdot@{1-p:f1}^@{n-k}=@{p^k*(1-p)^(n-k):f4}$.'
      - 'Итог $@{C(n,k)}\cdot@{p^k*(1-p)^(n-k):f4}=@{C(n,k)*p^k*(1-p)^(n-k):f3}$.'
  p3:
    k: num
    lv: 2
    v: {k: 3..5, p: [0.2, 0.3, 0.4]}
    q: 'Вероятность успеха в одном испытании $@{p:f1}$. Найди вероятность того, что первый успех случится ровно на $@k$-й попытке.'
    a: (1-p)^(k-1)*p
    tol: 0.002
    e: {pr.discr.geom: 'p^(k-1)*(1-p)'}
    h: ['Сначала $@{k-1}$ неудач, затем успех.']
    sol:
      - 'Неудача в каждой из $@{k-1}$ попыток: $@{1-p:f1}^@{k-1}=@{(1-p)^(k-1):f4}$.'
      - 'Успех на $@k$-й: умножаем на $@{p:f1}$.'
      - 'Итог $@{(1-p)^(k-1)*p:f3}$.'
  p4:
    k: mc
    q: 'Что описывает биномиальное распределение?'
    a: 'Число успехов в $n$ независимых испытаниях'
    x: ['Номер первого успеха', 'Число событий за единицу времени']
    h: ['Вспомни три броска монеты.']
  p5:
    k: num
    lv: 2
    v: {l: [1, 2, 3]}
    q: 'Число звонков за час подчиняется закону Пуассона со средним $@l$. Найди вероятность того, что звонков не будет.'
    a: exp(-l)
    tol: 0.002
    h: ['$P(X=0)=e^{-\lambda}$.']
    sol:
      - 'Формула: $P(X=k)=\frac{\lambda^ke^{-\lambda}}{k!}$.'
      - 'При $k=0$: $\lambda^0=1$ и $0!=1$.'
      - 'Вероятность $e^{-@l}=@{exp(-l):f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: найди вероятность двух орлов при трёх бросках честной монеты.'
    steps:
      - 'Формула: $P(X=k)=C_n^kp^k(1-p)^{n-k}$'
      - '$C_3^2=3$'
      - '$P(X=2)=3\cdot0{,}5^2\cdot0{,}5=0{,}375$'
      - 'Ответ: $0{,}375$'
    bad:
      - {i: 3, t: '$P(X=2)=0{,}5^2\cdot0{,}5=0{,}125$', e: pr.discr.coef}
      - {i: 2, t: '$C_3^2=2$'}
err: [pr.discr.coef, pr.discr.geom]
sum:
  - 'Умею применять формулу биномиального распределения с множителем $C_n^k$.'
  - 'Умею находить вероятность первого успеха на $k$-й попытке: $(1-p)^{k-1}p$.'
  - 'Знаю, что $P(X=0)=e^{-\lambda}$ для распределения Пуассона.'
