id: pr.cdistr
int:
  - 'Два типичных непрерывных закона: равномерный (все точки отрезка равноправны) и показательный (время ожидания случайного события). Показательное ожидание обладает странным свойством: прошедшее время не имеет значения.'
  - {ask: 'Ты ждёшь автобус, который приходит в случайные моменты, уже $10$ минут. Стал ли автобус «ближе»?', ans: 'Нет. Для показательного распределения оставшееся ожидание не зависит от прошедшего: это свойство отсутствия памяти.'}
  - 'Интенсивность $\lambda$ — число событий за единицу времени. Чем больше $\lambda$, тем короче ожидание: среднее $\frac1\lambda$.'
def:
  - {g: uniform-distribution}
  - {g: exponential-distribution}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 0..4, d: [2, 4, 6]}
    q: 'Величина равномерно распределена на $[@a, @{a+d}]$. Найди её среднее.'
    a: a+d/2
    tol: 0
    h: ['Среднее — середина отрезка.']
  p2:
    k: num
    lv: 2
    v: {l: [0.5, 2], t: [1, 2]}
    q: 'Время ожидания показательное с интенсивностью $\lambda=@{l:f1}$. Найди вероятность того, что оно не больше $@t$.'
    a: 1-exp(-l*t)
    tol: 0.002
    e: {pr.cdistr.rate: 1-exp(-t/l)}
    h: ['$P(X\le t)=1-e^{-\lambda t}$.']
    sol:
      - 'Функция распределения: $F(t)=1-e^{-\lambda t}$.'
      - 'Показатель: $-@{l:f1}\cdot@t=@{-l*t:f1}$.'
      - 'Вероятность $1-e^{@{-l*t:f1}}=@{1-exp(-l*t):f3}$.'
  p3:
    k: num
    lv: 2
    v: {l: [0.5, 2, 4]}
    q: 'Время ожидания показательное с интенсивностью $\lambda=@{l:f1}$. Найди среднее время ожидания.'
    a: 1/l
    tol: 0.002
    e: {pr.cdistr.rate: l}
    h: ['Среднее равно $\frac{1}{\lambda}$.']
    sol:
      - 'Чем больше интенсивность, тем быстрее приходят события.'
      - 'Среднее время $E[X]=\frac{1}{\lambda}$.'
      - 'Получим $\frac{1}{@{l:f1}}=@{1/l:f2}$.'
  p4:
    k: mc
    q: 'Время ожидания показательное. Уже прождали $10$ минут. Какова вероятность ждать ещё $5$ минут по сравнению с новым ожидающим?'
    a: 'Такая же: у показательного ожидания нет памяти'
    e: {pr.cdistr.memory: 'Меньше: автобус скоро придёт'}
    x: ['Больше']
    h: ['$P(X>s+t\mid X>s)=P(X>t)$.']
  p5:
    k: num
    lv: 2
    v: {l: [0.5, 1, 2], t: [1, 2], s: [3, 5]}
    q: 'Время ожидания показательное, $\lambda=@{l:f1}$. Прождали уже $@s$ @{s:w=минуту,минуты,минут}. Найди вероятность ждать ещё больше $@t$ @{t:w=минуты,минут,минут}.'
    a: exp(-l*t)
    tol: 0.002
    e: {pr.cdistr.memory: 'exp(-l*(s+t))'}
    h: ['Прошедшее время не влияет.']
    sol:
      - 'Свойство отсутствия памяти: $P(X>s+t\mid X>s)=P(X>t)$.'
      - 'Время $s=@s$ не влияет на ответ.'
      - 'Вероятность $e^{-@{l:f1}\cdot@t}=@{exp(-l*t):f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: время показательное, $\lambda=0.5$. Найди $P(X>2)$.'
    steps:
      - 'Для показательного распределения $P(X>t)=e^{-\lambda t}$'
      - 'Здесь $\lambda=0.5$ и $t=2$'
      - '$P(X>2)=e^{-0.5\cdot2}=e^{-1}$'
      - 'Ответ: $e^{-1}\approx0.368$'
    bad:
      - {i: 3, t: '$P(X>2)=e^{-2/0.5}=e^{-4}$', e: pr.cdistr.rate}
      - {i: 4, t: 'Ответ: $e^{-1}\approx0.632$'}
err: [pr.cdistr.rate, pr.cdistr.memory]
sum:
  - 'Умею работать с равномерным распределением: среднее — середина отрезка.'
  - 'Умею применять $P(X>t)=e^{-\lambda t}$ и среднее $\frac1\lambda$.'
  - 'Знаю свойство отсутствия памяти показательного распределения.'
