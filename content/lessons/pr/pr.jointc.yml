id: pr.jointc
int:
  - 'Бросаем точку наугад в прямоугольник $4\times5$. Вероятность попасть в левый нижний квадрат $2\times2$ — это доля его площади во всей площади.'
  - {ask: 'Какова вероятность попасть в квадрат $2\times2$, если точка равномерна на прямоугольнике $4\times5$?', ans: 'Площадь квадрата $4$, площадь прямоугольника $20$: вероятность $\frac4{20}=0.2$.'}
  - 'Равномерное распределение на области — постоянная плотность $f=1/S$. Вероятность — объём над частью области: площадь, умноженная на плотность.'
  - {ask: 'Чему равна вероятность $P(X<1)$ для равномерной точки в $[0,4]\times[0,5]$?', ans: '$\frac{1\cdot5}{20}=0.25$: полоса площадью $5$.'}
def:
  - {g: joint-density}
  - 'Как решать. Определи носитель и его площадь $S$. Плотность $\frac1S$. Вероятность области — её площадь, делённая на $S$. Независимость требует прямоугольного носителя.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [2, 4], b: [2, 5]}
    tol: 0.002
    q: 'Пара $(X,Y)$ равномерна на прямоугольнике $[0,@a]\times[0,@b]$. Найди плотность $f$.'
    a: 1/(a*b)
    e: {pr.jointc.dens-value: a*b}
    h: ['Плотность равна $\frac1S$, где $S$ — площадь прямоугольника.']
  p2:
    k: num
    v: {a: [4, 5], b: [5, 10], c: 1..3, d: 1..3}
    tol: 0.002
    q: 'Пара $(X,Y)$ равномерна на $[0,@a]\times[0,@b]$. Найди $P(X<@c,\ Y<@d)$.'
    a: c*d/(a*b)
    e: {pr.jointc.area: c*d}
    sol:
      - 'Площадь области $X<@c$, $Y<@d$ равна $@c\cdot@d=@{c*d}$.'
      - 'Плотность $\frac1{@{a*b}}$.'
      - 'Вероятность $\frac{@{c*d}}{@{a*b}}=@{c*d/(a*b):f4}$.'
  p3:
    k: num
    lv: 2
    v: {a: 3..6, c: 1..2}
    tol: 0.002
    q: 'Пара $(X,Y)$ равномерна на треугольнике $x\ge0$, $y\ge0$, $x+y\le@a$. Найди $P(X\le@c)$.'
    a: 1-((a-c)/a)^2
    e: {pr.jointc.area: (a^2-(a-c)^2)/2}
    sol:
      - 'Площадь треугольника $\frac{@a^2}2=@{a^2/2}$.'
      - 'Область $X>@c$ — подобный треугольник с катетом $@{a-c}$, площадь $@{(a-c)^2/2}$.'
      - 'Вероятность $1-\frac{@{(a-c)^2/2}}{@{a^2/2}}=@{1-((a-c)/a)^2:f4}$.'
  p4:
    k: mc
    q: 'Пара $(X,Y)$ равномерна на треугольнике $x\ge0$, $y\ge0$, $x+y\le1$. Независимы ли $X$ и $Y$?'
    a: 'Нет: при большом $X$ значения $Y$ ограничены'
    e: {pr.jointc.support: 'Да: плотность постоянна'}
    x: ['Да: оба принимают значения от $0$ до $1$']
    h: ['Подумай, может ли быть $X=0.9$ и $Y=0.9$.']
  p5:
    k: mc
    lv: 2
    q: 'Что верно про плотность $f(x,y)$?'
    a: 'Она может быть больше $1$; вероятность — объём над областью'
    e: {pr.jointc.dens-value: 'Она не превосходит $1$, как всякая вероятность'}
    x: ['Она равна вероятности попасть в точку $(x,y)$']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: пара равномерна на $[0,4]\times[0,5]$, нужно $P(X<2,\ Y<1)$.'
    steps:
      - 'Площадь прямоугольника $4\cdot5=20$'
      - 'Плотность $f=\frac1{20}$'
      - 'Область $X<2$, $Y<1$ — прямоугольник площади $2\cdot1=2$'
      - 'Вероятность $2\cdot\frac1{20}=0.1$'
    bad:
      - {i: 2, t: 'Плотность $f=20$', e: pr.jointc.dens-value}
      - {i: 4, t: 'Вероятность равна площади области, то есть $2$', e: pr.jointc.area}
err: [pr.jointc.area, pr.jointc.dens-value, pr.jointc.support]
sum:
  - 'Умею находить плотность и вероятности для равномерного распределения на прямоугольнике и треугольнике.'
  - 'Отличаю плотность от вероятности.'
  - 'Умею проверять независимость по форме носителя.'
