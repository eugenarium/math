id: pr.clt
int:
  - 'Один бросок кубика даёт плоское распределение: все грани равновозможны. А среднее по $30$ броскам почти всегда около $3{,}5$, и его гистограмма выглядит как колокол. Это работа центральной предельной теоремы.'
  - {ask: 'Если бросать кубик $100$ раз и считать среднее, насколько разброс среднего меньше разброса одного броска?', ans: 'В $\sqrt{100}=10$ раз: стандартное отклонение среднего равно $\frac{\sigma}{\sqrt n}$.'}
  - 'Важно: нормальным становится распределение среднего (или суммы), а не самих наблюдений.'
def:
  - {g: central-limit-theorem}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {s: [10, 20], n: [4, 25, 100]}
    q: 'Стандартное отклонение наблюдения $@s$, наблюдений $@n$. Найди стандартное отклонение среднего.'
    a: s/sqrt(n)
    tol: 0.002
    e: {pr.clt.sd: s}
    h: ['$\frac{\sigma}{\sqrt n}$.']
  p2:
    k: num
    lv: 2
    v: {s: [10, 20], n: [25, 100]}
    q: 'Стандартное отклонение наблюдения $@s$, наблюдений $@n$. Среднее почти нормально. Найди границу, в пределах которой около $95\%$ значений среднего лежат от $\mu$ (две стандартные ошибки).'
    a: 2*s/sqrt(n)
    tol: 0.002
    e: {pr.clt.sd: 2*s}
    h: ['Стандартная ошибка равна $\frac{\sigma}{\sqrt n}$, удвой её.']
    sol:
      - 'Стандартная ошибка $\frac{@s}{\sqrt{@n}}=@{s/sqrt(n)}$.'
      - 'Около $95\%$ лежит в пределах двух ошибок.'
      - 'Граница $2\cdot@{s/sqrt(n)}=@{2*s/sqrt(n)}$.'
  p3:
    k: num
    lv: 2
    v: {s: [2, 3, 4], n: [4, 9, 16, 25]}
    q: 'Независимые наблюдения имеют стандартное отклонение $@s$. Найди стандартное отклонение суммы $@n$ наблюдений.'
    a: s*sqrt(n)
    tol: 0.002
    e: {pr.clt.sd: s}
    h: ['Дисперсия суммы независимых — сумма дисперсий.']
    sol:
      - 'Дисперсия одного наблюдения $@{s^2}$.'
      - 'Дисперсия суммы $@n\cdot@{s^2}=@{n*s^2}$.'
      - 'Стандартное отклонение $\sqrt{@{n*s^2}}=@{s*sqrt(n)}$.'
  p4:
    k: mc
    q: 'Что приближённо нормально по ЦПТ при большом $n$?'
    a: 'Распределение выборочного среднего'
    e: {pr.clt.data: 'Сами наблюдения'}
    x: ['Выборочное среднее становится точно равным $\mu$']
    h: ['Один бросок кубика остаётся плоским.']
  p5:
    k: mc
    lv: 2
    q: 'Число наблюдений увеличили в $4$ раза. Как изменилась стандартная ошибка среднего?'
    a: 'Уменьшилась в $2$ раза'
    e: {pr.clt.sd: 'Не изменилась'}
    x: ['Уменьшилась в $4$ раза']
    h: ['Ошибка $\frac{\sigma}{\sqrt n}$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $\sigma=12$, $n=36$. Найди стандартную ошибку среднего.'
    steps:
      - 'Стандартная ошибка равна $\frac{\sigma}{\sqrt n}$'
      - 'Здесь $\sigma=12$ и $\sqrt{36}=6$'
      - '$\frac{12}{6}=2$'
      - 'Ответ: $2$'
    bad:
      - {i: 3, t: '$\frac{12}{36}\approx0{,}33$', e: pr.clt.sd}
      - {i: 2, t: 'Здесь $\sigma=12$ и $\sqrt{36}=18$'}
err: [pr.clt.data, pr.clt.sd]
sum:
  - 'Умею находить стандартную ошибку среднего: $\frac{\sigma}{\sqrt n}$.'
  - 'Умею находить стандартное отклонение суммы: $\sigma\sqrt n$.'
  - 'Помню, что нормальным становится распределение среднего, а не данных.'
