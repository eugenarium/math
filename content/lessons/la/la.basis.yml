id: la.basis
int:
  - 'Любую точку плоскости можно описать двумя числами: сколько шагов на восток и сколько на север. Почему двух достаточно, а трёх уже лишний?'
  - {ask: 'Векторы $(1, 2)$ и $(2, 4)$ описывают направления. Нужны ли оба?', ans: 'Нет: $(2, 4)=2(1, 2)$. Второй ничего нового не добавляет, они линейно зависимы.'}
  - 'Базис — набор независимых векторов, который достаёт до любой точки. Их число и есть размерность.'
def:
  - {g: linear-independence}
  - {g: basis-dimension}
ex:
  - {x: p5, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 2..6}
    q: 'Какое наибольшее число линейно независимых векторов может быть в $\mathbb{R}^@n$?'
    a: n
    tol: 0
    h: ['Это размерность пространства.']
  p2:
    k: mc
    q: 'Векторы $\mathbf{u}=(1, 0, 1)$, $\mathbf{v}=(0, 1, 1)$, $\mathbf{w}=(1, 1, 2)$ попарно не кратны. Независимы ли они?'
    a: 'Зависимы: $\mathbf{w}=\mathbf{u}+\mathbf{v}$'
    e: {la.basis.pairwise: 'Независимы: никакие два не кратны'}
    x: ['Независимы, так как их три']
    h: ['Сложи $\mathbf{u}$ и $\mathbf{v}$.']
  p3:
    k: num
    lv: 2
    v: {p: 2..4, m: 2..4}
    q: 'При каком $k$ векторы $(1, @p)$ и $(@m, k)$ линейно зависимы?'
    a: m*p
    tol: 0
    h: ['Второй вектор должен быть кратен первому: $(@m, k)=@m(1, @p)$.']
    sol:
      - 'Зависимость означает $(@m, k)=c(1, @p)$.'
      - 'Из первой координаты $c=@m$.'
      - 'Тогда $k=@m\cdot@p=@{m*p}$.'
  p4:
    k: mc
    lv: 2
    q: 'Могут ли три вектора на плоскости быть базисом $\mathbb{R}^2$?'
    a: 'Нет: в $\mathbb{R}^2$ базис состоит ровно из двух векторов'
    e: {la.basis.size: 'Да: базис может содержать любое число векторов'}
    x: ['Да, если они попарно не кратны']
    h: ['Число векторов базиса равно размерности.']
  p5:
    k: num
    lv: 2
    v: {m: [1, 3, 5], n: [1, 3, -1, -3]}
    q: 'Вектор $(@m, @n)$ разложен по базису $\mathbf{u}=(1, 1)$, $\mathbf{v}=(1, -1)$ как $a\mathbf{u}+b\mathbf{v}$. Найди $a$.'
    a: (m+n)/2
    tol: 0
    h: ['Запиши покоординатно: $a+b=@m$, $a-b=@n$.']
    sol:
      - 'Первая координата: $a+b=@m$. Вторая: $a-b=@n$.'
      - 'Сложим уравнения: $2a=@{m+n}$.'
      - 'Тогда $a=@{(m+n)/2}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при проверке независимости $\mathbf{u}=(1, 2)$ и $\mathbf{v}=(2, 4)$.'
    steps:
      - 'Ищем числа $a$, $b$ с $a\mathbf{u}+b\mathbf{v}=\mathbf{0}$'
      - 'Берём $a=2$, $b=-1$: $2(1, 2)-(2, 4)=(0, 0)$'
      - 'Получили нетривиальную комбинацию, равную нулю'
      - 'Значит, векторы линейно зависимы'
    bad:
      - {i: 4, t: 'Значит, векторы линейно независимы, так как они не равны', e: la.basis.pairwise}
      - {i: 2, t: 'Берём $a=2$, $b=-1$: $2(1, 2)-(2, 4)=(0, 4)$'}
err: [la.basis.pairwise, la.basis.size]
sum:
  - 'Умею проверять линейную независимость поиском нетривиальной комбинации.'
  - 'Умею определять размерность: в $\mathbb{R}^n$ базис состоит из $n$ векторов.'
  - 'Умею находить координаты вектора в базисе, решая систему.'
