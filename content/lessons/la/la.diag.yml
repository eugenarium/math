id: la.diag
int:
  - 'Возводить матрицу в сотую степень умножением долго. В базисе из собственных векторов матрица диагональна, и каждая ось растягивается в $\lambda^n$ раз.'
  - {ask: 'Матрица растягивает по собственным направлениям в $2$ и $3$ раза. Во сколько раз она растянет их после применения пять раз подряд?', ans: 'В $2^5=32$ и $3^5=243$ раза. Степень матрицы возводит в степень собственные значения, а не умножает их на $5$.'}
  - 'Но базис из собственных векторов есть не всегда: матрица $\begin{pmatrix}1&1\\0&1\end{pmatrix}$ имеет только одно собственное направление.'
  - {ask: 'Чему равны собственные значения $A^3$, если у $A$ они $2$ и $-1$?', ans: '$8$ и $-1$: каждое значение возводится в куб.'}
def:
  - {g: diagonalization}
  - 'Как решать. Найди собственные значения и векторы, составь $P$ из векторов и $D$ из значений. Тогда $A=PDP^{-1}$ и $A^n=PD^nP^{-1}$. Собственные значения $A^n$ равны $\lambda^n$. Не всякая матрица диагонализуема.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {l: [2, 3], n: 2..4}
    q: 'Найди элемент $(1, 1)$ матрицы $D^@n$ для $D=\operatorname{diag}(@l, 5)$.'
    a: l^n
    tol: 0
    h: ['Диагональная матрица возводится в степень по диагонали.']
  p2:
    k: num
    lv: 2
    v: {l1: [2, 3], l2: [-1, 1, 4], n: 2..4}
    q: 'У матрицы $A$ собственные значения $@l1$ и $@l2$. Найди след $A^@n$.'
    a: l1^n+l2^n
    tol: 0
    h: ['След равен сумме собственных значений; у $A^n$ они равны $\lambda^n$.']
    sol:
      - 'Собственные значения $A^@n$: $@l1^@n=@{l1^n}$ и $(@l2)^@n=@{l2^n}$.'
      - 'След равен сумме собственных значений.'
      - 'Получаем $@{l1^n}+(@{l2^n})=@{l1^n+l2^n}$.'
  p3:
    k: num
    lv: 2
    v: {l: [2, 3, -2], n: 2..4}
    c: ['l^n != n*l']
    q: 'Вектор $\mathbf{v}$ — собственный для $A$ со значением $@l$. Найди собственное значение $A^@n$ для того же вектора.'
    a: l^n
    tol: 0
    e: {la.diag.pow: n*l}
    h: ['$A^2\mathbf{v}=A(\lambda\mathbf{v})=\lambda^2\mathbf{v}$.']
    sol:
      - 'Применим $A$ ещё раз: $A^2\mathbf{v}=\lambda A\mathbf{v}=\lambda^2\mathbf{v}$.'
      - 'Так и далее: $A^n\mathbf{v}=\lambda^n\mathbf{v}$.'
      - 'Значение $(@l)^@n=@{l^n}$.'
  p4:
    k: mc
    q: 'Всякая ли квадратная матрица диагонализуема?'
    a: 'Нет: например, у $\begin{pmatrix}1&1\\0&1\end{pmatrix}$ один независимый собственный вектор'
    e: {la.diag.defective: 'Да: у каждой матрицы есть базис из собственных векторов'}
    x: ['Да, если определитель не нуль']
    h: ['Найди собственные векторы указанной матрицы.']
  p5:
    k: num
    lv: 2
    v: {l: 2..4}
    q: 'Сколько независимых собственных векторов у матрицы $\begin{pmatrix}@l&1\\0&@l\end{pmatrix}$?'
    a: 1
    tol: 0
    e: {la.diag.defective: 2}
    h: ['Реши $(A-\lambda I)\mathbf{v}=\mathbf{0}$ при $\lambda=@l$.']
    sol:
      - 'Собственное значение одно: $\lambda=@l$ (двойной корень).'
      - '$A-@{l}I=\begin{pmatrix}0&1\\0&0\end{pmatrix}$, система даёт $y=0$.'
      - 'Решения $(x, 0)$ образуют одно направление: независимый вектор один.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $A^3$ для $A=\operatorname{diag}(2, 3)$.'
    steps:
      - 'Матрица $A=\operatorname{diag}(2, 3)$ диагональна'
      - 'Степень диагональной матрицы возводит в степень диагональные элементы'
      - '$A^3=\operatorname{diag}(8, 27)$'
      - 'Элемент $(1, 1)$ матрицы $A^3$ равен $8$'
    bad:
      - {i: 3, t: '$A^3=\operatorname{diag}(6, 9)$', e: la.diag.pow}
      - {i: 4, t: 'Элемент $(1, 1)$ матрицы $A^3$ равен $6$'}
err: [la.diag.pow, la.diag.defective]
sum:
  - 'Умею применять $A^n=PD^nP^{-1}$: собственные значения возводятся в степень.'
  - 'Отличаю диагонализуемые матрицы от недиагонализуемых: нужно $n$ независимых собственных векторов.'
