id: la.space
int:
  - 'Прямая, проходящая через начало координат, обладает свойством: сумма двух её векторов и любое кратное остаются на ней. Прямая, не проходящая через нуль, этим не обладает.'
  - {ask: 'Возьми прямую $y=x+1$. Сложи два вектора с неё. Остался ли результат на прямой?', ans: 'Нет: $(0, 1)+(1, 2)=(1, 3)$, а $3\ne1+1$. Прямая сдвинута от нуля, замкнутости нет.'}
  - 'Множество с такими свойствами — подпространство. В нём можно складывать и умножать на числа, не выходя за его границы.'
def:
  - {g: subspace}
ex:
  - {x: p4, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 3..6}
    q: 'Найди размерность подпространства векторов $(x_1, \dots, x_@n)$ с условием $x_1+\dots+x_@n=0$.'
    a: n-1
    tol: 0
    h: ['Одна переменная выражается через остальные.']
  p2:
    k: mc
    q: 'Является ли подпространством плоскости множество $\{(x, y):\ x+y=1\}$?'
    a: 'Нет: оно не содержит нулевой вектор'
    e: {la.space.zero: 'Да: это прямая, а прямая — подпространство'}
    x: ['Да, оно замкнуто относительно сложения']
    h: ['Подставь $(0, 0)$.']
  p3:
    k: mc
    lv: 2
    q: 'Является ли подпространством плоскости объединение осей $\{(x, 0)\}\cup\{(0, y)\}$?'
    a: 'Нет: $(1, 0)+(0, 1)=(1, 1)$ не лежит в объединении'
    e: {la.space.union: 'Да: объединение подпространств — подпространство'}
    x: ['Да, если оси перпендикулярны']
    h: ['Сложи по одному вектору с каждой оси.']
  p4:
    k: num
    lv: 2
    v: {n: 4..7, m: 2..4}
    q: 'Найди размерность подпространства векторов $(x_1, \dots, x_@n)$, у которых первые $@m$ @{m:w=координата,координаты,координат} равны между собой.'
    a: n-m+1
    tol: 0
    h: ['Свободных параметров: общее значение первых координат и остальные.']
    sol:
      - 'Первые $@m$ @{m:w=координата,координаты,координат} задаются одним числом.'
      - 'Остальные $@{n-m}$ @{n-m:w=координата,координаты,координат} свободны.'
      - 'Размерность равна $1+@{n-m}=@{n-m+1}$.'
  p5:
    k: mc
    lv: 2
    q: 'Образует ли множество решений однородной системы $A\mathbf{x}=\mathbf{0}$ подпространство?'
    a: 'Да: оно содержит $\mathbf{0}$ и замкнуто относительно сложения и умножения'
    x: ['Нет, это только одна точка', 'Только если решение единственно']
    h: ['Если $A\mathbf{x}=\mathbf{0}$ и $A\mathbf{y}=\mathbf{0}$, чему равно $A(\mathbf{x}+\mathbf{y})$?']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при проверке, что $\{(x, y):\ y=2x\}$ — подпространство.'
    steps:
      - 'Нулевой вектор лежит в множестве: $0=2\cdot0$'
      - 'Сумма: из $y_1=2x_1$ и $y_2=2x_2$ следует $y_1+y_2=2(x_1+x_2)$'
      - 'Умножение на $k$: $ky=2(kx)$'
      - 'Все три условия выполнены, это подпространство'
    bad:
      - {i: 1, t: 'Нулевой вектор можно не проверять: он лежит в любом множестве', e: la.space.zero}
      - {i: 2, t: 'Сумма: $y_1+y_2=2x_1+x_2$'}
err: [la.space.zero, la.space.union]
sum:
  - 'Умею проверять три условия подпространства: нуль, сумма, умножение на число.'
  - 'Отличаю подпространства от прямой вне начала координат и от объединения осей.'
