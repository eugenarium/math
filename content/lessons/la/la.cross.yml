id: la.cross
int:
  - 'Два вектора в пространстве задают параллелограмм и направление, перпендикулярное его плоскости. Хочется получить из них вектор, который кодирует и то, и другое.'
  - {ask: 'Чему равна площадь параллелограмма на векторах $(1,0,0)$ и $(0,1,0)$?', ans: 'Единице: это единичный квадрат. Вектор, перпендикулярный обоим, — $(0,0,1)$, его длина тоже 1.'}
  - 'Векторное произведение $\mathbf a\times\mathbf b$ — вектор длины «площадь» перпендикулярно обоим множителям. Смешанное произведение даёт объём.'
def:
  - {g: cross-product}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {a1: -4..4, a2: -4..4, b1: -4..4, b2: -4..4}
    c: ['a1*b2-a2*b1 != 0']
    q: 'Найди третью компоненту $\mathbf a\times\mathbf b$ для $\mathbf a=(@a1,@a2,0)$, $\mathbf b=(@b1,@b2,0)$.'
    a: a1*b2-a2*b1
    e: {la.cross.order: a2*b1-a1*b2}
    h: ['$z=a_1b_2-a_2b_1$.']
  p2:
    k: num
    v: {a1: 1..5, a2: 1..5, b1: 1..5, b2: 1..5}
    c: ['a1*b2 != a2*b1', 'a1*b1+a2*b2 != abs(a1*b2-a2*b1)']
    q: 'Найди площадь параллелограмма, построенного на векторах $(@a1,@a2)$ и $(@b1,@b2)$.'
    a: abs(a1*b2-a2*b1)
    e: {la.cross.dot: a1*b1+a2*b2}
    sol:
      - 'Площадь равна модулю определителя из векторов.'
      - 'Вычислим: $@a1\cdot@b2-@a2\cdot@b1=@{a1*b2-a2*b1}$.'
      - 'Итог: площадь равна $@{abs(a1*b2-a2*b1)}$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..4, c: 1..4, f: 1..4, b: -3..3, d: -3..3, e: -3..3}
    q: 'Найди объём параллелепипеда на векторах $(@a,0,0)$, $(@b,@c,0)$, $(@d,@e,@f)$.'
    a: a*c*f
    sol:
      - 'Объём равен модулю определителя из векторов.'
      - 'Матрица треугольная: определитель равен произведению диагонали $@a\cdot@c\cdot@f$.'
      - 'Итог: объём $@{a*c*f}$.'
  p4:
    k: mc
    q: 'Результат $\mathbf a\times\mathbf b$ — это'
    a: 'вектор, перпендикулярный обоим'
    e: {la.cross.scalar: 'число, как у скалярного произведения'}
    x: ['вектор, лежащий в плоскости $\mathbf a$ и $\mathbf b$']
  p5:
    k: mc
    lv: 2
    q: 'Как изменится $\mathbf a\times\mathbf b$, если поменять множители местами?'
    a: 'Сменит знак'
    e: {la.cross.order: 'Не изменится'}
    x: ['Станет нулевым вектором']
    h: ['Вспомни ориентацию: правая тройка станет левой.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $(1,2,3)\times(4,5,6)$.'
    steps:
      - 'Первая компонента: $2\cdot6-3\cdot5=-3$'
      - 'Вторая компонента: $3\cdot4-1\cdot6=6$'
      - 'Третья компонента: $1\cdot5-2\cdot4=-3$'
      - 'Проверка: $(1,2,3)\cdot(-3,6,-3)=-3+12-9=0$, вектор перпендикулярен $\mathbf a$'
    bad:
      - {i: 2, t: 'Вторая компонента: $1\cdot6-3\cdot4=-6$', e: la.cross.order}
      - {i: 3, t: 'Третья компонента: $1\cdot4-2\cdot5=-6$'}
err: [la.cross.order, la.cross.scalar, la.cross.dot]
sum:
  - 'Умею вычислять компоненты векторного произведения и площадь параллелограмма.'
  - 'Умею находить объём параллелепипеда через определитель.'
  - 'Отличаю векторное произведение (вектор) от скалярного (число).'
