id: la.cob
int:
  - 'Адрес «3 квартала на восток, 1 на север» зависит от выбранной системы направлений. Если улицы идут по диагонали, те же числа описывают другую точку. Координаты вектора зависят от базиса.'
  - {ask: 'В базисе $\mathbf{b}_1=(1, 1)$, $\mathbf{b}_2=(1, -1)$ вектор имеет координаты $(2, 1)$. Какой это вектор в стандартных координатах?', ans: '$2(1, 1)+1(1, -1)=(3, 1)$. Те же числа $(2, 1)$ в новом базисе — другая точка.'}
  - 'Новые базисные векторы записывают в столбцы матрицы $P$. Она собирает стандартный вектор из новых координат.'
def:
  - {g: change-of-basis}
ex:
  - {x: p5, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {P: umat 2 -2..2, a: -3..3 !0, b: -3..3 !0}
    c: ['P[1,2] != P[2,1]']
    q: 'Базис: $\mathbf{b}_1=@{[P[1,1], P[2,1]]:m}$, $\mathbf{b}_2=@{[P[1,2], P[2,2]]:m}$. Найди первую стандартную координату вектора с координатами $(@a, @b)$ в этом базисе.'
    a: P[1,1]*a+P[1,2]*b
    tol: 0
    e: {la.cob.rows: 'P[1,1]*a+P[2,1]*b'}
    h: ['Вектор равен $a\mathbf{b}_1+b\mathbf{b}_2$.']
  p2:
    k: num
    lv: 2
    v: {P: umat 2 -2..2, m: -3..3 !0, n: -3..3 !0, D: '=P[1,1]*P[2,2]-P[1,2]*P[2,1]'}
    c: ['P[1,1]*m+P[1,2]*n != (P[2,2]*m-P[1,2]*n)/D']
    q: 'Базис: $\mathbf{b}_1=@{[P[1,1], P[2,1]]:m}$, $\mathbf{b}_2=@{[P[1,2], P[2,2]]:m}$. Найди первую координату вектора $(@m, @n)$ в этом базисе.'
    a: (P[2,2]*m-P[1,2]*n)/D
    tol: 0
    e: {la.cob.direction: 'P[1,1]*m+P[1,2]*n'}
    h: ['Новые координаты равны $P^{-1}\mathbf{x}$.']
    sol:
      - 'Матрица перехода $P=@{P:m}$, $\det P=@D$.'
      - 'Первая строка $P^{-1}$: $\frac{1}{@D}(@{P[2,2]},\ @{-P[1,2]})$.'
      - 'Первая координата: $\frac{@{P[2,2]*m-P[1,2]*n}}{@D}=@{(P[2,2]*m-P[1,2]*n)/D}$.'
  p3:
    k: mc
    q: 'Что стоит в столбцах матрицы перехода $P$ к новому базису?'
    a: 'Новые базисные векторы в стандартных координатах'
    e: {la.cob.direction: 'Старые базисные векторы в новых координатах'}
    x: ['Координаты вектора $\mathbf{x}$']
    h: ['Первый столбец — образ вектора $\mathbf{e}_1$ при $P$.']
  p4:
    k: mc
    lv: 2
    q: 'Какая формула связывает стандартные координаты $\mathbf{x}$ и новые координаты $\mathbf{x}''$?'
    a: '$\mathbf{x}=P\mathbf{x}''$'
    e: {la.cob.direction: '$\mathbf{x}''=P\mathbf{x}$'}
    x: ['$\mathbf{x}=P^{T}\mathbf{x}''$']
    h: ['Подставь $\mathbf{x}''=(1, 0)$: получится первый новый базисный вектор.']
  p5:
    k: num
    lv: 2
    v: {m: 2..6, n: -3..3 !0}
    q: 'В базисе $\mathbf{b}_1=(1, 0)$, $\mathbf{b}_2=(1, 1)$ найди первую координату вектора $(@m, @n)$.'
    a: m-n
    tol: 0
    h: ['Реши $a(1, 0)+b(1, 1)=(@m, @n)$.']
    sol:
      - 'Покоординатно: $a+b=@m$ и $b=@n$.'
      - 'Из второго уравнения $b=@n$.'
      - 'Тогда $a=@m-(@n)=@{m-n}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при переходе к базису $\mathbf{b}_1=(1, 1)$, $\mathbf{b}_2=(1, -1)$ для вектора $\mathbf{x}=(3, 1)$.'
    steps:
      - 'Столбцы матрицы перехода — новые базисные векторы: $P=\begin{pmatrix}1&1\\1&-1\end{pmatrix}$'
      - 'Стандартные координаты выражаются так: $\mathbf{x}=P\mathbf{x}''$'
      - 'Значит, $\mathbf{x}''=P^{-1}\mathbf{x}$'
      - 'Для $\mathbf{x}=(3, 1)$ получаем $\mathbf{x}''=(2, 1)$'
    bad:
      - {i: 2, t: 'Новые координаты выражаются так: $\mathbf{x}''=P\mathbf{x}$', e: la.cob.direction}
      - {i: 1, t: 'Строки матрицы перехода — новые базисные векторы: $P=\begin{pmatrix}1&1\\1&-1\end{pmatrix}$', e: la.cob.rows}
err: [la.cob.direction, la.cob.rows]
sum:
  - 'Умею собирать стандартный вектор по новым координатам: $\mathbf{x}=P\mathbf{x}''$.'
  - 'Умею находить новые координаты через $P^{-1}$.'
  - 'Умею записывать базисные векторы в столбцы матрицы перехода.'
