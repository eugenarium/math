id: la.cplx
int:
  - 'Поворот плоскости на $90^\circ$ меняет направление любого вектора. Значит, у него нет собственных направлений. Но собственные значения у него всё равно есть — комплексные.'
  - {ask: 'Матрица $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$ поворачивает на $90^\circ$. Какое уравнение даёт её собственные значения?', ans: '$\lambda^2+1=0$, то есть $\lambda=\pm i$. Вещественных корней нет, как и вещественных собственных направлений.'}
  - 'Матрица $\begin{pmatrix}a&-b\\b&a\end{pmatrix}$ имеет собственные значения $a\pm bi$: поворот на угол числа $a+bi$ с растяжением в его модуль.'
def:
  - {g: complex-eigenvalues}
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {t: 1..3}
    q: 'Матрица $\begin{pmatrix}@{3*t}&@{-4*t}\\@{4*t}&@{3*t}\end{pmatrix}$ растягивает векторы в $|\lambda|$ раз. Найди $|\lambda|$.'
    a: 5*t
    e: {la.cplx.real-part: 3*t}
    h: ['Собственные значения $@{3*t}\pm@{4*t}i$; найди модуль.']
  p2:
    k: num
    fast: 1
    v: {a: -4..4, b: 1..5}
    q: 'Найди вещественную часть собственных значений матрицы $\begin{pmatrix}@a&@{-b}\\@b&@a\end{pmatrix}$.'
    a: a
    h: ['Собственные значения равны $a\pm bi$.']
    sol:
      - 'Собственные значения матрицы $\begin{pmatrix}a&-b\\b&a\end{pmatrix}$ равны $a\pm bi$.'
      - 'Здесь $a=@a$, $b=@b$: значения $@a\pm@b i$.'
      - 'Вещественная часть равна $@a$.'
  p3:
    k: num
    lv: 2
    v: {u: -3..3, s: 2..5}
    q: 'Найди положительную мнимую часть собственных значений матрицы $\begin{pmatrix}@u&@{-s^2}\\1&@u\end{pmatrix}$.'
    a: s
    e: {la.cplx.disc: s^2}
    sol:
      - 'След $@{2*u}$, определитель $@{u^2+s^2}$.'
      - 'Дискриминант: $@{4*u^2}-4\cdot@{u^2+s^2}=@{-4*s^2}<0$.'
      - 'Корни $@u\pm i\sqrt{@{s^2}}$, то есть $@u\pm@s\,i$.'
  p4:
    k: mc
    q: 'Есть ли у матрицы поворота на $90^\circ$ вещественные собственные векторы?'
    a: 'Нет: ни один ненулевой вектор не сохраняет направление'
    e: {la.cplx.real-vec: 'Да: любой вектор, так как длина не меняется'}
    x: ['Да: только векторы осей']
  p5:
    k: mc
    lv: 2
    v: {a: [1, 2, 3], b: [1, 2, 3]}
    q: 'Что делает матрица $\begin{pmatrix}@a&@{-b}\\@b&@a\end{pmatrix}$ с вектором?'
    a: 'Поворачивает на угол числа $@a+@{b}i$ и растягивает в $\sqrt{@{a^2+b^2}}$ раз'
    x: ['Только поворачивает, не меняя длину', 'Растягивает вдоль осей в $@a$ и $@b$ раз']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании матрицы $A=\begin{pmatrix}0&-2\\2&0\end{pmatrix}$.'
    steps:
      - 'Характеристическое уравнение $\lambda^2+4=0$'
      - 'Корни $\lambda=\pm2i$'
      - 'Модуль $|\lambda|=2$: поворот на $90^\circ$ и растяжение в $2$ раза'
      - 'Вещественных собственных векторов нет'
    bad:
      - {i: 2, t: 'Корни $\lambda=\pm2$', e: la.cplx.real-vec}
      - {i: 3, t: 'Модуль $|\lambda|=4$: поворот на $90^\circ$ и растяжение в $4$ раза'}
err: [la.cplx.real-part, la.cplx.disc, la.cplx.real-vec]
sum:
  - 'Умею находить комплексные собственные значения матрицы $\begin{pmatrix}a&-b\\b&a\end{pmatrix}$.'
  - 'Умею находить модуль собственного значения и объяснять поворот с растяжением.'
  - 'Отличаю отсутствие вещественных собственных векторов от отсутствия собственных значений.'
