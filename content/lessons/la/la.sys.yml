id: la.sys
int:
  - 'Билет в кино стоит $x$ рублей, а в театр $y$. Два чека: «$x+y=5$» и «$x-y=1$». Цены можно найти, если исключить одну из неизвестных.'
  - {ask: 'Сложи два чека. Что останется, и чему равны $x$ и $y$?', ans: 'Получим $2x=6$, значит $x=3$, затем $y=2$. Сложение исключило $y$.'}
  - 'Метод Гаусса — это те же сложения и вычитания уравнений, пока не останется уравнение с одной неизвестной. Иногда получается $0=0$ или $0=3$, и это тоже ответ.'
  - {ask: 'Сколько решений у системы $x+y=1$, $2x+2y=2$?', ans: 'Бесконечно много: второе уравнение — первое, умноженное на $2$.'}
def:
  - {g: gauss-elimination}
  - {g: solution-set}
  - 'Как решать. Сложи или вычти уравнения так, чтобы исчезла одна неизвестная. Найди вторую и подставь обратно. Если появилось $0=c\ne0$, система несовместна; если $0=0$, решений бесконечно много.'
ex:
  - {x: p2, seed: 2}
  - {x: p5, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {x0: 1..6, y0: 1..6}
    q: 'Реши систему $x+y=@{x0+y0}$, $x-y=@{x0-y0}$. Найди $x$.'
    a: x0
    tol: 0
    h: ['Сложи уравнения: получится $2x$.']
  p2:
    k: num
    lv: 2
    v: {M: umat 2 -3..3, x0: -3..3 !0, y0: -3..3 !0, r1: '=M[1,1]*x0+M[1,2]*y0', r2: '=M[2,1]*x0+M[2,2]*y0', D: '=M[1,1]*M[2,2]-M[1,2]*M[2,1]'}
    c: ['abs(M[1,1]*M[1,2]*M[2,1]*M[2,2]) > 0']
    q: 'Реши систему $@{M[1,1]:c}x@{M[1,2]:sc}y=@r1$, $@{M[2,1]:c}x@{M[2,2]:sc}y=@r2$. Найди $y$.'
    a: y0
    tol: 0
    h: ['Умножь уравнения на подходящие числа, чтобы коэффициенты при $x$ совпали, и вычти.']
    sol:
      - 'Умножим первое уравнение на $@{M[2,1]}$, второе на $@{M[1,1]}$.'
      - 'Вычтем: $(@{M[1,1]*M[2,2]-M[2,1]*M[1,2]})y=@{M[1,1]*r2-M[2,1]*r1}$.'
      - 'Отсюда $y=@y0$.'
  p3:
    k: mc
    lv: 2
    q: 'После исключения неизвестных остались строки $x+y=2$ и $0=3$. Что можно сказать о решениях?'
    a: 'Решений нет'
    e: {la.sys.contradiction: 'Решений бесконечно много'}
    x: ['Решение единственно', 'Решением является $x=3$']
    h: ['Равенство $0=3$ неверно при любых $x$ и $y$.']
  p4:
    k: mc
    q: 'После исключения остались строки $x+y=2$ и $0=0$. Что можно сказать о решениях?'
    a: 'Решений бесконечно много'
    e: {la.sys.zero-row: 'Решений нет'}
    x: ['Решение единственно']
    h: ['Равенство $0=0$ верно всегда, значит оно лишнее.']
  p5:
    k: num
    lv: 2
    v: {m: 2..5}
    q: 'При каком $k$ система $x+ky=1$, $@{m}x+@{2*m}y=@m$ имеет бесконечно много решений?'
    a: 2
    tol: 0
    h: ['Второе уравнение должно получаться из первого умножением на $@m$.']
    sol:
      - 'Разделим второе уравнение на $@m$: $x+2y=1$.'
      - 'Чтобы уравнения совпали, нужно $k=2$.'
      - 'Тогда два уравнения одинаковы и решений бесконечно много.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при решении системы $x+y=2$, $2x+2y=5$.'
    steps:
      - 'Вычтем из второго уравнения первое, умноженное на $2$: $0=1$'
      - 'Равенство $0=1$ ложно ни при каких $x$, $y$'
      - 'Значит, система несовместна'
    bad:
      - {i: 3, t: 'Значит, система имеет бесконечно много решений', e: la.sys.contradiction}
      - {i: 1, t: 'Вычтем из второго уравнения первое, умноженное на $2$: $0=0$'}
err: [la.sys.contradiction, la.sys.zero-row]
sum:
  - 'Умею решать системы $2\times2$ исключением неизвестных.'
  - 'Отличаю $0=c$ (решений нет) от $0=0$ (лишнее уравнение).'
  - 'Умею различать три случая: одно решение, нет решений, бесконечно много.'
