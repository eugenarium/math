id: la.vec
int:
  - 'Прогулка: сначала $3$ шага на восток и $1$ на север, затем $2$ шага на восток и $4$ на север. Это сложение двух векторов, а итог описывается тоже вектором.'
  - {ask: 'Сколько шагов на восток и на север в сумме? Что будет, если пройти первый отрезок дважды?', ans: 'Сумма $(5, 5)$. Дважды первый отрезок: $(6, 2)$, то есть умножаем каждую координату на $2$.'}
  - 'Комбинируя два вектора с числовыми коэффициентами, получаем линейную комбинацию. Вопрос: какие точки можно достичь?'
  - {ask: 'Чему равно $2(1,3)-(2,1)$?', ans: '$(0,5)$: $(2,6)-(2,1)=(0,5)$, действия идут покоординатно.'}
def:
  - {g: vector}
  - {g: linear-combination}
  - 'Как решать. Складывай и умножай координаты отдельно: $a\mathbf u+b\mathbf v=(au_1+bv_1,\ au_2+bv_2)$. Чтобы найти коэффициенты линейной комбинации, составь по уравнению на каждую координату и реши систему.'
ex:
  - {x: p3, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {u: vec 2 -4..4, k: 2..5}
    c: ['u[2] != 0']
    q: 'Найди сумму координат вектора $@{k}\mathbf{u}$, где $\mathbf{u}=@{u:m}$.'
    a: k*(u[1]+u[2])
    tol: 0
    e: {la.vec.scalar-one: 'k*u[1]+u[2]'}
    h: ['Умножь на $@k$ обе координаты и сложи.']
  p2:
    k: num
    lv: 2
    v: {u: vec 2 -4..4, v: vec 2 -4..4, a: 2..4, b: -3..-2}
    c: ['v[1] != 0']
    q: 'Найди первую координату вектора $@{a}\mathbf{u}@{b:sc}\mathbf{v}$, где $\mathbf{u}=@{u:m}$, $\mathbf{v}=@{v:m}$.'
    a: a*u[1]+b*v[1]
    tol: 0
    e: {la.vec.scalar-one: 'a*u[1]+v[1]'}
    h: ['Умножь каждый вектор на свой коэффициент, затем сложи первые координаты.']
    sol:
      - 'Первая координата первого слагаемого: $@a\cdot(@{u[1]})=@{a*u[1]}$.'
      - 'Первая координата второго слагаемого: $(@{b})\cdot(@{v[1]})=@{b*v[1]}$.'
      - 'Сумма равна $@{a*u[1]+b*v[1]}$.'
  p3:
    k: num
    lv: 2
    v: {u: vec 2 -3..3, v: vec 2 -3..3, a: -3..3 !0, b: -3..3 !0, w: '=a*u+b*v'}
    c: ['u[1]*v[2]-u[2]*v[1] != 0']
    q: 'Вектор $\mathbf{w}=@{w:m}$ равен $a\mathbf{u}+b\mathbf{v}$, где $\mathbf{u}=@{u:m}$ и $\mathbf{v}=@{v:m}$. Найди $a$.'
    a: a
    tol: 0
    h: ['Запиши равенство покоординатно и реши систему относительно $a$ и $b$.']
    sol:
      - 'Первая координата: $@{u[1]:c}a@{v[1]:sc}b=@{w[1]}$. Вторая: $@{u[2]:c}a@{v[2]:sc}b=@{w[2]}$.'
      - 'Исключим $b$: умножим первое уравнение на $@{v[2]}$, второе на $@{v[1]}$ и вычтем.'
      - 'Получим $@{u[1]*v[2]-u[2]*v[1]}\,a=@{w[1]*v[2]-w[2]*v[1]}$, откуда $a=@a$.'
  p4:
    k: mc
    v: {k: 2..5}
    q: 'Какие точки плоскости можно получить как $a\mathbf{u}+b\mathbf{v}$ при $\mathbf{u}=(1, 2)$, $\mathbf{v}=(@k, @{2*k})$?'
    a: 'Только точки одной прямой'
    e: {la.vec.span-all: 'Все точки плоскости'}
    x: ['Только начало координат']
    h: ['Заметь, что $\mathbf{v}=@{k:c}\mathbf{u}$.']
  p5:
    k: mc
    lv: 2
    q: 'Является ли нулевой вектор линейной комбинацией любых двух векторов $\mathbf{u}$, $\mathbf{v}$?'
    a: 'Да: достаточно взять оба коэффициента равными нулю'
    x: ['Нет, только для коллинеарных векторов', 'Нет, только если $\mathbf{u}=-\mathbf{v}$']
    h: ['Подставь $a=0$, $b=0$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $2\mathbf{u}-\mathbf{v}$ для $\mathbf{u}=(1, 3)$, $\mathbf{v}=(4, -1)$.'
    steps:
      - 'Умножим $\mathbf{u}$ на $2$: $2\mathbf{u}=(2, 6)$'
      - 'Вычтем $\mathbf{v}$ покоординатно: $(2-4,\ 6-(-1))$'
      - 'Получим $(-2, 7)$'
    bad:
      - {i: 1, t: 'Умножим $\mathbf{u}$ на $2$: $2\mathbf{u}=(2, 3)$', e: la.vec.scalar-one}
      - {i: 3, t: 'Получим $(-2, 5)$'}
err: [la.vec.scalar-one, la.vec.span-all]
sum:
  - 'Умею складывать векторы и умножать их на число покоординатно.'
  - 'Умею находить коэффициенты линейной комбинации.'
  - 'Умею находить, где лежат комбинации коллинеарных векторов: на одной прямой.'
