id: la.quad
int:
  - 'Прогиб чаши и седло описываются формулами $x^2+y^2$ и $x^2-y^2$. Первая всегда положительна, вторая меняет знак. Как узнать это по коэффициентам?'
  - {ask: 'Положительна ли форма $x^2+4xy+y^2$ при $x=1$, $y=-1$?', ans: 'Нет: $1-4+1=-2$. Хотя коэффициенты при квадратах положительны, слагаемое $4xy$ может перевесить.'}
  - 'Форму $ax^2+2bxy+cy^2$ записывают симметричной матрицей, а её знак читают по числам $a$ и $ac-b^2$.'
def:
  - {g: quadratic-form}
  - {g: definiteness}
ex:
  - {x: p2, seed: 3}
  - {x: p4, seed: 7}
pr:
  p1:
    k: num
    fast: 1
    v: {a: 1..4, c: 1..4, k: [-6, -4, -2, 2, 4, 6]}
    q: 'Форма $Q=@{a:c}x^2@{k:sc}xy@{c:sc}y^2$. Найди недиагональный элемент $b$ её симметричной матрицы.'
    a: k/2
    e: {la.quad.offdiag: k}
    h: ['Слагаемое $xy$ получается в сумме $bxy+byx$.']
  p2:
    k: num
    v: {a: 1..3, b: -2..2, c: 1..3, x0: -2..2, y0: 1..3}
    q: 'Матрица формы $A=\begin{pmatrix}@a&@b\\@b&@c\end{pmatrix}$. Найди $Q=\mathbf x^TA\mathbf x$ при $\mathbf x=(@x0,@y0)$.'
    a: a*x0^2+2*b*x0*y0+c*y0^2
    sol:
      - '$A\mathbf x=(@{a*x0+b*y0},\ @{b*x0+c*y0})$.'
      - 'Скалярное произведение с $\mathbf x$: $@x0\cdot(@{a*x0+b*y0})+@y0\cdot(@{b*x0+c*y0})$.'
      - 'Итог: $Q=@{a*x0^2+2*b*x0*y0+c*y0^2}$.'
  p3:
    k: mc
    q: 'Форма с матрицей $\begin{pmatrix}a&b\\b&c\end{pmatrix}$ положительно определена тогда и только тогда, когда'
    a: '$a>0$ и $ac-b^2>0$'
    e: {la.quad.det-only: '$ac-b^2>0$', la.quad.diag: '$a>0$ и $c>0$'}
    h: ['Проверь на матрице $\begin{pmatrix}-1&0\\0&-1\end{pmatrix}$.']
  p4:
    k: num
    lv: 2
    v: {m: 2..5}
    q: 'При скольких целых $t$ форма $x^2+2txy+@{m^2}y^2$ положительно определена?'
    a: 2*m-1
    sol:
      - 'Матрица $\begin{pmatrix}1&t\\t&@{m^2}\end{pmatrix}$: $a=1>0$.'
      - 'Нужно $\det=@{m^2}-t^2>0$, то есть $|t|<@m$.'
      - 'Целые $t$ от $@{-m+1}$ до $@{m-1}$: их $@{2*m-1}$.'
  p5:
    k: mc
    lv: 2
    v: {b: [2, 3, 4]}
    q: 'Какая форма $Q=x^2+@{2*b}xy+y^2$?'
    a: 'Неопределённая'
    e: {la.quad.diag: 'Положительно определённая'}
    x: ['Отрицательно определённая']
    h: ['Найди $\det$ матрицы и вспомни знак при $x=1$, $y=-1$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании формы $Q=2x^2-4xy+5y^2$.'
    steps:
      - 'Матрица формы $A=\begin{pmatrix}2&-2\\-2&5\end{pmatrix}$'
      - 'Первый минор $\Delta_1=2>0$'
      - 'Второй минор $\Delta_2=2\cdot5-(-2)^2=6>0$'
      - 'Оба минора положительны, значит, форма положительно определена'
    bad:
      - {i: 1, t: 'Матрица формы $A=\begin{pmatrix}2&-4\\-4&5\end{pmatrix}$', e: la.quad.offdiag}
      - {i: 3, t: 'Второй минор $\Delta_2=2\cdot5+(-2)^2=14>0$'}
err: [la.quad.offdiag, la.quad.det-only, la.quad.diag]
sum:
  - 'Умею записывать квадратичную форму симметричной матрицей.'
  - 'Умею вычислять значение формы $\mathbf x^TA\mathbf x$.'
  - 'Умею определять знакоопределённость по критерию $a>0$, $ac-b^2>0$.'
