id: la.inv
int:
  - 'Матрица $A$ превращает вектор $\mathbf{x}$ в $A\mathbf{x}$. Можно ли вернуться назад? Нужна матрица, которая отменяет действие $A$.'
  - {ask: 'Диагональная матрица $\operatorname{diag}(2, 5)$ растягивает ось $x$ в $2$ раза, $y$ в $5$. Как её отменить?', ans: 'Сжать оси в $2$ и $5$ раз: $\operatorname{diag}(\frac12, \frac15)$. Это и есть обратная матрица.'}
  - 'Не у каждой матрицы есть обратная: нельзя вернуть назад отображение, которое сплющило плоскость в прямую. Для $2\times2$ обратная есть, когда $\det A\ne0$.'
  - {ask: 'Существует ли обратная к $\begin{pmatrix}1&2\\2&4\end{pmatrix}$?', ans: 'Нет: определитель равен нулю, строки пропорциональны.'}
def:
  - {g: inverse-matrix}
  - 'Как решать. Для $2\times2$: $A^{-1}=\frac1{\det A}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$. Сначала проверь, что $\det A\ne0$. Для произведения порядок обращается: $(AB)^{-1}=B^{-1}A^{-1}$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: [2, 4, 5], d: [2, 4, 5]}
    q: 'Найди элемент $(1, 1)$ матрицы, обратной к $\operatorname{diag}(@a, @d)$.'
    a: 1/a
    tol: 0.002
    h: ['Обратная к диагональной — диагональная с числами $\frac{1}{a}$, $\frac{1}{d}$.']
  p2:
    k: num
    lv: 2
    v: {A: umat 2 -3..3, D: '=A[1,1]*A[2,2]-A[1,2]*A[2,1]'}
    c: ['A[1,1] != A[2,2]']
    q: 'Найди элемент $(1, 1)$ матрицы $A^{-1}$ для $A=@{A:m}$.'
    a: A[2,2]/D
    tol: 0
    e: {la.inv.formula: 'A[1,1]/D'}
    h: ['В обратной матрице диагональные элементы меняются местами.']
    sol:
      - 'Определитель: $\det A=@{A[1,1]}\cdot(@{A[2,2]})-(@{A[1,2]})(@{A[2,1]})=@D$.'
      - 'Формула: $A^{-1}=\frac{1}{\det A}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$.'
      - 'Элемент $(1, 1)$ равен $\frac{d}{\det A}=\frac{@{A[2,2]}}{@D}=@{A[2,2]/D}$.'
  p3:
    k: num
    lv: 2
    v: {A: mat 2x2 -3..3, D: '=A[1,1]*A[2,2]-A[1,2]*A[2,1]'}
    c: ['D != 0', 'A[1,2] != 0']
    q: 'Найди элемент $(1, 2)$ матрицы $A^{-1}$ для $A=@{A:m}$.'
    a: -A[1,2]/D
    tol: 0.005
    e: {la.inv.formula: 'A[1,2]/D'}
    h: ['У недиагональных элементов знак меняется.']
    sol:
      - 'Определитель: $\det A=@D$.'
      - 'Элемент $(1, 2)$ обратной: $-\frac{b}{\det A}$, где $b=@{A[1,2]}$.'
      - 'Получаем $\frac{@{-A[1,2]}}{@D}=@{-A[1,2]/D:f3}$.'
  p4:
    k: mc
    q: 'Чему равна $(AB)^{-1}$ для обратимых $A$ и $B$?'
    a: '$B^{-1}A^{-1}$'
    e: {la.inv.order: '$A^{-1}B^{-1}$'}
    x: ['$A^{-1}+B^{-1}$']
    h: ['Отменяют действия в обратном порядке.']
  p5:
    k: num
    lv: 2
    v: {d: [2, 4, 5]}
    q: 'Известно, что $\det A=@d$. Найди $\det A^{-1}$.'
    a: 1/d
    tol: 0.002
    h: ['Из $AA^{-1}=I$ получается $\det A\cdot\det A^{-1}=1$.']
    sol:
      - 'Из $AA^{-1}=I$: $\det A\cdot\det A^{-1}=\det I=1$.'
      - 'Значит, $\det A^{-1}=\frac{1}{\det A}$.'
      - 'Получаем $\frac{1}{@d}=@{1/d:f3}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при обращении $A=\begin{pmatrix}2&1\\5&3\end{pmatrix}$.'
    steps:
      - 'Определитель: $2\cdot3-1\cdot5=1$'
      - 'Диагональные элементы меняем местами: $3$ и $2$'
      - 'У недиагональных меняем знак: $-1$ и $-5$'
      - 'Итог: $A^{-1}=\begin{pmatrix}3&-1\\-5&2\end{pmatrix}$'
    bad:
      - {i: 3, t: 'Недиагональные элементы оставляем: $1$ и $5$', e: la.inv.formula}
      - {i: 1, t: 'Определитель: $2\cdot3-1\cdot5=11$'}
err: [la.inv.order, la.inv.formula]
sum:
  - 'Умею находить обратную матрицу $2\times2$ по формуле через определитель.'
  - 'Умею применять $(AB)^{-1}=B^{-1}A^{-1}$ и $\det A^{-1}=\frac{1}{\det A}$.'
