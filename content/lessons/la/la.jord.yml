id: la.jord
int:
  - 'У матрицы $\begin{pmatrix}2&1\\0&2\end{pmatrix}$ собственное значение $2$ повторяется дважды. Хватит ли ей двух независимых собственных векторов, как у $2I$?'
  - {ask: 'Сколько независимых решений у $(A-2I)\mathbf v=0$ для $A=\begin{pmatrix}2&1\\0&2\end{pmatrix}$?', ans: 'Одно: $A-2I=\begin{pmatrix}0&1\\0&0\end{pmatrix}$ даёт $v_2=0$. Матрица не диагонализуема.'}
  - 'Жорданова форма — замена диагональной формы для таких матриц: над диагональю могут стоять единицы, образуя клетки.'
  - {ask: 'Сколько клеток у $\begin{pmatrix}2&0\\0&2\end{pmatrix}$?', ans: 'Две: $A-2I=0$ имеет ранг $0$, ядро двумерно.'}
def:
  - {g: jordan-form}
  - 'Как решать. Найди собственные значения и кратности. Для каждого $\lambda$ вычисли $\dim\ker(A-\lambda I)=n-\mathrm{rank}(A-\lambda I)$: это число клеток. Если число клеток меньше кратности, матрица недиагонализуема.'
ex:
  - {x: p3, seed: 1}
  - {x: p2, seed: 5}
pr:
  p1:
    k: num
    fast: 1
    v: {l: 1..5}
    q: 'Найди число линейно независимых собственных векторов матрицы $\begin{pmatrix}@l&1\\0&@l\end{pmatrix}$.'
    a: 1
    e: {la.jord.diag: 2}
    h: ['Реши $(A-@l I)\mathbf v=0$.']
  p2:
    k: num
    fast: 1
    v: {n: [2, 3, 4]}
    q: 'Для жордановой клетки $J$ размера $@n$ с собственным значением $\lambda$ найди наименьшее $k$, при котором $(J-\lambda I)^k=0$.'
    a: n
    e: {la.jord.size: n-1}
    h: ['Матрица $J-\lambda I$ сдвигает цепочку базисных векторов на один шаг.']
    sol:
      - 'Матрица $N=J-\lambda I$ имеет единицы над диагональю и нули остальные.'
      - 'Каждое умножение на $N$ сдвигает цепочку на один шаг: $N^{k}$ обнуляет, когда $k$ равно размеру клетки.'
      - 'Итог: $k=@n$.'
  p3:
    k: num
    lv: 2
    v: {l: 1..5, r: [0, 1, 2]}
    q: 'У матрицы $3\times3$ единственное собственное значение $\lambda=@l$ кратности $3$, и $\mathrm{rank}(A-@l I)=@r$. Сколько клеток Жордана у $A$?'
    a: 3-r
    e: {la.jord.rank: r}
    sol:
      - 'Число клеток равно числу независимых собственных векторов, то есть $\dim\ker(A-@l I)$.'
      - 'Размерность ядра $3-\mathrm{rank}=3-@r$.'
      - 'Итог: @{3-r} @{3-r:w=клетка,клетки,клеток}.'
  p4:
    k: mc
    q: 'Диагонализуема ли всякая квадратная матрица над $\mathbb C$?'
    a: 'Нет: в общем случае нужна жорданова форма'
    e: {la.jord.diag: 'Да: собственных векторов всегда хватает'}
    x: ['Да, если она невырождена']
  p5:
    k: mc
    lv: 2
    q: 'Что верно для $A=\begin{pmatrix}2&1\\0&2\end{pmatrix}$?'
    a: 'Собственное значение $2$ кратности $2$, но один независимый собственный вектор'
    e: {la.jord.diag: 'Два независимых собственных вектора, матрица диагонализуема'}
    x: ['Собственных значений нет']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при поиске жордановой формы $A=\begin{pmatrix}3&1\\0&3\end{pmatrix}$.'
    steps:
      - 'Характеристический многочлен $(3-\lambda)^2$'
      - 'Единственное собственное значение $\lambda=3$ кратности $2$'
      - 'Матрица $A-3I=\begin{pmatrix}0&1\\0&0\end{pmatrix}$ имеет ранг $1$'
      - 'Значит, один собственный вектор и одна клетка $J_2(3)$'
    bad:
      - {i: 4, t: 'Значит, два собственных вектора и форма $\mathrm{diag}(3,3)$', e: la.jord.diag}
      - {i: 3, t: 'Матрица $A-3I=\begin{pmatrix}0&1\\0&0\end{pmatrix}$ имеет ранг $2$'}
err: [la.jord.diag, la.jord.size, la.jord.rank]
sum:
  - 'Умею определять число независимых собственных векторов и клеток Жордана.'
  - 'Умею находить размер клетки по степени нильпотентности.'
  - 'Отличаю диагонализуемую матрицу от недиагонализуемой.'
