id: la.det
int:
  - 'Квадрат со стороной $1$ при действии матрицы превращается в параллелограмм. Во сколько раз изменилась площадь? Это и показывает определитель.'
  - {ask: 'Матрица $\operatorname{diag}(2, 3)$ растягивает оси в $2$ и $3$ раза. Во сколько раз растёт площадь?', ans: 'В $6$ раз: $2\cdot3=6$. Так и считается определитель диагональной матрицы.'}
  - 'Знак определителя говорит о том, сохраняется ли ориентация. Нуль означает, что плоскость сплющена в прямую: обратной матрицы нет.'
def:
  - {g: determinant}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {A: mat 2x2 -4..4}
    q: 'Найди $\det A$ для $A=@{A:m}$.'
    a: A[1,1]*A[2,2]-A[1,2]*A[2,1]
    tol: 0
    h: ['$\det A=ad-bc$.']
  p2:
    k: num
    lv: 2
    v: {k: 2..4, d: [-3, -2, 2, 3]}
    q: 'Для матрицы $2\times2$ известно, что $\det A=@d$. Найди $\det(@{k}A)$.'
    a: k^2*d
    tol: 0
    e: {la.det.scalar: k*d}
    h: ['Число $@k$ умножает обе строки.']
    sol:
      - 'Матрица $@{k}A$ получается умножением каждой из двух строк на $@k$.'
      - 'Каждая строка добавляет множитель $@k$: $@k^2=@{k^2}$.'
      - '$\det(@{k}A)=@{k^2}\cdot(@d)=@{k^2*d}$.'
  p3:
    k: mc
    q: 'Верно ли, что $\det(A+B)=\det A+\det B$?'
    a: 'Нет: при $A=B=I$ левая часть равна $4$, правая $2$'
    e: {la.det.sum: 'Да: определитель линеен'}
    x: ['Да, но только для диагональных матриц']
    h: ['Проверь на единичных матрицах $2\times2$.']
  p4:
    k: num
    lv: 2
    v: {u: vec 2 -4..4, v: vec 2 -4..4, D: '=u[1]*v[2]-u[2]*v[1]'}
    c: ['D != 0']
    q: 'Найди площадь параллелограмма на векторах $\mathbf{u}=@{u:m}$ и $\mathbf{v}=@{v:m}$.'
    a: abs(D)
    tol: 0
    h: ['Площадь равна модулю определителя матрицы из этих векторов.']
    sol:
      - 'Определитель: $u_1v_2-u_2v_1=@D$.'
      - 'Площадь не бывает отрицательной, берём модуль.'
      - 'Ответ: $@{abs(D)}$.'
  p5:
    k: num
    lv: 2
    v: {k: 2..3, d: [-2, -1, 1, 2]}
    q: 'Для матрицы $3\times3$ известно, что $\det A=@d$. Найди $\det(@{k}A)$.'
    a: k^3*d
    tol: 0
    e: {la.det.scalar: k*d}
    h: ['Число $@k$ умножает все три строки.']
    sol:
      - 'Умножение на $@k$ затрагивает каждую из трёх строк.'
      - 'Множитель $@k^3=@{k^3}$.'
      - '$\det(@{k}A)=@{k^3}\cdot(@d)=@{k^3*d}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: для матрицы $2\times2$ с $\det A=3$ найти $\det(2A)$.'
    steps:
      - 'Умножение на $2$ умножает каждую из двух строк на $2$'
      - 'Каждая строка даёт множитель $2$ в определителе'
      - '$\det(2A)=2\cdot2\cdot\det A=4\cdot3=12$'
    bad:
      - {i: 3, t: '$\det(2A)=2\det A=6$', e: la.det.scalar}
      - {i: 2, t: 'Каждая строка даёт множитель $4$ в определителе'}
err: [la.det.sum, la.det.scalar]
sum:
  - 'Умею вычислять $\det A=ad-bc$ и площадь параллелограмма.'
  - 'Помню, что $\det(kA)=k^n\det A$.'
  - 'Знаю, что $\det(A+B)\ne\det A+\det B$.'
