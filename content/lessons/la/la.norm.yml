id: la.norm
int:
  - 'Расстояние по прямой и по кварталам города — разные способы измерить длину. Таксист на $(3,4)$ едет $7$ кварталов, а ворона летит $5$.'
  - {ask: 'Чему равны $\|(3,4)\|_1$, $\|(3,4)\|_2$ и $\|(3,4)\|_\infty$?', ans: '$7$, $5$ и $4$: сумма модулей, евклидова длина и наибольшая координата.'}
  - 'Матрицу тоже можно измерять. Отношение наибольшего и наименьшего растяжения называют числом обусловленности, оно показывает, насколько задача чувствительна к ошибкам.'
def:
  - {g: vector-norm}
  - {g: condition-number}
ex:
  - {x: p4, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: -6..6 !0, b: -6..6 !0}
    q: 'Найди $\|\mathbf x\|_1$ для $\mathbf x=(@a,@b)$.'
    a: abs(a)+abs(b)
    e: {la.norm.l1: sqrt(a^2+b^2)}
    h: ['Сложи модули координат.']
  p2:
    k: num
    fast: 1
    v: {a: -6..6 !0, b: -6..6 !0}
    q: 'Найди $\|\mathbf x\|_\infty$ для $\mathbf x=(@a,@b)$.'
    a: max(abs(a),abs(b))
    e: {la.norm.inf: abs(a)+abs(b)}
    h: ['Выбери наибольший модуль.']
    sol:
      - 'Норма $\infty$ — наибольший модуль координаты.'
      - 'Модули: $|@a|=@{abs(a)}$ и $|@b|=@{abs(b)}$.'
      - 'Итог: $@{max(abs(a),abs(b))}$.'
  p3:
    k: num
    fast: 1
    v: {t: 1..5}
    q: 'Найди $\|\mathbf x\|_2$ для $\mathbf x=(@{3*t},@{4*t})$.'
    a: 5*t
    e: {la.norm.l1: 7*t}
    h: ['Корень из суммы квадратов.']
  p4:
    k: num
    lv: 2
    v: {k: 2..9, m: [2, 3, 4]}
    q: 'Найди число обусловленности $\kappa$ матрицы $\mathrm{diag}(@{k*m},@m)$.'
    a: k
    e: {la.norm.cond-det: k*m^2}
    sol:
      - 'Сингулярные числа диагональной матрицы — модули элементов: $@{k*m}$ и $@m$.'
      - 'Число обусловленности — их отношение $\sigma_{\max}/\sigma_{\min}$.'
      - 'Итог: $\kappa=\frac{@{k*m}}{@m}=@k$.'
  p5:
    k: mc
    lv: 2
    q: 'У матрицы $0.001\cdot I$ определитель очень мал. Плохо ли она обусловлена?'
    a: 'Нет: число обусловленности равно $1$'
    e: {la.norm.cond-det: 'Да: определитель близок к нулю'}
    x: ['Да: элементы малы']
    h: ['Найди сингулярные числа: они равны между собой.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при оценке чувствительности задачи $A\mathbf x=\mathbf b$, $A=\mathrm{diag}(50,2)$.'
    steps:
      - 'Сингулярные числа матрицы $\mathrm{diag}(50,2)$ равны $50$ и $2$'
      - 'Число обусловленности $\kappa=\sigma_{\max}/\sigma_{\min}=50/2=25$'
      - 'Ошибка $0.2\%$ в правой части может дать ошибку решения до $0.2\%\cdot25=5\%$'
      - 'Задача заметно чувствительна: теряется больше одной десятичной цифры'
    bad:
      - {i: 2, t: 'Число обусловленности $\kappa=\det A=50\cdot2=100$', e: la.norm.cond-det}
      - {i: 3, t: 'Ошибка $0.2\%$ в правой части может дать ошибку решения до $0.2\%\cdot2=0.4\%$'}
err: [la.norm.l1, la.norm.inf, la.norm.cond-det]
sum:
  - 'Умею считать нормы $\|\mathbf x\|_1$, $\|\mathbf x\|_2$, $\|\mathbf x\|_\infty$ вектора.'
  - 'Умею находить число обусловленности диагональной матрицы.'
  - 'Отличаю плохую обусловленность от малого определителя.'
