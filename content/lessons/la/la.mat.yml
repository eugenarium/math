id: la.mat
int:
  - 'Фильтр фотографии и поворот можно применять один за другим. Результат зависит от порядка: сначала повернуть, потом размыть, или наоборот. Матрицы устроены так же.'
  - {ask: 'Сначала сдвинь точку $(1, 0)$ на $1$ вверх, затем отрази относительно оси $Ox$. Потом поменяй порядок. Совпали ли результаты?', ans: 'Нет: сначала сдвиг и отражение дают $(1, -1)$, а сначала отражение и сдвиг дают $(1, 1)$. Порядок важен.'}
  - 'Произведение $AB$ берёт строки $A$ и столбцы $B$. Оно описывает композицию: сначала действует $B$, потом $A$.'
  - {ask: 'Равны ли $AB$ и $BA$ для $A=\begin{pmatrix}1&1\\0&1\end{pmatrix}$, $B=\begin{pmatrix}1&0\\1&1\end{pmatrix}$?', ans: 'Нет: $AB=\begin{pmatrix}2&1\\1&1\end{pmatrix}$, $BA=\begin{pmatrix}1&1\\1&2\end{pmatrix}$.'}
def:
  - {g: matrix-product}
  - 'Как решать. Элемент $(i,j)$ произведения $AB$ — строка $i$ матрицы $A$ на столбец $j$ матрицы $B$. Порядок множителей важен, $AB\ne BA$ в общем случае. Произведение может быть нулевым при ненулевых множителях.'
ex:
  - {x: p2, seed: 2}
  - {x: p5, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {A: mat 2x2 -4..4, k: 2..4}
    q: 'Найди элемент $(1, 2)$ матрицы $@{k}A$, где $A=@{A:m}$.'
    a: k*A[1,2]
    tol: 0
    h: ['Умножь элемент $(1, 2)$ на $@k$.']
  p2:
    k: num
    lv: 2
    v: {A: mat 2x2 -3..3, B: mat 2x2 -3..3, p: '=A[1,1]*B[1,1]+A[1,2]*B[2,1]', r: '=B[1,1]*A[1,1]+B[1,2]*A[2,1]'}
    c: ['p != r']
    q: 'Найди элемент $(1, 1)$ матрицы $AB$, где $A=@{A:m}$, $B=@{B:m}$.'
    a: p
    tol: 0
    e: {la.mat.commute: r}
    h: ['Первая строка $A$ на первый столбец $B$.']
    sol:
      - 'Первая строка $A$: $(@{A[1,1]}, @{A[1,2]})$. Первый столбец $B$: $(@{B[1,1]}, @{B[2,1]})$.'
      - 'Перемножим по парам: $(@{A[1,1]})(@{B[1,1]})+(@{A[1,2]})(@{B[2,1]})$.'
      - 'Получаем $@p$.'
  p3:
    k: mc
    lv: 2
    q: 'Верно ли, что из $AB=0$ следует $A=0$ или $B=0$?'
    a: 'Нет: например, $A=\operatorname{diag}(1, 0)$ и $B=\operatorname{diag}(0, 1)$'
    e: {la.mat.zero-div: 'Да, как для чисел'}
    x: ['Да, но только для квадратных матриц']
    h: ['Перемножь указанные диагональные матрицы.']
  p4:
    k: mc
    q: 'Верно ли $AB=BA$ для любых квадратных матриц?'
    a: 'Нет: в общем случае $AB\ne BA$'
    e: {la.mat.commute: 'Да, как $xy=yx$ для чисел'}
    x: ['Да, если матрицы обратимы']
    h: ['Проверь на матрицах с ненулевым элементом над диагональю.']
  p5:
    k: num
    lv: 2
    v: {m: 2..4, n: 2..4, p: 2..4}
    q: 'Матрица $A$ имеет размер $@m\times@n$, а $B$ — $@n\times@p$. Сколько элементов в произведении $AB$?'
    a: m*p
    tol: 0
    h: ['У произведения столько строк, сколько у $A$, и столько столбцов, сколько у $B$.']
    sol:
      - 'Число столбцов $A$ ($@n$) равно числу строк $B$: произведение определено.'
      - 'Размер $AB$: $@m\times@p$.'
      - 'Элементов $@m\cdot@p=@{m*p}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $AB$ для $A=\begin{pmatrix}1&2\\0&1\end{pmatrix}$, $B=\begin{pmatrix}1&0\\3&1\end{pmatrix}$.'
    steps:
      - 'Элемент $(1, 1)$: $1\cdot1+2\cdot3=7$'
      - 'Элемент $(1, 2)$: $1\cdot0+2\cdot1=2$'
      - 'Вторая строка: $0\cdot1+1\cdot3=3$ и $0\cdot0+1\cdot1=1$'
      - 'Итог: $AB=\begin{pmatrix}7&2\\3&1\end{pmatrix}$ и $AB\ne BA$'
    bad:
      - {i: 4, t: 'Итог: $AB=BA$, значит порядок множителей не важен', e: la.mat.commute}
      - {i: 1, t: 'Элемент $(1, 1)$: $1\cdot1+2\cdot3=5$'}
err: [la.mat.commute, la.mat.zero-div]
sum:
  - 'Умею перемножать матрицы $2\times2$: строки на столбцы.'
  - 'Отличаю $AB$ от $BA$: в общем случае они разные.'
  - 'Умею находить пример ненулевых матриц с нулевым произведением.'
