id: la.proj
int:
  - 'Измерения не лежат точно на прямой, но прямую провести нужно. Какую выбрать? Ту, у которой вектор ошибок самый короткий.'
  - {ask: 'Вектор значений $\mathbf{y}$ и прямая вдоль $\mathbf{x}$: какая точка прямой ближе всего к $\mathbf{y}$?', ans: 'Основание перпендикуляра, то есть проекция $\mathbf{y}$ на $\mathbf{x}$. Остаток к ней перпендикулярен.'}
  - 'Метод наименьших квадратов — это проекция. Для прямой $y=ax$ наклон равен $\frac{\sum xy}{\sum x^2}$.'
  - {ask: 'Почему остаток МНК перпендикулярен вектору $x$?', ans: 'Проекция даёт ближайшую точку, и отрезок до ближайшей точки прямой перпендикулярен ей.'}
  - {w: scatter, gen: {n: 20, r: 0.9, seed: 2}, fit: hand, show: [sse], cap: 'Подбери наклон и сдвиг прямой так, чтобы сумма квадратов отклонений SSE стала наименьшей', ask: 'Что показывает SSE?', ans: 'Сумму квадратов вертикальных отклонений точек от прямой: МНК её минимизирует.'}
def:
  - {g: least-squares}
  - 'Как решать. Проекция $\mathbf b$ на направление $\mathbf a$ равна $\frac{\mathbf a\cdot\mathbf b}{\mathbf a\cdot\mathbf a}\mathbf a$. Наклон МНК-прямой через начало: $a=\frac{\sum x_iy_i}{\sum x_i^2}$. Остаток перпендикулярен направлению.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {k: 2..6}
    q: 'Точки $(1, @k)$, $(2, @{2*k})$, $(3, @{3*k})$ лежат на прямой $y=ax$. Найди $a$.'
    a: k
    tol: 0
    h: ['Проверь отношение $y/x$ в любой точке.']
  p2:
    k: num
    lv: 2
    v: {y1: 1..6, y2: 1..8, s: '=(y1+2*y2)/5', r: '=(y1+y2/2)/2'}
    c: ['abs(s-r) > 0.1']
    q: 'Найди наклон $a$ прямой $y=ax$, наилучшей по методу наименьших квадратов для точек $(1, @y1)$ и $(2, @y2)$.'
    a: s
    tol: 0.005
    e: {la.proj.ls-mean: r}
    h: ['$a=\frac{\sum xy}{\sum x^2}$.']
    sol:
      - '$\sum xy=1\cdot@y1+2\cdot@y2=@{y1+2*y2}$.'
      - '$\sum x^2=1+4=5$.'
      - '$a=\frac{@{y1+2*y2}}{5}=@{s:f3}$.'
  p3:
    k: num
    lv: 2
    v: {b1: 1..6, b2: 1..6}
    c: ['b1 != b2']
    q: 'Вектор $\mathbf{b}=(@b1, @b2)$ проектируют на прямую вдоль $(1, 1)$. Найди первую координату остатка $\mathbf{b}-P\mathbf{b}$.'
    a: (b1-b2)/2
    tol: 0.005
    e: {la.proj.res: (b1+b2)/2}
    h: ['Проекция равна $t(1, 1)$, где $t=\frac{b_1+b_2}{2}$.']
    sol:
      - 'Коэффициент проекции: $t=\frac{@b1+@b2}{2}=@{(b1+b2)/2}$.'
      - 'Проекция: $(@{(b1+b2)/2}, @{(b1+b2)/2})$.'
      - 'Остаток: $@b1-@{(b1+b2)/2}=@{(b1-b2)/2}$.'
  p4:
    k: mc
    q: 'Как расположен остаток $\mathbf{b}-P\mathbf{b}$ относительно подпространства?'
    a: 'Перпендикулярен подпространству'
    e: {la.proj.res: 'Параллелен подпространству'}
    x: ['Всегда равен нулю']
    h: ['Проекция — основание перпендикуляра.']
  p5:
    k: mc
    lv: 2
    q: 'Почему наклон $a=\frac{\sum xy}{\sum x^2}$ минимизирует сумму квадратов ошибок?'
    a: 'Остаток $\mathbf{y}-a\mathbf{x}$ перпендикулярен $\mathbf{x}$'
    e: {la.proj.ls-mean: 'Наклон равен среднему отношений $y/x$'}
    x: ['Точки лежат на одной прямой']
    h: ['Проекция даёт ближайшую точку.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при поиске наклона МНК для точек $(1, 2)$ и $(2, 3)$.'
    steps:
      - '$\sum xy=1\cdot2+2\cdot3=8$'
      - '$\sum x^2=1+4=5$'
      - '$a=\frac{\sum xy}{\sum x^2}=\frac85$'
      - 'Остаток перпендикулярен вектору $\mathbf{x}=(1, 2)$'
    bad:
      - {i: 3, t: '$a=\frac12\left(\frac21+\frac32\right)=\frac74$', e: la.proj.ls-mean}
      - {i: 2, t: '$\sum x^2=1+2=3$'}
err: [la.proj.res, la.proj.ls-mean]
sum:
  - 'Умею находить наклон прямой $y=ax$ по методу наименьших квадратов.'
  - 'Умею использовать то, что остаток перпендикулярен подпространству.'
  - 'Отличаю МНК от среднего отношений $y/x$.'
