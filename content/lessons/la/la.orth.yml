id: la.orth
int:
  - 'Оси координат перпендикулярны, поэтому координаты находятся независимо друг от друга. Хочется иметь такие же удобные оси в любой задаче.'
  - {ask: 'Векторы $(3, 4)$ и $(-4, 3)$ перпендикулярны. Образуют ли они ортонормированный базис?', ans: 'Нет: их длины равны $5$. Нужно поделить каждый на $5$: $(\frac35, \frac45)$ и $(-\frac45, \frac35)$.'}
  - 'Процесс Грама–Шмидта делает из произвольных независимых векторов ортогональные: из второго вычитают его проекцию на первый.'
  - {ask: 'Ортогональны ли $(1,2)$ и $(2,-1)$?', ans: 'Да: $1\cdot2+2\cdot(-1)=0$.'}
  - {w: vec2, v: {a: [2, 1], b: [1, 1]}, lock: [a], show: [dot, angle], cap: 'Подвинь $\mathbf b$ так, чтобы угол стал $90^\circ$', ask: 'Чему равно $\mathbf a\cdot\mathbf b$ при ортогональных векторах?', ans: 'Нулю.'}
def:
  - {g: orthogonal-system}
  - {g: gram-schmidt}
  - 'Как решать. Скалярное произведение ортогональных векторов равно нулю. Нормируй: раздели вектор на его длину. Шаг Грама–Шмидта: $\mathbf w=\mathbf v-t\mathbf u$, где $t=\frac{\mathbf v\cdot\mathbf u}{\mathbf u\cdot\mathbf u}$.'
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {a: -4..4 !0}
    q: 'При каком $k$ векторы $(@a, 1)$ и $(1, k)$ ортогональны?'
    a: -a
    tol: 0
    h: ['Скалярное произведение должно быть равно нулю: $@a+k=0$.']
  p2:
    k: num
    lv: 2
    v: {u: vec 2 -4..4, v: vec 2 -4..4, d: '=u[1]*v[1]+u[2]*v[2]', lu: '=u[1]^2+u[2]^2'}
    c: ['lu > 1', 'd != 0', 'd/lu != d']
    q: 'Для $\mathbf{u}=@{u:m}$, $\mathbf{v}=@{v:m}$ вычисляют $\mathbf{w}=\mathbf{v}-t\mathbf{u}$ так, чтобы $\mathbf{w}\perp\mathbf{u}$. Найди $t$.'
    a: d/lu
    tol: 0.005
    e: {la.orth.gs-coef: d}
    h: ['$t=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{u}\cdot\mathbf{u}}$.']
    sol:
      - '$\mathbf{u}\cdot\mathbf{v}=@d$ и $\mathbf{u}\cdot\mathbf{u}=@lu$.'
      - 'Условие $\mathbf{u}\cdot\mathbf{w}=0$ даёт $@d-t\cdot@lu=0$.'
      - 'Получаем $t=\frac{@d}{@lu}=@{d/lu:f3}$.'
  p3:
    k: num
    lv: 2
    v: {u: vec 2 -4..4, lu: '=u[1]^2+u[2]^2'}
    c: ['lu > 1', 'u[1] != 0']
    q: 'Нормируй $\mathbf{u}=@{u:m}$. Найди первую координату единичного вектора того же направления.'
    a: u[1]/sqrt(lu)
    tol: 0.005
    e: {la.orth.unit: 'u[1]'}
    h: ['Раздели вектор на его длину $\sqrt{@lu}$.']
    sol:
      - 'Длина: $|\mathbf{u}|=\sqrt{@lu}=@{sqrt(lu):f3}$.'
      - 'Единичный вектор $\frac{\mathbf{u}}{|\mathbf{u}|}$.'
      - 'Первая координата: $\frac{@{u[1]}}{@{sqrt(lu):f3}}=@{u[1]/sqrt(lu):f3}$.'
  p4:
    k: mc
    q: 'Ненулевые попарно ортогональные векторы линейно независимы?'
    a: 'Да, всегда'
    x: ['Нет, они могут быть зависимы', 'Только на плоскости']
    h: ['Умножь скалярно нулевую комбинацию на один из векторов.']
  p5:
    k: mc
    lv: 2
    q: 'Какая пара векторов — ортонормированный базис плоскости?'
    a: '$\left(\frac35, \frac45\right)$ и $\left(-\frac45, \frac35\right)$'
    e: {la.orth.unit: '$(3, 4)$ и $(-4, 3)$'}
    x: ['$(1, 1)$ и $(1, 2)$']
    h: ['Проверь ортогональность и длины.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в одном шаге процесса Грама–Шмидта для $\mathbf{u}=(1, 1)$, $\mathbf{v}=(2, 0)$.'
    steps:
      - '$\mathbf{u}\cdot\mathbf{v}=2$ и $\mathbf{u}\cdot\mathbf{u}=2$'
      - 'Коэффициент $t=\frac{2}{2}=1$'
      - '$\mathbf{w}=\mathbf{v}-t\mathbf{u}=(2, 0)-(1, 1)=(1, -1)$'
      - 'Проверка: $\mathbf{u}\cdot\mathbf{w}=1-1=0$'
    bad:
      - {i: 2, t: 'Коэффициент $t=\mathbf{u}\cdot\mathbf{v}=2$', e: la.orth.gs-coef}
      - {i: 3, t: '$\mathbf{w}=\mathbf{v}-t\mathbf{u}=(2, 0)-(1, 1)=(1, 1)$'}
  p7:
    k: graph
    lv: 2
    v: {ax: 1..3, ay: 1..3}
    q: 'При $\mathbf a=(@ax,@ay)$ подбери ненулевой $\mathbf b$, перпендикулярный $\mathbf a$.'
    w: {w: vec2, v: {a: [ax, ay], b: [1, 1]}, lock: [a], show: [dot, angle]}
    goal: {dot: [0, 0.01], angle: [90, 0.01]}
err: [la.orth.unit, la.orth.gs-coef]
sum:
  - 'Умею проверять ортогональность по скалярному произведению.'
  - 'Умею нормировать вектор и знаю, что ортогональность не даёт единичной длины.'
  - 'Умею делать шаг Грама–Шмидта: из $\mathbf{v}$ вычитаю его проекцию на $\mathbf{u}$.'
