id: la.map
int:
  - 'Линейное отображение растягивает, поворачивает или отражает плоскость, не сгибая сетку: прямые остаются прямыми, а начало координат остаётся на месте.'
  - {ask: 'Куда при повороте на $90^\circ$ переходят $(1, 0)$ и $(0, 1)$? Хватит ли этого для любой точки?', ans: 'В $(0, 1)$ и $(-1, 0)$. Достаточно: $(x, y)=x(1, 0)+y(0, 1)$, а отображение линейно.'}
  - 'Образы базисных векторов записывают в столбцы матрицы. Тогда любой образ равен $A\mathbf{x}$.'
def:
  - {g: linear-map}
ex:
  - {x: p2, seed: 2}
  - {x: p4, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {A: mat 2x2 -4..4}
    q: 'Матрица отображения $A=@{A:m}$. Найди вторую координату образа вектора $\mathbf{e}_2=(0, 1)$.'
    a: A[2,2]
    tol: 0
    h: ['Образ $\mathbf{e}_2$ — второй столбец матрицы.']
  p2:
    k: num
    lv: 2
    v: {p: -3..3, q: -3..3, r: -3..3, s: -3..3, m: 2..4, n: 2..4}
    c: ['q != r']
    q: 'Линейное отображение переводит $\mathbf{e}_1$ в $(@p, @q)$ и $\mathbf{e}_2$ в $(@r, @s)$. Найди первую координату образа вектора $(@m, @n)$.'
    a: m*p+n*r
    tol: 0
    e: {la.map.columns: m*p+n*q}
    h: ['Образ $(m, n)$ равен $m f(\mathbf{e}_1)+n f(\mathbf{e}_2)$.']
    sol:
      - 'Разложим: $(@m, @n)=@m\mathbf{e}_1+@n\mathbf{e}_2$.'
      - 'Образ: $@m(@p, @q)+@n(@r, @s)$.'
      - 'Первая координата: $@m\cdot(@p)+@n\cdot(@r)=@{m*p+n*r}$.'
  p3:
    k: mc
    q: 'Какое отображение плоскости линейно?'
    a: '$(x, y)\mapsto(2x-y, x+3y)$'
    e: {la.map.shift: '$(x, y)\mapsto(x+1, y)$'}
    x: ['$(x, y)\mapsto(xy, y)$']
    h: ['Проверь, куда переходит начало координат.']
  p4:
    k: num
    lv: 2
    v: {p: -3..3, q: -3..3, r: -3..3, s: -3..3}
    c: ['q != r']
    q: 'Отображение переводит $\mathbf{e}_1$ в $(@p, @q)$ и $\mathbf{e}_2$ в $(@r, @s)$. Найди элемент $(1, 2)$ его матрицы.'
    a: r
    tol: 0
    e: {la.map.columns: q}
    h: ['Образы базисных векторов — столбцы матрицы.']
    sol:
      - 'Первый столбец матрицы: $(@p, @q)$, второй: $(@r, @s)$.'
      - 'Матрица $\begin{pmatrix}@p&@r\\@q&@s\end{pmatrix}$.'
      - 'Элемент $(1, 2)$ стоит в первой строке второго столбца: $@r$.'
  p5:
    k: mc
    lv: 2
    q: 'Чему равен образ нулевого вектора при линейном отображении?'
    a: 'Нулевому вектору'
    e: {la.map.shift: 'Может быть любым вектором'}
    x: ['Зависит от выбора базиса']
    h: ['Вспомни $f(0\cdot\mathbf{u})=0\cdot f(\mathbf{u})$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку: $f(1, 0)=(2, 1)$ и $f(0, 1)=(-1, 3)$. Найди $f(4, 2)$.'
    steps:
      - 'Образы базисных векторов — столбцы: $A=\begin{pmatrix}2&-1\\1&3\end{pmatrix}$'
      - '$f(4, 2)=4f(1, 0)+2f(0, 1)$'
      - '$=4(2, 1)+2(-1, 3)=(6, 10)$'
    bad:
      - {i: 1, t: 'Образы базисных векторов — строки: $A=\begin{pmatrix}2&1\\-1&3\end{pmatrix}$', e: la.map.columns}
      - {i: 3, t: '$=4(2, 1)+2(-1, 3)=(10, 6)$'}
err: [la.map.columns, la.map.shift]
sum:
  - 'Умею строить матрицу отображения: образы $\mathbf{e}_1$, $\mathbf{e}_2$ в столбцы.'
  - 'Умею находить образ вектора как $m f(\mathbf{e}_1)+n f(\mathbf{e}_2)$.'
  - 'Отличаю линейное отображение от сдвига: $f(\mathbf{0})=\mathbf{0}$.'
