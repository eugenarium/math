id: la.sym
int:
  - 'Матрица $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ симметрична относительно главной диагонали. У таких матриц собственные направления особенно красивы.'
  - {ask: 'У этой матрицы собственные векторы $(1, 1)$ и $(1, -1)$. Чему равно их скалярное произведение?', ans: 'Нулю: $1-1=0$. Собственные направления перпендикулярны, как оси эллипса.'}
  - 'Это общий факт (спектральная теорема): симметричную матрицу можно диагонализовать в ортонормированном базисе, а собственные значения вещественны.'
  - {ask: 'Каковы собственные значения $\begin{pmatrix}1&2\\2&1\end{pmatrix}$?', ans: '$3$ и $-1$: сумма $2$, произведение $-3$.'}
def:
  - {g: spectral-theorem}
  - 'Как решать. Для симметричной матрицы $2\times2$ найди след и определитель, составь $\lambda^2-t\lambda+d=0$. Значения вещественны, а собственные векторы для разных значений ортогональны.'
ex:
  - {x: p5, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {S: smat 2 -4..4}
    q: 'Найди сумму собственных значений симметричной матрицы $S=@{S:m}$.'
    a: S[1,1]+S[2,2]
    tol: 0
    h: ['Сумма собственных значений равна следу.']
  p2:
    k: num
    lv: 2
    v: {a: -3..3, b: 1..3}
    q: 'Найди наибольшее собственное значение матрицы $\begin{pmatrix}@a&@b\\@b&@a\end{pmatrix}$.'
    a: a+b
    tol: 0
    h: ['Собственные значения такой матрицы равны $a+b$ и $a-b$.']
    sol:
      - 'След равен $@{2*a}$, определитель $@{a^2-b^2}$.'
      - 'Корни $\lambda^2-@{2*a}\lambda+@{a^2-b^2}=0$: $\lambda=@a\pm@b$.'
      - 'Наибольшее значение: $@{a+b}$.'
  p3:
    k: mc
    q: 'Собственные векторы симметричной матрицы, отвечающие разным собственным значениям,'
    a: 'ортогональны'
    e: {la.sym.nonorth: 'могут быть не ортогональны, как у любой матрицы'}
    x: ['всегда совпадают']
    h: ['Вспомни спектральную теорему.']
  p4:
    k: mc
    lv: 2
    q: 'Что можно сказать о собственных значениях вещественной симметричной матрицы $2\times2$?'
    a: 'Они вещественны'
    e: {la.sym.complex: 'Могут быть комплексными, как у поворота'}
    x: ['Они всегда равны между собой']
    h: ['Дискриминант $(a-d)^2+4b^2$ неотрицателен.']
  p5:
    k: num
    lv: 2
    v: {a: -3..3, b: 1..3}
    q: 'Найди собственное значение матрицы $\begin{pmatrix}@a&@b\\@b&@a\end{pmatrix}$ для вектора $(1, -1)$.'
    a: a-b
    tol: 0
    h: ['Вычисли $A\mathbf{v}$ и сравни с $\mathbf{v}$.']
    sol:
      - '$A(1, -1)=(@a-@b,\ @b-@a)$.'
      - 'Это $(@{a-b}, @{b-a})=(@{a-b})(1, -1)$.'
      - 'Собственное значение равно $@{a-b}$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при исследовании матрицы $\begin{pmatrix}2&1\\1&2\end{pmatrix}$.'
    steps:
      - 'След равен $4$, определитель $3$'
      - 'Уравнение $\lambda^2-4\lambda+3=0$'
      - 'Корни $\lambda=1$ и $\lambda=3$'
      - 'Собственные векторы $(1, -1)$ и $(1, 1)$ ортогональны'
    bad:
      - {i: 3, t: 'Корней нет: собственные значения комплексные', e: la.sym.complex}
      - {i: 4, t: 'Собственные векторы $(1, 0)$ и $(1, 1)$ необязательно ортогональны', e: la.sym.nonorth}
err: [la.sym.nonorth, la.sym.complex]
sum:
  - 'Умею находить собственные значения симметричной матрицы $2\times2$.'
  - 'Умею использовать вещественность значений и ортогональность векторов симметричной матрицы.'
