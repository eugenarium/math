id: la.eig
int:
  - 'Матрица поворачивает и растягивает почти каждый вектор. Но некоторые векторы остаются на своей прямой: у них меняется только длина. Найдём их.'
  - w: lin2
    M: [[2, 1], [1, 2]]
    probe: [1, 0]
    show: [basis]
    cap: 'Вращай $\mathbf{v}$. Найди направления, где $A\mathbf{v}$ лежит на одной прямой с $\mathbf{v}$'
    ask: 'Сколько таких направлений и во сколько раз растягивается вектор на каждом?'
    ans: 'Два. Вдоль $(1, 1)$ вектор растягивается в 3 раза, вдоль $(1, -1)$ не меняется: множитель равен 1.'
  - w: lin2
    M: [[cos(t), -sin(t)], [sin(t), cos(t)]]
    sl: {t: [0, 3.14, 0.8]}
    probe: [1, 0]
    cap: 'Это поворот на угол $t$. Попробуй найти вектор, который остаётся на своей прямой'
    ask: 'При каких $t$ такие векторы существуют?'
    ans: 'Только при $t=0$ и $t=\pi$. При остальных углах поворот сдвигает с прямой каждый ненулевой вектор.'
def:
  - {g: eigenvector}
  - {g: eigenvalue}
  - {g: char-poly}
  - 'Как искать: $A\mathbf{v}=\lambda\mathbf{v}$ равносильно $(A-\lambda I)\mathbf{v}=\mathbf{0}$. Ненулевое решение есть только тогда, когда $\det(A-\lambda I)=0$.'
ex:
  - {x: p3, seed: 3}
  - {x: p4, seed: 3}
pr:
  p1:
    k: num
    fast: 1
    v:
      P: umat 2 -1..2
      l1: [-2, 2, 3, 4]
      l2: [-1, 1, 5]
      A: =P*[[l1,0],[0,l2]]*inv(P)
      u: =[P[1,1], P[2,1]]
    c: ['max(abs(A)) <= 9']
    q: '$\mathbf{v}=@{u:m}$ — собственный вектор матрицы $A=@{A:m}$. Найди его собственное значение.'
    a: l1
    tol: 0
    h: ['Вычисли $A\mathbf{v}$ и сравни с $\mathbf{v}$ покоординатно.']
  p2:
    k: mc
    v:
      P: umat 2 -1..2
      l1: [-2, 2, 3]
      l2: [-1, 1, 4]
      A: =P*[[l1,0],[0,l2]]*inv(P)
      u: =[P[1,1], P[2,1]]
      u2: =[P[1,2], P[2,2]]
    c: ['max(abs(A)) <= 9']
    q: 'Какой из векторов — собственный для $A=@{A:m}$?'
    a: '$@{u:m}$'
    e: {la.eig.zero-vec: '$\begin{pmatrix}0\\0\end{pmatrix}$'}
    x: ['$@{u+u2:m}$', '$@{u-u2:m}$']
    h: ['Умножь $A$ на каждый вектор: результат должен быть кратен исходному.', 'Нулевой вектор собственным не считается.']
  p3:
    k: num
    lv: 2
    v:
      P: umat 2 -1..2
      l1: [-2, 2, 3]
      l2: [-1, 1, 4]
      A: =P*[[l1,0],[0,l2]]*inv(P)
    c: ['max(abs(A)) <= 9']
    q: 'Найди собственные значения матрицы $A=@{A:m}$. В ответ введи большее из них.'
    a: max(l1, l2)
    tol: 0
    h: ['Для матрицы $2\times2$: $\det(A-\lambda I)=\lambda^2-\operatorname{tr}A\cdot\lambda+\det A$.']
    sol:
      - 'След: $\operatorname{tr}A=@{l1+l2}$. Определитель: $\det A=@{l1*l2}$.'
      - {w: matrix, M: A, op: char}
      - 'Характеристическое уравнение: $\lambda^2@{-(l1+l2):sc}\lambda@{l1*l2:s}=0$.'
      - 'Корни: $\lambda_1=@{min(l1, l2)}$, $\lambda_2=@{max(l1, l2)}$. Их сумма равна следу, произведение — определителю.'
      - 'Большее собственное значение: $@{max(l1, l2)}$.'
  p4:
    k: num
    lv: 2
    v:
      P: umat 2 -1..2
      l1: [-2, 2, 3]
      l2: [-1, 1, 4]
      A: =P*[[l1,0],[0,l2]]*inv(P)
    c: ['max(abs(A)) <= 9', 'A[1,2] != 0']
    q: 'У матрицы $A=@{A:m}$ есть собственное значение $\lambda=@l1$. Найди $y$, при котором $\begin{pmatrix}1\\y\end{pmatrix}$ — собственный вектор.'
    a: P[2,1]/P[1,1]
    h: ['Реши $(A-\lambda I)\mathbf{v}=\mathbf{0}$, подставив $\mathbf{v}=(1, y)$.']
    sol:
      - '$A-@{l1:n}I=@{A-l1*[[1,0],[0,1]]:m}$.'
      - 'Первая строка системы $(A-\lambda I)\mathbf{v}=\mathbf{0}$ при $\mathbf{v}=(1, y)$: $@{A[1,1]-l1}@{A[1,2]:sc}y=0$.'
      - 'Отсюда $y=@{P[2,1]/P[1,1]:fr}$. Вторая строка даёт то же: строки пропорциональны.'
  p5:
    k: mc
    fast: 1
    v: {l: [2, 3, -2, 5], k: [2, 3, -1]}
    q: 'Вектор $\mathbf{v}$ — собственный для $A$ с собственным значением $@l$. Что верно для вектора $@{k:c}\mathbf{v}$?'
    a: 'Он собственный с тем же значением $@l$'
    e: {la.eig.unique-vec: 'Он не собственный: у значения $@l$ собственный вектор один'}
    x: ['Он собственный со значением $@{k*l}$', 'Зависит от матрицы $A$']
  p6:
    k: mc
    v: {a: -3..3, b: 1..4}
    q: 'Сколько вещественных собственных значений у матрицы $A=@{[[a,-b],[b,a]]:m}$?'
    a: 'Ни одного'
    e: {la.eig.real-always: 'Два'}
    x: ['Одно']
    h: ['Найди дискриминант характеристического уравнения: $(\operatorname{tr}A)^2-4\det A$.']
  p7:
    k: graph
    lv: 2
    v:
      P: umat 2 -1..2
      l1: [2, 3]
      l2: [-1, 1]
      A: =P*[[l1,0],[0,l2]]*inv(P)
    c: ['max(abs(A)) <= 6']
    q: 'Поверни $\mathbf{v}$ так, чтобы он стал собственным вектором с собственным значением $@l1$.'
    w: {w: lin2, M: A, probe: [1, 0], show: [basis]}
    goal: {ang: [0, 4], lam: [l1, 0.2]}
    h: ['Ищи направление, где $A\mathbf{v}$ ложится на прямую вектора $\mathbf{v}$ и длиннее его в $@l1$ раза.']
  p8:
    k: spot
    lv: 2
    q: 'Найди ошибку в поиске собственных значений матрицы $\begin{pmatrix}4 & 1\\ 2 & 3\end{pmatrix}$.'
    steps:
      - '$A-\lambda I=\begin{pmatrix}4-\lambda & 1\\ 2 & 3-\lambda\end{pmatrix}$'
      - '$\det(A-\lambda I)=(4-\lambda)(3-\lambda)-2$'
      - '$(4-\lambda)(3-\lambda)-2=\lambda^2-7\lambda+10$'
      - '$\lambda_1=2,\ \lambda_2=5$'
    bad:
      - {i: 1, t: '$A-\lambda I=\begin{pmatrix}4-\lambda & 1-\lambda\\ 2-\lambda & 3-\lambda\end{pmatrix}$', e: la.eig.lambda-all}
      - {i: 2, t: '$\det(A-\lambda I)=(4-\lambda)(3-\lambda)+2$'}
err: [la.eig.zero-vec, la.eig.real-always, la.eig.unique-vec]
sum:
  - 'Умею проверять, является ли вектор собственным, и находить его собственное значение.'
  - 'Умею находить собственные значения матрицы $2\times2$ через характеристическое уравнение.'
  - 'Умею находить собственный вектор для данного собственного значения.'
  - 'Отличаю матрицы с вещественными собственными значениями от матриц без них, например поворотов.'
