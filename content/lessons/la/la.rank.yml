id: la.rank
int:
  - 'Матрица может иметь много строк, но нести мало информации: если строки пропорциональны, лишние ничего не добавляют. Сколько строк действительно нужно?'
  - {ask: 'Сколько независимых строк в $\begin{pmatrix}1&2\\2&4\end{pmatrix}$?', ans: 'Одна: вторая строка равна первой, умноженной на $2$. Ранг матрицы равен $1$.'}
  - 'Ранг показывает размерность образа. А ядро — то, что матрица обнуляет. Вместе они дают число столбцов.'
def:
  - {g: matrix-rank}
  - {g: kernel-image}
ex:
  - {x: p2, seed: 2}
  - {x: p3, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {m: 3..5, n: 4..7, r: 1..3}
    c: ['m != n']
    q: 'Матрица $@m\times@n$ имеет ранг $@r$. Найди размерность её ядра.'
    a: n-r
    tol: 0
    e: {la.rank.nullity: m-r}
    h: ['$\dim\ker A=n-\operatorname{rank}A$, где $n$ — число столбцов.']
  p2:
    k: num
    lv: 2
    v: {a: 1..4, b: 1..4, k: 2..3}
    q: 'Найди ранг матрицы $\begin{pmatrix}@a&@b\\@{k*a}&@{k*b}\end{pmatrix}$.'
    a: 1
    tol: 0
    e: {la.rank.rows: 2}
    h: ['Сравни строки: одна кратна другой.']
    sol:
      - 'Первая строка $(@a, @b)$, вторая $(@{k*a}, @{k*b})=@k(@a, @b)$.'
      - 'Вычтем: вторая строка обнуляется.'
      - 'Остаётся одна ненулевая строка, ранг равен $1$.'
  p3:
    k: num
    lv: 2
    v: {a: 1..4, b: 1..4}
    q: 'Найди ранг матрицы со строками $(1, 0, @a)$, $(0, 1, @b)$, $(1, 1, @{a+b})$.'
    a: 2
    tol: 0
    e: {la.rank.rows: 3}
    h: ['Третья строка равна сумме первых двух.']
    sol:
      - 'Сумма первых двух строк: $(1, 1, @{a+b})$.'
      - 'Это третья строка, она зависит от первых двух.'
      - 'Первые две строки независимы, ранг равен $2$.'
  p4:
    k: mc
    q: 'Какая матрица имеет ранг $1$?'
    a: '$\begin{pmatrix}1&2\\2&4\end{pmatrix}$'
    e: {la.rank.rows: '$\begin{pmatrix}1&2\\3&4\end{pmatrix}$'}
    x: ['$\begin{pmatrix}1&0\\0&1\end{pmatrix}$']
    h: ['Найди матрицу с пропорциональными строками.']
  p5:
    k: num
    lv: 2
    v: {a: 1..4, b: 1..4}
    q: 'Найди размерность ядра матрицы $\begin{pmatrix}1&0&@a\\0&1&@b\end{pmatrix}$.'
    a: 1
    tol: 0
    e: {la.rank.nullity: 2}
    h: ['Ранг равен $2$, столбцов $3$.']
    sol:
      - 'Две строки независимы (в первой единица в первом столбце, во второй — во втором): ранг $2$.'
      - 'Число столбцов равно $3$.'
      - 'По теореме о ранге $\dim\ker=3-2=1$.'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении ранга матрицы со строками $(1, 2, 3)$ и $(2, 4, 6)$.'
    steps:
      - 'Вторая строка равна первой, умноженной на $2$'
      - 'Вычтем из второй строки удвоенную первую: получим нулевую строку'
      - 'Ненулевая строка осталась одна'
      - 'Ранг равен $1$'
    bad:
      - {i: 4, t: 'Ранг равен $2$, так как строк две', e: la.rank.rows}
      - {i: 2, t: 'Вычтем из второй строки первую: получим строку $(1, 2, 3)$'}
err: [la.rank.rows, la.rank.nullity]
sum:
  - 'Умею находить ранг матрицы как число независимых строк.'
  - 'Умею применять теорему о ранге: $\dim\ker A=n-\operatorname{rank}A$.'
