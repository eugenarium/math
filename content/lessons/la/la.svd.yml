id: la.svd
int:
  - 'Матрица $2\times2$ превращает единичную окружность в эллипс. Длины его полуосей — самое важное число матрицы: насколько сильно она растягивает и сжимает.'
  - {ask: 'Матрица $\mathrm{diag}(-3,2)$ растягивает вектор $(1,0)$ в какое число раз по длине?', ans: 'В 3 раза: длина вектора $(-3,0)$ равна 3. Знак на длину не влияет, поэтому сингулярные числа неотрицательны.'}
  - 'Эти длины полуосей называют сингулярными числами. Они не равны собственным значениям: берут корни из собственных значений матрицы $A^TA$.'
  - {ask: 'Чему равны сингулярные числа поворота на $30^\circ$?', ans: 'Обе равны $1$: поворот не меняет длины.'}
def:
  - {g: svd}
  - 'Как решать. Найди $A^TA$ и его собственные значения $\lambda_i$. Сингулярные числа $\sigma_i=\sqrt{\lambda_i}$. Ранг — число ненулевых $\sigma_i$, $\|A\|_F^2=\sum\sigma_i^2$, $\|A\|_2=\sigma_1$.'
ex:
  - {x: p2, seed: 2}
  - {x: p4, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {s: 3..6, t: 1..2}
    q: 'Найди наибольшее сингулярное число матрицы $\mathrm{diag}(-@s,@t)$.'
    a: s
    e: {la.svd.eig: t}
    h: ['Сингулярные числа — модули диагональных элементов.']
  p2:
    k: num
    v: {t: 1..4}
    q: 'Матрица $A=\begin{pmatrix}@{3*t}&@{4*t}\\@{-4*t}&@{3*t}\end{pmatrix}$. Её сингулярные числа совпадают. Найди их.'
    a: 5*t
    e: {la.svd.square: 25*t^2}
    h: ['Вычисли $A^TA$: у такой матрицы это кратное единичной.']
    sol:
      - '$A^TA=\begin{pmatrix}@{25*t^2}&0\\0&@{25*t^2}\end{pmatrix}$: недиагональные элементы сокращаются.'
      - 'Оба собственных значения $A^TA$ равны $@{25*t^2}$.'
      - 'Сингулярные числа — корни: $\sqrt{@{25*t^2}}=@{5*t}$.'
  p3:
    k: num
    fast: 1
    v: {r: 1..3}
    q: 'У матрицы $4\times4$ ровно @r @{r:w=ненулевое,ненулевых,ненулевых} сингулярных @{r:w=число,числа,числа}. Найди ранг матрицы.'
    a: r
    e: {la.svd.rank: 4}
    h: ['Ранг равен числу ненулевых сингулярных чисел.']
  p4:
    k: num
    lv: 2
    v: {p: 3..9, q: 1..8}
    c: ['p > q']
    q: 'Сингулярные числа матрицы $A$ равны $@p$ и $@q$. Найди $\|A\|_F^2$.'
    a: p^2+q^2
    sol:
      - 'Квадрат нормы Фробениуса равен сумме квадратов сингулярных чисел.'
      - 'Вычислим: $@p^2+@q^2=@{p^2}+@{q^2}$.'
      - 'Итог: $\|A\|_F^2=@{p^2+q^2}$.'
  p5:
    k: mc
    q: 'Сингулярные числа матрицы $A$ — это'
    a: 'корни из собственных значений $A^TA$'
    e: {la.svd.eig: 'собственные значения самой матрицы $A$', la.svd.square: 'собственные значения матрицы $A^TA$'}
    h: ['Сингулярные числа неотрицательны.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении сингулярных чисел матрицы $A=\begin{pmatrix}3&0\\4&5\end{pmatrix}$.'
    steps:
      - 'Вычисляем $A^TA=\begin{pmatrix}25&20\\20&25\end{pmatrix}$'
      - 'Собственные значения: $\lambda=25\pm20$, то есть $45$ и $5$'
      - 'Сингулярные числа равны корням: $\sigma_1=\sqrt{45}$, $\sigma_2=\sqrt5$'
      - 'Проверка: $\sigma_1\sigma_2=\sqrt{225}=15=|\det A|$'
    bad:
      - {i: 3, t: 'Сингулярные числа равны собственным значениям: $\sigma_1=45$, $\sigma_2=5$', e: la.svd.square}
      - {i: 2, t: 'Собственные значения: $\lambda=25\pm20$, то есть $20$ и $30$'}
err: [la.svd.eig, la.svd.square, la.svd.rank]
sum:
  - 'Умею находить сингулярные числа диагональной матрицы и матрицы с $A^TA=cI$.'
  - 'Умею находить ранг по числу ненулевых сингулярных чисел.'
  - 'Умею вычислять норму Фробениуса через сингулярные числа.'
  - 'Отличаю сингулярные числа от собственных значений.'
