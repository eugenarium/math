id: lg.quant
int:
  - '«Для каждого числа найдётся большее» — верно. «Найдётся число, большее всех» — нет. Слова почти те же, а смысл разный: важен порядок.'
  - {ask: 'Чем отличаются высказывания $\forall x\,\exists y\,(y>x)$ и $\exists y\,\forall x\,(y>x)$ на вещественных числах?', ans: 'В первом $y$ подбирается под $x$, достаточно $y=x+1$. Во втором нужен один $y$ больше всех $x$, такого нет, включая $x=y$.'}
  - 'Чтобы опровергнуть «для каждого», достаточно одного контрпримера. Поэтому отрицание $\forall$ — это $\exists$.'
def:
  - {g: quantifiers}
  - {g: quantifier-negation}
ex:
  - {x: p4, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {m: [2, 3, 5], k: 2..8}
    q: 'Сколько среди $x\in\{1, \dots, @{m*k}\}$ контрпримеров к утверждению «для каждого $x$ число $x$ не кратно $@m$»?'
    a: k
    h: ['Контрпример — число, кратное $@m$.']
  p2:
    k: mc
    q: 'Какое утверждение верно для вещественных чисел?'
    a: '$\forall x\,\exists y\,(y>x)$ истинно, $\exists y\,\forall x\,(y>x)$ ложно'
    e: {lg.quant.order: 'Оба высказывания истинны'}
    x: ['Оба высказывания ложны']
    h: ['Попробуй $y=x+1$, а затем подставь $x=y$.']
  p3:
    k: mc
    lv: 2
    q: 'Чему равносильно $\neg\forall x\,P(x)$?'
    a: '$\exists x\,\neg P(x)$'
    e: {lg.quant.neg: '$\forall x\,\neg P(x)$'}
    x: ['$\neg\exists x\,P(x)$']
    h: ['Достаточно одного контрпримера.']
  p4:
    k: num
    lv: 2
    v: {m: 3..6, k: 2..6}
    q: 'Утверждение «для каждого $x\in\{1, \dots, @{m+k}\}$ верно $x\le@m$» ложно. Сколько у него контрпримеров?'
    a: k
    e: {lg.quant.neg: m+k}
    h: ['Контрпример — $x>@m$.']
    sol:
      - 'Контрпример — элемент, для которого $x\le@m$ ложно, то есть $x>@m$.'
      - 'Это числа $@{m+1}, \dots, @{m+k}$.'
      - 'Их ровно $@k$.'
  p5:
    k: mc
    lv: 2
    q: 'Как отрицается «каждый студент сдал хотя бы один экзамен»?'
    a: 'Найдётся студент, не сдавший ни одного экзамена'
    e: {lg.quant.neg: 'Каждый студент не сдал ни одного экзамена'}
    x: ['Найдётся студент, сдавший все экзамены']
    h: ['Отрицание $\forall$ — $\exists$, а «хотя бы один» превращается в «ни одного».']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при отрицании $\forall x\,\exists y\,(y^2=x)$.'
    steps:
      - 'Исходное: $\forall x\,\exists y\,(y^2=x)$'
      - 'Отрицание меняет кванторы на противоположные: $\exists x\,\forall y$'
      - 'Внутри: $\neg(y^2=x)$ превращается в $y^2\ne x$'
      - 'Итог: $\exists x\,\forall y\,(y^2\ne x)$, верно при $x=-1$'
    bad:
      - {i: 2, t: 'Отрицание меняет только первый квантор: $\exists x\,\exists y$', e: lg.quant.neg}
      - {i: 4, t: 'Итог: $\exists x\,\forall y\,(y^2=x)$, верно при $x=-1$'}
err: [lg.quant.order, lg.quant.neg]
sum:
  - 'Умею отрицать кванторные высказывания: $\forall$ меняется на $\exists$ и наоборот.'
  - 'Различаю $\forall\exists$ и $\exists\forall$.'
  - 'Знаю, что контрпример опровергает утверждение «для каждого».'
