id: lg.impl
int:
  - 'Обещание: «Если будет дождь, я возьму зонт». Когда обещание нарушено?'
  - {ask: 'Дождя не было, а зонт ты всё равно взял. Нарушил ли ты обещание?', ans: 'Нет. Обещание нарушено только если дождь был, а зонта нет. Так устроена импликация $A\to B$.'}
  - 'Из «если $A$, то $B$» не следует «если $B$, то $A$». Зонт мог быть и по другой причине.'
def:
  - {g: implication}
  - {g: contrapositive}
ex:
  - {x: p4, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 2..5}
    q: 'Сколько из $2^@n$ наборов $@n$ переменных делают истинным $A_1\to A_2$?'
    a: 3*2^(n-2)
    e: {lg.impl.false-premise: 2^(n-2)}
    h: ['Импликация ложна только при $A_1=1$, $A_2=0$.']
  p2:
    k: mc
    q: 'Контрапозиция утверждения «если $x>2$, то $x^2>4$» такова:'
    a: 'Если $x^2\le4$, то $x\le2$'
    e: {lg.impl.converse: 'Если $x^2>4$, то $x>2$'}
    x: ['Если $x\le2$, то $x^2\le4$']
    h: ['Контрапозиция: $\neg B\to\neg A$.']
  p3:
    k: mc
    lv: 2
    q: 'Какое высказывание равносильно $A\to B$?'
    a: '$\neg B\to\neg A$'
    e: {lg.impl.converse: '$B\to A$'}
    x: ['$\neg A\to\neg B$']
    h: ['Проверь набор $A=0$, $B=1$.']
  p4:
    k: num
    lv: 2
    v: {k: 2..5}
    q: 'Для $x\in\{1, \dots, @{6*k}\}$ рассмотрим высказывание «если $x$ кратно $3$, то $x$ чётно». Сколько значений $x$ делают его ложным?'
    a: k
    e: {lg.impl.false-premise: 4*k, lg.impl.converse: 2*k}
    h: ['Ложно только когда $x$ кратно $3$ и нечётно.']
    sol:
      - 'Импликация ложна при истинной посылке и ложном выводе: $x$ кратно $3$ и нечётно.'
      - 'Кратные $3$ до $@{6*k}$ — это $@{2*k}$ чисел, нечётные из них — каждое второе.'
      - 'Подходят $3, 9, 15, \dots$: всего $@k$ значений.'
  p5:
    k: mc
    lv: 2
    q: 'Истинно ли высказывание «если $2+2=5$, то $3=3$»?'
    a: 'Истинно: при ложной посылке импликация истинна'
    e: {lg.impl.false-premise: 'Ложно, так как посылка ложна'}
    x: ['Нельзя определить']
    h: ['Вспомни, когда импликация ложна.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при записи контрапозиции утверждения «если $n^2$ чётно, то $n$ чётно».'
    steps:
      - 'Исходное: $P\to Q$, где $P$: «$n^2$ чётно», $Q$: «$n$ чётно»'
      - 'Контрапозиция: $\neg Q\to\neg P$'
      - 'То есть: если $n$ нечётно, то $n^2$ нечётно'
      - 'Она равносильна исходному утверждению'
    bad:
      - {i: 2, t: 'Обратное утверждение: $Q\to P$', e: lg.impl.converse}
      - {i: 3, t: 'То есть: если $n$ чётно, то $n^2$ чётно'}
err: [lg.impl.converse, lg.impl.false-premise]
sum:
  - 'Умею вычислять значение импликации: ложна только при $1\to0$.'
  - 'Умею строить контрапозицию и отличаю её от обратного утверждения.'
  - 'Знаю, что из ложной посылки импликация истинна.'
