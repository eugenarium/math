id: lg.meta
int:
  - 'Хорошее исчисление не должно выводить ложь (корректность) и хочется, чтобы оно выводило всю истину (полнота). Для логики предикатов так и есть. Для арифметики — нет.'
  - {ask: 'Если теория неполна, значит ли это, что в ней ничего нельзя доказать?', ans: 'Нет. Теоремов в арифметике бесконечно много. Неполнота — это существование хотя бы одного истинного, но недоказуемого предложения.'}
def:
  - {g: soundness-completeness}
  - {g: incompleteness}
ex:
  - {x: p3, seed: 1}
  - {x: p1, seed: 5}
pr:
  p1:
    k: mc
    fast: 1
    q: 'Исчисление корректно, если…'
    a: 'всё, что в нём выводимо, общезначимо'
    e: {lg.meta.swap: 'всё общезначимое в нём выводимо'}
    x: ['в нём выводимы все формулы']
    sol:
      - 'Корректность — «выводит только истину».'
      - 'Это направление $\vdash\varphi\Rightarrow\models\varphi$.'
      - 'Итог: выводимое в корректном исчислении общезначимо.'
  p2:
    k: mc
    q: 'Исчисление полно, если…'
    a: 'всякая общезначимая формула в нём выводима'
    e: {lg.meta.swap: 'всякая выводимая формула общезначима'}
    x: ['в нём нельзя вывести противоречие']
  p3:
    k: mc
    lv: 2
    q: 'Что утверждает первая теорема Гёделя о неполноте для непротиворечивой арифметики?'
    a: 'Есть истинное предложение, которое в ней не доказуемо'
    e: {lg.meta.godel: 'В ней вообще ничего нельзя доказать'}
    x: ['Арифметика противоречива']
    h: ['Речь о существовании одного предложения, а не обо всех.']
    sol:
      - 'Теорема говорит о существовании: найдётся предложение $G$, истинное, но не доказуемое в теории.'
      - 'Это не отменяет остальных теорем: арифметика доказывает бесконечно много истинных утверждений.'
      - 'Итог: теория неполна, но не пуста и не противоречива.'
  p4:
    k: spot
    lv: 2
    q: 'Найди ошибку в пересказе теоремы Гёделя.'
    steps:
      - 'Пусть $T$ — непротиворечивая теория, достаточно богатая для арифметики'
      - 'Тогда в $T$ есть предложение $G$, которое в ней ни доказать, ни опровергнуть нельзя'
      - 'При этом обычные теоремы арифметики в $T$ по-прежнему доказываются'
      - 'Значит, $T$ неполна: часть истин лежит вне её доказательств'
    bad:
      - {i: 3, t: 'Поэтому в $T$ нельзя доказать ничего', e: lg.meta.godel}
      - {i: 2, t: 'Тогда $T$ противоречива, потому что в ней есть недоказуемое предложение'}
  p5:
    k: mc
    lv: 2
    q: 'Как соотносятся теорема Гёделя о полноте и теоремы о неполноте?'
    a: 'Логика предикатов полна, арифметика с аксиомами неполна: противоречия нет'
    x: ['Теоремы Гёделя противоречат друг другу', 'Обе теоремы утверждают одно и то же']
err: [lg.meta.swap, lg.meta.godel]
sum:
  - 'Отличаю корректность от полноты исчисления.'
  - 'Умею пересказать смысл первой теоремы Гёделя, не приписывая ей лишнего.'
