id: lg.proof
int:
  - 'Утверждение: сумма первых $n$ нечётных чисел равна $n^2$. Проверка: $1=1$, $1+3=4$, $1+3+5=9$. Можно ли на этом остановиться?'
  - {ask: 'Достаточно ли проверить $n=1, 2, 3, 4, 5$ и сделать вывод для всех $n$?', ans: 'Нет. Примеры только подсказывают. Например, $n^2+n+41$ простое для $n=0,\dots,39$, но $40^2+40+41=41^2$.'}
  - 'Индукция строит бесконечную цепочку: базу проверяют, а шаг показывает, что каждая истина тянет за собой следующую. Метод от противного: допустим обратное и придём к ложному.'
  - {ask: 'Что даст шаг индукции без базы?', ans: 'Ничего: цепочка импликаций не имеет начала, и истинным не обязано быть ни одно $P(n)$.'}
def:
  - {g: induction}
  - {g: proof-by-contradiction}
  - 'Как решать. Индукция: проверь базу $P(n_0)$, затем покажи шаг «из $P(k)$ следует $P(k+1)$». От противного: допусти $\neg A$ и выведи противоречие. Примеры не доказывают утверждение для всех $n$.'
ex:
  - {x: p4, seed: 2}
  - {x: p1, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [4, 6, 8, 10]}
    q: 'Найди $1+2+\dots+@n$.'
    a: n*(n+1)/2
    h: ['Сумма равна $\frac{n(n+1)}{2}$.']
    sol:
      - 'Складываем числа парами с концов: $1+@n$, $2+@{n-1}$, …'
      - 'Каждая пара даёт $@{n+1}$, пар $\frac{@n}2$.'
      - 'Итог: $\frac{@n\cdot@{n+1}}2=@{n*(n+1)/2}$.'
  p2:
    k: mc
    q: 'Достаточно ли проверить утверждение для $n=1, \dots, 5$, чтобы доказать его для всех $n$?'
    a: 'Нет: примеры не заменяют доказательство'
    e: {lg.proof.example: 'Да, пять проверок достаточно'}
    x: ['Достаточно проверить только $n=1$']
    h: ['Вспомни пример $n^2+n+41$.']
  p3:
    k: mc
    lv: 2
    q: 'Что нужно доказать при индукции?'
    a: 'Базу и шаг: из истинности при $k$ следует истинность при $k+1$'
    e: {lg.proof.base: 'Только шаг: из $k$ следует $k+1$'}
    x: ['Только базу']
    h: ['Шаг без базы не гарантирует, что утверждение хоть где-то верно.']
  p4:
    k: num
    lv: 2
    v: {k: 3..9}
    q: 'Известно, что $1+\dots+@k=\frac{@{k}(@k+1)}{2}$. Чему равна сумма $1+\dots+@{k+1}$?'
    a: (k+1)*(k+2)/2
    h: ['Прибавь к сумме до $@k$ следующее слагаемое $@{k+1}$.']
    sol:
      - 'Сумма до $@k$ равна $@{k*(k+1)/2}$.'
      - 'Прибавим следующее слагаемое $@{k+1}$.'
      - 'Итог: $@{k*(k+1)/2}+@{k+1}=@{(k+1)*(k+2)/2}$.'
  p5:
    k: proof
    lv: 2
    q: 'Расставь шаги доказательства по индукции: $1+3+\dots+(2n-1)=n^2$.'
    grp: [[1, 2]]
    steps:
      - 'База: при $n=1$ левая часть равна $1$, правая $1^2=1$'
      - 'Шаг: пусть $1+3+\dots+(2k-1)=k^2$'
      - 'Прибавим $2k+1$: получим $k^2+2k+1$'
      - 'Но $k^2+2k+1=(k+1)^2$'
      - 'По индукции равенство верно при всех $n\ge1$'
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в доказательстве по индукции формулы $1+\dots+n=\frac{n(n+1)}{2}$.'
    steps:
      - 'База: при $n=1$ равенство $1=\frac{1\cdot2}{2}$ верно'
      - 'Шаг: пусть равенство верно при $n=k$'
      - 'Тогда при $n=k+1$ сумма равна $\frac{k(k+1)}{2}+k+1=\frac{(k+1)(k+2)}{2}$'
      - 'По индукции равенство верно при всех $n\ge1$'
    bad:
      - {i: 1, t: 'База не нужна: достаточно сделать шаг', e: lg.proof.base}
      - {i: 3, t: 'Тогда при $n=k+1$ сумма равна $\frac{k(k+1)}{2}+k+1=\frac{(k+1)(k+3)}{2}$'}
err: [lg.proof.base, lg.proof.example]
sum:
  - 'Умею проводить доказательство по индукции: база и шаг.'
  - 'Отличаю примеры от доказательства для всех $n$.'
  - 'Умею объяснять идею доказательства от противного.'
