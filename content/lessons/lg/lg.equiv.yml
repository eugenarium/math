id: lg.equiv
int:
  - 'Как сказать «неверно, что число делится на $2$ и на $3$»? Скорее всего: «не делится на $2$ или не делится на $3$». Эту подмену можно проверить таблицей.'
  - {ask: 'Для числа $4$ какое верно: «не делится на $2$ и не на $3$» или «не делится на $2$ или не на $3$»?', ans: 'Исходное ложно, значит отрицание истинно. «Не делится на $2$ и не на $3$» ложно, а «или» истинно. Отрицание меняет «и» на «или».'}
  - 'Это законы де Моргана. Равносильные высказывания принимают одинаковые значения при всех наборах переменных.'
  - {ask: 'Как отрицается «число чётно или положительно»?', ans: '«Число нечётно и неположительно»: «или» меняется на «и», и каждая часть отрицается.'}
  - {w: truth, f: ['!(p & q)', '!p | !q'], cmp: 1, cap: 'Сравни столбцы $\neg(p\wedge q)$ и $\neg p\vee\neg q$', ask: 'Почему столбцы совпали?', ans: 'Это закон де Моргана: отрицание конъюнкции равносильно дизъюнкции отрицаний.'}
def:
  - {g: equivalence}
  - {g: de-morgan}
  - 'Как решать. Чтобы отрицать «и» или «или», применяй закон де Моргана: смени связку и поставь отрицание на каждую часть. $\neg(A\to B)$ равно $A\wedge\neg B$. Проверь ответ на таблице истинности.'
ex:
  - {x: p4, seed: 2}
  - {x: p1, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 2..5}
    q: 'Сколько из $2^@n$ наборов $@n$ переменных делают истинным $\neg(A_1\wedge A_2)$?'
    a: 3*2^(n-2)
    e: {lg.equiv.demorgan-keep: 2^(n-2)}
    h: ['$\neg(A_1\wedge A_2)\equiv\neg A_1\vee\neg A_2$.']
    sol:
      - 'По закону де Моргана $\neg(A_1\wedge A_2)\equiv\neg A_1\vee\neg A_2$.'
      - 'Формула ложна только при $A_1=A_2=1$: это $2^{@{n-2}}$ наборов из $2^{@n}$.'
      - 'Итог: $2^{@n}-2^{@{n-2}}=@{3*2^(n-2)}$.'
  p2:
    k: mc
    q: 'Чему равносильно $\neg(A\vee B)$?'
    a: '$\neg A\wedge\neg B$'
    e: {lg.equiv.demorgan-keep: '$\neg A\vee\neg B$'}
    x: ['$A\wedge B$']
    h: ['Отрицание меняет «или» на «и».']
  p3:
    k: mc
    lv: 2
    q: 'Чему равносильно $\neg(A\to B)$?'
    a: '$A\wedge\neg B$'
    e: {lg.equiv.neg-impl: '$\neg A\to\neg B$'}
    x: ['$\neg A\vee B$']
    h: ['Импликация ложна только при $A=1$, $B=0$.']
  p4:
    k: num
    lv: 2
    v: {n: 3..6}
    q: 'Сколько из $2^@n$ наборов $@n$ переменных делают ложным $\neg(A_1\vee A_2)\vee A_3$?'
    a: 3*2^(n-3)
    e: {lg.equiv.demorgan-keep: 2^(n-3)}
    h: ['Дизъюнкция ложна, когда обе части ложны.']
    sol:
      - 'Обе части ложны: $A_3=0$ и $\neg(A_1\vee A_2)=0$, то есть $A_1\vee A_2=1$.'
      - 'Для $(A_1, A_2)$ подходят три набора: $11$, $10$, $01$; $A_3$ фиксирована.'
      - 'Остальные $@{n-3}$ переменных свободны: $3\cdot2^@{n-3}=@{3*2^(n-3)}$.'
  p5:
    k: mc
    lv: 2
    q: 'Как отрицается «число делится на $2$ и на $3$»?'
    a: 'Не делится на $2$ или не делится на $3$'
    e: {lg.equiv.demorgan-keep: 'Не делится на $2$ и не делится на $3$'}
    x: ['Делится на $2$ или на $3$']
    h: ['Подставь число $4$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при упрощении $\neg(A\vee\neg B)$.'
    steps:
      - 'Исходное: $\neg(A\vee\neg B)$'
      - 'По де Моргану: $\neg A\wedge\neg\neg B$'
      - 'Двойное отрицание: $\neg A\wedge B$'
      - 'Итог: истинно ровно при $A=0$, $B=1$'
    bad:
      - {i: 2, t: 'По де Моргану: $\neg A\vee\neg\neg B$', e: lg.equiv.demorgan-keep}
      - {i: 4, t: 'Итог: истинно ровно при $A=1$, $B=0$'}
err: [lg.equiv.demorgan-keep, lg.equiv.neg-impl]
sum:
  - 'Умею отрицать конъюнкцию и дизъюнкцию по законам де Моргана.'
  - 'Умею отрицать импликацию: $\neg(A\to B)\equiv A\wedge\neg B$.'
