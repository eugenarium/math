id: lg.nf
int:
  - 'Функция двух переменных принимает значение 0 или 1 на каждом из четырёх наборов $(0,0)$, $(0,1)$, $(1,0)$, $(1,1)$. Сколько различных таблиц можно составить?'
  - {ask: 'Сколько существует различных булевых функций от двух переменных?', ans: 'Шестнадцать: четыре строки, в каждой 0 или 1, всего $2^4=16$. Среди них $\wedge$, $\vee$, $\to$ и ещё тринадцать.'}
  - 'Любую таблицу можно записать формулой из $\neg$, $\wedge$, $\vee$. Для этого берут по одному слагаемому на каждую единицу таблицы.'
def:
  - {g: boolean-function}
  - {g: dnf}
  - {g: cnf}
  - {g: complete-system}
ex:
  - {x: p4, seed: 2}
  - {x: p2, seed: 6}
pr:
  p1:
    k: num
    fast: 1
    v: {n: [1, 2, 3]}
    q: 'Сколько различных булевых функций от $@n$ @{n:w=переменной,переменных,переменных}?'
    a: 2^(2^n)
    e: {lg.nf.count: 2^n}
    h: ['Строк в таблице $2^{@n}$, и каждая получает 0 или 1.']
  p2:
    k: num
    fast: 1
    v: {k: [1, 2, 3, 5, 6, 7]}
    q: 'Функция трёх переменных равна 1 ровно на @k @{k:w=наборе,наборах,наборах}. Сколько слагаемых в её СДНФ?'
    a: k
    e: {lg.nf.zeros: 8-k}
    h: ['Каждой единице таблицы соответствует одно слагаемое.']
    sol:
      - 'Каждой единице таблицы соответствует одно слагаемое СДНФ.'
      - 'Единиц ровно @k.'
      - 'Итог: @k @{k:w=слагаемое,слагаемых,слагаемых}.'
  p3:
    k: mc
    q: 'Какая система связок полна?'
    a: '$\{\neg,\vee\}$'
    e: {lg.nf.complete: '$\{\wedge,\vee\}$'}
    x: ['$\{\wedge,\to\}$']
    h: ['Проверь, можно ли получить $\neg x$ из связок системы.']
  p4:
    k: num
    lv: 2
    v: {n: [3, 4, 5]}
    q: 'Функция $x_1\oplus\dots\oplus x_{@n}$ равна 1, когда среди аргументов нечётное число единиц. На скольких наборах она равна 1?'
    a: 2^(n-1)
    e: {lg.nf.count: 2^n}
    sol:
      - 'Всего наборов: $2^{@n}=@{2^n}$.'
      - 'Первые $@{n-1}$ значений выбираем как угодно, последнее однозначно подгоняет чётность.'
      - 'Итог: $2^{@{n-1}}=@{2^(n-1)}$ наборов.'
  p5:
    k: spot
    lv: 2
    q: 'Найди ошибку при построении СДНФ функции $x\to y$.'
    steps:
      - 'По таблице $x\to y$ равна 0 только на наборе $(1,0)$'
      - 'Единицы стоят на наборах $(0,0)$, $(0,1)$, $(1,1)$'
      - 'Для каждого такого набора берём конъюнкцию: $\neg x\wedge\neg y$, $\neg x\wedge y$, $x\wedge y$'
      - 'Соединяем их знаком $\vee$ и получаем СДНФ'
    bad:
      - {i: 2, t: 'Единица стоит только на наборе $(1,0)$', e: lg.nf.zeros}
      - {i: 3, t: 'Для каждого набора берём конъюнкцию: $x\wedge y$, $x\wedge\neg y$, $\neg x\wedge y$'}
  p6:
    k: mc
    lv: 2
    q: 'Функция $f(x,y)$ равна 0 только на наборе $(1,0)$. Какая дизъюнкция входит в её СКНФ?'
    a: '$\neg x\vee y$'
    x: ['$x\vee\neg y$', '$\neg x\wedge y$']
    h: ['Дизъюнкция должна быть ложной именно при $x=1$, $y=0$.']
err: [lg.nf.count, lg.nf.zeros, lg.nf.complete]
sum:
  - 'Умею считать булевы функции от $n$ переменных и слагаемые СДНФ по таблице.'
  - 'Отличаю СДНФ (по единицам) от СКНФ (по нулям).'
  - 'Умею проверять, полна ли система связок.'
