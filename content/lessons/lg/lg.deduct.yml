id: lg.deduct
int:
  - 'Известно: «если идёт дождь, асфальт мокрый» и «идёт дождь». Что можно утверждать? А если известно только, что асфальт мокрый?'
  - {ask: 'Следует ли из «если дождь, то мокро» и «мокро», что шёл дождь?', ans: 'Нет. Асфальт могла полить машина. Верно только отделение посылки: дождь — значит, мокро.'}
  - 'Вывод — цепочка шагов. Каждый шаг либо посылка, либо следует из предыдущих по правилу, и у каждого шага есть обоснование.'
def:
  - {g: modus-ponens}
  - {g: modus-tollens}
  - {g: deduction-theorem}
ex:
  - {x: p4, seed: 3}
pr:
  p1:
    k: mc
    fast: 1
    q: 'Известно: «если пошёл дождь, асфальт мокрый» и «асфальт мокрый». Что следует о дожде?'
    a: 'Ничего определённого'
    e: {lg.deduct.affirm: 'Дождь шёл'}
    x: ['Дождя не было']
    h: ['Асфальт мог намокнуть по другой причине.']
  p2:
    k: mc
    fast: 1
    q: 'Известно $A\to B$ и $\neg A$. Что следует о $B$?'
    a: 'Ничего определённого'
    e: {lg.deduct.deny: '$B$ ложно'}
    x: ['$B$ истинно']
    h: ['Построй таблицу импликации: что при ложном $A$?']
  p3:
    k: mc
    lv: 2
    q: 'Известно $A\to B$ и $\neg B$. Что следует?'
    a: '$\neg A$'
    x: ['$A$', 'Ничего определённого']
    h: ['Это контрапозиция: если следствие ложно, посылка тоже ложна.']
  p4:
    k: num
    lv: 2
    v: {n: 4..9}
    q: 'Даны посылки $A_1$ и $A_1\to A_2$, $A_2\to A_3$, …, $A_{@{n-1}}\to A_{@n}$. Сколько раз надо применить правило отделения, чтобы вывести $A_{@n}$?'
    a: n-1
    sol:
      - 'Из $A_1$ и $A_1\to A_2$ получаем $A_2$: это один шаг.'
      - 'Каждое следующее $A_i$ получается ещё одним отделением, всего до $A_{@n}$ нужно перейти через $@{n-1}$ импликации.'
      - 'Итог: @{n-1} @{n-1:w=применение,применения,применений}.'
  p5:
    k: proof
    lv: 2
    mode: why
    q: 'Выбери обоснование каждого шага вывода $A\to C$ из посылок $A\to B$ и $B\to C$.'
    steps:
      - ['Допустим $A$', 'Допущение для теоремы о дедукции']
      - ['Из $A$ и $A\to B$ получаем $B$', 'Правило отделения']
      - ['Из $B$ и $B\to C$ получаем $C$', 'Правило отделения, второй раз']
      - ['Из допущения $A$ вывели $C$, значит $A\to C$', 'Теорема о дедукции: допущение снято']
    x: ['Правило отрицания']
  p6:
    k: proof
    q: 'Расставь шаги вывода $B\wedge A$ из посылки $A\wedge B$.'
    grp: [[1, 2]]
    steps:
      - 'Из $A\wedge B$ получаем $A$'
      - 'Из $A\wedge B$ получаем $B$'
      - 'Соединяем $B$ и $A$ знаком конъюнкции: $B\wedge A$'
  p7:
    k: spot
    lv: 2
    q: 'Найди ошибку в выводе $A\to C$ из посылок $A\to B$ и $B\to C$.'
    steps:
      - 'Допустим $A$'
      - 'Из $A$ и $A\to B$ по правилу отделения получаем $B$'
      - 'Из $B$ и $B\to C$ по правилу отделения получаем $C$'
      - 'Допущение снимаем по теореме о дедукции: $A\to C$'
    bad:
      - {i: 2, t: 'Из $B$ и $A\to B$ получаем $A$', e: lg.deduct.affirm}
      - {i: 4, t: 'Значит, $C$ доказано без всяких допущений', e: lg.deduct.assumption}
err: [lg.deduct.affirm, lg.deduct.deny, lg.deduct.assumption]
sum:
  - 'Умею применять правило отделения и не путать его с обратным рассуждением.'
  - 'Отличаю отрицание посылки от контрапозиции.'
  - 'Умею строить вывод с допущением и снимать допущение теоремой о дедукции.'
