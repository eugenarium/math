id: lg.prop
int:
  - 'Высказывание — утверждение, которое либо истинно, либо ложно. «$7$ — простое число» — высказывание. «Сколько сейчас времени?» — нет. Из простых высказываний связками строят составные.'
  - {ask: 'Мама сказала: «Ты получишь конфету или мороженое». Сдержала ли она слово, если дала и то и другое?', ans: 'Да. В логике «или» включающее: дизъюнкция ложна, только когда обе части ложны.'}
  - 'Чтобы найти значение составного высказывания, подставляют значения частей и вычисляют по связкам изнутри наружу.'
def:
  - {g: proposition}
  - {g: connectives}
ex:
  - {x: p2, seed: 2}
pr:
  p1:
    k: num
    fast: 1
    v: {n: 3..6}
    q: 'Сколько строк в таблице истинности высказывания с $@n$ переменными?'
    a: 2^n
    e: {lg.prop.rows: 2*n}
    h: ['Каждая переменная принимает два значения независимо от остальных.']
  p2:
    k: num
    lv: 2
    v: {n: 3..6}
    q: 'Сколько из $2^@n$ наборов значений $@n$ переменных делают истинным высказывание $A_1\vee A_2$?'
    a: 3*2^(n-2)
    e: {lg.prop.or-exclusive: 2^(n-1)}
    h: ['$A_1\vee A_2$ истинно в трёх случаях из четырёх для пары $(A_1, A_2)$.']
    sol:
      - 'Пара $(A_1, A_2)$ имеет $4$ набора, из них $A_1\vee A_2$ истинно в $3$: $11$, $10$, $01$.'
      - 'Остальные $@{n-2}$ переменных свободны: $2^@{n-2}=@{2^(n-2)}$ @{2^(n-2):w=вариант,варианта,вариантов}.'
      - 'Всего $3\cdot@{2^(n-2)}=@{3*2^(n-2)}$ наборов.'
  p3:
    k: num
    lv: 2
    v: {n: 3..6}
    q: 'Сколько из $2^@n$ наборов значений $@n$ переменных делают истинным $(A_1\vee A_2)\wedge A_3$?'
    a: 3*2^(n-3)
    e: {lg.prop.or-exclusive: 2*2^(n-3)}
    h: ['Нужно, чтобы $A_3=1$ и хотя бы одна из $A_1$, $A_2$ была истинна.']
    sol:
      - 'Условие на $A_3$: $A_3=1$, один вариант.'
      - 'Для $(A_1, A_2)$ подходят три набора: $11$, $10$, $01$.'
      - 'Остальные $@{n-3}$ переменных свободны: всего $3\cdot2^@{n-3}=@{3*2^(n-3)}$.'
  p4:
    k: mc
    q: 'Что значит «или» в логической записи $A\vee B$?'
    a: 'Хотя бы одно из двух; возможны оба'
    e: {lg.prop.or-exclusive: 'Ровно одно из двух'}
    x: ['Оба одновременно']
    h: ['Проверь набор $A=1$, $B=1$.']
  p5:
    k: mc
    lv: 2
    q: 'Чему равно $A\vee(B\wedge C)$ при $A=1$, $B=1$, $C=1$?'
    a: '$1$ (истина)'
    e: {lg.prop.or-exclusive: '$0$ (ложь)'}
    x: ['Нельзя определить']
    h: ['Сначала вычисли $B\wedge C$.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку при вычислении $A\wedge\neg B$ при $A=1$, $B=0$.'
    steps:
      - 'Значение $\neg B$ при $B=0$ равно $1$'
      - 'Значение $A$ равно $1$'
      - 'Конъюнкция истинна, если истинны обе части'
      - 'Итог: значение равно $1$'
    bad:
      - {i: 3, t: 'Конъюнкция истинна, если истинна хотя бы одна часть'}
      - {i: 1, t: 'Значение $\neg B$ при $B=0$ равно $0$'}
err: [lg.prop.or-exclusive, lg.prop.rows]
sum:
  - 'Умею вычислять значения составных высказываний со связками $\neg$, $\wedge$, $\vee$.'
  - 'Умею считать строки таблицы истинности: $2^n$.'
  - 'Отличаю включающее «или» от исключающего.'
