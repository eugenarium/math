id: lg.fol
int:
  - 'Формула $\forall x\,\exists y\,(x<y)$: «для каждого числа есть большее». Верна ли она? Это зависит от того, какие числа разрешены.'
  - {ask: 'Верно ли $\forall x\,\exists y\,(x<y)$ на множестве $\{1,2,3\}$?', ans: 'Нет: для $x=3$ в множестве нет большего числа. На множестве $\mathbb N$ формула истинна.'}
  - 'Формула сама по себе ничего не утверждает, пока не задана область и смысл знаков. Эту пару называют интерпретацией.'
def:
  - {g: predicate}
  - {g: interpretation}
  - {g: free-variable}
ex:
  - {x: p3, seed: 2}
pr:
  p1:
    k: mc
    fast: 1
    q: 'Что верно про формулу $\forall x\,(x>0)$?'
    a: 'Истинна на $\mathbb N$, ложна на $\mathbb Z$'
    e: {lg.fol.domain: 'Её истинность не зависит от области'}
    x: ['Истинна на $\mathbb Z$']
    h: ['Проверь $x=0$ на $\mathbb Z$.']
  p2:
    k: num
    fast: 1
    v: {N: [8, 9, 10, 12, 14], k: [2, 3, 4]}
    q: 'Область — числа $1,\dots,@N$. Для скольких значений $x$ истинен предикат «$x$ делится на $@k$»?'
    a: floor(N/k)
    h: ['Считай числа от 1 до $@N$, кратные $@k$.']
  p3:
    k: num
    lv: 2
    v: {N: [4, 5, 6, 7, 8]}
    q: 'Область — числа $1,\dots,@N$. Сколько пар $(x,y)$ делают истинным предикат $x<y$?'
    a: N*(N-1)/2
    sol:
      - 'Для $x=1$ подходят $y=2,\dots,@N$: это $@{N-1}$ значений.'
      - 'Для $x=2$ — на одно меньше, и так далее до $x=@N$, где подходящих $y$ нет.'
      - 'Итог: $@{N-1}+@{N-2}+\dots+1=@{N*(N-1)/2}$.'
  p4:
    k: mc
    q: 'Какая запись — высказывание, а не предикат?'
    a: '$\forall x\,\exists y\,(x<y)$'
    e: {lg.fol.free: '$\exists y\,(x<y)$'}
    x: ['$x<y$']
    h: ['В высказывании нет свободных переменных.']
  p5:
    k: mc
    lv: 2
    q: 'Формула истинна в некоторой интерпретации. Следует ли отсюда, что она общезначима?'
    a: 'Нет: общезначимость требует истинности во всех интерпретациях'
    e: {lg.fol.one: 'Да, раз она истинна'}
    x: ['Да, если область конечна']
    h: ['Одного примера для «всех» не хватает.']
  p6:
    k: spot
    lv: 2
    q: 'Найди ошибку в проверке формулы $\forall x\,\exists y\,(x<y)$ на области $\{1,2,3\}$.'
    steps:
      - 'Проверяем формулу на области $\{1,2,3\}$'
      - 'Для $x=1$ подходит $y=2$, для $x=2$ подходит $y=3$'
      - 'Для $x=3$ подходящего $y$ в области нет'
      - 'Значит, формула ложна на этой области'
    bad:
      - {i: 3, t: 'Для $x=3$ подходит $y=4$, значит, формула истинна', e: lg.fol.domain}
      - {i: 2, t: 'Для $x=1$ подходит $y=1$, для $x=2$ подходит $y=2$'}
err: [lg.fol.domain, lg.fol.free, lg.fol.one]
sum:
  - 'Умею проверять формулу с кванторами на конечной области.'
  - 'Отличаю высказывание от предиката по свободным переменным.'
  - 'Отличаю истинность в одной интерпретации от общезначимости.'
