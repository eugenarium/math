# База типичных ошибок: записи для эталонных уроков. Формат: {t: название, bad: как ошибаются, why: почему неверно, fix: как правильно}
c1.riem.no-dx:
  t: 'Забытый множитель Δx'
  bad: 'Складывают значения функции и не умножают на ширину отрезка.'
  why: 'Сумма высот — не площадь. Площадь столбика — высота, умноженная на ширину $\Delta x$.'
  fix: 'Каждое слагаемое имеет вид $f(c_i)\,\Delta x$. При равных отрезках $\Delta x$ выносится за скобку.'
c1.riem.fencepost:
  t: 'Отрезков n, а точек n+1'
  bad: 'Делят длину отрезка на $n+1$ или берут высоты во всех $n+1$ точках разбиения.'
  why: 'Точки $x_0,\dots,x_n$ — это $n+1$ точка, но между ними $n$ отрезков. Слагаемых в сумме столько же, сколько отрезков.'
  fix: '$\Delta x=\frac{b-a}{n}$. В левой сумме нет точки $x_n$, в правой — точки $x_0$.'
c1.riem.left-under:
  t: 'Левая сумма всегда меньше интеграла'
  bad: 'Считают левую сумму оценкой снизу, а правую — оценкой сверху для любой функции.'
  why: 'Так только у возрастающей функции. У убывающей наоборот, а у немонотонной суммы могут отклоняться в любую сторону.'
  fix: 'Сначала определи, возрастает или убывает функция на отрезке.'

la.eig.zero-vec:
  t: 'Нулевой вектор как собственный'
  bad: 'Считают нулевой вектор собственным, ведь $A\mathbf{0}=\lambda\mathbf{0}$.'
  why: 'Это равенство верно при любом $\lambda$ и ничего не говорит о матрице. Определение требует $\mathbf{v}\ne\mathbf{0}$.'
  fix: 'Собственный вектор всегда ненулевой. А вот собственное значение может быть равно нулю.'
la.eig.real-always:
  t: 'Вещественные собственные значения есть всегда'
  bad: 'Ищут вещественный собственный вектор у любой матрицы.'
  why: 'Поворот на угол, не кратный $\pi$, сдвигает с прямой каждый ненулевой вектор. Корни характеристического многочлена тогда комплексные.'
  fix: 'Для матрицы $2\times2$ проверь знак дискриминанта $(\operatorname{tr}A)^2-4\det A$.'
la.eig.unique-vec:
  t: 'Собственный вектор единственный'
  bad: 'Считают, что собственному значению отвечает ровно один вектор, или что у $c\mathbf{v}$ значение равно $c\lambda$.'
  why: 'Если $A\mathbf{v}=\lambda\mathbf{v}$, то $A(c\mathbf{v})=\lambda(c\mathbf{v})$ при любом $c\ne0$: значение то же.'
  fix: 'Собственный вектор определён с точностью до ненулевого множителя: собственным является целое направление.'
la.eig.lambda-all:
  t: 'λ вычитают из всех элементов'
  bad: 'В матрице $A-\lambda I$ вычитают $\lambda$ из каждого элемента.'
  why: 'У матрицы $\lambda I$ вне диагонали нули, поэтому меняются только диагональные элементы.'
  fix: 'Вычитай $\lambda$ только на главной диагонали.'

st.ci.prob-theta:
  t: 'Вероятность для параметра'
  bad: 'Говорят: «$\mu$ лежит в построенном интервале с вероятностью 95 %».'
  why: 'В частотном подходе $\mu$ — фиксированное число: готовый интервал либо накрывает его, либо нет. Число 0.95 описывает процедуру — долю накрывающих интервалов при повторении выборок.'
  fix: 'Говори: «интервал построен методом, который накрывает $\mu$ в 95 % случаев».'
st.ci.linear-n:
  t: 'Ширина убывает как 1/n'
  bad: 'Делят $\sigma$ на $n$ или ждут, что вдвое большая выборка даст вдвое более узкий интервал.'
  why: 'Стандартная ошибка среднего равна $\sigma/\sqrt{n}$: она убывает как корень из объёма выборки.'
  fix: 'Чтобы сузить интервал в $k$ раз, нужно в $k^2$ раз больше наблюдений.'
st.samp.sd-se:
  t: 'Стандартное отклонение вместо стандартной ошибки'
  bad: 'Подставляют $\sigma$ там, где нужен разброс выборочного среднего.'
  why: '$\sigma$ описывает разброс отдельных наблюдений, а $\mathrm{SE}=\sigma/\sqrt{n}$ — разброс среднего. Среднее колеблется слабее отдельного наблюдения.'
  fix: 'В формулах для среднего всегда дели $\sigma$ на $\sqrt{n}$.'

c1.der.value:
  t: 'Значение функции вместо наклона'
  bad: 'Вместо наклона касательной в точке называют значение функции $f(x_0)$.'
  why: 'Значение функции — высота графика над точкой. Наклон — скорость изменения: насколько быстро график поднимается при сдвиге вправо.'
  fix: 'Наклон касательной равен $f''(x_0)$. Для $y=ax^2$ это $2ax_0$, а значение функции — $ax_0^2$.'
c1.der.limit-skip:
  t: 'Остановились до предела'
  bad: 'Считают разностное отношение при конкретном $h$ и выдают его за производную.'
  why: 'Разностное отношение — наклон секущей. Он близок к наклону касательной только при малых $h$ и равен ему лишь в пределе.'
  fix: 'Упрости отношение и переходи к пределу $h\to0$: слагаемые с $h$ исчезают, остаётся производная.'
pre.sqsum:
  t: 'Квадрат суммы без удвоенного произведения'
  bad: 'Пишут $(x+h)^2=x^2+h^2$.'
  why: 'При раскрытии скобок появляется ещё и перекрёстное слагаемое: $(x+h)(x+h)=x^2+xh+hx+h^2$.'
  fix: '$(x+h)^2=x^2+2xh+h^2$.'

pre.func.inv-recip:
  t: 'Обратная функция принята за 1/f'
  bad: 'Обратную функцию для $f(x)=2x+3$ записывают как $\frac{1}{2x+3}$.'
  why: 'Запись $f^{-1}$ — это не степень. Обратная функция отматывает действие $f$ назад, а $\frac{1}{f(x)}$ — другое число.'
  fix: 'Поменяй $x$ и $y$ местами в $y=f(x)$ и вырази $y$. Для $y=2x+3$ получим $f^{-1}(x)=\frac{x-3}{2}$.'
pre.func.comp-order:
  t: 'Порядок в композиции перепутан'
  bad: 'Значение $(f\circ g)(x)$ считают, применяя сначала $f$, потом $g$.'
  why: 'Запись $f(g(x))$ читается изнутри: сначала вычисляется $g(x)$, потом $f$ от результата.'
  fix: 'В $(f\circ g)(x)$ первой действует $g$. Проверь на числах: порядок обычно меняет результат.'
pre.graph.shift-sign:
  t: 'Сдвиг графика в обратную сторону'
  bad: 'Считают, что график $y=f(x-3)$ сдвинут на 3 влево, а $y=f(x+3)$ — вправо.'
  why: 'Значение $f(x-3)$ в точке $x=5$ равно $f(2)$: график «ждёт» то, что раньше было в точке $2$, поэтому всё переехало вправо.'
  fix: 'Ищи, где обнуляется скобка: $x-3=0$ при $x=3$, начало графика переехало в $x=3$, то есть вправо на 3.'
pre.graph.scale-axis:
  t: 'Множитель внутри скобки действует на ось y'
  bad: 'Считают, что график $y=f(2x)$ растянут вдвое вдоль оси $y$.'
  why: 'Множитель внутри скобки меняет аргумент, а значит работает вдоль оси $x$: чтобы получить прежнее значение, достаточно вдвое меньшего $x$.'
  fix: '$y=f(kx)$ при $k>1$ сжимает график к оси $y$ в $k$ раз. Растягивает по $y$ множитель снаружи: $y=kf(x)$.'
pre.explog.ln-sum:
  t: 'Логарифм суммы разбит на сумму логарифмов'
  bad: 'Пишут $\ln(a+b)=\ln a+\ln b$.'
  why: 'Свойство «логарифм переводит произведение в сумму» относится к $\ln(ab)$. Проверка числами: $\ln(1+2)=\ln3\approx1.10$, а $\ln1+\ln2=0+0.69=0.69$.'
  fix: 'Верно: $\ln(ab)=\ln a+\ln b$. У $\ln(a+b)$ упрощающей формулы нет.'
pre.explog.log-power:
  t: 'Степень под логарифмом вынесена в степень логарифма'
  bad: 'Пишут $\ln x^k=(\ln x)^k$.'
  why: 'Показатель $k$ стоит у $x$, а не у логарифма. При вынесении он становится множителем.'
  fix: '$\ln x^k=k\ln x$. Например, $\ln x^3=3\ln x$, а $(\ln x)^3$ — другая функция.'
pre.explog.log-prod:
  t: 'Логарифм произведения заменён произведением логарифмов'
  bad: 'Пишут $\log_2(8\cdot5)=\log_2 8\cdot\log_2 5$.'
  why: 'Логарифм — показатель степени, а при умножении степеней показатели складываются, а не умножаются.'
  fix: '$\log_a(xy)=\log_a x+\log_a y$. Здесь $\log_2(8\cdot5)=3+\log_2 5$.'
pre.sum.count:
  t: 'Ошибка на единицу в числе слагаемых'
  bad: 'В сумме $\sum_{i=2}^{5} a_i$ насчитывают $5-2=3$ слагаемых.'
  why: 'Считаются обе границы: $i=2,3,4,5$. Разность границ даёт число промежутков, а не число значений.'
  fix: 'Число слагаемых равно $n-m+1$. Для $\sum_{i=2}^{5}$ это $4$.'
pre.sum.const:
  t: 'Константа под знаком суммы не умножена на число слагаемых'
  bad: 'Пишут $\sum_{i=1}^{n} 3=3$.'
  why: 'Под знаком суммы слагаемое без индекса повторяется $n$ раз: $3+3+\dots+3$.'
  fix: '$\sum_{i=1}^{n} c=nc$. Константа добавляется столько раз, сколько слагаемых.'

pre.sets.union-count:
  t: 'Общая часть посчитана дважды'
  bad: 'Число элементов объединения находят как $|A\cup B|=|A|+|B|$.'
  why: 'Элементы пересечения входят и в $A$, и в $B$, поэтому при сложении попадают в сумму дважды.'
  fix: '$|A\cup B|=|A|+|B|-|A\cap B|$: одну копию общей части вычитают.'
pre.sets.de-morgan:
  t: 'Дополнение объединения принято за объединение дополнений'
  bad: 'Пишут $\overline{A\cup B}=\overline{A}\cup\overline{B}$.'
  why: 'Элемент вне объединения не лежит ни в $A$, ни в $B$, то есть он вне обоих множеств сразу. Условие «или» превращается в «и».'
  fix: '$\overline{A\cup B}=\overline{A}\cap\overline{B}$. При переходе к дополнению объединение заменяется пересечением и наоборот.'
pre.ineq.neg-flip:
  t: 'Знак неравенства не изменён при делении на отрицательное'
  bad: 'Из $-3x<12$ получают $x<-4$.'
  why: 'При умножении на отрицательное число порядок на числовой прямой меняется: $1<2$, но $-1>-2$.'
  fix: 'Делим на $-3$ и разворачиваем знак: $x>-4$. Проверка: $x=0$ даёт $0<12$, верно, а $0$ лежит правее $-4$.'
pre.ineq.abs-split:
  t: 'Неравенство с модулем сведено к одному неравенству'
  bad: 'Из $|x-2|<3$ получают только $x-2<3$, то есть $x<5$.'
  why: 'Модуль меньше 3, когда расстояние до $2$ меньше 3 в обе стороны. Левая граница теряется.'
  fix: '$|x-a|<r$ означает $-r<x-a<r$. Здесь $-1<x<5$.'

pre.trig.deg-rad:
  t: 'Перевод градусов в радианы наоборот'
  bad: 'Чтобы перевести $60^\circ$ в радианы, умножают на $\frac{180}{\pi}$ и получают около $3438$.'
  why: 'Радианов должно быть мало: полный оборот — всего $2\pi\approx6.28$ радиан. Множитель $\frac{180}{\pi}$ переводит в обратную сторону.'
  fix: '$d^\circ=\frac{\pi}{180}d$ радиан. Для $60^\circ$ это $\frac{\pi}{3}\approx1.05$. Проверка: развёрнутый угол $180^\circ=\pi$.'
pre.trig.sin-cos-swap:
  t: 'Синус и косинус перепутаны'
  bad: 'Абсциссу точки единичной окружности называют синусом, а ординату — косинусом.'
  why: 'При $\theta=0$ точка $(1, 0)$, а $\sin0=0$, $\cos0=1$: косинус — первая координата, синус — вторая.'
  fix: 'Точка угла $\theta$ — это $(\cos\theta,\ \sin\theta)$. Запомни порядок: «косинус — по оси $x$».'
pre.cx.i-square:
  t: 'Квадрат i принят за плюс единицу'
  bad: 'Вычисляя $(a+bi)(a-bi)$, получают $a^2-b^2$, считая $i^2=1$.'
  why: 'По определению $i^2=-1$. Слагаемое $-b^2i^2$ превращается в $+b^2$.'
  fix: '$(a+bi)(a-bi)=a^2-b^2i^2=a^2+b^2$. Это всегда неотрицательное число: квадрат модуля.'
pre.cx.abs-sum:
  t: 'Модуль суммы принят за сумму модулей'
  bad: 'Считают $|z+w|=|z|+|w|$.'
  why: 'Модуль — длина вектора. Длина диагонали параллелограмма меньше суммы длин сторон, если стороны не сонаправлены.'
  fix: 'Верно неравенство $|z+w|\le|z|+|w|$. Модуль суммы считают по координатам суммы.'

c1.lim.value:
  t: 'Предел принят за значение функции в точке'
  bad: 'Из $f(2)=5$ делают вывод, что $\lim_{x\to2}f(x)=5$. Или говорят, что предела нет, потому что $f$ не определена в точке.'
  why: 'Предел описывает поведение функции рядом с точкой, но не в ней. Значение $f(a)$ в определении предела не участвует.'
  fix: 'Предел и значение в точке — разные числа. У $\frac{x^2-1}{x-1}$ нет значения при $x=1$, но предел равен $2$.'
c1.lim.onesided:
  t: 'Разные односторонние пределы, а предел «есть»'
  bad: 'Для $\frac{|x|}{x}$ при $x\to0$ слева получают $-1$, справа $1$ и записывают, что предел равен $0$ или что он существует.'
  why: 'Предел единственный: к одному числу значения должны стремиться с обеих сторон.'
  fix: 'Предел существует, только если $\lim_{x\to a^-}f=\lim_{x\to a^+}f$. Здесь $-1\ne1$, предела нет.'
c1.cont.limit-only:
  t: 'Существование предела принято за непрерывность'
  bad: 'Говорят, что функция непрерывна в точке, потому что в ней существует предел.'
  why: 'Непрерывность требует три вещи: значение в точке определено, предел существует и они равны. Устранимый разрыв нарушает именно третье или первое.'
  fix: 'Проверяй: $f(a)$ определено, $\lim_{x\to a}f(x)$ существует, и $\lim_{x\to a}f(x)=f(a)$.'
c1.cont.ivt-nocont:
  t: 'Теорема о промежуточном значении без непрерывности'
  bad: 'Из $f(0)<0<f(2)$ делают вывод, что у $f(x)=0$ есть корень на $[0, 2]$, не проверяя непрерывность.'
  why: 'Разрывная функция может «перепрыгнуть» ноль. Например, $f(x)=-1$ при $x<1$ и $f(x)=3$ при $x\ge1$ нулей не имеет.'
  fix: 'Сначала проверь непрерывность на отрезке, потом смотри на знаки значений на концах.'
c1.rules.product:
  t: 'Производная произведения принята за произведение производных'
  bad: 'Пишут $(uv)''=u''v''$.'
  why: 'Проверка: $(x\cdot x)''=(x^2)''=2x$, а $x''\cdot x''=1$. Изменение произведения складывается из двух вкладов.'
  fix: '$(uv)''=u''v+uv''$: производная первого на второй плюс первый на производную второго.'
c1.rules.quotient-order:
  t: 'Порядок разности в производной частного перепутан'
  bad: 'Пишут $\left(\frac{u}{v}\right)''=\frac{uv''-u''v}{v^2}$.'
  why: 'Знак результата получается противоположным. Проверка: $\left(\frac{1}{x}\right)''$ должна быть отрицательной, а по неверной формуле выходит положительное число.'
  fix: '$\left(\frac{u}{v}\right)''=\frac{u''v-uv''}{v^2}$: в числителе первой идёт производная числителя.'
c1.int.const:
  t: 'Потеряна константа C'
  bad: 'Записывают $\int 3x^2\,dx=x^3$ без $+C$ или игнорируют начальное условие.'
  why: 'Производная константы равна нулю, поэтому первообразных бесконечно много: $x^3$, $x^3+1$, $x^3-7$.'
  fix: 'Неопределённый интеграл — это $x^3+C$. Если задано условие вроде $F(0)=5$, найди из него $C$.'
c1.int.product:
  t: 'Интеграл произведения принят за произведение интегралов'
  bad: 'Пишут $\int x\cdot x\,dx=\int x\,dx\cdot\int x\,dx$.'
  why: 'Проверка: $\int x^2\,dx=\frac{x^3}{3}$, а $\left(\frac{x^2}{2}\right)^2=\frac{x^4}{4}$. Интеграл — не умножение функций.'
  fix: 'Для произведения такой формулы нет. Раскрой скобки или упрости произведение и интегрируй по таблице.'
c1.chain.inner:
  t: 'Забыта производная внутренней функции'
  bad: 'Пишут $((3x+1)^4)''=4(3x+1)^3$ и не умножают на $3$.'
  why: 'Внутренняя функция тоже меняется с $x$. Проверка: $(\sin 2x)''$ должна быть равна $2\cos 2x$, а не $\cos 2x$ — скорость колебаний вдвое больше.'
  fix: 'Сначала дифференцируй внешнюю функцию, не трогая скобку, потом умножь на производную скобки.'
c1.sub.dx:
  t: 'Дифференциал dx не пересчитан'
  bad: 'Делают замену $u=3x+1$ и пишут $\int\cos(3x+1)\,dx=\int\cos u\,dx=\sin u+C$.'
  why: '$dx$ тоже нужно выразить через $u$: $du=3\,dx$. Проверка: производная $\sin(3x+1)$ равна $3\cos(3x+1)$, а не $\cos(3x+1)$.'
  fix: 'Выражай $dx=\frac{du}{g''(x)}$ и подставляй. Проверяй результат дифференцированием.'
c1.parts.choice:
  t: 'Неудачный выбор u усложняет интеграл'
  bad: 'Для $\int x e^x\,dx$ берут $u=e^x$, $dv=x\,dx$ и получают интеграл с $x^2$.'
  why: 'Степень $x$ выросла, интеграл стал сложнее. Формула верна, но не упрощает задачу.'
  fix: 'Бери $u=x$: $du=dx$ проще, а $dv=e^x\,dx$ интегрируется сразу.'
c1.opt.endpoints:
  t: 'Забыты значения на концах отрезка'
  bad: 'Ищут наибольшее значение только среди корней $f''=0$.'
  why: 'Максимум на отрезке может быть на конце: у монотонной функции критических точек внутри нет, а наибольшее значение есть.'
  fix: 'Всегда считай $f(a)$, $f(b)$ и значения в критических точках внутри отрезка, затем сравнивай.'
c1.limcalc.zero-zero:
  t: 'Неопределённость $\frac00$ принята за число'
  bad: 'Считают $\frac00=0$ или $\frac00=1$ и останавливаются.'
  why: '$\frac00$ — сигнал, а не ответ. У $\frac{x^2-4}{x-2}$ при $x\to2$ предел равен $4$, у $\frac{3x}{x}$ — равен $3$, хотя форма одна.'
  fix: 'Разложи числитель и знаменатель на множители, сократи общий множитель и подставь снова.'
c1.limcalc.inf-ratio:
  t: 'Неопределённость $\frac{\infty}{\infty}$ принята за единицу'
  bad: 'При $x\to\infty$ пишут $\frac{2x^2+x}{x^2+3}=\frac{\infty}{\infty}=1$.'
  why: 'Оба выражения растут, но в разном темпе. Предел зависит от коэффициентов при старших степенях.'
  fix: 'Раздели числитель и знаменатель на старшую степень $x$. Здесь предел равен $2$.'
c1.lhop.not-indeterminate:
  t: 'Правило Лопиталя без неопределённости'
  bad: 'Для $\lim_{x\to0}\frac{x+2}{x+1}$ дифференцируют числитель и знаменатель и пишут $\frac11=1$.'
  why: 'Правило верно только для $\frac00$ (и $\frac{\infty}{\infty}$). Здесь подстановка даёт $\frac21$, предел равен $2$.'
  fix: 'Сначала подставь предельное значение. Если получилось число, ответ — оно.'
c1.mvt.cond:
  t: 'Теорема Ролля без дифференцируемости'
  bad: 'Для $|x|$ на $[-1, 1]$ говорят, что $f(-1)=f(1)$, значит где-то $f''=0$, и берут $c=0$.'
  why: 'В точке $0$ у $|x|$ нет производной: угол на графике. Условие дифференцируемости на $(a, b)$ нарушено.'
  fix: 'Проверь три условия: непрерывность на $[a, b]$, дифференцируемость на $(a, b)$ и равенство значений на концах.'
c1.mvt.midpoint:
  t: 'Точка $c$ принята за середину отрезка'
  bad: 'Для теоремы Лагранжа берут $c=\frac{a+b}{2}$.'
  why: 'Середина подходит только для квадратичной функции. Для $x^3$ на $[0, 2]$ середина $1$ даёт $f''(1)=3$, а средняя скорость равна $4$.'
  fix: 'Реши уравнение $f''(c)=\frac{f(b)-f(a)}{b-a}$ и выбери корень внутри $(a, b)$.'
c1.seq.never-reaches:
  t: 'Предел обязан не достигаться'
  bad: 'Говорят, что у постоянной последовательности $a_n=3$ нет предела, потому что она «не приближается, а уже равна».'
  why: 'Определение требует $|a_n-L|<\varepsilon$ при больших $n$, а равенство $a_n=L$ этому не мешает. Члены могут совпадать с пределом.'
  fix: 'Проверяй определение, а не картинку «приближения»: для $a_n=3$ разность равна $0$, предел $3$.'
c1.seq.bounded:
  t: 'Ограниченная последовательность считается сходящейся'
  bad: 'Для $a_n=(-1)^n$ говорят, что предел есть, так как значения лежат между $-1$ и $1$.'
  why: 'Ограниченность необходима, но недостаточна. Значения $-1$ и $1$ чередуются и не стремятся к одному числу.'
  fix: 'Сходимость: все члены с некоторого номера близки к одному числу $L$.'
c1.small.sum:
  t: 'Эквивалентность подставлена в сумму'
  bad: 'В пределе $\frac{e^x-1-x}{x^2}$ заменяют $e^x-1$ на $x$, получают $0$ в числителе и ответ $0$.'
  why: 'Главные части $x$ и $x$ сократились, а потерянный остаток порядка $x^2$ как раз определяет ответ.'
  fix: 'В суммах и разностях используй разложение с $o$: $e^x=1+x+\frac{x^2}{2}+o(x^2)$. Предел равен $\frac12$.'
c1.impl.inverse-point:
  t: 'Производная обратной взята не в той точке'
  bad: 'Для $(f^{-1})''(y_0)$ считают $\frac{1}{f''(y_0)}$.'
  why: 'Обратная функция в точке $y_0$ соответствует точке $x_0=f^{-1}(y_0)$. Наклон исходной функции нужен именно там.'
  fix: 'Найди $x_0$ из $f(x_0)=y_0$, затем возьми $\frac{1}{f''(x_0)}$.'
c1.impl.implicit-sign:
  t: 'Потерян знак при выражении $y''$'
  bad: 'Из $2x+3y^2y''=0$ пишут $y''=\frac{2x}{3y^2}$.'
  why: 'Слагаемое $2x$ переносится в другую часть уравнения со сменой знака.'
  fix: '$3y^2y''=-2x$, значит $y''=-\frac{2x}{3y^2}$.'
c1.impl.param-inverted:
  t: 'Перепутана дробь в параметрической производной'
  bad: 'Пишут $\frac{dy}{dx}=\frac{x''(t)}{y''(t)}$.'
  why: 'Проверка размерности: наклон — это изменение $y$ на единицу изменения $x$, то есть $y''$ в числителе.'
  fix: '$\frac{dy}{dx}=\frac{y''(t)}{x''(t)}$.'
c1.study.f0-extremum:
  t: 'Равенство $f''=0$ принято за экстремум'
  bad: 'Для $x^3$ говорят, что в нуле экстремум, ведь $f''(0)=0$.'
  why: 'Экстремум требует смены знака производной. У $f''(x)=3x^2$ знак по обе стороны от нуля плюс: функция возрастает всюду.'
  fix: 'Найди точки $f''=0$ и проверь знак $f''$ слева и справа.'
c1.study.concavity-sign:
  t: 'Перепутан знак второй производной'
  bad: 'Считают, что при $f''''<0$ график лежит над касательными.'
  why: 'Если $f''''<0$, наклон касательной убывает, график изгибается вниз и лежит под касательными. Проверка: у $-x^2$ вторая производная $-2$.'
  fix: '$f''''>0$ — график над касательными, $f''''<0$ — под касательными.'
c1.ftc.area-signed:
  t: 'Интеграл принят за площадь'
  bad: 'Считают, что $\int_0^{2a}(x-a)\,dx$ равен площади фигуры, и не получают нуль.'
  why: 'Интеграл считает площадь над осью положительной, а под осью — отрицательной. Две равные части компенсируют друг друга.'
  fix: 'Интеграл — площадь со знаком. Для настоящей площади считай части над и под осью отдельно.'
c1.ftc.order:
  t: 'Перепутан порядок в формуле Ньютона–Лейбница'
  bad: 'Считают $\int_a^b f\,dx=F(a)-F(b)$.'
  why: 'Знак результата противоположен. Проверка: для положительной $f$ интеграл положителен, а $F$ возрастает.'
  fix: 'Сначала значение в верхнем пределе: $F(b)-F(a)$.'
c1.impr.decay:
  t: 'Стремление подынтегральной функции к нулю принято за сходимость'
  bad: 'Считают, что $\int_1^\infty\frac{dx}{x}$ сходится, ведь $\frac1x\to0$.'
  why: 'Интеграл $\int_1^b\frac{dx}{x}=\ln b$ растёт без ограничения при $b\to\infty$, хоть и медленно.'
  fix: 'Вычисляй предел интеграла от $1$ до $b$. Для $x^{-p}$ сходимость только при $p>1$.'
c1.impr.discontinuity:
  t: 'Формула Ньютона–Лейбница через разрыв'
  bad: 'Для $\int_{-1}^{1}\frac{dx}{x^2}$ берут $F(x)=-\frac1x$ и получают $-2$.'
  why: 'Подынтегральная функция неограниченна в нуле, а интеграл от положительной функции не может быть отрицательным.'
  fix: 'Раздели интеграл в точке разрыва и найди пределы. Здесь каждая часть расходится.'
c1.taylor.factorial:
  t: 'Забыт факториал в коэффициенте Тейлора'
  bad: 'Берут коэффициент при $x^2$ у $e^{2x}$ равным $f''''(0)=4$, не деля на $2!$.'
  why: 'Коэффициент при $x^k$ равен $\frac{f^{(k)}(0)}{k!}$. Иначе $k$-я производная многочлена не совпадёт с $f^{(k)}(0)$.'
  fix: 'Делить производную в точке на $k!$: $\frac{4}{2!}=2$.'
c1.taylor.local:
  t: 'Многочлен Тейлора принят за точное равенство везде'
  bad: 'Считают, что $1+x+\frac{x^2}{2}$ равен $e^x$ при любом $x$, например при $x=10$.'
  why: 'Многочлен совпадает с функцией только в точке разложения, а рядом ошибка мала. При $x=10$ значение $e^{10}\approx22026$ против $61$.'
  fix: 'Используй многочлен рядом с точкой разложения и оценивай погрешность.'
c1.rat.coef:
  t: 'Неверный коэффициент в разложении на простейшие'
  bad: 'Для $\frac{1}{(x-1)(x-3)}$ берут $A=\frac12$ при $\frac{1}{x-1}$.'
  why: 'При $x=1$ равенство $1=A(x-3)+B(x-1)$ даёт $1=-2A$, значит $A=-\frac12$. Знак легко потерять.'
  fix: 'Подставь корень в $1=A(x-b)+B(x-a)$ и реши линейное уравнение.'
c1.rat.lin:
  t: 'Интеграл $\frac{1}{x-a}$ найден как степень'
  bad: 'Пишут $\int\frac{dx}{x-3}=-\frac{1}{(x-3)^2}$ или $\frac{1}{x-3}$.'
  why: 'Производная $\frac{1}{x-3}$ равна $-\frac{1}{(x-3)^2}$, а не $\frac{1}{x-3}$. Подходит только логарифм.'
  fix: '$\int\frac{dx}{x-a}=\ln|x-a|+C$.'
c1.app.sign:
  t: 'Из нижней функции вычтена верхняя'
  bad: 'Площадь между $y=4$ и $y=x^2$ считают как $\int(x^2-4)\,dx$ и получают отрицательное число.'
  why: 'Площадь не бывает отрицательной. Из верхнего графика нужно вычитать нижний.'
  fix: 'Определи, какая кривая выше на отрезке: $S=\int(\text{верхняя}-\text{нижняя})\,dx$.'
c1.app.pi:
  t: 'Забыт множитель $\pi$ в объёме вращения'
  bad: 'Считают объём тела вращения как $\int f^2\,dx$.'
  why: 'Под интегралом площадь круга-сечения $\pi f(x)^2$, а не квадрат радиуса.'
  fix: '$V=\pi\int_a^b f(x)^2\,dx$.'
c1.app.mean:
  t: 'Среднее значение принято за интеграл'
  bad: 'Среднее значение $x^2$ на $[0, 3]$ считают как $\int_0^3x^2\,dx=9$.'
  why: 'Интеграл — это площадь, а среднее значение — высота. Площадь нужно разделить на длину отрезка.'
  fix: '$\bar f=\frac{1}{b-a}\int_a^b f\,dx$.'
lg.prop.or-exclusive:
  t: '«Или» понято как «ровно одно из двух»'
  bad: 'Считают $A\vee B$ ложным, когда истинны оба.'
  why: 'В логике дизъюнкция включающая: она истинна, если истинна хотя бы одна часть, в том числе обе.'
  fix: '$A\vee B$ ложно только при $A=0$ и $B=0$. Из четырёх наборов истинны три.'
lg.prop.rows:
  t: 'Число строк таблицы посчитано неверно'
  bad: 'Для $n$ переменных берут $2n$ или $n^2$ строк.'
  why: 'Каждая переменная независимо принимает два значения, поэтому числа наборов перемножаются.'
  fix: 'Число строк равно $2^n$.'
lg.impl.converse:
  t: 'Обратное утверждение принято за исходное'
  bad: 'Из «если $x>2$, то $x^2>4$» делают вывод «если $x^2>4$, то $x>2$».'
  why: 'Контрпример: $x=-3$. Верно исходное, а обратное ложно.'
  fix: 'Равносильна исходному только контрапозиция $\neg B\to\neg A$.'
lg.impl.false-premise:
  t: 'Импликация с ложной посылкой названа ложной'
  bad: 'Считают «если $2+2=5$, то $3=3$» ложным, потому что посылка ложна.'
  why: 'Импликация нарушена только когда посылка истинна, а вывод ложен. Иначе обещание не проверяется.'
  fix: 'При $A=0$ импликация $A\to B$ истинна при любом $B$.'
lg.equiv.demorgan-keep:
  t: 'Связка при отрицании не изменена'
  bad: 'Пишут $\neg(A\wedge B)\equiv\neg A\wedge\neg B$.'
  why: 'При $A=1$, $B=0$ левая часть истинна, правая ложна. Нужна другая связка.'
  fix: 'По де Моргану $\neg(A\wedge B)\equiv\neg A\vee\neg B$ и $\neg(A\vee B)\equiv\neg A\wedge\neg B$.'
lg.equiv.neg-impl:
  t: 'Отрицание импликации записано как импликация'
  bad: 'Пишут $\neg(A\to B)\equiv\neg A\to\neg B$.'
  why: 'Импликация ложна лишь при $A=1$, $B=0$, а $\neg A\to\neg B$ ложна при $A=0$, $B=1$.'
  fix: '$\neg(A\to B)\equiv A\wedge\neg B$.'
lg.quant.order:
  t: 'Перепутан порядок кванторов'
  bad: 'Считают $\forall x\,\exists y\,(y>x)$ и $\exists y\,\forall x\,(y>x)$ одним и тем же.'
  why: 'В первом $y$ можно подбирать под каждое $x$ (возьми $x+1$). Во втором нужен один $y$, больший всех $x$, а такого нет.'
  fix: 'Читай кванторы слева направо: что стоит раньше, то выбрано раньше.'
lg.quant.neg:
  t: 'При отрицании не изменён квантор'
  bad: 'Отрицанием «каждый студент сдал» считают «каждый студент не сдал».'
  why: 'Достаточно одного студента, не сдавшего экзамен, чтобы исходное утверждение стало ложным.'
  fix: '$\neg\forall x\,P(x)\equiv\exists x\,\neg P(x)$: найдётся $x$, для которого $P$ ложно.'
lg.proof.base:
  t: 'Пропущена база индукции'
  bad: 'Доказывают только шаг «из $P(k)$ следует $P(k+1)$» и объявляют утверждение доказанным.'
  why: 'Шаг не говорит, что хоть одно $P$ истинно. Утверждение «$n=n+1$» проходит шаг, но ложно всегда.'
  fix: 'Проверь базу $P(n_0)$ и только потом шаг.'
lg.proof.example:
  t: 'Примеры приняты за доказательство'
  bad: 'Проверяют утверждение для $n=1,2,3,4,5$ и считают его доказанным для всех $n$.'
  why: 'Конечное число примеров не покрывает бесконечно много случаев. Утверждение $n^2+n+41$ простое проверяется до $n=39$, но при $n=40$ ломается.'
  fix: 'Доказывай общий случай: индукцией или прямым рассуждением. Для опровержения достаточно одного контрпримера.'
la.vec.scalar-one:
  t: 'Число умножено только на одну координату'
  bad: 'Для $2\mathbf{u}$ при $\mathbf{u}=(1, 3)$ пишут $(2, 3)$.'
  why: 'Умножение вектора на число растягивает весь вектор, поэтому множитель применяется к каждой координате.'
  fix: '$k(u_1, u_2)=(ku_1, ku_2)$: здесь $(2, 6)$.'
la.vec.span-all:
  t: 'Линейные комбинации двух векторов всегда заполняют плоскость'
  bad: 'Считают, что комбинации $\mathbf{u}=(1, 2)$ и $\mathbf{v}=(3, 6)$ покрывают всю плоскость.'
  why: 'Векторы коллинеарны: $\mathbf{v}=3\mathbf{u}$. Любая комбинация $a\mathbf{u}+b\mathbf{v}=(a+3b)\mathbf{u}$ лежит на одной прямой.'
  fix: 'Плоскость заполняют только неколлинеарные векторы.'
la.dot.no-norm:
  t: 'Косинус угла без деления на длины'
  bad: 'Считают $\cos\theta=\mathbf{u}\cdot\mathbf{v}$.'
  why: 'Скалярное произведение зависит от длин: у $2\mathbf{u}$ оно вдвое больше, а угол тот же. Косинус не бывает больше $1$.'
  fix: '$\cos\theta=\frac{\mathbf{u}\cdot\mathbf{v}}{|\mathbf{u}||\mathbf{v}|}$.'
la.dot.proj-dir:
  t: 'Коэффициент проекции взят с длиной вместо квадрата'
  bad: 'Проекцию $\mathbf{u}$ на $\mathbf{v}$ записывают как $\frac{\mathbf{u}\cdot\mathbf{v}}{|\mathbf{v}|}\mathbf{v}$.'
  why: 'Дробь $\frac{\mathbf{u}\cdot\mathbf{v}}{|\mathbf{v}|}$ — длина проекции. Чтобы получить вектор, нужен единичный вектор, то есть деление ещё на $|\mathbf{v}|$.'
  fix: '$\operatorname{proj}_{\mathbf{v}}\mathbf{u}=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}$.'
la.sys.contradiction:
  t: 'Уравнение $0=c$ принято за признак бесконечно многих решений'
  bad: 'После исключения получилось $0=3$, и делают вывод, что решений бесконечно много.'
  why: 'Равенство $0=3$ неверно ни при каких значениях неизвестных. Система несовместна.'
  fix: 'Строка $0=c$ при $c\ne0$ означает отсутствие решений.'
la.sys.zero-row:
  t: 'Уравнение $0=0$ принято за противоречие'
  bad: 'Получив $0=0$, делают вывод, что решений нет.'
  why: 'Уравнение $0=0$ верно всегда: оно просто лишнее. Остаётся меньше уравнений, чем неизвестных.'
  fix: 'Нулевая строка не мешает решениям. Если других противоречий нет, решений бесконечно много.'
la.mat.commute:
  t: 'Произведение матриц считают коммутативным'
  bad: 'Пишут $AB=BA$, как $xy=yx$ для чисел.'
  why: 'Для $A=\begin{pmatrix}1&2\\0&1\end{pmatrix}$ и $B=\begin{pmatrix}1&0\\3&1\end{pmatrix}$ первая строка $AB$ равна $(7, 2)$, а $BA$ — $(1, 2)$.'
  fix: 'Порядок важен: сначала строки левой матрицы на столбцы правой. Равенство $AB=BA$ бывает лишь в особых случаях.'
la.mat.zero-div:
  t: 'Из $AB=0$ сделан вывод $A=0$ или $B=0$'
  bad: 'Считают, что у ненулевых матриц произведение не может быть нулевым.'
  why: 'Для $A=\begin{pmatrix}1&0\\0&0\end{pmatrix}$ и $B=\begin{pmatrix}0&0\\0&1\end{pmatrix}$ оба множителя ненулевые, а $AB=0$.'
  fix: 'Для матриц правило «произведение равно нулю, значит один из множителей нуль» не работает.'
la.map.columns:
  t: 'Образы базисных векторов записаны строками матрицы'
  bad: 'Из $f(\mathbf{e}_1)=(2, 1)$ и $f(\mathbf{e}_2)=(-1, 3)$ получают $A=\begin{pmatrix}2&1\\-1&3\end{pmatrix}$.'
  why: 'Столбец матрицы $A\mathbf{e}_1$ — это первый столбец $A$. Он равен $f(\mathbf{e}_1)$.'
  fix: 'Образы базисных векторов — столбцы: $A=\begin{pmatrix}2&-1\\1&3\end{pmatrix}$.'
la.map.shift:
  t: 'Сдвиг принят за линейное отображение'
  bad: 'Считают отображение $(x, y)\mapsto(x+1, y)$ линейным.'
  why: 'Линейное отображение переводит нуль в нуль, а здесь $(0, 0)\mapsto(1, 0)$.'
  fix: 'Проверь $f(\mathbf{0})=\mathbf{0}$ и сохранение сумм и множителей.'
la.inv.order:
  t: 'Обратная к произведению взята без смены порядка'
  bad: 'Пишут $(AB)^{-1}=A^{-1}B^{-1}$.'
  why: 'Произведение $AB$ сначала применяет $B$, затем $A$. Чтобы отменить, сначала отменяют $A$, потом $B$.'
  fix: '$(AB)^{-1}=B^{-1}A^{-1}$, как «сначала надеть носок, потом ботинок» отменяется в обратном порядке.'
la.inv.formula:
  t: 'Перепутаны места и знаки в формуле обратной матрицы'
  bad: 'Для $\begin{pmatrix}a&b\\c&d\end{pmatrix}$ берут $\frac{1}{\det}\begin{pmatrix}a&b\\c&d\end{pmatrix}$ или меняют знаки диагонали.'
  why: 'Проверка: $A\cdot A^{-1}$ должно дать единичную матрицу. Для неверной формулы этого не получается.'
  fix: 'Диагональные элементы меняются местами, недиагональные меняют знак: $\frac{1}{\det A}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$.'
la.det.sum:
  t: 'Определитель суммы принят за сумму определителей'
  bad: 'Пишут $\det(A+B)=\det A+\det B$.'
  why: 'Для $A=B=I$ имеем $\det(A+B)=\det(2I)=4$, а $\det A+\det B=2$.'
  fix: 'Определитель не аддитивен. Верно умножение: $\det(AB)=\det A\det B$.'
la.det.scalar:
  t: 'При умножении матрицы на число определитель умножен один раз'
  bad: 'Считают $\det(kA)=k\det A$.'
  why: 'Число $k$ умножает каждую из $n$ строк, а определитель растёт в $k$ раз от каждой строки.'
  fix: '$\det(kA)=k^n\det A$: для матрицы $2\times2$ это $k^2\det A$.'
la.space.zero:
  t: 'Проверка нулевого вектора пропущена'
  bad: 'Считают прямую $x+y=1$ подпространством плоскости.'
  why: 'Нулевой вектор $(0, 0)$ не удовлетворяет уравнению $x+y=1$. Умножив любой вектор на $0$, из множества выходят.'
  fix: 'Подпространство обязано содержать $\mathbf{0}$. Прямая должна проходить через начало координат.'
la.space.union:
  t: 'Объединение подпространств принято за подпространство'
  bad: 'Считают, что оси $Ox$ и $Oy$ вместе образуют подпространство.'
  why: 'Векторы $(1, 0)$ и $(0, 1)$ лежат в объединении, а их сумма $(1, 1)$ — нет.'
  fix: 'Подпространство должно быть замкнуто относительно сложения. Для объединения это в общем случае не так.'
la.basis.pairwise:
  t: 'Попарная некратность принята за линейную независимость'
  bad: 'Для $(1, 0, 1)$, $(0, 1, 1)$, $(1, 1, 2)$ говорят, что они независимы, ведь никакие два не кратны.'
  why: 'Третий вектор равен сумме первых двух. Нетривиальная комбинация $\mathbf{u}+\mathbf{v}-\mathbf{w}=\mathbf{0}$ показывает зависимость.'
  fix: 'Ищи нетривиальную комбинацию, равную нулю, а не кратные пары.'
la.basis.size:
  t: 'Число векторов базиса не равно размерности'
  bad: 'Считают, что три вектора могут быть базисом плоскости.'
  why: 'В $\mathbb{R}^2$ любые три вектора зависимы: базис всегда состоит ровно из двух векторов.'
  fix: 'Число векторов базиса равно размерности пространства.'
la.rank.rows:
  t: 'Ранг принят за число строк'
  bad: 'Для матрицы с пропорциональными строками считают ранг равным числу строк.'
  why: 'Пропорциональная строка не добавляет независимого направления. Ранг — число независимых строк.'
  fix: 'Исключи строки методом Гаусса и посчитай ненулевые.'
la.rank.nullity:
  t: 'Размерность ядра перепутана с рангом'
  bad: 'Для матрицы $m\times n$ ранга $r$ берут $\dim\ker A=r$ или $m-r$.'
  why: 'Ядро лежит в пространстве столбцов-векторов длины $n$: из $n$ направлений $r$ идут в образ, остальные обнуляются.'
  fix: 'По теореме о ранге $\dim\ker A=n-r$, где $n$ — число столбцов.'
