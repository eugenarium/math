# База типичных ошибок: записи для эталонных уроков. Формат: {t: название, bad: как ошибаются, why: почему неверно, fix: как правильно}
c1.riem.no-dx:
  t: 'Забытый множитель Δx'
  bad: 'Складывают значения функции и не умножают на ширину отрезка.'
  why: 'Сумма высот — не площадь. Площадь столбика — высота, умноженная на ширину $\Delta x$.'
  fix: 'Каждое слагаемое имеет вид $f(c_i)\,\Delta x$. При равных отрезках $\Delta x$ выносится за скобку.'
c1.riem.fencepost:
  t: 'Отрезков n, а точек n+1'
  bad: 'Делят длину отрезка на $n+1$ или берут высоты во всех $n+1$ точках разбиения.'
  why: 'Точки $x_0,\dots,x_n$ — это $n+1$ точка, но между ними $n$ отрезков. Слагаемых в сумме столько же, сколько отрезков.'
  fix: '$\Delta x=\frac{b-a}{n}$. В левой сумме нет точки $x_n$, в правой — точки $x_0$.'
c1.riem.left-under:
  t: 'Левая сумма всегда меньше интеграла'
  bad: 'Считают левую сумму оценкой снизу, а правую — оценкой сверху для любой функции.'
  why: 'Так только у возрастающей функции. У убывающей наоборот, а у немонотонной суммы могут отклоняться в любую сторону.'
  fix: 'Сначала определи, возрастает или убывает функция на отрезке.'

la.eig.zero-vec:
  t: 'Нулевой вектор как собственный'
  bad: 'Считают нулевой вектор собственным, ведь $A\mathbf{0}=\lambda\mathbf{0}$.'
  why: 'Это равенство верно при любом $\lambda$ и ничего не говорит о матрице. Определение требует $\mathbf{v}\ne\mathbf{0}$.'
  fix: 'Собственный вектор всегда ненулевой. А вот собственное значение может быть равно нулю.'
la.eig.real-always:
  t: 'Вещественные собственные значения есть всегда'
  bad: 'Ищут вещественный собственный вектор у любой матрицы.'
  why: 'Поворот на угол, не кратный $\pi$, сдвигает с прямой каждый ненулевой вектор. Корни характеристического многочлена тогда комплексные.'
  fix: 'Для матрицы $2\times2$ проверь знак дискриминанта $(\operatorname{tr}A)^2-4\det A$.'
la.eig.unique-vec:
  t: 'Собственный вектор единственный'
  bad: 'Считают, что собственному значению отвечает ровно один вектор, или что у $c\mathbf{v}$ значение равно $c\lambda$.'
  why: 'Если $A\mathbf{v}=\lambda\mathbf{v}$, то $A(c\mathbf{v})=\lambda(c\mathbf{v})$ при любом $c\ne0$: значение то же.'
  fix: 'Собственный вектор определён с точностью до ненулевого множителя: собственным является целое направление.'
la.eig.lambda-all:
  t: 'λ вычитают из всех элементов'
  bad: 'В матрице $A-\lambda I$ вычитают $\lambda$ из каждого элемента.'
  why: 'У матрицы $\lambda I$ вне диагонали нули, поэтому меняются только диагональные элементы.'
  fix: 'Вычитай $\lambda$ только на главной диагонали.'

st.ci.prob-theta:
  t: 'Вероятность для параметра'
  bad: 'Говорят: «$\mu$ лежит в построенном интервале с вероятностью 95 %».'
  why: 'В частотном подходе $\mu$ — фиксированное число: готовый интервал либо накрывает его, либо нет. Число 0.95 описывает процедуру — долю накрывающих интервалов при повторении выборок.'
  fix: 'Говори: «интервал построен методом, который накрывает $\mu$ в 95 % случаев».'
st.ci.linear-n:
  t: 'Ширина убывает как 1/n'
  bad: 'Делят $\sigma$ на $n$ или ждут, что вдвое большая выборка даст вдвое более узкий интервал.'
  why: 'Стандартная ошибка среднего равна $\sigma/\sqrt{n}$: она убывает как корень из объёма выборки.'
  fix: 'Чтобы сузить интервал в $k$ раз, нужно в $k^2$ раз больше наблюдений.'
st.samp.sd-se:
  t: 'Стандартное отклонение вместо стандартной ошибки'
  bad: 'Подставляют $\sigma$ там, где нужен разброс выборочного среднего.'
  why: '$\sigma$ описывает разброс отдельных наблюдений, а $\mathrm{SE}=\sigma/\sqrt{n}$ — разброс среднего. Среднее колеблется слабее отдельного наблюдения.'
  fix: 'В формулах для среднего всегда дели $\sigma$ на $\sqrt{n}$.'

c1.der.value:
  t: 'Значение функции вместо наклона'
  bad: 'Вместо наклона касательной в точке называют значение функции $f(x_0)$.'
  why: 'Значение функции — высота графика над точкой. Наклон — скорость изменения: насколько быстро график поднимается при сдвиге вправо.'
  fix: 'Наклон касательной равен $f''(x_0)$. Для $y=ax^2$ это $2ax_0$, а значение функции — $ax_0^2$.'
c1.der.limit-skip:
  t: 'Остановились до предела'
  bad: 'Считают разностное отношение при конкретном $h$ и выдают его за производную.'
  why: 'Разностное отношение — наклон секущей. Он близок к наклону касательной только при малых $h$ и равен ему лишь в пределе.'
  fix: 'Упрости отношение и переходи к пределу $h\to0$: слагаемые с $h$ исчезают, остаётся производная.'
pre.sqsum:
  t: 'Квадрат суммы без удвоенного произведения'
  bad: 'Пишут $(x+h)^2=x^2+h^2$.'
  why: 'При раскрытии скобок появляется ещё и перекрёстное слагаемое: $(x+h)(x+h)=x^2+xh+hx+h^2$.'
  fix: '$(x+h)^2=x^2+2xh+h^2$.'

pre.func.inv-recip:
  t: 'Обратная функция принята за 1/f'
  bad: 'Обратную функцию для $f(x)=2x+3$ записывают как $\frac{1}{2x+3}$.'
  why: 'Запись $f^{-1}$ — это не степень. Обратная функция отматывает действие $f$ назад, а $\frac{1}{f(x)}$ — другое число.'
  fix: 'Поменяй $x$ и $y$ местами в $y=f(x)$ и вырази $y$. Для $y=2x+3$ получим $f^{-1}(x)=\frac{x-3}{2}$.'
pre.func.comp-order:
  t: 'Порядок в композиции перепутан'
  bad: 'Значение $(f\circ g)(x)$ считают, применяя сначала $f$, потом $g$.'
  why: 'Запись $f(g(x))$ читается изнутри: сначала вычисляется $g(x)$, потом $f$ от результата.'
  fix: 'В $(f\circ g)(x)$ первой действует $g$. Проверь на числах: порядок обычно меняет результат.'
pre.graph.shift-sign:
  t: 'Сдвиг графика в обратную сторону'
  bad: 'Считают, что график $y=f(x-3)$ сдвинут на 3 влево, а $y=f(x+3)$ — вправо.'
  why: 'Значение $f(x-3)$ в точке $x=5$ равно $f(2)$: график «ждёт» то, что раньше было в точке $2$, поэтому всё переехало вправо.'
  fix: 'Ищи, где обнуляется скобка: $x-3=0$ при $x=3$, начало графика переехало в $x=3$, то есть вправо на 3.'
pre.graph.scale-axis:
  t: 'Множитель внутри скобки действует на ось y'
  bad: 'Считают, что график $y=f(2x)$ растянут вдвое вдоль оси $y$.'
  why: 'Множитель внутри скобки меняет аргумент, а значит работает вдоль оси $x$: чтобы получить прежнее значение, достаточно вдвое меньшего $x$.'
  fix: '$y=f(kx)$ при $k>1$ сжимает график к оси $y$ в $k$ раз. Растягивает по $y$ множитель снаружи: $y=kf(x)$.'
pre.explog.ln-sum:
  t: 'Логарифм суммы разбит на сумму логарифмов'
  bad: 'Пишут $\ln(a+b)=\ln a+\ln b$.'
  why: 'Свойство «логарифм переводит произведение в сумму» относится к $\ln(ab)$. Проверка числами: $\ln(1+2)=\ln3\approx1.10$, а $\ln1+\ln2=0+0.69=0.69$.'
  fix: 'Верно: $\ln(ab)=\ln a+\ln b$. У $\ln(a+b)$ упрощающей формулы нет.'
pre.explog.log-power:
  t: 'Степень под логарифмом вынесена в степень логарифма'
  bad: 'Пишут $\ln x^k=(\ln x)^k$.'
  why: 'Показатель $k$ стоит у $x$, а не у логарифма. При вынесении он становится множителем.'
  fix: '$\ln x^k=k\ln x$. Например, $\ln x^3=3\ln x$, а $(\ln x)^3$ — другая функция.'
pre.explog.log-prod:
  t: 'Логарифм произведения заменён произведением логарифмов'
  bad: 'Пишут $\log_2(8\cdot5)=\log_2 8\cdot\log_2 5$.'
  why: 'Логарифм — показатель степени, а при умножении степеней показатели складываются, а не умножаются.'
  fix: '$\log_a(xy)=\log_a x+\log_a y$. Здесь $\log_2(8\cdot5)=3+\log_2 5$.'
pre.sum.count:
  t: 'Ошибка на единицу в числе слагаемых'
  bad: 'В сумме $\sum_{i=2}^{5} a_i$ насчитывают $5-2=3$ слагаемых.'
  why: 'Считаются обе границы: $i=2,3,4,5$. Разность границ даёт число промежутков, а не число значений.'
  fix: 'Число слагаемых равно $n-m+1$. Для $\sum_{i=2}^{5}$ это $4$.'
pre.sum.const:
  t: 'Константа под знаком суммы не умножена на число слагаемых'
  bad: 'Пишут $\sum_{i=1}^{n} 3=3$.'
  why: 'Под знаком суммы слагаемое без индекса повторяется $n$ раз: $3+3+\dots+3$.'
  fix: '$\sum_{i=1}^{n} c=nc$. Константа добавляется столько раз, сколько слагаемых.'

pre.sets.union-count:
  t: 'Общая часть посчитана дважды'
  bad: 'Число элементов объединения находят как $|A\cup B|=|A|+|B|$.'
  why: 'Элементы пересечения входят и в $A$, и в $B$, поэтому при сложении попадают в сумму дважды.'
  fix: '$|A\cup B|=|A|+|B|-|A\cap B|$: одну копию общей части вычитают.'
pre.sets.de-morgan:
  t: 'Дополнение объединения принято за объединение дополнений'
  bad: 'Пишут $\overline{A\cup B}=\overline{A}\cup\overline{B}$.'
  why: 'Элемент вне объединения не лежит ни в $A$, ни в $B$, то есть он вне обоих множеств сразу. Условие «или» превращается в «и».'
  fix: '$\overline{A\cup B}=\overline{A}\cap\overline{B}$. При переходе к дополнению объединение заменяется пересечением и наоборот.'
pre.ineq.neg-flip:
  t: 'Знак неравенства не изменён при делении на отрицательное'
  bad: 'Из $-3x<12$ получают $x<-4$.'
  why: 'При умножении на отрицательное число порядок на числовой прямой меняется: $1<2$, но $-1>-2$.'
  fix: 'Делим на $-3$ и разворачиваем знак: $x>-4$. Проверка: $x=0$ даёт $0<12$, верно, а $0$ лежит правее $-4$.'
pre.ineq.abs-split:
  t: 'Неравенство с модулем сведено к одному неравенству'
  bad: 'Из $|x-2|<3$ получают только $x-2<3$, то есть $x<5$.'
  why: 'Модуль меньше 3, когда расстояние до $2$ меньше 3 в обе стороны. Левая граница теряется.'
  fix: '$|x-a|<r$ означает $-r<x-a<r$. Здесь $-1<x<5$.'

pre.trig.deg-rad:
  t: 'Перевод градусов в радианы наоборот'
  bad: 'Чтобы перевести $60^\circ$ в радианы, умножают на $\frac{180}{\pi}$ и получают около $3438$.'
  why: 'Радианов должно быть мало: полный оборот — всего $2\pi\approx6.28$ радиан. Множитель $\frac{180}{\pi}$ переводит в обратную сторону.'
  fix: '$d^\circ=\frac{\pi}{180}d$ радиан. Для $60^\circ$ это $\frac{\pi}{3}\approx1.05$. Проверка: развёрнутый угол $180^\circ=\pi$.'
pre.trig.sin-cos-swap:
  t: 'Синус и косинус перепутаны'
  bad: 'Абсциссу точки единичной окружности называют синусом, а ординату — косинусом.'
  why: 'При $\theta=0$ точка $(1, 0)$, а $\sin0=0$, $\cos0=1$: косинус — первая координата, синус — вторая.'
  fix: 'Точка угла $\theta$ — это $(\cos\theta,\ \sin\theta)$. Запомни порядок: «косинус — по оси $x$».'
pre.cx.i-square:
  t: 'Квадрат i принят за плюс единицу'
  bad: 'Вычисляя $(a+bi)(a-bi)$, получают $a^2-b^2$, считая $i^2=1$.'
  why: 'По определению $i^2=-1$. Слагаемое $-b^2i^2$ превращается в $+b^2$.'
  fix: '$(a+bi)(a-bi)=a^2-b^2i^2=a^2+b^2$. Это всегда неотрицательное число: квадрат модуля.'
pre.cx.abs-sum:
  t: 'Модуль суммы принят за сумму модулей'
  bad: 'Считают $|z+w|=|z|+|w|$.'
  why: 'Модуль — длина вектора. Длина диагонали параллелограмма меньше суммы длин сторон, если стороны не сонаправлены.'
  fix: 'Верно неравенство $|z+w|\le|z|+|w|$. Модуль суммы считают по координатам суммы.'

c1.lim.value:
  t: 'Предел принят за значение функции в точке'
  bad: 'Из $f(2)=5$ делают вывод, что $\lim_{x\to2}f(x)=5$. Или говорят, что предела нет, потому что $f$ не определена в точке.'
  why: 'Предел описывает поведение функции рядом с точкой, но не в ней. Значение $f(a)$ в определении предела не участвует.'
  fix: 'Предел и значение в точке — разные числа. У $\frac{x^2-1}{x-1}$ нет значения при $x=1$, но предел равен $2$.'
c1.lim.onesided:
  t: 'Разные односторонние пределы, а предел «есть»'
  bad: 'Для $\frac{|x|}{x}$ при $x\to0$ слева получают $-1$, справа $1$ и записывают, что предел равен $0$ или что он существует.'
  why: 'Предел единственный: к одному числу значения должны стремиться с обеих сторон.'
  fix: 'Предел существует, только если $\lim_{x\to a^-}f=\lim_{x\to a^+}f$. Здесь $-1\ne1$, предела нет.'
c1.cont.limit-only:
  t: 'Существование предела принято за непрерывность'
  bad: 'Говорят, что функция непрерывна в точке, потому что в ней существует предел.'
  why: 'Непрерывность требует три вещи: значение в точке определено, предел существует и они равны. Устранимый разрыв нарушает именно третье или первое.'
  fix: 'Проверяй: $f(a)$ определено, $\lim_{x\to a}f(x)$ существует, и $\lim_{x\to a}f(x)=f(a)$.'
c1.cont.ivt-nocont:
  t: 'Теорема о промежуточном значении без непрерывности'
  bad: 'Из $f(0)<0<f(2)$ делают вывод, что у $f(x)=0$ есть корень на $[0, 2]$, не проверяя непрерывность.'
  why: 'Разрывная функция может «перепрыгнуть» ноль. Например, $f(x)=-1$ при $x<1$ и $f(x)=3$ при $x\ge1$ нулей не имеет.'
  fix: 'Сначала проверь непрерывность на отрезке, потом смотри на знаки значений на концах.'
c1.rules.product:
  t: 'Производная произведения принята за произведение производных'
  bad: 'Пишут $(uv)''=u''v''$.'
  why: 'Проверка: $(x\cdot x)''=(x^2)''=2x$, а $x''\cdot x''=1$. Изменение произведения складывается из двух вкладов.'
  fix: '$(uv)''=u''v+uv''$: производная первого на второй плюс первый на производную второго.'
c1.rules.quotient-order:
  t: 'Порядок разности в производной частного перепутан'
  bad: 'Пишут $\left(\frac{u}{v}\right)''=\frac{uv''-u''v}{v^2}$.'
  why: 'Знак результата получается противоположным. Проверка: $\left(\frac{1}{x}\right)''$ должна быть отрицательной, а по неверной формуле выходит положительное число.'
  fix: '$\left(\frac{u}{v}\right)''=\frac{u''v-uv''}{v^2}$: в числителе первой идёт производная числителя.'
c1.int.const:
  t: 'Потеряна константа C'
  bad: 'Записывают $\int 3x^2\,dx=x^3$ без $+C$ или игнорируют начальное условие.'
  why: 'Производная константы равна нулю, поэтому первообразных бесконечно много: $x^3$, $x^3+1$, $x^3-7$.'
  fix: 'Неопределённый интеграл — это $x^3+C$. Если задано условие вроде $F(0)=5$, найди из него $C$.'
c1.int.product:
  t: 'Интеграл произведения принят за произведение интегралов'
  bad: 'Пишут $\int x\cdot x\,dx=\int x\,dx\cdot\int x\,dx$.'
  why: 'Проверка: $\int x^2\,dx=\frac{x^3}{3}$, а $\left(\frac{x^2}{2}\right)^2=\frac{x^4}{4}$. Интеграл — не умножение функций.'
  fix: 'Для произведения такой формулы нет. Раскрой скобки или упрости произведение и интегрируй по таблице.'
