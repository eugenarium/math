# База типичных ошибок: записи для эталонных уроков. Формат: {t: название, bad: как ошибаются, why: почему неверно, fix: как правильно}
c1.riem.no-dx:
  t: 'Забытый множитель Δx'
  bad: 'Складывают значения функции и не умножают на ширину отрезка.'
  why: 'Сумма высот — не площадь. Площадь столбика — высота, умноженная на ширину $\Delta x$.'
  fix: 'Каждое слагаемое имеет вид $f(c_i)\,\Delta x$. При равных отрезках $\Delta x$ выносится за скобку.'
c1.riem.fencepost:
  t: 'Отрезков n, а точек n+1'
  bad: 'Делят длину отрезка на $n+1$ или берут высоты во всех $n+1$ точках разбиения.'
  why: 'Точки $x_0,\dots,x_n$ — это $n+1$ точка, но между ними $n$ отрезков. Слагаемых в сумме столько же, сколько отрезков.'
  fix: '$\Delta x=\frac{b-a}{n}$. В левой сумме нет точки $x_n$, в правой — точки $x_0$.'
c1.riem.left-under:
  t: 'Левая сумма всегда меньше интеграла'
  bad: 'Считают левую сумму оценкой снизу, а правую — оценкой сверху для любой функции.'
  why: 'Так только у возрастающей функции. У убывающей наоборот, а у немонотонной суммы могут отклоняться в любую сторону.'
  fix: 'Сначала определи, возрастает или убывает функция на отрезке.'

la.eig.zero-vec:
  t: 'Нулевой вектор как собственный'
  bad: 'Считают нулевой вектор собственным, ведь $A\mathbf{0}=\lambda\mathbf{0}$.'
  why: 'Это равенство верно при любом $\lambda$ и ничего не говорит о матрице. Определение требует $\mathbf{v}\ne\mathbf{0}$.'
  fix: 'Собственный вектор всегда ненулевой. А вот собственное значение может быть равно нулю.'
la.eig.real-always:
  t: 'Вещественные собственные значения есть всегда'
  bad: 'Ищут вещественный собственный вектор у любой матрицы.'
  why: 'Поворот на угол, не кратный $\pi$, сдвигает с прямой каждый ненулевой вектор. Корни характеристического многочлена тогда комплексные.'
  fix: 'Для матрицы $2\times2$ проверь знак дискриминанта $(\operatorname{tr}A)^2-4\det A$.'
la.eig.unique-vec:
  t: 'Собственный вектор единственный'
  bad: 'Считают, что собственному значению отвечает ровно один вектор, или что у $c\mathbf{v}$ значение равно $c\lambda$.'
  why: 'Если $A\mathbf{v}=\lambda\mathbf{v}$, то $A(c\mathbf{v})=\lambda(c\mathbf{v})$ при любом $c\ne0$: значение то же.'
  fix: 'Собственный вектор определён с точностью до ненулевого множителя: собственным является целое направление.'
la.eig.lambda-all:
  t: 'λ вычитают из всех элементов'
  bad: 'В матрице $A-\lambda I$ вычитают $\lambda$ из каждого элемента.'
  why: 'У матрицы $\lambda I$ вне диагонали нули, поэтому меняются только диагональные элементы.'
  fix: 'Вычитай $\lambda$ только на главной диагонали.'

st.ci.prob-theta:
  t: 'Вероятность для параметра'
  bad: 'Говорят: «$\mu$ лежит в построенном интервале с вероятностью 95 %».'
  why: 'В частотном подходе $\mu$ — фиксированное число: готовый интервал либо накрывает его, либо нет. Число 0.95 описывает процедуру — долю накрывающих интервалов при повторении выборок.'
  fix: 'Говори: «интервал построен методом, который накрывает $\mu$ в 95 % случаев».'
st.ci.linear-n:
  t: 'Ширина убывает как 1/n'
  bad: 'Делят $\sigma$ на $n$ или ждут, что вдвое большая выборка даст вдвое более узкий интервал.'
  why: 'Стандартная ошибка среднего равна $\sigma/\sqrt{n}$: она убывает как корень из объёма выборки.'
  fix: 'Чтобы сузить интервал в $k$ раз, нужно в $k^2$ раз больше наблюдений.'
st.samp.sd-se:
  t: 'Стандартное отклонение вместо стандартной ошибки'
  bad: 'Подставляют $\sigma$ там, где нужен разброс выборочного среднего.'
  why: '$\sigma$ описывает разброс отдельных наблюдений, а $\mathrm{SE}=\sigma/\sqrt{n}$ — разброс среднего. Среднее колеблется слабее отдельного наблюдения.'
  fix: 'В формулах для среднего всегда дели $\sigma$ на $\sqrt{n}$.'

c1.der.value:
  t: 'Значение функции вместо наклона'
  bad: 'Вместо наклона касательной в точке называют значение функции $f(x_0)$.'
  why: 'Значение функции — высота графика над точкой. Наклон — скорость изменения: насколько быстро график поднимается при сдвиге вправо.'
  fix: 'Наклон касательной равен $f''(x_0)$. Для $y=ax^2$ это $2ax_0$, а значение функции — $ax_0^2$.'
c1.der.limit-skip:
  t: 'Остановились до предела'
  bad: 'Считают разностное отношение при конкретном $h$ и выдают его за производную.'
  why: 'Разностное отношение — наклон секущей. Он близок к наклону касательной только при малых $h$ и равен ему лишь в пределе.'
  fix: 'Упрости отношение и переходи к пределу $h\to0$: слагаемые с $h$ исчезают, остаётся производная.'
pre.sqsum:
  t: 'Квадрат суммы без удвоенного произведения'
  bad: 'Пишут $(x+h)^2=x^2+h^2$.'
  why: 'При раскрытии скобок появляется ещё и перекрёстное слагаемое: $(x+h)(x+h)=x^2+xh+hx+h^2$.'
  fix: '$(x+h)^2=x^2+2xh+h^2$.'

pre.func.inv-recip:
  t: 'Обратная функция принята за 1/f'
  bad: 'Обратную функцию для $f(x)=2x+3$ записывают как $\frac{1}{2x+3}$.'
  why: 'Запись $f^{-1}$ — это не степень. Обратная функция отматывает действие $f$ назад, а $\frac{1}{f(x)}$ — другое число.'
  fix: 'Поменяй $x$ и $y$ местами в $y=f(x)$ и вырази $y$. Для $y=2x+3$ получим $f^{-1}(x)=\frac{x-3}{2}$.'
pre.func.comp-order:
  t: 'Порядок в композиции перепутан'
  bad: 'Значение $(f\circ g)(x)$ считают, применяя сначала $f$, потом $g$.'
  why: 'Запись $f(g(x))$ читается изнутри: сначала вычисляется $g(x)$, потом $f$ от результата.'
  fix: 'В $(f\circ g)(x)$ первой действует $g$. Проверь на числах: порядок обычно меняет результат.'
pre.graph.shift-sign:
  t: 'Сдвиг графика в обратную сторону'
  bad: 'Считают, что график $y=f(x-3)$ сдвинут на 3 влево, а $y=f(x+3)$ — вправо.'
  why: 'Значение $f(x-3)$ в точке $x=5$ равно $f(2)$: график «ждёт» то, что раньше было в точке $2$, поэтому всё переехало вправо.'
  fix: 'Ищи, где обнуляется скобка: $x-3=0$ при $x=3$, начало графика переехало в $x=3$, то есть вправо на 3.'
pre.graph.scale-axis:
  t: 'Множитель внутри скобки действует на ось y'
  bad: 'Считают, что график $y=f(2x)$ растянут вдвое вдоль оси $y$.'
  why: 'Множитель внутри скобки меняет аргумент, а значит работает вдоль оси $x$: чтобы получить прежнее значение, достаточно вдвое меньшего $x$.'
  fix: '$y=f(kx)$ при $k>1$ сжимает график к оси $y$ в $k$ раз. Растягивает по $y$ множитель снаружи: $y=kf(x)$.'
pre.explog.ln-sum:
  t: 'Логарифм суммы разбит на сумму логарифмов'
  bad: 'Пишут $\ln(a+b)=\ln a+\ln b$.'
  why: 'Свойство «логарифм переводит произведение в сумму» относится к $\ln(ab)$. Проверка числами: $\ln(1+2)=\ln3\approx1.10$, а $\ln1+\ln2=0+0.69=0.69$.'
  fix: 'Верно: $\ln(ab)=\ln a+\ln b$. У $\ln(a+b)$ упрощающей формулы нет.'
pre.explog.log-power:
  t: 'Степень под логарифмом вынесена в степень логарифма'
  bad: 'Пишут $\ln x^k=(\ln x)^k$.'
  why: 'Показатель $k$ стоит у $x$, а не у логарифма. При вынесении он становится множителем.'
  fix: '$\ln x^k=k\ln x$. Например, $\ln x^3=3\ln x$, а $(\ln x)^3$ — другая функция.'
pre.explog.log-prod:
  t: 'Логарифм произведения заменён произведением логарифмов'
  bad: 'Пишут $\log_2(8\cdot5)=\log_2 8\cdot\log_2 5$.'
  why: 'Логарифм — показатель степени, а при умножении степеней показатели складываются, а не умножаются.'
  fix: '$\log_a(xy)=\log_a x+\log_a y$. Здесь $\log_2(8\cdot5)=3+\log_2 5$.'
pre.sum.count:
  t: 'Ошибка на единицу в числе слагаемых'
  bad: 'В сумме $\sum_{i=2}^{5} a_i$ насчитывают $5-2=3$ слагаемых.'
  why: 'Считаются обе границы: $i=2,3,4,5$. Разность границ даёт число промежутков, а не число значений.'
  fix: 'Число слагаемых равно $n-m+1$. Для $\sum_{i=2}^{5}$ это $4$.'
pre.sum.const:
  t: 'Константа под знаком суммы не умножена на число слагаемых'
  bad: 'Пишут $\sum_{i=1}^{n} 3=3$.'
  why: 'Под знаком суммы слагаемое без индекса повторяется $n$ раз: $3+3+\dots+3$.'
  fix: '$\sum_{i=1}^{n} c=nc$. Константа добавляется столько раз, сколько слагаемых.'

pre.sets.union-count:
  t: 'Общая часть посчитана дважды'
  bad: 'Число элементов объединения находят как $|A\cup B|=|A|+|B|$.'
  why: 'Элементы пересечения входят и в $A$, и в $B$, поэтому при сложении попадают в сумму дважды.'
  fix: '$|A\cup B|=|A|+|B|-|A\cap B|$: одну копию общей части вычитают.'
pre.sets.de-morgan:
  t: 'Дополнение объединения принято за объединение дополнений'
  bad: 'Пишут $\overline{A\cup B}=\overline{A}\cup\overline{B}$.'
  why: 'Элемент вне объединения не лежит ни в $A$, ни в $B$, то есть он вне обоих множеств сразу. Условие «или» превращается в «и».'
  fix: '$\overline{A\cup B}=\overline{A}\cap\overline{B}$. При переходе к дополнению объединение заменяется пересечением и наоборот.'
pre.ineq.neg-flip:
  t: 'Знак неравенства не изменён при делении на отрицательное'
  bad: 'Из $-3x<12$ получают $x<-4$.'
  why: 'При умножении на отрицательное число порядок на числовой прямой меняется: $1<2$, но $-1>-2$.'
  fix: 'Делим на $-3$ и разворачиваем знак: $x>-4$. Проверка: $x=0$ даёт $0<12$, верно, а $0$ лежит правее $-4$.'
pre.ineq.abs-split:
  t: 'Неравенство с модулем сведено к одному неравенству'
  bad: 'Из $|x-2|<3$ получают только $x-2<3$, то есть $x<5$.'
  why: 'Модуль меньше 3, когда расстояние до $2$ меньше 3 в обе стороны. Левая граница теряется.'
  fix: '$|x-a|<r$ означает $-r<x-a<r$. Здесь $-1<x<5$.'

pre.trig.deg-rad:
  t: 'Перевод градусов в радианы наоборот'
  bad: 'Чтобы перевести $60^\circ$ в радианы, умножают на $\frac{180}{\pi}$ и получают около $3438$.'
  why: 'Радианов должно быть мало: полный оборот — всего $2\pi\approx6.28$ радиан. Множитель $\frac{180}{\pi}$ переводит в обратную сторону.'
  fix: '$d^\circ=\frac{\pi}{180}d$ радиан. Для $60^\circ$ это $\frac{\pi}{3}\approx1.05$. Проверка: развёрнутый угол $180^\circ=\pi$.'
pre.trig.sin-cos-swap:
  t: 'Синус и косинус перепутаны'
  bad: 'Абсциссу точки единичной окружности называют синусом, а ординату — косинусом.'
  why: 'При $\theta=0$ точка $(1, 0)$, а $\sin0=0$, $\cos0=1$: косинус — первая координата, синус — вторая.'
  fix: 'Точка угла $\theta$ — это $(\cos\theta,\ \sin\theta)$. Запомни порядок: «косинус — по оси $x$».'
pre.cx.i-square:
  t: 'Квадрат i принят за плюс единицу'
  bad: 'Вычисляя $(a+bi)(a-bi)$, получают $a^2-b^2$, считая $i^2=1$.'
  why: 'По определению $i^2=-1$. Слагаемое $-b^2i^2$ превращается в $+b^2$.'
  fix: '$(a+bi)(a-bi)=a^2-b^2i^2=a^2+b^2$. Это всегда неотрицательное число: квадрат модуля.'
pre.cx.abs-sum:
  t: 'Модуль суммы принят за сумму модулей'
  bad: 'Считают $|z+w|=|z|+|w|$.'
  why: 'Модуль — длина вектора. Длина диагонали параллелограмма меньше суммы длин сторон, если стороны не сонаправлены.'
  fix: 'Верно неравенство $|z+w|\le|z|+|w|$. Модуль суммы считают по координатам суммы.'

c1.lim.value:
  t: 'Предел принят за значение функции в точке'
  bad: 'Из $f(2)=5$ делают вывод, что $\lim_{x\to2}f(x)=5$. Или говорят, что предела нет, потому что $f$ не определена в точке.'
  why: 'Предел описывает поведение функции рядом с точкой, но не в ней. Значение $f(a)$ в определении предела не участвует.'
  fix: 'Предел и значение в точке — разные числа. У $\frac{x^2-1}{x-1}$ нет значения при $x=1$, но предел равен $2$.'
c1.lim.onesided:
  t: 'Разные односторонние пределы, а предел «есть»'
  bad: 'Для $\frac{|x|}{x}$ при $x\to0$ слева получают $-1$, справа $1$ и записывают, что предел равен $0$ или что он существует.'
  why: 'Предел единственный: к одному числу значения должны стремиться с обеих сторон.'
  fix: 'Предел существует, только если $\lim_{x\to a^-}f=\lim_{x\to a^+}f$. Здесь $-1\ne1$, предела нет.'
c1.cont.limit-only:
  t: 'Существование предела принято за непрерывность'
  bad: 'Говорят, что функция непрерывна в точке, потому что в ней существует предел.'
  why: 'Непрерывность требует три вещи: значение в точке определено, предел существует и они равны. Устранимый разрыв нарушает именно третье или первое.'
  fix: 'Проверяй: $f(a)$ определено, $\lim_{x\to a}f(x)$ существует, и $\lim_{x\to a}f(x)=f(a)$.'
c1.cont.ivt-nocont:
  t: 'Теорема о промежуточном значении без непрерывности'
  bad: 'Из $f(0)<0<f(2)$ делают вывод, что у $f(x)=0$ есть корень на $[0, 2]$, не проверяя непрерывность.'
  why: 'Разрывная функция может «перепрыгнуть» ноль. Например, $f(x)=-1$ при $x<1$ и $f(x)=3$ при $x\ge1$ нулей не имеет.'
  fix: 'Сначала проверь непрерывность на отрезке, потом смотри на знаки значений на концах.'
c1.rules.product:
  t: 'Производная произведения принята за произведение производных'
  bad: 'Пишут $(uv)''=u''v''$.'
  why: 'Проверка: $(x\cdot x)''=(x^2)''=2x$, а $x''\cdot x''=1$. Изменение произведения складывается из двух вкладов.'
  fix: '$(uv)''=u''v+uv''$: производная первого на второй плюс первый на производную второго.'
c1.rules.quotient-order:
  t: 'Порядок разности в производной частного перепутан'
  bad: 'Пишут $\left(\frac{u}{v}\right)''=\frac{uv''-u''v}{v^2}$.'
  why: 'Знак результата получается противоположным. Проверка: $\left(\frac{1}{x}\right)''$ должна быть отрицательной, а по неверной формуле выходит положительное число.'
  fix: '$\left(\frac{u}{v}\right)''=\frac{u''v-uv''}{v^2}$: в числителе первой идёт производная числителя.'
c1.int.const:
  t: 'Потеряна константа C'
  bad: 'Записывают $\int 3x^2\,dx=x^3$ без $+C$ или игнорируют начальное условие.'
  why: 'Производная константы равна нулю, поэтому первообразных бесконечно много: $x^3$, $x^3+1$, $x^3-7$.'
  fix: 'Неопределённый интеграл — это $x^3+C$. Если задано условие вроде $F(0)=5$, найди из него $C$.'
c1.int.product:
  t: 'Интеграл произведения принят за произведение интегралов'
  bad: 'Пишут $\int x\cdot x\,dx=\int x\,dx\cdot\int x\,dx$.'
  why: 'Проверка: $\int x^2\,dx=\frac{x^3}{3}$, а $\left(\frac{x^2}{2}\right)^2=\frac{x^4}{4}$. Интеграл — не умножение функций.'
  fix: 'Для произведения такой формулы нет. Раскрой скобки или упрости произведение и интегрируй по таблице.'
c1.chain.inner:
  t: 'Забыта производная внутренней функции'
  bad: 'Пишут $((3x+1)^4)''=4(3x+1)^3$ и не умножают на $3$.'
  why: 'Внутренняя функция тоже меняется с $x$. Проверка: $(\sin 2x)''$ должна быть равна $2\cos 2x$, а не $\cos 2x$ — скорость колебаний вдвое больше.'
  fix: 'Сначала дифференцируй внешнюю функцию, не трогая скобку, потом умножь на производную скобки.'
c1.sub.dx:
  t: 'Дифференциал dx не пересчитан'
  bad: 'Делают замену $u=3x+1$ и пишут $\int\cos(3x+1)\,dx=\int\cos u\,dx=\sin u+C$.'
  why: '$dx$ тоже нужно выразить через $u$: $du=3\,dx$. Проверка: производная $\sin(3x+1)$ равна $3\cos(3x+1)$, а не $\cos(3x+1)$.'
  fix: 'Выражай $dx=\frac{du}{g''(x)}$ и подставляй. Проверяй результат дифференцированием.'
c1.parts.choice:
  t: 'Неудачный выбор u усложняет интеграл'
  bad: 'Для $\int x e^x\,dx$ берут $u=e^x$, $dv=x\,dx$ и получают интеграл с $x^2$.'
  why: 'Степень $x$ выросла, интеграл стал сложнее. Формула верна, но не упрощает задачу.'
  fix: 'Бери $u=x$: $du=dx$ проще, а $dv=e^x\,dx$ интегрируется сразу.'
c1.opt.endpoints:
  t: 'Забыты значения на концах отрезка'
  bad: 'Ищут наибольшее значение только среди корней $f''=0$.'
  why: 'Максимум на отрезке может быть на конце: у монотонной функции критических точек внутри нет, а наибольшее значение есть.'
  fix: 'Всегда считай $f(a)$, $f(b)$ и значения в критических точках внутри отрезка, затем сравнивай.'
c1.limcalc.zero-zero:
  t: 'Неопределённость $\frac00$ принята за число'
  bad: 'Считают $\frac00=0$ или $\frac00=1$ и останавливаются.'
  why: '$\frac00$ — сигнал, а не ответ. У $\frac{x^2-4}{x-2}$ при $x\to2$ предел равен $4$, у $\frac{3x}{x}$ — равен $3$, хотя форма одна.'
  fix: 'Разложи числитель и знаменатель на множители, сократи общий множитель и подставь снова.'
c1.limcalc.inf-ratio:
  t: 'Неопределённость $\frac{\infty}{\infty}$ принята за единицу'
  bad: 'При $x\to\infty$ пишут $\frac{2x^2+x}{x^2+3}=\frac{\infty}{\infty}=1$.'
  why: 'Оба выражения растут, но в разном темпе. Предел зависит от коэффициентов при старших степенях.'
  fix: 'Раздели числитель и знаменатель на старшую степень $x$. Здесь предел равен $2$.'
c1.lhop.not-indeterminate:
  t: 'Правило Лопиталя без неопределённости'
  bad: 'Для $\lim_{x\to0}\frac{x+2}{x+1}$ дифференцируют числитель и знаменатель и пишут $\frac11=1$.'
  why: 'Правило верно только для $\frac00$ (и $\frac{\infty}{\infty}$). Здесь подстановка даёт $\frac21$, предел равен $2$.'
  fix: 'Сначала подставь предельное значение. Если получилось число, ответ — оно.'
c1.mvt.cond:
  t: 'Теорема Ролля без дифференцируемости'
  bad: 'Для $|x|$ на $[-1, 1]$ говорят, что $f(-1)=f(1)$, значит где-то $f''=0$, и берут $c=0$.'
  why: 'В точке $0$ у $|x|$ нет производной: угол на графике. Условие дифференцируемости на $(a, b)$ нарушено.'
  fix: 'Проверь три условия: непрерывность на $[a, b]$, дифференцируемость на $(a, b)$ и равенство значений на концах.'
c1.mvt.midpoint:
  t: 'Точка $c$ принята за середину отрезка'
  bad: 'Для теоремы Лагранжа берут $c=\frac{a+b}{2}$.'
  why: 'Середина подходит только для квадратичной функции. Для $x^3$ на $[0, 2]$ середина $1$ даёт $f''(1)=3$, а средняя скорость равна $4$.'
  fix: 'Реши уравнение $f''(c)=\frac{f(b)-f(a)}{b-a}$ и выбери корень внутри $(a, b)$.'
c1.seq.never-reaches:
  t: 'Предел обязан не достигаться'
  bad: 'Говорят, что у постоянной последовательности $a_n=3$ нет предела, потому что она «не приближается, а уже равна».'
  why: 'Определение требует $|a_n-L|<\varepsilon$ при больших $n$, а равенство $a_n=L$ этому не мешает. Члены могут совпадать с пределом.'
  fix: 'Проверяй определение, а не картинку «приближения»: для $a_n=3$ разность равна $0$, предел $3$.'
c1.seq.bounded:
  t: 'Ограниченная последовательность считается сходящейся'
  bad: 'Для $a_n=(-1)^n$ говорят, что предел есть, так как значения лежат между $-1$ и $1$.'
  why: 'Ограниченность необходима, но недостаточна. Значения $-1$ и $1$ чередуются и не стремятся к одному числу.'
  fix: 'Сходимость: все члены с некоторого номера близки к одному числу $L$.'
c1.small.sum:
  t: 'Эквивалентность подставлена в сумму'
  bad: 'В пределе $\frac{e^x-1-x}{x^2}$ заменяют $e^x-1$ на $x$, получают $0$ в числителе и ответ $0$.'
  why: 'Главные части $x$ и $x$ сократились, а потерянный остаток порядка $x^2$ как раз определяет ответ.'
  fix: 'В суммах и разностях используй разложение с $o$: $e^x=1+x+\frac{x^2}{2}+o(x^2)$. Предел равен $\frac12$.'
c1.impl.inverse-point:
  t: 'Производная обратной взята не в той точке'
  bad: 'Для $(f^{-1})''(y_0)$ считают $\frac{1}{f''(y_0)}$.'
  why: 'Обратная функция в точке $y_0$ соответствует точке $x_0=f^{-1}(y_0)$. Наклон исходной функции нужен именно там.'
  fix: 'Найди $x_0$ из $f(x_0)=y_0$, затем возьми $\frac{1}{f''(x_0)}$.'
c1.impl.implicit-sign:
  t: 'Потерян знак при выражении $y''$'
  bad: 'Из $2x+3y^2y''=0$ пишут $y''=\frac{2x}{3y^2}$.'
  why: 'Слагаемое $2x$ переносится в другую часть уравнения со сменой знака.'
  fix: '$3y^2y''=-2x$, значит $y''=-\frac{2x}{3y^2}$.'
c1.impl.param-inverted:
  t: 'Перепутана дробь в параметрической производной'
  bad: 'Пишут $\frac{dy}{dx}=\frac{x''(t)}{y''(t)}$.'
  why: 'Проверка размерности: наклон — это изменение $y$ на единицу изменения $x$, то есть $y''$ в числителе.'
  fix: '$\frac{dy}{dx}=\frac{y''(t)}{x''(t)}$.'
c1.study.f0-extremum:
  t: 'Равенство $f''=0$ принято за экстремум'
  bad: 'Для $x^3$ говорят, что в нуле экстремум, ведь $f''(0)=0$.'
  why: 'Экстремум требует смены знака производной. У $f''(x)=3x^2$ знак по обе стороны от нуля плюс: функция возрастает всюду.'
  fix: 'Найди точки $f''=0$ и проверь знак $f''$ слева и справа.'
c1.study.concavity-sign:
  t: 'Перепутан знак второй производной'
  bad: 'Считают, что при $f''''<0$ график лежит над касательными.'
  why: 'Если $f''''<0$, наклон касательной убывает, график изгибается вниз и лежит под касательными. Проверка: у $-x^2$ вторая производная $-2$.'
  fix: '$f''''>0$ — график над касательными, $f''''<0$ — под касательными.'
c1.ftc.area-signed:
  t: 'Интеграл принят за площадь'
  bad: 'Считают, что $\int_0^{2a}(x-a)\,dx$ равен площади фигуры, и не получают нуль.'
  why: 'Интеграл считает площадь над осью положительной, а под осью — отрицательной. Две равные части компенсируют друг друга.'
  fix: 'Интеграл — площадь со знаком. Для настоящей площади считай части над и под осью отдельно.'
c1.ftc.order:
  t: 'Перепутан порядок в формуле Ньютона–Лейбница'
  bad: 'Считают $\int_a^b f\,dx=F(a)-F(b)$.'
  why: 'Знак результата противоположен. Проверка: для положительной $f$ интеграл положителен, а $F$ возрастает.'
  fix: 'Сначала значение в верхнем пределе: $F(b)-F(a)$.'
c1.impr.decay:
  t: 'Стремление подынтегральной функции к нулю принято за сходимость'
  bad: 'Считают, что $\int_1^\infty\frac{dx}{x}$ сходится, ведь $\frac1x\to0$.'
  why: 'Интеграл $\int_1^b\frac{dx}{x}=\ln b$ растёт без ограничения при $b\to\infty$, хоть и медленно.'
  fix: 'Вычисляй предел интеграла от $1$ до $b$. Для $x^{-p}$ сходимость только при $p>1$.'
c1.impr.discontinuity:
  t: 'Формула Ньютона–Лейбница через разрыв'
  bad: 'Для $\int_{-1}^{1}\frac{dx}{x^2}$ берут $F(x)=-\frac1x$ и получают $-2$.'
  why: 'Подынтегральная функция неограниченна в нуле, а интеграл от положительной функции не может быть отрицательным.'
  fix: 'Раздели интеграл в точке разрыва и найди пределы. Здесь каждая часть расходится.'
c1.taylor.factorial:
  t: 'Забыт факториал в коэффициенте Тейлора'
  bad: 'Берут коэффициент при $x^2$ у $e^{2x}$ равным $f''''(0)=4$, не деля на $2!$.'
  why: 'Коэффициент при $x^k$ равен $\frac{f^{(k)}(0)}{k!}$. Иначе $k$-я производная многочлена не совпадёт с $f^{(k)}(0)$.'
  fix: 'Делить производную в точке на $k!$: $\frac{4}{2!}=2$.'
c1.taylor.local:
  t: 'Многочлен Тейлора принят за точное равенство везде'
  bad: 'Считают, что $1+x+\frac{x^2}{2}$ равен $e^x$ при любом $x$, например при $x=10$.'
  why: 'Многочлен совпадает с функцией только в точке разложения, а рядом ошибка мала. При $x=10$ значение $e^{10}\approx22026$ против $61$.'
  fix: 'Используй многочлен рядом с точкой разложения и оценивай погрешность.'
c1.rat.coef:
  t: 'Неверный коэффициент в разложении на простейшие'
  bad: 'Для $\frac{1}{(x-1)(x-3)}$ берут $A=\frac12$ при $\frac{1}{x-1}$.'
  why: 'При $x=1$ равенство $1=A(x-3)+B(x-1)$ даёт $1=-2A$, значит $A=-\frac12$. Знак легко потерять.'
  fix: 'Подставь корень в $1=A(x-b)+B(x-a)$ и реши линейное уравнение.'
c1.rat.lin:
  t: 'Интеграл $\frac{1}{x-a}$ найден как степень'
  bad: 'Пишут $\int\frac{dx}{x-3}=-\frac{1}{(x-3)^2}$ или $\frac{1}{x-3}$.'
  why: 'Производная $\frac{1}{x-3}$ равна $-\frac{1}{(x-3)^2}$, а не $\frac{1}{x-3}$. Подходит только логарифм.'
  fix: '$\int\frac{dx}{x-a}=\ln|x-a|+C$.'
c1.app.sign:
  t: 'Из нижней функции вычтена верхняя'
  bad: 'Площадь между $y=4$ и $y=x^2$ считают как $\int(x^2-4)\,dx$ и получают отрицательное число.'
  why: 'Площадь не бывает отрицательной. Из верхнего графика нужно вычитать нижний.'
  fix: 'Определи, какая кривая выше на отрезке: $S=\int(\text{верхняя}-\text{нижняя})\,dx$.'
c1.app.pi:
  t: 'Забыт множитель $\pi$ в объёме вращения'
  bad: 'Считают объём тела вращения как $\int f^2\,dx$.'
  why: 'Под интегралом площадь круга-сечения $\pi f(x)^2$, а не квадрат радиуса.'
  fix: '$V=\pi\int_a^b f(x)^2\,dx$.'
c1.app.mean:
  t: 'Среднее значение принято за интеграл'
  bad: 'Среднее значение $x^2$ на $[0, 3]$ считают как $\int_0^3x^2\,dx=9$.'
  why: 'Интеграл — это площадь, а среднее значение — высота. Площадь нужно разделить на длину отрезка.'
  fix: '$\bar f=\frac{1}{b-a}\int_a^b f\,dx$.'
lg.prop.or-exclusive:
  t: '«Или» понято как «ровно одно из двух»'
  bad: 'Считают $A\vee B$ ложным, когда истинны оба.'
  why: 'В логике дизъюнкция включающая: она истинна, если истинна хотя бы одна часть, в том числе обе.'
  fix: '$A\vee B$ ложно только при $A=0$ и $B=0$. Из четырёх наборов истинны три.'
lg.prop.rows:
  t: 'Число строк таблицы посчитано неверно'
  bad: 'Для $n$ переменных берут $2n$ или $n^2$ строк.'
  why: 'Каждая переменная независимо принимает два значения, поэтому числа наборов перемножаются.'
  fix: 'Число строк равно $2^n$.'
lg.impl.converse:
  t: 'Обратное утверждение принято за исходное'
  bad: 'Из «если $x>2$, то $x^2>4$» делают вывод «если $x^2>4$, то $x>2$».'
  why: 'Контрпример: $x=-3$. Верно исходное, а обратное ложно.'
  fix: 'Равносильна исходному только контрапозиция $\neg B\to\neg A$.'
lg.impl.false-premise:
  t: 'Импликация с ложной посылкой названа ложной'
  bad: 'Считают «если $2+2=5$, то $3=3$» ложным, потому что посылка ложна.'
  why: 'Импликация нарушена только когда посылка истинна, а вывод ложен. Иначе обещание не проверяется.'
  fix: 'При $A=0$ импликация $A\to B$ истинна при любом $B$.'
lg.equiv.demorgan-keep:
  t: 'Связка при отрицании не изменена'
  bad: 'Пишут $\neg(A\wedge B)\equiv\neg A\wedge\neg B$.'
  why: 'При $A=1$, $B=0$ левая часть истинна, правая ложна. Нужна другая связка.'
  fix: 'По де Моргану $\neg(A\wedge B)\equiv\neg A\vee\neg B$ и $\neg(A\vee B)\equiv\neg A\wedge\neg B$.'
lg.equiv.neg-impl:
  t: 'Отрицание импликации записано как импликация'
  bad: 'Пишут $\neg(A\to B)\equiv\neg A\to\neg B$.'
  why: 'Импликация ложна лишь при $A=1$, $B=0$, а $\neg A\to\neg B$ ложна при $A=0$, $B=1$.'
  fix: '$\neg(A\to B)\equiv A\wedge\neg B$.'
lg.quant.order:
  t: 'Перепутан порядок кванторов'
  bad: 'Считают $\forall x\,\exists y\,(y>x)$ и $\exists y\,\forall x\,(y>x)$ одним и тем же.'
  why: 'В первом $y$ можно подбирать под каждое $x$ (возьми $x+1$). Во втором нужен один $y$, больший всех $x$, а такого нет.'
  fix: 'Читай кванторы слева направо: что стоит раньше, то выбрано раньше.'
lg.quant.neg:
  t: 'При отрицании не изменён квантор'
  bad: 'Отрицанием «каждый студент сдал» считают «каждый студент не сдал».'
  why: 'Достаточно одного студента, не сдавшего экзамен, чтобы исходное утверждение стало ложным.'
  fix: '$\neg\forall x\,P(x)\equiv\exists x\,\neg P(x)$: найдётся $x$, для которого $P$ ложно.'
lg.proof.base:
  t: 'Пропущена база индукции'
  bad: 'Доказывают только шаг «из $P(k)$ следует $P(k+1)$» и объявляют утверждение доказанным.'
  why: 'Шаг не говорит, что хоть одно $P$ истинно. Утверждение «$n=n+1$» проходит шаг, но ложно всегда.'
  fix: 'Проверь базу $P(n_0)$ и только потом шаг.'
lg.proof.example:
  t: 'Примеры приняты за доказательство'
  bad: 'Проверяют утверждение для $n=1,2,3,4,5$ и считают его доказанным для всех $n$.'
  why: 'Конечное число примеров не покрывает бесконечно много случаев. Утверждение $n^2+n+41$ простое проверяется до $n=39$, но при $n=40$ ломается.'
  fix: 'Доказывай общий случай: индукцией или прямым рассуждением. Для опровержения достаточно одного контрпримера.'
la.vec.scalar-one:
  t: 'Число умножено только на одну координату'
  bad: 'Для $2\mathbf{u}$ при $\mathbf{u}=(1, 3)$ пишут $(2, 3)$.'
  why: 'Умножение вектора на число растягивает весь вектор, поэтому множитель применяется к каждой координате.'
  fix: '$k(u_1, u_2)=(ku_1, ku_2)$: здесь $(2, 6)$.'
la.vec.span-all:
  t: 'Линейные комбинации двух векторов всегда заполняют плоскость'
  bad: 'Считают, что комбинации $\mathbf{u}=(1, 2)$ и $\mathbf{v}=(3, 6)$ покрывают всю плоскость.'
  why: 'Векторы коллинеарны: $\mathbf{v}=3\mathbf{u}$. Любая комбинация $a\mathbf{u}+b\mathbf{v}=(a+3b)\mathbf{u}$ лежит на одной прямой.'
  fix: 'Плоскость заполняют только неколлинеарные векторы.'
la.dot.no-norm:
  t: 'Косинус угла без деления на длины'
  bad: 'Считают $\cos\theta=\mathbf{u}\cdot\mathbf{v}$.'
  why: 'Скалярное произведение зависит от длин: у $2\mathbf{u}$ оно вдвое больше, а угол тот же. Косинус не бывает больше $1$.'
  fix: '$\cos\theta=\frac{\mathbf{u}\cdot\mathbf{v}}{|\mathbf{u}||\mathbf{v}|}$.'
la.dot.proj-dir:
  t: 'Коэффициент проекции взят с длиной вместо квадрата'
  bad: 'Проекцию $\mathbf{u}$ на $\mathbf{v}$ записывают как $\frac{\mathbf{u}\cdot\mathbf{v}}{|\mathbf{v}|}\mathbf{v}$.'
  why: 'Дробь $\frac{\mathbf{u}\cdot\mathbf{v}}{|\mathbf{v}|}$ — длина проекции. Чтобы получить вектор, нужен единичный вектор, то есть деление ещё на $|\mathbf{v}|$.'
  fix: '$\operatorname{proj}_{\mathbf{v}}\mathbf{u}=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{v}\cdot\mathbf{v}}\mathbf{v}$.'
la.sys.contradiction:
  t: 'Уравнение $0=c$ принято за признак бесконечно многих решений'
  bad: 'После исключения получилось $0=3$, и делают вывод, что решений бесконечно много.'
  why: 'Равенство $0=3$ неверно ни при каких значениях неизвестных. Система несовместна.'
  fix: 'Строка $0=c$ при $c\ne0$ означает отсутствие решений.'
la.sys.zero-row:
  t: 'Уравнение $0=0$ принято за противоречие'
  bad: 'Получив $0=0$, делают вывод, что решений нет.'
  why: 'Уравнение $0=0$ верно всегда: оно просто лишнее. Остаётся меньше уравнений, чем неизвестных.'
  fix: 'Нулевая строка не мешает решениям. Если других противоречий нет, решений бесконечно много.'
la.mat.commute:
  t: 'Произведение матриц считают коммутативным'
  bad: 'Пишут $AB=BA$, как $xy=yx$ для чисел.'
  why: 'Для $A=\begin{pmatrix}1&2\\0&1\end{pmatrix}$ и $B=\begin{pmatrix}1&0\\3&1\end{pmatrix}$ первая строка $AB$ равна $(7, 2)$, а $BA$ — $(1, 2)$.'
  fix: 'Порядок важен: сначала строки левой матрицы на столбцы правой. Равенство $AB=BA$ бывает лишь в особых случаях.'
la.mat.zero-div:
  t: 'Из $AB=0$ сделан вывод $A=0$ или $B=0$'
  bad: 'Считают, что у ненулевых матриц произведение не может быть нулевым.'
  why: 'Для $A=\begin{pmatrix}1&0\\0&0\end{pmatrix}$ и $B=\begin{pmatrix}0&0\\0&1\end{pmatrix}$ оба множителя ненулевые, а $AB=0$.'
  fix: 'Для матриц правило «произведение равно нулю, значит один из множителей нуль» не работает.'
la.map.columns:
  t: 'Образы базисных векторов записаны строками матрицы'
  bad: 'Из $f(\mathbf{e}_1)=(2, 1)$ и $f(\mathbf{e}_2)=(-1, 3)$ получают $A=\begin{pmatrix}2&1\\-1&3\end{pmatrix}$.'
  why: 'Столбец матрицы $A\mathbf{e}_1$ — это первый столбец $A$. Он равен $f(\mathbf{e}_1)$.'
  fix: 'Образы базисных векторов — столбцы: $A=\begin{pmatrix}2&-1\\1&3\end{pmatrix}$.'
la.map.shift:
  t: 'Сдвиг принят за линейное отображение'
  bad: 'Считают отображение $(x, y)\mapsto(x+1, y)$ линейным.'
  why: 'Линейное отображение переводит нуль в нуль, а здесь $(0, 0)\mapsto(1, 0)$.'
  fix: 'Проверь $f(\mathbf{0})=\mathbf{0}$ и сохранение сумм и множителей.'
la.inv.order:
  t: 'Обратная к произведению взята без смены порядка'
  bad: 'Пишут $(AB)^{-1}=A^{-1}B^{-1}$.'
  why: 'Произведение $AB$ сначала применяет $B$, затем $A$. Чтобы отменить, сначала отменяют $A$, потом $B$.'
  fix: '$(AB)^{-1}=B^{-1}A^{-1}$, как «сначала надеть носок, потом ботинок» отменяется в обратном порядке.'
la.inv.formula:
  t: 'Перепутаны места и знаки в формуле обратной матрицы'
  bad: 'Для $\begin{pmatrix}a&b\\c&d\end{pmatrix}$ берут $\frac{1}{\det}\begin{pmatrix}a&b\\c&d\end{pmatrix}$ или меняют знаки диагонали.'
  why: 'Проверка: $A\cdot A^{-1}$ должно дать единичную матрицу. Для неверной формулы этого не получается.'
  fix: 'Диагональные элементы меняются местами, недиагональные меняют знак: $\frac{1}{\det A}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}$.'
la.det.sum:
  t: 'Определитель суммы принят за сумму определителей'
  bad: 'Пишут $\det(A+B)=\det A+\det B$.'
  why: 'Для $A=B=I$ имеем $\det(A+B)=\det(2I)=4$, а $\det A+\det B=2$.'
  fix: 'Определитель не аддитивен. Верно умножение: $\det(AB)=\det A\det B$.'
la.det.scalar:
  t: 'При умножении матрицы на число определитель умножен один раз'
  bad: 'Считают $\det(kA)=k\det A$.'
  why: 'Число $k$ умножает каждую из $n$ строк, а определитель растёт в $k$ раз от каждой строки.'
  fix: '$\det(kA)=k^n\det A$: для матрицы $2\times2$ это $k^2\det A$.'
la.space.zero:
  t: 'Проверка нулевого вектора пропущена'
  bad: 'Считают прямую $x+y=1$ подпространством плоскости.'
  why: 'Нулевой вектор $(0, 0)$ не удовлетворяет уравнению $x+y=1$. Умножив любой вектор на $0$, из множества выходят.'
  fix: 'Подпространство обязано содержать $\mathbf{0}$. Прямая должна проходить через начало координат.'
la.space.union:
  t: 'Объединение подпространств принято за подпространство'
  bad: 'Считают, что оси $Ox$ и $Oy$ вместе образуют подпространство.'
  why: 'Векторы $(1, 0)$ и $(0, 1)$ лежат в объединении, а их сумма $(1, 1)$ — нет.'
  fix: 'Подпространство должно быть замкнуто относительно сложения. Для объединения это в общем случае не так.'
la.basis.pairwise:
  t: 'Попарная некратность принята за линейную независимость'
  bad: 'Для $(1, 0, 1)$, $(0, 1, 1)$, $(1, 1, 2)$ говорят, что они независимы, ведь никакие два не кратны.'
  why: 'Третий вектор равен сумме первых двух. Нетривиальная комбинация $\mathbf{u}+\mathbf{v}-\mathbf{w}=\mathbf{0}$ показывает зависимость.'
  fix: 'Ищи нетривиальную комбинацию, равную нулю, а не кратные пары.'
la.basis.size:
  t: 'Число векторов базиса не равно размерности'
  bad: 'Считают, что три вектора могут быть базисом плоскости.'
  why: 'В $\mathbb{R}^2$ любые три вектора зависимы: базис всегда состоит ровно из двух векторов.'
  fix: 'Число векторов базиса равно размерности пространства.'
la.rank.rows:
  t: 'Ранг принят за число строк'
  bad: 'Для матрицы с пропорциональными строками считают ранг равным числу строк.'
  why: 'Пропорциональная строка не добавляет независимого направления. Ранг — число независимых строк.'
  fix: 'Исключи строки методом Гаусса и посчитай ненулевые.'
la.rank.nullity:
  t: 'Размерность ядра перепутана с рангом'
  bad: 'Для матрицы $m\times n$ ранга $r$ берут $\dim\ker A=r$ или $m-r$.'
  why: 'Ядро лежит в пространстве столбцов-векторов длины $n$: из $n$ направлений $r$ идут в образ, остальные обнуляются.'
  fix: 'По теореме о ранге $\dim\ker A=n-r$, где $n$ — число столбцов.'
la.cob.direction:
  t: 'Перепутано направление матрицы перехода'
  bad: 'Новые координаты находят как $\mathbf{x}''=P\mathbf{x}$.'
  why: 'Матрица $P$ из столбцов нового базиса собирает вектор из новых координат: $\mathbf{x}=P\mathbf{x}''$. Обратное действие даёт $P^{-1}$.'
  fix: '$\mathbf{x}=P\mathbf{x}''$ и $\mathbf{x}''=P^{-1}\mathbf{x}$.'
la.cob.rows:
  t: 'Базисные векторы записаны строками матрицы перехода'
  bad: 'Из $\mathbf{b}_1=(1, 1)$, $\mathbf{b}_2=(1, -1)$ строят $P$, ставя векторы в строки.'
  why: 'Столбец $P\mathbf{e}_1$ — это образ $\mathbf{e}_1$, то есть координаты $\mathbf{b}_1$. Строки дают транспонированную матрицу.'
  fix: 'Базисные векторы — столбцы $P$.'
la.diag.pow:
  t: 'Степень собственного значения заменена умножением'
  bad: 'Для $A^n$ берут собственное значение $n\lambda$.'
  why: 'Из $A\mathbf{v}=\lambda\mathbf{v}$ получается $A^2\mathbf{v}=\lambda^2\mathbf{v}$, и далее $A^n\mathbf{v}=\lambda^n\mathbf{v}$.'
  fix: 'Собственные значения $A^n$ равны $\lambda^n$.'
la.diag.defective:
  t: 'Любая матрица считается диагонализуемой'
  bad: 'Считают, что у $\begin{pmatrix}2&1\\0&2\end{pmatrix}$ два независимых собственных вектора, ведь корень двойной.'
  why: 'Система $(A-2I)\mathbf{v}=\mathbf{0}$ даёт одно направление: $(1, 0)$. Не хватает вектора для базиса.'
  fix: 'Считай размерность пространства собственных векторов: для диагонализации нужно $n$ независимых.'
la.orth.unit:
  t: 'Забыта нормировка ортогональных векторов'
  bad: 'Векторы $(3, 4)$ и $(-4, 3)$ ортогональны, значит, образуют ортонормированный базис.'
  why: 'Длины равны $5$, а не $1$. Ортогональность ничего не говорит о длине.'
  fix: 'Раздели каждый вектор на его длину: $\left(\frac35, \frac45\right)$.'
la.orth.gs-coef:
  t: 'Коэффициент Грама–Шмидта без деления на $\mathbf{u}\cdot\mathbf{u}$'
  bad: 'Берут $\mathbf{w}=\mathbf{v}-(\mathbf{u}\cdot\mathbf{v})\mathbf{u}$.'
  why: 'Коэффициент проекции равен $\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{u}\cdot\mathbf{u}}$. Без деления остаток не перпендикулярен $\mathbf{u}$, если $\mathbf{u}$ не единичный.'
  fix: '$t=\frac{\mathbf{u}\cdot\mathbf{v}}{\mathbf{u}\cdot\mathbf{u}}$, затем $\mathbf{w}=\mathbf{v}-t\mathbf{u}$. Проверь $\mathbf{u}\cdot\mathbf{w}=0$.'
la.proj.res:
  t: 'Остаток перепутан с проекцией'
  bad: 'Вместо $\mathbf{b}-P\mathbf{b}$ называют остатком саму проекцию $P\mathbf{b}$.'
  why: 'Проекция лежит на прямой, остаток перпендикулярен ей. Вместе они дают $\mathbf{b}$.'
  fix: 'Остаток $=\mathbf{b}-P\mathbf{b}$.'
la.proj.ls-mean:
  t: 'Наклон МНК принят за среднее отношений $y/x$'
  bad: 'Для прямой $y=ax$ берут $a=\frac1n\sum\frac{y_i}{x_i}$.'
  why: 'Это не минимизирует сумму квадратов: точки с большим $|x|$ должны влиять сильнее.'
  fix: '$a=\frac{\sum x_iy_i}{\sum x_i^2}$.'
la.sym.nonorth:
  t: 'Ортогональность собственных векторов считается необязательной для симметричных матриц'
  bad: 'Для $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ берут собственные векторы $(1, 0)$ и $(1, 1)$.'
  why: 'Вектор $(1, 0)$ не собственный: $A(1, 0)=(2, 1)$. Собственные векторы здесь $(1, 1)$ и $(1, -1)$, и они ортогональны.'
  fix: 'У симметричной матрицы собственные векторы разных значений ортогональны.'
la.sym.complex:
  t: 'У симметричной матрицы ищут комплексные значения'
  bad: 'Считают, что у вещественной симметричной матрицы $2\times2$ могут быть комплексные собственные значения, как у поворота.'
  why: 'Дискриминант $(a-d)^2+4b^2$ неотрицателен, поэтому корни вещественны.'
  fix: 'По спектральной теореме собственные значения симметричной матрицы вещественны.'
dm.count.add-for-mul:
  t: 'Сложение вместо умножения при последовательных выборах'
  bad: 'Из $3$ супов и $4$ вторых блюд обедов считают $3+4=7$.'
  why: 'К каждому из трёх супов можно взять любое из четырёх вторых, получаются $3\cdot4=12$ обедов. Сложение пропускает пары.'
  fix: 'Выбор «и затем»: правило произведения.'
dm.count.mul-for-add:
  t: 'Умножение вместо сложения при выборе «или»'
  bad: 'Выбрать одну книгу из $5$ по математике или из $4$ по физике, и считают $5\cdot4=20$.'
  why: 'Выбирают одну книгу, а не пару. Каждая книга — отдельный вариант: $5+4=9$.'
  fix: 'Выбор «или» из непересекающихся групп: правило суммы.'
dm.perm.order:
  t: 'Сочетания и размещения перепутаны'
  bad: 'Рукопожатия между $n$ людьми считают как $n(n-1)$.'
  why: 'Так каждое рукопожатие посчитано дважды (от каждого участника). Порядок пары не важен.'
  fix: 'Если порядок не важен, делят на $k!$: $C_n^k=\frac{A_n^k}{k!}$.'
dm.perm.repeat:
  t: 'Одинаковые элементы посчитаны как разные'
  bad: 'Перестановки $5$ шаров, из которых $2$ одинаковых, считают как $5!$.'
  why: 'Обмен местами двух одинаковых шаров не меняет расстановку, поэтому каждая расстановка сосчитана $2!$ раз.'
  fix: 'Раздели на $k!$ для каждой группы одинаковых: $\frac{5!}{2!}$.'
dm.binom.freshman:
  t: 'Степень суммы разложена как сумма степеней'
  bad: 'Пишут $(x+y)^2=x^2+y^2$ или $(1+x)^n=1+x^n$.'
  why: 'При $x=y=1$ левая часть равна $4$, правая $2$. Пропущены смешанные члены.'
  fix: '$(x+y)^n=\sum C_n^kx^{n-k}y^k$, сумма коэффициентов $(1+x)^n$ равна $2^n$.'
dm.binom.index:
  t: 'Сдвиг номера в коэффициенте бинома'
  bad: 'Коэффициент при $x^k$ в $(1+x)^n$ берут как $C_n^{k+1}$ или $C_{n+1}^k$.'
  why: 'Член с $x^k$ получается выбором $k$ множителей, из которых берётся $x$: $C_n^k$ способов.'
  fix: 'Коэффициент при $x^k$ равен $C_n^k$. Проверь на малом примере: $(1+x)^2$.'
dm.stars.arr:
  t: 'Выборка без порядка посчитана как размещение с повторениями'
  bad: 'Из $3$ сортов пончиков выбирают $2$ и считают $3^2=9$.'
  why: 'Выбор «ванильный, потом шоколадный» и «шоколадный, потом ванильный» — одна и та же коробка. $3^2$ считает порядок.'
  fix: 'Без порядка: $C_{n+k-1}^{k}=C_4^2=6$.'
dm.stars.formula:
  t: 'Неверные параметры в формуле сочетаний с повторениями'
  bad: 'Берут $C_{n+k}^{k}$ вместо $C_{n+k-1}^{k}$.'
  why: 'Перегородок на одну меньше, чем видов: для $n$ видов нужно $n-1$ перегородка.'
  fix: 'Число позиций равно $k+(n-1)$, выбирают $k$ мест под шары.'
dm.incl.double:
  t: 'Пересечение посчитано дважды'
  bad: 'Число элементов в $A\cup B$ считают как $|A|+|B|$.'
  why: 'Элементы пересечения входят и в $|A|$, и в $|B|$, поэтому сосчитаны два раза.'
  fix: '$|A\cup B|=|A|+|B|-|A\cap B|$.'
dm.incl.triple:
  t: 'Забыта поправка на тройное пересечение'
  bad: 'Для трёх множеств берут $|A|+|B|+|C|-|A\cap B|-|A\cap C|-|B\cap C|$ без последнего слагаемого.'
  why: 'Элемент из всех трёх множеств сосчитан $3$ раза и вычтен $3$ раза: в итоге нуль раз. Его нужно вернуть.'
  fix: 'Добавь $+|A\cap B\cap C|$.'
dm.rec.init:
  t: 'Начальные значения не нужны'
  bad: 'Считают, что формулы $a_n=2a_{n-1}$ достаточно, чтобы найти $a_5$.'
  why: 'Подходит и $a_n=2^n$, и $a_n=3\cdot2^n$: формула определяет последовательность лишь с точностью до начального значения.'
  fix: 'Всегда задавай $a_1$ (и $a_2$, если в формуле два предыдущих члена).'
dm.rec.index:
  t: 'Сдвиг индекса при вычислении члена'
  bad: 'Для $a_n=a_{n-1}+a_{n-2}$, $a_1=a_2=1$ называют $a_6=5$, то есть на один шаг раньше.'
  why: 'От $a_2$ до $a_6$ нужно четыре шага: $a_3=2$, $a_4=3$, $a_5=5$, $a_6=8$. Остановка на $a_5$ даёт другой член.'
  fix: 'Выпиши все члены по порядку и сверь номер искомого члена.'
pr.space.union-sum:
  t: 'Вероятности пересекающихся событий сложены без поправки'
  bad: 'Для $P(A)=0.5$, $P(B)=0.4$, $P(A\cap B)=0.2$ считают $P(A\cup B)=0.9$.'
  why: 'Исходы пересечения посчитаны дважды: и в $P(A)$, и в $P(B)$.'
  fix: '$P(A\cup B)=P(A)+P(B)-P(A\cap B)=0.7$.'
pr.space.complement:
  t: 'Неверная вероятность дополнения'
  bad: 'Для $P(A)=0.2$ берут $P(\bar A)=\frac{1}{0.2}$ или $0.2-1$.'
  why: 'Вероятность не бывает больше $1$ или отрицательной. Событие и его дополнение вместе дают достоверное событие.'
  fix: '$P(\bar A)=1-P(A)=0.8$.'
pr.classic.unequal:
  t: 'Неравновероятные исходы приняты за равновероятные'
  bad: 'Сумма на двух кубиках принимает $11$ значений, значит $P(\text{сумма}=7)=\frac{1}{11}$.'
  why: 'Сумма $7$ получается шестью парами из $36$, а сумма $12$ — одной. Равновероятны пары (первый, второй), а не суммы.'
  fix: 'Выбери равновероятные элементарные исходы и посчитай благоприятные среди них.'
pr.classic.order:
  t: 'Благоприятные и все исходы посчитаны по-разному'
  bad: 'Вероятность двух красных из урны считают как $\frac{A_k^2}{C_n^2}$: порядок учтён только в числителе.'
  why: 'Числитель вдвое больше, чем нужно: пары посчитаны с порядком, а общее число исходов — без.'
  fix: 'Считай оба числа одним способом: $\frac{C_k^2}{C_n^2}$ или $\frac{A_k^2}{A_n^2}$.'
pr.cond.reverse:
  t: '$P(A\mid B)$ принята за $P(B\mid A)$'
  bad: 'Делят $P(A\cap B)$ на $P(A)$, а не на $P(B)$.'
  why: 'Условие $B$ сужает пространство исходов до $B$, поэтому в знаменателе вероятность условия.'
  fix: '$P(A\mid B)=\frac{P(A\cap B)}{P(B)}$. Обычно $P(A\mid B)\ne P(B\mid A)$.'
pr.cond.shrink:
  t: 'Состав после первого выбора не пересчитан'
  bad: 'Из урны с $r$ красными и $w$ белыми шарами вытащили красный. Вероятность второго красного считают как $\frac{r}{r+w}$.'
  why: 'После изъятия красных осталось $r-1$, а всего шаров $r+w-1$.'
  fix: 'Условная вероятность: $\frac{r-1}{r+w-1}$.'
pr.indep.incompat:
  t: 'Несовместные события приняты за независимые'
  bad: 'Говорят, что события «выпал орёл» и «выпала решка» независимы, потому что одно не влияет на другое.'
  why: 'Если произошёл орёл, решка невозможна: знание одного события полностью определяет другое. $P(A\cap B)=0\ne P(A)P(B)$.'
  fix: 'Независимость проверяют равенством $P(A\cap B)=P(A)P(B)$.'
pr.indep.add:
  t: 'Вероятность «и» для независимых событий вычислена сложением'
  bad: 'Считают $P(A\cap B)=P(A)+P(B)$ или $P(\text{хотя бы один орёл за }n\text{ бросков})=\frac{n}{2}$.'
  why: 'Вероятность не может превышать $1$. Для «и» вероятности независимых событий умножаются, а «хотя бы один» удобно через дополнение.'
  fix: '$P(A\cap B)=P(A)P(B)$; «хотя бы один» $=1-(\text{ни одного})$.'
pr.bayes.base:
  t: 'Базовая частота гипотезы проигнорирована'
  bad: 'Тест выявляет $90\%$ больных, результат положительный, значит болезнь есть с вероятностью $90\%$.'
  why: 'Если болеют $1\%$, то среди положительных результатов больных мало: ложноположительные здоровых перевешивают.'
  fix: 'Используй формулу Байеса: $\frac{P(H)P(B\mid H)}{P(B)}$, где $P(B)$ учитывает обе гипотезы.'
pr.bayes.total:
  t: 'Условные вероятности сложены без весов'
  bad: 'Для двух урн берут $P(B)=P(B\mid H_1)+P(B\mid H_2)$ или среднее без учёта вероятностей урн.'
  why: 'Вероятность каждой гипотезы разная. Её вклад пропорционален $P(H_i)$.'
  fix: '$P(B)=P(H_1)P(B\mid H_1)+P(H_2)P(B\mid H_2)$.'
pr.rv.sum:
  t: 'Сумма вероятностей значений не равна единице'
  bad: 'Таблица с вероятностями $0.2$; $0.5$; $0.5$ принимается за распределение.'
  why: 'Одно из значений обязательно принимается, поэтому вероятности всех значений в сумме дают $1$.'
  fix: 'Проверь, что все $p_i\ge0$ и $\sum p_i=1$.'
pr.rv.cdf:
  t: '$P(X\le k)$ принята за $P(X=k)$'
  bad: 'Для $P(X\le2)$ берут одну вероятность $P(X=2)$.'
  why: 'Неравенство включает все значения не больше $2$, то есть $1$ и $2$.'
  fix: '$P(X\le2)=P(X=1)+P(X=2)$.'
pr.exp.nonlin:
  t: 'Ожидание функции принято за функцию от ожидания'
  bad: 'Считают $E[X^2]=(E[X])^2$.'
  why: 'Для $X=0$ или $2$ с вероятностями $0.5$ имеем $E[X]=1$, $E[X^2]=2$, а $(E[X])^2=1$.'
  fix: 'Считай $E[g(X)]=\sum g(x_i)p_i$. Линейность работает только для $aX+b$.'
pr.exp.avg:
  t: 'Среднее значений без вероятностей'
  bad: 'Для значений $1, 2, 3$ берут $E[X]=2$ при любых вероятностях.'
  why: 'Значение с большей вероятностью встречается чаще и должно влиять сильнее.'
  fix: '$E[X]=\sum x_ip_i$ — среднее с весами.'
pr.var.scale:
  t: 'Дисперсия умножена на $a$ вместо $a^2$'
  bad: 'Считают $\operatorname{Var}(aX)=a\operatorname{Var}(X)$.'
  why: 'Дисперсия — средний квадрат отклонения. Растяжение в $a$ раз увеличивает отклонения в $a$ раз, а квадраты — в $a^2$.'
  fix: '$\operatorname{Var}(aX)=a^2\operatorname{Var}(X)$.'
pr.var.diff:
  t: 'Дисперсии вычтены при вычитании величин'
  bad: 'Считают $\operatorname{Var}(X-Y)=\operatorname{Var}(X)-\operatorname{Var}(Y)$.'
  why: 'Разность независимых величин разбросана не меньше: $\operatorname{Var}(-Y)=\operatorname{Var}(Y)$, дисперсия не бывает отрицательной.'
  fix: 'Для независимых: $\operatorname{Var}(X-Y)=\operatorname{Var}(X)+\operatorname{Var}(Y)$.'
pr.discr.coef:
  t: 'Забыт биномиальный коэффициент'
  bad: 'Для $P(X=2)$ при $n=3$, $p=0.5$ считают $p^2(1-p)=0.125$.'
  why: 'Два успеха можно получить тремя способами по расположению: УУН, УНУ, НУУ.'
  fix: '$P(X=k)=C_n^kp^k(1-p)^{n-k}$, здесь $3\cdot0.125=0.375$.'
pr.discr.geom:
  t: 'Перепутаны успехи и неудачи в геометрическом распределении'
  bad: 'Для первого успеха на $k$-й попытке берут $p^{k-1}(1-p)$.'
  why: 'Первые $k-1$ попыток должны быть неудачными (вероятность $1-p$ каждая), а на $k$-й — успех.'
  fix: '$P(X=k)=(1-p)^{k-1}p$.'
pr.cont.density-prob:
  t: 'Плотность принята за вероятность'
  bad: 'Считают $P(X<0.5)=f(0.5)$ или что плотность не бывает больше $1$.'
  why: 'Плотность — вероятность на единицу длины. Вероятность — площадь, интеграл по интервалу. Плотность $2$ на отрезке длины $0.5$ допустима.'
  fix: '$P(a<X<b)=\int_a^bf(x)\,dx$.'
pr.cont.point:
  t: 'Одному значению приписана положительная вероятность'
  bad: 'Считают $P(X=0.5)=f(0.5)>0$.'
  why: 'Площадь под графиком над одной точкой равна нулю. Вероятности есть только у интервалов.'
  fix: 'Для непрерывной величины $P(X=x)=0$.'
pr.cdistr.rate:
  t: 'Среднее показательного распределения принято за $\lambda$'
  bad: 'Для интенсивности $\lambda=2$ считают среднее время ожидания равным $2$.'
  why: 'Чем больше интенсивность, тем короче ожидание. Среднее равно $\frac{1}{\lambda}=0.5$.'
  fix: '$E[X]=\frac1\lambda$ и $P(X>t)=e^{-\lambda t}$.'
pr.cdistr.memory:
  t: 'Показательное ожидание считают «накапливающимся»'
  bad: 'Уже прождали $s$ минут, и считают, что автобус «скоро придёт»: вероятность ждать ещё $t$ меньше.'
  why: 'Для показательного распределения $P(X>s+t\mid X>s)=P(X>t)$: ожидание начинается заново.'
  fix: 'Условная вероятность равна $e^{-\lambda t}$, не $e^{-\lambda(s+t)}$.'
pr.norm.var:
  t: 'При стандартизации делят на дисперсию вместо $\sigma$'
  bad: 'Для $N(100, 25)$ берут $z=\frac{110-100}{25}$.'
  why: 'Число $25$ — дисперсия, а делить нужно на стандартное отклонение $\sqrt{25}=5$.'
  fix: '$z=\frac{x-\mu}{\sigma}$, здесь $\frac{10}{5}=2$.'
pr.norm.tail:
  t: 'Учтён один хвост вместо двух'
  bad: 'Вероятность выхода за $2\sigma$ считают как $1-0.95=0.05$ для одной стороны.'
  why: 'Эта вероятность разделена между двумя симметричными хвостами по $0.025$.'
  fix: 'Для одного хвоста: $\frac{1-0.95}{2}=0.025$.'
pr.joint.marginal:
  t: 'Маргинальная вероятность принята за одну ячейку таблицы'
  bad: 'Для $P(X=1)$ берут только вероятность $P(X=1, Y=1)$.'
  why: 'Событие $X=1$ включает все значения $Y$: нужно сложить ячейки всей строки.'
  fix: '$P(X=1)=\sum_jP(X=1, Y=y_j)$.'
pr.joint.cond:
  t: 'Условная вероятность не поделена на маргинальную'
  bad: 'Для $P(Y=1\mid X=1)$ берут совместную вероятность $P(X=1, Y=1)$.'
  why: 'Условие $X=1$ сужает пространство до строки, поэтому ячейку надо поделить на сумму строки.'
  fix: '$P(Y=1\mid X=1)=\frac{P(X=1, Y=1)}{P(X=1)}$.'
pr.cov.uncorr:
  t: 'Некоррелированность принята за независимость'
  bad: 'Из $\operatorname{Cov}(X,Y)=0$ делают вывод, что $X$ и $Y$ независимы.'
  why: 'Для симметричной $X$ и $Y=X^2$ ковариация нулевая, хотя $Y$ полностью определяется $X$. Корреляция измеряет только линейную связь.'
  fix: 'Независимость проверяют равенством $P(x, y)=P(x)P(y)$ во всех ячейках.'
pr.cov.cov-scale:
  t: 'Корреляция принята за ковариацию'
  bad: 'Берут $\rho=\operatorname{Cov}(X,Y)$ и получают значение вне $[-1, 1]$.'
  why: 'Ковариация зависит от единиц измерения. Корреляция получается делением на $\sigma_X\sigma_Y$.'
  fix: '$\rho=\frac{\operatorname{Cov}(X,Y)}{\sigma_X\sigma_Y}$.'
pr.cov.var-sum:
  t: 'Дисперсия суммы без ковариации'
  bad: 'Для зависимых величин считают $\operatorname{Var}(X+Y)=\operatorname{Var}X+\operatorname{Var}Y$.'
  why: 'Складывать дисперсии можно только для некоррелированных величин. Положительная связь увеличивает разброс суммы.'
  fix: '$\operatorname{Var}(X+Y)=\operatorname{Var}X+\operatorname{Var}Y+2\operatorname{Cov}(X,Y)$.'
pr.ineq.nonneg:
  t: 'Неравенство Маркова применено к величине с отрицательными значениями'
  bad: 'Оценивают $P(X\ge a)\le\frac{E[X]}{a}$ для $X$, которая принимает отрицательные значения.'
  why: 'Для $X$, равной $-10$ или $10$ с вероятностями $0.5$, имеем $E[X]=0$, но $P(X\ge10)=0.5$.'
  fix: 'Неравенство Маркова требует $X\ge0$.'
pr.ineq.sigma:
  t: 'В неравенстве Чебышёва потеряны квадраты'
  bad: 'Берут оценку $\frac{\sigma}{t}$ вместо $\frac{\sigma^2}{t^2}$ или $\frac{1}{k}$ вместо $\frac{1}{k^2}$.'
  why: 'Неравенство Чебышёва выводится из дисперсии, то есть из квадратов отклонений.'
  fix: '$P(|X-\mu|\ge t)\le\frac{\sigma^2}{t^2}$.'
pr.lln.gambler:
  t: 'Ошибка игрока'
  bad: 'После пяти орлов подряд считают, что решка «должна» выпасть чаще.'
  why: 'Броски независимы: монета не помнит прошлого. Доля стремится к $0.5$ потому, что новые броски разбавляют прошлые, а не потому, что их исправляют.'
  fix: 'Вероятность каждого нового броска по-прежнему $0.5$.'
pr.lln.abs:
  t: 'Закон больших чисел принят за убывание абсолютной разности'
  bad: 'Считают, что разность между числом орлов и решек стремится к нулю.'
  why: 'Закон говорит о доле: $\frac{\text{орлы}}{n}\to0.5$. Абсолютная разность в среднем растёт порядка $\sqrt n$.'
  fix: 'Различай долю (сходится) и абсолютную разность (может расти).'
pr.clt.data:
  t: 'Нормальным считают распределение данных'
  bad: 'Считают, что при росте $n$ сами наблюдения становятся нормальными.'
  why: 'Наблюдения остаются такими, какими были: например, бросок кубика всегда принимает значения $1,\dots,6$. Нормальным становится распределение среднего.'
  fix: 'ЦПТ описывает распределение $\bar X_n$ или суммы, а не отдельных данных.'
pr.clt.sd:
  t: 'Стандартное отклонение среднего посчитано неверно'
  bad: 'Для среднего по $n=36$ наблюдениям с $\sigma=12$ берут $12$ или $\frac{12}{36}$.'
  why: 'Дисперсия среднего равна $\frac{\sigma^2}{n}$, поэтому стандартное отклонение — $\frac{\sigma}{\sqrt n}=2$. Корень из $n$, а не $n$.'
  fix: 'Стандартная ошибка среднего $\frac{\sigma}{\sqrt n}$; для суммы $\sigma\sqrt n$.'
st.descr.outlier:
  t: 'Среднее считают устойчивым к выбросам'
  bad: 'Один сверхбольшой доход не меняет среднее по группе.'
  why: 'Среднее учитывает величину каждого значения: один выброс сдвигает его на $\frac{D}{n}$. Медиана зависит лишь от порядка.'
  fix: 'При выбросах смотри на медиану или считай среднее с выбросом и без.'
st.descr.median-even:
  t: 'Медиана при чётном числе значений'
  bad: 'Для $1, 3, 5, 7$ берут медиану равной $3$ или $5$.'
  why: 'Середина лежит между двумя средними значениями, поэтому берут их среднее.'
  fix: 'Медиана $\frac{3+5}{2}=4$.'
st.samp.pop-size:
  t: 'Точность связывают с размером генеральной совокупности'
  bad: 'Считают, что опрос $1000$ человек точнее в городе, чем в стране.'
  why: 'Стандартная ошибка $\frac{\sigma}{\sqrt n}$ зависит от размера выборки, а не от размера совокупности, если выборка мала по сравнению с ней.'
  fix: 'Сравнивай объёмы выборок $n$.'
st.est.n-div:
  t: 'Деление на $n$ даёт несмещённую оценку дисперсии'
  bad: 'Считают $s^2=\frac{1}{n}\sum(x_i-\bar x)^2$ несмещённой.'
  why: 'Отклонения от $\bar x$ в среднем меньше, чем от настоящего $\mu$, поэтому деление на $n$ занижает дисперсию.'
  fix: 'Для несмещённости делят на $n-1$.'
st.est.unbiased-good:
  t: 'Несмещённость принята за точность'
  bad: 'Считают, что несмещённая оценка всегда лучше смещённой.'
  why: 'Несмещённая оценка с большой дисперсией может ошибаться сильнее смещённой с малой: $\mathrm{MSE}=\mathrm{bias}^2+\mathrm{Var}$.'
  fix: 'Сравнивай MSE, а не только смещение.'
st.mle.prob-param:
  t: 'Правдоподобие принято за вероятность параметра'
  bad: 'Говорят: «правдоподобие $0.03$ означает вероятность параметра $3\%$».'
  why: '$L(\theta)$ — вероятность данных при данном $\theta$. По $\theta$ она не нормирована на $1$ и не является распределением параметра.'
  fix: 'Сравнивай значения $L$ при разных $\theta$ и выбирай максимум.'
st.mle.mean-rate:
  t: 'Оценка интенсивности принята за среднее'
  bad: 'Для показательного распределения с выборочным средним $4$ берут $\hat\lambda=4$.'
  why: 'Среднее показательного равно $\frac1\lambda$, поэтому $\lambda$ оценивают как $\frac{1}{\bar x}$.'
  fix: '$\hat\lambda=\frac{1}{\bar x}=0.25$.'
st.t.z-for-t:
  t: 'Значение $1.96$ взято вместо $t^*$'
  bad: 'Для малой выборки с неизвестной $\sigma$ строят интервал с множителем $1.96$.'
  why: 'Оценка $s$ добавляет неопределённость. Хвосты $t$ тяжелее нормальных, поэтому $t^*>1.96$.'
  fix: 'Бери $t^*$ для $\mathrm{df}=n-1$.'
st.t.df:
  t: 'Число степеней свободы равно $n$'
  bad: 'Для выборки из $10$ значений берут $\mathrm{df}=10$.'
  why: 'Одна степень свободы «потрачена» на оценку среднего.'
  fix: '$\mathrm{df}=n-1=9$.'
st.test.p-h0:
  t: '$p$-значение принято за вероятность $H_0$'
  bad: 'Говорят: «$p=0.03$, значит $H_0$ верна с вероятностью $3\%$».'
  why: '$p$ — вероятность таких данных при верной $H_0$, а не вероятность гипотезы при данных.'
  fix: '$p$ показывает, насколько данные необычны, если $H_0$ верна.'
st.test.accept:
  t: '«Не отвергли» принято за доказательство $H_0$'
  bad: 'Из $p=0.2>0.05$ делают вывод, что $H_0$ доказана.'
  why: 'Малая выборка могла просто не заметить эффект. Отсутствие доказательств не есть доказательство отсутствия.'
  fix: 'Говори: «данных недостаточно, чтобы отвергнуть $H_0$».'
st.test.tails:
  t: 'Учтён один хвост вместо двух'
  bad: 'Для двустороннего критерия берут $p=P(Z>|z|)$.'
  why: 'Данные необычны и в большую, и в меньшую сторону: учитываются оба хвоста.'
  fix: '$p=2\cdot P(Z>|z|)$.'
st.zt.sign:
  t: 'Знак статистики игнорируется в одностороннем критерии'
  bad: 'Для $H_1:\mu>\mu_0$ при $z=-2.5$ отвергают $H_0$, потому что $|z|>1.645$.'
  why: 'Альтернатива утверждает рост, а данные показывают снижение. Такое отклонение не свидетельствует в пользу $H_1$.'
  fix: 'В одностороннем критерии сравнивай сам $z$, а не $|z|$, с критическим значением.'
st.two.paired-indep:
  t: 'Парные данные считают независимыми выборками'
  bad: 'Давление у тех же людей до и после лечения сравнивают как две независимые выборки.'
  why: 'Измерения одного человека связаны. Независимый критерий не использует эту связь и даёт слишком большую ошибку.'
  fix: 'Для парных данных анализируй разности внутри пар.'
st.two.se-diff:
  t: 'Стандартные ошибки складывают без квадратов'
  bad: 'Для разности средних берут $\mathrm{SE}_1+\mathrm{SE}_2$ или $\mathrm{SE}_1-\mathrm{SE}_2$.'
  why: 'Складываются дисперсии независимых средних, а не их стандартные отклонения: $\mathrm{SE}=\sqrt{\mathrm{SE}_1^2+\mathrm{SE}_2^2}$.'
  fix: '$\mathrm{SE}_{\text{разн}}=\sqrt{\mathrm{SE}_1^2+\mathrm{SE}_2^2}$.'
st.power.alpha-beta:
  t: 'Мощность принята за $1-\alpha$'
  bad: 'Считают мощность критерия равной $0.95$ при $\alpha=0.05$.'
  why: 'Уровень $\alpha$ — вероятность ошибки I рода при верной $H_0$. Мощность связана с ошибкой II рода: $1-\beta$ при ложной $H_0$.'
  fix: 'Мощность $=1-\beta$; её находят при конкретной альтернативе.'
st.chi.div-e:
  t: 'Забыто деление на ожидаемую частоту'
  bad: 'Статистику считают как $\sum(O_i-E_i)^2$.'
  why: 'Одинаковое отклонение важнее при малой ожидаемой частоте. Деление на $E_i$ приводит отклонения к одной шкале.'
  fix: '$\chi^2=\sum\frac{(O_i-E_i)^2}{E_i}$.'
st.chi.df:
  t: 'Число степеней свободы равно числу категорий'
  bad: 'Для критерия согласия с $k$ категориями берут $\mathrm{df}=k$.'
  why: 'Сумма частот фиксирована, поэтому свободны лишь $k-1$ категорий.'
  fix: '$\mathrm{df}=k-1$.'
st.chi.props:
  t: 'В статистику подставлены доли вместо частот'
  bad: 'Считают, что $\chi^2$ по долям и по частотам совпадает.'
  why: 'Статистика растёт пропорционально $n$: те же доли при большем объёме дают большее значение.'
  fix: 'Используй абсолютные частоты $O_i$ и $E_i=np_i$.'
st.reg.causation:
  t: 'Связь принята за причинность'
  bad: 'Из сильной корреляции продаж мороженого и числа утоплений делают вывод, что мороженое вызывает утопления.'
  why: 'Обе величины растут из-за жары. Регрессия описывает совместное изменение, а не механизм.'
  fix: 'Говори о связи, а причинность проверяй планом исследования.'
st.reg.extrapolate:
  t: 'Прогноз за пределами диапазона данных'
  bad: 'Прогноз при $x=100$ по модели, построенной на $x$ от $20$ до $40$, считают таким же надёжным.'
  why: 'Вне наблюдённого диапазона линейность не проверена и может нарушаться.'
  fix: 'Прогнозируй внутри диапазона данных.'
lg.nf.count:
  t: 'Число функций путают с числом строк'
  bad: 'Думают, что булевых функций от $n$ переменных $2^n$: это число строк таблицы.'
  why: 'Каждая строка получает 0 или 1 независимо от остальных, поэтому раскрасок таблицы $2^{2^n}$.'
  fix: 'Строк $2^n$, функций $2^{2^n}$.'
lg.nf.zeros:
  t: 'СДНФ строят по нулям'
  bad: 'Берут наборы, на которых функция равна 0, и составляют из них слагаемые СДНФ.'
  why: 'Конъюнкция истинна на одном наборе, а СДНФ должна быть истинна там, где $f=1$. Слагаемые по нулям дали бы функцию, равную 1 именно на нулях.'
  fix: 'СДНФ строят по единицам таблицы, СКНФ — по нулям.'
lg.nf.complete:
  t: '«И» и «или» достаточно для любой функции'
  bad: 'Считают систему $\{\wedge,\vee\}$ полной.'
  why: 'Обе связки на наборе из одних единиц дают 1. Через них нельзя получить $\neg1=0$, а значит, нельзя выразить $\neg x$.'
  fix: 'В полной системе нужна связка, которая не сохраняет единицу, например $\neg$.'
lg.deduct.affirm:
  t: 'Подтверждение следствия'
  bad: 'Из $A\to B$ и $B$ делают вывод $A$.'
  why: 'Следствие может быть истинным и без посылки: при ложном $A$ импликация $A\to B$ истинна при любом $B$.'
  fix: 'Отделять можно только посылку: из $A\to B$ и $A$ следует $B$.'
lg.deduct.deny:
  t: 'Отрицание посылки'
  bad: 'Из $A\to B$ и $\neg A$ делают вывод $\neg B$.'
  why: 'При ложном $A$ импликация истинна и при истинном, и при ложном $B$. Значение $B$ остаётся неопределённым.'
  fix: 'Из $\neg A$ и $A\to B$ о $B$ ничего не следует; верно только $\neg B\Rightarrow\neg A$.'
lg.deduct.assumption:
  t: 'Допущение осталось в выводе'
  bad: 'После шагов под допущением $A$ объявляют выведенную формулу доказанной без условий.'
  why: 'Всё выведенное под допущением верно только при $A$. Безусловным является лишь результат применения теоремы о дедукции: $A\to B$.'
  fix: 'Закончи вывод шагом «значит, $A\to B$» и снимай допущение явно.'
lg.fol.domain:
  t: 'Истинность не зависит от области'
  bad: 'Оценивают формулу с кванторами, не глядя на область, или берут значения вне области.'
  why: 'Кванторы пробегают именно элементы области. На $\{1,2,3\}$ формула $\forall x\,\exists y\,(x<y)$ ложна, на $\mathbb N$ истинна.'
  fix: 'Сначала зафиксируй область, затем проверяй квантор только на её элементах.'
lg.fol.free:
  t: 'Свободную переменную принимают за связанную'
  bad: 'Формулу со свободной переменной, например $\exists y\,(x<y)$, считают высказыванием.'
  why: 'Её истинность зависит от значения $x$: при одном $x$ она истинна, при другом может быть ложна.'
  fix: 'Высказывание получается, когда все переменные связаны кванторами или заменены значениями.'
lg.fol.one:
  t: 'Одна интерпретация вместо общезначимости'
  bad: 'Находят интерпретацию, где формула истинна, и объявляют её общезначимой.'
  why: 'Общезначимость требует истинности во всех интерпретациях. Одной модели достаточно только для выполнимости, а для ложности общезначимости хватает одного контрпримера.'
  fix: 'Для «общезначима» нужно доказательство или рассуждение для всех интерпретаций; для «не общезначима» — один контрпример.'
lg.meta.swap:
  t: 'Корректность путают с полнотой'
  bad: 'Корректным называют исчисление, в котором выводимо всё общезначимое (это полнота), и наоборот.'
  why: 'Корректность — «выводится только истинное», полнота — «истинное выводится». Это два разных направления импликации между $\vdash$ и $\models$.'
  fix: 'Корректность: $\vdash\varphi\Rightarrow\models\varphi$. Полнота: $\models\varphi\Rightarrow\vdash\varphi$.'
lg.meta.godel:
  t: '«Неполнота» значит «ничего нельзя доказать»'
  bad: 'Теорему Гёделя понимают так, что в арифметике нельзя ничего доказать или что математика противоречива.'
  why: 'В теории доказывается огромное число теорем. Неполнота говорит лишь о том, что одно конкретное истинное предложение в ней не доказуемо.'
  fix: 'Неполная — значит «часть истин вне доказательств», а не «доказывать нечего».'
la.quad.offdiag:
  t: 'Коэффициент при $xy$ ставят в матрицу целиком'
  bad: 'Для $Q=ax^2+kxy+cy^2$ берут в матрицу число $k$ вместо $k/2$.'
  why: 'В $\mathbf x^TA\mathbf x$ слагаемое $xy$ получается дважды: $bxy+byx$. Поэтому $k=2b$.'
  fix: 'Элемент матрицы $b=k/2$.'
la.quad.det-only:
  t: 'Определённость по одному определителю'
  bad: 'Считают форму положительно определённой, если $ac-b^2>0$.'
  why: 'При $ac-b^2>0$ числа $a$ и $c$ одного знака, но оно может быть отрицательным: тогда форма отрицательно определена.'
  fix: 'Положительная определённость требует $a>0$ и $ac-b^2>0$.'
la.quad.diag:
  t: 'Определённость по диагонали'
  bad: 'Считают форму положительно определённой, потому что $a>0$ и $c>0$.'
  why: 'Слагаемое $2bxy$ может перевесить: у $x^2+4xy+y^2$ диагональ положительна, но при $x=1$, $y=-1$ значение равно $-2$.'
  fix: 'Проверь $a>0$ и $ac-b^2>0$, а не только знаки диагонали.'
la.svd.eig:
  t: 'Сингулярные числа принимают за собственные значения'
  bad: 'Считают, что сингулярные числа матрицы $A$ совпадают с её собственными значениями.'
  why: 'Собственные значения могут быть отрицательными или комплексными, сингулярные числа всегда неотрицательны и берутся из $A^TA$. Совпадают только для симметричных матриц с неотрицательными значениями.'
  fix: 'Сингулярные числа — корни из собственных значений $A^TA$.'
la.svd.square:
  t: 'Забыт корень'
  bad: 'Берут собственные значения $A^TA$ как сингулярные числа.'
  why: 'Собственные значения $A^TA$ равны $\sigma_i^2$. Сингулярные числа — их квадратные корни.'
  fix: '$\sigma_i=\sqrt{\lambda_i(A^TA)}$.'
la.svd.rank:
  t: 'Ранг равен числу сингулярных чисел'
  bad: 'Считают ранг матрицы числом всех сингулярных чисел, включая нулевые.'
  why: 'У матрицы $n\times n$ всегда $n$ сингулярных чисел, но нулевые соответствуют направлениям, которые матрица обнуляет.'
  fix: 'Ранг равен числу ненулевых сингулярных чисел.'
la.norm.l1:
  t: 'Нормы перепутаны'
  bad: 'Считают $\|x\|_1$ как $\sqrt{\sum x_i^2}$ или евклидову норму как сумму модулей.'
  why: 'У разных норм разные формулы: на $(3,4)$ получаются $7$, $5$ и $4$.'
  fix: 'Смотри индекс: $1$ — сумма модулей, $2$ — корень из суммы квадратов, $\infty$ — наибольший модуль.'
la.norm.inf:
  t: 'Бесконечная норма как сумма'
  bad: 'Считают $\|x\|_\infty=\sum|x_i|$.'
  why: 'Норма $\infty$ — предел $\|x\|_p$ при $p\to\infty$ и равна наибольшей по модулю координате.'
  fix: '$\|x\|_\infty=\max|x_i|$.'
la.norm.cond-det:
  t: 'Обусловленность по определителю'
  bad: 'Считают матрицу плохо обусловленной, если определитель мал, или берут $\kappa=\det A$.'
  why: 'Определитель меняется при простом масштабировании матрицы, а обусловленность — нет: $\kappa(0.01I)=1$. Важно отношение наибольшего и наименьшего сингулярных чисел.'
  fix: '$\kappa=\sigma_{\max}/\sigma_{\min}$.'
la.cross.order:
  t: 'Порядок множителей в векторном произведении'
  bad: 'Считают $\mathbf a\times\mathbf b=\mathbf b\times\mathbf a$ или ошибаются в знаке компоненты.'
  why: 'Векторное произведение антикоммутативно: $\mathbf b\times\mathbf a=-\mathbf a\times\mathbf b$. В компоненте $z=a_1b_2-a_2b_1$ уменьшаемое — произведение «первое на второе».'
  fix: 'Следи за порядком множителей и знаком: $\mathbf a\times\mathbf b=-\mathbf b\times\mathbf a$.'
la.cross.scalar:
  t: 'Векторное произведение — число'
  bad: 'Считают результат $\mathbf a\times\mathbf b$ числом, как у скалярного произведения.'
  why: 'Скалярное произведение даёт число, векторное — вектор в $\mathbb R^3$, перпендикулярный обоим множителям.'
  fix: '$\mathbf a\cdot\mathbf b$ — число, $\mathbf a\times\mathbf b$ — вектор.'
la.cross.dot:
  t: 'Площадь через скалярное произведение'
  bad: 'Считают площадь параллелограмма как $\mathbf a\cdot\mathbf b$.'
  why: 'Скалярное произведение содержит $\cos\varphi$, а площадь — $|\mathbf a||\mathbf b|\sin\varphi$. У перпендикулярных векторов скалярное произведение равно нулю, а площадь максимальна.'
  fix: 'Площадь $=|\mathbf a\times\mathbf b|$; в плоскости $|a_1b_2-a_2b_1|$.'
la.cplx.real-part:
  t: 'Модуль принят за вещественную часть'
  bad: 'Для $\lambda=a\pm bi$ берут $a$ как величину растяжения.'
  why: 'Растяжение задаёт модуль $|\lambda|=\sqrt{a^2+b^2}$. Вещественная часть $a$ — только часть этого значения.'
  fix: 'Растяжение — $|a+bi|=\sqrt{a^2+b^2}$.'
la.cplx.disc:
  t: 'Мнимая часть без корня'
  bad: 'Для отрицательного дискриминанта $D$ берут мнимую часть $|D|/2$ или $|D|/4$ вместо $\sqrt{|D|}/2$.'
  why: 'Корни $\lambda=\dfrac{t\pm\sqrt D}{2}$, при $D<0$ получается $\sqrt D=i\sqrt{|D|}$, корень нужен.'
  fix: '$\mathrm{Im}\,\lambda=\sqrt{|D|}/2$.'
la.cplx.real-vec:
  t: 'У поворота ищут вещественные собственные векторы'
  bad: 'Считают, что у матрицы поворота на угол, не кратный $180^\circ$, есть вещественное собственное направление.'
  why: 'Поворот меняет направление любого ненулевого вектора, поэтому $A\mathbf v=\lambda\mathbf v$ с вещественным $\lambda$ невозможно.'
  fix: 'Характеристическое уравнение $\lambda^2+b^2=0$ имеет только комплексные корни.'
la.jord.diag:
  t: 'Жорданову клетку считают диагональной'
  bad: 'Считают, что у $\begin{pmatrix}\lambda&1\\0&\lambda\end{pmatrix}$ два независимых собственных вектора.'
  why: 'Уравнение $(A-\lambda I)\mathbf v=0$ даёт $v_2=0$: остаётся одно направление.'
  fix: 'Число независимых собственных векторов равно $\dim\ker(A-\lambda I)$.'
la.jord.size:
  t: 'Размер клетки и степень нильпотентности'
  bad: 'Считают, что $(J-\lambda I)^k=0$ уже при $k$, меньшем размера клетки.'
  why: 'Матрица $N=J-\lambda I$ сдвигает базис на один шаг; чтобы обнулить цепочку из $n$ векторов, нужно $n$ сдвигов.'
  fix: 'Для клетки размера $n$ наименьшее такое $k$ равно $n$.'
la.jord.rank:
  t: 'Число клеток — это ранг'
  bad: 'Считают число клеток Жордана числом $\mathrm{rank}(A-\lambda I)$.'
  why: 'Клетке соответствует один собственный вектор, а их число — размерность ядра $A-\lambda I$, то есть $n-\mathrm{rank}$.'
  fix: 'Число клеток с $\lambda$ равно $n-\mathrm{rank}(A-\lambda I)$.'
dm.pigeon.k:
  t: 'Достаточно столько предметов, сколько ящиков'
  bad: 'Считают, что $k$ предметов по $k$ ящикам гарантируют ящик с двумя.'
  why: 'Предметы могут лечь по одному в каждый ящик. Гарантия появляется только при $k+1$ предмете.'
  fix: 'Для двух в одном ящике нужно $k+1$ предмет.'
dm.pigeon.floor:
  t: 'Целая часть вместо округления вверх'
  bad: 'Гарантированное число предметов в ящике считают как $\lfloor N/k\rfloor$.'
  why: 'При $N=10$, $k=3$ получаем $3.33\ldots$. Ящик с тремя предметами не обязан быть, а ящик минимум с четырьмя — обязан.'
  fix: 'Гарантия равна $\lceil N/k\rceil$.'
dm.pigeon.kr:
  t: 'Гарантия для $r$ предметов: $kr$'
  bad: 'Чтобы в каком-то из $k$ ящиков было не менее $r$ предметов, берут $kr$ предметов.'
  why: 'При $k(r-1)$ предметах можно положить по $r-1$ в каждый ящик. Нужен ещё один предмет.'
  fix: 'Нужно $k(r-1)+1$ предметов.'
dm.rel.count:
  t: 'Число отношений — число пар'
  bad: 'Считают, что на множестве из $n$ элементов $n^2$ отношений.'
  why: 'Пар $n^2$, а отношение — любой набор этих пар. У каждой пары два варианта: входит или нет, поэтому $2^{n^2}$.'
  fix: 'Число отношений равно $2^{n^2}$.'
dm.rel.sym-trans:
  t: 'Рефлексивность выводят из симметрии и транзитивности'
  bad: 'Рассуждают: из $aRb$ и $bRa$ следует $aRa$, значит, рефлексивность лишняя.'
  why: 'Рассуждение работает только для элемента, у которого есть хоть один связанный с ним. Элемент, не связанный ни с чем, не получит $aRa$.'
  fix: 'Рефлексивность проверяют отдельно; контрпример — отношение, в котором элемент ни с чем не связан.'
dm.rel.partial:
  t: 'Любые два элемента частичного порядка сравнимы'
  bad: 'Считают, что в частичном порядке для любых $a,b$ верно $a\preceq b$ или $b\preceq a$.'
  why: 'Это свойство линейного порядка. Для делимости $2\nmid3$ и $3\nmid2$.'
  fix: 'Частичный порядок допускает несравнимые элементы.'
dm.card.all-equal:
  t: 'Все бесконечности одинаковы'
  bad: 'Считают, что любое бесконечное множество равномощно $\mathbb N$.'
  why: 'Диагональный аргумент Кантора показывает, что $[0,1]$ не помещается в список с номерами $1,2,\dots$.'
  fix: 'Счётных множеств мало (целые, рациональные), а вещественных больше.'
dm.card.more:
  t: 'Часть меньше целого'
  bad: 'Считают, что у чётных чисел меньше элементов, чем у натуральных, потому что они составляют лишь часть.'
  why: 'Для бесконечных множеств часть может быть равномощна целому: $n\mapsto2n$ — взаимно однозначное соответствие.'
  fix: 'Сравнивай по биекции, а не по включению.'
dm.card.interval:
  t: 'Отрезок короче прямой, значит, точек меньше'
  bad: 'Считают, что на интервале $(0,1)$ меньше точек, чем на всей прямой.'
  why: 'Биекция $x\mapsto\tan\bigl(\pi(x-\tfrac12)\bigr)$ переводит $(0,1)$ на всю прямую.'
  fix: 'Длина не определяет мощность: интервал и прямая равномощны.'
dm.gf.shift:
  t: 'Сдвиг индекса в коэффициентах'
  bad: 'Коэффициент при $x^k$ в $\frac1{(1-x)^2}$ считают равным $k$.'
  why: '$\frac1{(1-x)^2}=\sum(n+1)x^n$: свободный член равен $1$, а не $0$.'
  fix: 'Коэффициент при $x^k$ равен $k+1$.'
dm.gf.bound:
  t: 'Не учтено ограничение сверху'
  bad: 'Число решений $a+b=k$ при $0\le a,b\le m$ считают как $k+1$, как без верхней границы.'
  why: 'При $k>m$ часть пар выходит за границу: $a>m$ или $b>m$ запрещены.'
  fix: 'Для $m<k\le2m$ получается $2m-k+1$.'
dm.gf.sum:
  t: 'Произведение рядов заменено суммой'
  bad: 'Для двух независимых выборов складывают производящие функции, а не перемножают.'
  why: 'Сумма рядов соответствует выбору «или то, или другое». Выбор «и то, и другое» даёт произведение.'
  fix: 'Независимые части — перемножай ряды.'
dm.div.euclid-step:
  t: 'В алгоритме Евклида берут частное'
  bad: 'Переходят от $\gcd(a,b)$ к $\gcd(b,\ a\div b)$ вместо остатка.'
  why: 'Общий делитель $a$ и $b$ делит и $a-qb$, то есть остаток, но не частное.'
  fix: '$\gcd(a,b)=\gcd(b,\ a\bmod b)$.'
dm.div.lcm-prod:
  t: 'НОК равен произведению'
  bad: 'Считают $\mathrm{lcm}(a,b)=ab$ для любых чисел.'
  why: 'Равенство верно только при $\gcd=1$. В общем случае $ab=\gcd\cdot\mathrm{lcm}$, значит, $\mathrm{lcm}=ab/\gcd$.'
  fix: '$\mathrm{lcm}(a,b)=\dfrac{ab}{\gcd(a,b)}$.'
dm.div.coprime:
  t: 'Взаимно простые — значит простые'
  bad: 'Считают, что взаимно простые числа обязательно простые.'
  why: 'Взаимная простота — свойство пары: $\gcd(8,15)=1$, хотя оба числа составные.'
  fix: 'Взаимно простые — нет общих делителей, кроме $1$.'
dm.mod.negative:
  t: 'Отрицательный остаток оставляют отрицательным'
  bad: 'Остаток отрицательного числа записывают отрицательным: $-3\bmod7=-3$.'
  why: 'Остаток берут от $0$ до $m-1$. Число $-3$ отличается от $4$ на $7$.'
  fix: 'Прибавь $m$: $-3\equiv4\pmod7$.'
dm.mod.inverse-neg:
  t: 'Обратный по модулю — это противоположный'
  bad: 'Обратным к $a$ по модулю $m$ называют $m-a$ (то есть $-a$).'
  why: '$m-a$ противоположно $a$ по сложению. Обратный по умножению $b$ удовлетворяет $ab\equiv1$.'
  fix: 'Найди $b$ с $ab\equiv1\pmod m$, например по алгоритму Евклида.'
dm.mod.noncoprime:
  t: 'Сокращение и обратные при общем делителе'
  bad: 'Сокращают обе части сравнения или ищут обратный к числу, не взаимно простому с модулем.'
  why: 'При $\gcd(a,m)=d>1$ обратного нет, а сокращение на $d$ требует разделить и модуль: $6x\equiv6\pmod9$ равносильно $2x\equiv2\pmod3$.'
  fix: 'Проверь $\gcd(a,m)$; если он больше $1$, дели и модуль на него.'
dm.rsa.phi:
  t: '$\varphi$ посчитана неверно'
  bad: 'Берут $\varphi(pq)=pq-1$ или $\varphi(p)=p$.'
  why: 'Для простого $p$ взаимно просты с ним числа $1,\dots,p-1$. Для $pq$ исключаются кратные $p$ и $q$: остаётся $(p-1)(q-1)$.'
  fix: '$\varphi(p)=p-1$, $\varphi(pq)=(p-1)(q-1)$.'
dm.rsa.private:
  t: 'Расшифровывают открытым ключом'
  bad: 'Для расшифровки возводят в степень $e$, а не $d$.'
  why: 'Степень $e$ — шифрование. Расшифровка использует $d$ с $ed\equiv1\pmod\varphi$.'
  fix: 'Расшифровка: $m=c^d\bmod n$.'
dm.rsa.mul:
  t: 'Шифруют умножением'
  bad: 'Шифруют сообщение как $m\cdot e\bmod n$ вместо степени.'
  why: 'RSA — возведение в степень: $c=m^e\bmod n$. Умножение на $e$ легко обратить делением по модулю.'
  fix: '$c=m^e\bmod n$.'
dm.bigo.equal:
  t: '$O$ читают как равенство'
  bad: 'Считают, что $n^2=O(n^3)$ неверно, потому что функции не равны.'
  why: '$O$ — верхняя оценка: $n^2\le n^3$ при $n\ge1$. Знак «$=$» здесь условен.'
  fix: '$f=O(g)$ значит «$f$ не растёт быстрее $g$».'
dm.bigo.dom:
  t: 'Порядок суммы по младшему слагаемому'
  bad: 'Оценивают $3n^2+5n$ как $O(n)$, потому что $5n$ — «последнее» слагаемое, либо берут только коэффициент главного члена как константу.'
  why: 'Порядок суммы задаёт слагаемое, которое растёт быстрее всех; константа $C$ в оценке учитывает и остальные члены.'
  fix: 'Выдели главный член: $3n^2+5n=\Theta(n^2)$; $C=3+5$ при $n\ge1$.'
dm.bigo.lower:
  t: 'Верхняя и нижняя оценки перепутаны'
  bad: 'Нижнюю оценку $\Omega$ доказывают неравенством «$\le$».'
  why: '$f=\Omega(g)$ требует $f\ge cg$, то есть неравенства в другую сторону.'
  fix: '$O$ — «$\le$», $\Omega$ — «$\ge$», $\Theta$ — оба сразу.'
pr.jointc.area:
  t: 'Вероятность принимают за площадь'
  bad: 'Вероятность попасть в область считают как площадь этой области, не умножая на плотность.'
  why: 'Площадь области меряет её размер. Вероятность равна объёму над областью, то есть площадь, умноженная на плотность $1/S$.'
  fix: 'Для равномерной плотности $P=\dfrac{\text{площадь области}}{\text{площадь носителя}}$.'
pr.jointc.dens-value:
  t: 'Плотность и вероятность перепутаны'
  bad: 'Плотность принимают за вероятность или за площадь носителя.'
  why: 'Плотность — высота над точкой, не вероятность. Для равномерного распределения $f=1/S$, и она может быть больше $1$.'
  fix: 'Плотность равна $1/S$; вероятность — объём над областью.'
pr.jointc.support:
  t: 'Независимость без учёта носителя'
  bad: 'Считают величины независимыми, потому что плотность постоянна.'
  why: 'В треугольнике $x+y\le1$ большое $X$ ограничивает $Y$. Носитель — не прямоугольник, поэтому условное распределение $Y$ зависит от $X$.'
  fix: 'Независимость требует, чтобы носитель был прямоугольником и плотность разделялась на множители.'
pr.trans.merge:
  t: 'Вероятности одного значения не сложены'
  bad: 'Для $Y=X^2$ берут вероятность одного $x$, забывая второе $x$ с тем же значением $Y$.'
  why: 'Событие $Y=1$ наступает и при $X=1$, и при $X=-1$. Их вероятности складываются.'
  fix: '$P(Y=y)=\sum_{g(x)=y}P(X=x)$.'
pr.trans.jac:
  t: 'Забыт множитель масштаба плотности'
  bad: 'Для $Y=aX+b$ плотность берут как $f_X\bigl(\frac{y-b}{a}\bigr)$ без деления на $|a|$.'
  why: 'Растяжение в $a$ раз размазывает вероятность на отрезок длиннее, поэтому высота падает в $a$ раз. Иначе площадь под плотностью не равна $1$.'
  fix: '$f_Y(y)=\frac1{|a|}f_X\bigl(\frac{y-b}{a}\bigr)$.'
pr.trans.sd-add:
  t: 'Стандартные отклонения складывают'
  bad: 'Для суммы независимых величин берут $\sigma=\sigma_1+\sigma_2$.'
  why: 'Складываются дисперсии: $\sigma^2=\sigma_1^2+\sigma_2^2$. Стандартные отклонения складываются как стороны прямоугольного треугольника.'
  fix: '$\sigma=\sqrt{\sigma_1^2+\sigma_2^2}$.'
pr.condexp.norm:
  t: 'Условное среднее без нормировки'
  bad: 'Вычисляют $E[X\mid Y=y]$ по совместным вероятностям, не деля на $P(Y=y)$.'
  why: 'Условные вероятности в сумме дают $1$, совместные — только $P(Y=y)$. Без деления среднее получается слишком малым.'
  fix: '$E[X\mid Y=y]=\dfrac{\sum xP(X=x,Y=y)}{P(Y=y)}$.'
pr.condexp.avg:
  t: 'Групповые средние усредняют без весов'
  bad: 'Общее среднее считают как простое среднее групповых средних.'
  why: 'Группы разной доли в популяции вносят разный вклад. Простое среднее верно только при равных долях.'
  fix: '$E[X]=\sum_yE[X\mid Y=y]P(Y=y)$.'
pr.condexp.var:
  t: 'В полной дисперсии потеряна межгрупповая часть'
  bad: 'Общую дисперсию считают как среднюю дисперсию внутри групп.'
  why: 'Группы ещё и различаются средними, а эта разница добавляет дисперсию: $\mathrm{Var}(E[X\mid Y])$.'
  fix: '$\mathrm{Var}X=E[\mathrm{Var}(X\mid Y)]+\mathrm{Var}(E[X\mid Y])$.'
pr.mgf.m0:
  t: '$M(0)$ принимают за ноль'
  bad: 'Считают, что $M(0)=0$ или равно среднему.'
  why: '$M(0)=E\,e^{0}=E\,1=1$ для любой величины.'
  fix: '$M(0)=1$, среднее — это $M^{\prime}(0)$.'
pr.mgf.sum:
  t: 'MGF суммы — сумма MGF'
  bad: 'Для суммы независимых величин складывают производящие функции моментов.'
  why: '$E\,e^{t(X+Y)}=E\,e^{tX}\,e^{tY}=M_X(t)M_Y(t)$ для независимых величин. Сумма MGF не имеет вероятностного смысла: $M(0)$ стало бы $2$.'
  fix: '$M_{X+Y}=M_X\cdot M_Y$.'
pr.mgf.deriv:
  t: 'Производная берётся не в нуле'
  bad: 'Вместо $M^{\prime}(0)$ подставляют $M(0)$ или $M^{\prime}$ в другой точке.'
  why: 'Среднее равно производной именно в точке $t=0$: $M^{\prime}(0)=E[Xe^{0}]=E X$. Само $M(0)$ всегда равно $1$.'
  fix: '$E X=M^{\prime}(0)$.'
pr.mvn.uncorr:
  t: 'Нулевая корреляция нормальных — не независимость'
  bad: 'Для совместно нормальных величин с $\mathrm{Cov}=0$ считают, что независимости нет.'
  why: 'Общее правило «некоррелированность не означает независимость» для совместно нормальных величин обращается в равенство: плотность разделяется на множители.'
  fix: 'При совместной нормальности $\mathrm{Cov}=0\iff$ независимость.'
pr.mvn.cov-var:
  t: 'Ковариация забыта в дисперсии суммы'
  bad: 'Считают $\mathrm{Var}(X+Y)=\sigma_X^2+\sigma_Y^2$ при ненулевой ковариации.'
  why: 'Для зависимых величин $\mathrm{Var}(X+Y)=\sigma_X^2+\sigma_Y^2+2\mathrm{Cov}$. При положительной связи дисперсия суммы больше.'
  fix: '$\mathrm{Var}(aX+bY)=a^2\sigma_X^2+b^2\sigma_Y^2+2ab\,\mathrm{Cov}$.'
pr.mvn.rho:
  t: 'Ковариацию принимают за корреляцию'
  bad: 'Считают $\rho=\mathrm{Cov}(X,Y)$ без деления на $\sigma_X\sigma_Y$.'
  why: 'Ковариация зависит от масштаба величин, а корреляция безразмерна и лежит в $[-1,1]$.'
  fix: '$\rho=\dfrac{\mathrm{Cov}(X,Y)}{\sigma_X\sigma_Y}$.'
pr.markov.mult:
  t: 'Матрица в степени — поэлементная'
  bad: 'Вероятности за два шага считают, возводя элементы матрицы в квадрат.'
  why: 'За два шага можно пройти разными путями, вероятности путей складываются: это матричное произведение $P\cdot P$.'
  fix: '$P^2=P\cdot P$; элемент $(i,j)$ — сумма по промежуточным состояниям.'
pr.markov.stationary:
  t: 'Стационарное распределение — равномерное'
  bad: 'Считают, что в стационарном режиме состояния равновероятны.'
  why: 'Стационарное $\pi$ решает $\pi P=\pi$. Если из одного состояния уходят чаще, там проводят меньше времени.'
  fix: 'Реши $\pi P=\pi$; для двух состояний $\pi_1=\frac{b}{a+b}$.'
pr.markov.time:
  t: 'Среднее время ожидания: $a$ вместо $1/a$'
  bad: 'Среднее число шагов до ухода из состояния считают равным вероятности ухода $a$.'
  why: 'Число шагов до первого ухода геометрическое: среднее $1/a$. Чем реже уходят, тем дольше ждать.'
  fix: 'Среднее время пребывания равно $1/a$.'
pr.pois.rate:
  t: 'Интенсивность не умножена на время'
  bad: 'Параметр распределения числа событий берут равным $\lambda$ при любой длине окна.'
  why: 'За окно длины $t$ в среднем происходит $\lambda t$ событий.'
  fix: '$N(t)\sim\mathrm{Pois}(\lambda t)$.'
pr.pois.mean:
  t: 'Среднее ожидание — интенсивность'
  bad: 'Среднее время между событиями считают равным $\lambda$.'
  why: 'Чем больше событий в единицу времени, тем короче ожидание: среднее равно $1/\lambda$.'
  fix: 'Время между событиями $\sim\mathrm{Exp}(\lambda)$ со средним $1/\lambda$.'
pr.pois.memory:
  t: 'Событие «назрело»'
  bad: 'Считают, что после долгого ожидания событие становится вероятнее.'
  why: 'У показательного распределения нет памяти: $P(T>s+t\mid T>s)=P(T>t)$.'
  fix: 'Прошедшее ожидание не влияет на будущее.'
pr.conv.dist-prob:
  t: 'Сходимость по распределению даёт сходимость по вероятности'
  bad: 'Считают, что из сходимости по распределению следует сходимость по вероятности.'
  why: 'Величины $X_n=-Y$ при симметричном $Y$ имеют одно распределение с $Y$, но $|X_n-Y|=2|Y|$ не стремится к $0$.'
  fix: 'Следствие идёт в одну сторону: по вероятности $\Rightarrow$ по распределению.'
pr.conv.clt:
  t: 'ЦПТ — сходимость по вероятности'
  bad: 'Считают, что ЦПТ утверждает сходимость по вероятности к нормальной величине.'
  why: 'ЦПТ говорит о форме распределения стандартизованной суммы: функции распределения сходятся к нормальной.'
  fix: 'ЦПТ — сходимость по распределению.'
pr.conv.exact:
  t: 'Сходимость понимают как равенство'
  bad: 'Считают, что среднее выборки становится равным $\mu$ или отклонение исчезает для каждой выборки.'
  why: 'Сходимость по вероятности говорит, что вероятность большого отклонения стремится к $0$, а не что отклонения нет.'
  fix: '$P(|\bar X_n-\mu|>\varepsilon)\to0$ при любом $\varepsilon$.'
st.mom.invert:
  t: 'Метод моментов: не обращено среднее'
  bad: 'Для $\mathrm{Exp}(\lambda)$ берут $\hat\lambda=\bar x$.'
  why: 'Среднее показательного равно $1/\lambda$, поэтому $\bar x=1/\lambda$ и $\lambda=1/\bar x$.'
  fix: 'Выпиши $E X$ через параметр, приравняй к $\bar x$ и реши уравнение.'
st.mom.half:
  t: 'Метод моментов: потерян множитель'
  bad: 'Для равномерного на $[0,\theta]$ берут $\hat\theta=\bar x$.'
  why: 'Среднее равно $\theta/2$, значит $\theta=2\bar x$.'
  fix: 'Решай уравнение $E X=\bar x$ относительно параметра.'
st.mom.raw:
  t: 'Второй момент принимают за дисперсию'
  bad: 'Берут средний квадрат $m_2$ как оценку $\sigma^2$.'
  why: 'Дисперсия — центральный момент: $\sigma^2=E X^2-(E X)^2$.'
  fix: '$\hat\sigma^2=m_2-\bar x^2$.'
st.mreg.ones:
  t: 'В матрице $X$ нет столбца единиц'
  bad: 'Матрицу $X$ строят только из переменных, без столбца единиц.'
  why: 'Без него модель не имеет свободного члена и прямая вынуждена проходить через начало координат.'
  fix: 'Первый столбец $X$ — единицы.'
st.mreg.r2:
  t: 'Рост $R^2$ принимают за улучшение модели'
  bad: 'Считают, что если $R^2$ вырос после добавления переменной, то модель стала лучше.'
  why: '$R^2$ не убывает при добавлении любой переменной, даже случайной.'
  fix: 'Смотри на скорректированный $R^2$ и проверку значимости.'
st.mreg.ceteris:
  t: 'Учтён только один коэффициент'
  bad: 'Изменение прогноза при изменении нескольких переменных считают по одному коэффициенту.'
  why: 'Каждая переменная вносит вклад $b_j\Delta x_j$, и вклады складываются.'
  fix: '$\Delta\hat y=\sum b_j\Delta x_j$.'
st.diag.sign:
  t: 'Остаток с обратным знаком'
  bad: 'Остаток считают как $\hat y-y$.'
  why: 'Остаток — отклонение наблюдения от прогноза: $e=y-\hat y$. Положительный остаток означает, что наблюдение выше прямой.'
  fix: '$e=y-\hat y$.'
st.diag.vif:
  t: 'VIF считают неверно или считают безобидным'
  bad: 'Берут $\mathrm{VIF}=1-R_j^2$ или считают мультиколлинеарность улучшением модели.'
  why: '$\mathrm{VIF}=\frac1{1-R_j^2}$ растёт при сильной связи предикторов; тогда оценки коэффициентов неустойчивы.'
  fix: '$\mathrm{VIF}=\dfrac1{1-R_j^2}$; значения около $5$–$10$ тревожны.'
st.diag.outlier:
  t: 'Любой выброс сильно влияет на наклон'
  bad: 'Считают, что точка с большим остатком всегда сильно поворачивает прямую (или что её надо удалить).'
  why: 'Влияние на наклон зависит и от рычага: точка у $\bar x$ сдвигает прямую вверх или вниз, а наклон почти не меняет.'
  fix: 'Оценивай остаток и рычаг вместе; удалять точки без причины нельзя.'
st.anova.df:
  t: 'Степени свободы ANOVA'
  bad: 'Для $k$ групп по $n$ берут $N-1$ вместо $k(n-1)$ внутри групп или $N-1$ вместо $k-1$ между группами.'
  why: 'Между группами $k$ средних дают $k-1$ степеней свободы, внутри групп — $N-k$. Вместе $N-1$.'
  fix: '$df_B=k-1$, $df_W=N-k$.'
st.anova.ss-ms:
  t: '$F$ считают по суммам, а не по средним квадратам'
  bad: 'Берут $F=SSB/SSW$.'
  why: 'Суммы квадратов зависят от числа слагаемых. Их делят на степени свободы: $MS=SS/df$.'
  fix: '$F=\dfrac{SSB/(k-1)}{SSW/(N-k)}$.'
st.anova.which:
  t: 'Значимый $F$ указывает, какие группы различаются'
  bad: 'Из значимого $F$ делают вывод, что различаются все группы или конкретная пара.'
  why: '$F$ проверяет, что не все средние равны. Какая именно пара различается, показывают попарные сравнения с поправкой.'
  fix: 'После значимого $F$ делай попарные сравнения с поправкой на множественность.'
st.logit.odds:
  t: 'Шансы принимают за вероятность'
  bad: 'Шансы $\frac{p}{1-p}$ называют вероятностью или записывают $p$ вместо шансов.'
  why: 'Шансы могут быть больше $1$, вероятность не может. Шансы $3:1$ соответствуют вероятности $0.75$.'
  fix: '$\text{шансы}=\dfrac{p}{1-p}$, $p=\dfrac{\text{шансы}}{1+\text{шансы}}$.'
st.logit.or:
  t: 'Отношение шансов — не прибавка'
  bad: 'Считают, что рост $x$ на $1$ добавляет $\beta_1$ к шансам или умножает на $\beta_1$.'
  why: 'Линейно меняется логарифм шансов, поэтому шансы умножаются на $e^{\beta_1}$.'
  fix: 'Шансы умножаются на $e^{\beta_1}$ за каждую единицу $x$.'
st.logit.linear:
  t: 'Вероятность моделируют линейно'
  bad: 'Предлагают оценивать вероятность прямой $p=\beta_0+\beta_1x$.'
  why: 'Прямая выходит за пределы $[0,1]$. Логит-преобразование оставляет $p$ внутри отрезка.'
  fix: 'Линейная модель — для $\ln\frac{p}{1-p}$.'
st.boot.without:
  t: 'Бутстреп-выборка без возвращения'
  bad: 'Выбирают $n$ значений из $n$ без возвращения.'
  why: 'Без возвращения получается та же выборка в другом порядке: статистика не меняется и разброса нет.'
  fix: 'Бутстреп — выбор с возвращением.'
st.boot.size:
  t: 'Размер бутстреп-выборки'
  bad: 'Берут бутстреп-выборки заметно меньше $n$ «для скорости».'
  why: 'Разброс статистики зависит от $n$. Выборки другого размера оценивают другую задачу.'
  fix: 'Размер бутстреп-выборки равен $n$.'
st.boot.perm:
  t: 'Число перестановок считают как факториал'
  bad: 'Число разбиений на группы размеров $a$ и $b$ считают как $(a+b)!$.'
  why: 'Порядок внутри групп не важен: различных разбиений $\binom{a+b}{a}$.'
  fix: '$\binom{a+b}{a}$ разбиений.'
st.nonpar.rank-sum:
  t: 'Ранги начинают с нуля'
  bad: 'Считают сумму рангов $N$ значений как $\frac{N(N-1)}2$ или берут $R_1$ вместо $U_1$.'
  why: 'Ранги — числа $1,\dots,N$ с суммой $\frac{N(N+1)}2$. $U_1=R_1-\frac{n_1(n_1+1)}2$.'
  fix: 'Ранги начинаются с $1$.'
st.nonpar.ties:
  t: 'Одинаковым значениям дают разные ранги'
  bad: 'Одинаковым значениям присваивают подряд идущие ранги по порядку появления.'
  why: 'Порядок среди равных случаен, и результат не должен от него зависеть.'
  fix: 'Одинаковым значениям — средний из занимаемых рангов.'
st.nonpar.mean:
  t: 'Ранговый критерий сравнивает средние'
  bad: 'Считают, что критерий Манна–Уитни проверяет равенство средних значений.'
  why: 'Он работает с рангами и проверяет, склонна ли одна группа давать большие значения.'
  fix: 'Формулируй вывод о сдвиге распределения, не о среднем.'
st.mult.sum:
  t: 'Вероятность ошибки складывают'
  bad: 'Вероятность хотя бы одной ложной значимости при $m$ проверках считают как $m\alpha$.'
  why: 'Вероятности событий складываются только для несовместных, а здесь события пересекаются: $1-(1-\alpha)^m$.'
  fix: '$P=1-(1-\alpha)^m$; $m\alpha$ — лишь среднее число ложных значимостей.'
st.mult.bonf:
  t: 'Поправка Бонферрони умножает уровень'
  bad: 'Порог для каждой из $m$ проверок берут $m\alpha$.'
  why: 'Порог нужно уменьшить: $\alpha/m$, чтобы суммарная вероятность ошибки не превысила $\alpha$.'
  fix: 'Порог Бонферрони $\alpha/m$.'
st.mult.found:
  t: 'Одна значимая проверка из многих — эффект есть'
  bad: 'Из 20 проверок одну значимую считают доказательством эффекта.'
  why: 'При $\alpha=0.05$ среди 20 верных нулевых гипотез в среднем одна «значима» случайно.'
  fix: 'Применяй поправку или проверяй результат на новых данных.'
st.ab.peek:
  t: 'Подглядывание в результаты'
  bad: 'Тест останавливают, когда $p$ впервые меньше $0.05$.'
