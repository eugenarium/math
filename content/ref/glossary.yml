# Глоссарий: записи для эталонных уроков. Формат: {t: термин, d: определение, s: одной фразой, sym: обозначение, sec: раздел}
partition:
  t: 'Разбиение отрезка'
  d: 'Разбиение отрезка $[a, b]$ — набор точек $a=x_0<x_1<\dots<x_n=b$. Длины частей: $\Delta x_i=x_i-x_{i-1}$. При равномерном разбиении все части равны: $\Delta x=\frac{b-a}{n}$.'
  s: 'Отрезок, разрезанный на $n$ частей'
  sym: '$x_0<x_1<\dots<x_n$, $\Delta x$'
  sec: c1
riemann-sum:
  t: 'Интегральная сумма (сумма Римана)'
  d: 'Интегральная сумма функции $f$ для разбиения отрезка $[a, b]$ с точками $c_i\in[x_{i-1}, x_i]$: $S=\sum_{i=1}^{n} f(c_i)\,\Delta x_i$. Левая сумма: $c_i=x_{i-1}$. Правая: $c_i=x_i$. Сумма средних точек: $c_i=\frac{x_{i-1}+x_i}{2}$.'
  s: 'Сумма площадей столбиков со знаком: высота $f(c_i)$, ширина $\Delta x_i$'
  sym: '$\sum f(c_i)\,\Delta x_i$'
  sec: c1
definite-integral:
  t: 'Определённый интеграл'
  d: 'Определённый интеграл $\int_a^b f(x)\,dx$ — предел интегральных сумм при $\max\Delta x_i\to0$, если этот предел существует и не зависит от разбиений и выбора точек $c_i$. Тогда $f$ называют интегрируемой на $[a, b]$. Функция, непрерывная на отрезке, интегрируема на нём.'
  s: 'Число, к которому стремятся интегральные суммы при измельчении разбиения'
  sym: '$\int_a^b f(x)\,dx$'
  sec: c1

eigenvector:
  t: 'Собственный вектор'
  d: 'Собственный вектор квадратной матрицы $A$ — ненулевой вектор $\mathbf{v}$, для которого $A\mathbf{v}=\lambda\mathbf{v}$ при некотором числе $\lambda$.'
  s: 'Ненулевой вектор, который матрица оставляет на его прямой'
  sym: '$A\mathbf{v}=\lambda\mathbf{v}$, $\mathbf{v}\ne\mathbf{0}$'
  sec: la
eigenvalue:
  t: 'Собственное значение'
  d: 'Собственное значение матрицы $A$ — число $\lambda$, для которого существует ненулевой вектор $\mathbf{v}$ с $A\mathbf{v}=\lambda\mathbf{v}$. Равносильное условие: $\det(A-\lambda I)=0$.'
  s: 'Множитель, на который матрица растягивает собственный вектор'
  sym: '$\lambda$'
  sec: la
char-poly:
  t: 'Характеристический многочлен'
  d: 'Характеристический многочлен матрицы $A$: $p(\lambda)=\det(A-\lambda I)$. Его корни — собственные значения $A$. Для матрицы $2\times2$: $p(\lambda)=\lambda^2-\operatorname{tr}A\cdot\lambda+\det A$.'
  s: 'Многочлен, корни которого — собственные значения'
  sym: '$\det(A-\lambda I)$'
  sec: la

conf-interval:
  t: 'Доверительный интервал'
  d: 'Доверительный интервал уровня $1-\alpha$ для параметра $\theta$ — интервал $(L, U)$, границы которого вычисляются по выборке, такой что $P(L<\theta<U)\ge1-\alpha$ при любом значении $\theta$. Для среднего нормальной совокупности с известной $\sigma$: $\bar{x}\pm z_{1-\alpha/2}\frac{\sigma}{\sqrt{n}}$.'
  s: 'Интервал, построенный по выборке методом, который редко промахивается мимо параметра'
  sym: '$\bar{x}\pm z_{1-\alpha/2}\frac{\sigma}{\sqrt{n}}$'
  sec: st
conf-level:
  t: 'Уровень доверия'
  d: 'Уровень доверия $1-\alpha$ — вероятность того, что процедура построения даст интервал, накрывающий истинное значение параметра. Это свойство процедуры, а не отдельного уже построенного интервала.'
  s: 'Доля интервалов, накрывающих параметр при многократном повторении выборки'
  sym: '$1-\alpha$'
  sec: st
margin-error:
  t: 'Предельная ошибка'
  d: 'Предельная ошибка — полуширина доверительного интервала. Для z-интервала: $E=z_{1-\alpha/2}\cdot\mathrm{SE}$, где $\mathrm{SE}=\frac{\sigma}{\sqrt{n}}$. Интервал: $\bar{x}\pm E$.'
  s: 'Половина ширины интервала'
  sym: '$E$'
  sec: st

diffquot:
  t: 'Разностное отношение'
  d: 'Разностное отношение функции $f$ в точке $x_0$ с приращением $h\ne0$ — число $\frac{f(x_0+h)-f(x_0)}{h}$. Это наклон секущей, проходящей через точки графика с абсциссами $x_0$ и $x_0+h$, и средняя скорость изменения $f$ на отрезке между ними.'
  s: 'Наклон секущей через две точки графика'
  sym: '$\frac{f(x_0+h)-f(x_0)}{h}$'
  sec: c1
derivative:
  t: 'Производная'
  d: 'Производная функции $f$ в точке $x_0$ — предел разностного отношения при $h\to0$, если он существует: $f''(x_0)=\lim_{h\to0}\frac{f(x_0+h)-f(x_0)}{h}$. Геометрически это наклон касательной к графику в точке $x_0$.'
  s: 'Наклон касательной: предел наклонов секущих'
  sym: '$f''(x_0)$, $\frac{df}{dx}$'
  sec: c1
